# Literature reproduction benchmark -- lightweight task specs.
#
# 93 papers across 12 categories (A-L).
# Each entry: ONE reproducible calculation per paper.
# HumanSimulator generates the prompt; mat_master decides how to execute.
#
# difficulty: 1=minimal prompt, 2=guided, 3=detailed hints
# tolerance: absolute unless noted; based on inter-code variability

