version: "v5"
capability: "property_prediction"
domain: "mech"

questions:
  # ============================================================
  # DF_mech_001 ← L1_Q08 (E-V数据BM状态方程拟合)
  # ============================================================
  - id: "DF_mech_001"
    capability: "property_prediction"
    domain: "mech"
    intent: "Fit equation of state from provided E-V data and report V0 and B0."
    human_prompt_seed: "使用 `ev_curve.json` 中的 E-V 数据拟合 Birch-Murnaghan 状态方程，输出 V0(A3) 与 B0(GPa)。"
    tags: ["eos_fit", "numeric_postprocess", "bulk_modulus"]
    mode_scope: ["direct", "planner"]
    required_tools: []
    optional_tools: []
    data_files:
      - key: "ev_table"
        path: "data/L1_Q05/ev_curve.json"
        oss_url: ""
        description: "Energy-volume data points for EOS fitting."
    reference_answers:
      - key: "v0_A3"
        value: 162.0
        tolerance: 2.0
      - key: "b0_GPa"
        value: 92.0
        tolerance: 12.0
      - key: "required_fields"
        value: ["v0", "b0", "fit_quality"]
    scoring_checklist:
      # --- correctness ---
      - id: "v0_A3"
        criterion: "V0 is within tolerance."
        axis: "correctness"
        verify: "numerical_range"
      - id: "b0_GPa"
        criterion: "B0 is within tolerance."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Reports V0, B0, and some measure of fit quality (R-squared, residuals, or similar)."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "EOS fitting uses the data from ev_curve.json; fit parameters are derived from the provided E-V points, not hallucinated."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "efficiency_judge"
        criterion: "EOS fitting is accomplished in a single fitting step without redundant re-runs or parameter sweeps."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # DF_mech_002 ← L1_Q09 (MSST Hugoniot C-J点确定)
  # ============================================================
  - id: "DF_mech_002"
    capability: "property_prediction"
    domain: "mech"
    intent: "From MSST Hugoniot simulation data, fit the P-V Hugoniot curve and determine C-J detonation velocity and pressure for RDX."
    human_prompt_seed: >
      读取 `msst_hugoniot.json`，其中包含 RDX 在不同冲击波速度下的 MSST 模拟数据
      （压力、比容、温度、是否反应）。筛选完全反应的数据点，拟合 P-V Hugoniot 曲线，
      通过 Rayleigh 线切线法确定 Chapman-Jouguet (C-J) 点，输出 C-J 爆速 (m/s) 和爆压 (GPa)。
    tags: ["hugoniot_fit", "detonation", "cj_point", "energetic_materials"]
    mode_scope: ["direct", "planner"]
    required_tools: []
    optional_tools: []
    data_files:
      - key: "msst_data"
        path: "data/L1_Q09/msst_hugoniot.json"
        oss_url: ""
        description: "MSST simulation data at multiple shock velocities for RDX."
    reference_answers:
      - key: "cj_velocity_m_s"
        value: 8750.0
        tolerance: 300.0
      - key: "cj_pressure_GPa"
        value: 34.0
        tolerance: 5.0
      - key: "required_fields"
        value: ["cj_velocity", "cj_pressure", "hugoniot_fit", "rayleigh_line"]
    scoring_checklist:
      # --- correctness ---
      - id: "cj_velocity_m_s"
        criterion: "C-J detonation velocity is within tolerance."
        axis: "correctness"
        verify: "numerical_range"
      - id: "cj_pressure_GPa"
        criterion: "C-J detonation pressure is within tolerance."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Includes Hugoniot curve fitting details, Rayleigh line analysis, and C-J velocity/pressure values."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "C-J parameters are derived from the provided msst_hugoniot.json data, with filtered reaction-complete points shown."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "efficiency_judge"
        criterion: "Hugoniot fitting and C-J determination are performed in a direct computation pipeline without unnecessary retries."
        axis: "efficiency"
        verify: "llm_binary_judge"
