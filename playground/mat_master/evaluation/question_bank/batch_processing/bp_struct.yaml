version: "v5"
capability: "batch_processing"
domain: "struct"

questions:
  # ============================================================
  # BP_struct_001 ← L1_Q01 (批量无序结构有序构型枚举)
  # ============================================================
  - id: "BP_struct_001"
    capability: "batch_processing"
    domain: "struct"
    intent: "Resolve partial occupancy for 10 disordered crystal structures, enumerating symmetry-inequivalent ordered configurations for each."
    human_prompt_seed: >
      读取 `disorder_manifest.json`，其中列出了 10 个含无序占位的晶体结构参数。
      对每个结构，使用工具生成有序构型（枚举对称不等价的占位排列），
      输出每个结构的有序构型数量和对应的 CIF 文件。
    tags: ["batch_operation", "disorder_resolution", "structure_enumeration"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_generate_ordered_replicas"]
    optional_tools: []
    data_files:
      - key: "disorder_manifest"
        path: "data/L1_Q01/disorder_manifest.json"
        oss_url: ""
        description: "JSON manifest listing 10 disordered crystal structures with partial occupancies."
    reference_answers:
      - key: "structures_processed"
        value: 10
        tolerance: 0.0
      - key: "required_fields"
        value: ["ordered_configurations_count", "output_files", "space_group_per_config"]
      - key: "used_ordered_replica_tool"
        value: "mat_sg_generate_ordered_replicas"
    scoring_checklist:
      # --- correctness ---
      - id: "structures_processed"
        criterion: "All 10 structures are processed."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Each result includes ordered configuration count, output CIF files, and space group information."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_ordered_replica_tool"
        criterion: "Used the MCP ordered replica generation tool (mat_sg_generate_ordered_replicas)."
        axis: "grounding"
        verify: "tool_called"
      - id: "grounding_source"
        criterion: "Structure enumeration is performed using the registered MCP structure-generation tool rather than a self-written script."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries_batch"
        criterion: "No repeated identical tool calls for the same structure (no retry loops)."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "The agent completes 10-structure batch processing in a reasonable number of steps without unnecessary exploration."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # BP_struct_002 ← L1_Q02 (批量Fe-Ni INVAR合金超胞构建)
  # ============================================================
  - id: "BP_struct_002"
    capability: "batch_processing"
    domain: "struct"
    intent: "Construct 10 random FCC supercells for Fe-Ni INVAR alloy compositions with specified stoichiometry."
    human_prompt_seed: >
      读取 `invar_compositions.json`，其中列出了 10 种 Fe-Ni INVAR 合金组分。
      对每个组分，构造 3x3x3 FCC 超胞（108 原子），以随机方式将 Fe/Ni 填入格点，
      使实际组分与目标一致。输出每个超胞的 POSCAR 文件，并报告实际 Fe/Ni 原子数和使用的随机种子。
    tags: ["batch_operation", "alloy_supercell", "random_occupation"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_bulk_structure_by_template"]
    optional_tools: []
    data_files:
      - key: "invar_compositions"
        path: "data/L1_Q02/invar_compositions.json"
        oss_url: ""
        description: "JSON manifest of 10 Fe-Ni INVAR alloy compositions for supercell construction."
    reference_answers:
      - key: "supercells_built"
        value: 10
        tolerance: 0.0
      - key: "atoms_per_supercell"
        value: 108
        tolerance: 0.0
      - key: "required_fields"
        value: ["poscar_file", "fe_count", "ni_count", "random_seed"]
      - key: "source_type_structure"
        value: "structure_generation"
    scoring_checklist:
      # --- correctness ---
      - id: "supercells_built"
        criterion: "All 10 supercells are constructed."
        axis: "correctness"
        verify: "numerical_range"
      - id: "atoms_per_supercell"
        criterion: "Each supercell contains exactly 108 atoms."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes POSCAR file, Fe/Ni atom counts, and random seed per composition."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "Supercell structures are built using an MCP structure tool or a verifiable script that reads composition from the provided manifest."
        axis: "grounding"
        verify: "llm_binary_judge"
      - id: "source_type_structure"
        criterion: "At least one tool call has source_type = structure_generation."
        axis: "grounding"
        verify: "source_type_used"
      # --- efficiency ---
      - id: "no_retries_batch"
        criterion: "No repeated identical tool calls for the same composition."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "10-supercell construction completes without redundant intermediate steps."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # BP_struct_003 ← L1_Q03 (批量宿主-掺杂超胞构建)
  # ============================================================
  - id: "BP_struct_003"
    capability: "batch_processing"
    domain: "struct"
    intent: "Construct doped supercells for 10 host-dopant pairs using structure tools."
    human_prompt_seed: >
      读取 `batch_doping_manifest.json`，其中列出了 10 对宿主-掺杂体系。
      对每个体系，先构建指定大小的超胞，再按给定比例随机替换宿主原子为掺杂原子。
      输出每个掺杂超胞的结构文件，报告实际掺杂原子数和实际掺杂比例。
    tags: ["batch_operation", "doping", "supercell_construction"]
    mode_scope: ["direct", "planner"]
    required_tools:
      - "mat_struct_db_fetch_structures_from_db"
      - "mat_sg_build_bulk_structure_by_template"
      - "mat_sg_build_bulk_structure_by_wyckoff"
    optional_tools: []
    data_files:
      - key: "batch_doping_manifest"
        path: "data/L1_Q03/batch_doping_manifest.json"
        oss_url: ""
        description: "JSON manifest of 10 host-dopant pairs with target doping fractions."
    reference_answers:
      - key: "structures_doped"
        value: 10
        tolerance: 0.0
      - key: "required_fields"
        value: ["doped_structure_file", "actual_dopant_count", "actual_fraction"]
      - key: "used_db_fetch"
        value:
          - "mat_struct_db_fetch_structures_from_db"
          - "mat_sg_build_bulk_structure_by_template"
          - "mat_sg_build_bulk_structure_by_wyckoff"
    scoring_checklist:
      # --- correctness ---
      - id: "structures_doped"
        criterion: "All 10 doped structures are generated."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Each output includes doped structure file, actual dopant count, and actual doping fraction."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_db_fetch"
        criterion: "Used the structure database (mat_struct_db_fetch_structures_from_db) or MCP builder to fetch host structures."
        axis: "grounding"
        verify: "tool_called"
      - id: "grounding_source"
        criterion: "Host structures originate from a registered structure database or generator, not from LLM-fabricated coordinates."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries_batch"
        criterion: "No repeated identical tool calls for the same host-dopant pair."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "The doping workflow is completed without unnecessary re-fetching or re-building of previously constructed structures."
        axis: "efficiency"
        verify: "llm_binary_judge"
