version: "v5"
capability: "structure_construction"
domain: "struct"

questions:
  # ============================================================
  # SC_struct_001 (graphene/h-BN异质结)
  # ============================================================
  - id: "SC_struct_001"
    capability: "structure_construction"
    domain: "struct"
    intent: "Build a graphene/h-BN vertical van der Waals heterostructure with controlled lattice mismatch."
    human_prompt_seed: >
      读取 `hetero_spec.json`，构建 graphene/h-BN 垂直范德华异质结。
      要求：(1) 构建共度超胞使晶格失配 < 2%；(2) AB 堆叠，层间距 3.35 A；
      (3) z 方向加 15 A 真空层。输出 POSCAR 和 CIF，报告实际失配度和总原子数。
    tags: ["heterostructure", "vdw", "graphene", "hBN", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_interface"]
    optional_tools: []
    data_files:
      - key: "hetero_spec"
        path: "data/SC_struct_001/hetero_spec.json"
        oss_url: ""
        description: "Specification for graphene/h-BN heterostructure construction."
    reference_answers:
      - key: "mismatch_percent"
        value: 1.6
        tolerance: 1.0
      - key: "required_fields"
        value: ["structure_file", "lattice_mismatch", "total_atoms", "interlayer_distance"]
      - key: "used_interface_builder"
        value: "mat_sg_build_surface_interface"
    scoring_checklist:
      # --- correctness ---
      - id: "mismatch_percent"
        criterion: "Lattice mismatch is below 2%."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file (POSCAR/CIF), lattice mismatch percentage, total atom count, and interlayer distance."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_interface_builder"
        criterion: "Used the MCP surface interface builder tool (mat_sg_build_surface_interface) for heterostructure construction."
        axis: "grounding"
        verify: "tool_called"
      - id: "grounding_source"
        criterion: "Heterostructure is assembled using the registered MCP interface builder, not constructed by writing raw coordinates."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Interface builder is called without excessive retries for the same parameter set."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Heterostructure construction completes in a direct workflow without redundant structure rebuilds."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_002 (Cu(111)表面slab)
  # ============================================================
  - id: "SC_struct_002"
    capability: "structure_construction"
    domain: "struct"
    intent: "Cut a Cu(111) surface slab from bulk FCC copper with vacuum and fixed bottom layers."
    human_prompt_seed: >
      读取 `surface_spec.json`，从 FCC Cu 体相切出 (111) 表面 slab。
      要求：4 层原子层，底部 2 层固定，3x3 横向超胞，15 A 真空层。
      输出 POSCAR，报告总原子数和表面面积。
    tags: ["surface_slab", "Cu111", "vacuum", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files:
      - key: "surface_spec"
        path: "data/SC_struct_002/surface_spec.json"
        oss_url: ""
        description: "Specification for Cu(111) surface slab construction."
    reference_answers:
      - key: "total_atoms"
        value: 36
        tolerance: 0.0
      - key: "required_fields"
        value: ["structure_file", "total_atoms", "surface_area", "fixed_layers"]
      - key: "used_slab_builder"
        value: "mat_sg_build_surface_slab"
      - key: "correct_miller"
        value: [1, 1, 1]
        tool_name: "mat_sg_build_surface_slab"
        tool_arg: "miller_index"
    scoring_checklist:
      # --- correctness ---
      - id: "total_atoms"
        criterion: "Total atom count is correct (36 for 4-layer 3x3 FCC(111))."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file, total atom count, surface area, and which layers are fixed."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_slab_builder"
        criterion: "Used the MCP surface slab builder tool (mat_sg_build_surface_slab)."
        axis: "grounding"
        verify: "tool_called"
      - id: "correct_miller"
        criterion: "Slab built with correct (111) Miller index passed to mat_sg_build_surface_slab."
        axis: "grounding"
        verify: "tool_args_match"
      - id: "grounding_source"
        criterion: "Cu(111) slab is constructed via the registered MCP slab builder with the exact Miller index from surface_spec.json."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Slab builder is not called repeatedly with wrong parameters."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Cu(111) slab construction completes without excessive exploratory calls."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_003 (Si(100)氢钝化)
  # ============================================================
  - id: "SC_struct_003"
    capability: "structure_construction"
    domain: "struct"
    intent: "Passivate dangling bonds on Si(100) surface slab bottom with hydrogen atoms."
    human_prompt_seed: >
      读取 `hydrogen_cap_spec.json`，对 Si(100) slab 底部的悬挂键进行氢饱和。
      要求：识别底部欠配位 Si 原子，添加 H 使其达到四配位。
      Si-H 键长约 1.48 A。输出 POSCAR 并报告添加的 H 原子数。
    tags: ["hydrogen_passivation", "Si100", "dangling_bond", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files:
      - key: "hydrogen_cap_spec"
        path: "data/SC_struct_003/hydrogen_cap_spec.json"
        oss_url: ""
        description: "Specification for Si(100) surface hydrogen passivation."
    reference_answers:
      - key: "used_slab_builder"
        value: "mat_sg_build_surface_slab"
      - key: "correct_miller"
        value: [1, 0, 0]
        tool_name: "mat_sg_build_surface_slab"
        tool_arg: "miller_index"
      - key: "passivation_quality"
        value: "H atoms added to satisfy 4-coordination on bottom Si atoms"
    scoring_checklist:
      # --- correctness ---
      - id: "passivation_quality"
        criterion: "Bottom Si atoms passivated with H to achieve 4-coordination, with Si-H bond length ~1.48 A."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_slab_builder"
        criterion: "Used MCP surface slab builder tool (mat_sg_build_surface_slab) to construct Si(100) slab."
        axis: "grounding"
        verify: "tool_called"
      - id: "correct_miller"
        criterion: "Slab built with correct (100) Miller index passed to mat_sg_build_surface_slab."
        axis: "grounding"
        verify: "tool_args_match"
      - id: "grounding_source"
        criterion: "Si(100) slab is built via MCP tool; H passivation is applied to the MCP-generated structure."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Slab builder and passivation are called without repeated identical attempts."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Passivation workflow completes in a direct pipeline without unnecessary intermediate structure rebuilds."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_004 (MoS₂单层剥离)
  # ============================================================
  - id: "SC_struct_004"
    capability: "structure_construction"
    domain: "struct"
    intent: "Exfoliate a MoS2 monolayer from bulk 2H-MoS2 and verify the 2D structure."
    human_prompt_seed: >
      读取 `twod_spec.json`，从体相 2H-MoS2 中剥离单层 MoS2。
      添加 20 A z 方向真空层，验证化学计量比为 MoS2，层厚约 3.1 A。
      输出 POSCAR。
    tags: ["2d_material", "exfoliation", "MoS2", "monolayer"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files:
      - key: "twod_spec"
        path: "data/SC_struct_004/twod_spec.json"
        oss_url: ""
        description: "Specification for MoS2 monolayer exfoliation."
    reference_answers:
      - key: "required_fields"
        value: ["structure_file", "stoichiometry_verified", "layer_thickness_A", "vacuum_A"]
      - key: "used_slab_builder"
        value: "mat_sg_build_surface_slab"
      - key: "correct_vacuum"
        value: 20
        tolerance: 2.0
        tool_name: "mat_sg_build_surface_slab"
        tool_arg: "vacuum"
    scoring_checklist:
      # --- correctness ---
      - id: "required_fields"
        criterion: "Monolayer POSCAR output with verified MoS2 stoichiometry, reported layer thickness (~3.1 A), and vacuum layer (~20 A)."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_slab_builder"
        criterion: "Used MCP surface slab builder (mat_sg_build_surface_slab) for monolayer exfoliation."
        axis: "grounding"
        verify: "tool_called"
      - id: "correct_vacuum"
        criterion: "Vacuum layer set to ~20 A in slab builder call."
        axis: "grounding"
        verify: "tool_args_match"
      - id: "grounding_source"
        criterion: "MoS2 monolayer is obtained via the MCP slab builder, not hand-crafted coordinates."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Slab builder is not called repeatedly with the same vacuum parameter."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Monolayer exfoliation and stoichiometry verification complete in a direct workflow."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_005 (无序结构有序化与化学式识别)
  # ============================================================
  - id: "SC_struct_005"
    capability: "structure_construction"
    domain: "struct"
    intent: "Infer SG-derived chemical formulas for 5 disordered crystal structures and construct ordered replicas to assess 3D structure perception."
    human_prompt_seed: |
      对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：
      - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`
      - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`
      - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`
      - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`
      - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`

      对每个结构，使用结构生成工具构造 ordered replica，并汇总：
      (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；
      (2) `is_disordered`；
      (3) `ordered_replica_count`；
      (4) `ordered_output_archive`。

      最终答案按文件名逐项列出上述信息。
    tags: ["structure_construction", "disorder_resolution", "3d_structure_perception", "formula_identification"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_generate_ordered_replicas"]
    optional_tools: []
    reference_answers:
      - key: "structures_processed"
        value: 5
        tolerance: 0.0
      - key: "reference_formulas"
        value:
          - "K1H13.9872C5.9904N5.0064O9"
          - "H144C48N24Cl24O96"
          - "H288C80N48Cl48O192"
          - "Ag8H112C40N16Cl24O96"
          - "Fe2H40C24N16O2"
      - key: "required_fields"
        value: ["chemical_formula", "is_disordered", "ordered_replica_count", "ordered_output_archive"]
      - key: "used_ordered_replica_tool"
        value: "mat_sg_generate_ordered_replicas"
      - key: "structure_construction_event"
        value: "structure_construction"
      - key: "scientific_library_source"
        value: "scientific_library"
      - key: "tool_call_budget"
        value:
          min: 5
          max: 20
      - key: "token_budget_total"
        value:
          max: 35000
    scoring_checklist:
      # --- correctness ---
      - id: "structures_processed"
        criterion: "All 5 disordered structures are processed."
        axis: "correctness"
        verify: "numerical_range"
      - id: "reference_formulas"
        criterion: "The final answer includes the SG-derived chemical formula string for each of the 5 structures."
        axis: "correctness"
        verify: "contains_all"
      - id: "required_fields"
        criterion: "Each filename is paired with chemical_formula, is_disordered, ordered_replica_count, and ordered_output_archive."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "used_ordered_replica_tool"
        criterion: "Used the MCP ordered replica generation tool (mat_sg_generate_ordered_replicas)."
        axis: "grounding"
        verify: "tool_called"
      - id: "structure_construction_event"
        criterion: "The workflow includes a successful structure_construction event."
        axis: "grounding"
        verify: "event_type_called"
      - id: "scientific_library_source"
        criterion: "At least one successful structure operation comes from source_type scientific_library."
        axis: "grounding"
        verify: "source_type_used"
      - id: "grounding_source"
        criterion: "Ordered structures are produced with the registered structure-generation tool rather than fabricated 3D coordinates."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries_disorder"
        criterion: "No repeated identical tool calls are made for the same structure."
        axis: "efficiency"
        verify: "no_retries"
      - id: "tool_call_budget"
        criterion: "The whole 5-structure workflow stays within a modest tool-call budget."
        axis: "efficiency"
        verify: "call_count_range"
      - id: "token_budget_total"
        criterion: "The run stays within a moderate total token budget."
        axis: "efficiency"
        verify: "token_budget"
      - id: "efficiency_judge"
        criterion: "The agent handles the 5 structures one by one with minimal detours and without exploratory over-processing."
        axis: "efficiency"
        verify: "llm_binary_judge"
