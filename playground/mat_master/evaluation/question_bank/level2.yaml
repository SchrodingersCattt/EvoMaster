  # ============================================================
  # Q08: Batch failure recovery - self-directed
  # ============================================================

  - id: "L2_Q08"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Given descriptions of mixed failed-job scenarios, classify failure modes and provide parameterized retry strategy."
    human_prompt_seed: >
      假设你提交了一批 20 个 DFT 计算任务，其中 6 个失败了，失败原因如下：
      Job 3, 7: SCF 不收敛（含过渡金属，ISPIN=1）；
      Job 11: 内存不足（NCORE 设置不当）；
      Job 15, 18: KPOINTS 太密导致超时；
      Job 20: 输入文件 POTCAR 缺失。
      请分类这些失败模式（至少 3 类），为每类给出参数化的重试方案和终止条件。
    tags: ["failure_recovery", "batch_jobs", "retry_strategy"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "failure_classes_count"
        value: 3
        tolerance: 1.0
      - key: "required_fields"
        value: ["classification_table", "retry_parameters", "fallback_rule", "stop_condition"]
    scoring_checklist:
      # --- accuracy ---
      - id: "failure_classes_count"
        criterion: "Identifies expected number of failure classes (≥ 3)."
        weight: 0.30
        verify: "numerical_range"
        dimension: "accuracy"
      - id: "required_fields"
        criterion: "Report includes failure classification table, per-class retry parameters, fallback rule, and stop condition."
        weight: 0.70
        verify: "llm_judge"
        dimension: "accuracy"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "Each failure class is grounded in the specific job descriptions provided in the prompt (Job IDs, error types); no generic advice without tracing to the prompt."
        weight: 1.00
        verify: "llm_judge_grounding"
        dimension: "grounding"
      # --- efficiency ---
      - id: "efficiency_judge"
        criterion: "Failure classification and retry policy are produced without unnecessary tool calls beyond reading the provided failure descriptions."
        weight: 1.00
        verify: "llm_judge_efficiency"
        dimension: "efficiency"
    touchpoints:
      full: ["Failure taxonomy and retry policy are complete."]
      partial: ["Taxonomy present but retry policy under-specified."]
      fail: ["No executable retry policy."]
