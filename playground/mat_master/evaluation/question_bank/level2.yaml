      查找或计算密度 (1.806 g/cm3) 和生成焓 (+70 kJ/mol)，
      使用 Kamlet-Jacobs 经验公式计算爆速 D (m/s) 和爆压 P (GPa)。
      输出完整的计算过程和单位换算。
