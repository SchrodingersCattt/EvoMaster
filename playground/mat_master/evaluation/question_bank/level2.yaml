      然后沿高对称 k 路径 (G-X-L-G) 计算能带，判断带隙类型（直接/间接）并输出带隙值 (eV)。
      注意 DFT 带隙与实验值的偏差，给出不确定性说明。
    tags: ["band_structure", "si", "workflow", "kpath"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "used_band_calc"
        value: "execute_bash"
      - key: "gap_type"
        value: "indirect"
      - key: "gap_value_eV"
        value: 0.65
        tolerance: 0.25
      - key: "required_fields"
        value: ["kpath", "gap_type", "gap_value", "uncertainty_note"]
    scoring_checklist:
      # --- accuracy ---
      - id: "gap_type"
        criterion: "Band-gap type is correctly identified as indirect (not direct)."
        weight: 0.30
        verify: "llm_judge"
        dimension: "accuracy"
      - id: "gap_value_eV"
