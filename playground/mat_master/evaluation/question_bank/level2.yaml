  # ============================================================
  # Q04: Vacancy formation energy - no bundle, self-directed
  # ============================================================

  - id: "L2_Q04"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Calculate vacancy formation energy: build perfect and defective supercells, compute energies, derive formation energy."
    human_prompt_seed: >
      计算 MgO 中 O 空位的形成能：从数据库获取 MgO 岩盐结构，
      构建 2x2x2 超胞作为 perfect cell，再在超胞中移除一个 O 原子构建 defective cell，
      分别优化两个结构，按 E_f = E_defective - E_perfect + mu_O 计算空位形成能。
      输出形成能 (eV) 和计算表达式。
    tags: ["defect", "formation_energy", "supercell", "MgO"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "used_defect_builder"
        value: "mat_sg_make_defect_structure"
      - key: "used_dpa_optimizer"
        value: "mat_dpa_submit_optimize_structure"
      - key: "formation_energy_eV"
        value: 7.5
        tolerance: 1.5
      - key: "required_fields"
        value: ["E_defective", "E_perfect", "chemical_potential", "formation_energy"]
    scoring_checklist:
      # --- accuracy ---
      - id: "formation_energy_eV"
        criterion: "Vacancy formation energy is in tolerance."
        weight: 0.35
        verify: "numerical_range"
        dimension: "accuracy"
      - id: "required_fields"
        criterion: "Report includes defective/perfect cell energies, chemical potential definition, and formation energy formula."
        weight: 0.45
        verify: "llm_judge"
        dimension: "accuracy"
      # --- grounding ---
      - id: "used_defect_builder"
        criterion: "Used MCP defect structure builder (mat_sg_make_defect_structure) to create O vacancy supercell."
        weight: 0.35
        verify: "tool_called"
        dimension: "grounding"
      - id: "used_dpa_optimizer"
        criterion: "Used DPA optimizer (mat_dpa_submit_optimize_structure) for perfect and defective cell relaxation."
        weight: 0.35
        verify: "tool_called"
        dimension: "grounding"
      - id: "grounding_source"
        criterion: "Formation energy is computed from MCP-calculated total energies; chemical potential is explicitly defined."
        weight: 0.30
        verify: "llm_judge_grounding"
        dimension: "grounding"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Defect builder and optimizer are not called with repeated identical parameters."
        weight: 0.50
