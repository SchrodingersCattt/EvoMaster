# DEPRECATED: v4 format, kept for backward compat. Use v5 files in subdirectories.
version: "v2"
level: "L2"
rubric:
  id: "R_L2_001"
  level: "L2"
  score_bands: [0.0, 1.0, 3.0, 5.0]
  pass_threshold: 3.0
  description: "Closed-world workflow completion with explicit numeric targets. Agent must independently plan and execute workflows."
  criteria:
    "5.0": "Workflow is complete, numerically valid, and failure handling is explicit."
    "3.0": "Main chain works but misses one critical control/check."
    "1.0": "Only partial template without executable closure."
    "0.0": "Non-runnable or physically inconsistent workflow."
  # v4 three-dimensional weights
  grounding_weight: 0.5
  efficiency_weight: 0.5
  analysis_weights:
    accuracy: 0.5
    grounding: 0.25
    efficiency: 0.25

questions:
  # ============================================================
  # Q01: Al EOS - agent searches database independently
  # ============================================================

  - id: "L2_Q01"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Independently locate Al FCC structure, execute 5-point volume scan, fit EOS, report a0 and B0."
    human_prompt_seed: >
      对 FCC 铝进行状态方程拟合：从数据库获取 Al FCC 原胞结构，
      在平衡体积附近做 5 点体积扫描（0.95, 0.975, 1.0, 1.025, 1.05 倍），
      对每个体积点做单点能计算，拟合 Birch-Murnaghan EOS，
      输出平衡晶格常数 a0 (A) 和体模量 B0 (GPa)。
    tags: ["workflow_closure", "eos", "aluminum", "database_search"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "used_db_fetch"
        value:
          - "mat_struct_db_fetch_structures_from_db"
          - "mat_sg_build_bulk_structure_by_template"
          - "mat_sg_build_bulk_structure_by_wyckoff"
      - key: "used_dpa_optimizer"
        value:
          - "mat_dpa_submit_optimize_structure"
      - key: "a0_A"
        value: 4.04
        tolerance: 0.08
      - key: "b0_GPa"
        value: 79.0
        tolerance: 8.0
      - key: "required_fields"
        value: ["volume_points", "fit_model", "a0", "b0", "failure_handling"]
    scoring_checklist:
      # --- accuracy ---
      - id: "a0_A"
        criterion: "Equilibrium lattice constant is in range."
        weight: 0.25
        verify: "numerical_range"
        dimension: "accuracy"
      - id: "b0_GPa"
        criterion: "Bulk modulus is in range."
        weight: 0.25
        verify: "numerical_range"
        dimension: "accuracy"
      - id: "required_fields"
        criterion: "Report includes volume scan points, fit model identification, a0 and b0 values, and any failure handling notes."
        weight: 0.30
        verify: "llm_judge"
        dimension: "accuracy"
      # --- grounding ---
      - id: "used_db_fetch"
        criterion: "Used structure database or builder tool to obtain Al FCC structure (not LLM-fabricated coordinates)."
        weight: 0.40
        verify: "tool_called"
        dimension: "grounding"
      - id: "used_dpa_optimizer"
        criterion: "Used DPA optimizer for volume-scan single-point calculations."
        weight: 0.30
        verify: "tool_called"
        dimension: "grounding"
      - id: "grounding_source"
        criterion: "Al structure originates from registered database; energy values come from MCP calculation tool, not from LLM estimation."
        weight: 0.30
        verify: "llm_judge_grounding"
        dimension: "grounding"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "No repeated identical database fetch or optimizer calls for the same volume point."
        weight: 0.40
        verify: "no_retries"
        dimension: "efficiency"
      - id: "call_count_range"
        criterion: "Total MCP tool calls are in a reasonable range for a 5-point EOS workflow (e.g. 1 fetch + 5 calc + 1 fit)."
        weight: 0.30
        verify: "call_count_range"
        dimension: "efficiency"
      - id: "efficiency_judge"
        criterion: "EOS workflow is completed without unnecessary exploration or redundant intermediate steps."
        weight: 0.30
        verify: "llm_judge_efficiency"
        dimension: "efficiency"
    touchpoints:
      full: ["End-to-end EOS workflow: database fetch -> volume scan -> fit -> report."]
      partial: ["EOS present but one target metric missing."]
      fail: ["No EOS closure."]

  # ============================================================
  # Q02: Replace elastic tensor with surface energy calculation
  # ============================================================

  - id: "L2_Q02"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Calculate surface energy of MgO(100) by constructing slab models and comparing with bulk."
    human_prompt_seed: >
      计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构，
      先优化体相并获取单原子能量，然后切出 (100) 表面 slab（至少 5 层），
      加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。
      输出表面能 (J/m2) 和计算过程中的关键能量值。
    tags: ["surface_energy", "MgO", "slab_calculation", "workflow"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "used_slab_builder"
        value: "mat_sg_build_surface_slab"
      - key: "used_dpa_optimizer"
        value: "mat_dpa_submit_optimize_structure"
      - key: "surface_energy_J_m2"
        value: 1.25
        tolerance: 0.35
      - key: "required_fields"
        value: ["E_bulk_per_atom", "E_slab", "surface_area", "surface_energy", "convergence_check"]
    scoring_checklist:
      # --- accuracy ---
      - id: "surface_energy_J_m2"
        criterion: "Surface energy is in expected range."
        weight: 0.35
        verify: "numerical_range"
        dimension: "accuracy"
      - id: "required_fields"
        criterion: "Report includes bulk energy per atom, slab total energy, surface area, computed surface energy, and convergence check."
        weight: 0.45
        verify: "llm_judge"
        dimension: "accuracy"
      # --- grounding ---
      - id: "used_slab_builder"
        criterion: "Used MCP slab builder (mat_sg_build_surface_slab) for MgO(100) surface construction."
        weight: 0.35
        verify: "tool_called"
        dimension: "grounding"
      - id: "used_dpa_optimizer"
        criterion: "Used DPA optimizer (mat_dpa_submit_optimize_structure) for bulk and slab relaxation."
        weight: 0.35
        verify: "tool_called"
        dimension: "grounding"
      - id: "grounding_source"
        criterion: "Surface energy is computed from MCP-calculated energies; formula inputs are explicitly traced to tool outputs."
        weight: 0.30
        verify: "llm_judge_grounding"
        dimension: "grounding"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Slab builder and optimizer are not called repeatedly with identical parameters."
        weight: 0.50
        verify: "no_retries"
        dimension: "efficiency"
      - id: "efficiency_judge"
        criterion: "Surface energy workflow (bulk opt → slab build → slab opt → formula) is executed in a linear pipeline."
        weight: 0.50
        verify: "llm_judge_efficiency"
        dimension: "efficiency"
    touchpoints:
      full: ["Complete workflow with bulk reference, slab construction, and surface energy."]
      partial: ["Surface energy reported but bulk reference unclear."]
      fail: ["No surface energy calculation."]

  # ============================================================
