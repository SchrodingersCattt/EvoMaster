version: "v2"
level: "L2"
rubric:
  id: "R_L2_001"
  level: "L2"
  score_bands: [0.0, 1.0, 3.0, 5.0]
  pass_threshold: 3.0
  description: "Closed-world workflow completion with explicit numeric targets. Agent must independently plan and execute workflows."
  criteria:
    "5.0": "Workflow is complete, numerically valid, and failure handling is explicit."
    "3.0": "Main chain works but misses one critical control/check."
    "1.0": "Only partial template without executable closure."
    "0.0": "Non-runnable or physically inconsistent workflow."

questions:
  # ============================================================
  # Q01: Al EOS - agent searches database independently
  # ============================================================

  - id: "L2_Q01"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Independently locate Al FCC structure, execute 5-point volume scan, fit EOS, report a0 and B0."
    human_prompt_seed: >
      对 FCC 铝进行状态方程拟合：从数据库获取 Al FCC 原胞结构，
      在平衡体积附近做 5 点体积扫描（0.95, 0.975, 1.0, 1.025, 1.05 倍），
      对每个体积点做单点能计算，拟合 Birch-Murnaghan EOS，
      输出平衡晶格常数 a0 (A) 和体模量 B0 (GPa)。
    tags: ["workflow_closure", "eos", "aluminum", "database_search"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "a0_A"
        value: 4.04
        tolerance: 0.08
      - key: "b0_GPa"
        value: 79.0
        tolerance: 8.0
      - key: "required_fields"
        value: ["volume_points", "fit_model", "a0", "b0", "failure_handling"]
    scoring_checklist:
      - id: "a0_A"
        criterion: "Equilibrium lattice constant is in range."
        weight: 0.30
        verify: "numerical_range"
      - id: "b0_GPa"
        criterion: "Bulk modulus is in range."
        weight: 0.30
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Workflow report includes all mandatory stages."
        weight: 0.40
        verify: "contains_all"
    touchpoints:
      full: ["End-to-end EOS workflow: database fetch -> volume scan -> fit -> report."]
      partial: ["EOS present but one target metric missing."]
      fail: ["No EOS closure."]

  # ============================================================
  # Q02: Replace elastic tensor with surface energy calculation
  # ============================================================

  - id: "L2_Q02"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Calculate surface energy of MgO(100) by constructing slab models and comparing with bulk."
    human_prompt_seed: >
      计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构，
      先优化体相并获取单原子能量，然后切出 (100) 表面 slab（至少 5 层），
      加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。
      输出表面能 (J/m2) 和计算过程中的关键能量值。
    tags: ["surface_energy", "MgO", "slab_calculation", "workflow"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "surface_energy_J_m2"
        value: 1.25
        tolerance: 0.35
      - key: "required_fields"
        value: ["E_bulk_per_atom", "E_slab", "surface_area", "surface_energy", "convergence_check"]
    scoring_checklist:
      - id: "surface_energy_J_m2"
        criterion: "Surface energy is in expected range."
        weight: 0.40
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "All energy terms and surface area are explicitly reported."
        weight: 0.60
        verify: "contains_all"
    touchpoints:
      full: ["Complete workflow with bulk reference, slab construction, and surface energy."]
      partial: ["Surface energy reported but bulk reference unclear."]
      fail: ["No surface energy calculation."]

  # ============================================================
  # Q03: Si band structure - no bundle, self-directed
  # ============================================================

  - id: "L2_Q03"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Run band-structure workflow for Si: locate structure, compute bands along high-symmetry path, report gap."
    human_prompt_seed: >
      计算 Si 的能带结构：从数据库获取金刚石结构 Si，先做 SCF 计算，
      然后沿高对称 k 路径 (G-X-L-G) 计算能带，判断带隙类型（直接/间接）并输出带隙值 (eV)。
      注意 DFT 带隙与实验值的偏差，给出不确定性说明。
    tags: ["band_structure", "si", "workflow", "kpath"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "gap_type"
        value: "indirect"
      - key: "gap_value_eV"
        value: 0.65
        tolerance: 0.25
      - key: "required_fields"
        value: ["kpath", "gap_type", "gap_value", "uncertainty_note"]
    scoring_checklist:
      - id: "gap_type"
        criterion: "Gap type is correct."
        weight: 0.35
        verify: "exact_match"
      - id: "gap_value_eV"
        criterion: "Gap value is in expected DFT range."
        weight: 0.30
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Workflow output includes all key report fields."
        weight: 0.35
        verify: "contains_all"
    touchpoints:
      full: ["Band workflow and report are complete with uncertainty statement."]
      partial: ["Report exists but lacks uncertainty statement."]
      fail: ["No gap classification."]

  # ============================================================
  # Q04: Vacancy formation energy - no bundle, self-directed
  # ============================================================

  - id: "L2_Q04"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Calculate vacancy formation energy: build perfect and defective supercells, compute energies, derive formation energy."
    human_prompt_seed: >
      计算 MgO 中 O 空位的形成能：从数据库获取 MgO 岩盐结构，
      构建 2x2x2 超胞作为 perfect cell，再在超胞中移除一个 O 原子构建 defective cell，
      分别优化两个结构，按 E_f = E_defective - E_perfect + mu_O 计算空位形成能。
      输出形成能 (eV) 和计算表达式。
    tags: ["defect", "formation_energy", "supercell", "MgO"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "formation_energy_eV"
        value: 7.5
        tolerance: 1.5
      - key: "required_fields"
        value: ["E_defective", "E_perfect", "chemical_potential", "formation_energy"]
    scoring_checklist:
      - id: "formation_energy_eV"
        criterion: "Vacancy formation energy is in tolerance."
        weight: 0.45
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Expression terms are explicitly reported."
        weight: 0.55
        verify: "contains_all"
    touchpoints:
      full: ["Energy expression and numeric value both valid."]
      partial: ["Expression given but numeric value absent."]
      fail: ["No defect-formation route."]

  # ============================================================
  # Q05: Detonation metrics - no bundle, agent builds molecule
  # ============================================================

  - id: "L2_Q05"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Estimate detonation parameters for RDX: independently construct molecule, compute properties, apply Kamlet-Jacobs equations."
    human_prompt_seed: >
      估算 RDX (C3H6N6O6) 的爆速和爆压：
      自行构造 RDX 分子结构（可用 SMILES 或手动构建），
      查找或计算密度 (1.806 g/cm3) 和生成焓 (+70 kJ/mol)，
      使用 Kamlet-Jacobs 经验公式计算爆速 D (m/s) 和爆压 P (GPa)。
      输出完整的计算过程和单位换算。
    tags: ["energetic", "detonation_metrics", "kamlet_jacobs", "molecule_construction"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "detonation_velocity_m_s"
        value: 8750.0
        tolerance: 400.0
      - key: "detonation_pressure_GPa"
        value: 34.0
        tolerance: 4.0
      - key: "required_fields"
        value: ["equation", "unit_consistency", "velocity", "pressure"]
    scoring_checklist:
      - id: "detonation_velocity_m_s"
        criterion: "Detonation velocity is in tolerance."
        weight: 0.30
        verify: "numerical_range"
      - id: "detonation_pressure_GPa"
        criterion: "Detonation pressure is in tolerance."
        weight: 0.30
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Formula and unit treatment are explicitly documented."
        weight: 0.40
        verify: "contains_all"
    touchpoints:
      full: ["Outputs physically consistent velocity/pressure with formula context."]
      partial: ["One target metric missing."]
      fail: ["No executable calculation route."]

  # ============================================================
  # Q06: Liquid water gap - no bundle
  # ============================================================

  - id: "L2_Q06"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Build and execute periodic liquid water gap workflow: construct 64-water box, compute HOMO-LUMO gap with hybrid acceleration."
    human_prompt_seed: >
      计算周期性液态水体系的 HOMO-LUMO gap：
      构建 64 个水分子的周期性盒子（密度 ~1.0 g/cm3），
      使用杂化泛函或加速方案（如先 PBE 再 HSE 单点）计算电子 gap。
      输出 gap 值 (eV)、所用加速策略和计算成本估算。
    tags: ["hybrid_method", "liquid_water", "workflow_acceleration", "gap"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "gap_value_eV"
        value: 6.2
        tolerance: 1.2
      - key: "required_fields"
        value: ["hybrid_setup", "acceleration_strategy", "gap_extraction", "cost_note"]
    scoring_checklist:
      - id: "gap_value_eV"
        criterion: "Gap value is in tolerance."
        weight: 0.35
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Workflow includes required setup/extraction/cost fields."
        weight: 0.65
        verify: "contains_all"
    touchpoints:
      full: ["Workflow is complete and gap is extracted."]
      partial: ["Workflow present but extraction details weak."]
      fail: ["No gap extraction path."]

  # ============================================================
  # Q07: Graphene phonon - no bundle
  # ============================================================

  - id: "L2_Q07"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Compute graphene phonon dispersion: build structure, calculate force constants, extract Gamma optical maximum."
    human_prompt_seed: >
      计算石墨烯的声子色散关系：构建石墨烯原胞，
      计算力常数矩阵（有限位移法或 DFPT），沿 G-M-K-G 路径绘制声子色散，
      提取 Gamma 点最高光学支频率 (cm-1)。
    tags: ["phonon_dispersion", "graphene", "frequency_extract"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "gamma_optical_max_cm1"
        value: 1585.0
        tolerance: 40.0
      - key: "required_fields"
        value: ["dispersion_path", "gamma_extraction_rule", "unit_cm-1"]
    scoring_checklist:
      - id: "gamma_optical_max_cm1"
        criterion: "Gamma optical max is in tolerance."
        weight: 0.40
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Extraction rule and units are explicit."
        weight: 0.60
        verify: "contains_all"
    touchpoints:
      full: ["Dispersion workflow and Gamma extraction are explicit."]
      partial: ["Computes dispersion but no extraction rule."]
      fail: ["No final extractable frequency."]

  # ============================================================
  # Q08: Batch failure recovery - self-directed
  # ============================================================

  - id: "L2_Q08"
    level: "L2"
    rubric_id: "R_L2_001"
    intent: "Given descriptions of mixed failed-job scenarios, classify failure modes and provide parameterized retry strategy."
    human_prompt_seed: >
      假设你提交了一批 20 个 DFT 计算任务，其中 6 个失败了，失败原因如下：
      Job 3, 7: SCF 不收敛（含过渡金属，ISPIN=1）；
      Job 11: 内存不足（NCORE 设置不当）；
      Job 15, 18: KPOINTS 太密导致超时；
      Job 20: 输入文件 POTCAR 缺失。
      请分类这些失败模式（至少 3 类），为每类给出参数化的重试方案和终止条件。
    tags: ["failure_recovery", "batch_jobs", "retry_strategy"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "failure_classes_count"
        value: 3
        tolerance: 1.0
      - key: "required_fields"
        value: ["classification_table", "retry_parameters", "fallback_rule", "stop_condition"]
    scoring_checklist:
      - id: "failure_classes_count"
        criterion: "Identifies expected number of failure classes."
        weight: 0.30
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Retry strategy includes all required control fields."
        weight: 0.70
        verify: "contains_all"
    touchpoints:
      full: ["Failure taxonomy and retry policy are complete."]
      partial: ["Taxonomy present but retry policy under-specified."]
      fail: ["No executable retry policy."]
