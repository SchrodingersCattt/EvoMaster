# Worker 镜像与部署：build / deploy-test / manual-uat / deploy-uat / manual-online

.curl_worker: &curl_worker
  >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE_WORKER\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME_WORKER\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"${DEVOPS_DEPLOY_NAME:-$CI_JOB_NAME}\"}""" ${devops} > result.json

docker-build:worker:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  needs:
    - docker-build:api
  script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - echo $DOCKER_IMAGE_WORKER
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile --target worker -t ${DOCKER_IMAGE_WORKER} --cache-from ${DOCKER_IMAGE} . --push
    - docker run --rm ${DOCKER_IMAGE_WORKER} python -c "import src.worker.agent_worker"
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/ || $CI_COMMIT_TAG'
      when: on_success

# deploy-test / manual-uat / deploy-uat 已迁至子流水线 ci/worker-deploy.yml（独立 pipeline_id）

manual-online:worker:
  stage: manual-online
  script:
    - echo 触发飞书审批,运维通过后人工部署生产环境 Worker
    - echo $DOCKER_IMAGE_WORKER
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - $RUNNER_ZJK_TAG
  needs:
    - check-branch
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
