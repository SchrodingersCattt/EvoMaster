# 主流水线：build-remote-image + 按 tag/分支 trigger 子流水线
# 打 tag 时：tag 含 _matmaster-evo-worker_ 只 trigger Worker 子流水线，含 _matmaster-evo_ 且不含 worker 只 trigger API 子流水线
# 推 test 分支时：同时 trigger API + Worker 两条子流水线

variables:
  RUNNER_ZJK_TAG: k8s-runner-zjk-svc
  REGISTRY: registry.dp.tech
  CHECK: main

stages:
  - build
  - baseline-eval
  - lint
  - test
  - sync-question-catalog
  - build-remote-image
  - trigger

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "remote-image" && ($GITLAB_USER_LOGIN == "project_1023_bot" || $GITLAB_USER_LOGIN =~ /^project_[0-9]+_bot$/)'
      when: never
    - when: always

include:
  - local: ".deploy-ci.yml"
  - local: "ci/pre-commit-job.yml"
  - local: "ci/sync_question_catalog_jobs.yml"
  - local: "ci/baseline-eval.yml"

# 合并到 main：先 build 镜像再跑 pre-commit（与子流水线一致，复用镜像内 hook；不与 sync-question-catalog 的 docker-build 同名）
docker-build-mr-main:
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  before_script:
    - |
      DOCKER_TAG="ci${CI_PIPELINE_ID}"
      DOCKER_IMAGE="${REGISTRY}/flow/matmaster-evo:${DOCKER_TAG}"
      export DOCKER_TAG DOCKER_IMAGE
  script:
    - git pull origin "${CI_COMMIT_BRANCH}" || true
    - echo "$DOCKER_IMAGE"
    - git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile -t ${DOCKER_IMAGE} --cache-to type=inline,mode=max . --push
    - docker run --rm ${DOCKER_IMAGE} ls -la /app
    - echo "DYNAMIC_IMAGE=${DOCKER_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# 合并到 main：MR 目标分支为 main，或 push 到 main（lint 依赖 docker-build-mr-main）
# 此处不写 extends，与 ci/pre-commit-job.yml 中 .pre-commit-with-built-image 保持脚本一致，避免 CI Lint 合并 before_script 报错
pre-commit:
  stage: lint
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  needs:
    - job: docker-build-mr-main
      artifacts: true
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - |
      test -n "${DYNAMIC_IMAGE:-}" || (echo "pre-commit: 缺少 DYNAMIC_IMAGE（需 docker-build-mr-main 产出 build.env）" && exit 1)
    - docker pull "${DYNAMIC_IMAGE}"
  script:
    - bash "${CI_PROJECT_DIR}/ci/run_pre_commit_in_docker.sh" "${DYNAMIC_IMAGE}"
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# 合并到 main：lint 通过后跑单测（与 ci/api-deploy.yml 的 test job 同源，复用 docker-build-mr-main 镜像）
pytest-mr-main:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: test
  image: $REGISTRY/public/ubuntu:gitlab-docker
  needs:
    - job: docker-build-mr-main
      artifacts: true
    - job: pre-commit
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - |
      test -n "${DYNAMIC_IMAGE:-}" || (echo "pytest: 缺少 DYNAMIC_IMAGE（需 docker-build-mr-main 产出 build.env）" && exit 1)
    - docker pull "${DYNAMIC_IMAGE}"
  script:
    - docker rm -f "testcov-${CI_PIPELINE_ID}" || true
    - docker create --name "testcov-${CI_PIPELINE_ID}" ${DYNAMIC_IMAGE} sh -c "
      cd /app &&
      python -V &&
      . .venv/bin/activate &&
      uv add pytest-cov pytest-xdist pytest-timer pytest-asyncio &&
      pytest -n 8 --cov=./ --cov-report term-missing --cov-report html:/app/htmlcov -sv
      "
    - docker cp ${CI_PROJECT_DIR}/tests/. "testcov-${CI_PIPELINE_ID}":/app/tests/
    - docker cp ${CI_PROJECT_DIR}/pytest.ini "testcov-${CI_PIPELINE_ID}":/app/pytest.ini
    - docker start -a "testcov-${CI_PIPELINE_ID}"
    - docker cp "testcov-${CI_PIPELINE_ID}":/app/htmlcov ${CI_PROJECT_DIR}/htmlcov
    - docker rm "testcov-${CI_PIPELINE_ID}"
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - htmlcov/
  cache:
    paths:
      - .cache/pip
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# 题库同步：ci/sync_question_catalog_jobs.yml（docker-build → sync，与 api-deploy 同源）

# 一次构建三环境（test/uat/prod）并更新 constant.py，推送到分支 remote-image 时触发
build-remote-image:all:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  before_script:
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh" "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "remote-image"
  tags:
    - $RUNNER_ZJK_TAG

# 打 tag 含 _matmaster-evo_ 且不含 worker 时自动 trigger API 子流水线；test 分支 push 时也 trigger
trigger-api-deploy:
  stage: trigger
  trigger:
    include: ci/api-deploy.yml
    strategy: depend
  rules:
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'
      when: on_success

# 打 tag 含 _matmaster-evo-worker_ 时自动 trigger Worker 子流水线；test 分支 push 时也 trigger
trigger-worker-deploy:
  stage: trigger
  trigger:
    include: ci/worker-deploy.yml
    strategy: depend
  rules:
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'
      when: on_success
