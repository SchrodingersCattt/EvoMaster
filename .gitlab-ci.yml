variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  RUNNER_ZJK_TAG: k8s-runner-zjk-svc
  REGISTRY: registry.dp.tech
  COVER: "false"
  CHECK: main


stages:
  - build-remote-image
  - build
  - test
  - deploy-test
  - manual-uat
  - deploy-uat
  - check
  - manual-online


include:
  - local: ".deploy-ci.yml"


image: $REGISTRY/public/ubuntu:gitlab-0.0.2
services:
  - $REGISTRY/public/docker:20.10.16-dind

.curl: &curl
         >-
         /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
         \"image\":\"$DOCKER_IMAGE\",
         \"pipeline_id\":$CI_PIPELINE_ID,
         \"tag\":\"$CI_COMMIT_TAG\",
         \"branch\":\"$CI_COMMIT_BRANCH\",
         \"server_name\":\"$SERVER_NAME\",
         \"user\":\"$AUTHOR_NAME\",
         \"commit_id\":\"$CI_COMMIT_SHA\",
         \"step\":\"$CI_JOB_STAGE\",
         \"project_id\":$CI_PROJECT_ID,
         \"build_id\":$CI_JOB_ID,
         \"step_status\":\"$CI_JOB_STATUS\",
         \"gitlab_url\":\"$CI_PIPELINE_URL\",
         \"deploy_name\":\"$CI_JOB_NAME\"}""" ${devops} > result.json


docker-build:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  script:
    # 若上一条流水线是 build-remote-image 的 push，拉取后即含新默认镜像 ID
    - git pull origin "${CI_COMMIT_BRANCH}" || true
    - echo $SERVER_NAME
    - echo $DOCKER_IMAGE
    - git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile -t ${DOCKER_IMAGE} --cache-to type=inline,mode=max . --push
    - *curl
    - docker run --rm ${DOCKER_IMAGE} ls -la /app
    - |
      echo "DYNAMIC_IMAGE=${DOCKER_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  rules:
    # 本次 push 改了 remote 镜像相关文件时，本流水线只跑 build-remote-image，不跑 docker-build；由 push 触发的下一条流水线再 build/deploy
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/ || $CI_COMMIT_TAG'
      when: on_success
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env  # 保存变量到文件

# Remote 节点镜像：Dockerfile.remote 变更时构建并 push 更新 constant.py；本流水线不跑 docker-build，由 push 触发的下一条流水线 build/deploy
# 需在 CI/CD Variables 中配置 BOHRIUM_ACCESS_KEY（Masked）、BOHRIUM_PROJECT_ID
build-remote-image:test:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  environment: test
  variables:
    REMOTE_IMAGE_ENV: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq > /dev/null || true
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
    - |
      if [[ -z "${BOHRIUM_ACCESS_KEY:-}" ]]; then
        echo "DEBUG: BOHRIUM_ACCESS_KEY is unset. Check: Variable key exact? Protected + branch test protected? Env scope = test or *?"
        exit 1
      fi
      echo "DEBUG: BOHRIUM_ACCESS_KEY is set (length ${#BOHRIUM_ACCESS_KEY})"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /.*test$/
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
  tags:
    - $RUNNER_ZJK_TAG

build-remote-image:uat:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  environment: uat
  variables:
    REMOTE_IMAGE_ENV: uat
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq > /dev/null || true
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /.*uat$/
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: manual
  tags:
    - $RUNNER_ZJK_TAG

build-remote-image:prod:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  environment: production
  variables:
    REMOTE_IMAGE_ENV: prod
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq > /dev/null || true
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /.*prod$/)
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: manual
  tags:
    - $RUNNER_ZJK_TAG

docker-cover-build:
  stage: build
  image: $REGISTRY/public/kaniko-project/executor:debug-0.0.5
  script:
    - echo "构建cover镜像"
    - |
      [ $COVER == "true" ] && DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:cover-${DOCKER_TAG}
    - echo $DOCKER_IMAGE
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile=${CI_PROJECT_DIR}/build/docker/${DOCKER_NAME}/Dockerfile-cover
      --destination=${DOCKER_IMAGE}
      --build-arg BRANCH=$CI_COMMIT_BRANCH || exit 1
    - *curl
  retry: 2
  tags:
    - $RUNNER_ZJK_TAG
  cache:
    paths:
      - .docker
  rules:
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/) && $COVER == "true" '

test:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: test
  image: $REGISTRY/public/ubuntu:gitlab-docker  # 使用公共镜像
  dependencies:
    - docker-build  # 显式依赖以获取 artifacts
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    # 拉取构建的镜像
    - docker pull ${DYNAMIC_IMAGE}
  script:
    - docker rm -f testcov || true
    - docker create --name testcov ${DYNAMIC_IMAGE} sh -c "
      cd /app &&
      python -V &&
      . .venv/bin/activate &&
      uv add pytest-cov pytest-xdist pytest-timer &&
      pytest -n 8 --cov=./ --cov-report term-missing --cov-report html:/app/htmlcov -sv
      "
    - docker cp ${CI_PROJECT_DIR}/tests testcov:/app/tests
    - docker cp ${CI_PROJECT_DIR}/pytest.ini testcov:/app/pytest.ini
    - docker start -a testcov
    - docker cp testcov:/app/htmlcov ${CI_PROJECT_DIR}/htmlcov
    - docker rm testcov
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - htmlcov/
  cache:
    paths:
      - .cache/pip
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      when: on_success


deploy-test:
  stage: deploy-test
  tags:
    - $RUNNER_ZJK_TAG
  script:
      - echo 部署test 环境
      - echo "COVER=$COVER"
      - echo "DOCKER_IMAGE=$DOCKER_IMAGE"
      - echo "DOCKER_NAME=$DOCKER_NAME"
      - echo "DOCKER_TAG=$DOCKER_TAG"
      - echo "SERVER_NAME=$SERVER_NAME"
      - echo "AUTHOR_NAME=$AUTHOR_NAME"
      - echo "CI_COMMIT_TAG=$CI_COMMIT_TAG"
      - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH"
      - echo "CI_PIPELINE_ID=$CI_PIPELINE_ID"
      - echo "CI_JOB_STAGE=$CI_JOB_STAGE"
      - echo "CI_PROJECT_ID=$CI_PROJECT_ID"
      - echo "CI_JOB_ID=$CI_JOB_ID"
      - echo "CI_JOB_STATUS=$CI_JOB_STATUS"
      - echo "CI_PIPELINE_URL=$CI_PIPELINE_URL"
      - echo "CI_JOB_NAME=$CI_JOB_NAME"
      - echo "devops=$devops"
      - echo "secret=$secret"
      - |
        [ $COVER == "true" ] && DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:cover-${DOCKER_TAG}
      - echo $DOCKER_IMAGE
      - *curl
      - echo "result.json内容如下:"
      - cat result.json
      - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  retry: 2
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/) && $CI_COMMIT_TAG == null'
      when: on_success


manual-uat:
  stage: manual-uat
  script:
    - echo 触发飞书信息测试人员审核
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - $RUNNER_ZJK_TAG
  rules:
    - if: '$CI_COMMIT_TAG'


deploy-uat:
  stage: deploy-uat
  script:
    - echo 触发运维平台部署uat
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - $RUNNER_ZJK_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

check-branch:
  stage: check
  script:
    - |
      git fetch origin $CHECK
      CURRENT_COMMIT=$(git rev-parse HEAD)
      MASTER_COMMIT=$(git rev-parse origin/$CHECK)
      echo "Current commit: $CURRENT_COMMIT"
      echo "Master commit: $MASTER_COMMIT"
      if git merge-base --is-ancestor $CURRENT_COMMIT $MASTER_COMMIT; then
          echo -e "\\033[42mCurrent commit is merged into  $CHECK\\033[0m";
      else
          echo  -e "\\033[31mCurrent commit is not merged into  $CHECK\\033[0m";
          exit 1;
      fi
      if git merge-base --is-ancestor $MASTER_COMMIT $CURRENT_COMMIT; then
          echo -e "\\033[42mCurrent commit contains the latest  $CHECK commit\\033[0m";
      else
          echo -e "\\033[31mCurrent commit does not contain the latest  $CHECK commit\\033[0m";
          exit 1;
      fi
  tags:
    - $RUNNER_ZJK_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - deploy-uat

manual-online:
  stage: manual-online
  script:
    - echo 触发飞书审批,运维通过后人工部署生产环境
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - $RUNNER_ZJK_TAG
  needs:
    - check-branch
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual


before_script:
  - |
    COMMIT_TAG=`echo $CI_COMMIT_TAG | awk -F '_' '{print $3}'`
    DOCKER_TAG=$CI_PIPELINE_ID$COMMIT_TAG
    [ -z "$CI_COMMIT_TAG" ] && SERVER_NAME=$PROJECT_NAME || SERVER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
    [ -z "$CI_COMMIT_TAG" ] && DOCKER_NAME=$(echo $PROJECT_NAME | awk -F '_' '{print $1}' ) || DOCKER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
  - DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
  - AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
