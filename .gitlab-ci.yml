# 主流水线：仅 build-remote-image + 触发两条完全独立的子流水线（API / Worker）
# 子流水线内自包含 build → deploy，同一条 pipeline_id，镜像 tag 一致

variables:
  RUNNER_ZJK_TAG: k8s-runner-zjk-svc
  REGISTRY: registry.dp.tech
  CHECK: main

stages:
  - build-remote-image
  - trigger

include:
  - local: ".deploy-ci.yml"

# 一次构建三环境（test/uat/prod）并更新 constant.py，推送到分支 remote-image 时触发
# 需在 CI/CD Variables 配置：BOHRIUM_ACCESS_KEY_TEST、BOHRIUM_PROJECT_ID_TEST、BOHRIUM_ACCESS_KEY_UAT、
# BOHRIUM_PROJECT_ID_UAT、BOHRIUM_ACCESS_KEY_PROD、BOHRIUM_PROJECT_ID_PROD
build-remote-image:all:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  before_script:
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh" "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "remote-image"
  tags:
    - $RUNNER_ZJK_TAG

# 触发 API 完整子流水线（build + test + deploy，独立 pipeline_id）
trigger-api-deploy:
  stage: trigger
  trigger:
    include: ci/api-deploy.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success

# 触发 Worker 完整子流水线（build + deploy，独立 pipeline_id）
trigger-worker-deploy:
  stage: trigger
  trigger:
    include: ci/worker-deploy.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
