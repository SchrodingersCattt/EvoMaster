# 主流水线：build-remote-image + 按 tag/分支触发子流水线
# 打 tag 时：tag 含 _matmaster-evo-worker_ 只触发 Worker，含 _matmaster-evo_ 且不含 worker 只触发 API（打哪个 tag 部署哪个服务）
# 推 test 分支时：同时触发 API + Worker 两条子流水线

variables:
  RUNNER_ZJK_TAG: k8s-runner-zjk-svc
  REGISTRY: registry.dp.tech
  CHECK: main

stages:
  - build-remote-image
  - trigger

include:
  - local: ".deploy-ci.yml"

# 一次构建三环境（test/uat/prod）并更新 constant.py，推送到分支 remote-image 时触发
# 需在 CI/CD Variables 配置：BOHRIUM_ACCESS_KEY_TEST、BOHRIUM_PROJECT_ID_TEST、BOHRIUM_ACCESS_KEY_UAT、
# BOHRIUM_PROJECT_ID_UAT、BOHRIUM_ACCESS_KEY_PROD、BOHRIUM_PROJECT_ID_PROD
build-remote-image:all:
  stage: build-remote-image
  image: $REGISTRY/public/ubuntu:gitlab-0.0.2
  before_script:
    - chmod +x "${CI_PROJECT_DIR}/ci/build_remote_image.sh" "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  script:
    - "${CI_PROJECT_DIR}/ci/build_remote_image_all.sh"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "remote-image"
  tags:
    - $RUNNER_ZJK_TAG

# 触发 API 子流水线（tag 含 _matmaster-evo_ 且不含 _matmaster-evo-worker_ 时触发，或 test 分支）
trigger-api-deploy:
  stage: trigger
  trigger:
    include: ci/api-deploy.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'
      when: on_success

# 触发 Worker 子流水线（tag 含 _matmaster-evo-worker_ 时触发，或 test 分支）
trigger-worker-deploy:
  stage: trigger
  trigger:
    include: ci/worker-deploy.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'
      when: on_success
