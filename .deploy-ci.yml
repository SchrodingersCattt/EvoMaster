workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "sync-question-catalog"
    - if: $CI_COMMIT_BRANCH == "remote-image"
    - if: $CI_COMMIT_BRANCH == "test"
      variables:
        DOCKERFILE_DIR: ./docker_api/
        PROJECT_NAME: matmaster-evo_test
        SERVER_NAME_WORKER: matmaster-evo-worker_test
        BRANCH: test
    - if: $CI_COMMIT_TAG
      variables:
        DOCKERFILE_DIR: ./docker_api/
        SERVER_NAME_WORKER: matmaster-evo-worker
    # 与根 .gitlab-ci.yml 的 pre-commit job 一致：允许「合入 main」相关流水线被创建
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
