# Mat Master Playground 配置文件
# 材料科学向 agent，支持 LiteLLM 与 Azure，接入 Mat MCP（Structure Generator、Science Navigator、Document Parser、DPA）
# 鉴权从 .env 读取：LITELLM_PROXY_*、AZURE_*、DEEPSEEK_API_KEY 等，配置中使用 ${变量名} 引用

# ============================================
# LLM 配置（必须支持 litellm 与 azure 格式）
# ============================================
# 均使用 provider: "openai"（OpenAI 兼容接口），通过 base_url + model 区分
# .env 需提供：LITELLM_PROXY_API_BASE, LITELLM_PROXY_API_KEY, AZURE_API_BASE, AZURE_API_KEY
llm:
  litellm:
    provider: "openai"
    model: "claude-sonnet-4-6"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    # temperature: 0.7
    # max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  # Azure OpenAI：model 填你在 Azure 门户中的「部署名称」（可写 azure/部署名，如 azure/gpt-5 或 azure/gpt-5-chat）
  azure:
    provider: "openai"
    model: "azure/gpt-5"
    api_key: "${AZURE_API_KEY}"
    base_url: "${AZURE_API_BASE}"
    api_version: "${AZURE_API_VERSION}"
    temperature: 0.7
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  # 可选：DeepSeek，.env 提供 DEEPSEEK_API_KEY
  deepseek:
    provider: "deepseek"
    model: "deepseek-reasoner"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.7
    max_tokens: 16384
    timeout: 60
    max_retries: 3
    retry_delay: 1.0

  default: "litellm"

# ============================================
# 多智能体配置（单 agent）
# ============================================
agents:
  general:
    llm: "litellm"
    max_turns: 200
    tools:
      builtin: ["*"]
      # 设为 "*" 才会把 MCP 工具（mat_sn_*、mat_doc_*、structure-manager 等）注入到该 agent；空字符串则不注册
      mcp: "*"

    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 5

    system_prompt_file: "prompts/mat_master_system_prompt.txt"
    user_prompt_file: "prompts/user_prompt.txt"

# ============================================
# Mat Master：Mode 通过命令行 --mode 切换（direct | planner），不在此配置
# ============================================
mat_master:
  # 可选：指定 workspace 根目录（与 MAT_MASTER_WORKSPACE_ROOT 相同）
  # 设置后前端文件树与 agent 的工作目录都指向此路径
  # workspace_root: "./"

  # ── CRP 许可证防火墙 ──
  # 决定哪些软件可以执行、哪些被阻止、以及默认替代方案。
  # 异步软件列表不需要在此配置：由 AsyncToolRegistry 从 mcp.calculation_executors
  # 自动推导（规则：存在 remote_profile 且不在 sync_tools 中的即为异步工具）。
  crp:
    allow_list:
      - "ABACUS"
      - "LAMMPS"
      - "DPA"
      - "COMPDART"
      - "CP2K"
      - "QE"
      - "ABINIT"
      - "ORCA"
      - "OpenBabel"
      # MCP server prefixes (planner validation)
      - "mat_abacus"
      - "mat_dpa"
      - "mat_compdart"
      - "mat_sg"
      - "mat_doc"
      - "mat_sn"
      - "mat_nmr"
      - "mat_xrd"
      - "mat_electron_microscope"
    block_list:
      - "VASP"
      - "Gaussian"
      - "CASTEP"
      - "Wien2k"
    tool_stack:
      preferred_dft: "ABACUS"
      preferred_mlp: "DPA"
      preferred_md: "LAMMPS"

  # 统一并发执行层配置（Direct 模式 + Planner 模式共享）
  execution:
    # Direct 模式：LLM 单次返回的多个 tool call 并发执行的最大线程数
    direct_max_workers: 4
    # Planner 模式：一个 execution window 内同时执行 step 的最大线程数
    planner_max_workers: 3
    # 可选：全局速率限制（每秒最多发起多少次工具调用）; null 表示不限速
    rate_limit: null
    # 工具结果自动落盘：名称以此列表任一前缀开头的工具，执行成功后会将 observation 写入工作区 _tmp/tool_outputs/<工具名>/
    # 便于多批次文献汇总等任务从文件合并，避免上下文截断导致最终 CSV 不全
    tool_output_auto_save_patterns: ["mat_sn_"]

  # 规划模式配置（仅 --mode planner 时使用）
  planner:
    # 1. Planner 全局回合预算 (Turn Budget)
    # 用于限制整个任务（包含 pre-check, planning, replanning 和执行步骤）的总消耗。
    # 计数规则：
    #   - 每次 Planner 调用 LLM (规划/重规划/评估) 消耗 1 turn
    #   - 每执行一个计划步骤 (Plan Step) 消耗 1 turn
    # 预期行为：当总消耗达到此值，任务将以 max_turns_exceeded 状态停止。
    # 为空时：fallback 到 agents.general.max_turns。
    max_turns: 200

    # 2. 单次计划步骤上限 (Max Steps)
    # 限制 Planner 在单次规划中生成的“顶层步骤”数量。
    # 预期行为：生成的 plan.steps 长度不会超过此值。
    # 注意：这不限制执行过程中的 ReAct 回合数（由 agents.general.max_turns 限制）。
    max_steps: 20

    state_file: "research_state.json"
    system_prompt_file: "prompts/planner_system_prompt.txt"
    # 质量门控：survey 完成前至少检索次数（与 plan 中 10-15+ 下界一致）
    quality_gates:
      survey_min_retrieval_calls: 10
  # 专项能力开关（DirectSolver 路由时据此决定是否走 EVO）
  capabilities:
    skill_evolution:
      enabled: true
  # ask-human 交互配置
  # enabled=false 时全局禁用交互，所有 ask-human 调用短路返回，不发任何事件（适合 CI/批量运行）
  # timeout_seconds 为 timeout 模式的默认等待秒数，可被每次调用的 per-call 参数覆盖
  # mode (timeout/block) 由各调用方按业务语义决定，不在此处全局配置
  ask_human:
    enabled: true
    timeout_seconds: 20

  # 鲁棒计算配置（被 monitor_job 内置工具使用）
  monitor_job:
    max_retries: 3
    poll_interval_seconds: 60
  # 技能进化能力配置（被 SkillEvolutionExp 使用）
  skill_evolution:
    dynamic_skills_root: "playground/mat_master/skills/dynamic"
    # 用户永久 skill 库（跨 session 保留）
    # local_user_skills_root: 本机加载路径，~ 会被展开；remote 会同步到 remote_user_skills_root
    local_user_skills_root: "~/.evomaster-skills"
    # remote_user_skills_root: SSH 节点上的目标路径（不在 remote_base 下，是用户级持久目录）
    remote_user_skills_root: "/personal/.evomaster-skills"
    # persist_new_skills: "ask" 询问是否保存（超时默认保存）| "always" 始终保存 | "never" 从不保存
    persist_new_skills: "ask"
    sandbox: "subprocess"

# ============================================
# MCP 配置（仅 mat_master 专用）
# ============================================
# path_adaptor: "calculation" 为历史命名；对所列服务器统一做路径解析与 executor/storage 注入
# calculation_servers: 仅对这些服务器启用 path adaptor（本地文件参数会自动上传 OSS 并改写为 URL）
# calculation_executors: 每服务器可配置 executor（镜像/机型）与 sync_tools；同步任务传 executor=null，否则传 Bohrium executor（鉴权从 .env BOHRIUM_* 注入）
# 结构数据库检索（当前）: mat_struct_db
# 第一性原理计算: mat_abacus
mcp:
  config_file: "mcp_config.json"
  enabled: true
  path_adaptor: "calculation"
  calculation_servers:
    - "mat_sg"
    - "mat_dpa"
    - "mat_compdart"
    - "mat_doc"
    - "mat_abacus"
    - "mat_binary_calc"
    - "mat_struct_db"
    - "mat_nmr"
    - "mat_xrd"
    - "mat_electron_microscope"
  # Per-server tool filter: only register these tools (original names). Omitted servers register all tools.
  tool_include_only:
    mat_sn: ["search-papers-enhanced"]
    mat_doc:
      - extract_material_data_from_pdf
    mat_nmr:
      - "NMR_search_tool"
      - "NMR_predict_tool"
      - "NMR_reverse_predict_tool"
    mat_xrd:
      - "xrd_phase_identification"
    mat_electron_microscope:
      - "get_electron_microscope_recognize"
  # Per-server executor (image/machine_type) and sync_tools. Sync tools → executor None; others → Bohrium executor with env auth.
  calculation_executors:
    mat_sg:
      executor:
        type: "dispatcher"
        machine:
          batch_type: "OpenAPI"
          context_type: "OpenAPI"
          remote_profile:
            image_address: "registry.dp.tech/dptech/dpa-calculator:5a6b85f0"
            platform: "ali"
            machine_type: "c8_m32_1 * NVIDIA 4090"
            app_key: "agent"
        resources:
          envs: {}
      sync_tools:
        - add_hydrogens
        - generate_ordered_replicas
        - apply_structure_transformation
        - remove_solvents
        - build_bulk_structure_by_template
        - build_bulk_structure_by_wyckoff
        - extract_molecules_from_crystal
        - make_supercell_structure
        - make_defect_structure
        - make_doped_structure
        - make_amorphous_structure
        - make_crosslinked_structure
        - build_polymer_chain
        - build_molecule_structures_from_smiles
        - add_cell_for_molecules
        - build_surface_slab
        - build_surface_adsorbate
        - build_surface_interface
        - analyze_wyckoff_positions
        - get_structure_info
        - get_molecule_info
    mat_dpa:
      executor:
        type: "dispatcher"
        machine:
          batch_type: "OpenAPI"
          context_type: "OpenAPI"
          remote_profile:
            image_address: "registry.dp.tech/dptech/dpa-calculator:cd96ac21"
            platform: "ali"
            machine_type: "c16_m64_1 * NVIDIA 4090"
            app_key: "agent"
        resources:
          envs: {}
      sync_tools: []
    mat_compdart:
      executor:
        type: "dispatcher"
        machine:
          batch_type: "OpenAPI"
          context_type: "OpenAPI"
          remote_profile:
            image_address: "registry.dp.tech/dptech/dpa-calculator:9ef99f94"
            platform: "ali"
            machine_type: "c16_m64_1 * NVIDIA 4090"
            app_key: "agent"
        resources:
          envs: {}
      sync_tools: []
    mat_doc:
      executor: null
      sync_tools:
        - extract_material_data_from_pdf
    mat_nmr:
      executor: null
      sync_tools:
        - NMR_search_tool
        - NMR_predict_tool
        - NMR_reverse_predict_tool
    mat_xrd:
      executor: null
      sync_tools:
        - xrd_phase_identification
    mat_electron_microscope:
      executor: null
      sync_tools:
        - get_electron_microscope_recognize
    # 结构数据库检索：走 local，仅注入 BOHRIUM_ACCESS_KEY / BOHRIUM_PROJECT_ID 到 env
    mat_struct_db:
      executor:
        type: "local"
        env: {}
      sync_tools: []
    mat_abacus:
      executor:
        type: "dispatcher"
        machine:
          batch_type: "OpenAPI"
          context_type: "OpenAPI"
          remote_profile:
            image_address: "registry.dp.tech/dptech/dp/native/prod-22618/abacusagenttools-matmaster-new-tool:v0.2.3"
            platform: "ali"
            machine_type: "c32_m128_cpu"
            app_key: "agent"
        resources:
          envs: {}
      sync_tools:
        - abacus_prepare
        - abacus_modify_input
        - abacus_modify_stru
        - abacus_collect_data
    # Binary Calc: 同一 MCP server 下不同工具使用不同镜像/机型，通过 executor_map 按工具名分发
    mat_binary_calc:
      executor: null
      executor_map:
        run_lammps:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/lammps-agent:03810da8"
              platform: "ali"
              machine_type: "c16_m64_1 * NVIDIA 4090"
              app_key: "agent"
          resources:
            envs: {}
        run_cp2k:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/cp2k:2024.1"
              platform: "ali"
              machine_type: "c32_m128_cpu"
              app_key: "agent"
          resources:
            envs: {}
        run_pyscf:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/dp/native/prod-19853/pyscf-geometric:dev-260305"
              platform: "ali"
              machine_type: "c32_m128_cpu"
              app_key: "agent"
          resources:
            envs: {}
        run_abinit:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/dp/native/prod-19853/abinit:v9.10.3_pp"
              platform: "ali"
              machine_type: "c32_m128_cpu"
              app_key: "agent"
          resources:
            envs: {}
        run_quantum_espresso:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/quantum-espresso:7.1"
              platform: "ali"
              machine_type: "c32_m128_cpu"
              app_key: "agent"
          resources:
            envs: {}
        run_orca:
          type: "dispatcher"
          machine:
            batch_type: "OpenAPI"
            context_type: "OpenAPI"
            remote_profile:
              image_address: "registry.dp.tech/dptech/dp/native/prod-19853/orca:v6.1.1"
              platform: "ali"
              machine_type: "c32_m128_cpu"
              app_key: "agent"
          resources:
            envs: {}
      sync_tools:
        - prepare_abinit_job
        - prepare_cp2k_job
        - prepare_qe_job
        - prepare_lammps_job
        - prepare_orca_job
        - prepare_pyatb_job

# ============================================
# Skills（约束 Mat 工具调用方式，注入 meta 到上下文）
# ============================================
skills:
  enabled: true
  skills_root: evomaster/skills

# ============================================
# Session 配置
# ============================================
session:
  type: "local"

  local:
    working_dir: "./playground/mat_master/workspace"
    timeout: 60
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

  docker:
    image: "evomaster/base:latest"
    container_name: null
    use_existing_container: null
    working_dir: "/workspace"
    memory_limit: "64g"
    cpu_limit: 16.0
    gpu_devices: "0"
    network_mode: "host"
    volumes: {"./playground/mat_master/workspace": "/workspace"}
    env_vars: {}
    auto_remove: false
    timeout: 300

# ============================================
# Env 配置
# ============================================
env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1

  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"

  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1

# ============================================
# LLM 输出与日志
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  console: true
  log_path: "./logs/evomaster.log"

project_root: "."
workspace: "./workspace"
results_dir: "./results"
debug: false
