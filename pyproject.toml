[project]
name = "matmaster-evo"
version = "0.1.0"
description = "The Universal Infrastructure for Building Evolving Autonomous Scientific Research Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "matmaster-bohrium-transfer",
    "pydantic",
    "PyYAML",
    "openai",
    "anthropic",
    "google-genai",
    "mcp",
    "python-dotenv",
    # Calculation path adaptor (mat_master) needs OSS upload for local file -> URL
    "oss2",
    # MatMaster web service (FastAPI + WebSocket)
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "websockets>=11.0",
    "pymysql>=1.1.2",
    "gunicorn>=25.0.3",
    "redis>=5.0.0",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
    "paramiko>=4.0.0",
    "requests",
    "boto3>=1.34.0",
    "beautifulsoup4",
    "lxml",
    "pymupdf",
    "markdownify>=0.14.1",
    "tiktoken>=0.7.0",
    "pre-commit>=4.5.1",
    "pycryptodome>=3.21.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
]

[project.optional-dependencies]
# DevShell 外层「跑评测 → 判分 → 改提示词/工具」编排（Claude Agent SDK + 内置 Claude Code 工具集）
eval-agent = [
    "claude-agent-sdk>=0.1.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
calculation = [
    "ase>=3.22",
    "pymatgen>=2024.1,<2026",
    "dpdata>=0.2.18",
    "cp2k-input-tools>=0.9.0",
    "molcrys-kit",
    "mace-torch>=0.3.0",
    # DeepMD 栈及常见传递依赖（版本锁定便于复现；不含 pip）
    "array-api-compat==1.14.0",
    "colorama==0.4.6",
    "dargs==0.5.0.post0",
    "deepmd-kit==3.1.3",
    "deprecated==1.3.1",
    "lightgbm==4.6.0",
    "mendeleev==1.1.0",
    "ml-dtypes==0.5.4",
    "mpich==5.0.0",
    "openbabel-wheel==3.1.1.23",
    "pyfiglet==0.8.post1",
    "pytz==2026.1.post1",
    "scikit-learn==1.8.0",
    "sqlalchemy==2.0.49",
    "threadpoolctl==3.6.0",
    "typeguard==4.5.1",
    "tzdata==2026.1",
    "wrapt==2.1.2",
]

[project.scripts]
mm-devshell = "matmaster.devshell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["matmaster", "utils"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
members = ["packages/bohrium-transfer"]

[tool.uv.sources]
matmaster-bohrium-transfer = { workspace = true }
