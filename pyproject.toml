[project]
name = "evomaster"
version = "0.1.0"
description = "Lightweight open-source scientific research agent framework for alloy design: literature search, composition optimization (DART), computational materials, and writing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pydantic",
    "PyYAML",
    "openai",
    "anthropic",
    "google-genai",
    "mcp",
    "python-dotenv",
    # Calculation path adaptor: OSS upload for local file -> remote URL (Bohrium jobs)
    "oss2",
    # Remote SSH session for Bohrium / HPC job submission
    "paramiko>=4.0.0",
    # Bohrium cloud compute SDK
    "bohrium-sdk>=0.15.0",
    # Local web UI (playground/mat_master/service/)
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "websockets>=11.0",
    # Document processing
    "python-docx>=1.2.0",
    "pymupdf",
    # HTTP / web tools
    "httpx>=0.28.1",
    "requests",
    "beautifulsoup4",
    "lxml",
    "markdownify>=0.14.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
bohrium-open = [
    "bohrium-open-sdk>=1.0.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
calculation = [
    "ase>=3.22",
    "pymatgen>=2024.1",
    "dpdata>=0.2.18",
    "cp2k-input-tools>=0.9.0",
    "molcrys-kit @ git+https://github.com/SchrodingersCattt/MolCrysKit.git",
]

[project.scripts]
matmaster = "playground.mat_master.cli.matmaster_cli:main"
mm-devshell = "matmaster.devshell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["evomaster", "evaluation", "playground", "matmaster", "utils"]

[tool.hatch.metadata]
allow-direct-references = true
