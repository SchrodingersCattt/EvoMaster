[project]
name = "matmaster-evo"
version = "0.1.0"
description = "The Universal Infrastructure for Building Evolving Autonomous Scientific Research Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "pydantic",
    "PyYAML",
    "openai",
    "anthropic",
    "google-genai",
    "mcp",
    "python-dotenv",
    # Calculation path adaptor (mat_master) needs OSS upload for local file -> URL
    "oss2",
    # MatMaster web service (FastAPI + WebSocket)
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "websockets>=11.0",
    "pymysql>=1.1.2",
    "gunicorn>=25.0.3",
    "redis>=5.0.0",
    "bohrium-sdk>=0.15.0",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
    "paramiko>=4.0.0",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pymupdf",
    "markdownify>=0.14.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
bohrium-open = [
    "bohrium-open-sdk>=1.0.0",
]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
]
calculation = [
    "ase>=3.22",
    "pymatgen>=2024.1",
    "dpdata>=0.2.18",
    "cp2k-input-tools>=0.9.0",
]

[project.scripts]
matmaster = "playground.mat_master.cli.matmaster_cli:main"
mm-devshell = "matmaster.devshell.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evomaster", "playground", "matmaster"]
