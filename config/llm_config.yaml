# LLM 配置（独立文件）
# providers: 后端连接（按 provider 去重，transport 在此声明）
# profiles: 每个对外可选模型（profile key = 前端 model_override = 对外标识）
# default: 未指定时使用的默认 profile key
# 鉴权凭据从 .env 读取，使用 ${VAR} 引用

providers:
  litellm:
    transport: chat_completions
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"

  litellm-anthropic:
    transport: anthropic_messages
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_BASE}"
    vendor: bedrock

  anthropic:
    transport: anthropic_messages
    api_key: "${ANTHROPIC_API_KEY}"

  litellm-responses:
    transport: responses
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_BASE}"

profiles:
  matmaster/qwen3.7-max:
    provider: litellm
    model: matmaster/qwen3.7-max
    reasoning_effort: high
    context_limit: 1000000
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  gemini-3.1-pro-preview:
    provider: litellm
    model: gemini-3.1-pro-preview
    reasoning_effort: high
    temperature: 1.0
    context_limit: 200000
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  matmaster/gpt-5.5:
    provider: litellm-responses
    model: matmaster/gpt-5.5
    reasoning_effort: xhigh
    reasoning_summary: detailed
    context_limit: 256000
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  matmaster/dsk-v4p:
    provider: litellm
    model: aliyun/deepseek-v4-pro
    reasoning_effort: max
    context_limit: 200000
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  matmaster/DeepSeek-v4-Pro:
    provider: litellm
    model: matmaster/DeepSeek-v4-Pro
    reasoning_effort: max
    context_limit: 200000
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  global.anthropic.claude-opus-4-6-v1:
    provider: litellm-anthropic
    model: global.anthropic.claude-opus-4-6-v1
    reasoning_effort: max
    context_limit: 200000
    supports_vision: true
    max_tokens: 32000
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0
    prompt_cache:
      system_prompt_breakpoint: true
      automatic: true
      latest_user_breakpoint: true
      tool_result_breakpoint: true
      flexible_breakpoint: true
      max_breakpoints: 4
      min_flexible_chars: 1000
      ttl: "1h"

default: matmaster/qwen3.7-max
