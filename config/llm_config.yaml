# LLM 配置（独立文件）
# profiles: 定义每个 LLM 后端的完整参数
# routes: 前端 model_override 字符串 → 内部 profile 映射
# default: 未指定时使用的默认 profile key
#
# 鉴权凭据从 .env 读取，使用 ${VAR} 引用

profiles:
  opus:
    provider: "openai"
    model: "claude-opus-4-6"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    thinking_effort: "max"
    reasoning_protocol: "anthropic_adaptive_thinking"
    temperature_policy: "force_one_when_reasoning"
    temperature: 0.7
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0
    prompt_cache:
      provider: "anthropic"
      system_prompt_breakpoint: true
      automatic: true
      latest_user_breakpoint: true
      tool_result_breakpoint: true
      flexible_breakpoint: true
      max_breakpoints: 4
      min_flexible_chars: 1000
      ttl: "5m"

  sonnet:
    provider: "openai"
    model: "claude-sonnet-4-6"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    thinking_effort: "high"
    reasoning_protocol: "anthropic_adaptive_thinking"
    temperature_policy: "force_one_when_reasoning"
    temperature: 0.7
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  gemini-pro:
    provider: "openai"
    model: "gemini-3.1-pro-preview"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    reasoning_protocol: "openai_reasoning_effort"
    thinking_effort: "high"
    temperature: 1.0
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  gpt54:
    provider: "openai"
    model: "cds/GPT-5.4"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    reasoning_protocol: "openai_reasoning_effort"
    thinking_effort: "xhigh"
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  qwen_3_7_max:
    provider: "openai"
    model: "matmaster/qwen3.7-max"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    reasoning_protocol: "openai_reasoning_effort"
    thinking_effort: "high"
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  deepseek_v4_pro:
    provider: "openai"
    model: "aliyun/deepseek-v4-pro"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    reasoning_protocol: "openai_reasoning_effort"
    thinking_effort: "max"
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

  opus_global:
    provider: "openai"
    model: "global.anthropic.claude-opus-4-6-v1"
    api_key: "${LITELLM_PROXY_API_KEY}"
    base_url: "${LITELLM_PROXY_API_BASE}"
    thinking_effort: "max"
    reasoning_protocol: "anthropic_adaptive_thinking"
    temperature_policy: "force_one_when_reasoning"
    temperature: 0.7
    supports_vision: true
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0
    prompt_cache:
      provider: "anthropic"
      system_prompt_breakpoint: true
      automatic: true
      latest_user_breakpoint: true
      tool_result_breakpoint: true
      flexible_breakpoint: true
      max_breakpoints: 4
      min_flexible_chars: 1000
      ttl: "5m"

  # Amazon Bedrock Converse（凭证：环境变量 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
  # AWS_REGION 等默认链；无需 LITELLM）
  # model：填推理配置文件的 inferenceProfileId（或 ARN）。若报「invalid」：与当前 region 不符或 ID 抄错。
  # 查本账号在 $AWS_REGION 下可用 ID：aws bedrock list-inference-profiles --region "$AWS_REGION"
  # 在输出里找 Opus 对应条目的 inferenceProfileId，粘贴到下方（勿手猜 us....:0）。
  opus_bedrock:
    provider: "bedrock"
    model: "arn:aws:bedrock:us-east-1:584751650650:inference-profile/global.anthropic.claude-opus-4-6-v1"
    bedrock_region: "${AWS_REGION}"
    api_key: ""
    base_url: null
    thinking_effort: "max"
    reasoning_protocol: "anthropic_adaptive_thinking"
    temperature_policy: "force_one_when_reasoning"
    temperature: 0.7
    supports_vision: true
    model_family: "claude-4.6"
    timeout: 1200
    stream_timeout: 120
    stream_idle_timeout: 60
    max_retries: 3
    retry_delay: 1.0

# 路由表：前端 model_override 字符串 → 内部 profile
routes:
  "claude-opus-4-6":
    profile: opus
  "claude-sonnet-4-6":
    profile: sonnet
  "gemini-3.1-pro-preview":
    profile: gemini-pro
  "cds/GPT-5.4":
    profile: gpt54
  "matmaster/qwen3.7-max":
    profile: qwen_3_7_max
  "matmaster/dsk-v4p":
    profile: deepseek_v4_pro
  "global.anthropic.claude-opus-4-6-v1":
    profile: opus_global
  "bedrock-claude-opus":
    profile: opus_bedrock

default: "qwen_3_7_max"
