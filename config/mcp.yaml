# MCP service config
# Endpoint addresses defined in mcp_config.{env}.json

calculation_preflight: "calculation"
calculation_servers:
  - "mat_sg"
  - "mat_compdart"
  - "mat_struct_db"
  - "mat_recommend_db"
# Per-server tool filter: only register these tools (original names). Omitted servers register all tools.
tool_include_only:
  # mat_sn: use builtin PaperSearch (search-papers-enhanced) instead of lazy MCP tools
  mat_sn: []
  # mat_sg: only sampling (CALYPSO / CrystalFormer) plus the dispatcher
  # job-control trio survives. Build/transform/assemble/inspect have been
  # localised to the flat atomic-structure family skills; exposing the legacy
  # mat_sg builders again would let agents bypass local skills.
  mat_sg:
    - "submit_generate_calypso_structures"
    - "submit_generate_crystalformer_structures"
    - "query_job_status"
    - "get_job_results"
    - "terminate_job"
# MCP 并发策略（一期 rollout 配置）
# 这是 active runtime config，会实际生效；不是只供阅读的说明示例。
# defaults: 按 transport 设置默认并发；servers: 对单个 server 做更细粒度覆盖。
# mode:
#   - serial: 串行执行，适合 stdio 或不支持多路复用的连接
#   - multiplex: 允许有限并发，适合 http/sse 等支持并发请求的连接
mcp_concurrency:
  defaults:
    http:
      mode: "multiplex"
      max_inflight: 4
      max_pending_requests: 64
    sse:
      mode: "multiplex"
      max_inflight: 4
      max_pending_requests: 64
    stdio:
      mode: "serial"
      max_inflight: 1
      max_pending_requests: 16
  servers:
    # 结构库查询更接近检索型 HTTP 路径，一期允许有限并发以验证吞吐收益。
    mat_struct_db:
      mode: "multiplex"
      max_inflight: 4
      max_pending_requests: 64
    mat_recommend_db:
      mode: "multiplex"
      max_inflight: 4
      max_pending_requests: 64
# Per-server executor (image/machine_type) and sync_tools. Sync tools → executor None; others → Bohrium executor with env auth.
calculation_executors:
  mat_sg:
    executor:
      type: "dispatcher"
      machine:
        batch_type: "OpenAPI"
        context_type: "OpenAPI"
        remote_profile:
          image_address: "registry.dp.tech/dptech/dpa-calculator:5a6b85f0"
          platform: "ali"
          machine_type: "c8_m32_1 * NVIDIA 4090"
          app_key: "agent"
      resources:
        envs: {}
    # Only dispatcher job control runs synchronously; submit_generate_* are async.
    # Other builders/transformers have been localised to flat atomic-structure family skills.
    sync_tools:
      - query_job_status
      - get_job_results
      - terminate_job
  mat_compdart:
    executor:
      type: "dispatcher"
      machine:
        batch_type: "OpenAPI"
        context_type: "OpenAPI"
        remote_profile:
          image_address: "registry.dp.tech/dptech/dpa-calculator:9ef99f94"
          platform: "ali"
          machine_type: "c16_m64_1 * NVIDIA 4090"
          app_key: "agent"
      resources:
        envs: {}
    path_params_by_tool:
      submit_run_dart_ga:
        - targets[].model_path
    sync_tools: []
  # 结构数据库检索：走 local，仅注入 BOHRIUM_ACCESS_KEY / BOHRIUM_PROJECT_ID 到 env；仅用同步工具
  mat_struct_db:
    executor:
      type: "local"
      env: {}
    sync_tools:
      - fetch_structures_from_db
  mat_recommend_db:
    executor:
      type: "local"
      env: {}
    sync_tools:
      - fetch_material_info_from_db
