# MatMaster main config
# LLM: llm_config.yaml | MCP: mcp.yaml | MCP endpoints: mcp_config.{env}.json

agents:
  general:
    llm: "qwen_3_6_plus"

# env: retained as stub -- EvoMasterConfig.env requires cluster/docker/scheduler
# sub-fields with no defaults. Removing causes Pydantic validation error.
env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1
  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"
  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1

session:
  type: "local"
  local:
    working_dir: "./workspace"
    timeout: 60
    gpu_devices: null
    cpu_devices: null
    symlinks: {}
  docker:
    image: "evomaster/base:latest"
    container_name: null
    use_existing_container: null
    working_dir: "/workspace"
    memory_limit: "64g"
    cpu_limit: 16.0
    gpu_devices: "0"
    network_mode: "host"
    volumes: {"./workspace": "/workspace"}
    env_vars: {}
    auto_remove: false
    timeout: 300

playground:
  cache_dir: ".cache/matmaster"
  archival:
    enabled: true
    oss_bucket: "${OSS_BUCKET_NAME}"
    oss_prefix: "matmaster_evo/chat_workspace"
    credential_ref: "env:aliyun-oss"

workspace: "./workspace"

# Bohrium sandbox cluster resource catalog.
# The sandbox cluster has no public list APIs; maintain available
# images/machines here.  Empty lists → fall back to non-sandbox API.
bohrium:
  sandbox:
    images: []
    machines:
      cpu:
        - skuEnName: "c2_m4_cpu"
          cpuCoreNum: 2
          memory: 4
        - skuEnName: "c2_m8_cpu"
          cpuCoreNum: 2
          memory: 8
        - skuEnName: "c8_m32_cpu"
          cpuCoreNum: 8
          memory: 32
        - skuEnName: "c32_m128_cpu"
          cpuCoreNum: 32
          memory: 128
        - skuEnName: "c64_m256_cpu"
          cpuCoreNum: 64
          memory: 256
      gpu:
        - skuEnName: "c8_m32_1 * NVIDIA 4090"
          cpuCoreNum: 8
          memory: 32
          gpu: "NVIDIA GeForce RTX 4090"
          gpuCoreNum: 1
        - skuEnName: "c16_m64_1 * NVIDIA 4090"
          cpuCoreNum: 16
          memory: 64
          gpu: "NVIDIA GeForce RTX 4090"
          gpuCoreNum: 1
        - skuEnName: "c16_m64_1 * NVIDIA 5090"
          cpuCoreNum: 16
          memory: 64
          gpu: "NVIDIA GeForce RTX 5090"
          gpuCoreNum: 1
