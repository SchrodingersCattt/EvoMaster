# 评测子流水线 — 每个 capability 一个手动触发的评测 job
#
# 由 baseline-eval.yml 的 baseline-eval-trigger 触发。
# 镜像构建完成后，此处 7 个 capability job 均为 manual，按需点击运行。
# 变量（EVAL_RUNNER、ANTHROPIC_*、LITELLM_*、BASELINE_*、DYNAMIC_IMAGE 等）从父流水线继承。
# EVAL_RUNNER=claude_cli 时走 Claude Code CLI 跑题；EVAL_RUNNER=devshell 时走 MatMaster Agent 跑题。

stages:
  - init
  - eval

# ── 初始化 job（自动运行，确保子流水线不会因全 manual 而挂起）────────────────────
child-pipeline-ready:
  stage: init
  image: alpine:latest
  script:
    - echo "=== 子流水线就绪 ==="
    - echo "评测引擎：${EVAL_RUNNER:-claude_cli}"
    - echo "镜像    ：${DYNAMIC_IMAGE:-<未传入>}"
    - echo "模型    ：${BASELINE_MODEL:-<默认>}"
    - echo "模式    ：${BASELINE_MODES:-direct}"
    - echo "每类题数限制：${BASELINE_LIMIT:-0}"
    - echo ""
    - echo "请在下方手动触发需要评测的 capability job。"
  tags:
    - k8s-runner-ack

# ── 评测 job 模板 ──────────────────────────────────────────────────────────────
.eval-template:
  stage: eval
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  when: manual
  allow_failure: true
  timeout: 4h
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64)"
          }
        }
      }
      EOF
    - docker pull "${DYNAMIC_IMAGE}"
  script:
    - |
      RUNNER_NAME="eval-${EVAL_CAP}-runner"
      docker rm -f "${RUNNER_NAME}" 2>/dev/null || true
      docker create --name "${RUNNER_NAME}" \
        -e EVAL_RUNNER \
        -e ANTHROPIC_API_KEY \
        -e ANTHROPIC_AUTH_TOKEN \
        -e ANTHROPIC_BASE_URL \
        -e ANTHROPIC_MODEL \
        -e ANTHROPIC_DEFAULT_HAIKU_MODEL \
        -e ANTHROPIC_DEFAULT_OPUS_MODEL \
        -e ANTHROPIC_DEFAULT_SONNET_MODEL \
        -e ANTHROPIC_PLATFORM \
        -e AWS_PROFILE \
        -e CLAUDE_CODE_USE_BEDROCK \
        -e ANTHROPIC_SMALL_FAST_MODEL \
        -e CLAUDE_CODE_EFFORT_LEVEL \
        -e BASELINE_CLAUDE_BEDROCK \
        -e MATMASTER_TOOLS_SERVER \
        -e MATMASTER_TOOLS_EVALUATION_BEARER \
        -e OSS_ENDPOINT \
        -e OSS_BUCKET_NAME \
        -e OSS_ACCESS_KEY_ID \
        -e OSS_ACCESS_KEY_SECRET \
        -e LITELLM_PROXY_API_KEY \
        -e LITELLM_PROXY_API_BASE \
        -e BASELINE_CAPABILITIES="${EVAL_CAP}" \
        -e BASELINE_MODES="${BASELINE_MODES}" \
        -e BASELINE_LIMIT="${BASELINE_LIMIT}" \
        -e BASELINE_MAX_TURNS="${BASELINE_MAX_TURNS}" \
        -e BASELINE_TIMEOUT="${BASELINE_TIMEOUT}" \
        -e BASELINE_MODEL="${BASELINE_MODEL}" \
        -e BASELINE_RUN_LABEL="${BASELINE_RUN_LABEL}_${EVAL_CAP}" \
        -e BASELINE_PENDING_ONLY="${BASELINE_PENDING_ONLY}" \
        -e BASELINE_SCORE_SUBMIT="${BASELINE_SCORE_SUBMIT}" \
        -e BASELINE_SCORE_EVAL_CONFIG="${BASELINE_SCORE_EVAL_CONFIG}" \
        -e BASELINE_SCORE_EVAL_INGEST_TIMEOUT="${BASELINE_SCORE_EVAL_INGEST_TIMEOUT}" \
        -e BASELINE_STHP_SOCKS \
        -e BASELINE_STHP_PORT \
        -e BASELINE_STHP_SOCKS_USER \
        -e BASELINE_STHP_SOCKS_PASSWORD \
        -e BASELINE_NO_PROXY \
        -e AWS_ACCESS_KEY_ID \
        -e AWS_SECRET_ACCESS_KEY \
        -e AWS_DEFAULT_REGION \
        -e AWS_DEFAULT_OUTPUT \
        "${DYNAMIC_IMAGE}" \
        bash /app/ci/run_baseline_eval.sh
      EVAL_EXIT=0
      docker start -a "${RUNNER_NAME}" || EVAL_EXIT=$?
      echo "[CI] 容器退出码: ${EVAL_EXIT}"
      docker cp "${RUNNER_NAME}:/app/results" "./ci_results_${EVAL_CAP}" || true
      docker cp "${RUNNER_NAME}:/app/baseline_run.env" "./baseline_run_${EVAL_CAP}.env" || true
      docker rm "${RUNNER_NAME}" || true
      exit ${EVAL_EXIT}
  after_script:
    - docker rm -f "eval-${EVAL_CAP}-runner" 2>/dev/null || true
  artifacts:
    paths:
      - ci_results_${EVAL_CAP}/
      - baseline_run_${EVAL_CAP}.env
    expire_in: 30 days
    when: always
  tags:
    - k8s-runner-ack

# ── 7 个 capability 各一个 job ─────────────────────────────────────────────────
eval-structure-construction:
  extends: .eval-template
  variables:
    EVAL_CAP: structure_construction

eval-input-generation:
  extends: .eval-template
  variables:
    EVAL_CAP: input_generation

eval-batch-processing:
  extends: .eval-template
  variables:
    EVAL_CAP: batch_processing

eval-data-diagnosis:
  extends: .eval-template
  variables:
    EVAL_CAP: data_diagnosis

eval-property-prediction:
  extends: .eval-template
  variables:
    EVAL_CAP: property_prediction

eval-safety-refusal:
  extends: .eval-template
  variables:
    EVAL_CAP: safety_refusal

eval-workflow-orchestration:
  extends: .eval-template
  variables:
    EVAL_CAP: workflow_orchestration
