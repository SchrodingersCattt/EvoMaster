# API 子流水线：由主流水线 trigger，build → lint → test → deploy；job 名不带 :api，deploy_name 为 manual-uat/deploy-uat 便于平台与飞书触发

include:
  - local: ".deploy-ci.yml"
  - local: "ci/pre-commit-job.yml"

variables:
  REGISTRY: registry.dp.tech
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

image: $REGISTRY/public/ubuntu:gitlab-0.0.2
services:
  - $REGISTRY/public/docker:20.10.16-dind

before_script:
  - |
    COMMIT_TAG=`echo $CI_COMMIT_TAG | awk -F '_' '{print $3}'`
    DOCKER_TAG=$CI_PIPELINE_ID$COMMIT_TAG
    [ -z "$CI_COMMIT_TAG" ] && SERVER_NAME=$PROJECT_NAME || SERVER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
    [ -z "$CI_COMMIT_TAG" ] && DOCKER_NAME=$(echo $PROJECT_NAME | awk -F '_' '{print $1}' ) || DOCKER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
    DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
    AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
    export DOCKER_TAG SERVER_NAME DOCKER_NAME DOCKER_IMAGE AUTHOR_NAME

stages:
  - build
  - lint
  - test
  - sync-builtin
  - deploy-test
  - manual-uat
  - deploy-uat
  - sync-builtin-uat
  - check
  - manual-online
  - sync-builtin-prod

.curl: &curl
  >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"${DEVOPS_DEPLOY_NAME:-$CI_JOB_NAME}\"}""" ${devops} > result.json

# lint 独立阶段：在 docker-build 之后，复用构建镜像内预装的 pre-commit 环境（见 ci/pre-commit-job.yml）
pre-commit:
  extends: .pre-commit-with-built-image
  needs:
    - job: docker-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_TAG'
      when: on_success

docker-build:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  script:
    - git pull origin "${CI_COMMIT_BRANCH}" || true
    - echo $SERVER_NAME && echo $DOCKER_IMAGE
    - echo "$(git rev-parse HEAD):${CI_PIPELINE_ID}" > ${CI_PROJECT_DIR}/.build-version
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile -t ${DOCKER_IMAGE} --cache-to type=inline,mode=max . --push
    - *curl
    - docker run --rm ${DOCKER_IMAGE} ls -la /app
    - echo "DYNAMIC_IMAGE=${DOCKER_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_TAG'
      when: on_success
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env

test:
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: test
  image: $REGISTRY/public/ubuntu:gitlab-docker
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - docker pull ${DYNAMIC_IMAGE}
  script:
    - docker rm -f testcov || true
    - docker create --name testcov ${DYNAMIC_IMAGE} sh -c "
      cd /app &&
      python -V &&
      . .venv/bin/activate &&
      uv pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timer numpy &&
      pytest -n 8 --cov=./ --cov-report term-missing --cov-report html:/app/htmlcov -sv
      "
    - docker cp ${CI_PROJECT_DIR}/tests/. testcov:/app/tests/
    - docker cp ${CI_PROJECT_DIR}/pytest.ini testcov:/app/pytest.ini
    - docker start -a testcov
    - docker cp testcov:/app/htmlcov ${CI_PROJECT_DIR}/htmlcov
    - docker rm testcov
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - htmlcov/
  cache:
    paths:
      - .cache/pip
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      when: on_success

# 内置技能 / 插件同步到 tools-server：用刚构建的镜像跑一次性命令（照搬 sync-question-catalog 模式）。
# 天然单例，替代原 app.py 启动钩子里的全量同步（不再多 pod 并发打爆 tools-server）。
# 失败以非零退出码标红 pipeline。各环境通过 SYNC_TOOLS_SERVER / SYNC_SERVICE_ENV 显式指定
# 对应 tools-server 域名，不依赖 runner 透传变量，避免误推到错误环境。
.sync-builtin-base:
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  needs:
    - job: docker-build
      artifacts: true
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - |
      test -n "${DYNAMIC_IMAGE:-}" || (echo "sync-builtin: 缺少 DYNAMIC_IMAGE（需 docker-build 产出 build.env）" && exit 1)
    - docker pull ${DYNAMIC_IMAGE}
  script:
    - docker rm -f "builtin-sync-${CI_JOB_ID}" || true
    - |
      docker create --name "builtin-sync-${CI_JOB_ID}" \
        -e MATMASTER_TOOLS_SERVER="${SYNC_TOOLS_SERVER}" \
        -e SERVICE_ENV="${SYNC_SERVICE_ENV}" \
        ${DYNAMIC_IMAGE} \
        sh -c "cd /app && . .venv/bin/activate && python -m src.services.builtin_skills_sync"
    - docker start -a "builtin-sync-${CI_JOB_ID}"
    - docker rm "builtin-sync-${CI_JOB_ID}"
  tags:
    - k8s-runner-ack

# test：push test 分支自动同步到 test tools-server
sync-builtin-assets:
  extends: .sync-builtin-base
  stage: sync-builtin
  variables:
    SYNC_TOOLS_SERVER: "https://matmaster-tools-server.test.bohrium.com"
    SYNC_SERVICE_ENV: "test"
  rules:
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success

# uat：打 tag 时自动同步到 uat tools-server（uat 域名）
sync-builtin-uat:
  extends: .sync-builtin-base
  stage: sync-builtin-uat
  variables:
    SYNC_TOOLS_SERVER: "https://matmaster-tools-server.uat.bohrium.com"
    SYNC_SERVICE_ENV: "uat"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success

# prod：打 tag 时手动触发同步到 prod tools-server（prod 域名），与 manual-online 一样谨慎
sync-builtin-prod:
  extends: .sync-builtin-base
  stage: sync-builtin-prod
  variables:
    SYNC_TOOLS_SERVER: "https://matmaster-tools-server.bohrium.com"
    SYNC_SERVICE_ENV: "prod"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

deploy-test:
  stage: deploy-test
  variables:
    DEVOPS_DEPLOY_NAME: "deploy-test"
  tags:
    - k8s-runner-zjk-svc
  script:
    - echo 部署test环境 API
    - echo "DOCKER_IMAGE=$DOCKER_IMAGE" && echo "SERVER_NAME=$SERVER_NAME"
    - *curl
    - echo "result.json内容如下:" && cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  retry: 2
  rules:
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success

# deploy_name 固定为 manual-uat，避免平台 10009（不认带 :api 的 job 名）
manual-uat:
  stage: manual-uat
  variables:
    DEVOPS_DEPLOY_NAME: "manual-uat"
  needs:
    - pre-commit
  script:
    - echo 触发飞书信息测试人员审核 API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG'

# job 名为 deploy-uat，平台可按此在飞书点「部署」时触发；10009 容错
deploy-uat:
  stage: deploy-uat
  needs:
    - pre-commit
  script:
    - echo 触发运维平台部署uat API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - CODE=$(cat result.json | jq -r '.code')
    - if [[ "$CODE" != "10000" && "$CODE" != "10009" ]]; then exit 1; fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

check-branch:
  stage: check
  script:
    - |
      git fetch origin ${CHECK:-main}
      CURRENT_COMMIT=$(git rev-parse HEAD)
      MASTER_COMMIT=$(git rev-parse origin/${CHECK:-main})
      if git merge-base --is-ancestor $CURRENT_COMMIT $MASTER_COMMIT; then
          echo -e "\\033[42mCurrent commit is merged into ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit is not merged into ${CHECK:-main}\\033[0m";
          exit 1;
      fi
      if git merge-base --is-ancestor $MASTER_COMMIT $CURRENT_COMMIT; then
          echo -e "\\033[42mCurrent commit contains the latest ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit does not contain the latest ${CHECK:-main}\\033[0m";
          exit 1;
      fi
  tags:
    - k8s-runner-zjk-svc
  needs:
    - deploy-uat
  rules:
    - if: '$CI_COMMIT_TAG'

manual-online:
  stage: manual-online
  needs:
    - check-branch
  script:
    - echo 触发飞书审批,运维通过后人工部署生产环境 API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
