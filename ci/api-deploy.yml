# API 部署 job 定义：build → test → deploy（由主流水线 include，主文件已 include .deploy-ci.yml，此处不再重复）

variables:
  REGISTRY: registry.dp.tech
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

image: $REGISTRY/public/ubuntu:gitlab-0.0.2
services:
  - $REGISTRY/public/docker:20.10.16-dind

# 主流水线 include 多文件时全局 before_script 会互相覆盖，故用模板 + extends 保证 API job 用 API 环境
.api_template:
  before_script:
    - |
      COMMIT_TAG=`echo $CI_COMMIT_TAG | awk -F '_' '{print $3}'`
      DOCKER_TAG=$CI_PIPELINE_ID$COMMIT_TAG
      [ -z "$CI_COMMIT_TAG" ] && SERVER_NAME=$PROJECT_NAME || SERVER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
      [ -z "$CI_COMMIT_TAG" ] && DOCKER_NAME=$(echo $PROJECT_NAME | awk -F '_' '{print $1}' ) || DOCKER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
      DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
      AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
      export DOCKER_TAG SERVER_NAME DOCKER_NAME DOCKER_IMAGE AUTHOR_NAME

stages:
  - build
  - test
  - deploy-test
  - manual-uat
  - deploy-uat
  - check
  - manual-online

.curl: &curl
  >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"${DEVOPS_DEPLOY_NAME:-$CI_JOB_NAME}\"}""" ${devops} > result.json

docker-build:api:
  extends: .api_template
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  script:
    - git pull origin "${CI_COMMIT_BRANCH}" || true
    - echo $SERVER_NAME && echo $DOCKER_IMAGE
    - git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile -t ${DOCKER_IMAGE} --cache-to type=inline,mode=max . --push
    - *curl
    - docker run --rm ${DOCKER_IMAGE} ls -la /app
    - echo "DYNAMIC_IMAGE=${DOCKER_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || ($CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/)'
      when: on_success
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env

test:api:
  extends: .api_template
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: test
  image: $REGISTRY/public/ubuntu:gitlab-docker
  needs:
    - docker-build:api
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - docker pull ${DYNAMIC_IMAGE}
  script:
    - docker rm -f testcov || true
    - docker create --name testcov ${DYNAMIC_IMAGE} sh -c "
      cd /app &&
      python -V &&
      . .venv/bin/activate &&
      uv add pytest-cov pytest-xdist pytest-timer &&
      pytest -n 8 --cov=./ --cov-report term-missing --cov-report html:/app/htmlcov -sv
      "
    - docker cp ${CI_PROJECT_DIR}/tests testcov:/app/tests
    - docker cp ${CI_PROJECT_DIR}/pytest.ini testcov:/app/pytest.ini
    - docker start -a testcov
    - docker cp testcov:/app/htmlcov ${CI_PROJECT_DIR}/htmlcov
    - docker rm testcov
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  artifacts:
    paths:
      - htmlcov/
  cache:
    paths:
      - .cache/pip
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      when: on_success

deploy-test:api:
  extends: .api_template
  stage: deploy-test
  variables:
    DEVOPS_DEPLOY_NAME: "deploy-test"
  tags:
    - k8s-runner-zjk-svc
  script:
    - echo 部署test环境 API
    - echo "DOCKER_IMAGE=$DOCKER_IMAGE" && echo "SERVER_NAME=$SERVER_NAME"
    - *curl
    - echo "result.json内容如下:" && cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  retry: 2
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success

manual-uat:api:
  extends: .api_template
  stage: manual-uat
  needs:
    - docker-build:api
  script:
    - echo 触发飞书信息测试人员审核 API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'

deploy-uat:api:
  extends: .api_template
  stage: deploy-uat
  needs:
    - docker-build:api
  script:
    - echo 触发运维平台部署uat API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'
      when: manual

check-branch:api:
  extends: .api_template
  stage: check
  script:
    - |
      git fetch origin ${CHECK:-main}
      CURRENT_COMMIT=$(git rev-parse HEAD)
      MASTER_COMMIT=$(git rev-parse origin/${CHECK:-main})
      if git merge-base --is-ancestor $CURRENT_COMMIT $MASTER_COMMIT; then
          echo -e "\\033[42mCurrent commit is merged into ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit is not merged into ${CHECK:-main}\\033[0m";
          exit 1;
      fi
      if git merge-base --is-ancestor $MASTER_COMMIT $CURRENT_COMMIT; then
          echo -e "\\033[42mCurrent commit contains the latest ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit does not contain the latest ${CHECK:-main}\\033[0m";
          exit 1;
      fi
  tags:
    - k8s-runner-zjk-svc
  needs:
    - deploy-uat:api
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'

manual-online:api:
  extends: .api_template
  stage: manual-online
  needs:
    - check-branch:api
  script:
    - echo 触发飞书审批,运维通过后人工部署生产环境 API
    - echo $DOCKER_IMAGE
    - *curl
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo_/ && $CI_COMMIT_TAG !~ /_matmaster-evo-worker_/'
      when: manual
