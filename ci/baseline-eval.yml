# 自动评测流水线（父子流水线架构）
#
# 架构说明：
#   1. 父流水线：build 阶段构建镜像；baseline-eval 阶段 baseline-eval-trigger 触发动态子流水线
#   2. 子流水线（动态生成）：布局由 ci/baseline_eval_preset.yaml 的 child_pipeline 决定
#      （capabilities | questions），除非在 Run pipeline / 项目 CI Variables 中设置了
#      BASELINE_CHILD_PIPELINE（该变量会覆盖预设文件）。
#      - capabilities：每个 capability 一个 manual job。
#      - questions：仅 eval-question-list 一个 manual job；题目来自预设 question_ids 或
#        BASELINE_QUESTIONS（逗号分隔）。此模式忽略 BASELINE_LIMIT。
#
# 评测引擎（EVAL_RUNNER）：默认由 ci/baseline_eval_preset.yaml 的 eval_runner 决定；
#   Run pipeline / 项目 CI Variables 中 EVAL_RUNNER 非空时覆盖。
#   claude_cli — 外部 baseline：prepare → claude -p 跑题 → finalize
#   devshell   — MatMaster Agent（run_devshell_eval.py）一步跑题
#
# 触发方式（任选，在 .gitlab-ci.yml 的 include 后生效）：
#   1. 推送到分支 baseline-eval          → 立即触发
#   2. 主流水线 schedule（GitLab 定时）  → 每日/每周自动触发（选分支 main）
#   3. 手动在 GitLab UI 点 Run pipeline  → 可传入变量控制范围
#
# 镜像说明：
#   eval-build job 使用 Dockerfile.eval：在主服务镜像基础上叠加 Node.js + Claude CLI。
#   与生产用 Dockerfile 解耦，不污染 API/Worker 镜像。
#   DevShell 模式仅需 Python 环境（主镜像已包含），但复用同一 eval 镜像以简化流水线。
#
# 所需 GitLab CI Variables（Settings → CI/CD → Variables，Protected + Masked）：
#   通用（两种模式均需）:
#     MATMASTER_TOOLS_SERVER                   — ingest URL 前缀
#     MATMASTER_TOOLS_EVALUATION_BEARER        — tools-server Bearer token
#   Claude CLI 模式:
#     ANTHROPIC_API_KEY 或 ANTHROPIC_AUTH_TOKEN — Claude CLI 鉴权（二选一）
#     ANTHROPIC_BASE_URL                       — Claude CLI 端点（如 gpugeek/MiniMax/DeepSeek 兼容端点）
#     ANTHROPIC_MODEL                          — 指定模型名（可选）
#     ANTHROPIC_DEFAULT_HAIKU_MODEL            — Haiku 模型覆盖（可选）
#     ANTHROPIC_DEFAULT_SONNET_MODEL           — Sonnet 模型覆盖（可选）
#     ANTHROPIC_DEFAULT_OPUS_MODEL             — Opus 模型覆盖（可选）
#   DevShell 模式:
#     LITELLM_PROXY_API_KEY                    — LiteLLM 鉴权（llm_config.yaml 中引用）
#     LITELLM_PROXY_API_BASE                   — LiteLLM base_url
#   可选:
#     REGISTRY_USERNAME / REGISTRY_PASSWORD    — 拉取/推送私有镜像
#
# Claude CLI 代理配置说明（仅 claude_cli 模式）：
#   方案 A（gpugeek）:  ANTHROPIC_API_KEY=xxx + ANTHROPIC_BASE_URL=https://api.gpugeek.com
#   方案 B（MiniMax）:  ANTHROPIC_API_KEY=sk-xxx + ANTHROPIC_BASE_URL=https://api.minimaxi.com/anthropic
#   方案 C（DeepSeek）: ANTHROPIC_AUTH_TOKEN=sk-xxx + ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
#   方案 D（官方）:     ANTHROPIC_API_KEY=sk-ant-xxx（不设 BASE_URL）
#
# 可覆盖变量（手动触发时在 UI 传入，或在 schedule 的 Variables 中填写）：
#   EVAL_RUNNER            — 非空时覆盖预设 eval_runner（claude_cli | devshell）
#   BASELINE_MODES         — direct 或 planner，默认 direct
#   BASELINE_LIMIT         — 限制每个 capability 的题数（0=不限），默认 2
#   BASELINE_MAX_TURNS     — 每题最大轮数，默认 50（仅 claude_cli）
#   BASELINE_TIMEOUT       — 每题超时秒数，默认 1200（仅 claude_cli）
#   BASELINE_MODEL         — 模型标识（claude_cli: 模型名如 opus；devshell: llm_config route key 如 claude-sonnet-4-6）
#   BASELINE_PENDING_ONLY  — 1=pending等人工阅卷，0=proxy自动入库，默认 1
#   BASELINE_CHILD_PIPELINE — 非空时覆盖 ci/baseline_eval_preset.yaml 的 child_pipeline
#   BASELINE_QUESTIONS     — 非空时覆盖预设 question_ids（逗号分隔 id）

variables:
  # ⚠️ 临时测试用，验证通过后务必删除以下几行，改用 GitLab CI Variables 注入
