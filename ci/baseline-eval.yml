# ── Job 1: 构建镜像 + 动态生成子流水线 YAML ──────────────────────────────────
# 使用 Dockerfile.eval 构建评测镜像，然后扫描题库生成子流水线 YAML
baseline-eval-build:
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64)"
          }
        }
      }
      EOF
  script:
    - |
      MAIN_TAG="ci${CI_PIPELINE_ID}"
      MAIN_IMAGE="${REGISTRY}/flow/matmaster-evo:${MAIN_TAG}"
      MAIN_CACHE="${REGISTRY}/flow/matmaster-evo:latest"
      git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
      docker pull "${MAIN_CACHE}" || true
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile \
        --cache-from "${MAIN_CACHE}" \
        -t ${MAIN_IMAGE} \
        -t ${MAIN_CACHE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "MAIN_IMAGE=${MAIN_IMAGE}" >> build.env
    - |
      EVAL_TAG="eval-${CI_PIPELINE_ID}"
      EVAL_IMAGE="${REGISTRY}/flow/matmaster-eval:${EVAL_TAG}"
      EVAL_CACHE="${REGISTRY}/flow/matmaster-eval:latest"
      docker pull "${EVAL_CACHE}" || true
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile.eval \
        --build-arg BASE_IMAGE="${MAIN_IMAGE}" \
        --cache-from "${EVAL_CACHE}" \
        -t ${EVAL_IMAGE} \
        -t ${EVAL_CACHE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "DYNAMIC_IMAGE=${EVAL_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
    - |
      apt-get update -qq && apt-get install -y -qq python3 python3-yaml >/dev/null 2>&1
      echo "--- 写入评测变量到 dotenv ---"
      ENV_FILE="${CI_PROJECT_DIR}/build.env"
      echo "EVAL_RUNNER=$(python3 ci/baseline_eval_preset.py eval-runner)" >> "${ENV_FILE}"
      echo "effective EVAL_RUNNER（EVAL_RUNNER 非空则优先，否则预设 eval_runner）: $(python3 ci/baseline_eval_preset.py eval-runner)"
      echo "BASELINE_MODES=${BASELINE_MODES}" >> "${ENV_FILE}"
      echo "BASELINE_LIMIT=${BASELINE_LIMIT}" >> "${ENV_FILE}"
      echo "BASELINE_MAX_TURNS=${BASELINE_MAX_TURNS}" >> "${ENV_FILE}"
      echo "BASELINE_TIMEOUT=${BASELINE_TIMEOUT}" >> "${ENV_FILE}"
      echo "BASELINE_MODEL=${BASELINE_MODEL}" >> "${ENV_FILE}"
      echo "BASELINE_RUN_LABEL=${BASELINE_RUN_LABEL}" >> "${ENV_FILE}"
      echo "BASELINE_PENDING_ONLY=${BASELINE_PENDING_ONLY}" >> "${ENV_FILE}"
      echo "BASELINE_CHILD_PIPELINE=${BASELINE_CHILD_PIPELINE}" >> "${ENV_FILE}"
      echo "BASELINE_QUESTIONS=${BASELINE_QUESTIONS}" >> "${ENV_FILE}"
      cat "${ENV_FILE}"
    - |
      echo "--- 动态生成子流水线 YAML ---"
      apt-get update -qq && apt-get install -y -qq python3 python3-yaml >/dev/null 2>&1
      echo "effective child_pipeline (BASELINE_CHILD_PIPELINE 非空则优先生效，否则读预设文件): $(python3 ci/baseline_eval_preset.py child-pipeline)"
      python3 ci/generate_eval_child_pipeline.py
      cat ci/generated-eval-child.yml
  retry: 1
  tags:
    - k8s-runner-ack
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env
    paths:
      - ci/generated-eval-child.yml
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "baseline-eval"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "baseline-eval"'

# ── Job 2: 触发动态子流水线 ──────────────────────────────────────────────────
baseline-eval-trigger:
  stage: baseline-eval
  needs:
    - job: baseline-eval-build
      artifacts: true
  variables:
    DYNAMIC_IMAGE: $DYNAMIC_IMAGE
    EVAL_RUNNER: $EVAL_RUNNER
    BASELINE_MODES: $BASELINE_MODES
    BASELINE_LIMIT: $BASELINE_LIMIT
    BASELINE_MAX_TURNS: $BASELINE_MAX_TURNS
    BASELINE_TIMEOUT: $BASELINE_TIMEOUT
    BASELINE_MODEL: $BASELINE_MODEL
    BASELINE_RUN_LABEL: $BASELINE_RUN_LABEL
    BASELINE_PENDING_ONLY: $BASELINE_PENDING_ONLY
    BASELINE_CHILD_PIPELINE: $BASELINE_CHILD_PIPELINE
    BASELINE_QUESTIONS: $BASELINE_QUESTIONS
  trigger:
    include:
      - artifact: ci/generated-eval-child.yml
        job: baseline-eval-build
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "baseline-eval"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "baseline-eval"'
