# Claude Code Baseline 自动评测流水线（父子流水线架构）
#
# 架构说明：
#   1. 父流水线：构建镜像 → 触发子流水线
#   2. 子流水线（baseline-eval-child.yml）：每个 capability 一个独立 manual job
#      镜像构建完成后，7 个能力类别各出一个手动触发的评测 job，按需点击运行。
#
# 触发方式（任选，在 .gitlab-ci.yml 的 include 后生效）：
#   1. 推送到分支 baseline-eval          → 立即触发
#   2. 主流水线 schedule（GitLab 定时）  → 每日/每周自动触发（选分支 main）
#   3. 手动在 GitLab UI 点 Run pipeline  → 可传入变量控制范围
#
# 镜像说明：
#   eval-build job 使用 Dockerfile.eval：在主服务镜像基础上叠加 Node.js + Claude CLI。
#   与生产用 Dockerfile 解耦，不污染 API/Worker 镜像。
#
# 所需 GitLab CI Variables（Settings → CI/CD → Variables，Protected + Masked）：
#   必须:
#     ANTHROPIC_API_KEY 或 ANTHROPIC_AUTH_TOKEN — Claude CLI 鉴权（二选一）
#     ANTHROPIC_BASE_URL                       — Claude CLI 端点（如 gpugeek/MiniMax/DeepSeek 兼容端点）
#     MATMASTER_TOOLS_SERVER                   — ingest URL 前缀
#     MATMASTER_TOOLS_EVALUATION_BEARER        — tools-server Bearer token
#   可选:
#     ANTHROPIC_MODEL                          — 指定模型名
#     ANTHROPIC_DEFAULT_HAIKU_MODEL            — Haiku 模型覆盖
#     ANTHROPIC_DEFAULT_SONNET_MODEL           — Sonnet 模型覆盖
#     ANTHROPIC_DEFAULT_OPUS_MODEL             — Opus 模型覆盖
#     LITELLM_PROXY_API_KEY                    — evaluator LLM judge 鉴权
#     LITELLM_PROXY_API_BASE                   — evaluator LLM base_url
#     REGISTRY_USERNAME / REGISTRY_PASSWORD    — 拉取/推送私有镜像
#
# Claude CLI 代理配置说明：
#   方案 A（gpugeek）:  ANTHROPIC_API_KEY=xxx + ANTHROPIC_BASE_URL=https://api.gpugeek.com
#   方案 B（MiniMax）:  ANTHROPIC_AUTH_TOKEN=sk-xxx + ANTHROPIC_BASE_URL=https://api.minimaxi.com/anthropic
#   方案 C（DeepSeek）: ANTHROPIC_AUTH_TOKEN=sk-xxx + ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
#   方案 D（官方）:     ANTHROPIC_API_KEY=sk-ant-xxx（不设 BASE_URL）
#
# 可覆盖变量（手动触发时在 UI 传入，或在 schedule 的 Variables 中填写）：
#   BASELINE_MODES         — direct 或 planner，默认 direct
#   BASELINE_LIMIT         — 限制每个 capability 的题数（0=不限），默认 2
#   BASELINE_MAX_TURNS     — 每题最大轮数，默认 50
#   BASELINE_TIMEOUT       — 每题超时秒数，默认 900
#   BASELINE_MODEL         — 模型名（空=claude 默认）
#   BASELINE_PENDING_ONLY  — 1=pending等人工阅卷，0=proxy自动入库，默认 1

