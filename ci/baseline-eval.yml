# ── Job 1: 构建评测专用镜像（含 Node.js + Claude CLI）─────────────────────────
# 使用 Dockerfile.eval，在主镜像基础上叠加评测工具链
baseline-eval-build:
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64)"
          }
        }
      }
      EOF
  script:
    # 先拉取最新主镜像（Dockerfile.eval FROM 需要它）
    # 用 main 分支最新 CI 镜像作为基础；若要精确版本可改为 tag
    - |
      # 构建主镜像（与 docker-build-mr-main 逻辑相同，供 Dockerfile.eval 继承）
      MAIN_TAG="ci${CI_PIPELINE_ID}"
      MAIN_IMAGE="${REGISTRY}/flow/matmaster-evo:${MAIN_TAG}"
      git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile \
        -t ${MAIN_IMAGE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "MAIN_IMAGE=${MAIN_IMAGE}" >> build.env
    # 在主镜像基础上构建评测镜像（加 Node.js + Claude CLI）
    - |
      EVAL_TAG="eval-${CI_PIPELINE_ID}"
      EVAL_IMAGE="${REGISTRY}/flow/matmaster-eval:${EVAL_TAG}"
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile.eval \
        --build-arg BASE_IMAGE="${MAIN_IMAGE}" \
        -t ${EVAL_IMAGE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "DYNAMIC_IMAGE=${EVAL_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 1
  tags:
    - k8s-runner-ack
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'


# ── Job 2: 跑题主体（长时 job）────────────────────────────────────────────────
baseline-eval-run:
  stage: sync-question-catalog  # 复用已有 stage，在 build 之后
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  needs:
    - job: baseline-eval-build
      artifacts: true
  timeout: 4h
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64)"
          }
        }
      }
      EOF
    - docker pull "${DYNAMIC_IMAGE}"
  script:
    - |
      docker rm -f baseline-eval-runner 2>/dev/null || true
      docker create --name baseline-eval-runner \
        -e ANTHROPIC_API_KEY \
        -e ANTHROPIC_AUTH_TOKEN \
        -e ANTHROPIC_BASE_URL \
        -e ANTHROPIC_MODEL \
        -e MATMASTER_TOOLS_SERVER \
        -e MATMASTER_TOOLS_EVALUATION_BEARER \
        -e LITELLM_PROXY_API_KEY \
        -e LITELLM_PROXY_API_BASE \
        -e BASELINE_CAPABILITIES="${BASELINE_CAPABILITIES}" \
        -e BASELINE_MODES="${BASELINE_MODES}" \
        -e BASELINE_LIMIT="${BASELINE_LIMIT}" \
        -e BASELINE_MAX_TURNS="${BASELINE_MAX_TURNS}" \
        -e BASELINE_TIMEOUT="${BASELINE_TIMEOUT}" \
        -e BASELINE_MODEL="${BASELINE_MODEL}" \
        -e BASELINE_RUN_LABEL="${BASELINE_RUN_LABEL}" \
        -e BASELINE_PENDING_ONLY="${BASELINE_PENDING_ONLY}" \
        "${DYNAMIC_IMAGE}" \
        bash /app/ci/run_baseline_eval.sh
    - docker start -a baseline-eval-runner
    - docker cp baseline-eval-runner:/app/results ./ci_results || true
    - docker cp baseline-eval-runner:/app/baseline_run.env ./baseline_run.env || true
    - docker rm baseline-eval-runner || true
  after_script:
    - docker rm -f baseline-eval-runner 2>/dev/null || true
  artifacts:
    paths:
      - ci_results/
      - baseline_run.env
    reports:
      dotenv: baseline_run.env
    expire_in: 30 days
    when: always
  tags:
    - k8s-runner-ack
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'
