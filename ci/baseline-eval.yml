  # ANTHROPIC_BASE_URL: "https://api.minimaxi.com/anthropic"
  # ANTHROPIC_MODEL: "MiniMax-M2.7"
  # [gpugeek] 当前使用
  ANTHROPIC_API_KEY: "l0gkdqe9ht0d3u01000dhifz5fpd9xa1m0mtvwao"
  ANTHROPIC_BASE_URL: "https://api.gpugeek.com"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "Vendor2/Claude-4.6-Opus"
  ANTHROPIC_DEFAULT_OPUS_MODEL: "Vendor2/Claude-4.6-Opus"
  ANTHROPIC_DEFAULT_SONNET_MODEL: "Vendor2/Claude-4.6-Opus"
