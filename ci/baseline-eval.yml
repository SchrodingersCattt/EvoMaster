# ── Job 1: 构建评测专用镜像（含 Node.js + Claude CLI）─────────────────────────
# 使用 Dockerfile.eval，在主镜像基础上叠加评测工具链
baseline-eval-build:
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  before_script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
        "auths": {
          "registry.dp.tech": {
            "auth": "$(echo -n ${REGISTRY_USERNAME}:${REGISTRY_PASSWORD} | base64)"
          }
        }
      }
      EOF
  script:
    - |
      MAIN_TAG="ci${CI_PIPELINE_ID}"
      MAIN_IMAGE="${REGISTRY}/flow/matmaster-evo:${MAIN_TAG}"
      git rev-parse HEAD > ${CI_PROJECT_DIR}/.build-version
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile \
        -t ${MAIN_IMAGE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "MAIN_IMAGE=${MAIN_IMAGE}" >> build.env
    - |
      EVAL_TAG="eval-${CI_PIPELINE_ID}"
      EVAL_IMAGE="${REGISTRY}/flow/matmaster-eval:${EVAL_TAG}"
      docker buildx build --progress=plain \
        -f ${CI_PROJECT_DIR}/Dockerfile.eval \
        --build-arg BASE_IMAGE="${MAIN_IMAGE}" \
        -t ${EVAL_IMAGE} \
        --cache-to type=inline,mode=max \
        . --push
      echo "DYNAMIC_IMAGE=${EVAL_IMAGE}" >> ${CI_PROJECT_DIR}/build.env
  retry: 1
  tags:
    - k8s-runner-ack
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/build.env
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'

# ── Job 2: 触发子流水线（每个 capability 一个 manual job）──────────────────────
baseline-eval-trigger:
  stage: sync-question-catalog
  needs:
    - job: baseline-eval-build
      artifacts: true
  variables:
    DYNAMIC_IMAGE: $DYNAMIC_IMAGE
  trigger:
    include:
      - local: ci/baseline-eval-child.yml
    strategy: depend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "baseline-eval"'
