# Worker 部署子流水线（由主流水线 trigger 触发，拥有独立 pipeline_id）
# GitLab：trigger 不保证传入「job 运行时变量」（如 before_script 里算出的 DOCKER_IMAGE_WORKER），故此处与主流水线一致自算
# variables / image / before_script 与 .gitlab-ci.yml 保持一致，子流水线可独立运行

variables:
  REGISTRY: registry.dp.tech

image: $REGISTRY/public/ubuntu:gitlab-0.0.2

before_script:
  - |
    COMMIT_TAG=`echo $CI_COMMIT_TAG | awk -F '_' '{print $3}'`
    DOCKER_TAG=$CI_PIPELINE_ID$COMMIT_TAG
    [ -z "$CI_COMMIT_TAG" ] && SERVER_NAME=$PROJECT_NAME || SERVER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
    [ -z "$CI_COMMIT_TAG" ] && DOCKER_NAME=$(echo $PROJECT_NAME | awk -F '_' '{print $1}' ) || DOCKER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
    SERVER_NAME_WORKER=${SERVER_NAME_WORKER:-matmaster-evo-worker}
    DOCKER_IMAGE=$REGISTRY/flow/${DOCKER_NAME}:${DOCKER_TAG}
    DOCKER_IMAGE_WORKER=$REGISTRY/flow/matmaster-evo-worker:${DOCKER_TAG}
    AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
    export DOCKER_TAG SERVER_NAME DOCKER_NAME SERVER_NAME_WORKER DOCKER_IMAGE DOCKER_IMAGE_WORKER AUTHOR_NAME

stages:
  - deploy-test
  - manual-uat
  - deploy-uat

.curl_worker: &curl_worker
  >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE_WORKER\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME_WORKER\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"${DEVOPS_DEPLOY_NAME:-$CI_JOB_NAME}\"}""" ${devops} > result.json

deploy-test:worker:
  stage: deploy-test
  variables:
    DEVOPS_DEPLOY_NAME: "deploy-test"
  tags:
    - k8s-runner-zjk-svc
  script:
    - echo 部署test环境 Worker
    - echo "DOCKER_IMAGE_WORKER=$DOCKER_IMAGE_WORKER" && echo "SERVER_NAME_WORKER=$SERVER_NAME_WORKER"
    - *curl_worker
    - echo "result.json内容如下:" && cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  retry: 2
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_BRANCH =~ /.*dev$/) && $CI_COMMIT_TAG == null'
      when: on_success

manual-uat:worker:
  stage: manual-uat
  script:
    - echo 触发飞书信息测试人员审核 Worker
    - echo $DOCKER_IMAGE_WORKER
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG'

deploy-uat:worker:
  stage: deploy-uat
  script:
    - echo 触发运维平台部署uat Worker
    - echo $DOCKER_IMAGE_WORKER
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
