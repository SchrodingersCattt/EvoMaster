# Worker 部署 job 定义：build → deploy（由主流水线 include，主文件已 include .deploy-ci.yml，此处不再重复）

variables:
  REGISTRY: registry.dp.tech
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

image: $REGISTRY/public/ubuntu:gitlab-0.0.2
services:
  - $REGISTRY/public/docker:20.10.16-dind

.worker_template:
  before_script:
    - |
      COMMIT_TAG=`echo $CI_COMMIT_TAG | awk -F '_' '{print $3}'`
      DOCKER_TAG=$CI_PIPELINE_ID$COMMIT_TAG
      if [ -n "$CI_COMMIT_TAG" ]; then
        SERVER_NAME=$(echo $CI_COMMIT_TAG | awk -F '_' '{print $2}')
      elif [ "$CI_COMMIT_BRANCH" = "test" ]; then
        SERVER_NAME=matmaster-evo-worker_test
      elif [ "$CI_COMMIT_BRANCH" = "new_test" ]; then
        SERVER_NAME=matmaster-evo-worker-new_test
      else
        SERVER_NAME=matmaster-evo-worker_${CI_COMMIT_BRANCH:-unknown}
      fi
      DOCKER_IMAGE=$REGISTRY/flow/matmaster-evo-worker:${DOCKER_TAG}
      AUTHOR_NAME=$(git log -1 --pretty=format:"%an" --no-merges)
      export DOCKER_TAG SERVER_NAME DOCKER_IMAGE AUTHOR_NAME

stages:
  - build
  - deploy-test
  - manual-uat
  - deploy-uat
  - check
  - manual-online

.curl_worker: &curl_worker
  >-
  /busybox/curl --retry 3 --retry-delay 10 -s -X POST -H "Content-Type: application/json" -H "X-Gitlab-Token: ${secret}"  --data-binary """{
  \"image\":\"$DOCKER_IMAGE\",
  \"pipeline_id\":$CI_PIPELINE_ID,
  \"tag\":\"$CI_COMMIT_TAG\",
  \"branch\":\"$CI_COMMIT_BRANCH\",
  \"server_name\":\"$SERVER_NAME\",
  \"user\":\"$AUTHOR_NAME\",
  \"commit_id\":\"$CI_COMMIT_SHA\",
  \"step\":\"$CI_JOB_STAGE\",
  \"project_id\":$CI_PROJECT_ID,
  \"build_id\":$CI_JOB_ID,
  \"step_status\":\"$CI_JOB_STATUS\",
  \"gitlab_url\":\"$CI_PIPELINE_URL\",
  \"deploy_name\":\"${DEVOPS_DEPLOY_NAME:-$CI_JOB_NAME}\"}""" ${devops} > result.json

docker-build:worker:
  extends: .worker_template
  variables:
    DOCKER_HOST: tcp://docker-build-service:32375
  stage: build
  image: $REGISTRY/public/ubuntu:gitlab-docker
  script:
    - |
      cat > /root/.docker/config.json <<EOF
      {
      "auths": {
        "registry.dp.tech": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        },
        "dp-harbor-registry.cn-zhangjiakou.cr.aliyuncs.com": {
          "auth": "`echo -n $REGISTRY_USERNAME:$REGISTRY_PASSWORD | base64`"
        }
      }
      }
      EOF
    - echo $DOCKER_IMAGE
    - >-
      docker buildx build --progress=plain -f ${CI_PROJECT_DIR}/Dockerfile --target worker -t ${DOCKER_IMAGE} --cache-to type=inline,mode=max . --push
    - docker run --rm ${DOCKER_IMAGE} python -c "import src.worker.agent_worker"
  retry: 2
  tags:
    - k8s-runner-ack
  cache:
    paths:
      - /cache
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/ || $CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'
      when: on_success

deploy-test:worker:
  extends: .worker_template
  stage: deploy-test
  variables:
    DEVOPS_DEPLOY_NAME: "deploy-test"
  tags:
    - k8s-runner-zjk-svc
  needs:
    - docker-build:worker
  script:
    - echo 部署test环境 Worker
    - echo "DOCKER_IMAGE=$DOCKER_IMAGE" && echo "SERVER_NAME=$SERVER_NAME"
    - *curl_worker
    - echo "result.json内容如下:" && cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  retry: 2
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*test$/'
      changes:
        - Dockerfile.remote
        - ci/build_remote_image.sh
      when: never
    - if: '($CI_COMMIT_BRANCH =~ /.*test$/) && $CI_COMMIT_TAG == null'
      when: on_success

manual-uat:worker:
  extends: .worker_template
  stage: manual-uat
  variables:
    DEVOPS_DEPLOY_NAME: "manual-uat"
  needs:
    - docker-build:worker
  script:
    - echo 触发飞书信息测试人员审核 Worker
    - echo $DOCKER_IMAGE
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'

# 不设 DEVOPS_DEPLOY_NAME，用默认 CI_JOB_NAME（deploy-uat:worker），便于平台在飞书点「部署」时找到并触发本 job
deploy-uat:worker:
  extends: .worker_template
  stage: deploy-uat
  needs:
    - docker-build:worker
  script:
    - echo 触发运维平台部署uat Worker
    - echo $DOCKER_IMAGE
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'
      when: manual

check-branch:worker:
  extends: .worker_template
  stage: check
  script:
    - |
      git fetch origin ${CHECK:-main}
      CURRENT_COMMIT=$(git rev-parse HEAD)
      MASTER_COMMIT=$(git rev-parse origin/${CHECK:-main})
      if git merge-base --is-ancestor $CURRENT_COMMIT $MASTER_COMMIT; then
          echo -e "\\033[42mCurrent commit is merged into ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit is not merged into ${CHECK:-main}\\033[0m";
          exit 1;
      fi
      if git merge-base --is-ancestor $MASTER_COMMIT $CURRENT_COMMIT; then
          echo -e "\\033[42mCurrent commit contains the latest ${CHECK:-main}\\033[0m";
      else
          echo -e "\\033[31mCurrent commit does not contain the latest ${CHECK:-main}\\033[0m";
          exit 1;
      fi
  tags:
    - k8s-runner-zjk-svc
  needs:
    - deploy-uat:worker
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'

manual-online:worker:
  extends: .worker_template
  stage: manual-online
  needs:
    - check-branch:worker
  script:
    - echo 触发飞书审批,运维通过后人工部署生产环境 Worker
    - echo $DOCKER_IMAGE
    - *curl_worker
    - cat result.json
    - if [[ $(cat result.json | jq '.code') -ne 10000 ]];then exit 1;fi
  tags:
    - k8s-runner-zjk-svc
  rules:
    - if: '$CI_COMMIT_TAG =~ /_matmaster-evo-worker_/'
      when: manual
