# Release Gate Cases
# 从线上 session 中筛选的端到端计算 case，用于上线前回归。
# 通过标准：丝滑完成（无 retry、无走弯路、结果正确）。
#
# 数据来源：prod 轨迹分析 2026-02 ~ 2026-05

version: 2
cases:

  # ─── 结构构建 ─────────────────────────────────────────────────────────

  - id: rg_01
    title: "CeO₂(111) Tasker 分类"
    prompt: "构建CeO₂的(111)表面slab，分析其Tasker极性分类并输出分类结果"
    source_session: "d359bf02-268c-4930"
    notes: "测 Tasker Type 识别（应为 Type 2）。线上错分为 Type 1。"

  - id: rg_02
    title: "MgO 掺 Al（异价替换）"
    prompt: "构建MgO掺4%Al的超胞结构，用于DFT计算"
    source_session: "d268fd78-07ce-4dbe"
    notes: "测异价掺杂电荷补偿。线上没做 Mg 空位补偿，交付了 +4e 结构。"

  - id: rg_03
    title: "CrMnFeCoNi HEA SQS"
    prompt: "构建CrMnFeCoNi等摩尔高熵合金的SQS结构，FCC基体，至少100个原子"
    source_session: "19a75417e6e042f4a82eed65125fd777"
    notes: "测 icet SQS 生成。线上丝滑完成。"

  - id: rg_04
    title: "LDPE 非晶构建 + MD"
    prompt: "构建低密度聚乙烯(LDPE)的非晶结构并做分子动力学优化"
    source_session: "c9913871165c4ec0"
    notes: "测 PACKMOL 使用 + 密度验证。线上最终密度 0.002（应 ~0.92）。"

  # ─── DPA / MLIP 计算 ──────────────────────────────────────────────────

  - id: rg_05
    title: "石墨烯单轴拉伸 (LAMMPS)"
    prompt: "用LAMMPS模拟石墨烯的单轴拉伸，使用AIREBO势函数，输出应力-应变曲线"
    source_session: "ddca85e6b2984eca915b29fcb0941739"
    notes: "测经典 MD (LAMMPS) 端到端流程。线上丝滑完成：AIREBO + velocity 拉伸。"

  - id: rg_06
    title: "CO/Pt(111) 吸附能 (DPA)"
    prompt: "计算CO分子在Pt(111)表面的吸附能，使用机器学习力场"
    source_session: "179f12c0-5ad1-4918-a6fc-424260e7aa89"
    notes: "测 OC22 head 选择 + slab 构建 + 吸附能计算。线上丝滑。"

  - id: rg_07
    title: "Zn 盐溶液 DP-MD"
    prompt: "用分子动力学模拟比较ZnSO₄、ZnCl₂、Zn(ClO₄)₂三种锌盐水溶液的径向分布函数和扩散系数"
    source_session: "c78501d0747e4b50"
    notes: "测多体系溶液建模 + DPA3 使用。线上做了 22 次文献搜索从未提交计算。"

  - id: rg_08
    title: "LiVCl₆ 离子电导率"
    prompt: "找到LiVCl₆的晶体结构，通过分子动力学模拟计算其离子电导率"
    source_session: "55db4f96e7064166ad59bdce28d878d0"
    notes: "测多温度 MD + Arrhenius + sanity check。线上 D 非单调但未指出。"

  # ─── ABACUS 第一性原理 ─────────────────────────────────────────────────

  - id: rg_09
    title: "Pt(111) 功函数 (ABACUS)"
    prompt: "计算Pt(111)表面的功函数"
    source_session: "fffc5ed31dd446d0b81f08b9b2136395"
    notes: "测 ABACUS cal_work_function 全流程。线上丝滑。"

  - id: rg_10
    title: "CO/Pt(111) 吸附能 (ABACUS)"
    prompt: "用ABACUS计算CO在Pt(111)表面的吸附能"
    source_session: "e6e7b0a3-e154-4aef"
    notes: "测 ABACUS 能量单位理解。线上把 eV 误认为 Hartree，得到 -22.7 eV。"

  - id: rg_11
    title: "Al 能带结构 (ABACUS)"
    prompt: "计算Al的能带结构"
    source_session: "c41e63a321c34b67af3d8ece70f796db"
    notes: "测 KPT Line 格式。线上 nk=0 导致 4 次提交失败。"

  # ─── 复合工作流 ─────────────────────────────────────────────────────────

  - id: rg_12
    title: "Zn 表面 H 吸附自由能"
    prompt: "构建Zn几种常见晶相的表面模型，计算各晶面表面能以筛选最稳定晶面，进而计算该晶面不同位点的H吸附自由能，并进行分析与绘图"
    source_session: "33f8f39ac00c4f53bb305f3351606bd4"
    notes: "测多步工作流 + 吸附位点验证。线上 bridge H 弛豫到 hollow 未被发现。"

  - id: rg_13
    title: "ZnO/TiO₂ CO 吸附对比"
    prompt: "计算氧化锌和二氧化钛结构，构建平板模型，计算CO在平板模型上的吸附结构，比较结果并写作"
    source_session: "6a351576c27b4cd28608307eb8694d7c"
    notes: "测多材料对比工作流。线上正确完成，选面+Lewis 酸性解释合理。"

  - id: rg_14
    title: "HEA 热力学参数预测"
    prompt: "计算AlCr₀.₈CoFeNi高熵合金体系的价电子浓度、混合焓、混合熵、原子尺寸差异参数，并预测该体系是否可以形成固溶体以及可能的晶体结构"
    source_session: "7f48cebe5cb544c39ab1f8adff4ceb7f"
    notes: "测 HEA 热力学公式计算。线上 24 events 全部正确。"

  - id: rg_15
    title: "FeNC 单原子催化 ORR 建模"
    prompt: "帮我建立一个单原子催化剂FeNC的模型，然后根据ORR的反应中间体搭建几个中间体的模型，具体理论细节与建模细节自己去查文献"
    source_session: "653b67b5c0b24de48dc6ee10a1fc57da"
    notes: "测文献驱动的复杂建模。线上用了偏小的 4x4 超胞。"
