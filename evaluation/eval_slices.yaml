    quick_count: 1
    full_slices: same
    full_count: 1

  # ── Tools ───────────────────────────────────────────────────────────

  - target: "Tool: mcp-mat-struct-db"
    type: tool
    quick_slices:
      - structure_retrieval@meta_database
    quick_count: 7
    full_slices:
      - structure_retrieval
    full_count: 8

  - target: "Tool: Bohrium batch/sweep"
    type: tool
    quick_slices:
      - batch_processing
    quick_count: 4
    full_slices:
      - batch_processing
      - workflow_orchestration@wf_batch
