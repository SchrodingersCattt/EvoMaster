    full_count: 44

  - target: "Skill: xrd + checkcif"
    type: skill
    quick_slices:
      - scientific_analysis@char_xrd
      - scientific_analysis@char_cif_validation
    quick_count: 4
    full_slices: same
    full_count: 4

  - target: "Skill: data-analysis"
    type: skill
    quick_slices:
      - data_diagnosis
    quick_count: 3
    full_slices: same
    full_count: 3

  - target: "Skill: cp2k"
    type: skill
    quick_slices:
      - input_generation@cp2k
    quick_count: 1
    full_slices: same
    full_count: 1

  - target: "Skill: lammps"
