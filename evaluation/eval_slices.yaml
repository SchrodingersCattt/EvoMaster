# eval_slices.yaml — Maps each skill / tool / prompt to its evaluation slices.
#
# Slice notation:  <capability>@<tag>
#   capability = question_bank subdirectory (input_generation, workflow_orchestration, …)
#   tag        = question-level tag used to filter (vasp, abacus, code_mlip, …)
#   When no @tag, the entire capability directory is the slice.
#
# quick_slices:  minimum set for fast iteration feedback
# full_slices:   quick + additional slices for comprehensive validation
#                "same" means full == quick (no extra slices)

version: "v1"

slices:

  # ── Skills ──────────────────────────────────────────────────────────

  - target: "Skill: vasp"
    type: skill
    quick_slices:
      - input_generation@vasp
    quick_count: 20
    full_slices:
      - input_generation@vasp
      - workflow_orchestration@vasp
    full_count: 24

  - target: "Skill: abacus"
    type: skill
    quick_slices:
      - input_generation@abacus
    quick_count: 6
    full_slices:
      - input_generation@abacus
      - workflow_orchestration@abacus
    full_count: 13

  - target: "Skill: gpumd"
    type: skill
    quick_slices:
      - input_generation@gpumd
    quick_count: 11
    full_slices: same
    full_count: 11

  - target: "Skill: mlips"
    type: skill
    quick_slices:
      - workflow_orchestration@code_mlip
    quick_count: 13
    full_slices:
      - workflow_orchestration@code_mlip
      - input_generation@code_mlip
      - input_generation@code_dpa
    full_count: 24

  - target: "Skill: atomic-structure"
    type: skill
    quick_slices:
      - structure_construction
    quick_count: 11
    full_slices: same
    full_count: 11

  - target: "Skill: tasker-polar-surface"
    type: skill
    quick_slices:
      - structure_construction@phy_surface
    quick_count: 5
    full_slices:
      - structure_construction@phy_surface
