    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: WO_general_planning_003_20260410v3
  capability: workflow_orchestration
  domain: general
  intent: Produce phased execution and resource-control artifacts with explicit branch
    conditions and stop-loss policy.
  human_prompt_seed: |
    工作区已提供 `mission_constraints.json`。

    请先读取该文件，再生成：
    1) `execution_plan.json`：分阶段计划（输入/输出/并行性/决策点）；
    2) `resource_budget.json`：高开销步骤、估计耗时、简化策略；
    3) `stage_gate.md`：写清“先筛选再深入计算”的 gate 规则和最终报告结构。
    4) `stop_loss.md`：定义触发停止条件（时间/资源/质量）与应急降级方案。
  tags:
  - userlog_derived
  - workflow_planning
  - materials_computation
  - task_decomposition
  mode_scope:
  - direct
  - planner
  data_files:
  - key: mission_constraints
    path: data/WO_general_userlog_007_20260410v3/mission_constraints.json
    oss_url: ''
    description: Scope, budgets, and priorities for staged workflow planning.
  reference_answers:
  - key: execution_plan_artifact
    value: execution_plan.json
  - key: resource_budget_artifact
    value: resource_budget.json
  - key: stage_gate_artifact
    value: stage_gate.md
  - key: stop_loss_artifact
    value: stop_loss.md
  - key: execution_required_tokens
    value:
      filename: execution_plan.json
      tokens:
      - screening
      - deep_calculation
      - reporting
      - inputs
      - outputs
      - parallel
      - decision_gate
      flags: i
  - key: budget_required_tokens
    value:
      filename: resource_budget.json
      tokens:
      - expensive_steps
      - estimated_hours
      - simplification_strategies
      flags: i
  - key: stage_gate_required_tokens
    value:
      filename: stage_gate.md
      tokens:
      - 先筛选再深入计算
      - 并行
      - 报告结构
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
