  - eos_fit
  - numeric_postprocess
  - bulk_modulus
  mode_scope:
  - direct
  - planner
  data_files:
  - key: ev_table
    path: data/DF_mech_001/ev_curve.json
    oss_url: ''
    description: Energy-volume data points for EOS fitting.
  reference_answers:
  - key: v0_A3
    value: 162.0
    tolerance: 2.0
  - key: b0_GPa
    value: 92.0
    tolerance: 12.0
  - key: required_fields
    value:
    - v0
    - b0
    - fit_quality
  - key: turn_budget
    value: &id000
      max: 8
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 8000
  scoring_checklist:
