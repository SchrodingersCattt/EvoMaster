    verify: token_budget
- id: DF_mech_002_20260404
  capability: scientific_analysis
  domain: mech
  intent: From MSST Hugoniot simulation data, fit the P-V Hugoniot curve and determine C-J detonation velocity and pressure
    for RDX.
  human_prompt_seed: '读取 `msst_hugoniot.json`，其中包含 RDX 在不同冲击波速度下的 MSST 模拟数据 （压力、比容、温度、是否反应）。筛选完全反应的数据点，拟合 P-V Hugoniot 曲线，
    通过 Rayleigh 线切线法确定 Chapman-Jouguet (C-J) 点，输出 C-J 爆速 (m/s) 和爆压 (GPa)。

    '
  tags:
  - hugoniot_fit
  - detonation
  - cj_point
  - energetic_materials
  priority: P0
  mode_scope:
  - direct
  - planner
  data_files:
  - key: msst_data
    path: data/DF_mech_002/msst_hugoniot.json
    oss_url: ''
    description: MSST simulation data at multiple shock velocities for RDX.
  reference_answers:
  - key: cj_velocity_m_s
    value: 8750.0
    tolerance: 300.0
  - key: cj_pressure_GPa
    value: 34.0
    tolerance: 5.0
  - key: required_fields
    value:
    - cj_velocity
    - cj_pressure
    - hugoniot_fit
    - rayleigh_line
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: cj_velocity_m_s
    criterion: C-J detonation velocity is within tolerance.
    axis: correctness
    verify: numerical_range
  - id: cj_pressure_GPa
    criterion: C-J detonation pressure is within tolerance.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Includes Hugoniot curve fitting details, Rayleigh line analysis, and C-J velocity/pressure values.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: C-J parameters are derived from the provided msst_hugoniot.json data, with filtered reaction-complete points
      shown. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Hugoniot fitting and C-J determination are performed in a direct computation pipeline without unnecessary retries.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: DF_mech_pressure_003_20260410v3
  capability: scientific_analysis
  domain: mech
  intent: Produce structured mechanical-pressure estimation with sensitivity analysis and go/no-go recommendation.
  human_prompt_seed: '工作区已提供 `implant_params.json`。


    请先读取该文件，再生成：

    1) `calc_sheet.json`：包含 `load_N`, `contact_area_mm2`, `pressure_MPa`, `formula`；

    2) `estimation_report.md`：包含参数表、公式、计算步骤、不确定性来源、验证建议。

    3) `sensitivity_note.md`：对 `load_N` 和 `contact_area_mm2` 各做 ±10% 扰动，说明压力变化方向与量级。


    说明：

    - 可用关系 `pressure_MPa = load_N / contact_area_mm2`（N/mm^2 = MPa）；

    - 不要使用文件外的虚构参数。

    '
  tags:
  - userlog_derived
  - mechanical_estimation
  - biomedical
  mode_scope:
  - direct
  - planner
  data_files:
  - key: implant_params
    path: data/WO_general_userlog_004_20260410v3/implant_params.json
    oss_url: ''
    description: Minimal parameter set for interface pressure estimation.
  reference_answers:
  - key: calc_sheet_artifact
    value: calc_sheet.json
  - key: estimation_report_artifact
    value: estimation_report.md
  - key: sensitivity_artifact
    value: sensitivity_note.md
  - key: calc_sheet_required_tokens
    value:
      filename: calc_sheet.json
      tokens:
      - load_N
      - contact_area_mm2
      - pressure_MPa
      - formula
      flags: i
  - key: pressure_value_regex
    value:
      filename: calc_sheet.json
      pattern: '"pressure_MPa"\s*:\s*3(?:\.0+)?\b'
      flags: i
  - key: estimation_report_required_tokens
    value:
      filename: estimation_report.md
      tokens:
      - 参数
      - 公式
      - 不确定性
      - 验证建议
      - MPa
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: calc_sheet_artifact
    criterion: Agent writes `calc_sheet.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: estimation_report_artifact
    criterion: Agent writes `estimation_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: sensitivity_artifact
    criterion: Agent writes `sensitivity_note.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: calc_sheet_required_tokens
    criterion: Calculation sheet JSON includes required keys.
    axis: correctness
    verify: text_file_contains_all
  - id: pressure_value_regex
    criterion: Calculation sheet reports pressure around 3 MPa from provided parameters.
    axis: correctness
    verify: text_file_regex
  - id: estimation_report_required_tokens
    criterion: Report includes formula, units, uncertainty discussion, and validation suggestions.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The estimate is grounded in `implant_params.json` and avoids fabricated non-provided parameters.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The workflow is delivered in a compact engineering format without unnecessary digressions.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
