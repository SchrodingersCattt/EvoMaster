version: v5
capability: workflow_orchestration
domain: struct
questions:
- id: WO_mlip_dpa_001_20260411v2
  capability: workflow_orchestration
  domain: struct
  intent: Optimize diamond Si with DPA ML potential (cell + atoms), report lattice constant and energy per atom.
  human_prompt_seed: |
    使用 DPA 机器学习势对金刚石结构 Si 进行结构优化。
    从数据库获取或构建 Si 金刚石原胞（空间群 Fd-3m, a≈5.43 Å），
    做含晶格弛豫的全优化（原子坐标 + 晶格），力收敛判据 0.01 eV/Å。
    报告优化后的晶格常数 a (Å) 和总能量 (eV/atom)。
  tags:
  - mlip
  - dpa
  - optimization
  - silicon
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: lattice_a_A
    value: 5.43
    tolerance: 0.15
  - key: required_fields
    value:
    - lattice_constant
    - energy_per_atom
    - convergence_status
  - key: turn_budget
    value: &tb_default
      max: 18
  - key: duration_budget
    value: &db_default
      max: 7200000
  - key: token_budget_total
    value: &tkb_default
      max: 8000
  scoring_checklist:
  - id: lattice_a_A
    criterion: Optimized Si lattice constant is within tolerance of experimental/DPA value (~5.43 Å).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes optimized lattice constant, energy per atom, and convergence status (converged or max steps reached).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The reported lattice constant and energy values are tied to computation outputs stated in the answer, not textbook recall or invented numbers. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical optimization submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Workflow (fetch/build structure → submit optimization → parse result) completes without unnecessary exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget

- id: WO_mlip_dpa_002_20260411v2
  capability: workflow_orchestration
  domain: mech
  intent: Compute elastic constants for Cu FCC with DPA; report C11, C12, and bulk modulus.
  human_prompt_seed: |
    计算 FCC Cu 的弹性常数。
    从数据库获取或构建 Cu FCC 原胞，先做含晶格弛豫的结构优化（力收敛 0.01 eV/Å），
    再用 DPA 机器学习势计算弹性张量。
    报告 C11、C12 (GPa) 和 Voigt-Reuss-Hill 体模量 B (GPa)。
  tags:
  - mlip
  - dpa
  - elastic
  - copper
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: C11_GPa
    value: 170.0
    tolerance: 25.0
  - key: bulk_modulus_GPa
    value: 140.0
    tolerance: 20.0
  - key: required_fields
    value:
    - C11
    - C12
    - bulk_modulus
    - elastic_tensor
  - key: turn_budget
    value: &tb_elastic
      max: 20
  - key: duration_budget
    value: *db_default
  - key: token_budget_total
    value: *tkb_default
  scoring_checklist:
  - id: C11_GPa
    criterion: Cu C11 elastic constant is within tolerance of DPA/experimental value (~170 GPa).
    axis: correctness
    verify: numerical_range
  - id: bulk_modulus_GPa
    criterion: Cu bulk modulus is within tolerance (~140 GPa).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes C11, C12 values, bulk modulus, and at least a summary of the 6×6 elastic tensor.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Elastic constants are derived from calculation outputs, not literature values. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical elastic or optimization submissions.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Workflow (build → optimize → elastic calc → report) completes in a linear pipeline without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget

