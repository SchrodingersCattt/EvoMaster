      filename: onboarding_tutorial.md
      tokens:
      - 环境
      - 安装
      - 初始数据
      - 训练
      - 采样
      - 标注
      - 迭代
      - 失败点
      - 第一周
      flags: i
  - key: checklist_required_tokens
    value:
      filename: dpgen_checklist.json
      tokens:
      - env_ready
      - data_ready
      - train_ready
      - sample_ready
      - label_ready
      - iter_ready
      - week1_plan
