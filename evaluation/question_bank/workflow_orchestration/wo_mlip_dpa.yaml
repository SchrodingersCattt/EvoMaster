version: v5
capability: workflow_orchestration
domain: struct
questions:
- id: WO_mlip_dpa_001_20260411v2
  capability: workflow_orchestration
  domain: struct
  intent: Optimize diamond Si with DPA ML potential (cell + atoms), report lattice
    constant and energy per atom.
  human_prompt_seed: |
    使用 DPA 机器学习势对金刚石结构 Si 进行结构优化。
    从数据库获取或构建 Si 金刚石原胞（空间群 Fd-3m, a≈5.43 Å），
    做含晶格弛豫的全优化（原子坐标 + 晶格），力收敛判据 0.01 eV/Å。
    报告优化后的晶格常数 a (Å) 和总能量 (eV/atom)。
  tags:
  - mlip
  - dpa
  - optimization
  - silicon
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: lattice_a_A
    value: 5.43
    tolerance: 0.15
  - key: required_fields
    value:
    - lattice_constant
    - energy_per_atom
    - convergence_status
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: lattice_a_A
    criterion: Optimized Si lattice constant is within tolerance of experimental/DPA
      value (~5.43 Å).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes optimized lattice constant, energy per atom, and convergence
      status (converged or max steps reached).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The reported lattice constant and energy values are tied to computation
      outputs stated in the answer, not textbook recall or invented numbers. Judge
      solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical optimization submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Workflow (fetch/build structure → submit optimization → parse result)
      completes without unnecessary exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_007_20260410v3
  capability: workflow_orchestration
  domain: struct
  intent: Build a machine-checkable DP-GEN onboarding package with milestone gates
    and fallback actions from provided doc excerpts.
  human_prompt_seed: |
    工作区已提供 `dpgen_docs_brief.md`（文档摘录）。

    请先读取该文件，再输出以下三个交付物：
    1) `onboarding_tutorial.md`：包含环境准备、安装、初始数据、训练、采样、标注、迭代、常见失败点、第一周计划。
    2) `dpgen_checklist.json`：包含键 `env_ready`, `data_ready`, `train_ready`, `sample_ready`, `label_ready`, `iter_ready`, `week1_plan`.
    3) `milestone_gate.md`：按 Day1~Day7 给出“通过条件 + 失败回退动作（fallback）”。

    最终回答中简要说明你如何把文档摘录转为可执行 onboarding，并指出最高风险环节。
  tags:
  - userlog_derived
  - dpgen
  - onboarding
  - loop_oriented
  mode_scope:
  - direct
  - planner
  data_files:
  - key: dpgen_docs
    path: data/WO_general_userlog_001_20260410v3/dpgen_docs_brief.md
    oss_url: ''
    description: DP-GEN documentation excerpts for onboarding conversion.
  reference_answers:
  - key: tutorial_artifact
    value: onboarding_tutorial.md
  - key: checklist_artifact
    value: dpgen_checklist.json
  - key: milestone_gate_artifact
    value: milestone_gate.md
  - key: required_sections
    value:
      filename: onboarding_tutorial.md
      tokens:
      - 环境
      - 安装
      - 初始数据
      - 训练
      - 采样
      - 标注
      - 迭代
      - 失败点
      - 第一周
      flags: i
  - key: checklist_required_tokens
    value:
      filename: dpgen_checklist.json
      tokens:
      - env_ready
      - data_ready
      - train_ready
      - sample_ready
      - label_ready
      - iter_ready
      - week1_plan
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: tutorial_artifact
    criterion: Agent writes `onboarding_tutorial.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: checklist_artifact
    criterion: Agent writes `dpgen_checklist.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: milestone_gate_artifact
    criterion: Agent writes `milestone_gate.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_sections
    criterion: Tutorial covers core DP-GEN lifecycle sections and practical first-week
      guidance.
    axis: correctness
    verify: text_file_contains_all
  - id: checklist_required_tokens
    criterion: Checklist JSON includes required readiness keys.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: Tutorial is grounded in `dpgen_docs_brief.md` and avoids unsupported
      claims not present in provided excerpts.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The response converges to required deliverables without unnecessary
      exploratory detours.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_011_20260411v1
  capability: workflow_orchestration
  domain: struct
  intent: Build and validate Nb-doped SrTiO3 supercell workflow, including relaxation
    and lattice-dynamics/mechanics checks.
  human_prompt_seed: |
    评估 Nb 掺杂 SrTiO3 工作流（Mock版）：
    1. 先 query/检索立方 SrTiO3（Pm-3m）输入结构，并说明 2x2x2 超胞 + 1 Ti->Nb 掺杂方案；
    2. 梳理后续检查所需输入文件（relax/elastic/phonon/SCF/band-DOS）；
    3. 不做真实计算，使用以下 mock 检查结果：
       - elastic_status = pass
       - phonon_status = pass_no_imaginary
       - scf_status = converged
       - band_dos_status = generated
       - relax_energy_drop_eV = 1.84
    4. 基于 mock 值做后处理，判断是否通过电子结构分析前置检查。

    请输出：
    1) `srti03_nb125_relaxed.cif`：用于记录工作流引用的结构文件；
    2) `srti03_nb125_checks.json`：至少包含 `input_files`, `elastic_status`, `phonon_status`, `scf_status`, `band_dos_status`；
    3) `srti03_nb125_workflow_report.md`：说明 query 输入梳理、mock 后处理流程、关键观察与不确定性。

    最终回答请明确：该掺杂体系是否通过“可进入电子结构分析”的前置检查。
  tags:
  - userlog_derived
  - srti03
  - doping
  - elastic
  - phonon
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: relaxed_struct
    value: srti03_nb125_relaxed.cif
  - key: checks_json
    value: srti03_nb125_checks.json
  - key: workflow_report
    value: srti03_nb125_workflow_report.md
  - key: checks_tokens
    value:
      filename: srti03_nb125_checks.json
      tokens:
      - elastic_status
      - phonon_status
      - scf_status
      - band_dos_status
      flags: i
  - key: report_tokens
    value:
      filename: srti03_nb125_workflow_report.md
      tokens:
      - 超胞
      - 掺杂
      - 几何优化
      - 弹性
      - 声子
      - 不确定性
      flags: i
  - key: relax_energy_drop_mock
    value: 1.84
    tolerance: 0.8
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: relaxed_struct
    criterion: Agent writes optimized doped structure `srti03_nb125_relaxed.cif`.
    axis: correctness
    verify: artifact_exists
  - id: checks_json
    criterion: Agent writes `srti03_nb125_checks.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: workflow_report
    criterion: Agent writes `srti03_nb125_workflow_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: checks_tokens
    criterion: Check JSON includes elastic/phonon/SCF/band-DOS status fields.
    axis: correctness
    verify: text_file_contains_all
  - id: report_tokens
    criterion: Report covers doping workflow and caveats for downstream electronic
      analysis.
    axis: correctness
    verify: text_file_contains_all
  - id: relax_energy_drop_mock
    criterion: Final answer includes a mock relaxation energy drop near 1.84 eV.
    axis: correctness
    verify: numerical_range
  - id: grounding_source
    criterion: Deliverables are grounded in generated workflow outputs and avoid fabricated
      stability claims.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical workflow submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
