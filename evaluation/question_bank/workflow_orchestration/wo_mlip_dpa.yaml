  - id: bulk_modulus_GPa
    criterion: Cu bulk modulus is within tolerance (~140 GPa).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes C11, C12 values, bulk modulus, and at least a summary of the 6×6 elastic tensor.
    axis: correctness
    verify: llm_binary_judge
  - id: used_structure_source
    criterion: Used structure database or builder tool to obtain Cu FCC structure.
    axis: grounding
    verify: tool_called
  - id: used_mlip_calc
    criterion: Used MLIPs calculator (via Bohrium job submission) for both optimization and elastic constant calculation.
    axis: grounding
    verify: tool_called
  - id: grounding_source
    criterion: Elastic constants are derived from calculation outputs, not literature values. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical elastic or optimization submissions.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
