  - key: used_mlip_calc
    value:
    - execute_bash
  - key: C11_GPa
    value: 170.0
    tolerance: 25.0
  - key: bulk_modulus_GPa
    value: 140.0
    tolerance: 20.0
  - key: required_fields
    value:
    - C11
    - C12
    - bulk_modulus
    - elastic_tensor
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
