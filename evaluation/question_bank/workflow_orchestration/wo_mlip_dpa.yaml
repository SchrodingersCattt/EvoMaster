    - mat_sg_make_defect_structure
  - key: used_mlip_calc
    value:
    - execute_bash
  - key: forward_barrier_eV
    value: 0.7
    tolerance: 0.2
  - key: required_fields
    value:
    - initial_state
    - final_state
    - forward_barrier
    - energy_profile
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
