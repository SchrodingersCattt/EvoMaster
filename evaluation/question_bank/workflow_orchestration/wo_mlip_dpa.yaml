- id: WO_mlip_dpa_004_20260411v2
  capability: workflow_orchestration
  domain: thermo
  intent: Run two-stage MD (NVT equilibration + NPT production) on Al FCC supercell with DPA; report average temperature and pressure.
  human_prompt_seed: |
    对 FCC Al 进行分子动力学模拟。
    从数据库获取或构建 Al FCC 原胞，扩展为至少 2×2×2 超胞，
    使用 DPA 机器学习势按以下流程运行：
    1) NVT 平衡：300 K，2 ps
    2) NPT 采样：300 K，0 GPa，5 ps
    报告 NPT 阶段的平均温度 (K) 和平均压力 (GPa)。
  tags:
  - mlip
  - dpa
  - molecular_dynamics
  - aluminum
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: avg_temperature_K
    value: 300.0
    tolerance: 30.0
  - key: required_fields
    value:
    - supercell_size
    - md_stages
    - avg_temperature
    - avg_pressure
  - key: turn_budget
    value: *tb_elastic
  - key: duration_budget
    value: *db_default
  - key: token_budget_total
    value: *tkb_default
  scoring_checklist:
  - id: avg_temperature_K
    criterion: NPT average temperature is within tolerance of target 300 K.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes supercell dimensions, MD stage definitions (NVT + NPT with parameters), average temperature, and average pressure from the NPT stage.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Temperature and pressure values are extracted from MD simulation outputs, not guessed. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical MD submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: MD workflow (build supercell → configure stages → submit → parse thermo) completes without unnecessary exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget

- id: WO_mlip_dpa_005_20260411v2
  capability: workflow_orchestration
  domain: kinetic
  intent: Compute Cu FCC single-vacancy migration barrier with DPA via NEB; report forward barrier energy.
  human_prompt_seed: |
    计算 FCC Cu 中单空位的迁移能垒。
    从数据库获取或构建 Cu FCC 原胞，扩展为 3×3×3 超胞，
    移除一个原子形成空位结构作为初态，将相邻原子移至空位位置形成末态。
    分别优化初态和末态结构，然后使用 DPA 机器学习势做 NEB 计算（5 个中间像）。
    报告正向迁移能垒 (eV) 和能量曲线趋势。
  tags:
  - mlip
  - dpa
  - neb
  - vacancy
  - copper
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: forward_barrier_eV
    value: 0.7
    tolerance: 0.2
  - key: required_fields
    value:
    - initial_state
    - final_state
    - forward_barrier
    - energy_profile
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value: *db_default
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: forward_barrier_eV
    criterion: Cu vacancy forward migration barrier is within tolerance (~0.7 eV).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes description of initial and final states, forward barrier value, and energy profile along the migration path.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The migration barrier is derived from NEB calculation outputs, not literature values. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical NEB or optimization submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: NEB workflow (build defect states → optimize endpoints → NEB → parse barrier) completes without unnecessary steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_007_20260410v3
  capability: workflow_orchestration
  domain: struct
  intent: Build a machine-checkable DP-GEN onboarding package with milestone gates and fallback actions from provided doc excerpts.
  human_prompt_seed: '工作区已提供 `dpgen_docs_brief.md`（文档摘录）。


    请先读取该文件，再输出以下三个交付物：

    1) `onboarding_tutorial.md`：包含环境准备、安装、初始数据、训练、采样、标注、迭代、常见失败点、第一周计划。

    2) `dpgen_checklist.json`：包含键 `env_ready`, `data_ready`, `train_ready`, `sample_ready`, `label_ready`, `iter_ready`, `week1_plan`.

    3) `milestone_gate.md`：按 Day1~Day7 给出“通过条件 + 失败回退动作（fallback）”。


    最终回答中简要说明你如何把文档摘录转为可执行 onboarding，并指出最高风险环节。

    '
  tags:
  - userlog_derived
  - dpgen
  - onboarding
  - loop_oriented
  mode_scope:
  - direct
  - planner
  data_files:
  - key: dpgen_docs
    path: data/WO_general_userlog_001_20260410v3/dpgen_docs_brief.md
    oss_url: ''
    description: DP-GEN documentation excerpts for onboarding conversion.
  reference_answers:
  - key: tutorial_artifact
    value: onboarding_tutorial.md
  - key: checklist_artifact
    value: dpgen_checklist.json
  - key: milestone_gate_artifact
    value: milestone_gate.md
  - key: required_sections
    value:
      filename: onboarding_tutorial.md
      tokens:
      - 环境
      - 安装
      - 初始数据
      - 训练
      - 采样
      - 标注
      - 迭代
      - 失败点
      - 第一周
      flags: i
  - key: checklist_required_tokens
    value:
      filename: dpgen_checklist.json
      tokens:
      - env_ready
      - data_ready
      - train_ready
      - sample_ready
      - label_ready
      - iter_ready
      - week1_plan
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: tutorial_artifact
    criterion: Agent writes `onboarding_tutorial.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: checklist_artifact
    criterion: Agent writes `dpgen_checklist.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: milestone_gate_artifact
    criterion: Agent writes `milestone_gate.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_sections
    criterion: Tutorial covers core DP-GEN lifecycle sections and practical first-week guidance.
    axis: correctness
    verify: text_file_contains_all
  - id: checklist_required_tokens
    criterion: Checklist JSON includes required readiness keys.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: Tutorial is grounded in `dpgen_docs_brief.md` and avoids unsupported claims not present in provided excerpts.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The response converges to required deliverables without unnecessary exploratory detours.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
