version: v5
capability: workflow_orchestration
domain: catalysis
questions:
- id: WO_elec_007_20260523
  capability: workflow_orchestration
  domain: catalysis
  intent: Compute Pd(111) work function end-to-end with ABACUS. Agent must build
    slab, set up SCF with correct potential output, submit to Bohrium, and extract
    work function from output. Tests whether agent correctly identifies vacuum level
    from electrostatic (Hartree) potential rather than total effective potential.
  human_prompt_seed: |
    使用 ABACUS 计算 Pd(111) 表面的功函数。

    结果写入 `work_function.json`：`{"work_function_eV": ..., "fermi_energy_eV": ..., "vacuum_level_eV": ...}`
  tags:
  - struct_surface
  - eng_abacus
  data_files: []
  reference_answers:
  - key: output_artifact
    value: work_function.json
  - key: wf_range
    value:
      filename: work_function.json
      key: work_function_eV
      min: 4.5
      max: 6.5
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value:
      max: 900000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `work_function.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: wf_range
    criterion: '[Must] Work function is within physically reasonable range for Pd(111)
      (experimental ~5.6 eV, PBE typically 5.2-5.8 eV). A value of ~36 eV indicates
      agent used total effective potential instead of electrostatic potential for
      vacuum level. A value <3 eV indicates wrong Fermi energy reference.'
    axis: correctness
    verify: json_file_numeric_range
    weight: 3.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock time within budget.
    axis: efficiency
    verify: duration_budget
- id: CR_WO_Ag_adsorption_20260412
  capability: workflow_orchestration
  domain: catalysis
  intent: Compute adsorption energies of six adsorbates on Ag(001) and Ag(011) at on-top sites
    using MLIP/calculator with consistent energy reference per doc 3.2.1.
  human_prompt_seed: '对 Ag 体相切出 (001) 与 (011) 两个表面；分别计算 H、CO、COOH、CO2、HCOO、HCOOH 六种吸附质在 on-top
    位点的吸附能。 使用 DP（或题目环境要求的等效势/计算器），并统一气相分子与体相/slab 的能量零点（说明 E_ads 定义与参考态）。 以表格汇总各体系吸附能（eV），并注明是否包含
    ZPE/熵校正（若未做，需明确写「仅电子能」）。

    '
  tags:
  - struct_surface
  - code_mlip
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 35
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 85000
  scoring_checklist:
  - id: workflow_setup
    criterion: 'Agent demonstrates correct computational approach: (a) builds or references
      Ag bulk structure, (b) cuts or describes cutting (001) and (011) surface slabs, (c)
      prepares or scripts adsorbate-slab structures for the six adsorbates (H, CO, COOH, CO2,
      HCOO, HCOOH), and (d) uses an MLIP/DP calculator or submits remote Bohrium computation
      jobs. A well-structured script, code, or submitted computation jobs satisfying these
      elements counts as pass even if final numerical results are not yet available (e.g.
      due to wall-clock timeout).'
    axis: correctness
    verify: llm_binary_judge
  - id: coverage_table
    criterion: '结果覆盖 Ag(001) 与 Ag(011)，六种吸附质（H, CO, COOH, CO2, HCOO, HCOOH），on-top 位点；给出吸附能数值表并定义能量参考（slab、气相）。NOTE:
      具体使用哪种计算器（DP、MACE-MP、或其他 MLIP）不是本条评判标准——只要结果覆盖齐全、参考态定义清楚即可。若答案中表格包含 markdown 分隔线（如 |:---:|），这是格式标记，不是截断。Judge
      on coverage completeness and reference definition only.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: grounding_workflow
    criterion: 从 Agent 的产物（脚本、代码、已提交的 Bohrium 计算任务、或最终叙述/表格）中能看出从体相/表面到吸附结构的合理计算链条。若有最终表格，则叙述与数值需自洽；若仅有脚本或计算作业提交记录，则代码逻辑须体现合理的结构构建与能量计算流程。未凭空列出与实际步骤无关的数值。
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_005_20260404
  capability: workflow_orchestration
  domain: catalysis
  intent: 'Compute CO adsorption energy on Ag(001): build slab, place molecule, use mock energies,
    calculate E_ads.'
  human_prompt_seed: "计算CO在Ag(001)表面的吸附能：\n1. 获取Ag FCC体相结构（a=4.085 Å），切出(001)表面slab（4层，15\
    \ Å真空，3×3扩胞）；\n2. 构建气相CO分子（键长约1.128 Å）；\n3. 在slab顶层ontop位点放置CO分子（C端朝下，初始距离~2.0 Å）构建吸附结构；\n\
    4. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_slab = -108.45 eV\n   - E_CO = -12.85 eV\n   - E_adsorbed\
    \ = -121.50 eV\n5. 按公式 E_ads = E(adsorbed) - E(slab) - E(CO) 计算吸附能；\n6. 输出吸附能(eV)及三个结构的能量值。\n"
  tags:
  - struct_surface
  priority: P0
  data_files: []
  reference_answers:
  - key: adsorption_energy_eV
    value: -0.2
    tolerance: 0.5
  - key: required_fields
    value:
    - E_slab
    - E_molecule
    - E_adsorbed
    - E_ads
    - adsorption_site
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: adsorption_energy_eV
    criterion: Adsorption energy is computed correctly from mock energies (~-0.2 eV).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes bare slab energy, isolated molecule energy, adsorbed system
      energy, and adsorption energy.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Adsorption energy computed with specified mock energies; structures built with
      physically correct parameters (lattice constant, bond length, slab geometry). Judge
      solely from the final answer; do not fail because the tool-call log omits MCP, web_search,
      or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Adsorption energy workflow (build slab → build molecule → place adsorbate →
      compute with mock values) completes without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_struct_001_20260404
  capability: workflow_orchestration
  domain: catalysis
  intent: Calculate surface energy of MgO(100) by constructing slab models and comparing with
    bulk.
  human_prompt_seed: '计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构， 先优化体相并获取单原子能量，然后切出 (100) 表面 slab（至少
    5 层）， 加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。 输出表面能 (J/m2)
    和计算过程中的关键能量值。

    '
  tags:
  - struct_surface
  data_files: []
  reference_answers:
  - key: surface_energy_J_m2
    value: 1.25
    tolerance: 0.35
  - key: required_fields
    value:
    - E_bulk_per_atom
    - E_slab
    - surface_area
    - surface_energy
    - convergence_check
  - key: turn_budget
    value: &wo_cat_struct_id001
      max: 18
  - key: duration_budget
    value: &wo_cat_struct_id002
      max: 7200000
  - key: token_budget_total
    value: &wo_cat_struct_id003
      max: 8000
  scoring_checklist:
  - id: surface_energy_J_m2
    criterion: Surface energy is in expected range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes bulk energy per atom, slab total energy, surface area, computed
      surface energy, and convergence check.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Surface energy is computed from stated bulk and slab total energies and area;
