- id: WO_abacus_ext_001_20260409
  capability: workflow_orchestration
  domain: elec
  intent: Analyze mock Bader-charge outputs for ionic vs metallic systems and quantify relative charge-transfer magnitude.
  human_prompt_seed: |
    读取 `case_bundle.json` 中两套体系的 Bader 电荷结果（NaCl 与 CoPt3）。

    请完成：
    1) 计算 NaCl 中 |q_Na|；
    2) 计算 CoPt3 中 |q_Co| / |q_Pt| 的比值（使用给定的平均原子电荷）；
    3) 判断哪一套体系表现出更强离子性，并给出一句理由。
  tags:
  - abacus
  - bader
  - charge_transfer
  mode_scope:
  - direct
  - planner
  data_files:
  - key: case_bundle
    path: data/WO_abacus_ext_001_20260409/case_bundle.json
    oss_url: ''
    description: Mock Bader charges for NaCl and CoPt3.
  reference_answers:
  - key: nacl_abs_na_charge_e
    value: 0.84
    tolerance: 0.05
  - key: copt_charge_ratio
    value: 2.3333
    tolerance: 0.15
  - key: ionic_system
    value: NaCl
  - key: required_fields
    value:
    - nacl_abs_charge
    - copt_ratio
    - ionic_system
    - brief_reason
  - key: turn_budget
    value: &id001
      max: 8
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: nacl_abs_na_charge_e
    criterion: Absolute Na Bader charge in NaCl is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: copt_charge_ratio
    criterion: "|q_Co|/|q_Pt| ratio in CoPt3 is correctly computed from provided averages."
    axis: correctness
    verify: numerical_range
  - id: ionic_system
    criterion: Correctly identifies NaCl as the more ionic system.
    axis: correctness
    verify: exact_match
  - id: required_fields
    criterion: Report includes NaCl absolute charge, CoPt3 ratio, ionic-system judgment, and one-sentence rationale.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All computed values and judgments are grounded in the provided case_bundle.json numbers, not generic chemistry recall.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget

- id: WO_abacus_ext_002_20260409
  capability: workflow_orchestration
  domain: elec
  intent: Post-process charge-density-difference integrals to quantify net transfer and asymmetry in an interface system.
  human_prompt_seed: |
    读取 `case_bundle.json`，其中给出了界面体系的电荷密度差积分结果：
    - 电子累积区积分（positive）
    - 电子耗尽区积分（negative）

    请完成：
    1) 计算净电荷转移量 Δq = positive + negative（单位 e）；
    2) 计算不对称比值 R = positive / |negative|；
    3) 根据题面给定的空间分区说明，判断电子主要从哪一侧转移到哪一侧，并简述依据。
  tags:
  - abacus
  - charge_density_difference
  - interface
  mode_scope:
  - direct
  - planner
  data_files:
  - key: case_bundle
    path: data/WO_abacus_ext_002_20260409/case_bundle.json
    oss_url: ''
    description: Mock charge-density-difference integrated values and region labels.
  reference_answers:
  - key: net_transfer_e
    value: 0.002
    tolerance: 0.01
  - key: asymmetry_ratio
    value: 1.016
    tolerance: 0.03
  - key: required_fields
    value:
    - net_transfer
    - asymmetry_ratio
    - transfer_direction
    - reasoning
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: net_transfer_e
    criterion: Net transfer charge is correctly computed from provided integrals.
    axis: correctness
    verify: numerical_range
  - id: asymmetry_ratio
    criterion: Positive/negative integral asymmetry ratio is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes net transfer, asymmetry ratio, transfer direction, and concise evidence-based explanation.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Transfer-direction conclusion is grounded in region definitions and integral signs in case_bundle.json.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget

- id: WO_abacus_ext_003_20260409
  capability: workflow_orchestration
  domain: elec
  intent: Compute work-function shift from vacuum potential and Fermi-level summaries for clean and adsorbed slabs.
  human_prompt_seed: |
    读取 `case_bundle.json`，其中包含 clean slab 和 adsorbed slab 的：
    - 真空能级 V_vac（eV）
    - 费米能级 E_F（eV）

    请完成：
    1) 分别计算两种表面的功函数 Φ = V_vac - E_F；
    2) 计算功函数变化量 ΔΦ = Φ_ads - Φ_clean；
    3) 判断吸附后功函数是升高还是降低，并给出简短物理解释（偶极方向/界面电荷重排角度）。
  tags:
  - abacus
  - work_function
  - surface
  mode_scope:
  - direct
  - planner
  data_files:
  - key: case_bundle
    path: data/WO_abacus_ext_003_20260409/case_bundle.json
    oss_url: ''
    description: Mock vacuum and Fermi levels for clean and adsorbed slabs.
  reference_answers:
  - key: phi_clean_eV
    value: 4.28
    tolerance: 0.05
  - key: phi_ads_eV
    value: 4.32
    tolerance: 0.05
  - key: delta_phi_eV
    value: 0.04
    tolerance: 0.05
  - key: required_fields
    value:
    - phi_clean
    - phi_ads
    - delta_phi
    - trend
    - brief_explanation
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: phi_clean_eV
    criterion: Clean-slab work function is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: phi_ads_eV
    criterion: Adsorbed-slab work function is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: delta_phi_eV
    criterion: Work-function shift ΔΦ is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes both work functions, ΔΦ, trend (increase/decrease), and concise physical interpretation.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Work-function results are grounded in case_bundle.json V_vac and E_F values with explicit formula usage.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
