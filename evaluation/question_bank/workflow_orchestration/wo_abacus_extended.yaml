- id: WO_abacus_ext_004_20260409
  capability: workflow_orchestration
  domain: kinetic
  intent: Derive zero-point energies from mock vibrational frequencies and compare scaled ZPE between molecules.
  human_prompt_seed: |
    读取 `case_bundle.json`，其中给出了 H2O 与 CO2 的振动频率（cm^-1）及统一缩放因子。

    请完成：
    1) 先按给定缩放因子修正频率，再计算两者的 ZPE（eV）；
    2) 计算两者 ZPE 差值 ΔZPE = ZPE(H2O) - ZPE(CO2)；
    3) 用一句话解释为何三原子分子的振动模数量和频率分布会影响 ZPE 大小。

    说明：可使用换算系数 1 cm^-1 = 1.23984e-4 eV。
  tags:
  - abacus
  - vibration
  - zpe
  mode_scope:
  - direct
  - planner
  data_files:
  - key: case_bundle
    path: data/WO_abacus_ext_004_20260409/case_bundle.json
    oss_url: ''
    description: Mock vibrational frequencies and scaling factor for H2O and CO2.
  reference_answers:
  - key: zpe_h2o_eV
    value: 0.5417
    tolerance: 0.02
  - key: zpe_co2_eV
    value: 0.2615
    tolerance: 0.02
  - key: delta_zpe_eV
    value: 0.2802
    tolerance: 0.02
  - key: required_fields
    value:
    - scaled_frequencies
    - zpe_h2o
    - zpe_co2
    - delta_zpe
    - brief_physical_note
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: zpe_h2o_eV
    criterion: Scaled H2O ZPE is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: zpe_co2_eV
    criterion: Scaled CO2 ZPE is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: delta_zpe_eV
    criterion: ZPE difference ΔZPE is correctly computed.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes scaled frequencies, both ZPE values, ΔZPE, and a brief physically consistent interpretation.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All ZPE numbers are grounded in frequencies and scaling factor from case_bundle.json with explicit conversion.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
