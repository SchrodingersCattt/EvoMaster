  - key: md_report_artifact
    value: li2o_md_report.md
  - key: summary_required_tokens
    value:
      filename: li2o_md_summary.json
      tokens:
      - ensemble
      - temperature_K
      - runtime_ps
      - timestep_fs
      - n_steps
      - thermo_stats
      - '300'
      - '1'
      flags: i
  - key: report_required_tokens
    value:
      filename: li2o_md_report.md
      tokens:
      - NVT
      - 300
      - 1 ps
      - 1 fs
      - 温度
      - 不确定性
      flags: i
  - key: temperature_avg_mock
    value: 301.2
    tolerance: 15.0
  - key: turn_budget
    value:
      max: 16
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
