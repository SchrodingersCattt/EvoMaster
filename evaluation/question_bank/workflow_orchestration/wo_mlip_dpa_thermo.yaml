version: v5
capability: workflow_orchestration
domain: thermo
questions:
- id: WO_mlip_dpa_003_20260411v2
  capability: workflow_orchestration
  domain: thermo
  intent: Compute phonon dispersion for Si diamond with DPA; report Gamma-point optical
    frequency and check for imaginary modes.
  human_prompt_seed: |
    计算金刚石结构 Si 的声子色散关系。
    从数据库获取或构建 Si 金刚石原胞，使用 DPA 机器学习势计算力常数矩阵，
    沿 Γ-X-K-Γ-L 高对称路径绘制声子色散曲线。
    报告 Γ 点最高光学支频率 (cm⁻¹) 以及是否存在虚频（判断动力学稳定性）。
  tags:
  - mlip
  - dpa
  - phonon
  - silicon
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: gamma_optical_max_cm1
    value: 520.0
    tolerance: 50.0
  - key: required_fields
    value:
    - dispersion_path
    - gamma_frequency
    - imaginary_check
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: gamma_optical_max_cm1
    criterion: Si Gamma-point highest optical phonon frequency is within tolerance
      (~520 cm⁻¹).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes phonon dispersion k-path specification, Gamma-point
      frequency value, and statement about presence/absence of imaginary modes.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The reported phonon frequency is tied to force-constant calculation
      outputs, not textbook values. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical phonon calculation submissions.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Phonon workflow (build → calculate force constants → dispersion → extract)
      completes without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_004_20260411v2
  capability: workflow_orchestration
  domain: thermo
  intent: Run two-stage MD (NVT equilibration + NPT production) on Al FCC supercell
    with DPA; report average temperature and pressure.
  human_prompt_seed: |
    对 FCC Al 进行分子动力学模拟。
    从数据库获取或构建 Al FCC 原胞，扩展为至少 2×2×2 超胞，
    使用 DPA 机器学习势按以下流程运行：
    1) NVT 平衡：300 K，2 ps
    2) NPT 采样：300 K，0 GPa，5 ps
    报告 NPT 阶段的平均温度 (K) 和平均压力 (GPa)。
  tags:
  - mlip
  - dpa
  - molecular_dynamics
  - aluminum
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: avg_temperature_K
    value: 300.0
    tolerance: 30.0
  - key: required_fields
    value:
    - supercell_size
    - md_stages
    - avg_temperature
    - avg_pressure
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: avg_temperature_K
    criterion: NPT average temperature is within tolerance of target 300 K.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes supercell dimensions, MD stage definitions (NVT + NPT
      with parameters), average temperature, and average pressure from the NPT stage.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Temperature and pressure values are extracted from MD simulation outputs,
      not guessed. Judge solely from the final answer.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical MD submissions with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: MD workflow (build supercell → configure stages → submit → parse thermo)
      completes without unnecessary exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_009_20260411v1
  capability: workflow_orchestration
  domain: thermo
  intent: Retrieve an MgB2 structure from open databases and compute its phonon spectrum
    with an ML potential workflow.
  human_prompt_seed: |
    执行 MgB2 “检索 + 声子”流程（Mock版）：
    1. 先 query/检索 MgB2 结构并记录来源、结构标识与输入文件；
    2. 说明拟采用的声子设置；
    3. 不做真实计算，使用以下 mock 结果：
       - retrieval_source = Materials Project
       - structure_identifier = mp-763
       - imaginary_mode_check = false
       - gamma_e2g_mode_meV = 74.8
       - output_artifacts = ["band.yaml", "dos.dat"]
    4. 基于 mock 值完成后处理并判断“结构与声子结果一致性”。

    请完成以下交付：
    1) `mgb2_phonon_summary.json`：至少包含 `input_files`, `retrieval_source`, `structure_identifier`, `phonon_settings`, `imaginary_mode_check`, `output_artifacts`；
    2) `mgb2_phonon_report.md`：说明 query 输入梳理、mock 后处理的两阶段流程、关键参数与不确定性。

    最终回答中请简要说明：检索到的结构与声子结果是否相互一致。
  tags:
  - mlip
  - dpa
  - mgb2
  - phonon
  - retrieval_plus_calc
  - userlog_derived
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: phonon_json
    value: mgb2_phonon_summary.json
  - key: phonon_report
    value: mgb2_phonon_report.md
  - key: json_required_tokens
    value:
      filename: mgb2_phonon_summary.json
      tokens:
      - retrieval_source
      - structure_identifier
      - phonon_settings
      - imaginary_mode_check
      - output_artifacts
      - MgB2
      flags: i
  - key: report_required_tokens
    value:
      filename: mgb2_phonon_report.md
      tokens:
      - 检索
      - MgB2
      - 声子
      - 参数
      - 不确定性
      flags: i
  - key: gamma_e2g_mock
    value: 74.8
    tolerance: 10.0
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: phonon_json
    criterion: Agent writes `mgb2_phonon_summary.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: phonon_report
    criterion: Agent writes `mgb2_phonon_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: json_required_tokens
    criterion: JSON includes retrieval metadata and phonon-result summary fields.
    axis: correctness
    verify: text_file_contains_all
  - id: report_required_tokens
    criterion: Report explains two-stage workflow and uncertainty caveats.
    axis: correctness
    verify: text_file_contains_all
  - id: gamma_e2g_mock
    criterion: Final answer includes a mock Gamma E2g mode near 74.8 meV.
    axis: correctness
    verify: numerical_range
  - id: grounding_source
    criterion: Final answer is grounded in both retrieval and phonon artifacts and
      does not fabricate unsupported structure/spectrum details.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Workflow proceeds compactly from retrieval to phonon computation and
      summary.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_mlip_dpa_008_20260411v1
  capability: workflow_orchestration
  domain: thermo
  intent: Run a short DPA molecular-dynamics simulation for Li2O at 300 K and summarize
    thermostat/time-step settings with trajectory statistics.
  human_prompt_seed: |
    执行 Li2O 短程 MD 流程评估（Mock版）：
    1. 先 query/检索并整理 MD 所需输入文件（结构、势函数、积分与控温参数）；
    2. 目标条件：300 K、1 ps、1 fs、NVT；
    3. 不做真实 MD，使用以下 mock 结果：
       - ensemble = NVT
       - temperature_K = 300
       - runtime_ps = 1.0
       - timestep_fs = 1.0
       - n_steps = 1000
       - thermo_stats = {"T_avg": 301.2, "T_std": 7.8, "drift": "small"}
    4. 基于 mock 值做后处理并判断是否满足目标条件。

    请完成以下交付：
    1) `li2o_md_summary.json`：至少包含 `input_files`, `ensemble`, `temperature_K`, `runtime_ps`, `timestep_fs`, `n_steps`, `thermo_stats`；
    2) `li2o_md_report.md`：说明 query 输入梳理、mock 后处理流程、关键观察与误差来源。

    最终回答中简要确认是否满足 300 K / 1 ps / 1 fs 三个条件。
