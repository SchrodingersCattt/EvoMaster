    请完成以下交付：\n1) `al2o3_bader_summary.json`：至少包含 `input_files`, `atom_index`, `element`, `bader_charge`,\
    \ `charge_transfer`；\n2) `al2o3_bader_report.md`：说明 query 输入梳理、mock 后处理流程、主要电荷转移趋势与不确定性。\n\
    \n最终回答中请简要总结 Al 与 O 的电荷转移方向，并标注为 mock 后处理结果。\n"
