  capability: workflow_orchestration
  domain: agnostic
  intent: Implement the iterative cluster expansion refinement loop that alternates between selecting
    optimal ECI via cross-validation minimization and selecting the next structure to compute via variance-reduction
    maximization, following the MAPS algorithm described in the paper.
  human_prompt_seed: 'Given initial_structures.csv (existing structures with energies and correlations),
    candidate_clusters.json (ordered list of candidate clusters to consider adding), and candidate_pool.csv
    (uncomputed candidate structures with correlations and costs), write a Python script ce_refinement.py
    that implements one iteration of the cluster expansion refinement loop: (1) For each physically meaningful
    subset of candidate clusters (respecting the diameter hierarchy rules), fit a cluster expansion and
    compute the CV score; (2) Select the cluster subset with the lowest CV score; (3) Using the selected
    cluster expansion, compute the variance-reduction gain for each candidate structure in the pool; (4)
    Select the structure with maximum gain. Output the selected cluster set and the recommended next structure
    to refinement_output.json.'
