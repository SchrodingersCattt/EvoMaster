  reference_answers:
  - key: scan_artifact
    value: scan.csv
  - key: scan_row_count
    value:
      filename: scan.csv
      pattern: ^\d+\.\d+
      flags: m
  - key: equilibrium_distance
    value:
      filename: scan.csv
      checks:
      - key: distance_A
        min: 1.35
        max: 1.65
  - key: dissociation_energy
    value:
      filename: scan.csv
      checks:
      - key: dissociation_energy_eV
        min: 2.0
        max: 5.0
