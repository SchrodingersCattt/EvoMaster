- id: WO_dpa4_neo_optimize_001_20260607
  capability: workflow_orchestration
  domain: agnostic
  intent: Optimize rocksalt MgO with a DPA4 model and derive its bulk modulus via
    an EOS fit. The prompt names only the model family (DPA4); the agent must resolve
    a concrete current DPA4 checkpoint from the mlips skill model table and run it
    on the dpa-calculator image, producing both a physical lattice constant and a
    physical bulk modulus — the latter cannot be copied from the prompt and requires
    actually running the model over several volumes.
  human_prompt_seed: |
    请使用 DPA4 机器学习势研究岩盐结构 MgO。

    要求：
    - 从数据库获取或构建 MgO 岩盐原胞（空间群 Fm-3m, a≈4.21 Å）
    - 先做含晶格弛豫的全优化（原子坐标 + 晶格），力收敛判据 0.01 eV/Å
    - 再在平衡体积附近取 5 个体积点做单点能计算，用状态方程(EOS, Birch-Murnaghan)拟合体模量 B0
    - 将结果写入 `mgo_result.json`：
      `{"lattice_a_A": ..., "energy_per_atom_eV": ..., "bulk_modulus_GPa": ..., "convergence_status": ...}`
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: output_artifact
    value: mgo_result.json
  - key: lattice_a_A
    value:
      filename: mgo_result.json
      key: lattice_a_A
      min: 4.06
      max: 4.36
  - key: bulk_modulus_GPa
    value:
      filename: mgo_result.json
      key: bulk_modulus_GPa
      min: 120.0
      max: 220.0
  - key: turn_budget
    value:
      max: 22
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `mgo_result.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: lattice_a_A
    criterion: Optimized MgO lattice constant is within tolerance of the experimental/DPA
      value (~4.21 Å).
    axis: correctness
    verify: json_file_numeric_range
  - id: bulk_modulus_GPa
    criterion: The fitted bulk modulus of MgO is in the physical range (~150-170 GPa
      experimentally; 120-220 accepts the MLIP/DFT spread). This value is not given
      in the prompt and can only be obtained by actually fitting the EOS — a value
      outside the range indicates the EOS was not genuinely computed.
    axis: correctness
    verify: json_file_numeric_range
    weight: 2.0
  - id: model_is_dpa4
    criterion: '[Must] The computation uses a DPA4-family model (a DPA4-Neo checkpoint
      resolved from the mlips skill model table), not a DPA3/DPA2 fallback or a
      different MLIP. Judge from the answer and the submitted command/model reference.'
