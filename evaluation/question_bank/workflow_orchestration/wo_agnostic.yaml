- id: WO_mlip_fetch_002_20260513
  capability: workflow_orchestration
  domain: agnostic
  intent: Determine - from the registry's own data alone - whether any checkpoint of the MACE family is currently published on a specified open MLIP registry, with a query trace that survives later registry-state changes.
  human_prompt_seed: 'A colleague claims that some checkpoint of the **MACE family** of universal MLIP foundation models is available as a downloadable asset on the principal open MLIP/MLP registry that hosts DP-style foundation models. Please settle the question from the registry''s own data alone - not from prior knowledge of what is or isn''t hosted there. Save `mace_lookup.json` with this shape:

    `{ "family": "MACE", "queries_attempted": [ { "query": <string>, "resource_type": "models" | "datasets", "n_results": <integer>, "candidate_names": [<string>, ...] }, ... ], "conclusion": "available" | "not_available", "evidence": <string> }`.

    Hard constraints: (1) `queries_attempted` must contain at least 2 distinct `query` strings; (2) every `n_results` must reflect what the registry actually returned at query time; (3) if `conclusion` is `available`, `evidence` must be a real `downloadLink` string copied verbatim from the registry response; if `not_available`, `evidence` must be a one-sentence statement without any URLs. Never invent a URL.

    '
  tags:
  - code_mlip
  - meta_database
  data_files: []
  reference_answers:
  - key: mace_json
    value: mace_lookup.json
  - key: required_tokens
    value:
      filename: mace_lookup.json
      tokens:
      - MACE
      - queries_attempted
      - conclusion
      - evidence
      flags: i
  - key: at_least_two_queries
    value:
      filename: mace_lookup.json
      pattern: '"query"\s*:\s*"[^"]+"[\s\S]*?"query"\s*:\s*"[^"]+"'
      flags: ''
  - key: n_results_numeric
    value:
      filename: mace_lookup.json
      pattern: '"n_results"\s*:\s*\d+'
      flags: ''
  - key: no_fabricated_host
    value:
      filename: mace_lookup.json
      pattern: '(?s)\A(?:(?!(aliyuncs\.com|googleapis\.com|huggingface\.co|s3\.amazonaws\.com|github\.com)).)*\Z'
      flags: ''
  - key: conclusion_evidence_consistency
    value:
      filename: mace_lookup.json
      if_pattern: '"conclusion"\s*:\s*"not_available"'
      then_pattern: '(?s)\A(?:(?!https?://).)*\Z'
      else_pattern: 'https?://[^"\s]*aissquare\.com'
      flags: i
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 27000
  scoring_checklist:
  - id: mace_json
    criterion: Agent writes `mace_lookup.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_tokens
    criterion: JSON contains MACE, queries_attempted, conclusion, evidence keys.
    axis: correctness
    verify: text_file_contains_all
  - id: at_least_two_queries
    criterion: At least 2 distinct query strings recorded in queries_attempted - agent did not short-circuit on a single failed lookup.
    axis: correctness
    verify: text_file_regex
  - id: n_results_numeric
    criterion: At least one numeric n_results entry, proving the agent actually called the registry rather than answering from memory.
    axis: grounding
    verify: text_file_regex
  - id: no_fabricated_host
    criterion: No off-registry hosts (aliyuncs, googleapis, huggingface, s3, github) appear anywhere - the agent did not invent a download URL while concluding.
    axis: grounding
    verify: text_file_regex
  - id: conclusion_evidence_consistency
    criterion: If conclusion is `not_available`, no URL appears anywhere in the artifact (evidence is a plain-text explanation). If conclusion is `available`, evidence cites an aissquare.com downloadLink.
    axis: grounding
    verify: text_file_regex
  - id: no_retries
    criterion: No repeated identical lookup calls.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
