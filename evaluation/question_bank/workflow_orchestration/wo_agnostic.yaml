    oss_url: ''
    description: JSON file listing candidate clusters in physically meaningful order (pairs by increasing
      length, then triplets by increasing diameter, etc.), each with a cluster_id and diameter.
  - key: candidate_structures_pool
    path: candidate_pool.csv
    oss_url: ''
    description: 'CSV file with columns: structure_id, cost, followed by correlation values for all candidate
      clusters. Contains structures not yet computed.'
