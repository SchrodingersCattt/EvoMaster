    criterion: D(Li+) at 300K is in the range 0.5-3.0 x 10^-5 cm2/s for dilute
      aqueous Li+ (experimental ~1.0 x 10^-5 cm2/s). SPC/E typically gives
      slightly higher D than experiment. Values outside 0.1-10 x 10^-5 indicate
      simulation too short or force field error.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: sufficient_production_time
