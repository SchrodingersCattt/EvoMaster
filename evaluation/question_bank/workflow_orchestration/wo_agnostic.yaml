  human_prompt_seed: 'A colleague claims that some checkpoint of the **MACE family** of universal MLIP foundation models is available as a downloadable asset on the principal open MLIP/MLP registry that hosts DP-style foundation models. Please settle the question from the registry''s own data alone - not from prior knowledge of what is or isn''t hosted there. Save `mace_lookup.json` with this shape:

