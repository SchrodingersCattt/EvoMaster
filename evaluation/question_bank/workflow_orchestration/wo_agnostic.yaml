      - bader_charge
      - charge_transfer
      - Al
      - O
  - key: report_required_tokens
    value:
      filename: al2o3_bader_report.md
      must_cover:
      - Bader
      - Al2O3
      - charge
      - transfer
      - Al
      - O
      - 不确定性
  - key: al_bader_charge_mock
