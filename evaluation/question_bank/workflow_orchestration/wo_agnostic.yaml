      (as requested). If agent runs less than 500 ps, the MSD may not reach the
      diffusive regime, especially at 300K. Agent should submit to Bohrium GPU
      node rather than running locally on CPU if local execution is too slow.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: msd_diffusive_regime
