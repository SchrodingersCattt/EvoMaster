    Hard constraints: (1) `queries_attempted` must contain at least 2 distinct `query` strings; (2) every `n_results` must reflect what the registry actually returned at query time; (3) if `conclusion` is `available`, `evidence` must be a real `downloadLink` string copied verbatim from the registry response; if `not_available`, `evidence` must be a one-sentence statement without any URLs. Never invent a URL.

