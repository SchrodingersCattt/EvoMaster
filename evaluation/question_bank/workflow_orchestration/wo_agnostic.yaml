    criterion: scan.csv contains at least 15 data rows covering the requested range.
    axis: correctness
    verify: text_file_regex
  - id: equilibrium_distance
    criterion: The minimum-energy point in scan.csv corresponds to a C-N distance
      of approximately 1.5 Å (typical C-N bond length in CH3NH3+). A wrong value
      (e.g. all points near the same energy) indicates the scan geometry was not
      properly constrained.
