- id: WO_elec_006_20260404
  capability: workflow_orchestration
  domain: elec
  intent: 'Mock surface energy for Fe BCC(110) with BSSE-aware workflow; compare sigma to VASP reference using provided energies and area.'
  human_prompt_seed: '计算 Fe BCC(110) 表面能（ABACUS LCAO 场景，含 BSSE 校正思路）：从结构数据库或模板获取 Fe BCC 体相（a≈2.87 Å），切出 (110) slab（建议至少 6 层原子、约 15 Å 真空）。说明在 LCAO 基组下需要在两侧真空添加 empty Fe 层以降低 BSSE。使用以下 mock 单点能量（单位 eV，已对应 BSSE 校正后的 slab SCF）：E_bulk = -230929.72（体相参考），E_slab = -230919.46，单侧截面积 A = 34.09 Å²。按 σ = (E_slab − E_bulk) / (2A) 计算表面能，换算为 J/m²（1 eV/Å² = 16.021766 J/m²），并与 VASP 参考值约 2.412 J/m² 对比。全程不要提交真实 DFT 计算。

    '
  tags:
  - abacus
  - bsse
  - surface_energy
  - mock_energy
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: used_structure_tool
    value:
    - mat_struct_db_fetch_structures_from_db
    - mat_sg_build_bulk_structure_by_template
    - mat_sg_build_bulk_structure_by_wyckoff
    - mat_sg_build_surface_slab
  - key: sigma_J_m2
    value: 2.411
    tolerance: 0.12
  - key: required_fields
    value:
    - sigma_J_m2
    - formula
    - bsse_note
    - vasp_compare
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: sigma_J_m2
    criterion: Surface energy sigma in J/m^2 matches mock-data calculation within tolerance (~2.41 J/m^2).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report states sigma in J/m^2, shows sigma=(E_slab-E_bulk)/(2A), notes BSSE empty-layer rationale, and compares to VASP ~2.412 J/m^2.
    axis: correctness
    verify: llm_binary_judge
  - id: used_structure_tool
    criterion: Used a registered structure database fetch or slab/bulk builder tool to obtain Fe BCC and (110) slab geometry (not hand-drawn coordinates only).
    axis: grounding
    verify: tool_called
  - id: grounding_source
    criterion: Numeric sigma is computed from the given mock E_bulk, E_slab, and A; no invented energies. Judge solely from
      the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical structure tool calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Workflow (fetch/build slab → apply formula with mock energies → report) avoids redundant intermediate rebuilds.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget

