version: v5
capability: workflow_orchestration
domain: elec
questions:
- id: WO_elec_001_20260404
  capability: workflow_orchestration
  domain: elec
  intent: 'Run band-structure workflow for Si: locate structure, compute bands along
    high-symmetry path, report gap.'
  human_prompt_seed: '计算 Si 的能带结构：从数据库获取金刚石结构 Si，先做 SCF 计算， 然后沿高对称 k 路径 (G-X-L-G)
    计算能带，判断带隙类型（直接/间接）并输出带隙值 (eV)。 注意 DFT 带隙与实验值的偏差，给出不确定性说明。

    '
  tags:
  - band_structure
  - si
  - workflow
  - kpath
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: used_band_calc
    value: execute_bash
  - key: gap_type
    value: indirect
  - key: gap_value_eV
    value: 0.65
    tolerance: 0.25
  - key: required_fields
    value:
    - kpath
    - gap_type
    - gap_value
    - uncertainty_note
  - key: turn_budget
    value: &id000
      max: 18
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 8000
  scoring_checklist:
  - id: gap_type
    criterion: Band-gap type is correctly identified as indirect (not direct).
    axis: correctness
    verify: llm_binary_judge
  - id: gap_value_eV
    criterion: Gap value is in expected DFT range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes high-symmetry k-path, gap type classification, gap
      value, and DFT uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: used_band_calc
    criterion: Used ABACUS band structure calculation (via bohrium-job skill submit_job.py)
      to compute actual bands.
    axis: grounding
    verify: tool_called
  - id: grounding_source
    criterion: Band gap values are extracted from MCP band calculation results, not
      recalled from LLM training knowledge.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Band structure calculation is not repeated unnecessarily for the same
      k-path.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Si band structure workflow (fetch → SCF → bands → report) completes
      without redundant intermediate steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_elec_002_20260404
  capability: workflow_orchestration
  domain: elec
  intent: 'Build and execute periodic liquid water gap workflow: construct 64-water
    box, compute HOMO-LUMO gap with hybrid acceleration.'
  human_prompt_seed: '计算周期性液态水体系的 HOMO-LUMO gap： 构建 64 个水分子的周期性盒子（密度 ~1.0 g/cm3），
    使用杂化泛函或加速方案（如先 PBE 再 HSE 单点）计算电子 gap。 输出 gap 值 (eV)、所用加速策略和计算成本估算。

    '
  tags:
  - hybrid_method
  - liquid_water
  - workflow_acceleration
  - gap
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: used_amorphous_builder
    value: mat_sg_make_amorphous_structure
  - key: used_dos_calc
    value: execute_bash
  - key: gap_value_eV
    value: 6.2
    tolerance: 1.2
  - key: required_fields
    value:
    - hybrid_setup
    - acceleration_strategy
    - gap_extraction
    - cost_note
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: gap_value_eV
    criterion: Gap value is in tolerance.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes hybrid functional setup, acceleration strategy description,
      gap extraction method, and cost estimate.
    axis: correctness
    verify: llm_binary_judge
  - id: used_amorphous_builder
    criterion: Used MCP amorphous structure builder (mat_sg_make_amorphous_structure)
      for 64-water box construction.
    axis: grounding
    verify: tool_called
  - id: used_dos_calc
    criterion: Used ABACUS DOS calculation (via bohrium-job skill submit_job.py) for
      gap extraction.
    axis: grounding
    verify: tool_called
  - id: grounding_source
    criterion: Gap value is extracted from MCP calculation results; acceleration strategy
      is grounded in actual tool capabilities.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Amorphous builder and DOS calculator are not called repeatedly with
      identical parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Liquid water gap workflow (build box → SCF/hybrid → DOS → report) is
      executed without redundant intermediate calculations.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
