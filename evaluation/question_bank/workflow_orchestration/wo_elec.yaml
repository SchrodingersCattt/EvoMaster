  - key: bader_report_artifact
    value: al2o3_bader_report.md
  - key: bader_required_tokens
    value:
      filename: al2o3_bader_summary.json
      tokens:
      - atom_index
      - element
      - bader_charge
      - charge_transfer
      - Al
      - O
      flags: i
  - key: report_required_tokens
