    value: pd111_work_function.json
  - key: wf_report_artifact
    value: pd111_work_function_report.md
  - key: wf_required_tokens
    value:
      filename: pd111_work_function.json
      tokens:
      - work_function_eV
      - vacuum_direction
      - z
      - functional
      - calculation_mode
      flags: i
  - key: report_required_tokens
    value:
      filename: pd111_work_function_report.md
      tokens:
      - Pd(111)
      - work function
      - ABACUS
      - z
      - 不确定性
      flags: i
  - key: wf_value_mock
    value: 5.43
    tolerance: 0.3
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
