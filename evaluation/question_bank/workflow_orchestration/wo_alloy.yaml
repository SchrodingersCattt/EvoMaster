    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_mech_006_20260519
  capability: workflow_orchestration
  domain: alloy
  intent: Build the convex hull for a CuCrZr alloy and summarize stability interpretation artifacts.
  human_prompt_seed: "对 CuCrZr 执行凸包稳定性分析（Mock版）：\n1. 先 query/检索并整理凸包分析所需输入文件与参考相信息；\n2. 说明稳定性判据（hull distance 与稳定标签关系）；\n3. 不做真实计算，使用以下 mock 结果：\n   - hull_distance = 0.024 eV/atom\n   - stability_label\
    \ = metastable\n   - reference_phases = [\"Cu\", \"Cr2Zr\", \"CuZr2\"]\n4. 基于 mock 值做稳定性后处理与结论解释。\n\n请完成以下交付：\n1) `cucrzr_convex_hull_summary.json`：至少包含 `input_files`, `hull_distance`, `stability_label`,\
    \ `reference_phases`, `notes`；\n2) `cucrzr_convex_hull_report.md`：说明 query 输入梳理、mock 后处理流程、稳定性判据及不确定性。\n\n最终回答中请明确说明该结构在热力学稳定性上的定性结论（稳定/亚稳/不稳定）。\n"
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: hull_summary_json
    value: cucrzr_convex_hull_summary.json
  - key: hull_report_md
    value: cucrzr_convex_hull_report.md
  - key: hull_required_tokens
    value:
      filename: cucrzr_convex_hull_summary.json
      must_cover:
      - hull_distance
      - stability_label
      - reference_phases
      - Cu
      - Cr
      - Zr
  - key: report_required_tokens
    value:
      filename: cucrzr_convex_hull_report.md
      must_cover:
      - convex hull
      - stability
      - CuCrZr
      - 不确定性
  - key: hull_distance_mock
    value: 0.024
    tolerance: 0.01
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: hull_summary_json
    criterion: Agent writes `cucrzr_convex_hull_summary.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: hull_report_md
    criterion: Agent writes `cucrzr_convex_hull_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: hull_required_tokens
    criterion: Hull summary JSON includes distance/stability fields and phase-reference metadata.
    axis: correctness
    verify: llm_binary_judge
  - id: report_required_tokens
    criterion: Report explains convex-hull interpretation and uncertainty caveats.
    axis: correctness
    verify: llm_binary_judge
  - id: hull_distance_mock
    criterion: Final answer includes a mock hull distance near 0.024 eV/atom.
    axis: correctness
    verify: numerical_range
  - id: grounding_source
    criterion: Final answer uses the mock values explicitly provided in the user prompt
