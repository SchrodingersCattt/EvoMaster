- id: WO_dpmd_lammps_fcc_feni_001_20260521
  capability: workflow_orchestration
  domain: alloy
  priority: P0
  intent: Prepare DPA-2.4-7M freeze + LAMMPS minimize inputs for a random fcc Fe-Ni
    supercell, testing multi-head model freeze knowledge and type_map alignment.
  human_prompt_seed: |
    我想用 DPA-2.4-7M 模型配合 LAMMPS，对 fcc Fe-Ni 等比合金（2×2×2 超胞，32 原子）做结构优化。请帮我准备好输入文件，不需要实际执行计算。

    交付要求：输入文件和执行脚本放在 `input/` 目录（`conf.lmp`、`in.lmp`、`run.sh`）。
  tags:
  - code_mlip
  - eng_lammps
  data_files: []
  reference_answers:
  - key: run_sh_exists
    value: input/run.sh
  - key: run_sh_has_freeze
    value:
      filename: input/run.sh
      pattern: 'dp\s+--pt\s+freeze|freeze.*\.pth'
      flags: i
  - key: run_sh_has_lammps
    value:
      filename: input/run.sh
      pattern: 'lmp\s|lammps'
      flags: i
  - key: type_map_consistent
    value:
      if_filename: input/run.sh
      if_pattern: '--type-map'
      then_pattern: '--type-map\s+\w+\s+\w+'
      else_filename: input/conf.lmp
      else_pattern: '^\s*(?:28|29|[3-9]\d|\d{3,})\s+atom\s+types\b'
      flags: m
  - key: input_has_minimize
    value:
      filename: input/in.lmp
      pattern: '(?:minimize\b|fix\s+\S+\s+all\s+box/relax\b)'
      flags: im
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 30000
  scoring_checklist:
  - id: run_sh_exists
    criterion: Agent writes `input/run.sh` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: run_sh_has_freeze
    criterion: '[Must] run.sh contains a dp freeze command (agent knows multi-head DPA
      models must be frozen for LAMMPS).'
    axis: correctness
    verify: text_file_regex
  - id: run_sh_has_lammps
    criterion: '[Must] run.sh invokes LAMMPS after model preparation.'
    axis: correctness
    verify: text_file_regex
  - id: type_map_consistent
    criterion: '[Must] Type-map alignment is correct: if run.sh uses --type-map (compact
      freeze), conf.lmp may use compact types; otherwise conf.lmp must declare ≥28 atom
      types (full-element indices matching the default frozen model).'
    axis: correctness
    verify: text_file_regex
  - id: input_has_minimize
    criterion: '[Must] input/in.lmp contains a minimize command.'
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock time within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Token usage within budget.
    axis: efficiency
    verify: token_budget
- id: WO_seg_energy_isif_001_20260527
  capability: workflow_orchestration
  domain: alloy
  intent: Test whether agent correctly chooses cell-fixed ionic relaxation (ISIF=2)
    for doped interface models in a segregation energy workflow, rather than full cell
    relaxation (ISIF=3) which introduces inconsistent strain artifacts between models.
  human_prompt_seed: '帮我设计一个 VASP 计算方案，计算 Sn 在 BCC-Fe/FCC-Fe (K-S取向) 界面处的偏聚能。

    已有模型：84原子周期性界面超胞（无真空层），x/y方向有~4%晶格失配。

    需要的计算模型：

    1. interface_clean（纯Fe界面）

    2. interface_Sn（Sn替换界面处一个Fe）

    3. bulk_clean（纯BCC-Fe体相参考）

    4. bulk_Sn（Sn替换体相一个Fe）

    请输出每个模型的 INCAR 关键参数（特别是 ISIF、IBRION、NSW、ENCUT、ISPIN），并说明参数选择的理由。

    '
  tags:
  - eng_vasp
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 15
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: isif_interface_doped
    criterion: Agent sets ISIF=2 (ions only) for the doped interface model
      (interface_Sn), OR explicitly states that cell dimensions must be kept
      consistent with the clean interface to ensure energy comparability in
      segregation energy calculations. ISIF=3 for doped models is WRONG because
      different cell relaxation between clean and doped introduces strain artifacts
      into the segregation energy difference.
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: isif_clean_rationale
    criterion: Agent explains the two-step strategy for the clean interface (ISIF=3
      first to get equilibrium cell, then use that fixed cell for all doped models),
      OR directly sets ISIF=2 for all interface models with a pre-optimized cell.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: consistent_cell_principle
    criterion: Agent explicitly states the principle that all models in a segregation
      energy calculation must use the same cell dimensions to ensure energy
      differences are physically meaningful and not contaminated by strain.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: spin_polarized
    criterion: Agent sets ISPIN=2 for Fe-based magnetic system.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Token usage within budget.
    axis: efficiency
    verify: token_budget
