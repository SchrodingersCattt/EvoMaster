version: v5
capability: workflow_orchestration
domain: semiconductor
questions:
- id: WO_elec_001_20260528
  capability: workflow_orchestration
  domain: semiconductor
  intent: 'Run band-structure workflow for Si: locate structure, compute bands along high-symmetry
    path, report gap.'
  human_prompt_seed: '使用 ABACUS 计算 Si 的能带结构：从数据库获取金刚石结构 Si，先做 SCF 计算，然后沿高对称
    k 路径 (G-X-L-G) 计算能带，判断带隙类型（直接/间接）并输出带隙值 (eV)。注意 DFT 带隙与实验值的偏差，给出不确定性说明。

    '
  tags:
  - eng_abacus
  priority: P0
  data_files: []
  reference_answers:
  - key: gap_type
    value: indirect
  - key: gap_value_eV
    value: 0.65
    tolerance: 0.25
  - key: required_fields
    value:
    - kpath
    - gap_type
    - gap_value
    - uncertainty_note
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: gap_type
    criterion: Band-gap type is correctly identified as indirect (not direct).
    axis: correctness
    verify: llm_binary_judge
  - id: gap_value_eV
    criterion: Gap value is in expected DFT range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes high-symmetry k-path, gap type classification, gap value, and
      DFT uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Stated band gap values are tied to band-structure or calculation outcomes described
      in the final answer, not only generic training recall. Judge from the answer and named
      outputs; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Band structure calculation is not repeated unnecessarily for the same k-path.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Si band structure workflow (fetch → SCF → bands → report) completes without
      redundant intermediate steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_elec_009_20260515
  capability: workflow_orchestration
  domain: semiconductor
  intent: Compute Si phonon dispersion with ABACUS (including relaxation step) and summarize
    key spectrum outcomes.
  human_prompt_seed: "计算 Si 的声子特征（Mock版）：\n1. 先 query/检索并梳理本任务所需输入文件（结构文件、参数文件、声子相关输入）；\n\
    2. 给出你会采用的声子设置（k 路径/采样、超胞或最小长度、位移步长）；\n3. 不做真实 ABACUS 计算，使用以下 mock 结果进行后处理：\n   - supercell_or_min_length\
    \ = \"3x3x3\"\n   - displacement_step = 0.01\n   - gamma_optical_frequency_THz = 15.6\n\
    \   - imaginary_mode_check = false\n4. 汇总是否存在虚频，并给出结果可信度与不确定性说明。\n\n请完成以下交付：\n1) `si_phonon_abacus.json`：至少包含\
    \ `input_files`, `kpath_or_sampling`, `supercell_or_min_length`, `displacement_step`,\
    \ `imaginary_mode_check`, `key_frequency_summary`；\n2) `si_phonon_abacus_report.md`：说明\
    \ query 输入梳理 + mock 后处理流程、关键结论与不确定性。\n\n最终回答请简要说明是否出现虚频，并标注为 mock 后处理结论。\n"
  tags:
  - eng_abacus
  data_files: []
  reference_answers:
  - key: phonon_json
    value: si_phonon_abacus.json
  - key: phonon_report
    value: si_phonon_abacus_report.md
  - key: json_required_tokens
    value:
      filename: si_phonon_abacus.json
      must_cover:
      - displacement_step
      - imaginary_mode_check
      - key_frequency_summary
      - supercell_or_min_length
  - key: report_required_tokens
    value:
      filename: si_phonon_abacus_report.md
      must_cover:
      - Si
      - ABACUS
      - phonon
      - 优化
      - 虚频
      - 不确定性
  - key: gamma_freq_mock
    value: 15.6
    tolerance: 1.0
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: phonon_json
    criterion: Agent writes `si_phonon_abacus.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: phonon_report
    criterion: Agent writes `si_phonon_abacus_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: json_required_tokens
    criterion: JSON contains key phonon workflow and imaginary-mode-check fields.
    axis: correctness
    verify: llm_binary_judge
  - id: report_required_tokens
    criterion: Report explains relax→phonon workflow and uncertainty caveats.
    axis: correctness
    verify: llm_binary_judge
  - id: gamma_freq_mock
    criterion: Final answer includes a mock gamma optical frequency value near 15.6 THz.
    axis: correctness
    verify: numerical_range
  - id: grounding_source
    criterion: The final answer uses the mock phonon values provided in the prompt
      (gamma_optical_frequency_THz=15.6, imaginary_mode_check=false). This is a mock
      task — the agent is NOT expected to compute phonon dispersion from scratch.
      Using prompt-provided mock values IS grounded. Only fail if the agent invents
      numeric values not given in the prompt.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_abacus_e2e_001_20260521
  capability: workflow_orchestration
  domain: semiconductor
  intent: End-to-end ABACUS electronic structure workflow (relax → scf → band → DOS)
    on Si diamond, testing workflow orchestration without software switching or looping.
  human_prompt_seed: '工作区中有 Si 金刚石结构 `Si_diamond.cif`。请用 ABACUS 完成完整的电子结构计算：
    结构弛豫、自洽计算、能带计算和态密度计算，最终给出带隙值。'
  tags:
  - eng_abacus
  data_files:
  - key: si_cif
    path: data/WO_abacus_e2e_001_20260521/Si_diamond.cif
    oss_url: ''
    description: Si diamond primitive cell CIF (2 atoms, Fd-3m).
  reference_answers:
  - key: band_artifact
    value: BANDS_1.dat
  - key: dos_artifact
    value: DOS1_smearing.dat
  - key: must_no_software_switch
    value: {}
  - key: must_band_gap_reported
    value: {}
  - key: turn_budget
    value:
      max: 65
  - key: duration_budget
    value:
      max: 1500000
  - key: token_budget_total
    value:
      max: 200000
  scoring_checklist:
  - id: band_artifact
    criterion: '[Must] Workflow produces a band structure data file (BANDS_1.dat or equivalent)
      in the workspace, indicating the band NSCF step completed successfully.'
    axis: correctness
    verify: artifact_exists
  - id: dos_artifact
    criterion: '[Must] Workflow produces a DOS data file (DOS1_smearing.dat or equivalent)
      in the workspace, indicating the DOS NSCF step completed successfully.'
    axis: correctness
    verify: artifact_exists
  - id: must_no_software_switch
    criterion: '[Must] Agent uses only ABACUS throughout the workflow. No calls to QE,
      VASP, CP2K, or other DFT codes. Judge from tool call history.'
    axis: correctness
    verify: llm_binary_judge
  - id: must_band_gap_reported
    criterion: '[Must] Final answer reports the Si band gap value (PBE typically gives
      0.4–0.8 eV due to underestimation; experimental is ~1.12 eV) and identifies
      it as indirect.'
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the full workflow within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock time stays within budget (25 min for 4-step Si calculation).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
- id: WF_vasp_003_20250618
  capability: workflow_orchestration
  domain: semiconductor
  intent: Write a Python script that computes the defect formation energy for a charged substitutional
    defect in a 2D material under strain, implementing Eq. (2) from the paper's Methods section.
  human_prompt_seed: 'Write a Python function compute_defect_formation_energy that implements the defect
    formation energy equation (Eq. 2) from the paper. The function should accept: E_def (total energy
    of defective supercell), E_pristine (total energy of pristine supercell), mu_dict (dict of chemical
    potentials {element_symbol: value_in_eV}), n_dict (dict of atom counts added/removed {element_symbol:
    count, positive for removed, negative for added}), charge_state (integer q), E_vbm (valence band maximum
    energy in eV), mu_e (electron chemical potential in eV), and E_corr (electrostatic correction in eV).
    Return the formation energy in eV. Save as defect_energy.py in the current directory.'
  tags:
  - eng_vasp
  data_files: []
  reference_answers:
  - key: artifact_script
    value: defect_energy.py
  - key: function_exists
    value:
      flags: []
      pattern: def\s+compute_defect_formation_energy
      filename: defect_energy.py
  - key: has_all_params
    value:
      tokens:
      - E_def
      - E_pristine
      - mu_dict
      - n_dict
      - charge_state
      - E_vbm
      - mu_e
      - E_corr
      filename: defect_energy.py
  - key: formula_correct
    value:
      flags: []
      pattern: E_def\s*-\s*E_pristine
      filename: defect_energy.py
  - key: charge_term
    value:
      flags: []
      pattern: charge_state\s*\*\s*\(\s*E_vbm\s*\+\s*mu_e\s*\)
      filename: defect_energy.py
  - key: correction_term
    value:
      flags: []
      pattern: E_corr
      filename: defect_energy.py
  - key: chemical_potential_term
    value:
      flags: []
      pattern: mu_dict|chemical_potential|mu_
      filename: defect_energy.py
  - key: grounding_source
    value:
      filename: defect_energy.py
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_script
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Python file defect_energy.py exists'
  - id: function_exists
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Function compute_defect_formation_energy is defined'
  - id: has_all_params
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Function accepts all 8 required parameters (E_def, E_pristine, mu_dict, n_dict,
      charge_state, E_vbm, mu_e, E_corr)'
  - id: formula_correct
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Implementation includes E_def - E_pristine (the energy difference term)'
  - id: charge_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Charge term q*(E_vbm + mu_e) is implemented'
  - id: correction_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Electrostatic correction E_corr is included'
  - id: chemical_potential_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Chemical potential term ±Σ n_i μ_i is implemented'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The script implements Eq. (2) from the source paper on defect formation energy'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Complete within 20 turns'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retry turns used'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Complete within 300 seconds'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Total token usage within 50000'
