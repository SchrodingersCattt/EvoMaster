- id: WF_vasp_003_20250618
  capability: workflow_orchestration
  domain: semiconductor
  intent: Write a Python script that computes the defect formation energy for a charged substitutional
    defect in a 2D material under strain, implementing Eq. (2) from the paper's Methods section.
  human_prompt_seed: 'Write a Python function compute_defect_formation_energy that implements the defect
    formation energy equation (Eq. 2) from the paper. The function should accept: E_def (total energy
    of defective supercell), E_pristine (total energy of pristine supercell), mu_dict (dict of chemical
    potentials {element_symbol: value_in_eV}), n_dict (dict of atom counts added/removed {element_symbol:
    count, positive for removed, negative for added}), charge_state (integer q), E_vbm (valence band maximum
    energy in eV), mu_e (electron chemical potential in eV), and E_corr (electrostatic correction in eV).
    Return the formation energy in eV. Save as defect_energy.py in the current directory.'
  tags:
  - eng_vasp
  data_files: []
  reference_answers:
  - key: artifact_script
    value: defect_energy.py
  - key: function_exists
    value:
      flags: []
      pattern: def\s+compute_defect_formation_energy
      filename: defect_energy.py
  - key: has_all_params
    value:
      tokens:
      - E_def
      - E_pristine
      - mu_dict
      - n_dict
      - charge_state
      - E_vbm
      - mu_e
      - E_corr
      filename: defect_energy.py
  - key: formula_correct
    value:
      flags: []
      pattern: E_def\s*-\s*E_pristine
      filename: defect_energy.py
  - key: charge_term
    value:
      flags: []
      pattern: charge_state\s*\*\s*\(\s*E_vbm\s*\+\s*mu_e\s*\)
      filename: defect_energy.py
  - key: correction_term
    value:
      flags: []
      pattern: E_corr
      filename: defect_energy.py
  - key: chemical_potential_term
    value:
      flags: []
      pattern: mu_dict|chemical_potential|mu_
      filename: defect_energy.py
  - key: grounding_source
    value:
      filename: defect_energy.py
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_script
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Python file defect_energy.py exists'
  - id: function_exists
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Function compute_defect_formation_energy is defined'
  - id: has_all_params
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Function accepts all 8 required parameters (E_def, E_pristine, mu_dict, n_dict,
      charge_state, E_vbm, mu_e, E_corr)'
  - id: formula_correct
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Implementation includes E_def - E_pristine (the energy difference term)'
  - id: charge_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Charge term q*(E_vbm + mu_e) is implemented'
  - id: correction_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Electrostatic correction E_corr is included'
  - id: chemical_potential_term
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Chemical potential term ±Σ n_i μ_i is implemented'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The script implements Eq. (2) from the source paper on defect formation energy'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Complete within 20 turns'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retry turns used'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Complete within 300 seconds'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Total token usage within 50000'
- id: WF_phonon_003_20250608
  capability: workflow_orchestration
  domain: semiconductor
  intent: Generate a Phonopy workflow script to compute the phonon dispersion relation for hexagonal H-MgZn₂
    using the finite displacement method, as described in the paper's methods section. The script should
    set up the supercell, generate displaced structures, and define the high-symmetry k-point path for
    the hexagonal Brillouin zone.
  human_prompt_seed: Create a Phonopy workflow script (run_phonopy.py) to compute the phonon dispersion
    for H-MgZn₂ using the structure in h_mgzn2_poscar.vasp. The script should use the finite displacement
    method, set up an appropriate supercell, and plot the phonon band structure along the high-symmetry
    path for the hexagonal Brillouin zone (Γ-M-K-Γ-A-L-H-Γ). The script should be executable with `python
    run_phonopy.py`.
  tags: []
  data_files:
  - key: h_mgzn2_poscar
    path: h_mgzn2_poscar.vasp
    oss_url: ''
    description: POSCAR file for hexagonal H-MgZn₂ (C14 Laves phase, space group P6₃/mmc) with lattice
      parameters a=b=5.223 Å, c=8.566 Å, containing 12 atoms (4 Mg + 8 Zn) in the conventional cell.
  reference_answers:
  - key: script_exists
    value: run_phonopy.py
  - key: script_imports
    value:
      flags:
        min_tokens: 2
        all_tokens_required: false
      tokens:
      - import phonopy
      - from phonopy import Phonopy
      - import numpy
      filename: run_phonopy.py
  - key: supercell_setup
    value:
      flags:
        min_tokens: 1
        all_tokens_required: false
      tokens:
      - dimensions
      - dim=
      - supercell_matrix
      filename: run_phonopy.py
  - key: band_path
    value:
      flags:
        min_tokens: 4
        all_tokens_required: false
      tokens:
      - Gamma
      - M
      - K
      - A
      - L
      - H
      filename: run_phonopy.py
  - key: finite_displacement
    value:
      flags:
        min_tokens: 1
        all_tokens_required: false
      tokens:
      - displacement_distance
      - distance
      - '0.01'
      filename: run_phonopy.py
  - key: grounding_source
    value:
      filename: h_mgzn2_poscar.vasp
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: script_exists
    axis: correctness
    verify: artifact_exists
    weight: 5.0
    criterion: '[Must] Output file run_phonopy.py exists'
  - id: script_imports
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Must] Script imports phonopy library and numpy (at least 2 of the listed import tokens)'
  - id: supercell_setup
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Must] Script specifies a supercell dimension or matrix (e.g., dim=''2 2 2'' or supercell_matrix)'
  - id: band_path
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Suggested] Script defines a band path containing at least 4 of the hexagonal high-symmetry
      points: Γ (Gamma), M, K, A, L, H'
  - id: finite_displacement
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Suggested] Script sets a finite displacement distance (typically 0.01 Å as used by Phonopy
      default)'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
