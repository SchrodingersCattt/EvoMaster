version: v5
capability: workflow_orchestration
domain: agnostic
questions:
- id: WO_dpgen_ready_check_001_20260614
  capability: workflow_orchestration
  domain: agnostic
  intent: Check DP-GEN param/machine launch readiness from user-provided JSON files while treating placeholder paths as expected
    non-blocking preflight warnings.
  human_prompt_seed: '我准备把这套 DP-GEN 配置交给同事试跑，没定下来的文件路径可以先用 `/path/to/...` 占位；请检查有没有会阻塞启动的问题，并输出 `dpgen_readiness_gate.md`
    和 `validation_report.json`。


    输入文件：

    - `param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_ready_check_001_20260614/param.json`

    - `machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_ready_check_001_20260614/machine.json`'
  tags:
  - code_mlip
  data_files:
  - key: param_json
    path: data/WO_dpgen_ready_check_001_20260614/param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_ready_check_001_20260614/param.json
    description: DP-GEN param fixture copied from _tmp/params.eval.json with placeholder paths.
  - key: machine_json
    path: data/WO_dpgen_ready_check_001_20260614/machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_ready_check_001_20260614/machine.json
    description: DP-GEN machine fixture copied from _tmp/machine.eval.json with placeholder paths.
  reference_answers:
  - key: readiness_artifact
    value: dpgen_readiness_gate.md
  - key: validation_schema
    value:
      filename: validation_report.json
      required_keys:
      - commands
      - files_checked
      - tool_available
      - diagnostics
      - expected_path_warnings_ignored
      - blocking_findings
  - key: validation_mentions_checker
    value:
      filename: validation_report.json
      pattern: dpgen-lsp-tool|dpgen_lsp|check\s+param|check\s+machine
      flags: i
  - key: path_warning_classified
    value:
      filename: validation_report.json
      pattern: path/to|/path/to|not\s+found|missing.*path|non.?blocking|advisory|needs.?replace|placeholder
      flags: is
  - key: readiness_mentions_placeholders
    value:
      filename: dpgen_readiness_gate.md
      pattern: path/to|/path/to|placeholder|占位|替换|non.?blocking|advisory|不阻塞
      flags: is
  - key: no_submit_claim
    value: The agent checks readiness and does not run or claim a real DP-GEN/DFT/Bohrium submission.
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: readiness_artifact
    criterion: Agent writes dpgen_readiness_gate.md.
    axis: correctness
    verify: artifact_exists
  - id: validation_schema
    criterion: validation_report.json is valid JSON and includes command, file, diagnostics, expected path-warning, and blocking-finding
      fields.
    axis: correctness
    verify: json_file_schema
  - id: validation_mentions_checker
    criterion: validation_report.json records a DP-GEN-aware check of both parameter and machine inputs.
    axis: correctness
    verify: text_file_regex
  - id: path_warning_classified
    criterion: validation_report.json includes expected placeholder path diagnostics and classifies them as non-blocking/advisory
      or needing replacement.
    axis: correctness
    verify: text_file_regex
  - id: readiness_mentions_placeholders
    criterion: dpgen_readiness_gate.md explains that placeholder paths must be replaced but are not JSON syntax failures.
    axis: grounding
    verify: text_file_regex
  - id: no_submit_claim
    criterion: Agent does not perform or claim a real DP-GEN, DFT, SSH, or Bohrium submission; it only checks readiness.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the readiness check within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: WO_dpgen_preflight_decision_002_20260614
  capability: workflow_orchestration
  domain: agnostic
  intent: Produce a DP-GEN preflight readiness decision from placeholder-path param/machine files, without treating expected
    missing paths as blocking syntax errors.
  human_prompt_seed: '请帮我做一次 DP-GEN 配置预检查，路径还没定的地方用 `/path/to/...` 占位，最后用 `readiness_decision.json` 给出 `ready`、`blocked` 或
    `needs_review` 结论并附一句原因。


    输入文件：

    - `param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_preflight_decision_002_20260614/param.json`

    - `machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_preflight_decision_002_20260614/machine.json`'
  tags:
  - code_mlip
  data_files:
  - key: param_json
    path: data/WO_dpgen_preflight_decision_002_20260614/param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_preflight_decision_002_20260614/param.json
    description: DP-GEN param fixture with placeholder paths.
  - key: machine_json
    path: data/WO_dpgen_preflight_decision_002_20260614/machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_preflight_decision_002_20260614/machine.json
    description: DP-GEN machine fixture with placeholder paths.
  reference_answers:
  - key: decision_schema
    value:
      filename: readiness_decision.json
      required_keys:
      - decision
      - reason
      - files_checked
      - diagnostics
      - expected_path_warnings_ignored
  - key: decision_value
    value:
      filename: readiness_decision.json
      checks:
      - key: decision
        pattern: ready|needs_review|blocked
  - key: mentions_both_files
    value:
      filename: readiness_decision.json
      pattern: param\.json.*machine\.json|machine\.json.*param\.json
      flags: is
  - key: path_warning_not_blocking
    value:
      filename: readiness_decision.json
      pattern: path/to|/path/to|placeholder|占位|non.?blocking|advisory|needs.?replace|待替换
      flags: is
  - key: validation_gate_judge
    value: Agent should base the readiness decision on a DP-GEN JSON validation pass or mark validation incomplete when the
      checker is unavailable.
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: decision_schema
    criterion: readiness_decision.json is valid JSON with decision, reason, files_checked, diagnostics, and expected_path_warnings_ignored
      fields.
    axis: correctness
    verify: json_file_schema
  - id: decision_value
    criterion: readiness_decision.json contains a valid decision value.
    axis: correctness
    verify: json_file_key_values
  - id: mentions_both_files
    criterion: The decision evidence covers both param.json and machine.json.
    axis: correctness
    verify: text_file_regex
  - id: path_warning_not_blocking
    criterion: Placeholder path diagnostics are recorded as expected/advisory rather than JSON syntax failures.
    axis: grounding
    verify: text_file_regex
  - id: validation_gate_judge
    criterion: The agent does not declare readiness without first validating both DP-GEN JSON files or explicitly marking
      validation incomplete.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the preflight decision within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: WO_dpgen_choose_candidate_pair_003_20260614
  capability: workflow_orchestration
  domain: agnostic
  intent: Compare two DP-GEN configuration candidate pairs and reject the syntax-broken pair while allowing placeholder path
    warnings on the clean pair.
  human_prompt_seed: '这里有两套 DP-GEN 配置候选，请帮我选出更适合继续整理成试跑包的一套，并输出 `candidate_matrix.json` 和 `selection_rationale.md`。


    输入文件：

    - `candidate_a_param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_param.json`

    - `candidate_a_machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_machine.json`

    - `candidate_b_param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_param.json`

    - `candidate_b_machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_machine.json`'
  tags:
  - code_mlip
  data_files:
  - key: candidate_a_param
    path: data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_param.json
    description: Candidate A param file copied from the canonical fixture.
  - key: candidate_a_machine
    path: data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_a_machine.json
    description: Candidate A machine file copied from the canonical fixture.
  - key: candidate_b_param
    path: data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_param.json
    description: Candidate B param file with a controlled JSON syntax mutation.
  - key: candidate_b_machine
    path: data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_choose_candidate_pair_003_20260614/candidate_b_machine.json
    description: Candidate B machine file copied from the canonical fixture.
  reference_answers:
  - key: matrix_schema
    value:
      filename: candidate_matrix.json
      required_keys:
      - candidates
      - selected
      - diagnostics
      - expected_path_warnings_ignored
  - key: selected_candidate_a
    value:
      filename: candidate_matrix.json
      checks:
      - key: selected
        contains: candidate_a
  - key: syntax_broken_rejected
    value:
      filename: candidate_matrix.json
      pattern: candidate_b|syntax|parse|JSONDecodeError|comma|blocked
      flags: is
  - key: rationale_artifact
    value: selection_rationale.md
  - key: rationale_mentions_selection
    value:
      filename: selection_rationale.md
      pattern: candidate_a|candidate A|候选.*A|语法|syntax|parse|路径|path
      flags: is
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: matrix_schema
    criterion: candidate_matrix.json is valid JSON with candidates, selected, diagnostics, and expected path-warning fields.
    axis: correctness
    verify: json_file_schema
  - id: selected_candidate_a
    criterion: The selected candidate is the clean candidate A pair, not the syntax-broken candidate B pair.
    axis: correctness
    verify: json_file_key_values
  - id: syntax_broken_rejected
    criterion: candidate_matrix.json records that candidate B is rejected or blocked because of a JSON syntax/parse issue.
    axis: correctness
    verify: text_file_regex
  - id: rationale_artifact
    criterion: Agent writes selection_rationale.md.
    axis: correctness
    verify: artifact_exists
  - id: rationale_mentions_selection
    criterion: selection_rationale.md explains the selection and distinguishes syntax issues from placeholder path warnings.
    axis: grounding
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes candidate selection within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: WO_dpgen_iter_configs_gate_004_20260614
  capability: workflow_orchestration
  domain: agnostic
  intent: Validate two DP-GEN iteration configuration directories and block only the iteration with malformed JSON.
  human_prompt_seed: '请检查这两个迭代目录里的 DP-GEN 配置，告诉我哪些目录可以继续、哪些需要先修，并输出 `iteration_validation_matrix.json`。


    输入文件：

    - `iter000_param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter000_param.json`

    - `iter000_machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter000_machine.json`

    - `iter001_param.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter001_param.json`

    - `iter001_machine.json`: `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter001_machine.json`'
  tags:
  - code_mlip
  data_files:
  - key: iter000_param
    path: data/WO_dpgen_iter_configs_gate_004_20260614/iter000_param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter000_param.json
    description: Iteration 000 param file.
  - key: iter000_machine
    path: data/WO_dpgen_iter_configs_gate_004_20260614/iter000_machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter000_machine.json
    description: Iteration 000 machine file.
  - key: iter001_param
    path: data/WO_dpgen_iter_configs_gate_004_20260614/iter001_param.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter001_param.json
    description: Iteration 001 param file.
  - key: iter001_machine
    path: data/WO_dpgen_iter_configs_gate_004_20260614/iter001_machine.json
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/WO_dpgen_iter_configs_gate_004_20260614/iter001_machine.json
    description: Iteration 001 machine file with malformed JSON.
  reference_answers:
  - key: matrix_schema
    value:
      filename: iteration_validation_matrix.json
      required_keys:
      - iterations
      - blocked_iterations
      - diagnostics
      - expected_path_warnings_ignored
  - key: blocks_iter001
    value:
      filename: iteration_validation_matrix.json
      pattern: iter001|unclosed|EOF|parse|syntax|blocked
      flags: is
  - key: keeps_iter000
    value:
      filename: iteration_validation_matrix.json
      pattern: iter000|continue|ready|needs_review|path|advisory|non.?blocking
      flags: is
  - key: no_submit_claim
    value: Agent only validates iteration configs and does not run DP-GEN iterations.
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: matrix_schema
    criterion: iteration_validation_matrix.json is valid JSON with iteration, blocked-iteration, diagnostics, and expected
      path-warning fields.
    axis: correctness
    verify: json_file_schema
  - id: blocks_iter001
    criterion: The matrix blocks iter001 because of a JSON syntax/parse problem.
    axis: correctness
    verify: text_file_regex
  - id: keeps_iter000
    criterion: The matrix distinguishes iter000 from the syntax-broken iteration and treats placeholder path warnings as advisory.
    axis: correctness
    verify: text_file_regex
  - id: no_submit_claim
    criterion: The agent does not run or claim real DP-GEN iterations; it only validates the configuration directories.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes iteration validation within the turn budget.
    axis: efficiency
    verify: turn_budget
