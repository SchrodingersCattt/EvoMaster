version: v5
capability: workflow_orchestration
domain: agnostic
questions:
- id: WO_dpgen_candidate_dargs_gate_001_20260616
  capability: workflow_orchestration
  domain: agnostic
  intent: Select the DP-GEN candidate pair that can continue after schema validation, rejecting the dargs-invalid pair while tolerating placeholder paths.
  human_prompt_seed: '这里有两套 DP-GEN 配置候选，A 可以继续整理，B 有 schema/type 错误。请选出可继续的一套，并只输出 `param_output.json` 和 `machine_output.json`，路径占位先保留。

    输入文件：

    - `candidate_a_param.json`: `data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_a_param.json`

    - `candidate_a_machine.json`: `data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_a_machine.json`

    - `candidate_b_param.json`: `data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_b_param.json`

    - `candidate_b_machine.json`: `data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_b_machine.json`'
  tags:
  - code_mlip
  - eng_lammps
  - eng_vasp
  data_files:
  - key: candidate_a_param
    path: data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_a_param.json
    oss_url: ''
    description: Dargs-valid DP-GEN param candidate.
  - key: candidate_a_machine
    path: data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_a_machine.json
    oss_url: ''
    description: Dargs-valid DP-GEN machine candidate.
  - key: candidate_b_param
    path: data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_b_param.json
    oss_url: ''
    description: DP-GEN param candidate with a controlled required-key error.
  - key: candidate_b_machine
    path: data/WO_dpgen_candidate_dargs_gate_001_20260616/candidate_b_machine.json
    oss_url: ''
    description: DP-GEN machine candidate with a controlled type error.
  reference_answers:
  - key: param_output_artifact
    value: param_output.json
    workspace_resolve: root
  - key: machine_output_artifact
    value: machine_output.json
    workspace_resolve: root
  - key: param_output_dargs
    value:
      filename: param_output.json
      check: schema
      kind: param
      strict: false
  - key: machine_output_dargs
    value:
      filename: machine_output.json
      check: schema
      kind: machine
      strict: false
  - key: selected_candidate_a_fingerprint
    value:
      filename: param_output.json
      tokens:
      - candidate_a_fingerprint
      - '"numb_models"'
      - '"fp_style"'
      - '"vasp"'
      flags: is
  - key: machine_group_size_candidate_a
    value:
      filename: machine_output.json
      key: model_devi.resources.group_size
      expected: 16
      tolerance: 0
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: param_output_artifact
    criterion: Agent writes selected param_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: machine_output_artifact
    criterion: Agent writes selected machine_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: param_output_dargs
    criterion: Selected param_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: machine_output_dargs
    criterion: Selected machine_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: selected_candidate_a_fingerprint
    criterion: Output corresponds to the dargs-valid candidate A rather than the invalid candidate B.
    axis: correctness
    verify: text_file_contains_all
  - id: machine_group_size_candidate_a
    criterion: Output machine keeps candidate A's numeric model_devi group_size.
    axis: correctness
    verify: json_file_numeric_range
  - id: turn_budget
    criterion: Agent completes candidate gating within the turn budget.
    axis: efficiency
    verify: turn_budget
