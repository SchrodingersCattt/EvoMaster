- id: WO_mlip_elastic_si_001_20260629
  capability: workflow_orchestration
  domain: agnostic
  intent: Compute elastic constants of Si diamond using DPA-3.1 MLIP.
  human_prompt_seed: 用 DPA 机器学习势计算 Si 金刚石结构的弹性常数，报告体模量 K 和剪切模量 G。
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: bulk_modulus_GPa
    value: 70.7
    tolerance: 15
  - key: shear_modulus_GPa
    value: 44.9
    tolerance: 10
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: bulk_modulus_GPa
    criterion: Si bulk modulus K is within tolerance of ~70.7 GPa.
    axis: correctness
    verify: numerical_range
  - id: shear_modulus_GPa
    criterion: Si shear modulus G is within tolerance of ~44.9 GPa.
    axis: correctness
    verify: numerical_range
  - id: grounding_source
    criterion: Elastic constants from DPA calculation, not literature.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical submissions.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Token usage within budget.
    axis: efficiency
    verify: token_budget

