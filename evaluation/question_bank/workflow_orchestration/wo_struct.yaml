  capability: workflow_orchestration
  domain: struct
  intent: 'Calculate vacancy formation energy: build perfect and defective supercells,
    compute energies, derive formation energy.'
  human_prompt_seed: '计算 MgO 中 O 空位的形成能：从数据库获取 MgO 岩盐结构， 构建 2x2x2 超胞作为 perfect cell，再在超胞中移除一个
    O 原子构建 defective cell， 分别优化两个结构，按 E_f = E_defective - E_perfect + mu_O 计算空位形成能。
    输出形成能 (eV) 和计算表达式。

    '
  tags:
  - defect
  - formation_energy
  - supercell
  - MgO
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
