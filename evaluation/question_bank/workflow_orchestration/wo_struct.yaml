version: v5
capability: workflow_orchestration
domain: struct
questions:
- id: WO_struct_001_20260404
  capability: workflow_orchestration
  domain: struct
  intent: Calculate surface energy of MgO(100) by constructing slab models and comparing with bulk.
  human_prompt_seed: '计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构， 先优化体相并获取单原子能量，然后切出 (100) 表面 slab（至少 5 层）， 加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。 输出表面能 (J/m2) 和计算过程中的关键能量值。

    '
  tags:
  - surface_energy
  - MgO
  - slab_calculation
  - workflow
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: surface_energy_J_m2
    value: 1.25
    tolerance: 0.35
  - key: required_fields
    value:
    - E_bulk_per_atom
    - E_slab
    - surface_area
    - surface_energy
    - convergence_check
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: surface_energy_J_m2
    criterion: Surface energy is in expected range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes bulk energy per atom, slab total energy, surface area, computed surface energy, and convergence check.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Surface energy is computed from stated bulk and slab total energies and area; formula inputs are traceable in the report rather than asserted without energy provenance. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Slab construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Surface energy workflow (bulk opt → slab build → slab opt → formula) is executed in a linear pipeline.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_struct_002_20260404
  capability: workflow_orchestration
  domain: struct
  intent: 'Calculate vacancy formation energy: build perfect and defective supercells, compute energies, derive formation energy.'
  human_prompt_seed: '计算 MgO 中 O 空位的形成能：从数据库获取 MgO 岩盐结构， 构建 2x2x2 超胞作为 perfect cell，再在超胞中移除一个 O 原子构建 defective cell， 分别优化两个结构，按 E_f = E_defective - E_perfect + mu_O 计算空位形成能。 输出形成能 (eV) 和计算表达式。

    '
  tags:
  - defect
  - formation_energy
  - supercell
  - MgO
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: formation_energy_eV
    value: 7.5
    tolerance: 1.5
  - key: required_fields
    value:
    - E_defective
    - E_perfect
    - chemical_potential
    - formation_energy
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Vacancy formation energy is in tolerance.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes defective/perfect cell energies, chemical potential definition, and formation energy formula.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Formation energy is computed from stated perfect and defective total energies with an explicit chemical potential; numbers are tied to the reported structures rather than invented. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Defect construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Vacancy formation energy workflow (build → optimize × 2 → formula) is executed without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SR_struct_001_20260410
  capability: workflow_orchestration
  domain: struct
  intent: Search a target inorganic crystal structure and report the original database source with machine-checkable provenance fields.
  human_prompt_seed: '搜索高氯酸铷（RbClO4）的晶体结构，并明确告知原始数据库来源。


    请完成以下交付：

    1) `retrieval_report.md`：说明是否找到目标结构、采用了什么检索条件、返回了多少候选、最终选中了哪个结果；

    2) `source_summary.json`：至少包含 `query_formula`, `selected_formula`, `database_source`, `structure_identifier`, `candidate_count`, `space_group`；

    3) 在最终回答中简要说明你为什么认为该结果可以代表“高氯酸铷”的晶体结构，以及来源信息是否唯一。


    注意：重点是“数据库检索 + 来源说明”，不是后续计算。

    '
  tags:
  - structure_retrieval
  - provenance
  - rubidium_perchlorate
  - database_source
  - userlog_derived
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: retrieval_report
    value: retrieval_report.md
  - key: source_summary
    value: source_summary.json
  - key: used_db_fetch
    value: mat_struct_db_fetch_structures_from_db
  - key: summary_required_tokens
    value:
      filename: source_summary.json
      tokens:
      - query_formula
      - selected_formula
      - database_source
      - structure_identifier
      - candidate_count
      - space_group
      flags: i
  - key: report_required_tokens
    value:
      filename: retrieval_report.md
      tokens:
      - RbClO4
      - 候选
      - 来源
      - 数据库
      - 检索条件
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: retrieval_report
    criterion: Agent writes `retrieval_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: source_summary
    criterion: Agent writes `source_summary.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: summary_required_tokens
    criterion: Source summary JSON includes query formula, selected structure formula, database source, structure identifier, candidate count, and space group.
    axis: correctness
    verify: text_file_contains_all
  - id: report_required_tokens
    criterion: Retrieval report explicitly describes query conditions, candidate handling, and database-source explanation.
    axis: correctness
    verify: text_file_contains_all
  - id: used_db_fetch
    criterion: Used the registered structure database retrieval tool rather than inventing a structure source.
    axis: grounding
    verify: tool_called
  - id: grounding_source
    criterion: The answer ties the selected RbClO4 structure and provenance fields to the retrieval outputs, and does not claim unsupported source certainty.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
