    value: 7.5
    tolerance: 1.5
  - key: required_fields
    value:
    - E_defective
    - E_perfect
    - chemical_potential
    - formation_energy
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Vacancy formation energy is in tolerance.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes defective/perfect cell energies, chemical potential
      definition, and formation energy formula.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Formation energy is computed from stated perfect and defective total
      energies with an explicit chemical potential; numbers are tied to the reported
      structures rather than invented. Judge solely from the final answer; do not fail
      because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Defect construction and relaxation are not repeated with identical
      parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Vacancy formation energy workflow (build → optimize × 2 → formula)
      is executed without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
