- id: WO_general_userlog_002_20260410v3
  capability: workflow_orchestration
  domain: general
  intent: Evaluate a proposal excerpt and produce structured scorecard, rationale, and risk-mitigation artifacts.
  human_prompt_seed: '工作区已提供 `proposal_excerpt.md`。


    请先读取该文件，再生成：

    1) `review_scorecard.json`：包含 `innovation_score`, `importance_score`, `feasibility_score`, `total_score`, `funding_recommendation`。

    2) `review_rationale.md`：每个维度至少两条依据，并给出风险点与改进建议。

    3) `risk_mitigation.json`：至少包含 `top_risks`, `mitigation_actions`, `owner`, `priority`。


    约束：

    - 三个分项每项范围 0~30；

    - 总分范围 0~90；

    - 不要脱离给定文本做无依据结论。

    '
