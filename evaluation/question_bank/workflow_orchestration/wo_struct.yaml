- id: WO_struct_001_20260404
  capability: workflow_orchestration
  domain: struct
  intent: Calculate surface energy of MgO(100) by constructing slab models and comparing
    with bulk.
  human_prompt_seed: '计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构， 先优化体相并获取单原子能量，然后切出 (100) 表面
    slab（至少 5 层）， 加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。
    输出表面能 (J/m2) 和计算过程中的关键能量值。

    '
  tags:
  - surface_energy
  - MgO
  - slab_calculation
  - workflow
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: surface_energy_J_m2
    value: 1.25
    tolerance: 0.35
  - key: required_fields
    value:
    - E_bulk_per_atom
    - E_slab
    - surface_area
    - surface_energy
    - convergence_check
  - key: turn_budget
    value: &id000
      max: 18
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 8000
  scoring_checklist:
  - id: surface_energy_J_m2
    criterion: Surface energy is in expected range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes bulk energy per atom, slab total energy, surface area,
      computed surface energy, and convergence check.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Surface energy is computed from stated bulk and slab total energies
      and area; formula inputs are traceable in the report rather than asserted without
      energy provenance. Judge solely from the final answer; do not fail because the
      tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Slab construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Surface energy workflow (bulk opt → slab build → slab opt → formula)
      is executed in a linear pipeline.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
