version: v5
capability: workflow_orchestration
domain: struct
questions:
- id: WO_struct_001_20260404
  capability: workflow_orchestration
  domain: struct
  intent: Calculate surface energy of MgO(100) by constructing slab models and comparing
    with bulk.
  human_prompt_seed: '计算 MgO(100) 的表面能：从数据库获取 MgO 岩盐结构， 先优化体相并获取单原子能量，然后切出 (100) 表面
    slab（至少 5 层）， 加 15 A 真空，优化 slab，按公式 gamma = (E_slab - N * E_bulk) / (2 * A) 计算表面能。
    输出表面能 (J/m2) 和计算过程中的关键能量值。

    '
  tags:
  - surface_energy
  - MgO
  - slab_calculation
  - workflow
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: surface_energy_J_m2
    value: 1.25
    tolerance: 0.35
  - key: required_fields
    value:
    - E_bulk_per_atom
    - E_slab
    - surface_area
    - surface_energy
    - convergence_check
  - key: turn_budget
    value: &id000
      max: 18
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 8000
  scoring_checklist:
  - id: surface_energy_J_m2
    criterion: Surface energy is in expected range.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes bulk energy per atom, slab total energy, surface area,
      computed surface energy, and convergence check.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Surface energy is computed from stated bulk and slab total energies
      and area; formula inputs are traceable in the report rather than asserted without
      energy provenance. Judge solely from the final answer; do not fail because the
      tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Slab construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Surface energy workflow (bulk opt → slab build → slab opt → formula)
      is executed in a linear pipeline.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_struct_002_20260404
  capability: workflow_orchestration
  domain: struct
  intent: 'Calculate vacancy formation energy: build perfect and defective supercells,
    compute energies, derive formation energy.'
  human_prompt_seed: '计算 MgO 中 O 空位的形成能：从数据库获取 MgO 岩盐结构， 构建 2x2x2 超胞作为 perfect cell，再在超胞中移除一个
    O 原子构建 defective cell， 分别优化两个结构，按 E_f = E_defective - E_perfect + mu_O 计算空位形成能。
    输出形成能 (eV) 和计算表达式。

    '
  tags:
  - defect
  - formation_energy
  - supercell
  - MgO
  priority: P0
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: formation_energy_eV
    value: 7.5
    tolerance: 1.5
  - key: required_fields
    value:
    - E_defective
    - E_perfect
    - chemical_potential
    - formation_energy
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Vacancy formation energy is in tolerance.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes defective/perfect cell energies, chemical potential
      definition, and formation energy formula.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Formation energy is computed from stated perfect and defective total
      energies with an explicit chemical potential; numbers are tied to the reported
      structures rather than invented. Judge solely from the final answer; do not fail
      because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Defect construction and relaxation are not repeated with identical
      parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Vacancy formation energy workflow (build → optimize × 2 → formula)
      is executed without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: WO_struct_003_20260411v1
  capability: workflow_orchestration
  domain: struct
  intent: Generate and summarize 10 candidate crystal structures constrained by superconducting critical temperature and space group.
  human_prompt_seed: '基于结构生成流程，生成 10 个候选晶体结构，并满足以下约束：

    1) 候选结构目标条件：超导临界温度 Tc > 40 K；

    2) 空间群编号固定为 225；

    3) 给出机器可校验的候选列表文件 `candidate_structures.json`，每条至少包含：
       `rank`, `structure_name`, `predicted_tc_k`, `space_group`, `selection_basis`；

    4) 生成 `generation_report.md`，说明生成参数（如 sample 数量、约束条件）、
       候选筛选逻辑，以及不确定性声明。

    在最终回答中简要总结：是否满足“10 个候选 + Tc 阈值 + 空间群约束”三项要求。'
  tags:
  - structure_generation
  - superconductivity
  - space_group_225
  - candidate_screening
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: candidate_json
    value: candidate_structures.json
  - key: generation_report
    value: generation_report.md
  - key: candidate_required_tokens
    value:
      filename: candidate_structures.json
      tokens:
      - rank
      - structure_name
      - predicted_tc_k
      - space_group
      - selection_basis
      - '225'
      flags: i
  - key: tc_threshold_regex
    value:
      filename: candidate_structures.json
      pattern: '"predicted_tc_k"\s*:\s*(?:4[1-9](?:\.\d+)?|[5-9]\d(?:\.\d+)?|\d{3,}(?:\.\d+)?)'
      flags: i
  - key: report_required_tokens
    value:
      filename: generation_report.md
      tokens:
      - sample_num
      - 10
      - Tc
      - 40
      - 225
      - 不确定性
      flags: i
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: candidate_json
    criterion: Agent writes `candidate_structures.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: generation_report
    criterion: Agent writes `generation_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidate_required_tokens
    criterion: Candidate JSON includes required fields and explicitly reflects the space-group 225 constraint.
    axis: correctness
    verify: text_file_contains_all
  - id: tc_threshold_regex
    criterion: Candidate JSON contains explicit Tc values above 40 K for generated entries.
    axis: correctness
    verify: text_file_regex
  - id: report_required_tokens
    criterion: Report explains generation parameters, Tc/space-group constraints, and uncertainty handling.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The final answer is grounded in generated candidate artifacts and explicitly checks the three constraints (count, Tc threshold, and space group), rather than generic superconductivity statements.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Workflow converges in a compact path (set constraints → generate candidates → summarize artifacts) without redundant loops.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
