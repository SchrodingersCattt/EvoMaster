  domain: battery
  intent: 'Evaluate a Mg-ion migration barrier in V2O3(SO4)2 (mp-28207) using an ApproxNEB workflow with
    CHGNet: interpolate between two interstitial sites, relax host atoms at fixed Mg positions, and extract
    the KRA barrier.'
  human_prompt_seed: Using the host structure in v2o3so42_mp28207.cif, implement an ApproxNEB-style evaluation
    of an ion migration pathway. Insert a Mg ion at two symmetry-equivalent interstitial sites (identify
    them using Voronoi tessellation or a site-finding algorithm). Generate 5 intermediate images by linear
    interpolation between the two end-point structures. For each image, fix the Mg ion position and relax
    only the host atoms using CHGNet with a force tolerance of 0.05 eV/Å. Compute the energy at each image,
    reference energies so the initial state is 0 eV, and report the kinetically resolved activation (KRA)
    migration barrier (highest energy along the path) to migration_barrier.txt. Also save all image structures
    to neb_images/ as individual CIF files.
