version: v5
capability: workflow_orchestration
domain: battery
questions:
- id: WO_elec_003_20260404
  capability: workflow_orchestration
  domain: battery
  intent: 'Compute doping formation energy of NFPP: retrieve structure, build doped supercell,
    use mock energies, calculate formation energy.'
  human_prompt_seed: "计算NFPP的Al掺杂形成能：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁），构建2×1×1超胞作为pristine结构；\n\
    2. 在P位（PO₄磷酸根位点）用Al替换一个P原子，构建掺杂超胞；\n3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_pristine = -689.605\
    \ eV\n   - E_doped = -687.057 eV\n   - μ_P（红磷参考态）= -5.41 eV/atom\n   - μ_Al（金属Al参考态）=\
    \ -3.75 eV/atom\n4. 按公式 E_f = E(doped) - E(pristine) + μ_P - μ_Al 计算形成能；\n5. 计算体积变化率（掺杂后体积约1313.17\
    \ Å³，原始约1316.68 Å³）；\n6. 输出掺杂形成能(eV)、体积变化率(%)。\n"
  tags:
  - struct_transform
  priority: P0
  data_files: []
  reference_answers:
  - key: formation_energy_eV
    value: 0.88
    tolerance: 0.5
  - key: volume_change_percent
    value: -0.27
    tolerance: 0.5
  - key: required_fields
    value:
    - E_pristine
    - E_doped
    - chemical_potentials
    - formation_energy
    - volume_change
  - key: turn_budget
    value: &id001
      max: 18
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Doping formation energy is computed correctly from mock energies (~0.88 eV).
    axis: correctness
    verify: numerical_range
  - id: volume_change_percent
    criterion: Volume change is computed correctly (~-0.27%).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes pristine/doped energies, chemical potentials, formation energy,
      and volume change.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies used as
      specified; chemical potentials explicitly defined. Judge solely from the final answer;
      do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Workflow (fetch → build supercell → dope → compute E_f with mock values) completes
      without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_004_20260526
  capability: workflow_orchestration
  domain: battery
  intent: Compute average Na intercalation voltage of NFPP using mock energies and
    output both sodiated/desodiated structure files.
  human_prompt_seed: "计算NFPP的平均嵌钠电压：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁，Z=4），使用单胞（104原子）；\n\
    2. 含钠态：Na₁₆Fe₁₂P₁₆O₆₀（单胞满Na，104原子）；\n   脱钠态：Na₄Fe₁₂P₁₆O₆₀（按Na3→Na1→Na4顺序脱出12个Na，92原子）；\n\
    3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_sodiated = -689.60 eV\n   - E_desodiated = -633.08\
    \ eV\n   - μ_Na（BCC Na金属）= -1.31 eV/atom\n   - n = 12（脱出的Na离子数：每个formula unit脱3个 × Z=4）\n\
    4. 按公式 V = -[E(sodiated) - E(desodiated) - n·μ_Na] / n 计算平均电压；\n5. 将含钠态和脱钠态结构分别保存为\
    \ `sodiated.cif` 和 `desodiated.cif`；\n6. 输出平均电压(V vs Na/Na⁺)、n值、各能量值。\n"
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: avg_voltage_V
    value: 3.4
    tolerance: 0.5
  - key: sodiated_atom_count
    value:
      filename: sodiated.cif
      expected: 104
  - key: desodiated_atom_count
    value:
      filename: desodiated.cif
      expected: 92
  - key: required_fields
    value:
    - E_sodiated
    - E_desodiated
    - mu_Na
    - voltage
    - voltage_formula
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: avg_voltage_V
    criterion: Average voltage is computed correctly from mock energies (~3.4 V).
    axis: correctness
    verify: numerical_range
  - id: sodiated_atom_count
    criterion: Sodiated structure file has 104 atoms.
    axis: correctness
    verify: struct_file_atom_count
  - id: desodiated_atom_count
    criterion: Desodiated structure file has 92 atoms (12 Na removed).
    axis: correctness
    verify: struct_file_atom_count
  - id: required_fields
    criterion: Report includes sodiated/desodiated energies, Na chemical potential, voltage
      formula, and computed voltage.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies and μ_Na
      used exactly as specified; voltage formula applied correctly. Judge solely from the
      final answer; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Voltage workflow (fetch → build 2 states → compute with mock values) completes
      linearly.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_diffusion_001_20260526
  capability: workflow_orchestration
  domain: battery
  scope: platform
  intent: Prepare MD submission for Li⁺ diffusion calculation in LiPF6/EC electrolyte.
    Tests system building (PACKMOL), MD parameter selection (thermostat, production
    time), and correct model/head choice for organic systems.
  human_prompt_seed: "使用 DPA 机器学习力场准备 1 mol/L LiPF₆/EC 液态电解液体系的分子动力学模拟提交配置，\
    用于计算 300K 下 Li⁺ 的自扩散系数。\n\n要求：\n- 体系约 400-600 原子（4-6 个 LiPF₆ + 对应数量\
    \ EC 分子）\n- 包含平衡阶段和 production 阶段，production 时间需满足扩散系数收敛需求\n- 输出\
    \ `md_submit.json` 提交配置\n"
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: submit_artifact
    value: md_submit.json
  - key: must_cmd_mlip
    value:
      filename: md_submit.json
      pattern: DPA|dpa|deepmd|run_molecular_dynamics
      flags: i
  - key: production_time_check
    value:
      filename: md_submit.json
      pattern: '200|250|300|400|500'
  - key: structure_min_dist
    value:
      submit_file: md_submit.json
      min_distance_A: 0.8
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 900000
  scoring_checklist:
  - id: submit_artifact
    criterion: md_submit.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_cmd_mlip
    criterion: md_submit.json references a DPA model or the run_molecular_dynamics script.
    axis: correctness
    verify: text_file_regex
  - id: structure_min_dist
    criterion: The structure file referenced in md_submit.json has no overlapping atoms
      (min interatomic distance >= 0.8 A).
    axis: correctness
    verify: md_submit_structure_min_dist
    weight: 2.0
  - id: system_composition_reasonable
    criterion: The simulated system has approximately 1 mol/L LiPF6 concentration with
      the correct ratio of Li, P, F, and EC molecules. Box size and density are
      physically reasonable (~1.2-1.4 g/cm3 for EC-based electrolyte).
    axis: correctness
    verify: llm_binary_judge
  - id: production_time_adequate
    criterion: The MD stages configuration includes a production phase of at least 200 ps
      for reliable diffusion coefficient estimation.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: thermostat_choice
    criterion: Production stage uses a thermostat suitable for transport property calculation
      (Nose-Hoover, Berendsen, or NVE) rather than Langevin which adds artificial friction.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
