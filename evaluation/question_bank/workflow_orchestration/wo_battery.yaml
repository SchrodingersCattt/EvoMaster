  intent: Build a Python workflow using pymatgen to construct a convex hull (phase diagram) for the Li–In–Sn–O
    chemical system from Materials Project data and compute the energy-above-hull for a user-provided
    target composition and energy.
  human_prompt_seed: Write a Python script that uses pymatgen to (1) query the Materials Project for all
    entries in the Li–In–Sn–O chemical system, (2) construct a convex hull (PhaseDiagram), and (3) compute
    the energy above hull (in eV/atom) for the target composition and energy specified in target_composition.json.
    Save the script as convex_hull_analysis.py and the results (including a list of competing phases on
    the hull and the target's energy above hull) as hull_results.json in the current working directory.
  tags:
  - meta_database
  data_files:
  - key: target_composition
    path: target_composition.json
    oss_url: ''
    description: JSON file specifying the target LISO composition (e.g., Li17In9SnO24) and its DFT-computed
      total energy per atom, for energy-above-hull evaluation.
  reference_answers:
  - key: artifact_script
    value:
      type: artifact_exists
      filename: convex_hull_analysis.py
  - key: artifact_results
    value:
      type: artifact_exists
      filename: hull_results.json
  - key: text_script_imports
    value:
      flags:
      - case_insensitive
      tokens:
      - from pymatgen
      - PhaseDiagram
      - ComputedEntry
      filename: convex_hull_analysis.py
  - key: text_script_api
    value:
      flags:
      - case_insensitive
      - allow_partial
      tokens:
      - get_e_above_hull
      - ChemicalSystem
      - Li-In-Sn-O
      filename: convex_hull_analysis.py
  - key: text_results_structure
    value:
      flags:
      - case_insensitive
      tokens:
      - energy_above_hull
      - competing_phases
      - hull_entries
      filename: hull_results.json
  - key: grounding_source
    value:
      filename: target_composition.json
      description: Seed data file with target composition and DFT energy
  - key: turn_budget
    value:
      max: 25
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 80000
  scoring_checklist:
  - id: artifact_script
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] convex_hull_analysis.py script exists in the output directory.'
  - id: artifact_results
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] hull_results.json file exists in the output directory.'
  - id: text_script_imports
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Script imports pymatgen PhaseDiagram and ComputedEntry (or equivalent classes).'
  - id: text_script_api
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Script calls get_e_above_hull (or equivalent) and references the Li-In-Sn-O chemical
      system.'
  - id: text_results_structure
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Results JSON contains energy_above_hull, competing_phases, and hull_entries fields.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] Agent correctly reads the target_composition.json file and uses its composition
      and energy values.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Agent completes the task within 25 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] Agent does not retry any tool calls.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Agent uses fewer than 80000 total tokens.'
- id: WF_chgnet_002_20250618
  capability: workflow_orchestration
  domain: battery
  intent: Run an NVT molecular dynamics simulation on a LiMnO2 supercell using CHGNet at 1100 K with a
    2 fs timestep, and compute the average potential energy and mean magnetic moment per Mn atom.
  human_prompt_seed: Construct a 2×2×2 supercell from the provided LiMnO2 structure (limno2_supercell.cif),
    then run a 10 ps NVT molecular dynamics simulation at 1100 K with a 2 fs timestep using CHGNet. Save
    the trajectory as md_trajectory.extxyz and write a summary to md_summary.json containing the average
    potential energy (eV) and the mean magnetic moment per Mn atom (μB).
  tags:
  - code_mlip
  data_files:
  - key: limno2_supercell
    path: limno2_supercell.cif
    oss_url: ''
    description: Orthorhombic LiMnO2 structure from Materials Project (o-LMO). Agent should construct
      a 2×2×2 supercell.
  reference_answers:
  - key: trajectory_exists
    value: md_trajectory.extxyz
  - key: summary_exists
    value: md_summary.json
  - key: avg_energy_range
    value:
      checks:
      - key: avg_potential_energy
        max: 0.0
        min: -800.0
        allow_missing_key: false
      filename: md_summary.json
  - key: avg_magmom_range
    value:
      checks:
      - key: avg_magmom_per_mn
        max: 4.5
        min: 2.5
        allow_missing_key: false
      filename: md_summary.json
  - key: timestep_correct
    value:
      flags:
      - IGNORECASE
      pattern: 2.*fs|timestep.*2|dt.*2
      filename: md_trajectory.extxyz
  - key: grounding_source
    value:
      filename: limno2_supercell.cif
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: trajectory_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file md_trajectory.extxyz exists and contains trajectory frames.'
  - id: summary_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file md_summary.json exists and contains valid JSON.'
  - id: avg_energy_range
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Average potential energy in md_summary.json is a negative value in a physically
      reasonable range for a LiMnO2 supercell.'
  - id: avg_magmom_range
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Mean magnetic moment per Mn atom in md_summary.json is between 2.5 and 4.5
      μB (consistent with Mn³⁺/Mn⁴⁺ mixed valence at 1100 K).'
  - id: timestep_correct
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] MD simulation used a 2 fs timestep as specified in the paper''s Methods.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] Agent used the provided limno2_supercell.cif as the basis structure and constructed
      a supercell.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Completed within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retries needed.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Completed within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Total token usage within 50,000 tokens.'
- id: WF_interface_003_20250508
  capability: workflow_orchestration
  domain: battery
  intent: Construct an interface between spinel variants α₁ and α₄ along the (110) plane and compute the
    interfacial energy using the CHGNet machine learning interatomic potential, reproducing the lowest-energy
    interface found in the paper.
  human_prompt_seed: Construct an interface between spinel variants α₁ and α₄ along the (110) crystallographic
    plane starting from the provided limn2o4_spinel.cif structure. Build the interface cell with two interfaces
    separated by at least 10 Å. Compute the interfacial energy (γ) at the fully delithiated Mn₂O₄ composition
    using CHGNet. Save the interface structure as interface_alpha1_alpha4_110.vasp and write the computed
    interfacial energy in J/m² to interfacial_energy.txt.
  tags:
  - code_mlip
  data_files:
  - key: spinel_base
    path: limn2o4_spinel.cif
    oss_url: ''
    description: LiMn2O4 spinel crystal structure (Fd-3m) from Materials Project, used as the base structure
      from which the agent constructs α₁ and α₄ variants before building the interface.
  reference_answers:
  - key: artifact_interface_structure
    value: interface_alpha1_alpha4_110.vasp
  - key: artifact_energy_file
    value: interfacial_energy.txt
  - key: energy_value
    value:
      checks:
      - key: interfacial_energy_J_m2
        max: 0.3
        min: 0.1
        allow_missing_key: false
      filename: interfacial_energy.txt
  - key: grounding_source
    value:
      filename: limn2o4_spinel.cif
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 900
  - key: token_budget_total
    value:
      max: 100000
  scoring_checklist:
  - id: artifact_interface_structure
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Interface structure file interface_alpha1_alpha4_110.vasp exists.'
  - id: artifact_energy_file
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Interfacial energy output file interfacial_energy.txt exists.'
  - id: energy_value
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Interfacial energy γ is in the range 0.1–0.3 J/m², consistent with the paper''s
      reported value of 0.18 J/m² for the α₁-α₄ (110) interface.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The agent used the provided spinel variant structure files to construct the interface.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completed within turn budget.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent did not exceed retry budget.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completed within duration budget.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent completed within token budget.'
