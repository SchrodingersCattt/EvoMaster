- id: WO_elec_003_20260404
  capability: workflow_orchestration
  domain: battery
  intent: 'Compute doping formation energy of NFPP: retrieve structure, build doped supercell,
    use mock energies, calculate formation energy.'
  human_prompt_seed: "计算NFPP的Al掺杂形成能：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁），构建2×1×1超胞作为pristine结构；\n\
    2. 在P位（PO₄磷酸根位点）用Al替换一个P原子，构建掺杂超胞；\n3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_pristine = -689.605\
    \ eV\n   - E_doped = -687.057 eV\n   - μ_P（红磷参考态）= -5.41 eV/atom\n   - μ_Al（金属Al参考态）=\
    \ -3.75 eV/atom\n4. 按公式 E_f = E(doped) - E(pristine) + μ_P - μ_Al 计算形成能；\n5. 计算体积变化率（掺杂后体积约1313.17\
    \ Å³，原始约1316.68 Å³）；\n6. 输出掺杂形成能(eV)、体积变化率(%)。\n"
  tags:
  - struct_transform
  priority: P0
  data_files: []
  reference_answers:
  - key: formation_energy_eV
    value: 0.88
    tolerance: 0.5
  - key: volume_change_percent
    value: -0.27
    tolerance: 0.5
  - key: required_fields
    value:
    - E_pristine
    - E_doped
    - chemical_potentials
    - formation_energy
    - volume_change
  - key: turn_budget
    value: &id001
      max: 18
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Doping formation energy is computed correctly from mock energies (~0.88 eV).
    axis: correctness
    verify: numerical_range
  - id: volume_change_percent
    criterion: Volume change is computed correctly (~-0.27%).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes pristine/doped energies, chemical potentials, formation energy,
      and volume change.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies used as
      specified; chemical potentials explicitly defined. Judge solely from the final answer;
      do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Workflow (fetch → build supercell → dope → compute E_f with mock values) completes
      without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_004_20260404
  capability: workflow_orchestration
  domain: battery
  intent: Compute average Na intercalation voltage of NFPP using mock energies.
  human_prompt_seed: "计算NFPP的平均嵌钠电压：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁，Z=4），使用单胞（104原子）；\n\
    2. 含钠态：Na₁₆Fe₁₂P₁₆O₆₀（单胞满Na，104原子）；\n   脱钠态：Na₄Fe₁₂P₁₆O₆₀（按Na3→Na1→Na4顺序脱出12个Na，92原子）；\n\
    3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_sodiated = -689.60 eV\n   - E_desodiated = -633.08\
    \ eV\n   - μ_Na（BCC Na金属）= -1.31 eV/atom\n   - n = 12（脱出的Na离子数：每个formula unit脱3个 × Z=4）\n\
    4. 按公式 V = -[E(sodiated) - E(desodiated) - n·μ_Na] / n 计算平均电压；\n5. 输出平均电压(V vs Na/Na⁺)、n值、各能量值。\n"
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: avg_voltage_V
    value: 3.4
    tolerance: 0.5
  - key: required_fields
    value:
    - E_sodiated
    - E_desodiated
    - mu_Na
    - voltage
    - voltage_formula
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: avg_voltage_V
    criterion: Average voltage is computed correctly from mock energies (~3.4 V).
    axis: correctness
    verify: numerical_range
  - id: sodiated_state
    criterion: Sodiated state is the full unit cell Na₁₆Fe₁₂P₁₆O₆₀ with 104 atoms and all
      16 Na sites occupied.
    axis: correctness
    verify: llm_binary_judge
  - id: desodiated_state
    criterion: Desodiated state Na₄Fe₁₂P₁₆O₆₀ has 92 atoms with exactly 12 Na removed following
      Na3→Na1→Na4 site order.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes sodiated/desodiated energies, Na chemical potential, voltage
      formula, and computed voltage.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies and μ_Na
      used exactly as specified; voltage formula applied correctly. Judge solely from the
      final answer; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Voltage workflow (fetch → build 2 states → compute with mock values) completes
      linearly.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_diffusion_001_20260525
  capability: workflow_orchestration
  domain: battery
  scope: platform
  intent: Compute the self-diffusion coefficient of Li⁺ in a 1 mol/L LiPF6/EC liquid
    electrolyte via MLIP MD. The agent must choose an adequate production time
    (≥200 ps) and verify MSD linearity before reporting D.
  human_prompt_seed: "使用 DPA 机器学习力场对 1 mol/L LiPF₆/EC 液态电解液体系进行分子动力学模拟，\
    计算 300K 下 Li⁺ 的自扩散系数。\n\n要求：\n- 体系约 400-600 原子（4-6 个 LiPF₆ + 对应数量 EC 分子）\n\
    - NVT 系综，300K\n- 报告 Li⁺ 自扩散系数（单位 cm²/s）\n"
  tags:
  - code_mlip
  source_session: 5f7f7485cce64440ba5ce8b1fd2db4fc
  data_files: []
  reference_answers:
  - key: production_time_ps
    value:
      min: 200
    unit: ps
    description: Production MD time must be ≥200 ps for reliable diffusion coefficient.
  - key: diffusion_coefficient
    value:
      order_of_magnitude: -6
      tolerance_log10: 1.5
    unit: cm2/s
    description: Li+ diffusion in 1M LiPF6/EC at 300K is typically 1e-7 to 1e-5 cm2/s.
  - key: turn_budget
    value:
      max: 40
  - key: duration_budget
    value:
      max: 14400000
  - key: token_budget_total
    value:
      max: 15000
  scoring_checklist:
  - id: production_time_adequate
    criterion: The MD production (data-collection) phase is at least 200 ps. A production
      time of 30 ps or less is a clear failure — insufficient for converged MSD in
      liquid electrolytes where Li+ D ~ 1e-6 cm2/s.
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: msd_linearity_checked
    criterion: Agent verifies that MSD has entered the linear (diffusive) regime before
      fitting D. Evidence includes checking MSD slope stability, excluding ballistic
      regime, or plotting MSD vs time.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: equilibration_excluded
    criterion: The equilibration phase is excluded from MSD calculation. Agent uses a
      separate equilibration stage or discards initial trajectory data.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: diffusion_reported
    criterion: A numerical Li+ diffusion coefficient is reported with correct units (cm2/s).
      The value should be in the range 1e-7 to 1e-5 for this system at 300K.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: system_composition_reasonable
    criterion: The simulated system has approximately 1 mol/L LiPF6 concentration with
      the correct ratio of Li, P, F, and EC molecules. Box size and density are
      physically reasonable (~1.2-1.4 g/cm3 for EC-based electrolyte).
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
