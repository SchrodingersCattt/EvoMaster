      - key: num_neb_images
        expected: 7
        tolerance: 0
        allow_missing_key: false
      filename: migration_barrier.txt
  - key: grounding_source
    value:
      filename: v2o3so42_mp28207.cif
  - key: duration_budget
    value:
      max: 900
  - key: no_retries
    value:
      max: 0
  - key: token_budget_total
    value:
      max: 100000
  - key: turn_budget
    value:
