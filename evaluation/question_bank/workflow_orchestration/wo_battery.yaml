version: v5
capability: workflow_orchestration
domain: battery
questions:
- id: WO_md_preflight_001_20260513
  capability: workflow_orchestration
  domain: battery
  intent: Test whether agent validates solution box geometry before MD submission and
    fixes overlapping atoms.
  human_prompt_seed: '工作区中有一个 1 mol/L ZnSO4 水溶液模型 `znso4_box.xyz`（约 500 原子）。请采用
    DP-MD 方法对其进行 10 ps NVT 300K 模拟，准备好提交配置，输出为 `md_submit.json`。'
  tags:
  - code_mlip
  data_files:
  - key: znso4_box
    path: data/WO_dpmd_preflight_001/znso4_box.xyz
    oss_url: ''
    description: ZnSO4 solution box (~468 atoms) with intentional atom overlaps (min_dist
      ~0.3 A).
  reference_answers:
  - key: submit_artifact
    value: md_submit.json
  - key: must_cmd_dpa3
    value:
      filename: md_submit.json
      pattern: DPA3
      flags: i
  - key: must_cmd_md
    value:
      filename: md_submit.json
      pattern: run_molecular_dynamics
      flags: ''
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: submit_artifact
    criterion: md_submit.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_cmd_dpa3
    criterion: '[Must] cmd references DPA3 model.'
    axis: correctness
    verify: text_file_regex
  - id: must_cmd_md
    criterion: '[Must] cmd uses run_molecular_dynamics script.'
    axis: correctness
    verify: text_file_regex
  - id: structure_not_raw
    criterion: The --structure argument in md_submit.json cmd does NOT point to the
      raw input file znso4_box.xyz. It must reference a different file (optimized,
      relaxed, or otherwise pre-processed). If the cmd uses znso4_box.xyz directly
      as the structure for MD, this criterion FAILS.
    axis: correctness
    verify: llm_binary_judge
  - id: structure_preprocessed
    criterion: Agent performed structural pre-processing on znso4_box.xyz before MD
      submission — either energy minimization, geometry optimization, overlap removal,
      or relaxation — evidenced by tool calls producing a new structure file.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: WO_elec_003_20260404
  capability: workflow_orchestration
  domain: battery
  intent: 'Compute doping formation energy of NFPP: retrieve structure, build doped supercell,
    use mock energies, calculate formation energy.'
  human_prompt_seed: "计算NFPP的Al掺杂形成能：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁），构建2×1×1超胞作为pristine结构；\n\
    2. 在P位（PO₄磷酸根位点）用Al替换一个P原子，构建掺杂超胞；\n3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_pristine = -689.605\
    \ eV\n   - E_doped = -687.057 eV\n   - μ_P（红磷参考态）= -5.41 eV/atom\n   - μ_Al（金属Al参考态）=\
    \ -3.75 eV/atom\n4. 按公式 E_f = E(doped) - E(pristine) + μ_P - μ_Al 计算形成能；\n5. 计算体积变化率（掺杂后体积约1313.17\
    \ Å³，原始约1316.68 Å³）；\n6. 输出掺杂形成能(eV)、体积变化率(%)。\n"
  tags:
  - struct_transform
  priority: P0
  data_files: []
  reference_answers:
  - key: formation_energy_eV
    value: 0.88
    tolerance: 0.5
  - key: volume_change_percent
    value: -0.27
    tolerance: 0.5
  - key: required_fields
    value:
    - E_pristine
    - E_doped
    - chemical_potentials
    - formation_energy
    - volume_change
  - key: turn_budget
    value: &id001
      max: 18
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: formation_energy_eV
    criterion: Doping formation energy is computed correctly from mock energies (~0.88 eV).
    axis: correctness
    verify: numerical_range
  - id: volume_change_percent
    criterion: Volume change is computed correctly (~-0.27%).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes pristine/doped energies, chemical potentials, formation energy,
      and volume change.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies used as
      specified; chemical potentials explicitly defined. Judge solely from the final answer;
      do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Workflow (fetch → build supercell → dope → compute E_f with mock values) completes
      without redundant steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: WO_elec_004_20260404
  capability: workflow_orchestration
  domain: battery
  intent: Compute average Na intercalation voltage of NFPP using mock energies.
  human_prompt_seed: "计算NFPP的平均嵌钠电压：\n1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁，Z=4），使用单胞（104原子）；\n\
    2. 含钠态：Na₁₆Fe₁₂P₁₆O₆₀（单胞满Na，104原子）；\n   脱钠态：Na₄Fe₁₂P₁₆O₆₀（按Na3→Na1→Na4顺序脱出12个Na，92原子）；\n\
    3. 使用以下mock能量值（模拟DPA弛豫结果）：\n   - E_sodiated = -689.60 eV\n   - E_desodiated = -633.08\
    \ eV\n   - μ_Na（BCC Na金属）= -1.31 eV/atom\n   - n = 12（脱出的Na离子数：每个formula unit脱3个 × Z=4）\n\
    4. 按公式 V = -[E(sodiated) - E(desodiated) - n·μ_Na] / n 计算平均电压；\n5. 输出平均电压(V vs Na/Na⁺)、n值、各能量值。\n"
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: avg_voltage_V
    value: 3.4
    tolerance: 0.5
  - key: required_fields
    value:
    - E_sodiated
    - E_desodiated
    - mu_Na
    - voltage
    - voltage_formula
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: avg_voltage_V
    criterion: Average voltage is computed correctly from mock energies (~3.4 V).
    axis: correctness
    verify: numerical_range
  - id: sodiated_state
    criterion: Sodiated state is the full unit cell Na₁₆Fe₁₂P₁₆O₆₀ with 104 atoms and all
      16 Na sites occupied.
    axis: correctness
    verify: llm_binary_judge
  - id: desodiated_state
    criterion: Desodiated state Na₄Fe₁₂P₁₆O₆₀ has 92 atoms with exactly 12 Na removed following
      Na3→Na1→Na4 site order.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes sodiated/desodiated energies, Na chemical potential, voltage
      formula, and computed voltage.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: NFPP structure uses correct Pna2₁ lattice parameters; mock energies and μ_Na
      used exactly as specified; voltage formula applied correctly. Judge solely from the
      final answer; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Voltage workflow (fetch → build 2 states → compute with mock values) completes
      linearly.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
