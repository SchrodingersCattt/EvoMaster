- id: WO_mech_003_20260404
  capability: workflow_orchestration
  domain: mech
  intent: Compute vacancy formation energies for Fe-X doped supercells from mock BSSE-corrected
    energies; compare to QE references and rank trends.
  human_prompt_seed: |
    掺杂 Fe 合金单空位形成能（mock 数据，不跑真实 DFT）。对下列 7 个体系使用同一公式：

    E_f,vac = E_vac + μ_A − E_novac

    其中 E_vac 已对空位做 ABACUS LCAO 的 BSSE 校正（空位处含 ghost/empty 基组），E_novac 为无空位超胞能量，μ_A 为移除原子的化学势（题面给定）。

    Mock 数据（单位 eV）：
    - Fe53Cr: E_novac=-963.52, E_vac=-946.21, μ_A=-15.23；QE 参考 E_f=2.00
    - Fe53Al: E_novac=-958.73, E_vac=-942.88, μ_A=-13.98；QE 参考 E_f=1.92
    - Fe53Ti: E_novac=-961.45, E_vac=-944.82, μ_A=-14.70；QE 参考 E_f=1.99
    - Fe53Co: E_novac=-968.91, E_vac=-951.02, μ_A=-15.70；QE 参考 E_f=2.26
    - Fe53Mo: E_novac=-967.23, E_vac=-949.91, μ_A=-15.30；QE 参考 E_f=2.13
    - Fe53Nb: E_novac=-964.85, E_vac=-948.32, μ_A=-14.68；QE 参考 E_f=1.91
    - Fe53B:  E_novac=-955.40, E_vac=-939.54, μ_A=-13.93；QE 参考 E_f=1.97

    要求：逐个计算 E_f,vac；给出 ABACUS(mock) 与 QE 的对比表；按 E_f 从低到高排序并简要讨论哪种掺杂趋势上更利于空位形成。说明为何 E_vac 需要 BSSE 校正。
  tags:
  - abacus
  - bsse
  - vacancy
  - mock_energy
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: ef_Fe53Cr_eV
    value: 2.08
    tolerance: 0.15
  - key: ef_Fe53Al_eV
    value: 1.87
    tolerance: 0.15
  - key: ef_Fe53Co_eV
    value: 2.19
    tolerance: 0.15
  - key: required_fields
    value:
    - table
    - ranking
    - bsse_note
    - qe_compare
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: ef_Fe53Cr_eV
    criterion: Fe53Cr vacancy formation energy from mock data is within tolerance
      (~2.08 eV).
    axis: correctness
    verify: numerical_range
  - id: ef_Fe53Al_eV
    criterion: Fe53Al vacancy formation energy from mock data is within tolerance
      (~1.87 eV).
    axis: correctness
    verify: numerical_range
  - id: ef_Fe53Co_eV
    criterion: Fe53Co vacancy formation energy from mock data is within tolerance
      (~2.19 eV).
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Report includes a table for all seven systems, ABACUS vs QE comparison,
      sorted ranking by E_f, and BSSE note for E_vac.
    axis: correctness
    verify: llm_binary_judge
  - id: bsse_vacancy_note
    criterion: Explains that NAO basis at the vacancy is incomplete and BSSE-corrected
      E_vac is needed for meaningful E_f,vac.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All numeric E_f values are derived from the prompt mock energies only
      (no invented totals). Judge solely from the final answer; do not fail because
      the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Completes seven-system table and discussion without unnecessary exploratory
      steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
