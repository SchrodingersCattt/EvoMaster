version: v5
capability: workflow_orchestration
domain: agnostic
questions:
- id: WO_gpumdnep_001_20260428
  capability: workflow_orchestration
  domain: agnostic
  intent: Build MoSe2 training dataset, generate ABACUS static input, and prepare NEP input.
  human_prompt_seed: '构建 MoSe2 训练集，覆盖原型、应变、扰动、空位等情形，并将训练集统一命名为 `train.xyz`（总帧数 > 100）。
    基于该训练集生成 ABACUS 静态计算输入文件 `INPUT_scf`。
    生成用于该体系训练的 `nep.in`。'
  tags: [code_mlip, abacus, wf_inputs, wf_sweep]
  data_files: []
  reference_answers:
  - key: train_xyz_artifact
    value: train.xyz
  - key: abacus_input_artifact
    value: INPUT_scf
  - key: nep_artifact
    value: nep.in
  - key: abacus_static_tokens
    value:
      filename: INPUT_scf
      tokens: [calculation scf, basis_type]
      flags: i
  - key: nep_type_mose
    value:
      filename: nep.in
      pattern: ^\s*type\s+\d+\s+.*\bMo\b.*\bSe\b.*$
      flags: im
  - key: nep_core_tokens
    value:
      filename: nep.in
      tokens: [cutoff, n_max, basis_size, neuron, batch, generation]
      flags: i
  scoring_checklist:
  - id: train_xyz_artifact
    criterion: 生成 `train.xyz`。
    axis: correctness
    verify: artifact_exists
  - id: abacus_input_artifact
    criterion: 生成 `INPUT_scf`。
    axis: correctness
    verify: artifact_exists
  - id: nep_artifact
    criterion: 生成 `nep.in`。
    axis: correctness
    verify: artifact_exists
  - id: abacus_static_tokens
    criterion: ABACUS 静态输入包含核心参数。
    axis: correctness
    verify: text_file_contains_all
  - id: nep_type_mose
    criterion: "`nep.in` 的 `type` 包含 `Mo` 和 `Se`。"
    axis: correctness
    verify: text_file_regex
  - id: nep_core_tokens
    criterion: "`nep.in` 包含关键训练参数。"
    axis: correctness
    verify: text_file_contains_all

- id: WO_gpumdnep_002_20260428
  capability: workflow_orchestration
  domain: agnostic
  intent: Predict Si phonon spectrum using Si_Fan_2019 Tersoff mini potential and assess optical-branch frequency.
  human_prompt_seed: '获取https://raw.githubusercontent.com/brucefan1983/GPUMD/master/potentials/tersoff/Si_Fan_2019.txt，使用这个势函数采取gpumd计算Si的声子谱，计算出Si光学支频率'
  tags: [code_mlip, phy_phonon, wf_inputs, wf_postprocess, wf_report]
  data_files: []
  reference_answers:
  - key: run_input_artifact
    value: run.in
  - key: si_fan_potential_token
    value:
      filename: run.in
      tokens:
      - potential
      - Si_Fan_2019.txt
      flags: i
  - key: phonon_core_tokens
    value:
      filename: run.in
      tokens:
      - replicate
      - compute_phonon
      flags: i
  - key: si_optical_branch_15thz
    value: {}
  scoring_checklist:
  - id: run_input_artifact
    criterion: 生成 `run.in`。
    axis: correctness
    verify: artifact_exists
  - id: si_fan_potential_token
    criterion: "`run.in` 使用 `Si_Fan_2019.txt` 势函数。"
    axis: correctness
    verify: text_file_contains_all
  - id: phonon_core_tokens
    criterion: "`run.in` 包含 `replicate` 与 `compute_phonon` 两个关键设置。"
    axis: correctness
    verify: text_file_contains_all
  - id: si_optical_branch_15thz
    criterion: Si 光学支结果在约 15 THz 量级（可接受小范围偏差）。
    axis: correctness
    verify: llm_binary_judge

