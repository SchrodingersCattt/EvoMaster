  domain: agnostic
  intent: Predict Si phonon spectrum using Si_Fan_2019 Tersoff mini potential and assess optical-branch frequency.
  human_prompt_seed: '获取https://raw.githubusercontent.com/brucefan1983/GPUMD/master/potentials/tersoff/Si_Fan_2019.txt，使用这个势函数采取gpumd计算Si的声子谱，计算出Si光学支频率'
