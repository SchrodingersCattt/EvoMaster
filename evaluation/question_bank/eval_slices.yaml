# eval_slices.yaml — Maps each skill / tool / prompt to its evaluation slices.
#
# Slice notation:
#   <capability>            — all questions in that capability
#   <capability>@<tag>      — questions in that capability with given tag
#   @<tag>                  — questions across ALL capabilities with given tag
#
# Multiple tags with comma are AND: @t1,t2 matches questions having both tags.

