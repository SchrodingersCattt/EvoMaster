# eval_slices.yaml — Maps each skill / tool / prompt to its evaluation slices.
#
# Slice notation:  <capability>@<tag>
#   capability = question_bank subdirectory (input_generation, workflow_orchestration, …)
#   tag        = question-level tag used to filter (vasp, abacus, code_mlip, …)
#   When no @tag, the entire capability directory is the slice.

version: "v1"

slices:

  # ── Skills ──────────────────────────────────────────────────────────

  - target: "Skill: vasp"
    type: skill
    slices:
      - input_generation@vasp
      - workflow_orchestration@vasp
    count: 24

  - target: "Skill: abacus"
    type: skill
    slices:
      - input_generation@abacus
      - workflow_orchestration@abacus
    count: 13

  - target: "Skill: gpumd"
    type: skill
    slices:
      - input_generation@gpumd
    count: 11

  - target: "Skill: mlips"
    type: skill
    slices:
      - workflow_orchestration@code_mlip
      - input_generation@code_mlip
      - input_generation@code_dpa
    count: 24

  - target: "Skill: atomic-structure"
    type: skill
    slices:
      - structure_construction
    count: 11

  - target: "Skill: tasker-polar-surface"
    type: skill
    slices:
      - structure_construction@phy_surface
      - workflow_orchestration@phy_surface
    count: 44

  - target: "Skill: xrd + checkcif"
    type: skill
    slices:
      - scientific_analysis@char_xrd
      - scientific_analysis@char_cif_validation
    count: 4

  - target: "Skill: data-analysis"
    type: skill
    slices:
      - data_diagnosis
    count: 3

  - target: "Skill: cp2k"
    type: skill
    slices:
      - input_generation@cp2k
    count: 1

  - target: "Skill: lammps"
    type: skill
    slices:
      - input_generation@lammps
    count: 1

  - target: "Skill: gromacs"
    type: skill
    slices:
      - input_generation@gromacs
    count: 1

  # ── Tools ───────────────────────────────────────────────────────────

  - target: "Tool: mcp-mat-struct-db"
    type: tool
    slices:
      - structure_retrieval
    count: 8

  - target: "Tool: Bohrium batch/sweep"
    type: tool
    slices:
      - batch_processing
      - workflow_orchestration@wf_batch
      - workflow_orchestration@wf_sweep
    count: 13

  # ── Prompts ─────────────────────────────────────────────────────────

  - target: "Prompt: safety"
    type: prompt
    slices:
      - safety_refusal
    count: 6

  - target: "Prompt: execution contract"
    type: prompt
    slices:
      - execution_contract
    count: 9

  - target: "Prompt: scientific analysis"
    type: prompt
    slices:
      - scientific_analysis
    count: 7

  # ── Cross-cutting ───────────────────────────────────────────────────

  - target: "Cross: hybrid DFT"
    type: cross
    slices:
      - input_generation@hybrid_functional
      - workflow_orchestration@hybrid_functional
    count: 5

  - target: "Cross: phonon"
    type: cross
    slices:
      - workflow_orchestration@phy_phonon
      - scientific_analysis@phy_phonon
    count: 8

  - target: "Cross: defect"
    type: cross
    slices:
      - structure_construction@phy_defect
      - workflow_orchestration@phy_defect
    count: 11

  - target: "Cross: MD workflow"
    type: cross
    slices:
      - input_generation@phy_md
      - workflow_orchestration@phy_md
    count: 17
