      pattern: mp-1080238
      filename: alpha_mno2.cif
  - key: beta_mno2_mp_id
    value:
      pattern: mp-29159
      filename: beta_mno2.cif
  - key: gamma_mno2_mp_id
    value:
      pattern: mp-626068
      filename: gamma_mno2.cif
  - key: delta_mno2_mp_id
