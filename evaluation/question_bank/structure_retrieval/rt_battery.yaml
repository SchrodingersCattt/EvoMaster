    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] File beta_mno2.cif exists in the working directory'
  - id: gamma_mno2_exists
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] File gamma_mno2.cif exists in the working directory'
  - id: delta_mno2_exists
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] File delta_mno2.cif exists in the working directory'
  - id: alpha_mno2_mp_id
    axis: correctness
    verify: text_file_regex
    weight: 10.0
    criterion: '[Must] alpha_mno2.cif contains the MP identifier mp-1080238'
  - id: beta_mno2_mp_id
    axis: correctness
    verify: text_file_regex
    weight: 10.0
    criterion: '[Must] beta_mno2.cif contains the MP identifier mp-29159'
  - id: gamma_mno2_mp_id
    axis: correctness
    verify: text_file_regex
    weight: 10.0
    criterion: '[Must] gamma_mno2.cif contains the MP identifier mp-626068'
