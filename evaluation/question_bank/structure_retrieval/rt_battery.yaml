version: v5
capability: structure_retrieval
domain: battery
questions:
- id: SR_db_004_20260416v1
  capability: structure_retrieval
  domain: battery
  intent: Retrieve five Li-Mn-O materials from Alexandria and summarize machine-checkable
    provenance metadata.
  human_prompt_seed: '从 Alexandria 数据源检索包含 Li、Mn、O 三种元素的材料，并返回 5 条候选。

    请完成以下交付：

    1) `lmo_candidates.json`：列出 5 条候选，每条至少包含 `rank`, `formula`, `database_source`, `structure_identifier`,
    `elements`, `format_available`；

    2) `lmo_retrieval_report.md`：说明检索条件（元素约束、结果数量）、候选筛选与结果不确定性；

    3) 在最终回答中简要确认：是否满足“Li+Mn+O 全部同时包含”与“共 5 条”这两个约束。

    注意：本题是结构检索与汇总，不要求后续计算。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: candidates_json
    value: lmo_candidates.json
  - key: retrieval_report
    value: lmo_retrieval_report.md
  - key: candidates_required_tokens
    value:
      filename: lmo_candidates.json
      tokens:
      - rank
      - formula
      - database_source
      - structure_identifier
      - elements
      - format_available
      - Li
      - Mn
      - O
      flags: i
  - key: report_required_tokens
    value:
      filename: lmo_retrieval_report.md
      tokens:
      - Alexandria
      - Li
      - Mn
      - O
      - 5
      - 检索条件
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: candidates_json
    criterion: Agent writes `lmo_candidates.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: retrieval_report
    criterion: Agent writes `lmo_retrieval_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidates_required_tokens
    criterion: Candidate JSON includes required provenance fields and explicitly contains
      Li/Mn/O element information.
    axis: correctness
    verify: text_file_contains_all
  - id: report_required_tokens
    criterion: Retrieval report states Alexandria source, filter constraints, candidate count,
      and uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The final answer is grounded in retrieval outputs and accurately reflects whether
      all constraints (elements + count) are met.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SR_polyanion_formula_001_20260524
  capability: structure_retrieval
  domain: battery
  priority: P1
  intent: Test retrieval of a polyanion cathode material where the full structural
    formula (with grouped anions like (PO₄)₂P₂O₇) will not match database entries
    directly. Agent must recognize that databases store reduced/simplified formulae
    and try alternative query forms (e.g., Na4Fe3P4O15 instead of Na4Fe3(PO4)2P2O7).
    From real trajectory where agent spent 168 events failing with full formula while
    simplified formula hit immediately.
  human_prompt_seed: '请从结构数据库中获取 Na₄Fe₃(PO₄)₂P₂O₇ 的晶体结构，空间群应为 Pna2₁。
    输出 CIF 文件到 `NFPP.cif`，并用 pymatgen 验证空间群是否正确。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: NFPP.cif
  - key: must_formula_in_cif
    value:
      filename: NFPP.cif
      pattern: (?i)(Na.*Fe.*P.*O|Na4Fe3P4O15)
      flags: i
  - key: must_spacegroup_verified
    value:
      filename: '*'
      pattern: (?i)(Pna2.1|Pna21|P\s*n\s*a\s*2.*1|space.group.*33)
      flags: i
      glob: true
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: cif_artifact
    criterion: Agent writes NFPP.cif (or equivalent CIF) to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: must_formula_in_cif
    criterion: '[Must] CIF file contains Na-Fe-P-O compound matching Na4Fe3P4O15
      stoichiometry.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: spacegroup_correct
    criterion: '[Must] Agent verifies (via pymatgen or CIF header) that the retrieved
      structure has space group Pna2₁ (or #33). If the structure does not match, agent
      must report the discrepancy rather than delivering a wrong structure.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: formula_adaptation
    criterion: '[Must] Agent does NOT give up after initial query failure. It tries
      at least one alternative formula representation (reduced formula, Hill notation,
      or element-only query) when the full polyanion formula fails to match.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: no_manual_construction
    criterion: Agent retrieves the structure from a database rather than manually
      constructing it from literature Wyckoff positions. Manual CIF construction from
      scraped coordinates is fragile and error-prone.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: SR_licoo2_001_20250618
  capability: structure_retrieval
  domain: battery
  intent: Retrieve the LiCoO2 crystal structure from the Materials Project and verify its lattice parameters
    against published first-principles values.
  human_prompt_seed: Retrieve the LiCoO2 structure from Materials Project (mp-24659) using pymatgen. Verify
    the lattice parameters and space group match the literature values (a ≈ 2.83 Å, c ≈ 14.21 Å, space
    group R-3m). Save the structure as a CIF file named licoo2_bulk.cif and write a summary file licoo2_structure_summary.txt
    containing the lattice constants, space group, and formation energy per atom.
  tags:
  - eng_vasp
  data_files: []
  reference_answers:
  - key: artifact_cif
    value:
      filename: licoo2_bulk.cif
  - key: artifact_summary
    value:
      filename: licoo2_structure_summary.txt
  - key: numeric_lattice_a
    value:
      checks:
      - key: a_lattice
        max: 2.85
        min: 2.8
        expected: 2.826
        tolerance: 0.03
      filename: licoo2_structure_summary.txt
  - key: numeric_lattice_c
    value:
      checks:
      - key: c_lattice
        max: 14.27
        min: 14.15
        expected: 14.207
        tolerance: 0.06
      filename: licoo2_structure_summary.txt
  - key: text_spacegroup
    value:
      flags:
        allow_any: true
      tokens:
      - R-3m
      - R\overline{3}m
      filename: licoo2_structure_summary.txt
  - key: grounding_source
    value:
      filename: licoo2_bulk.cif
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_cif
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file licoo2_bulk.cif exists and is a valid CIF file.'
  - id: artifact_summary
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file licoo2_structure_summary.txt exists.'
  - id: numeric_lattice_a
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Lattice parameter a is within 2.80-2.85 Å, consistent with literature value
      2.826 Å.'
  - id: numeric_lattice_c
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Lattice parameter c is within 14.15-14.27 Å, consistent with literature value
      14.207 Å.'
  - id: text_spacegroup
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Summary file identifies the space group as R-3m (or equivalent notation).'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The retrieved structure is grounded in the source paper''s LiCoO2 bulk structure.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: turn_budget
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: no_retries
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: duration_budget
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: token_budget_total
