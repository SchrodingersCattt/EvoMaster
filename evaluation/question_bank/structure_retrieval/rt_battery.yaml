      pattern: '"space_group_number":\s*136'
      filename: mno2_beta_analysis.json
  - key: space_group_symbol
    value:
      flags: []
      pattern: '"space_group_symbol":\s*"P4_2/mnm"'
      filename: mno2_beta_analysis.json
  - key: tunnel_type
