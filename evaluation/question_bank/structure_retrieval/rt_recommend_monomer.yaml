version: v5
capability: structure_retrieval  
domain: recommend              # 本 bank 属于哪个材料场景；同文件内所有题必须一致

questions:
  - id: SR_recommend_20260430   # 题目 ID；建议格式：<前缀>_<主题>_<日期>
    capability: structure_retrieval  # 必须与顶层 capability 一致
    domain: recommend              # 必须与顶层 domain 一致
    intent: Recommend soluble acrylate NTD photoresist monomers and provide verified SMILES from databases.

    human_prompt_seed: |-  # Direct prompt for the agent; be explicit about inputs, task, and output filename
      Recommend acrylate-type monomers suitable for NTD photoresist formulations with relatively high solubility.
      For each candidate include: `name`, `SMILES`, `CAS` (if available), `source_database` (where the SMILES/CAS was obtained).
      DO NOT FABRICATE any SMILES, CAS, or identifiers. All chemistry identifiers must be retrieved from authoritative databases accessible via the system (do not invent values or guess SMILES).

    tags: 
      - mat_polymer

    data_files: []

    reference_answers:  # 机器判分依据；不是给用户看的标准答案

      - key: grounding_source        # 给 llm_binary_judge 使用；检查是否编造/是否有依据
        value: {}

      - key: recommendation_hit_rate
        value:
          reference_list_file: reference_list.json
          min_ratio: 0.6

      - key: turn_budget             # 最大交互轮次
        value:
          max: 5

      - key: duration_budget         # 最大耗时；通常单位为毫秒
        value:
          max: 180000

      - key: token_budget_total      # 最大 token 消耗
        value:
          max: 8000

    scoring_checklist:  # 真正执行评分的清单；id 尽量与 reference_answers.key 对齐

      - id: grounding_source
        criterion: Outputs are grounded in provided inputs and do not fabricate.
        axis: grounding              # grounding = 是否基于输入材料，不编造
        verify: llm_binary_judge     # 语义判断；只做补充，不建议占比过高
        weight: 1.0

      - id: recommendation_hit_rate
        criterion: "Recommendation hit rate >= 0.6 against provided reference list."
        axis: correctness
        verify: text_file_contains_all
        weight: 1.0

      - id: no_retries
        criterion: No repeated identical tool calls.
        axis: efficiency             # efficiency = 是否高效完成
        verify: no_retries           # 检查是否重复无效调用

      - id: turn_budget
        criterion: Agent completes within turn budget.
        axis: efficiency
        verify: turn_budget

      - id: duration_budget
        criterion: Duration is within budget.
        axis: efficiency
        verify: duration_budget

      - id: token_budget_total
        criterion: Total tokens are within budget.
        axis: efficiency
        verify: token_budget