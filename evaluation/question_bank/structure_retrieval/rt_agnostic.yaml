- id: SR_polymorph_phase_verify_tio2_001_20260622
  capability: structure_retrieval
  domain: agnostic
  priority: P1
  # 源自真实成对会话：负例会话直接取数据库检索首条命中并命名为
  # "TiO2_rutile.cif" 交付，但该结构空间群为 I4_1/amd（其实是 anatase），
  # 未核对相位即贴上 rutile 标签；正例会话识别出数据库返回的是
  # anatase/brookite 而非 rutile，诚实说明无法直接获取，再用标准
  # 晶体学参数构建并验证正确的 rutile（P4_2/mnm）。本题考核检索后是否
  # 对“返回结构是否真的匹配所请求多晶型/相位”做接地校验。
  intent: Test whether the agent verifies that a retrieved structure actually matches
    the REQUESTED polymorph/phase (rutile) before delivering it, rather than blindly
    taking the first database hit and mislabeling it. TiO2 has multiple polymorphs
    with distinct space groups - rutile (P4_2/mnm, No.136, a~=4.59 A, c~=2.96 A),
    anatase (I4_1/amd, No.141, a~=3.78 A, c~=9.5 A), brookite (Pbca, No.61). The agent
    must confirm the delivered structure is rutile (by space group / lattice
    parameters) and must NOT pass off an anatase/brookite hit as rutile; if the
    database cannot return rutile directly, it should say so rather than silently
    delivering the wrong phase.
  human_prompt_seed: 帮我从结构数据库获取 TiO₂ 金红石（rutile）相的晶体结构，输出 CIF
    文件到 `TiO2_rutile.cif`。
  tags:
  - meta_database
  - meta_grounding
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: TiO2_rutile.cif
  - key: must_parsable
    value:
      filename: TiO2_rutile.cif
  - key: rutile_cell_param
    value:
      filename: TiO2_rutile.cif
      pattern: (?i)_cell_length_c\s+2\.9\d
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: cif_artifact
    criterion: '[Must] Agent writes `TiO2_rutile.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: must_parsable
    criterion: '[Must] TiO2_rutile.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: correct_polymorph
    criterion: '[Must] The CIF corresponds to the RUTILE polymorph of TiO2
      (tetragonal P4_2/mnm, space group No.136, a~=4.59 A, c~=2.96 A, 6 atoms per
      cell). It must NOT be anatase (I4_1/amd, No.141, c~=9.5 A) or brookite (Pbca,
      No.61) mislabeled as rutile.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: rutile_cell_param
    criterion: '[Must] The CIF cell parameter c is ~2.96 A (matches "_cell_length_c
      2.9x"), which uniquely identifies rutile and rules out anatase (c~9.5 A) and
      brookite (c~5.1 A) delivered under the rutile filename.'
    axis: correctness
    verify: text_file_regex
    weight: 1.5
  - id: phase_grounding
    criterion: '[Must] The final answer does NOT mislabel an anatase/brookite hit as
      rutile: it either delivers a genuine rutile structure or, if the database cannot
      return rutile directly, states this limitation (and/or constructs rutile from
      known crystallographic parameters) rather than silently passing off the wrong
      phase as rutile.'
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget
