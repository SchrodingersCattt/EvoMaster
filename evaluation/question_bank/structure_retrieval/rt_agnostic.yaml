    请完成以下交付：

    1) `tao_spg63_candidates.json`：至少包含 `rank`, `formula`, `space_group`, `elements`, `structure_identifier`, `cif_link_or_path`； 2) `tao_spg63_report.md`：说明检索条件、结果数量上限约束（<=2）以及筛选不确定性。

    最终回答中简要确认是否满足“元素集合 + 空间群 + 数量上限”三项约束。'
  tags:
  - meta_database
  data_files: []
