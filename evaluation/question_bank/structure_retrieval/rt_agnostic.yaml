  - id: retrieval_report
    criterion: Agent writes `tao_spg63_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidates_required_tokens
    criterion: Candidate JSON includes required metadata and explicitly reflects Ti/Al/O with space-group 63 constraints.
    axis: correctness
    verify: text_file_contains_all
  - id: report_required_tokens
    criterion: Retrieval report states filter constraints, upper-bound candidate count, and uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The final answer is grounded in retrieval artifacts and does not claim unsupported compounds beyond reported candidates.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SR_db_007_20260509v2
  capability: structure_retrieval
  domain: agnostic
  intent: Retrieve up to five CoREMOF-2019 entries satisfying atom-count, surface-area, and element constraints.
  human_prompt_seed: '从 CoREMOF 2019 数据库检索并返回不超过 5 个 MOF，约束如下：

    - 原子数 < 50； - 比表面积 > 1000 m²/g； - 同时包含 O 和 C 元素。

    请完成以下交付：

    1) `coremof_filtered_candidates.json`：至少包含 `rank`, `name`, `database`, `n_atom`, `surface_area_m2g`, `elements`, `structure_identifier`； 2) `coremof_filter_report.md`：说明筛选条件、排序逻辑和结果不确定性。

    最终回答需确认每条候选是否满足阈值条件。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: candidates_json
    value: coremof_filtered_candidates.json
  - key: retrieval_report
    value: coremof_filter_report.md
  - key: candidates_required_tokens
    value:
      filename: coremof_filtered_candidates.json
      tokens:
      - rank
      - name
      - database
      - n_atom
      - surface_area_m2g
      - elements
      - structure_identifier
      - CoRE
      - MOF
      - O
      - C
      flags: i
  - key: threshold_regex
    value:
      filename: coremof_filtered_candidates.json
      pattern: '"n_atom"\s*:\s*(?:[0-9]|[1-3][0-9]|4[0-9])[\s\S]*?"surface_area_m2g"\s*:\s*(?:1000\.\d+|10[1-9]\d|[1-9]\d{3,})(?:\.\d+)?'
      flags: i
  - key: report_required_tokens
    value:
      filename: coremof_filter_report.md
      tokens:
      - CoREMOF 2019
      - n_atom
      - surface_area
      - O
      - C
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
