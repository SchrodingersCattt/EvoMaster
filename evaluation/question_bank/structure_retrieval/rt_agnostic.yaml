    value: tao_spg63_candidates.json
  - key: retrieval_report
    value: tao_spg63_report.md
  - key: candidates_required_tokens
    value:
      filename: tao_spg63_candidates.json
      tokens:
      - rank
      - formula
      - space_group
      - elements
      - structure_identifier
      - cif_link_or_path
      - Ti
      - Al
      - O
      - '63'
      flags: i
  - key: report_required_tokens
    value:
      filename: tao_spg63_report.md
      tokens:
      - Materials Project
      - Ti
      - Al
      - O
      - 63
      - <=2
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: candidates_json
    criterion: Agent writes `tao_spg63_candidates.json` to workspace.
