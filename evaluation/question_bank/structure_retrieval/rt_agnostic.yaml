- id: SR_organic_polymorph_001_20260524
  capability: structure_retrieval
  domain: agnostic
  priority: P1
  intent: Test retrieval of an organic molecular crystal structure that is NOT in
    typical inorganic databases (Materials Project, Alexandria, OQMD). Agent must
    recognize the target is an organic molecule and route to COD or CSD rather than
    wasting attempts on inorganic-focused struct_db. Also tests awareness that common
    fatty acids have multiple polymorphs and the correct one must be identified.
    From real trajectory where struct_db returned irrelevant C-H-O compounds.
  human_prompt_seed: '请获取硬脂酸（stearic acid, C₁₈H₃₆O₂）的 C 型多晶型的晶体结构，
    输出 CIF 文件到 `stearic_acid_C.cif`。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: stearic_acid_C.cif
  - key: must_organic_formula
    value:
      filename: stearic_acid_C.cif
