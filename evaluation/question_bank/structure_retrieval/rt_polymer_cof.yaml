version: v5
capability: structure_retrieval
domain: polymer
questions:
- id: RT_cof_topology_001_20260629
  capability: structure_retrieval
  domain: polymer
  priority: P1
  intent: Retrieve COF structures filtered by topology (sql) and chemical feature
    (triazine nodes). Tests the agent's ability to correctly route to the CoRE COF
    database, apply topology-based filtering, and identify structures matching both
    topological and chemical constraints.
  human_prompt_seed: '帮我从 COF 数据库中检索 sql 拓扑、含三嗪(triazine)节点的 COF 结构。


    请完成以下交付：

    1) `cof_retrieval_report.md`：说明检索条件、使用了哪个数据库、返回了多少候选、各候选的关键属性（拓扑、元素、孔径等）；

    2) `cof_candidates.json`：至少包含 `query_topology`, `database_source`, `candidate_count`, `results`（每个结果含 name, topology, elements, pld, lcd）；

    3) 将筛选出的第一个结构导出为 `COF_sql_triazine.cif`。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: retrieval_report
    value: cof_retrieval_report.md
  - key: candidates_json
    value: cof_candidates.json
  - key: cif_artifact
    value: COF_sql_triazine.cif
  - key: candidates_required_tokens
    value:
      filename: cof_candidates.json
      tokens:
      - query_topology
      - database_source
      - candidate_count
      - results
      - name
      - topology
      - elements
      flags: i
  - key: report_required_tokens
    value:
      filename: cof_retrieval_report.md
      tokens:
      - sql
      - triazine
      - COF
      - 数据库
      - 候选
      flags: i
  - key: cif_parsable
    value:
      filename: COF_sql_triazine.cif
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: retrieval_report
    criterion: '[Must] Agent writes `cof_retrieval_report.md` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: candidates_json
    criterion: '[Must] Agent writes `cof_candidates.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: cif_artifact
    criterion: '[Must] Agent writes `COF_sql_triazine.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: cif_parsable
    criterion: '[Must] COF_sql_triazine.cif is parsable as a valid structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.5
  - id: correct_topology
    criterion: The retrieved structure(s) have sql topology. The candidate list should
      show topology=sql for the selected structure. If the structure doesn't have sql
      topology, the retrieval is incorrect.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.5
  - id: contains_triazine
    criterion: The selected structure contains triazine (C3N3) moieties, evidenced by
      having both C and N elements with N in the framework backbone (not just pendant).
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: candidates_required_tokens
    criterion: Candidates JSON has all required metadata fields.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: grounding_source
    criterion: All reported structures come from actual retrieval results (corecof or
      optimade), no fabricated COF names or properties.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

- id: RT_cof_name_001_20260629
  capability: structure_retrieval
  domain: polymer
  priority: P1
  intent: Retrieve a specific named COF structure (COF-LZU1) and report its structural
    metadata. Tests name-based exact retrieval from the COF database and the agent's
    ability to validate that the returned structure matches the query name.
  human_prompt_seed: '检索 COF-LZU1 的晶体结构，并报告其基本结构信息。


    请完成以下交付：

    1) `COF_LZU1.cif`：导出结构文件；

    2) `cof_lzu1_info.json`：包含 `name`, `topology`, `elements`, `formula`, `space_group`,
    `pld`, `lcd`, `surface_area`, `type`(2D/3D), `database_source`；

    3) 在报告中确认这是否确实是亚胺键连接的 hcb 拓扑 COF。'
  tags:
  - meta_database
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: COF_LZU1.cif
  - key: info_json
    value: cof_lzu1_info.json
  - key: cif_parsable
    value:
      filename: COF_LZU1.cif
  - key: info_required_tokens
    value:
      filename: cof_lzu1_info.json
      tokens:
      - name
      - topology
      - elements
      - formula
      - space_group
      - database_source
      - COF-LZU1
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: cif_artifact
    criterion: '[Must] Agent writes `COF_LZU1.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: info_json
    criterion: '[Must] Agent writes `cof_lzu1_info.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: cif_parsable
    criterion: '[Must] COF_LZU1.cif is parsable as a valid structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.5
  - id: correct_name_match
    criterion: The returned structure is actually COF-LZU1 (not a different COF). The
      info JSON should confirm name contains "LZU1" and topology is "hcb".
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: info_required_tokens
    criterion: Info JSON contains all required structural metadata fields.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: grounding_source
    criterion: Structural claims (topology, bond type, elements) are grounded in actual
      retrieval results, not fabricated from general knowledge about COF-LZU1.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: no_retries
    criterion: No repeated identical retrieval calls.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

