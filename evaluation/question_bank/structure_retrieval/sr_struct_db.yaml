- id: SR_db_003_20260411v2
  capability: structure_retrieval
  domain: struct
  intent: Retrieve and rank candidate crystal structures under explicit screening constraints.
  human_prompt_seed: '以“超导临界温度大于 40 K、空间群编号为 225”为条件，生成 10 个候选晶体结构。


    请完成以下交付：

    1) `candidate_structures.json`：列出 10 个候选，每个候选至少包含 `rank`, `formula`, `space_group`, `selection_basis`, `structure_identifier`；

    2) `screening_report.md`：说明你使用了哪些筛选条件、是否真的找到了 10 个候选、如果不足 10 个是如何如实报告的；

    3) 在最终回答中总结：候选数是否满足要求，筛选中最可能出现的不确定性是什么。


    注意：不要把重点放在后续计算，重点是数据库筛选与候选汇总。

    '
  tags:
  - structure_retrieval
  - candidate_generation
  - superconductor
  - screening
  - userlog_derived
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: candidate_json
    value: candidate_structures.json
  - key: screening_report
    value: screening_report.md
  - key: candidate_required_tokens
    value:
      filename: candidate_structures.json
      tokens:
      - rank
      - formula
      - space_group
      - selection_basis
      - structure_identifier
      flags: i
  - key: screening_required_tokens
    value:
      filename: screening_report.md
      tokens:
      - Tc
      - 40
      - 225
      - 候选
      - 不确定性
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: candidate_json
    criterion: Agent writes `candidate_structures.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: screening_report
    criterion: Agent writes `screening_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: candidate_required_tokens
    criterion: Candidate JSON includes ranking and required metadata fields for screened structures.
    axis: correctness
    verify: text_file_contains_all
  - id: screening_required_tokens
    criterion: Screening report explicitly states the Tc and space-group criteria, candidate-count handling, and uncertainty note.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The answer honestly reflects whether the database query yields enough candidates and does not fabricate missing entries.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical screening calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
