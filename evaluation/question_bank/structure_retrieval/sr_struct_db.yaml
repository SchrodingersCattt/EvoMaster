    value: mgb2_retrieval.json
  - key: notes_md
    value: mgb2_notes.md
  - key: retrieval_required_tokens
    value:
      filename: mgb2_retrieval.json
      tokens:
      - formula
      - database_source
      - structure_identifier
      - space_group
      - lattice_summary
      - candidate_count
      flags: i
  - key: notes_required_tokens
    value:
      filename: mgb2_notes.md
      tokens:
      - MgB2
      - 候选
      - 筛选
      - 数据库
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 7000
  scoring_checklist:
  - id: retrieval_json
    criterion: Agent writes `mgb2_retrieval.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: notes_md
    criterion: Agent writes `mgb2_notes.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: retrieval_required_tokens
    criterion: Retrieval JSON includes essential structure metadata and candidate count.
    axis: correctness
    verify: text_file_contains_all
  - id: notes_required_tokens
    criterion: Notes explain candidate selection and database origin for the MgB2 result.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The answer stays focused on retrieval metadata and provenance, not fabricated downstream calculations.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
