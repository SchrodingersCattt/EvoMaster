version: v5
capability: data_diagnosis
domain: semiconductor
questions:
- id: DD_general_004_20260422
  capability: data_diagnosis
  domain: semiconductor
  intent: Diagnose relaxation divergence caused by POTIM too large combined with wrong initial
    phase.
  human_prompt_seed: '读取 `case_bundle.json`，其中包含一个 CsPbI3 弛豫计算的 INCAR 参数和离子步摘录。 5 步内能量从 -19
    eV 升到 +8 eV，力从 2.3 爆炸到 48 eV/A，体积剧烈波动。 请诊断根本原因，并给出修复方案。

    '
  tags:
  - eng_vasp
  priority: P0
  data_files:
  - key: case_bundle
    path: data/DD_general_004/case_bundle.json
    oss_url: ''
    description: 'VASP input/output bundle: CsPbI3 cubic->orthorhombic relax with POTIM=1.0,
      diverges.'
  reference_answers:
  - key: root_cause
    value: potim_too_large_and_bad_initial_structure
  - key: required_fields
    value:
    - root_cause
    - evidence
    - fix_POTIM
    - fix_initial_structure
  - key: turn_budget
    value: &id001
      max: 8
  - key: grounding_evidence
    value:
      filename: case_bundle.json
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 8000
  scoring_checklist:
  - id: root_cause
    criterion: Identifies both POTIM too large (1.0) and wrong initial phase (cubic vs orthorhombic
      CsPbI3).
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Provides evidence from energy/force divergence trajectory, and recommends both
      reducing POTIM and using correct Pnma phase.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_evidence
    criterion: Both root causes are evidenced by specific data from case_bundle.json (POTIM=1.0
      in INCAR, energy/force explosion pattern in OUTCAR).
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Dual root cause is identified efficiently without repeated re-reading of the
      same file.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: DD_pymatgen_002_20250618
  capability: data_diagnosis
  domain: semiconductor
  intent: 'Implement the AMP² material screening logic to filter candidate compounds for high-throughput
    HSE band gap calculations, following the criteria described in Kim et al. (Scientific Data, 2020):
    unary/binary always included, ternary+ included if Eg_GGA < 3 eV or metallic with D_F/D_VB < 0.8.'
  human_prompt_seed: 'Given the file candidate_materials.json containing materials with fields: icsd_id,
    formula, n_elements, band_gap_gga_eV, and df_dvb (DOS at Fermi / DOS at valence band maximum), write
    a Python script screen_materials.py that classifies each material as ''include'' or ''exclude'' following
    the AMP² screening criteria: (1) unary and binary compounds (n_elements <= 2) are always included,
    (2) ternary and higher compounds (n_elements >= 3) with band_gap_gga_eV > 0 are included only if band_gap_gga_eV
    < 3.0, (3) metallic compounds (band_gap_gga_eV = 0) with n_elements >= 3 are included only if df_dvb
    < 0.8. Output the classification results to screening_results.json with format: [{"icsd_id": int,
    "formula": str, "classification": str}].'
  tags:
  - meta_database
  data_files:
  - key: candidate_materials
    path: candidate_materials.json
    oss_url: ''
    description: 'JSON file containing candidate materials with fields: icsd_id (int), formula (str),
      n_elements (int), band_gap_gga_eV (float, 0 for metals), df_dvb (float, DOS at Fermi level normalized
      by valence band DOS). Contains 15 test compounds spanning unary through quinary, with varying band
      gaps and DOS values.'
  reference_answers:
  - key: screening_script_exists
    value: screen_materials.py
  - key: screening_output_exists
    value: screening_results.json
  - key: classification_count
    value:
      checks:
      - key: total_entries
        expected: 15
        tolerance: 0
      filename: screening_results.json
  - key: include_count
    value:
      checks:
      - key: include_count
        expected: 6
        tolerance: 0
      filename: screening_results.json
  - key: exclude_count
    value:
      checks:
      - key: exclude_count
        expected: 9
        tolerance: 0
      filename: screening_results.json
  - key: grounding_source
    value:
      filename: candidate_materials.json
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: screening_script_exists
    axis: correctness
    verify: artifact_exists
    weight: 5.0
    criterion: '[Must] Python script screen_materials.py exists in the output directory.'
  - id: screening_output_exists
    axis: correctness
    verify: artifact_exists
    weight: 5.0
    criterion: '[Must] Output file screening_results.json exists and is valid JSON.'
  - id: classification_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 10.0
    criterion: '[Must] screening_results.json contains exactly 15 entries, one per input material.'
  - id: include_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] Exactly 6 materials are classified as ''include'' following the AMP² screening
      criteria.'
  - id: exclude_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] Exactly 9 materials are classified as ''exclude'' following the AMP² screening
      criteria.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 10.0
    criterion: '[Must] The answer is grounded in the provided candidate_materials.json and the AMP² screening
      methodology from Kim et al. (2020).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not retry any tool call.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses fewer than 50000 tokens total.'
