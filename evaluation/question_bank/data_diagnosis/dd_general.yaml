    value: data_qc_report.md
  - key: chart_priority_artifact
    value: chart_priority.md
  - key: fig_spec_required_tokens
    value:
      filename: fig_spec.json
      tokens:
      - line
      - scatter
      - box
      - temperature_C
      - yield_pct
      - phase
      flags: i
  - key: fig_spec_required_keys_regex
    value:
      filename: fig_spec.json
      pattern: (?is)("chart_type"\s*:.*?"x"\s*:.*?"y"\s*:.*?"group_by"\s*:.*?"title"\s*:.*?"reason")
      flags: is
  - key: qc_metrics_required_tokens
    value:
