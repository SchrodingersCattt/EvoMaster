    axis: correctness
    verify: artifact_exists
  - id: qc_report_artifact
    criterion: Agent writes `data_qc_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: chart_priority_artifact
    criterion: Agent writes `chart_priority.md` to workspace.
