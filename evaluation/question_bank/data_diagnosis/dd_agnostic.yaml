- id: DD_phase_001_20250618
  capability: data_diagnosis
  domain: agnostic
  intent: Compute the finite-size thermodynamic driving force ΔΦ between FeS2 marcasite and pyrite as
    a function of particle size and pH, reproducing the size-pH phase diagram from the paper using the
    bulk energy difference and pH-dependent surface energies.
  human_prompt_seed: Using the thermodynamic data in fes2_surface_energies.json, compute the finite-size
    free energy difference ΔΦ = Φ_marcasite - Φ_pyrite as a function of particle radius (1-20 nm) and
    pH (0-7). The thermodynamic potential is Φ = (4/3)πr³g_b + 4πr²γ̄ where g_b is the bulk energy density
    and γ̄ is the pH-dependent surface energy. Write a Python script phase_diagram.py that computes and
    plots this, and save the numerical results as phase_diagram_results.json.
  tags: []
  data_files:
  - key: surface_energy_data
    path: fes2_surface_energies.json
    oss_url: ''
    description: JSON file containing pH-dependent particle-averaged surface energies for pyrite and marcasite
      (from Figure 1b data in the paper), plus bulk energy difference between phases.
  reference_answers:
  - key: artifact_script
    value:
      filename: phase_diagram.py
      description: Python script for phase diagram computation must exist
  - key: artifact_results
    value:
      filename: phase_diagram_results.json
      description: Results JSON file must exist
  - key: numeric_delta_phi_pH0_small
    value:
      checks:
      - key: delta_phi_pH0_r_2nm
        max: 10
        min: -5
        allow_missing_key: true
      filename: phase_diagram_results.json
  - key: numeric_delta_phi_pH4_transition
    value:
      checks:
      - key: delta_phi_pH4_critical
        max: 5
        min: -10
        allow_missing_key: true
      filename: phase_diagram_results.json
  - key: text_marcasite_stable_acidic
    value:
      flags:
      - case_insensitive
      tokens:
      - marcasite
      filename: phase_diagram_results.json
  - key: text_pyrite_stable_basic
    value:
      flags:
      - case_insensitive
      tokens:
      - pyrite
      filename: phase_diagram_results.json
  - key: grounding_source
    value:
      filename: fes2_surface_energies.json
      description: Task is grounded in the thermodynamic model and surface energy data from the paper
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_script
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Python script phase_diagram.py exists'
  - id: artifact_results
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Results file phase_diagram_results.json exists'
  - id: numeric_delta_phi_pH0_small
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] At pH=0 and small particle sizes, marcasite is lower energy (ΔΦ slightly negative
      or near zero)'
  - id: numeric_delta_phi_pH4_transition
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] Near pH=4 the driving force crosses zero, consistent with experimental marcasite
      onset'
  - id: text_marcasite_stable_acidic
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Results identify marcasite as stable at low pH/small size'
  - id: text_pyrite_stable_basic
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Results identify pyrite as stable at high pH/large size'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] Answer is grounded in the paper''s thermodynamic model and data'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Completed within 30 turns'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] No retries needed'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Completed within 300 seconds'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Total tokens within 50000'
- id: DD_matbench_004_20250618
  capability: data_diagnosis
  domain: agnostic
  intent: Diagnose and analyze computational efficiency gains from the PathFinder and ApproxNEB methods
    across six benchmark materials by computing speedup factors, identifying which migration path geometries
    (linear vs curved MEP) benefit most, and producing summary statistics and visualizations.
  human_prompt_seed: Analyze the computational efficiency data from the PathFinder and ApproxNEB benchmark
    study. Compute the speedup factors for each material (PathFinder-initialized NEB vs linear NEB, and
    ApproxNEB vs linear NEB), identify which materials benefit most from the new methods, and generate
    summary tables and plots.
  tags: []
  data_files:
  - key: cpu_time_neb_init
    path: cpu_hours_neb_initialization.csv
    oss_url: ''
    description: 'CSV file with CPU hours for NEB calculations initialized with PathFinder vs linear interpolation,
      from Fig. 5. Materials: LiTiS2 (spinel), ZnMn2O4 (post-spinel), ZnMn2O4 (spinel), LiFePO4 (olivine),
      MgV2O5 (delta), CaMoO3 (layered).'
  - key: cpu_time_approxneb
