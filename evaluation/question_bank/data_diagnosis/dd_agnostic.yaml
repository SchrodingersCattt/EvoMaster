    weight: 15.0
    criterion: '[Must] metrics.json contains a precision value between 0 and 1.'
  - id: recall
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] metrics.json contains a recall (TPR) value between 0 and 1.'
  - id: daf
