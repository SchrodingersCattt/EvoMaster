    as stable (hull_distance ≤ 0 eV/atom) or unstable. Compute the following metrics: F1 score, precision,
    recall (TPR), true negative rate (TNR), accuracy, and Discovery Acceleration Factor (DAF = precision
    / prevalence, where prevalence = fraction of stable materials in the test set). Write all metrics
    to metrics.json.'
