version: v5
capability: data_diagnosis
domain: agnostic
questions:
- id: DD_tool_fail_recovery_001_20260428
  capability: data_diagnosis
  domain: agnostic
  intent: When a tool call returns an error, agent should diagnose the cause and try
    an alternative approach rather than blindly retrying the same call.
  human_prompt_seed: '请使用结构数据库查询 mp-99999999（一个不存在的 ID）的结构信息，并将结果保存到 result.json。

    如果查询失败，请分析失败原因，尝试其他合理的获取方式（如按化学式搜索等），并在最终回答中说明失败原因和你的处理策略。'
  tags: []
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: error_diagnosis
    criterion: Agent correctly identifies that the material ID does not exist or is
      invalid, rather than assuming a transient error.
    axis: correctness
    verify: llm_binary_judge
  - id: no_blind_retry
    criterion: Agent does not repeat the exact same failing tool call with identical
      parameters more than once.
    axis: efficiency
    verify: no_retries
  - id: alternative_strategy
    criterion: Agent attempts at least one alternative approach (e.g., search by formula,
      check ID format) or clearly explains why no alternative is available.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_explanation
    criterion: Final answer includes a clear explanation of the failure cause grounded
      in the actual error message, not a generic excuse.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: DD_missing_input_001_20260428
  capability: data_diagnosis
  domain: agnostic
  intent: When a required input file is missing, agent should report the issue clearly
    rather than fabricating data or silently skipping.
  human_prompt_seed: '请读取工作目录下的 `experiment_data.csv`，对其中的能量数据做统计分析（均值、标准差、最大最小值），并将结果写入 `stats_report.json`。'
  tags: []
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 6000
  scoring_checklist:
  - id: detect_missing
    criterion: Agent detects that experiment_data.csv does not exist in the workspace
      and reports this clearly to the user.
    axis: correctness
    verify: llm_binary_judge
  - id: no_fabrication
    criterion: Agent does not create a fake experiment_data.csv or invent data to
      proceed with the analysis.
    axis: correctness
    verify: llm_binary_judge
  - id: actionable_response
    criterion: Agent provides actionable guidance (e.g., asks user to provide the file,
      suggests where to obtain it) rather than just stating the error.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: DD_vasp_scf_diverge_001_20260528
  capability: data_diagnosis
  domain: agnostic
  intent: Test whether agent can diagnose SCF oscillation in a VASP DFT+U calculation
    and propose concrete parameter adjustments rather than blindly retrying.
  human_prompt_seed: '我的 VASP DFT+U 计算（FeN4C单原子催化剂吸附*OOH）SCF不收敛，能量在
    -424到-428 eV之间振荡了200步。OSZICAR和INCAR片段在以下地址：

    - `OSZICAR_fragment.txt` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/DD_vasp_scf_diverge_001/OSZICAR_fragment.txt`

    - `INCAR_original.txt` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/DD_vasp_scf_diverge_001/INCAR_original.txt`

    请诊断原因并将修改后的完整INCAR写入 `INCAR_modified` 文件。

    '
  tags:
  - eng_vasp
  data_files:
  - key: oszicar
    path: data/DD_vasp_scf_diverge_001/OSZICAR_fragment.txt
    description: VASP OSZICAR showing SCF oscillation for DFT+U system.
  - key: incar
    path: data/DD_vasp_scf_diverge_001/INCAR_original.txt
    description: Original INCAR with too-aggressive mixing for DFT+U.
  reference_answers:
  - key: turn_budget
    value:
      max: 10
  - key: token_budget_total
    value:
      max: 20000
  - key: reduces_amix
    value:
      filename: INCAR_modified
      check: param_range
      param: AMIX
      min: 0.01
      max: 0.1
  - key: suggests_algo_change
    value:
      filename: INCAR_modified
      check: param_value_in
      param: ALGO
      allowed: [All, Damped]
  - key: suggests_contcar_restart
    value:
      filename: INCAR_modified
      check: param_value
      param: ISTART
      expected: '1'
  scoring_checklist:
  - id: diagnoses_mixing_issue
    criterion: Agent identifies that AMIX=0.2 is too aggressive for a DFT+U spin-
      polarized system and causes charge/spin sloshing (SCF oscillation). The energy
      oscillating between -424 and -428 eV without converging is classic charge
      density mixing instability.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: reduces_amix
    criterion: Modified INCAR sets AMIX in the 0.01-0.1 range to stabilize charge
      mixing for DFT+U.
    axis: correctness
    verify: vasp_incar_check
    weight: 3.0
  - id: suggests_algo_change
    criterion: Modified INCAR sets ALGO to All or Damped, which is more robust for
      DFT+U systems with near-degenerate spin states.
    axis: correctness
    verify: vasp_incar_check
    weight: 2.0
  - id: suggests_contcar_restart
    criterion: Modified INCAR sets ISTART=1 to restart from a partially-converged
      wavefunction rather than random initialization.
    axis: correctness
    verify: vasp_incar_check
  - id: does_not_just_retry
    criterion: Agent does NOT suggest simply resubmitting the same INCAR without
      changes. It must propose concrete parameter modifications.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Token usage within budget.
    axis: efficiency
    verify: token_budget
