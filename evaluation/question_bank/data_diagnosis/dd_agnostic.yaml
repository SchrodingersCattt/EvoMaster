    description: Sample CSV file containing Mn d-orbital magnetic moments from DFT-SCAN calculations.
      Each row has a structure ID and one or more Mn magnetic moment values in Bohr magnetons.
  reference_answers:
  - key: artifact_csv
    value: charge_assignments.csv
  - key: has_charge_column
    value:
      flags:
        case_insensitive: true
      tokens:
      - Mn2+
      - Mn3+
      - Mn4+
      - charge
      filename: charge_assignments.csv
  - key: cutoff_3228
    value:
      flags:
        regex: true
        case_insensitive: true
      pattern: 3\.228|cutoff.*Mn4
      filename: charge_assignments.csv
  - key: cutoff_4082
    value:
      flags:
        regex: true
        case_insensitive: true
      pattern: 4\.082|cutoff.*Mn3
      filename: charge_assignments.csv
  - key: grounding_source
    value:
      filename: mn_magnetic_moments.csv
  - key: turn_budget
    value:
      max: 15
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 30000
  scoring_checklist:
