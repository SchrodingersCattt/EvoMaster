    weight: 1.0
    criterion: '[Must] The output CSV contains charge state assignments (Mn2+, Mn3+, or Mn4+) for each
      Mn ion.'
  - id: cutoff_3228
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] The script or output references the Mn⁴⁺ cutoff of 3.228 μB.'
  - id: cutoff_4082
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] The script or output references the Mn³⁺ cutoff of 4.082 μB.'
  - id: grounding_source
