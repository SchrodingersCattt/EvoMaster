        max: 1.0
        min: 0.0
        allow_missing_key: false
      filename: metrics.json
  - key: daf
    value:
      checks:
      - key: daf
        max: 10.0
        min: 0.5
        allow_missing_key: false
      filename: metrics.json
  - key: artifact_metrics_json
    value: metrics.json
  - key: grounding_source
    value:
      filename: hull_predictions.csv
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
