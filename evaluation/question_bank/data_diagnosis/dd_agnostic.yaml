- id: DD_python_001_20250618
  capability: data_diagnosis
  domain: agnostic
  intent: Extract the pair effective cluster interaction (ECI) values from the Li_xFePO4 cluster expansion
    model (Fig. 2 of the paper), compute the sum of ECIs for each interaction type (Li-Li, e-e, Li-e),
    and identify the dominant nearest-neighbor interaction.
  human_prompt_seed: Create a Python script that encodes the pair ECI data from the Li_xFePO4 cluster
    expansion (Fig. 2 of Zhou et al. 2006). Store the data as three dictionaries mapping pair distance
    (Å) to ECI (meV) for Li-Li, e-e, and Li-e interactions. Compute the sum of known ECIs for each type
    and write the results to eci_summary.json with keys 'li_li_sum', 'ee_sum', 'li_e_sum' (in meV). Also
    print which interaction type has the strongest magnitude nearest-neighbor ECI.
