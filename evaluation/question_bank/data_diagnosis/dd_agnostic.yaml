  data_files:
  - key: predictions
    path: hull_predictions.csv
    oss_url: ''
    description: 'A CSV file with columns: material_id, true_hull_distance_eV, predicted_hull_distance_eV.
      Contains ~50 sample materials with both DFT-computed and ML-predicted hull distances, generated
      as a local benchmark artifact.'
