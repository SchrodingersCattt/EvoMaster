- id: CR_WO_feature_extract_43d_20260406
  capability: co2rr_reproduction
  domain: general
  intent: Implement 43-dimensional feature extraction (40 continuous + 3 categorical)
    from adslab POSCAR paths per doc 4.3.1.
  human_prompt_seed: '编写脚本：输入为含多个子目录的数据集根路径，每个体系子目录内有 POSCAR（或等价结构文件）。用 pymatgen 或 ASE 读取结构，
    识别吸附物与基底，吸附位点取吸附物几何中心；构造四类近邻环境（第一近邻同层、第二近邻同层、第二近邻下层、6 Å 内全体近邻），
    对每类用距离倒数加权，汇总元素属性得到 40 维连续特征；另输出 3 个类别特征：吸附物种类、吸附类型（物理/化学吸附标签规则需在注释中说明）、基底类型。
    输出 CSV 列名与维度说明。若工作区无完整数据集，可对单示例 POSCAR 演示流水线并说明如何批处理。

    '
