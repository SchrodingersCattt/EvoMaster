  - co2rr_repro
  - feature_engineering
  - pymatgen
  - ase
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 26
  - key: duration_budget
    value: *cr_dur_std
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: script_and_schema
    criterion: 脚本可执行或逻辑完整；明确 40+3 维定义、四类近邻、6 Å cutoff、加权方式与输出列说明。
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_impl
    criterion: 实现与文档 4.3.1 描述一致（库函数选择、吸附质/基底识别规则、类别标签规则可读）。
    axis: grounding
    verify: llm_binary_judge
