- id: CR_CO2RR_screening_20260406
  capability: co2rr_reproduction
  domain: mech
  intent: Build a three-metric catalyst screening score from U_L(CO2-to-CO), U_L(HER),
    and CO adsorption energy using the provided CSV and closed-form spec.
  human_prompt_seed: '阅读 `scoring_spec.json` 与 `screening_candidates.csv`，严格按 spec 中的公式计算每条候选的 score_S，
    输出完整排名表（含各行的 U_L_CO_V、U_L_HER_V、E_ads_CO_eV、selectivity_V、ads_penalty_eV、score_S），
    并明确写出排名第一的 catalyst_id 及其 score_S（至少三位小数）。不要改动 CSV 中的数值。

    '
  tags:
  - co2rr_repro
  - screening
  - limiting_potential
  - adsorption
  mode_scope:
  - direct
  - planner
  data_files:
  - key: scoring_spec
    path: data/CR_CO2RR_screening_20260406/scoring_spec.json
    oss_url: ''
    description: Closed-form three-metric screening score definition for CO2RR catalysts.
  - key: screening_candidates
    path: data/CR_CO2RR_screening_20260406/screening_candidates.csv
    oss_url: ''
    description: Candidate catalysts with U_L and CO adsorption columns.
  reference_answers:
  - key: top_catalyst_id
    value: cat_B
  - key: top_score_S
    value: -0.385
    tolerance: 0.002
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value: *cr_dur_std
  - key: token_budget_total
    value:
      max: 10000
  scoring_checklist:
  - id: top_catalyst_id
    criterion: 最终答案中推荐的排名第一催化剂 id 为 cat_B（可与说明文字同现，但必须一致）。
    axis: correctness
    verify: exact_match
  - id: top_score_S
    criterion: 报告的第一名 score_S 与按 spec 手算一致，约为 -0.385（允许数值读取误差）。
    axis: correctness
    verify: numerical_range
  - id: full_ranking
    criterion: 给出全部候选的 score_S 排序表，且每行中间量（selectivity_V、ads_penalty_eV）与公式一致。
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_spec
    criterion: 计算与 scoring_spec.json 中公式一致，使用的列名与 CSV 一致，未篡改输入数据。
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
