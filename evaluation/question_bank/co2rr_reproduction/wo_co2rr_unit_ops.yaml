- id: CR_WO_limiting_potential_20260406
  capability: co2rr_reproduction
  domain: elec
  intent: From free-energy steps on CO2RR-to-CO, HER, and CO2-to-HCOOH pathways,
    compute limiting potentials U_L = -ΔG_max/e per doc 3.2.2.
  human_prompt_seed: '给定（或由你说明来源的）各中间态与气相参考的吉布斯自由能或等价能量数据，对以下三条路径计算极限电势 U_L = -ΔG_max/e：
    （1）CO2(g)→CO* 路径含 CO2*、COOH*、CO* 等步骤；（2）HER：H* 形成；（3）CO2→HCOOH 路径含 HCOO*、HCOOH*。
    使用文档中的 ΔG 表达式形式（含 E(slab)、E(ads)、0.5 E(H2)、eU 项），标出每条路径的决速步与 U_L（V），并汇总对比。

    '
  tags:
  - co2rr_repro
  - limiting_potential
  - co2rr
  - her
  - free_energy
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value: *cr_dur_std
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: three_pathways_ul
    criterion: 分别给出 CO2→CO、HER、CO2→HCOOH 三条路径的决速步 ΔG_max 与 U_L，公式与文档 3.2.2 一致，单位正确。
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_energies
    criterion: 使用的能量/自由能数据来源清楚（计算值、表格或明确假设），且代入与决速步判定一致。
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
