- id: BWO_image_machine_001_20260715
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent queries images and machine types without creating resources.
  human_prompt_seed: |
    利用 bohr-cli，我有个 CP2K 输入文件要跑 DFT，有没有现成的镜像？版本都是几？有哪些计算机型？
    结果保存到 `b1_resources.json`，格式：
    ```json
    {"images": [{"name": "...", "version": "..."}], "machine_types": [{"name": "...", "spec": "..."}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b1_resources.json
  - key: has_images
    value:
      filename: b1_resources.json
      pattern: '"images"\s*:\s*\[\s*\{'
  - key: cp2k_found
    value:
      filename: b1_resources.json
      pattern: '[Cc][Pp]2[Kk]'
  - key: has_machines
    value:
      filename: b1_resources.json
      pattern: '"machine_types"\s*:\s*\[\s*\{'
  - key: turn_budget
    value:
      max: 6
  scoring_checklist:
  - id: artifact
    criterion: b1_resources.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_images
    criterion: images array populated.
    axis: correctness
    verify: text_file_regex
  - id: cp2k_found
    criterion: CP2K image found in results.
    axis: correctness
    verify: text_file_regex
  - id: has_machines
    criterion: machine_types array populated.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_long_running_002_20260715_v2
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent diagnoses long-running jobs with appropriate recommendations.
  human_prompt_seed: |
    利用 bohr-cli，看看我有没有跑超过一天还没结束的任务，有的话检查下是不是卡死了。
    将分析结果保存到 `b2_diagnosis.json`，格式：
    ```json
    {"long_running_jobs": [{"job_id": ..., "name": "...", "duration_hours": ..., "status": ..., "recommendation": "terminate|kill|wait"}], "total_checked": ...}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b2_diagnosis.json
  - key: diagnosis_schema
    value:
      filename: b2_diagnosis.json
      schema:
        type: object
        required:
        - long_running_jobs
        - total_checked
        properties:
          long_running_jobs:
            type: array
            items:
              type: object
              required:
              - job_id
              - name
              - duration_hours
              - status
              - recommendation
              properties:
                job_id:
                  oneOf:
                  - type: integer
                  - type: string
                    minLength: 1
                name:
                  type: string
                  minLength: 1
                duration_hours:
                  type: number
                  minimum: 0
                status:
                  oneOf:
                  - type: integer
                  - type: string
                    minLength: 1
                recommendation:
                  type: string
                  enum:
                  - terminate
                  - kill
                  - wait
          total_checked:
            type: integer
            minimum: 0
  - key: turn_budget
    value:
      max: 8
  scoring_checklist:
  - id: artifact
    criterion: b2_diagnosis.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: diagnosis_schema
    criterion: Diagnosis records the checked-job count and gives every long-running job a valid terminate, kill, or wait recommendation.
    axis: correctness
    verify: json_file_schema
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_param_sweep_003_20260715_v2
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent can submit batch parameterized jobs with job group.
  human_prompt_seed: |
    利用 bohr-cli，我要做参数扫描，温度 300K 到 1000K 每 100K 一个，同一个模板跑 8 个任务。
    用 `registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1` 镜像，命令为 `echo "T=$TEMP" > result.txt`（把 $TEMP 替换为实际温度值），机型 `c2_m4_cpu`。
    把任务放在同一个任务组中，并将实际的任务组 ID 和每个温度对应的任务 ID 记录到 `b3_jobs.json`；每条任务记录包含 `temperature_K` 和 `job_id`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b3_jobs.json
  - key: sweep_schema
    value:
      filename: b3_jobs.json
      schema:
        type: object
        required:
        - job_group_id
        - jobs
        properties:
          job_group_id:
            type: integer
            minimum: 1
          jobs:
            type: array
            minItems: 8
            maxItems: 8
            items:
              type: object
              required:
              - temperature_K
              - job_id
              properties:
                temperature_K:
                  type: integer
                  enum:
                  - 300
                  - 400
                  - 500
                  - 600
                  - 700
                  - 800
                  - 900
                  - 1000
                job_id:
                  type: integer
                  minimum: 1
              additionalProperties: false
            allOf:
            - contains:
                properties:
                  temperature_K:
                    const: 300
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 400
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 500
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 600
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 700
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 800
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 900
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 1000
                required:
                - temperature_K
        additionalProperties: false
  - key: group_created_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job_group\s+create\b'
      min_matches: 1
      max_matches: 1
  - key: group_jobs_submitted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+submit\b(?=[^\n;&|]*(?:(?:--job_group_id)(?:\s+|=)|-g\s+)\S+)'
      min_matches: 1
  - key: turn_budget
    value:
      max: 18
  scoring_checklist:
  - id: artifact
    criterion: b3_jobs.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: sweep_schema
    criterion: One positive job group ID and eight positive job IDs cover every 100 K step from 300 K through 1000 K.
    axis: correctness
    verify: json_file_schema
  - id: group_created_via_cli
    criterion: The job group was created through bohr-cli exactly once.
    axis: grounding
    verify: tool_args_regex
  - id: group_jobs_submitted_via_cli
    criterion: Jobs were submitted through bohr-cli with a job-group argument.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

