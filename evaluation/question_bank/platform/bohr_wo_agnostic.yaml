      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?scp\b(?=[^\n;&|]*\s(?:[^@\s]+@[^:\s]+:)?/personal/test(?:\s|$))'
      min_matches: 1
  - key: node_deleted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+node\s+delete\b'
      min_matches: 1
  - key: turn_budget
    value:
      max: 30
  scoring_checklist:
  - id: artifact
    criterion: d7_node_ops.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: node_ops_schema
    criterion: Operation record contains a real node ID, requested image and T4 machine, SSH command, successful transfer to /personal/test, and successful node cleanup.
    axis: correctness
    verify: json_file_schema
  - id: resources_queried_via_cli
    criterion: Node resources were queried through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: node_created_via_cli
    criterion: The node was created through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: node_inspected_via_cli
    criterion: Node status and SSH information were inspected through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: file_transferred_via_scp
    criterion: The test file was transferred to /personal/test through scp.
    axis: grounding
    verify: tool_args_regex
  - id: node_deleted_via_cli
    criterion: The node was deleted through bohr-cli after transfer.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
