  priority: P1
  human_prompt_seed: |
    利用 bohr-cli，用我的 Bohrium 鉴权启动一个容器节点，镜像使用 `registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1`，机型选择 T4 相关的最便宜配置。节点启动后获取 SSH 连接方式，并通过 scp 把工作区的 `test` 文件传到节点的 `/personal/test`。
