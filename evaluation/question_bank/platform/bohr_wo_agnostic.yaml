- id: BWO_stop_running_009_20260715_v3
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent gracefully terminates only a self-submitted active job.
  human_prompt_seed: |
    利用 Bohr-CLI，帮我提交一个临时 CPU 任务来复现问题：镜像使用 `registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1`，机型 `c2_m4_cpu`，命令为 `echo "b9 started" > b9_started.txt && sleep 600`，任务名以 `b9-stop-running-` 开头并带上唯一后缀。
    任务提交后先确认一下状态；它还没结束时我发现输入有误，请把刚提交的这个任务停掉，别影响其他任务，处理后再查询确认结果。将实际任务 ID、任务名、镜像、机型、命令、每次状态查询结果、停止动作和最终状态保存到工作区根目录的 `b9_actions.json`；状态保留 Bohr-CLI 返回的整数状态码。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b9_actions.json
    workspace_resolve: root
  - key: stop_record
    value:
      filename: b9_actions.json
      image: registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1
      machine_type: c2_m4_cpu
      command: echo "b9 started" > b9_started.txt && sleep 600
      job_name_prefix: b9-stop-running-
    workspace_resolve: root
  - key: submitted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+submit\b(?=(?:(?:\\\r?\n)|[^\n])*--command(?:=|\s+)(?:''[^''\n]*\bsleep\s+600\b[^''\n]*''|"(?:\\.|[^"\\\n])*\bsleep\s+600\b(?:\\.|[^"\\\n])*"))'
      min_matches: 1
  - key: polled_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+describe\b'
      min_matches: 2
  - key: one_control_action_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+(?:job\s+(?:terminate|kill|\+cancel)|job_group\s+terminate)\b'
      min_matches: 1
      max_matches: 1
  - key: terminated_via_cli
