    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+paper\s+search\b(?=[^\n;&|]*--size(?:\s+|=)20(?:\s|$))'
      min_matches: 1
