  - key: has_model_b
    value:
      filename: b8_comparison.json
      pattern: '"model_b"'
  - key: has_rmse
    value:
      filename: b8_comparison.json
      pattern: '"rmse_[ef]"\s*:\s*[\d.]'
  - key: has_conclusion
    value:
      filename: b8_comparison.json
      pattern: '"conclusion"\s*:\s*"[^"]{10,}"'
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
