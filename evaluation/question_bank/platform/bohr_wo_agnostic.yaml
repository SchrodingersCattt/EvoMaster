    value: d7_node_ops.json
    workspace_resolve: root
  - key: node_ops_schema
    value:
      filename: d7_node_ops.json
      schema:
        type: object
        required:
        - node_id
        - image
        - machine_type
        - ssh_command
        - remote_path
        - file_transferred
        - node_deleted
        properties:
          node_id:
            type: integer
            minimum: 1
          image:
            const: registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1
          machine_type:
            type: string
            pattern: '[Tt]4'
