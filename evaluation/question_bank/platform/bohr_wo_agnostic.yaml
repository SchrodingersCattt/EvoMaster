version: v5
capability: workflow_orchestration
domain: agnostic
questions:
- id: BWO_image_machine_001_20260715
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent queries images and machine types without creating resources.
  human_prompt_seed: |
    请利用 bohr-cli 完成以下任务：
    我有个 CP2K 输入文件要跑 DFT，有没有现成的镜像？版本都是几？有哪些计算机型？
    结果保存到 `b1_resources.json`，格式：
    ```json
    {"images": [{"name": "...", "version": "..."}], "machine_types": [{"name": "...", "spec": "..."}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b1_resources.json
  - key: has_images
    value:
      filename: b1_resources.json
      pattern: '"images"\s*:\s*\[\s*\{'
  - key: cp2k_found
    value:
      filename: b1_resources.json
      pattern: '[Cc][Pp]2[Kk]'
  - key: has_machines
    value:
      filename: b1_resources.json
      pattern: '"machine_types"\s*:\s*\[\s*\{'
  - key: turn_budget
    value:
      max: 6
  scoring_checklist:
  - id: artifact
    criterion: b1_resources.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_images
    criterion: images array populated.
    axis: correctness
    verify: text_file_regex
  - id: cp2k_found
    criterion: CP2K image found in results.
    axis: correctness
    verify: text_file_regex
  - id: has_machines
    criterion: machine_types array populated.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_long_running_002_20260715
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent diagnoses long-running jobs with appropriate recommendations.
  human_prompt_seed: |
    请利用 bohr-cli 完成以下任务：
    看看我有没有跑超过一天还没结束的任务，有的话检查下是不是卡死了。
    将分析结果保存到 `b2_diagnosis.json`，格式：
    ```json
    {"long_running_jobs": [{"job_id": ..., "name": "...", "duration_hours": ..., "status": ..., "recommendation": "terminate|kill|wait"}], "total_checked": ...}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b2_diagnosis.json
  - key: has_jobs_field
    value:
      filename: b2_diagnosis.json
      pattern: '"long_running_jobs"'
  - key: has_recommendation
    value:
      filename: b2_diagnosis.json
      pattern: '"recommendation"\s*:\s*"(terminate|kill|wait)"'
  - key: turn_budget
    value:
      max: 8
  scoring_checklist:
  - id: artifact
    criterion: b2_diagnosis.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_jobs_field
    criterion: Contains long_running_jobs field.
    axis: correctness
    verify: text_file_regex
  - id: has_recommendation
    criterion: Each job has a valid recommendation (terminate/kill/wait).
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_param_sweep_003_20260715
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent can submit batch parameterized jobs with job group.
  human_prompt_seed: |
    请利用 bohr-cli 完成以下任务：
    我要做参数扫描，温度 300K 到 1000K 每 100K 一个，同一个模板跑 8 个任务。
    用 `registry.dp.tech/dptech/ubuntu:22.04-cuda12.1` 镜像，命令为 `echo "T=$TEMP" > result.txt`（把 $TEMP 替换为实际温度值），机型 `c2_m4_cpu`。
    把所有提交的任务ID记录到 `b3_jobs.json`，格式：
    ```json
    {"job_group_id": ..., "jobs": [{"temperature_K": ..., "job_id": ...}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b3_jobs.json
  - key: has_300K
    value:
      filename: b3_jobs.json
      pattern: '"temperature_K"\s*:\s*300'
  - key: has_1000K
    value:
      filename: b3_jobs.json
      pattern: '"temperature_K"\s*:\s*1000'
  - key: has_job_ids
    value:
      filename: b3_jobs.json
      pattern: '"job_id"\s*:\s*\d+'
  - key: has_group
    value:
      filename: b3_jobs.json
      pattern: '"job_group_id"\s*:\s*\d+'
  - key: turn_budget
    value:
      max: 18
  scoring_checklist:
  - id: artifact
    criterion: b3_jobs.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_300K
    criterion: Contains 300K temperature entry.
    axis: correctness
    verify: text_file_regex
  - id: has_1000K
    criterion: Contains 1000K temperature entry.
    axis: correctness
    verify: text_file_regex
  - id: has_job_ids
    criterion: Job IDs are real numeric values from platform.
    axis: correctness
    verify: text_file_regex
  - id: has_group
    criterion: Job group ID recorded.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

