version: v5
capability: workflow_orchestration
domain: agnostic
questions:
- id: BWO_image_machine_001_20260715
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent queries images and machine types without creating resources.
  human_prompt_seed: |
    利用 bohr-cli，我有个 CP2K 输入文件要跑 DFT，有没有现成的镜像？版本都是几？有哪些计算机型？
    结果保存到 `b1_resources.json`，格式：
    ```json
    {"images": [{"name": "...", "version": "..."}], "machine_types": [{"name": "...", "spec": "..."}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b1_resources.json
  - key: has_images
    value:
      filename: b1_resources.json
      pattern: '"images"\s*:\s*\[\s*\{'
  - key: cp2k_found
    value:
      filename: b1_resources.json
      pattern: '[Cc][Pp]2[Kk]'
  - key: has_machines
    value:
      filename: b1_resources.json
      pattern: '"machine_types"\s*:\s*\[\s*\{'
  - key: turn_budget
    value:
      max: 6
  scoring_checklist:
  - id: artifact
    criterion: b1_resources.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_images
    criterion: images array populated.
    axis: correctness
    verify: text_file_regex
  - id: cp2k_found
    criterion: CP2K image found in results.
    axis: correctness
    verify: text_file_regex
  - id: has_machines
    criterion: machine_types array populated.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_long_running_002_20260715_v2
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent diagnoses long-running jobs with appropriate recommendations.
  human_prompt_seed: |
    利用 bohr-cli，看看我有没有跑超过一天还没结束的任务，有的话检查下是不是卡死了。
    将分析结果保存到 `b2_diagnosis.json`，格式：
    ```json
    {"long_running_jobs": [{"job_id": ..., "name": "...", "duration_hours": ..., "status": ..., "recommendation": "terminate|kill|wait"}], "total_checked": ...}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b2_diagnosis.json
  - key: diagnosis_schema
    value:
      filename: b2_diagnosis.json
      schema:
        type: object
        required:
        - long_running_jobs
        - total_checked
        properties:
          long_running_jobs:
            type: array
            items:
              type: object
              required:
              - job_id
              - name
              - duration_hours
              - status
              - recommendation
              properties:
                job_id:
                  oneOf:
                  - type: integer
                  - type: string
                    minLength: 1
                name:
                  type: string
                  minLength: 1
                duration_hours:
                  type: number
                  minimum: 0
                status:
                  oneOf:
                  - type: integer
                  - type: string
                    minLength: 1
                recommendation:
                  type: string
                  enum:
                  - terminate
                  - kill
                  - wait
          total_checked:
            type: integer
            minimum: 0
  - key: turn_budget
    value:
      max: 8
  scoring_checklist:
  - id: artifact
    criterion: b2_diagnosis.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: diagnosis_schema
    criterion: Diagnosis records the checked-job count and gives every long-running job a valid terminate, kill, or wait recommendation.
    axis: correctness
    verify: json_file_schema
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_param_sweep_003_20260715_v3
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent can submit batch parameterized jobs with job group.
  human_prompt_seed: |
    利用 bohr-cli，我要做参数扫描，温度 300K 到 1000K 每 100K 一个，同一个模板跑 8 个任务。
    用 `registry.dp.tech/dptech/ubuntu:22.04-py3.10-cuda12.1` 镜像，命令为 `echo "T=$TEMP" > result.txt`（把 $TEMP 替换为实际温度值），机型 `c2_m4_cpu`。
    把任务放在同一个任务组中，并将实际的任务组 ID 和每个温度对应的任务 ID 记录到 `b3_jobs.json`；每条任务记录包含 `temperature_K` 和 `job_id`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b3_jobs.json
  - key: sweep_schema
    value:
      filename: b3_jobs.json
      schema:
        type: object
        required:
        - jobs
        anyOf:
        - required:
          - job_group_id
        - required:
          - group_id
        properties:
          job_group_id:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
              pattern: '^[1-9][0-9]*$'
          group_id:
            oneOf:
            - type: integer
              minimum: 1
            - type: string
              pattern: '^[1-9][0-9]*$'
          jobs:
            type: array
            minItems: 8
            maxItems: 8
            items:
              type: object
              required:
              - temperature_K
              - job_id
              properties:
                temperature_K:
                  type: integer
                  enum:
                  - 300
                  - 400
                  - 500
                  - 600
                  - 700
                  - 800
                  - 900
                  - 1000
                job_id:
                  oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: '^[1-9][0-9]*$'
              additionalProperties: false
            allOf:
            - contains:
                properties:
                  temperature_K:
                    const: 300
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 400
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 500
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 600
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 700
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 800
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 900
                required:
                - temperature_K
            - contains:
                properties:
                  temperature_K:
                    const: 1000
                required:
                - temperature_K
        additionalProperties: false
  - key: group_created_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job_group\s+create\b'
      min_matches: 1
      max_matches: 1
  - key: group_jobs_submitted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      direct_pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+submit\b(?=[^\n;&|]*(?:(?:--job_group_id|-g)(?:\s+|=))\S+)'
      script_pattern: '(?:(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+submit\b(?=[^\n;&|]*(?:(?:--job_group_id|-g)(?:\s+|=))\S+)|["'']bohr["'']\s*,\s*["'']job["'']\s*,\s*["'']submit["''](?=[\s\S]{0,1000}?["''](?:--job_group_id|-g)["'']))'
      min_matches: 1
  - key: turn_budget
    value:
      max: 18
  scoring_checklist:
  - id: artifact
    criterion: b3_jobs.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: sweep_schema
    criterion: One positive job group ID and eight positive job IDs cover every 100 K step from 300 K through 1000 K.
    axis: correctness
    verify: json_file_schema
  - id: group_created_via_cli
    criterion: The job group was created through bohr-cli exactly once.
    axis: grounding
    verify: tool_args_regex
  - id: group_jobs_submitted_via_cli
    criterion: Jobs were submitted through bohr-cli with a job-group argument, directly or through an executed helper script.
    axis: grounding
    verify: scripted_tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BWO_gpu_compare_004_20260715_v3
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent queries available GPU machines and makes a grounded recommendation without creating resources.
  human_prompt_seed: |
    利用 Bohr-CLI，帮我看看现在用于提交计算任务的可用 GPU 机型。我准备训练一个 500 原子体系的 DeepMD 模型，请比较一下显存和价格，推荐一个性价比合适的配置。只查询，不要创建资源。
    把对比结果和推荐理由保存到工作区根目录的 `b4_gpu_comparison.json`。JSON 顶层使用 `workload`、`available_machines` 和 `recommendation`；`workload` 包含 `framework` 和 `atom_count`，每个候选机型包含 `sku_id`、`machine_type`、`gpu_model`、`gpu_count`、`gpu_memory_gb`、`price_cny_per_hour` 和 `has_stock`，`recommendation` 包含 `machine_type` 和 `reason`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: b4_gpu_comparison.json
    workspace_resolve: root
  - key: comparison_schema
    value:
      filename: b4_gpu_comparison.json
      schema:
        type: object
        required:
        - workload
        - available_machines
        - recommendation
        properties:
          workload:
            type: object
            required:
            - framework
            - atom_count
            properties:
              framework:
                const: DeepMD
              atom_count:
                const: 500
            additionalProperties: false
          available_machines:
            type: array
            minItems: 3
            uniqueItems: true
            items:
              type: object
              required:
              - sku_id
              - machine_type
              - gpu_model
              - gpu_count
              - gpu_memory_gb
              - price_cny_per_hour
              - has_stock
              properties:
                sku_id:
                  type: integer
                  minimum: 1
                machine_type:
                  type: string
                  minLength: 1
                gpu_model:
                  type: string
                  minLength: 1
                gpu_count:
                  type: integer
                  minimum: 1
                gpu_memory_gb:
                  type: number
                  exclusiveMinimum: 0
                price_cny_per_hour:
                  type: number
                  exclusiveMinimum: 0
                has_stock:
                  const: true
              additionalProperties: false
          recommendation:
            type: object
            required:
            - machine_type
            - reason
            properties:
              machine_type:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 20
            additionalProperties: false
        additionalProperties: false
    workspace_resolve: root
  - key: machines_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+machine\s+list\b(?=[^\n]*(?:-c|--chooseType)(?:\s+|=)gpu(?:\s|$))(?=[^\n]*(?:-s|--scene)(?:\s+|=)job(?:\s|$))'
      min_matches: 1
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: b4_gpu_comparison.json written to workspace root.
    axis: correctness
    verify: artifact_exists
  - id: comparison_schema
    criterion: The result records the 500-atom DeepMD workload, multiple in-stock GPU machines with memory and price, and a reasoned recommendation.
    axis: correctness
    verify: json_file_schema
  - id: machines_queried_via_cli
    criterion: Job-scene GPU machine inventory was queried through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

