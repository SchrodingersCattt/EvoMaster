- id: BWO_lit_db_D5_20260715_v2
  capability: workflow_orchestration
  domain: agnostic
  scope: platform
  intent: Test agent designs a literature database construction pipeline.
  human_prompt_seed: |
    利用 bohr-cli，我想为钠离子电池正极材料做个文献数据库。帮我检索 20 篇高引文献，再根据检索结果设计用于记录关键性能参数的字段和批处理入库策略。
    把结果保存到 `d5_literature_db.json`，其中记录 `schema.fields`、实际检索到的文献数 `papers_found` 和 `batch_strategy`；每个字段包含 `name`、`type` 和 `description`。
  tags:
