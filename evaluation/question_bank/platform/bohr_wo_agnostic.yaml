      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+node\s+create\b'
      min_matches: 1
  - key: node_inspected_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+node\s+get\b'
