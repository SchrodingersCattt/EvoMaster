    我有两个势函数模型想对比精度，用同一组测试集分别跑 dp test，结果对比一下。
    对比结果保存到 `b8_comparison.json`，格式：
    ```json
    {"model_a": {"name": "...", "rmse_e": ..., "rmse_f": ...}, "model_b": {"name": "...", "rmse_e": ..., "rmse_f": ...}, "conclusion": "..."}
    ```
    注：如果环境里没有模型文件，可以用 mock 数据演示流程，但要体现完整的 dp test 对比逻辑。
