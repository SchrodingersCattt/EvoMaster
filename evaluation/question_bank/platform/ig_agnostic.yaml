version: v5
capability: input_generation
domain: agnostic
questions:
- id: PIG_abacus_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test Bohrium submission defaults (image/machine/cmd), pre-flight validation
    script execution, and manifest completeness for ABACUS.
  human_prompt_seed: '工作区中提供了 bcc Fe 结构 `STRU_Fe_bcc`（单原子原胞，自旋极化）。

    请完成以下任务：

    1. 准备 ABACUS LCAO 自洽场计算输入，放入 `fe_scf/` 目录；

    2. 输入文件生成后，验证其正确性；

    3. 生成完整的 Bohrium 提交包，包括 `input_prep_manifest.json`，确保可以直接提交到平台运行。'
  tags:
  - eng_abacus
  data_files:
  - key: stru_fe
    path: data/PIG_abacus_001_20260513/STRU_Fe_bcc
    oss_url: ''
    description: bcc Fe single-atom primitive cell STRU (spin-polarized).
  reference_answers:
  - key: input_artifact
    value: fe_scf/INPUT
  - key: stru_artifact
    value: fe_scf/STRU
  - key: manifest_artifact
    value: fe_scf/input_prep_manifest.json
  - key: must_nspin_2
    value:
      filename: fe_scf/INPUT
      pattern: (?im)^\s*nspin\s+2\s*$
      flags: im
  - key: must_basis_lcao
    value:
      filename: fe_scf/INPUT
      pattern: (?im)^\s*basis_type\s+lcao\s*$
      flags: im
  - key: must_calculation_scf
    value:
      filename: fe_scf/INPUT
      pattern: (?im)^\s*calculation\s+scf\s*$
      flags: im
  - key: must_pseudo_dir
    value:
      filename: fe_scf/INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1
      flags: im
  - key: must_orbital_dir
    value:
      filename: fe_scf/INPUT
      pattern: (?im)^\s*orbital_dir\s+/root/apns-orbitals-efficiency-v1
      flags: im
  - key: must_manifest_software
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: (?i)"software"\s*:\s*"abacus"
      flags: i
  - key: must_manifest_submit_ready
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: '"submit_ready"\s*:\s*true'
      flags: ''
  - key: must_manifest_bohrium_command
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: bohrium_command
      flags: ''
  - key: must_manifest_image
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: abacusp
      flags: ''
  - key: must_manifest_machine
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: c32_m128_cpu
      flags: ''
  - key: must_manifest_mpirun
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: mpirun\s+-np\s+16
      flags: ''
  - key: must_manifest_diagnostics
    value:
      filename: fe_scf/input_prep_manifest.json
      pattern: diagnosis\.json
      flags: ''
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: input_artifact
    criterion: fe_scf/INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: stru_artifact
    criterion: fe_scf/STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: manifest_artifact
    criterion: fe_scf/input_prep_manifest.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_nspin_2
    criterion: '[Must] INPUT enables spin polarization for Fe.'
    axis: correctness
    verify: text_file_regex
  - id: must_basis_lcao
    criterion: '[Must] INPUT uses basis_type lcao.'
    axis: correctness
    verify: text_file_regex
  - id: must_calculation_scf
    criterion: '[Must] INPUT sets calculation scf.'
    axis: correctness
    verify: text_file_regex
  - id: must_pseudo_dir
    criterion: '[Must] INPUT sets pseudo_dir to APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_dir
    criterion: '[Must] INPUT sets orbital_dir to APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_software
    criterion: '[Platform] manifest software field is abacus.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_submit_ready
    criterion: '[Platform] manifest submit_ready is true (validation passed).'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_bohrium_command
    criterion: '[Platform] manifest contains bohrium_command field.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_image
    criterion: '[Platform] bohrium_command references correct ABACUS image.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_machine
    criterion: '[Platform] bohrium_command uses c32_m128_cpu machine.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_mpirun
    criterion: '[Platform] bohrium_command uses mpirun -np 16 (half of 32 cores).'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_diagnostics
    criterion: '[Platform] manifest diagnostics.file references diagnosis.json.'
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PIG_vasp_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test Bohrium submission defaults for VASP and manifest generation with correct
    image/machine/cmd.
  human_prompt_seed: '工作区中提供了 Si 金刚石结构 `POSCAR_Si`。

    请完成以下任务：

    1. 为其准备 VASP 自洽场计算输入，放入 `si_scf/` 目录；

    2. 生成完整的 Bohrium 提交包，包括 `input_prep_manifest.json`，确保可直接提交计算。'
  tags:
  - eng_vasp
  data_files:
  - key: poscar_si
    path: data/PIG_vasp_001_20260513/POSCAR_Si
    oss_url: ''
    description: Si diamond POSCAR (2 atoms, conventional).
  reference_answers:
  - key: incar_artifact
    value: si_scf/INCAR
  - key: kpoints_artifact
    value: si_scf/KPOINTS
  - key: manifest_artifact
    value: si_scf/input_prep_manifest.json
  - key: must_manifest_software
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: (?i)"software"\s*:\s*"vasp"
      flags: i
  - key: must_manifest_submit_ready
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: '"submit_ready"\s*:\s*true'
      flags: ''
  - key: must_manifest_bohrium_command
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: bohrium_command
      flags: ''
  - key: must_manifest_image_vasp
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: vasp
      flags: i
  - key: must_manifest_diagnostics
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: diagnosis\.json
      flags: ''
  - key: must_incar_basic
    value:
      filename: si_scf/INCAR
      tokens:
      - ENCUT
      - ISMEAR
      flags: i
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
