- id: PIG_cp2k_tm_001_20260524
  capability: input_generation
  domain: agnostic
  priority: P1
  intent: Test CP2K input generation for a transition-metal oxide system that requires
    conservative SCF mixing settings, plus platform submission. Agent must (1) set
    appropriate MIXING for Fe-containing system (Broyden or low-alpha Pulay, not
    default ALPHA=0.4), (2) submit to Bohrium not run/install locally, (3) not modify
    any platform script source code. From real trajectory where agent sed-edited
    submit_job.py and used default mixing leading to SCF oscillation.
  human_prompt_seed: '工作区中有 Fe₂O₃（hematite，R-3c）的 CIF 文件 `Fe2O3.cif`（10原子原胞）。
    请用 CP2K 对其做 PBE+U (U_eff=4.0 eV on Fe 3d) 的 SCF 单点能计算。
    使用 DZVP-MOLOPT-SR-GTH 基组、截断能 600 Ry、k 点 Gamma only。
    帮我准备好输入并跑一下。'
  tags:
  - eng_cp2k
  data_files:
  - key: cif_file
    path: data/PIG_cp2k_tm_001/Fe2O3.cif
    oss_url: ''
    description: Fe2O3 hematite CIF (R-3c, 10 atoms).
  reference_answers:
  - key: input_artifact
    value: '*.inp'
  - key: must_pbe_u
    value:
      filename: '*.inp'
      pattern: (?is)&DFT\+U.*U_MINUS_J\s+4\.0|U_MINUS_J\s+\[eV\]\s+4\.0|U_MINUS_J_ALPHA\s+4\.0
      flags: is
      glob: true
  - key: must_fe_and_o
    value:
      filename: '*.inp'
      pattern: (?im)(Fe.*O|O.*Fe)
      flags: im
      glob: true
  - key: must_cutoff_600
    value:
      filename: '*.inp'
      pattern: (?im)CUTOFF\s+600
      flags: im
      glob: true
  - key: must_mixing_conservative
    value:
      filename: '*.inp'
      pattern: (?is)&MIXING.*((BROYDEN|PULAY).*ALPHA\s+0\.[01]\d*|ALPHA\s+0\.[01]\d*.*(BROYDEN|PULAY))
      flags: is
      glob: true
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: input_artifact
    criterion: A CP2K input file (*.inp) is written to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: must_dft_plus_u
    criterion: '[Must] Input enables DFT+U with U_eff=4.0 eV on Fe 3d states.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: must_cutoff_600
    criterion: '[Must] CUTOFF is set to 600 Ry as requested.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_mixing_conservative
    criterion: '[Must] SCF MIXING uses a conservative scheme for this transition-metal
      system — either BROYDEN_MIXING or PULAY with ALPHA <= 0.2. Default ALPHA=0.4
      Pulay will cause oscillation for Fe oxides.'
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: must_fe_and_o
    criterion: '[Must] Input contains both Fe and O species in COORD or TOPOLOGY.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: no_local_install_or_source_modify
    criterion: '[Must] Agent does NOT install CP2K locally (conda/pip/mamba) AND does
      NOT modify any platform script source code (no sed on submit_job.py or similar).
      It must submit to Bohrium with a CP2K image.'
    axis: grounding
    verify: llm_binary_judge
    weight: 3.0
  - id: bohrium_submission
    criterion: '[Platform] Agent submits the job to Bohrium using bohrium-job skill
      with a CP2K image.'
    axis: correctness
    verify: llm_binary_judge
