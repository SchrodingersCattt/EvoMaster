version: v5
capability: input_generation
domain: agnostic
questions:
- id: PIG_abacus_convert_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test CIF to STRU conversion with correct LATTICE_CONSTANT, element ordering,
    and PP/orbital filename resolution for Bohrium runtime.
  human_prompt_seed: '工作区中有一个 Pd(111) slab 的 CIF 文件 `Pd111_slab.cif`（16 个 Pd 原子，4
    层）。

    请将其转换为 ABACUS LCAO 格式并准备好 SCF 计算输入，我要直接提交跑。'
  tags:
  - eng_abacus
  - struct_surface
  data_files:
  - key: cif_file
    path: data/IG_abacus_convert_001_20260513/Pd111_slab.cif
    oss_url: ''
    description: Pd(111) 4-layer slab CIF file (16 atoms, P1 symmetry).
  reference_answers:
  - key: stru_artifact
    value: STRU
  - key: input_artifact
    value: INPUT
  - key: must_lattice_constant
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_CONSTANT\s+1\.889\d*
      flags: im
  - key: must_lattice_vectors_keyword
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_VECTORS\s*$
      flags: im
  - key: must_16_atoms
    value:
      filename: STRU
      pattern: (?im)^\s*16\s*$
      flags: im
  - key: must_pd_pp
    value:
      filename: STRU
      pattern: (?im)^\s*Pd\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_pd_orb
    value:
      filename: STRU
      pattern: (?i)Pd\S*\.orb
      flags: i
  - key: must_numerical_orbital
    value:
      filename: STRU
      pattern: (?im)^\s*NUMERICAL_ORBITAL
      flags: im
  - key: must_input_lcao
    value:
      filename: INPUT
      tokens:
      - basis_type lcao
      - calculation scf
      flags: i
  - key: must_pseudo_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1
      flags: im
  - key: must_orbital_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*orbital_dir\s+/root/apns-orbitals-efficiency-v1
      flags: im
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: stru_artifact
    criterion: STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: input_artifact
    criterion: INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_lattice_constant
    criterion: '[Must] STRU sets correct LATTICE_CONSTANT for Bohr/Angstrom conversion.'
    axis: correctness
    verify: text_file_regex
  - id: must_lattice_vectors_keyword
    criterion: '[Must] STRU uses correct keyword LATTICE_VECTORS (not misspelled).'
    axis: correctness
    verify: text_file_regex
  - id: must_16_atoms
    criterion: '[Must] STRU has 16 atoms (matching CIF).'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_pp
    criterion: '[Must] STRU Pd species has valid .upf pseudopotential filename matching
      Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_orb
    criterion: '[Must] STRU has Pd orbital (.orb) entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_numerical_orbital
    criterion: '[Must] STRU contains NUMERICAL_ORBITAL section (required for LCAO).'
    axis: correctness
    verify: text_file_regex
  - id: must_input_lcao
    criterion: '[Must] INPUT uses LCAO SCF mode.'
    axis: correctness
    verify: text_file_contains_all
  - id: must_pseudo_dir
    criterion: '[Platform] INPUT sets pseudo_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_dir
    criterion: '[Platform] INPUT sets orbital_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PIG_abacus_007_20260516
  capability: input_generation
  domain: agnostic
  intent: Prepare ABACUS Si LCAO-SCF inputs and Bohrium submission configuration.
  human_prompt_seed: 请为 Si 的 ABACUS LCAO-SCF 试算准备当前目录下的 `INPUT`、`STRU`、`KPT`，并把 Bohrium
    提交配置写入 `submit_job.json`。
  tags:
  - eng_abacus
  reference_answers:
  - key: submit_json_artifact
    value: submit_job.json
  - key: input_artifact
    value: INPUT
  - key: stru_artifact
    value: STRU
  - key: kpt_artifact
    value: KPT
  - key: must_submit_json_core
    value:
      filename: submit_job.json
      pattern: (?is)"image"\s*:\s*"registry\.dp\.tech/dptech/dp/native/hub/mrdic2/abacusp:1\.0\.3-1778742780".*"machine"\s*:\s*"c32_m128_cpu".*"cmd"\s*:\s*"[^"]*abacus[^"]*"
      flags: im
  - key: must_input_pseudo_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1/?\s*$
      flags: im
  - key: must_input_orbital_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*orbital_dir\s+\S+
      flags: im
  - key: must_stru_si_pseudo
    value:
      filename: STRU
      pattern: (?im)^\s*Si\s+[0-9.]+\s+Si\.upf\s*$
      flags: im
  - key: variable_workspace_files_correct
    value: {}
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: submit_json_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `submit_job.json` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: input_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `INPUT` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: stru_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `STRU` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: kpt_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `KPT` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: must_submit_json_core
    criterion: '[Must] submit_job.json uses the expected ABACUS Bohrium image, machine,
      and command.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_input_pseudo_dir
    criterion: '[Must] INPUT points ABACUS to the APNS pseudopotential directory.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_input_orbital_dir
    criterion: '[Must] INPUT includes an explicit orbital_dir path, required for LCAO
      Bohrium jobs where orbital files are not in the default location.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_stru_si_pseudo
    criterion: '[Must] STRU uses the available Si pseudopotential filename.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: variable_workspace_files_correct
    criterion: '[Variable] Workspace files are mutually consistent for the ABACUS
      Si LCAO-SCF run.'
    axis: correctness
    verify: llm_binary_judge
    weight: 0.3
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
