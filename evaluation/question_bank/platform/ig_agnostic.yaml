    criterion: si_scf/INCAR written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: kpoints_artifact
    criterion: si_scf/KPOINTS written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: manifest_artifact
    criterion: si_scf/input_prep_manifest.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_manifest_software
    criterion: '[Platform] manifest software field is vasp.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_submit_ready
    criterion: '[Platform] manifest submit_ready is true.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_bohrium_command
    criterion: '[Platform] manifest contains bohrium_command field.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_image_vasp
    criterion: '[Platform] bohrium_command references VASP image.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_diagnostics
    criterion: '[Platform] manifest diagnostics.file references diagnosis.json.'
    axis: correctness
    verify: text_file_regex
  - id: must_incar_basic
    criterion: '[Must] INCAR contains ENCUT and ISMEAR.'
    axis: correctness
    verify: text_file_contains_all
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PIG_abacus_convert_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test CIF to STRU conversion with correct LATTICE_CONSTANT, element ordering,
    and PP/orbital filename resolution for Bohrium runtime.
  human_prompt_seed: '工作区中有一个 Pd(111) slab 的 CIF 文件 `Pd111_slab.cif`（16 个 Pd 原子，4 层）。

    请将其转换为 ABACUS LCAO STRU 格式并生成对应的 SCF INPUT，确保可以在 Bohrium 上直接运行。

    输出 `STRU` 和 `INPUT` 到当前目录。'
  tags:
  - eng_abacus
  - struct_surface
  data_files:
  - key: cif_file
    path: data/IG_abacus_convert_001_20260513/Pd111_slab.cif
    oss_url: ''
    description: Pd(111) 4-layer slab CIF file (16 atoms, P1 symmetry).
  reference_answers:
  - key: stru_artifact
    value: STRU
  - key: input_artifact
    value: INPUT
  - key: must_lattice_constant
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_CONSTANT\s+1\.889\d*
      flags: im
  - key: must_lattice_vectors_keyword
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_VECTORS\s*$
      flags: im
  - key: must_16_atoms
    value:
      filename: STRU
      pattern: (?im)^\s*16\s*$
      flags: im
  - key: must_pd_pp
    value:
      filename: STRU
      pattern: (?im)^\s*Pd\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_pd_orb
    value:
      filename: STRU
      pattern: (?i)Pd\S*\.orb
      flags: i
  - key: must_numerical_orbital
    value:
      filename: STRU
      pattern: (?im)^\s*NUMERICAL_ORBITAL
      flags: im
  - key: must_input_lcao
    value:
      filename: INPUT
      tokens:
      - basis_type lcao
      - calculation scf
      flags: i
  - key: must_pseudo_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1
      flags: im
  - key: must_orbital_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*orbital_dir\s+/root/apns-orbitals-efficiency-v1
      flags: im
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: stru_artifact
    criterion: STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: input_artifact
    criterion: INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_lattice_constant
    criterion: '[Must] STRU sets correct LATTICE_CONSTANT for Bohr/Angstrom conversion.'
    axis: correctness
    verify: text_file_regex
  - id: must_lattice_vectors_keyword
    criterion: '[Must] STRU uses correct keyword LATTICE_VECTORS (not misspelled).'
    axis: correctness
    verify: text_file_regex
  - id: must_16_atoms
    criterion: '[Must] STRU has 16 atoms (matching CIF).'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_pp
    criterion: '[Must] STRU Pd species has valid .upf pseudopotential filename matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_orb
    criterion: '[Must] STRU has Pd orbital (.orb) entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_numerical_orbital
    criterion: '[Must] STRU contains NUMERICAL_ORBITAL section (required for LCAO).'
    axis: correctness
    verify: text_file_regex
  - id: must_input_lcao
    criterion: '[Must] INPUT uses LCAO SCF mode.'
    axis: correctness
    verify: text_file_contains_all
  - id: must_pseudo_dir
    criterion: '[Platform] INPUT sets pseudo_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_dir
    criterion: '[Platform] INPUT sets orbital_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PIG_abacus_pp_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test pseudopotential and orbital filename resolution for uncommon elements
    against Bohrium runtime inventory.
  human_prompt_seed: '请为钙钛矿 BaZrO₃ 准备 ABACUS LCAO 自洽场计算。

    结构文件 `STRU_BaZrO3` 已放在工作区中（含晶格和原子坐标，但赝势和轨道文件名暂空）。

    请补全并生成可在 Bohrium 上运行的完整 INPUT 和 STRU。'
  tags:
  - eng_abacus
  data_files:
  - key: stru_bazro3
    path: data/IG_abacus_021_20260513/STRU_BaZrO3
    oss_url: ''
    description: BaZrO3 perovskite STRU with empty PP/orbital fields to be resolved.
  reference_answers:
  - key: input_artifact
    value: INPUT
  - key: stru_artifact
    value: STRU
  - key: must_ntype_3
    value:
      filename: INPUT
      pattern: (?im)^\s*ntype\s+3\s*$
      flags: im
  - key: must_basis_lcao
    value:
      filename: INPUT
      tokens:
      - basis_type lcao
      - calculation scf
      flags: i
  - key: must_pseudo_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1/?\s*$
      flags: im
  - key: must_orbital_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*orbital_dir\s+/root/apns-orbitals-efficiency-v1/?\s*$
      flags: im
  - key: must_stru_ba_pp
    value:
      filename: STRU
      pattern: (?im)^\s*Ba\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_stru_zr_pp
    value:
      filename: STRU
      pattern: (?im)^\s*Zr\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_stru_o_pp
    value:
      filename: STRU
      pattern: (?im)^\s*O\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_stru_ba_orb
    value:
      filename: STRU
      pattern: (?i)Ba\S*\.orb
      flags: i
  - key: must_stru_zr_orb
    value:
      filename: STRU
      pattern: (?i)Zr\S*\.orb
      flags: i
  - key: must_stru_o_orb
    value:
      filename: STRU
      pattern: (?i)O\S*\.orb
      flags: i
  - key: must_ecutwfc_reasonable
    value:
      filename: INPUT
      checks:
      - key: ecutwfc
        min: 80
        max: 200
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: input_artifact
    criterion: INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: stru_artifact
    criterion: STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_ntype_3
    criterion: '[Must] ntype = 3 for Ba, Zr, O.'
    axis: correctness
    verify: text_file_regex
  - id: must_basis_lcao
    criterion: '[Must] INPUT uses LCAO SCF mode.'
    axis: correctness
    verify: text_file_contains_all
  - id: must_pseudo_dir
    criterion: '[Platform] pseudo_dir points to Bohrium APNS pseudopotential directory.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_dir
    criterion: '[Platform] orbital_dir points to Bohrium APNS orbital directory.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_ba_pp
    criterion: '[Platform] STRU Ba species has .upf filename matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_zr_pp
    criterion: '[Platform] STRU Zr species has .upf filename matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_o_pp
    criterion: '[Platform] STRU O species has .upf filename matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_ba_orb
    criterion: '[Platform] STRU has Ba .orb entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_zr_orb
    criterion: '[Platform] STRU has Zr .orb entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_o_orb
    criterion: '[Platform] STRU has O .orb entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_ecutwfc_reasonable
    criterion: '[Must] ecutwfc within reasonable range for LCAO.'
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.8
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
