version: v5
capability: input_generation
domain: agnostic
questions:
- id: PIG_vasp_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test Bohrium submission defaults for VASP and manifest generation with correct
    image/machine/cmd.
  human_prompt_seed: '工作区中提供了 Si 金刚石结构 `POSCAR_Si`。

    请准备 VASP 自洽场计算输入，放入 `si_scf/` 目录，准备好后我要直接提交计算。'
  tags:
  - eng_vasp
  data_files:
  - key: poscar_si
    path: data/PIG_vasp_001_20260513/POSCAR_Si
    oss_url: ''
    description: Si diamond POSCAR (2 atoms, conventional).
  reference_answers:
  - key: incar_artifact
    value: si_scf/INCAR
  - key: kpoints_artifact
    value: si_scf/KPOINTS
  - key: manifest_artifact
    value: si_scf/input_prep_manifest.json
  - key: must_manifest_software
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: (?i)"software"\s*:\s*"vasp"
      flags: i
  - key: must_manifest_submit_ready
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: '"submit_ready"\s*:\s*true'
      flags: ''
  - key: must_manifest_bohrium_command
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: bohrium_command
      flags: ''
  - key: must_manifest_image_vasp
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: vasp
      flags: i
  - key: must_manifest_diagnostics
    value:
      filename: si_scf/input_prep_manifest.json
      pattern: diagnosis\.json
      flags: ''
  - key: must_incar_basic
    value:
      filename: si_scf/INCAR
      tokens:
      - ENCUT
      - ISMEAR
      flags: i
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: incar_artifact
    criterion: si_scf/INCAR written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: kpoints_artifact
    criterion: si_scf/KPOINTS written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: manifest_artifact
    criterion: si_scf/input_prep_manifest.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_manifest_software
    criterion: '[Platform] manifest software field is vasp.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_submit_ready
    criterion: '[Platform] manifest submit_ready is true.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_bohrium_command
    criterion: '[Platform] manifest contains bohrium_command field.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_image_vasp
    criterion: '[Platform] bohrium_command references VASP image.'
    axis: correctness
    verify: text_file_regex
  - id: must_manifest_diagnostics
    criterion: '[Platform] manifest diagnostics.file references diagnosis.json.'
    axis: correctness
    verify: text_file_regex
  - id: must_incar_basic
    criterion: '[Must] INCAR contains ENCUT and ISMEAR.'
    axis: correctness
    verify: text_file_contains_all
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PIG_abacus_convert_001_20260513
  capability: input_generation
  domain: agnostic
  intent: Test CIF to STRU conversion with correct LATTICE_CONSTANT, element ordering,
    and PP/orbital filename resolution for Bohrium runtime.
  human_prompt_seed: '工作区中有一个 Pd(111) slab 的 CIF 文件 `Pd111_slab.cif`（16 个 Pd 原子，4 层）。

    请将其转换为 ABACUS LCAO 格式并准备好 SCF 计算输入，我要直接提交跑。'
  tags:
  - eng_abacus
  - struct_surface
  data_files:
  - key: cif_file
    path: data/IG_abacus_convert_001_20260513/Pd111_slab.cif
    oss_url: ''
    description: Pd(111) 4-layer slab CIF file (16 atoms, P1 symmetry).
  reference_answers:
  - key: stru_artifact
    value: STRU
  - key: input_artifact
    value: INPUT
  - key: must_lattice_constant
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_CONSTANT\s+1\.889\d*
      flags: im
  - key: must_lattice_vectors_keyword
    value:
      filename: STRU
      pattern: (?im)^\s*LATTICE_VECTORS\s*$
      flags: im
  - key: must_16_atoms
    value:
      filename: STRU
      pattern: (?im)^\s*16\s*$
      flags: im
  - key: must_pd_pp
    value:
      filename: STRU
      pattern: (?im)^\s*Pd\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_pd_orb
    value:
      filename: STRU
      pattern: (?i)Pd\S*\.orb
      flags: i
  - key: must_numerical_orbital
    value:
      filename: STRU
      pattern: (?im)^\s*NUMERICAL_ORBITAL
      flags: im
  - key: must_input_lcao
    value:
      filename: INPUT
      tokens:
      - basis_type lcao
      - calculation scf
      flags: i
  - key: must_pseudo_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*pseudo_dir\s+/root/apns-pseudopotentials-v1
      flags: im
  - key: must_orbital_dir
    value:
      filename: INPUT
      pattern: (?im)^\s*orbital_dir\s+/root/apns-orbitals-efficiency-v1
      flags: im
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: stru_artifact
    criterion: STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: input_artifact
    criterion: INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_lattice_constant
    criterion: '[Must] STRU sets correct LATTICE_CONSTANT for Bohr/Angstrom conversion.'
    axis: correctness
    verify: text_file_regex
  - id: must_lattice_vectors_keyword
    criterion: '[Must] STRU uses correct keyword LATTICE_VECTORS (not misspelled).'
    axis: correctness
    verify: text_file_regex
  - id: must_16_atoms
    criterion: '[Must] STRU has 16 atoms (matching CIF).'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_pp
    criterion: '[Must] STRU Pd species has valid .upf pseudopotential filename matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_pd_orb
    criterion: '[Must] STRU has Pd orbital (.orb) entry matching Bohrium runtime.'
    axis: correctness
    verify: text_file_regex
  - id: must_numerical_orbital
    criterion: '[Must] STRU contains NUMERICAL_ORBITAL section (required for LCAO).'
    axis: correctness
    verify: text_file_regex
  - id: must_input_lcao
    criterion: '[Must] INPUT uses LCAO SCF mode.'
    axis: correctness
    verify: text_file_contains_all
  - id: must_pseudo_dir
    criterion: '[Platform] INPUT sets pseudo_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_dir
    criterion: '[Platform] INPUT sets orbital_dir to Bohrium APNS path.'
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
