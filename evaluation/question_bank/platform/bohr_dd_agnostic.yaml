    创建完成后用 bohr file list 验证，把结果保存到 `c4_verify.json`，格式：
    ```json
    {"created_dirs": ["personal/2026_experiments/", "personal/2026_experiments/A/", "personal/2026_experiments/B/", "personal/2026_experiments/C/"]}
