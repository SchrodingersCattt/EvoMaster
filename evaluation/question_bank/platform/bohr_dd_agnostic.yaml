- id: BDD_kb_upload_search_008_20260715
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent uploads PDF with spaces in filename to knowledge base and searches for thermal decomposition data.
  human_prompt_seed: |
    利用 bohr-cli，把这篇文献传到知识库里去，然后搜一下里面纳米样品的DSC热分解峰温是多少摄氏度。
    结果保存到 `c8_kb_search.json`，记录文件名、知识库 ID、上传状态、热分解温度和搜索结果。JSON 顶层使用 `filename`、`kb_id`、`upload_success`、`nano_thermal_decomposition_celsius` 和 `search_results`。
  tags:
  - bohr-cli
  data_files:
  - key: pdf_perovskite
    path: "data/bohr_cli/Fabrication and characterization of Nano  H2dabco  K ClO4 3  molecular Perovskite by ball milling.pdf"
    description: PDF with spaces in filename. Energetic molecular perovskite paper, nano sample DSC peak at 384.5°C.
  reference_answers:
  - key: artifact
    value: c8_kb_search.json
  - key: upload_success
    value:
      filename: c8_kb_search.json
      pattern: '"upload_success"\s*:\s*(true|false)'
  - key: has_kb_id
    value:
      filename: c8_kb_search.json
      pattern: '"kb_id"\s*:\s*(\d+|null)'
  - key: thermal_decomp
    value:
      filename: c8_kb_search.json
      key: nano_thermal_decomposition_celsius
      min: 382.0
      max: 387.0
  - key: has_filename_with_spaces
    value:
      filename: c8_kb_search.json
      pattern: Fabrication.*characterization|H2dabco
      flags: i
  - key: kb_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+kb\s+\+?(upload|search)\b'
      min_matches: 1
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: c8_kb_search.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: upload_success
    criterion: PDF upload status reported (true or false).
    axis: correctness
    verify: text_file_regex
  - id: has_kb_id
    criterion: Knowledge base ID recorded (numeric or null).
    axis: correctness
    verify: text_file_regex
  - id: thermal_decomp
    criterion: Nano sample thermal decomposition temperature within 382-387°C (expected ~384.5°C).
    axis: correctness
    verify: json_file_numeric_range
    weight: 2.0
  - id: has_filename_with_spaces
    criterion: Filename with spaces correctly handled and recorded.
    axis: correctness
    verify: text_file_regex
  - id: kb_queried_via_cli
    criterion: Knowledge base was accessed through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BDD_file_lifecycle_009_20260716
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent performs full file lifecycle (mkdir, upload, list, move, delete) on a unique temp directory.
  human_prompt_seed: |
    利用 bohr-cli，帮我在 personal 盘上做一轮文件管理验证：建一个名称带唯一时间戳的临时目录，把工作区里的 `test` 文件传进去，确认存在后把文件移到同目录的子文件夹里，最后把整个临时目录连同内容一起删掉。
    把每一步操作的动作和前后目录状态记录下来，保存到 `c9_lifecycle.json`。JSON 顶层使用 `steps` 和 `final_cleaned`；`steps` 为数组，每项含 `action` 和 `listing`，其中 `listing` 为数组。
  tags:
  - bohr-cli
  data_files:
  - key: test_file
    path: data/bohr_cli/test
    description: Small test file for upload lifecycle verification.
  reference_answers:
  - key: artifact
    value: c9_lifecycle.json
  - key: lifecycle_schema
    value:
      filename: c9_lifecycle.json
      schema:
        type: object
        required:
        - steps
        - final_cleaned
        properties:
          steps:
            type: array
            minItems: 4
            items:
              type: object
              required:
              - action
              - listing
              properties:
                action:
                  type: string
                  minLength: 1
                listing:
                  type: array
          final_cleaned:
            type: boolean
            const: true
  - key: mkdir_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?mkdir\b'
      min_matches: 1
  - key: upload_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?upload\b'
      min_matches: 1
  - key: list_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?(list|stat)\b'
      min_matches: 2
  - key: move_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?move\b'
      min_matches: 1
  - key: delete_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?(delete|rm)\b'
      min_matches: 1
  - key: turn_budget
    value:
      max: 25
  scoring_checklist:
  - id: artifact
    criterion: c9_lifecycle.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: lifecycle_schema
    criterion: Records at least 4 steps with action and listing, and confirms final cleanup.
    axis: correctness
    verify: json_file_schema
  - id: mkdir_via_cli
    criterion: Directory creation was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: upload_via_cli
    criterion: File upload was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: list_via_cli
    criterion: Directory listing or stat was invoked through bohr-cli at least twice.
    axis: grounding
    verify: tool_args_regex
  - id: move_via_cli
    criterion: File move was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: delete_via_cli
    criterion: File or directory deletion was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BDD_database_readonly_010_20260717
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent performs read-only database queries — tables, schema, and conditional query.
  human_prompt_seed: |
    利用 bohr-cli，帮我看看平台数据库里有哪些表，找个跟任务记录相关的表看下结构，再查最近 5 条记录。只读不写。
    结果保存到 `c10_db_query.json`，记录表清单、选中表的结构和查询结果。JSON 顶层使用 `tables`、`selected_table` 和 `query_results`；`tables` 为数组，`selected_table` 包含 `name` 和 `columns`，`query_results` 为数组。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: c10_db_query.json
  - key: db_schema
    value:
      filename: c10_db_query.json
      schema:
        type: object
        required:
        - tables
        - selected_table
        - query_results
        properties:
          tables:
            type: array
            minItems: 1
          selected_table:
            type: object
            required:
            - name
            - columns
            properties:
              name:
                type: string
                minLength: 1
              columns:
                type: array
                minItems: 1
          query_results:
            type: array
            minItems: 1
            maxItems: 5
  - key: tables_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+database\s+\+?tables\b'
      min_matches: 1
  - key: schema_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+database\s+\+?schema\b'
      min_matches: 1
  - key: query_executed_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+database\s+\+?query\b'
      min_matches: 1
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: c10_db_query.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: db_schema
    criterion: Records table list, selected table schema with columns, and up to 5 query results.
    axis: correctness
    verify: json_file_schema
  - id: tables_queried_via_cli
    criterion: Database tables were listed through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: schema_queried_via_cli
    criterion: Table schema was queried through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: query_executed_via_cli
    criterion: Database query was executed through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
