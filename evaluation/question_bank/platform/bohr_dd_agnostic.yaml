version: v5
capability: data_diagnosis
domain: agnostic
questions:
- id: BDD_cleanup_plan_001_20260715
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent navigates file system to find large/old files and plans cleanup.
  human_prompt_seed: |
    利用 bohr-cli，储存快满了，帮我找找哪些文件又大又久没动过的，规划一下清理列表。不要直接删，先给我看方案。
    清理规划保存到 `c1_cleanup_plan.json`，列出大文件及处理建议。JSON 顶层使用 `files`；`files` 为数组，每项含 `size_mb` 和 `recommendation`，`recommendation` 取 `delete`、`keep` 或 `archive`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: c1_cleanup_plan.json
  - key: has_files
    value:
      filename: c1_cleanup_plan.json
      pattern: '"files"\s*:\s*\[\s*\{'
  - key: has_size
    value:
      filename: c1_cleanup_plan.json
      pattern: '"size_mb"\s*:\s*[\d.]'
  - key: has_recommendation
    value:
      filename: c1_cleanup_plan.json
      pattern: '"recommendation"\s*:\s*"(delete|keep|archive)"'
  - key: turn_budget
    value:
      max: 10
  - key: files_listed_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+file\s+\+?(list|stat)\b'
      min_matches: 1
  scoring_checklist:
  - id: artifact
    criterion: c1_cleanup_plan.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_files
    criterion: Files array populated with discovered files.
    axis: correctness
    verify: text_file_regex
  - id: has_size
    criterion: File sizes reported in MB.
    axis: correctness
    verify: text_file_regex
  - id: has_recommendation
    criterion: Each file has delete/keep/archive recommendation.
    axis: correctness
    verify: text_file_regex
  - id: files_listed_via_cli
    criterion: File list or stat was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

