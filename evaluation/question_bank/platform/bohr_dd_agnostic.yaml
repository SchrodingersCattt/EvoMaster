- id: BDD_kb_upload_search_008_20260715
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent handles filenames with spaces when uploading to knowledge base.
  human_prompt_seed: |
    把这篇文献传到知识库里去，然后搜一下里面有没有提到 bandgap 的数据。
    搜索结果保存到 `c8_kb_search.json`，格式：
    ```json
    {"kb_id": ..., "upload_success": true/false, "filename": "...", "search_results": [{"text": "...", "score": ...}]}
    ```
  tags:
  - bohr-cli
  data_files:
  - key: pdf_perovskite
    path: "data/bohr_cli/Fabrication and characterization of Nano  H2dabco  K ClO4 3  molecular Perovskite by ball milling.pdf"
    description: PDF with spaces in filename - tests path escaping.
  reference_answers:
  - key: artifact
    value: c8_kb_search.json
  - key: upload_success
    value:
      filename: c8_kb_search.json
      pattern: '"upload_success"\s*:\s*true'
  - key: has_kb_id
    value:
      filename: c8_kb_search.json
      pattern: '"kb_id"\s*:\s*\d+'
  - key: has_search_results
    value:
      filename: c8_kb_search.json
      pattern: '"search_results"\s*:\s*\['
  - key: has_filename_with_spaces
    value:
      filename: c8_kb_search.json
      pattern: Fabrication.*characterization|H2dabco
      flags: i
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: c8_kb_search.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: upload_success
    criterion: PDF uploaded successfully despite spaces in filename.
    axis: correctness
    verify: text_file_regex
  - id: has_kb_id
    criterion: Knowledge base ID recorded.
    axis: correctness
    verify: text_file_regex
  - id: has_search_results
    criterion: Search results array present.
    axis: correctness
    verify: text_file_regex
  - id: has_filename_with_spaces
    criterion: Filename with spaces correctly handled and recorded.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
