    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+(file\s+copy|job\s+(download|result))\b'
      min_matches: 1
  scoring_checklist:
  - id: artifact
    criterion: c3_transfer.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_transferred
    criterion: Transferred array populated.
    axis: correctness
    verify: text_file_regex
