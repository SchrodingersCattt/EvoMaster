- id: BDD_copy_results_003_20260715
  capability: data_diagnosis
  domain: agnostic
  scope: platform
  intent: Test agent downloads job results and copies to personal storage.
  human_prompt_seed: |
    看看最近完成的任务有没有结果文件，帮我拷到 personal 盘存着。
    操作记录保存到 `c3_transfer.json`，格式：
    ```json
    {"transferred": [{"job_id": ..., "source": "...", "destination": "personal/...", "success": true/false}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: c3_transfer.json
  - key: has_transferred
    value:
      filename: c3_transfer.json
      pattern: '"transferred"\s*:\s*\[\s*\{'
  - key: personal_path
    value:
      filename: c3_transfer.json
      tokens:
      - personal
  - key: has_success
    value:
      filename: c3_transfer.json
      pattern: '"success"\s*:\s*true'
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: artifact
    criterion: c3_transfer.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_transferred
    criterion: Transferred array populated.
    axis: correctness
    verify: text_file_regex
  - id: personal_path
    criterion: Destination is personal storage.
    axis: correctness
    verify: text_file_contains_all
  - id: has_success
    criterion: At least one successful transfer.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

