- id: PWO_dpa_head_case_001_20260523
  capability: workflow_orchestration
  domain: agnostic
  intent: Test whether agent uses the correct case-sensitive DPA head name when
    user specifies DPA-3.2-5M model. The head for DPA-3.2 is `OMat24` (capital M),
    distinct from DPA-3.1's `Omat24` (lowercase m).
  human_prompt_seed: |
    请使用 DPA-3.2-5M 模型对 MgO 做结构优化，输出提交配置 `opt_submit.json`。
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: submit_artifact
    value: opt_submit.json
  - key: must_dpa32
    value:
      filename: opt_submit.json
      pattern: DPA.?3\.?2
      flags: ''
  - key: no_wrong_head_case
    value:
      filename: opt_submit.json
      pattern: Omat24
      flags: ''
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: submit_artifact
    criterion: Agent writes `opt_submit.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_dpa32
    criterion: '[Platform] cmd references DPA-3.2 model.'
    axis: correctness
    verify: text_file_regex
  - id: no_wrong_head_case
    criterion: '[Platform] cmd does NOT use `Omat24` (lowercase m, which is the DPA-3.1
      head name). For DPA-3.2-5M, either omit --head (default is OMat24) or explicitly
      write `OMat24` (capital M). Writing `Omat24` will cause a head-not-found error.'
    axis: correctness
    verify: text_file_regex_absent
    weight: 2.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PWO_gpumd_phonon_001_20260523
  capability: workflow_orchestration
  domain: agnostic
  intent: End-to-end GPUMD phonon dispersion for Si using NEP potential. Agent must
    know GPUMD requires GPU node and select correct machine type without being told.
  human_prompt_seed: |
    使用 GPUMD 计算 Si 金刚石结构的声子色散关系。

    要求：
    - 使用 NEP 势函数（Si 体系，从 GPUMD 官方 examples 或已有资源获取）
    - 提交到 Bohrium 运行
    - 报告 Gamma 点光学支频率
    - 结果写入 `phonon_result.json`：`{"gamma_optical_THz": ..., "method": "gpumd"}`
  tags:
  - eng_gpumd
  data_files: []
  reference_answers:
  - key: output_artifact
    value: phonon_result.json
  - key: gamma_optical_range
    value:
      filename: phonon_result.json
      key: gamma_optical_THz
      min: 14.0
      max: 17.0
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value:
      max: 900000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `phonon_result.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: gamma_optical_range
    criterion: '[Must] Si Gamma-point optical branch frequency is within 14-17 THz
      (experimental ~15.5 THz). Values far outside indicate wrong potential, wrong
      supercell, or incorrect post-processing. If agent submitted to CPU node,
      GPUMD will fail silently (no log) and no result will be produced.'
    axis: correctness
    verify: json_file_numeric_range
    weight: 3.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock time within budget.
    axis: efficiency
    verify: duration_budget
