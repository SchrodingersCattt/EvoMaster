    weight: 2.0
  - id: dispersion_plot_or_data
    criterion: Agent produces a phonon dispersion plot (PNG/PDF) or structured data
      file showing frequencies along the G-X-K-G path.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock time within budget.
    axis: efficiency
    verify: duration_budget
- id: PWO_qe_scf_001_20260524
  capability: workflow_orchestration
  domain: agnostic
  priority: P1
  intent: End-to-end QE pw.x SCF workflow for MgO with platform submission and
    result retrieval. Agent must produce correct pw.x input, submit to Bohrium
    (not run locally), wait for completion, and report total energy. From real
    trajectory where agents repeatedly tried to run pw.x locally.
  human_prompt_seed: '请帮我对 MgO 岩盐结构做一次 Quantum ESPRESSO pw.x 的 SCF 单点能计算。
    结构参数：Fm-3m, a=4.21 Å, Mg 在 (0,0,0), O 在 (0.5,0.5,0.5)。
    使用 PBE 泛函、ecutwfc=60 Ry、4×4×4 k 点网格。帮我跑一下看看总能是多少。'
  tags:
  - eng_qe
  data_files: []
  reference_answers:
  - key: input_artifact
    value:
      filename: '*.in'
      glob: true
  - key: must_scf_calc
    value:
      filename: '*.in'
      pattern: (?im)calculation\s*=\s*['"]?scf['"]?
      flags: im
      glob: true
  - key: must_ecutwfc
    value:
      filename: '*.in'
      pattern: (?im)ecutwfc\s*=\s*60
      flags: im
      glob: true
  - key: must_pbe
    value:
      filename: '*.in'
      pattern: (?im)input_dft\s*=\s*['"]?pbe['"]?
      flags: im
      glob: true
  - key: must_nat_2
    value:
      filename: '*.in'
      pattern: (?im)nat\s*=\s*2
      flags: im
      glob: true
  - key: must_ntyp_2
    value:
