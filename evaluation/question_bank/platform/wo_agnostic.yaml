  - key: must_model_mace
    value:
      filename: opt_submit.json
      pattern: MACE-MP-0|mace
      flags: i
  - key: must_optimize_script
    value:
      filename: opt_submit.json
      pattern: optimize_structure
      flags: ''
  - key: must_image_mlips
    value:
      filename: opt_submit.json
      pattern: mlips
      flags: i
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: submit_artifact
    criterion: opt_submit.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_model_mace
    criterion: '[Platform] cmd references MACE-MP-0 model by name.'
    axis: correctness
    verify: text_file_regex
  - id: must_optimize_script
    criterion: '[Platform] cmd uses optimize_structure script from mlips skill.'
    axis: correctness
    verify: text_file_regex
  - id: must_image_mlips
    criterion: '[Platform] image references the multi-family mlips image (not the
      DPA-only image).'
    axis: correctness
    verify: text_file_regex
  - id: no_download_attempt
    criterion: Agent did NOT attempt to manually download the MACE model file from
      GitHub or other URLs. It should know that MACE-MP-0 is a known model name supported
      directly by the mlips skill scripts.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: PWO_elec_009_20260521
  capability: workflow_orchestration
  domain: agnostic
  intent: Validate whether the agent can prepare ABACUS INPUT and Bohrium submit JSON
    for an Al2O3 Bader workflow without running calculations.
  human_prompt_seed: 对 Al₂O₃ 准备 ABACUS Bader 电荷分析所需文件和 Bohrium 提交配置（文件名 `al2o3_bader_submit.json`）。本题只检验输入文件与提交
    JSON，不要投递或执行计算。
  tags:
  - eng_abacus
  data_files: []
  reference_answers:
  - key: input_artifact
    value: INPUT
  - key: must_input_core
    value:
      filename: INPUT
      must_cover:
      - calculation scf
      - out_chg 1
  - key: submit_json_artifact
    value: al2o3_bader_submit.json
  - key: must_submit_json_image
    value:
      filename: al2o3_bader_submit.json
      pattern: '"image"\s*:\s*"registry\.dp\.tech/dptech/dp/native/hub/mrdic2/abacusp:1\.0\.3-1778742780"'
      flags: i
  - key: must_bader_cmd
    value:
      filename:
      - al2o3_bader_submit.json
      - run.sh
      tokens:
      - abacus
      - bader
      flags: i
  - key: must_bader_core_ref
    value:
      filename:
      - al2o3_bader_submit.json
      - run.sh
      tokens:
      - -ref
      flags: i
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes ABACUS `INPUT` file to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_input_core
    criterion: '[Must] INPUT contains ABACUS Bader prerequisite keys (`calculation
      scf`, `out_chg 1`).'
    axis: correctness
    verify: llm_binary_judge
  - id: submit_json_artifact
    criterion: Agent writes Bohrium submit config `al2o3_bader_submit.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_submit_json_image
    criterion: '[Must] submit JSON includes required Bohrium image.'
    axis: correctness
    verify: text_file_regex
  - id: must_bader_cmd
    criterion: '[Must] ABACUS + Bader execution present in cmd or run.sh.'
    axis: correctness
    verify: text_file_contains_all
  - id: must_bader_core_ref
    criterion: '[Must] Core-charge reference (-ref flag) present in cmd or run.sh.'
    axis: correctness
    verify: text_file_contains_all
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
