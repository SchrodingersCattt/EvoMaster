    沿 Γ-X-L-Γ 高对称路径计算能带，报告带隙类型和带隙值。\n"
  tags:
  - eng_qe
  source_session: 2f6940567d1e4d3e936c253e3279afd5
  data_files: []
  reference_answers:
  - key: gap_type
    value: indirect
  - key: gap_value_eV
    value: 0.55
    tolerance: 0.3
    description: DFT-PBE Si band gap is ~0.5-0.7 eV (underestimates expt 1.12 eV).
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 15000
