      appropriate settings for force constant calculation.'
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: uses_phonopy
    criterion: '[Must] Agent uses phonopy (finite displacement method) to generate
      displaced structures and post-process force constants into phonon dispersion.'
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: bohrium_submission
    criterion: '[Platform] Agent submits ABACUS force calculation jobs to Bohrium
      using bohrium-job skill with an ABACUS image.'
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: gamma_optical_frequency
    criterion: '[Must] Agent reports Si Gamma-point optical frequency. Expected value
      is approximately 15-16 THz (experimental 15.5 THz). Values outside 13-18 THz
      indicate a problem with the calculation or post-processing.'
