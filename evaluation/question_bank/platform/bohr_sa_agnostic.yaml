- id: BSA_tools_docking_012_20260715_v2
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent discovers docking tools and grounds an onboarding guide in one tool's platform details.
  human_prompt_seed: |
    利用 bohr-cli，我想做小分子和蛋白的 docking，帮我在平台上找几个合适的工具，选一个介绍清楚它能做什么、当前版本以及怎么开始用。只查资料，不要创建资源。
    把结果保存到工作区根目录的 `a12_tools.json`，记录搜索关键词、候选工具列表和选定工具的详细信息。JSON 顶层使用 `query`、`candidates` 和 `selected_tool`；`candidates` 为数组，每项含 `name`、`tool_unique_key` 和 `repo_url`；`selected_tool` 包含 `name`、`tool_unique_key`、`version`、`description`、`usage_entry_command`、`help_urls` 和 `usage_steps`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a12_tools.json
    workspace_resolve: root
  - key: tools_schema
    value:
      filename: a12_tools.json
      schema:
        type: object
        required:
        - query
        - candidates
        - selected_tool
        properties:
          query:
            type: string
            pattern: (?i:dock|对接)
          candidates:
            type: array
            minItems: 3
            uniqueItems: true
            items:
              type: object
              required:
              - name
