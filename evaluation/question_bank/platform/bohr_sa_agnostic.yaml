- id: BSA_lkm_deep_chain_013_20260717
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent uses LKM deep chain — search, graph, and reasoning in sequence.
  human_prompt_seed: |
    利用 bohr-cli，帮我调研一下"钙钛矿太阳能电池的离子迁移机制"：先检索相关文献，选一篇核心论文，读取它在知识图谱中的关联，再查询相关推理链看看有什么延伸结论。
    把完整的调研链路保存到 `a13_lkm_chain.json`，记录检索结果、选中的论文、图谱关联和推理链内容。JSON 顶层使用 `search_results`、`selected_paper`、`graph_relations` 和 `reasoning_chain`；`selected_paper` 包含 `title`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a13_lkm_chain.json
  - key: chain_schema
    value:
      filename: a13_lkm_chain.json
      schema:
        type: object
        required:
        - search_results
        - selected_paper
        - graph_relations
        - reasoning_chain
        properties:
          search_results:
            type: array
            minItems: 1
          selected_paper:
            type: object
            required:
            - title
            properties:
              title:
                type: string
                minLength: 1
          graph_relations:
            type: array
            minItems: 1
          reasoning_chain:
            oneOf:
            - type: array
              minItems: 1
            - type: string
              minLength: 10
  - key: paper_searched_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+paper\s+\+?search\b'
      min_matches: 1
  - key: lkm_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+lkm\s+\+?(graph|reasoning)\b'
      min_matches: 1
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: artifact
    criterion: a13_lkm_chain.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: chain_schema
    criterion: Records search results, selected paper, graph relations, and reasoning chain.
    axis: correctness
    verify: json_file_schema
  - id: paper_searched_via_cli
    criterion: Paper search was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: lkm_queried_via_cli
    criterion: LKM graph or reasoning was queried through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
