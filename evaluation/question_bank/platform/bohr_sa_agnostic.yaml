version: v5
capability: scientific_analysis
domain: agnostic
questions:
- id: BSA_paper_mn_invar_001_20260715
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent can use bohr paper search with English keywords and present structured results.
  human_prompt_seed: |
    利用 bohr-cli，看一眼文献到底有没有人做过Mn掺杂的Invar合金？效果怎么样？
    把搜索结果保存到 `a1_result.json`，包含论文列表和研究现状总结。JSON 中论文列表每项含 `title`，研究现状总结记为 `summary`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a1_result.json
  - key: has_papers
    value:
      filename: a1_result.json
      pattern: '"title"\s*:\s*"[^"]+"'
  - key: english_keyword
    value:
      filename: a1_result.json
      pattern: Invar|invar|Fe-Ni|FeNi
      flags: i
  - key: has_summary
    value:
      filename: a1_result.json
      pattern: '"summary"\s*:\s*"[^"]{20,}"'
  - key: turn_budget
    value:
      max: 8
  - key: paper_searched_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+paper\s+\+?search\b'
      min_matches: 1
  scoring_checklist:
  - id: artifact
    criterion: a1_result.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_papers
    criterion: Result contains at least one paper entry with title.
    axis: correctness
    verify: text_file_regex
  - id: english_keyword
    criterion: Search used English keywords related to Invar alloy.
    axis: grounding
    verify: text_file_regex
  - id: has_summary
    criterion: Summary field is non-trivial (>=20 chars).
    axis: correctness
    verify: text_file_regex
  - id: paper_searched_via_cli
    criterion: Paper search was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BSA_paper_invar_mech_002_20260715
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent can synthesize multiple literature sources on Invar effect mechanisms.
  human_prompt_seed: |
    利用 bohr-cli，Invar合金的低热膨胀机理都有什么机理？文献都是怎么说的？
    整理成 `a2_mechanisms.md`，每种机理一个二级标题（## 机理名称），下面写解释和对应文献。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a2_mechanisms.md
  - key: multiple_sections
    value:
      filename: a2_mechanisms.md
      pattern: (?m)^## .+
  - key: mechanism_keyword
    value:
      filename: a2_mechanisms.md
      pattern: magn|Weiss|体积效应|volume|2γ|two-state
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: paper_searched_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+paper\s+\+?search\b'
      min_matches: 1
  scoring_checklist:
  - id: artifact
    criterion: a2_mechanisms.md written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: multiple_sections
    criterion: File has at least 2 second-level headings (## ...).
    axis: correctness
    verify: text_file_regex
  - id: mechanism_keyword
    criterion: Content mentions known Invar mechanisms (magnetic, Weiss, volume effect).
    axis: correctness
    verify: text_file_regex
  - id: paper_searched_via_cli
    criterion: Paper search was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BSA_pdf_crystal_003_20260715
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent can extract crystallographic data from PDFs using bohr pdf parse.
  human_prompt_seed: |
    利用 bohr-cli，这两篇文献的晶体学数据整理成表格，要求包含化学式、空间群、晶胞参数。
    输出为 `a3_crystal_data.json`，记录每篇文献中提取到的化学式、空间群和晶胞参数。JSON 中每篇文献记录含 `paper`、`formula`、`space_group` 和 `cell_params`。
  tags:
  - bohr-cli
  data_files:
  - key: pdf_conform1
    path: data/bohr_cli/conform_074503_1_online.pdf
    description: Crystallographic paper on organic-inorganic hybrid phase transition.
  - key: pdf_conform2
    path: data/bohr_cli/conform_han-et-al-2017.pdf
    description: Lead-free hybrid material with chair-to-boat phase transition.
  reference_answers:
  - key: artifact
    value: a3_crystal_data.json
  - key: has_entries
    value:
      filename: a3_crystal_data.json
      pattern: '"paper"'
  - key: has_space_group
    value:
      filename: a3_crystal_data.json
      pattern: '"space_group"\s*:\s*"[^"]+"'
  - key: has_formula
    value:
      filename: a3_crystal_data.json
      pattern: '"formula"\s*:\s*"[^"]+"'
  - key: has_cell
    value:
      filename: a3_crystal_data.json
      pattern: '"cell_params"\s*:\s*"[^"]+"'
  - key: turn_budget
    value:
      max: 12
  - key: pdf_parsed_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+pdf\s+\+?parse\b'
      min_matches: 1
  scoring_checklist:
  - id: artifact
    criterion: a3_crystal_data.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_entries
    criterion: JSON contains at least one paper entry.
    axis: correctness
    verify: text_file_regex
  - id: has_space_group
    criterion: Space group field extracted and non-empty.
    axis: correctness
    verify: text_file_regex
  - id: has_formula
    criterion: Chemical formula field extracted and non-empty.
    axis: correctness
    verify: text_file_regex
  - id: has_cell
    criterion: Cell parameters extracted.
    axis: correctness
    verify: text_file_regex
  - id: pdf_parsed_via_cli
    criterion: PDF parse was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BSA_scholar_compare_004_20260715
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent can search and compare two scholars using bohr scholar.
  human_prompt_seed: |
    利用 bohr-cli，帮我查一下 Jörg Behler 和 Michele Parrinello 两位学者的合作关系和各自研究重点有什么区别。
    输出为 `a4_scholars.json`，记录两位学者的背景和研究重点对比。JSON 中每位学者的研究重点用 `research_focus`，整体对比用 `comparison`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a4_scholars.json
  - key: both_names
    value:
      filename: a4_scholars.json
      tokens:
      - Behler
      - Parrinello
  - key: has_focus
    value:
      filename: a4_scholars.json
      pattern: '"research_focus"\s*:\s*\['
  - key: has_comparison
    value:
      filename: a4_scholars.json
      pattern: '"comparison"\s*:\s*"[^"]{50,}"'
  - key: turn_budget
    value:
      max: 8
  - key: scholars_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+scholar\s+\+?(search|get)\b'
      min_matches: 2
  scoring_checklist:
  - id: artifact
    criterion: a4_scholars.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: both_names
    criterion: Both scholar names appear in the file.
    axis: correctness
    verify: text_file_contains_all
  - id: has_focus
    criterion: research_focus array present.
    axis: correctness
    verify: text_file_regex
  - id: has_comparison
    criterion: Comparison field is substantive (>=50 chars).
    axis: correctness
    verify: text_file_regex
  - id: scholars_queried_via_cli
    criterion: Scholar search or get was invoked through bohr-cli at least twice.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BSA_roadmap_topo_005_20260715_v2
  capability: scientific_analysis
  domain: agnostic
  scope: platform
  intent: Test agent can combine wiki+scholar+paper for a learning roadmap.
  human_prompt_seed: |
    利用 bohr-cli，我现在要入门"拓扑绝缘体表面态"，给我一个入门路线图：核心概念 → 关键人物 → 推荐论文。
    输出为 `a5_roadmap.json`，记录核心概念、关键人物及其贡献、推荐论文及推荐理由。JSON 顶层使用 `concepts`、`key_figures` 和 `papers`；`key_figures` 为数组，每项含 `name` 和 `contribution`；`papers` 为数组，每项含 `title`、`year` 和 `why`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: a5_roadmap.json
  - key: roadmap_schema
    value:
      filename: a5_roadmap.json
      schema:
        type: object
        required:
        - concepts
        - key_figures
        - papers
        properties:
          concepts:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
          key_figures:
            type: array
            minItems: 1
            items:
              type: object
              required:
              - name
              - contribution
              properties:
                name:
                  type: string
                  minLength: 1
                contribution:
                  type: string
                  minLength: 1
          papers:
            type: array
            minItems: 1
            items:
              type: object
              required:
              - title
              - year
              - why
              properties:
                title:
                  type: string
                  minLength: 1
                year:
                  type: integer
                why:
                  type: string
                  minLength: 1
  - key: topo_keyword
    value:
      filename: a5_roadmap.json
      pattern: topological|surface.state|拓扑|表面态
      flags: i
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: a5_roadmap.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: roadmap_schema
    criterion: Roadmap JSON contains non-empty concepts, key figures with contributions, and papers with title, year, and rationale.
    axis: correctness
    verify: json_file_schema
  - id: topo_keyword
    criterion: Content mentions topological/surface state keywords.
    axis: grounding
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

