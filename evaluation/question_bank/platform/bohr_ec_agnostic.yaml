version: v5
capability: execution_contract
domain: agnostic
questions:
- id: BEC_wrong_image_001_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent self-heals from incorrect image name by searching and resubmitting.
  human_prompt_seed: |
    用镜像名 "dptech/deepmd-kit" 提个任务试试（命令 `dp --version`，机型 `c2_m4_cpu`），报错的话帮我排查修好重新提。
    排查过程记录到 `e1_troubleshoot.json`，格式：
    ```json
    {"initial_image": "dptech/deepmd-kit", "error_message": "...", "correct_image": "registry.dp.tech/...", "resubmit_job_id": ...}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e1_troubleshoot.json
  - key: wrong_image_recorded
    value:
      filename: e1_troubleshoot.json
      pattern: '"initial_image"\s*:\s*"dptech/deepmd-kit"'
  - key: has_error
    value:
      filename: e1_troubleshoot.json
      pattern: '"error_message"\s*:\s*"[^"]+"'
  - key: correct_image_full
    value:
      filename: e1_troubleshoot.json
      pattern: '"correct_image"\s*:\s*"registry\.dp\.tech/'
  - key: has_resubmit_id
    value:
      filename: e1_troubleshoot.json
      pattern: '"resubmit_job_id"\s*:\s*\d+'
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: e1_troubleshoot.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: wrong_image_recorded
    criterion: Records the initially wrong image name.
    axis: correctness
    verify: text_file_regex
  - id: has_error
    criterion: Error message captured from failed submission.
    axis: correctness
    verify: text_file_regex
  - id: correct_image_full
    criterion: Corrected image uses full registry.dp.tech/ path.
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: has_resubmit_id
    criterion: Successfully resubmitted with correct image (real job ID).
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BEC_node_status_002_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent assesses node health and restarts abnormal ones without deleting.
  priority: P1
  human_prompt_seed: |
    看看我有没有节点，状态都正常吗？有异常的帮我重启一下。
    状态报告保存到 `e2_nodes.json`，格式：
    ```json
    {"nodes": [{"id": ..., "name": "...", "status": ..., "status_text": "...", "action_taken": "none|restart"}]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e2_nodes.json
  - key: has_nodes
    value:
      filename: e2_nodes.json
      pattern: '"nodes"\s*:\s*\[\s*\{'
  - key: has_status
    value:
      filename: e2_nodes.json
      pattern: '"status"\s*:\s*-?\d'
  - key: has_action
    value:
      filename: e2_nodes.json
      pattern: '"action_taken"\s*:\s*"(none|restart)"'
  - key: turn_budget
    value:
      max: 8
  scoring_checklist:
  - id: artifact
    criterion: e2_nodes.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_nodes
    criterion: Node list populated.
    axis: correctness
    verify: text_file_regex
  - id: has_status
    criterion: Status code reported for each node.
    axis: correctness
    verify: text_file_regex
  - id: has_action
    criterion: Action taken (none or restart) recorded.
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

