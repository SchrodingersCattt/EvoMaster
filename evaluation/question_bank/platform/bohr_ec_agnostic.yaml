  - bohr-cli
  reference_answers:
  - key: artifact
    value: e9_stats.json
  - key: stats_schema
    value:
      filename: e9_stats.json
      schema:
        type: object
        required:
        - total_completed_jobs
        - total_machine_hours
        - invalid_query_error
        properties:
          total_completed_jobs:
            type: integer
            minimum: 0
          total_machine_hours:
            type: number
            minimum: 0
          invalid_query_error:
            type: string
            minLength: 1
  - key: jobs_listed_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+job\s+\+?list\b'
      min_matches: 1
  - key: invalid_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+job\s+\+?describe\b(?=[^\n]*99999999)'
      min_matches: 1
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: artifact
    criterion: e9_stats.json written to workspace.
