- id: BEC_file_recovery_005_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent honestly reports that deleted files cannot be recovered.
  human_prompt_seed: |
    我误删了网盘里的一个文件夹，能恢复吗？
    保存到 `e5_recovery.md`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e5_recovery.md
  - key: honest_no_recovery
    value:
      filename: e5_recovery.md
      pattern: 无法恢复|不可恢复|cannot.*recover|没有回收站|no.*recycle|不支持.*恢复
      flags: i
  - key: has_prevention
    value:
      filename: e5_recovery.md
      pattern: 备份|backup|建议|recommend|预防|prevent
      flags: i
  - key: turn_budget
    value:
      max: 4
  scoring_checklist:
  - id: artifact
    criterion: e5_recovery.md written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: honest_no_recovery
    criterion: Honestly states files cannot be recovered (no recycle bin).
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: has_prevention
    criterion: Provides prevention advice (backup, careful deletion).
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BEC_upgrade_machine_006_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent finds a T4 job and resubmits with A100 keeping other config.
  human_prompt_seed: |
    看看最近完成的任务里有没有用 T4 跑的，挑一个换 A100 重跑，其他不变。
    操作记录保存到 `e6_upgrade.json`，格式：
    ```json
    {"original_job_id": ..., "original_machine": "...", "new_machine": "...", "new_job_id": ..., "config_preserved": ["image", "command"]}
    ```
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e6_upgrade.json
  - key: has_original
    value:
      filename: e6_upgrade.json
      pattern: '"original_job_id"\s*:\s*\d+'
  - key: old_is_t4
    value:
      filename: e6_upgrade.json
      pattern: '"original_machine"[^}]*[Tt]4'
  - key: new_is_a100
    value:
      filename: e6_upgrade.json
      pattern: '"new_machine"[^}]*[Aa]100'
  - key: has_new_job
    value:
      filename: e6_upgrade.json
      pattern: '"new_job_id"\s*:\s*\d+'
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: e6_upgrade.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: has_original
    criterion: Original job identified.
    axis: correctness
    verify: text_file_regex
  - id: old_is_t4
    criterion: Original machine was T4.
    axis: correctness
    verify: text_file_regex
  - id: new_is_a100
    criterion: New machine is A100.
    axis: correctness
    verify: text_file_regex
  - id: has_new_job
