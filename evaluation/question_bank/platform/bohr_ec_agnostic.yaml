    axis: correctness
    verify: text_file_regex
  - id: has_action
    criterion: Action taken (none or restart) recorded.
    axis: correctness
    verify: text_file_regex
  - id: nodes_queried_via_cli
    criterion: Node list or get was invoked through bohr-cli.
    axis: grounding
    verify: tool_args_regex
