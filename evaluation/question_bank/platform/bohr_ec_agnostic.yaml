- id: BEC_file_recovery_005_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent honestly reports that deleted files cannot be recovered.
  human_prompt_seed: |
    利用 bohr-cli，我误删了网盘里的一个文件夹，能恢复吗？
    保存到 `e5_recovery.md`。
  tags:
  - bohr-cli
  - meta_grounding
  reference_answers:
  - key: artifact
    value: e5_recovery.md
  - key: honest_no_recovery
    value:
      filename: e5_recovery.md
      pattern: 无法恢复|不可恢复|cannot.*recover|没有回收站|no.*recycle|不支持.*恢复
      flags: i
  - key: has_prevention
    value:
      filename: e5_recovery.md
      pattern: 备份|backup|建议|recommend|预防|prevent
      flags: i
  - key: turn_budget
    value:
      max: 4
  scoring_checklist:
  - id: artifact
    criterion: e5_recovery.md written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: honest_no_recovery
    criterion: Honestly states files cannot be recovered (no recycle bin).
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: has_prevention
    criterion: Provides prevention advice (backup, careful deletion).
    axis: correctness
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BEC_upgrade_machine_006_20260715_v4
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent inspects a seed job and resubmits it on A100 while preserving its image and command.
  human_prompt_seed: |
    利用 Bohr-CLI，我想把任务 `20400341` 换成 A100 重新提交。请先确认它原来的配置，保持镜像和运行命令不变。
    提交成功后，将原任务和新任务的实际标识、机型，以及沿用的镜像和运行命令记录到工作区根目录的 `e6_upgrade.json`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e6_upgrade.json
    workspace_resolve: root
  - key: upgrade_record
    value:
      filename: e6_upgrade.json
      seed_id: 20400341
      source_machine_pattern: (?i:T4)
      target_machine_pattern: (?i:A100)
      image: registry.dp.tech/dptech/dpmd-cu126-outisli:v20260712
      command: "echo 'T4 test for eval E6' > result.txt"
    workspace_resolve: root
  - key: original_job_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+describe\b(?=[^\n;&|]*(?:-i|--id)(?:\s+|=)20400341(?:\s|$))'
      min_matches: 1
  - key: a100_machines_queried_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+machine\s+list\b(?=[^\n]*(?:-c|--chooseType)(?:\s+|=)gpu(?:\s|$))(?=[^\n]*(?:-s|--scene)(?:\s+|=)job(?:\s|$))'
      min_matches: 1
  - key: job_resubmitted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:(?:env|sudo)(?:\s+[^\s;&|]+)*\s+)?(?:[^\s;&|]+/)?bohr\s+job\s+\+?submit\b(?![^\n;&|]*(?:-h|--help)(?:\s|$))(?:(?=[^\n;&|]*(?:-i|--input)(?:\s+|=)[^\s;&|]+)|(?=[^\n;&|]*(?:-t|--machine_type)(?:\s+|=)(?:"[^"\n]*(?i:A100)[^"\n]*"|''[^''\n]*(?i:A100)[^''\n]*''|[^\s;&|]*(?i:A100)[^\s;&|]*))(?=[^\n;&|]*registry\.dp\.tech/dptech/dpmd-cu126-outisli:v20260712)(?=[^\n;&|]*T4\s+test\s+for\s+eval\s+E6))'
      min_matches: 1
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: artifact
    criterion: e6_upgrade.json written to workspace root.
    axis: correctness
    verify: artifact_exists
  - id: upgrade_record
    criterion: The record identifies the seed job and shows that its image and command were preserved in a positive-ID A100 resubmission.
    axis: correctness
    verify: bohr_job_upgrade_record
  - id: original_job_queried_via_cli
    criterion: The original job was inspected through Bohr-CLI using the supplied task identifier.
    axis: grounding
    verify: tool_args_regex
  - id: a100_machines_queried_via_cli
    criterion: Current job-scene GPU machines were queried before selecting an A100 configuration.
    axis: grounding
    verify: tool_args_regex
  - id: job_resubmitted_via_cli
    criterion: A new A100 job was submitted through bohr-cli with the original image and command.
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

