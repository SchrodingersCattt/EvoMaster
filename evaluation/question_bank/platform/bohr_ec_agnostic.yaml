questions:
- id: BEC_wrong_image_001_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent self-heals from incorrect image name by searching and resubmitting.
  human_prompt_seed: |
    利用 bohr-cli，用镜像名 "dptech/deepmd-kit" 提个任务试试（命令 `dp --version`，机型 `c2_m4_cpu`），报错的话帮我排查修好重新提。
    排查过程记录到 `e1_troubleshoot.json`，包含最初用的镜像名、报错信息、修正后的镜像和重新提交的任务 ID。JSON 顶层使用 `initial_image`、`error_message`、`correct_image` 和 `resubmit_job_id`。
  tags:
  - bohr-cli
  reference_answers:
  - key: artifact
    value: e1_troubleshoot.json
  - key: wrong_image_recorded
    value:
      filename: e1_troubleshoot.json
      pattern: '"initial_image"\s*:\s*"dptech/deepmd-kit"'
  - key: has_error
    value:
      filename: e1_troubleshoot.json
      pattern: '"error_message"\s*:\s*"[^"]+"'
  - key: correct_image_full
    value:
      filename: e1_troubleshoot.json
      pattern: '"correct_image"\s*:\s*"registry\.dp\.tech/'
  - key: has_resubmit_id
    value:
      filename: e1_troubleshoot.json
      pattern: '"resubmit_job_id"\s*:\s*\d+'
  - key: image_searched_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+image\s+\+?search\b'
      min_matches: 1
  - key: job_submitted_via_cli
    tool_name: Bash
    tool_arg: command
    value:
      pattern: '(?:^|[\n;&|]\s*)(?:[^\s;&|]+/)?bohr\s+job\s+\+?submit\b'
      min_matches: 2
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: artifact
    criterion: e1_troubleshoot.json written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: wrong_image_recorded
    criterion: Records the initially wrong image name.
    axis: correctness
    verify: text_file_regex
  - id: has_error
    criterion: Error message captured from failed submission.
    axis: correctness
    verify: text_file_regex
  - id: correct_image_full
    criterion: Corrected image uses full registry.dp.tech/ path.
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: has_resubmit_id
    criterion: Successfully resubmitted with correct image (real job ID).
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: image_searched_via_cli
    criterion: Image was searched through bohr-cli.
    axis: grounding
    verify: tool_args_regex
  - id: job_submitted_via_cli
    criterion: Job was submitted through bohr-cli at least twice (failed + retry).
    axis: grounding
    verify: tool_args_regex
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

- id: BEC_node_status_002_20260715
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent assesses node health and restarts abnormal ones without deleting.
  priority: P1
  human_prompt_seed: |
    利用 bohr-cli，看看我有没有节点，状态都正常吗？有异常的帮我重启一下。
    状态报告保存到 `e2_nodes.json`，记录每个节点的 ID、状态和是否执行了操作。JSON 顶层使用 `nodes`；`nodes` 为数组，每项含 `status` 和 `action_taken`；`status` 用平台返回的数字状态码，`action_taken` 取 `none` 或 `restart`。
