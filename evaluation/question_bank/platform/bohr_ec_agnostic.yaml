- id: BEC_pagination_recovery_009_20260717
  capability: execution_contract
  domain: agnostic
  scope: platform
  intent: Test agent handles pagination and recovers from an invalid resource query to complete the task.
  human_prompt_seed: |
    利用 bohr-cli，帮我统计一下我在平台上所有已完成任务的总数和总消耗机时，先试着查一下任务ID 99999999 的详情作为对照，查不到的话跳过继续。
    结果保存到 `e9_stats.json`，记录总任务数、总机时、以及那个无效查询的错误信息。JSON 顶层使用 `total_completed_jobs`、`total_machine_hours` 和 `invalid_query_error`。
