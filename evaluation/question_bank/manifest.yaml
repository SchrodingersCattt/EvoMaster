# manifest.yaml — MATTER v5 Question Bank Registry
# Lists all MCP tools referenced by any question, plus bank file index.
version: "v5"

tools:
  # --- Structure database (MCP mat_struct_db) ---
  mat_struct_db_fetch_structures_from_db:
    server: "mat_struct_db"
    category: "structure_retrieval"

  # --- Structure construction (MCP mat_sg) ---
  mat_sg_generate_ordered_replicas:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_build_bulk_structure_by_template:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_build_bulk_structure_by_wyckoff:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_build_molecule_structures_from_smiles:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_build_surface_slab:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_build_surface_interface:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_add_hydrogens:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_make_defect_structure:
    server: "mat_sg"
    category: "structure_construction"
  mat_sg_make_amorphous_structure:
    server: "mat_sg"
    category: "structure_construction"

  # --- DPA potential optimizer / MD (MCP mat_dpa) ---
  mat_dpa_submit_optimize_structure:
    server: "mat_dpa"
    category: "calculation_execution"
  mat_dpa_submit_md:
    server: "mat_dpa"
    category: "calculation_execution"

  # --- Bash execution (bohrium-job skill, scripts) ---
  execute_bash:
    server: "builtin"
    category: "script_execution"

banks:
  - path: "batch_processing/bp_struct.yaml"
    capability: "batch_processing"
    questions: 5

  - path: "data_diagnosis/dd_general.yaml"
    capability: "data_diagnosis"
    questions: 5

  - path: "data_fitting/df_mech.yaml"
