  - path: "data_fitting/df_elec.yaml"
    capability: "property_prediction"
    questions: 1

  - path: "structure_construction/sc_struct.yaml"
    capability: "structure_construction"
    questions: 9

  - path: "workflow_orchestration/wo_mech.yaml"
    capability: "workflow_orchestration"
    questions: 3

  - path: "workflow_orchestration/wo_struct.yaml"
    capability: "workflow_orchestration"
    questions: 2

  - path: "workflow_orchestration/wo_elec.yaml"
    capability: "workflow_orchestration"
    questions: 3

  - path: "workflow_orchestration/wo_kinetic.yaml"
    capability: "workflow_orchestration"
