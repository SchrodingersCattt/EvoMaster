    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file fom_result.json exists and is valid JSON.'
  - id: contains_fom_value
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] The output file contains the figure of merit value.'
  - id: contains_band_gap
