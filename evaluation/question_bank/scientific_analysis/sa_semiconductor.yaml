      max: 25
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_json
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file agnr_three_family.json exists and is valid JSON.'
  - id: has_required_keys
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] JSON contains entries for Na = 12, 13, and 14 with their family classification
      (3p, 3p+1, 3p+2) and computed band gaps.'
  - id: gap_12agnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Band gap for 12-AGNR (3p, p=4) is between 0.3 and 1.2 eV (expected: ~0.7-0.8
      eV from Eq. 1).'
  - id: gap_13agnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Band gap for 13-AGNR (3p+1, p=4) is between 0.5 and 1.5 eV (expected: ~1.0-1.1
      eV from Eq. 1).'
  - id: gap_14agnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Band gap for 14-AGNR (3p+2, p=4) is between 0.01 and 0.5 eV (expected: ~0.05-0.15
      eV from Eq. 1, much smaller than the other two families).'
  - id: hierarchy_correct
