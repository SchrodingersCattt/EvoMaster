      checks:
      - key: band_gap
        max: 3.2
        min: 2.5
        expected: 2.83
        tolerance: 0.3
        allow_missing_key: false
      filename: fom_result.json
  - key: grounding_source
    value:
      filename: fom_result.json
  - key: turn_budget
    value:
      max: 25
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 100000
  scoring_checklist:
