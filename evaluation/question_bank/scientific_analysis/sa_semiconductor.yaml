    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] The FOM falls within [490, 530], consistent with Eg=2.83 × ε=180.89 ≈ 511.92
      from the paper.'
  - id: numeric_band_gap
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] The band gap falls within [2.5, 3.2] eV, consistent with the paper-reported
      2.83 eV.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The answer is grounded in the source paper''s FOM definition and reported values
      for mp-1226157.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Completion within 25 turns.'
