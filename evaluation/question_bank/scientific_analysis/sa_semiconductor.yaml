questions:
- id: WO_general_perov_007_20260417
  capability: scientific_analysis
  domain: semiconductor
  intent: Query high-efficiency perovskite additives and produce recommendation plus a proposal draft based on predicted performance.
  human_prompt_seed: '请围绕“高效率（>26%）钙钛矿添加剂设计”完成一份推荐与提案。

    请输出： 1) `perovskite_additive_candidates.json`：至少包含 `smiles`, `predicted_effect`, `selection_reason`, `similar_formulation_hint`；
    2) `perovskite_additive_proposal.md`：基于最佳候选，给出研究目标、验证方案、预期结果与风险。

    最终回答中简要说明：为什么该候选最值得优先验证。'
  tags: []
  priority: P0
  data_files: []
  reference_answers:
  - key: additive_json
    value: perovskite_additive_candidates.json
  - key: proposal_md
    value: perovskite_additive_proposal.md
  - key: additive_tokens
    value:
      filename: perovskite_additive_candidates.json
      must_cover:
      - smiles
      - predicted_effect
      - selection_reason
      - similar_formulation_hint
  - key: proposal_tokens
    value:
      filename: perovskite_additive_proposal.md
      must_cover:
      - 目标
      - 验证
      - 预期结果
      - 风险
      - 不确定性
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: additive_json
    criterion: Agent writes `perovskite_additive_candidates.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: proposal_md
    criterion: Agent writes `perovskite_additive_proposal.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: additive_tokens
    criterion: Candidate JSON includes required additive-recommendation fields.
    axis: correctness
    verify: llm_binary_judge
  - id: proposal_tokens
    criterion: Proposal document covers objectives, validation plan, and uncertainty/risk.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Deliverables are grounded in generated candidate analysis rather than unsupported additive claims.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: SA_perovskite_pl_lifetime_001_20260506
  capability: scientific_analysis
  domain: semiconductor
  intent: Extract photoluminescence peak, band width, and lifetime metrics from uploaded Mn-doped perovskite spectra.
  human_prompt_seed: '请下载并分析以下通过 OSS URL 提供的两个光谱数据文件：

    - `mn_perovskite_em_ex365.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_perovskite_pl_lifetime_001/1778080963_mn_perovskite_em_ex365.txt`（365 nm 激发下的 Mn 发光发射谱）

    - `mn_perovskite_decay_ex365_pl520.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_perovskite_pl_lifetime_001/1778080962_mn_perovskite_decay_ex365_pl520.txt`（同一样品在 520 nm 附近监测的时间衰减曲线）

    请完成以下分析：

    1. 从发射谱中确定主要发光峰位置和发射带宽；
    2. 从衰减曲线中提取一个代表性的发光寿命；
    3. 判断该发光是否符合 Mn 掺杂卤化物发光材料常见的宽带绿光特征；
    4. 简要说明背景、噪声或尾部拟合对结果的影响。

    最终回答末尾请追加 `<eval_results>...</eval_results>` JSON，至少包含：
    `pl.lambda_max_nm`, `pl.fwhm_nm`, `decay.tau_avg_us`。

    JSON 中字段名形如 `a.b` 表示嵌套对象（顶层 `a` 下的子键 `b`），请使用嵌套结构而不要写成扁平字符串键。结构示例（数值仅占位）：

    ```json
    {"pl": {"lambda_max_nm": 0, "fwhm_nm": 0}, "decay": {"tau_avg_us": 0}}
    ```'
  tags:
  - char_optical_spectrum
  - char_time_resolved
  data_files:
  - key: emission_spectrum
    path: data/SA_perovskite_pl_lifetime_001/mn_perovskite_em_ex365.txt
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_perovskite_pl_lifetime_001/1778080963_mn_perovskite_em_ex365.txt
    description: Mn-doped perovskite emission spectrum under 365 nm excitation.
  - key: lifetime_decay
    path: data/SA_perovskite_pl_lifetime_001/mn_perovskite_decay_ex365_pl520.txt
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_perovskite_pl_lifetime_001/1778080962_mn_perovskite_decay_ex365_pl520.txt
    description: Mn-doped perovskite photoluminescence decay trace monitored near 520 nm.
  reference_answers:
  - key: lambda_max
    value:
      json_path: pl.lambda_max_nm
      target: 518.0
      tolerance: 3.0
    unit: nm
  - key: fwhm
    value:
      json_path: pl.fwhm_nm
      target: 49.900441952351684
      tolerance: 10.0
    unit: nm
  - key: tau_avg
    value:
      json_path: decay.tau_avg_us
      target: 350.99747059656994
      tolerance: 80.0
    unit: us
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: lambda_max
    criterion: The emission maximum reported in eval_results is consistent with the uploaded emission spectrum.
    axis: correctness
    verify: answer_json_numeric
    weight: 1.5
  - id: fwhm
    criterion: The emission bandwidth reported in eval_results is consistent with the uploaded emission spectrum.
    axis: correctness
    verify: answer_json_numeric
  - id: tau_avg
    criterion: The representative lifetime reported in eval_results is consistent with the uploaded decay trace.
    axis: correctness
    verify: answer_json_numeric
    weight: 1.5
  - id: photophysics_interpretation
    criterion: The final answer recognizes the broad green Mn-related emission and discusses uncertainty from background or tail fitting.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The reported photophysical metrics are derived from the uploaded spectrum and decay trace.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SA_gnr_003_20250618
  capability: scientific_analysis
  domain: semiconductor
  intent: Implement the analytic band gap scaling relation for zigzag graphene nanoribbons (ZGNRs) from
    Son et al. (2006) and compute the predicted band gap for a 12-ZGNR.
  human_prompt_seed: 'Implement the ZGNR band gap scaling formula from the paper: Δ_z^0(w_z) = 9.33 /
    (w_z + 15.0), where w_z is the ribbon width in Angstroms. For a 12-ZGNR, the width w_z can be approximated
    as w_z ≈ (3*N_z - 2) * a_cc / 2, with a_cc = 1.42 Å. Compute the predicted band gap for N_z = 8, 12,
    16, and 32. Save the results as a JSON file named `zgnr_bandgaps.json` in the current working directory.'
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_json
    value: zgnr_bandgaps.json
  - key: has_required_keys
    value:
      flags: []
      tokens:
      - N_z
      - w_z
      - delta_z_0
      - '12'
      filename: zgnr_bandgaps.json
  - key: gap_12zgnr
    value:
      checks:
      - key: delta_z_0_for_Nz12
        max: 0.35
        min: 0.25
        allow_missing_key: false
      filename: zgnr_bandgaps.json
  - key: gap_8zgnr
    value:
      checks:
      - key: delta_z_0_for_Nz8
        max: 0.5
        min: 0.38
        allow_missing_key: false
      filename: zgnr_bandgaps.json
  - key: gap_32zgnr
    value:
      checks:
      - key: delta_z_0_for_Nz32
        max: 0.2
        min: 0.12
        allow_missing_key: false
      filename: zgnr_bandgaps.json
  - key: grounding_source
    value:
      filename: zgnr_bandgaps.json
  - key: turn_budget
    value:
      max: 25
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_json
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file zgnr_bandgaps.json exists and is valid JSON.'
  - id: has_required_keys
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] JSON contains entries for N_z values 8, 12, 16, and 32 with corresponding w_z and
      delta_z_0 fields.'
  - id: gap_12zgnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Predicted band gap for 12-ZGNR is between 0.25 and 0.35 eV (expected: ~0.29
      eV from formula with w_z ≈ 16×1.42/2 ≈ 11.36 Å, giving 9.33/(11.36+15.0) ≈ 0.35 eV; or using w_z
      from paper Fig 4 data ~17 Å gives ~0.29 eV).'
  - id: gap_8zgnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Predicted band gap for 8-ZGNR is between 0.38 and 0.50 eV (expected: ~0.43
      eV from formula).'
  - id: gap_32zgnr
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.5
    criterion: '[Suggested] Predicted band gap for 32-ZGNR is between 0.12 and 0.20 eV (expected: ~0.15
      eV from formula).'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The implementation uses the exact formula Δ_z^0(w_z) = 9.33/(w_z + 15.0) from Son
      et al. (2006) and correctly relates N_z to w_z.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Completes within 25 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retry requests needed.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Completes within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Uses no more than 50000 tokens total.'
- id: SA_vasp_002_20250618
  capability: scientific_analysis
  domain: semiconductor
  intent: Implement the phenomenological analytical model from Giovannetti et al. (2008) that predicts
    the Fermi-level shift of graphene adsorbed on metal surfaces as a function of separation distance,
    using only the metal work function and graphene work function as inputs.
  human_prompt_seed: 'Implement the analytical model from Giovannetti et al., Phys. Rev. Lett. 101, 026803
    (2008) that predicts the Fermi-level shift ΔE_F of graphene on a metal substrate as a function of
    separation distance d. The model is given by Eq. (1) in the paper with these parameters: α = 34.93
    eV/Å, D₀ = 0.09 eV⁻² per unit cell, d₀ = 2.4 Å, W_G = 4.48 eV. The chemical interaction term is Δc(d)
    = exp(-κ·d)(a₀ + a₁·d + a₂·d²) with κ = 1.6443 Å⁻¹, a₀ = -2048.56 eV, a₁ = 1363.87 eV/Å, a₂ = -205.737
    eV/Å². Write a Python script that computes ΔE_F(d) for d from 3.0 to 5.0 Å in 0.1 Å steps for each
    of the five weakly-bonded metals: Al (W_M = 4.22 eV), Ag (4.92 eV), Cu (5.22 eV), Au (5.54 eV), Pt
    (6.13 eV). Save the results as a CSV file named graphene_doping_model.csv with columns: d_Angstrom,
    metal, W_M_eV, delta_E_F_eV.'
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_script
    value:
      filename: compute_doping_model.py
  - key: artifact_csv
    value:
      filename: graphene_doping_model.csv
  - key: csv_columns
    value:
      flags: []
      tokens:
      - d_Angstrom
      - metal
      - W_M_eV
      - delta_E_F_eV
      filename: graphene_doping_model.csv
  - key: csv_metal_count
    value:
      flags: []
      tokens:
      - Al
      - Ag
      - Cu
      - Au
      - Pt
      filename: graphene_doping_model.csv
  - key: csv_has_data
    value:
      flags: []
      pattern: ^\d+\.\d+,
      filename: graphene_doping_model.csv
  - key: grounding_source
    value:
      filename: graphene_doping_model.csv
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: artifact_script
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Python script compute_doping_model.py exists'
  - id: artifact_csv
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output CSV file graphene_doping_model.csv exists'
  - id: csv_columns
    axis: correctness
    verify: text_file_contains_all
    weight: 2.0
    criterion: '[Must] CSV header contains columns: d_Angstrom, metal, W_M_eV, delta_E_F_eV'
  - id: csv_metal_count
    axis: correctness
    verify: text_file_contains_all
    weight: 2.0
    criterion: '[Must] CSV contains data for all 5 metals: Al, Ag, Cu, Au, Pt'
  - id: csv_has_data
    axis: correctness
    verify: text_file_regex
    weight: 2.0
    criterion: '[Must] CSV contains numeric data rows (distance values in decimal format)'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The model implementation is grounded in Eq. (1) and parameters from Giovannetti
      et al. (2008)'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within the turn budget'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not retry any tool call'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within the duration budget'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent stays within the total token budget'
- id: SA_gnr_005_20250618
  capability: scientific_analysis
  domain: semiconductor
  intent: Implement the analytic three-family band gap scaling relation for armchair graphene nanoribbons
