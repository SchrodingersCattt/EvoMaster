      - key: delta_for_Na12
        max: 1.2
        min: 0.3
        allow_missing_key: false
      filename: agnr_three_family.json
  - key: gap_13agnr
    value:
      checks:
      - key: delta_for_Na13
        max: 1.5
        min: 0.5
        allow_missing_key: false
      filename: agnr_three_family.json
  - key: gap_14agnr
    value:
