  intent: Compare bulk and exfoliated MoS2 HER electrochemical performance from uploaded LSV and CV traces.
  human_prompt_seed: '请下载并分析以下通过 OSS URL 提供的两组 MoS2 析氢电催化数据（bulk MoS2 与 exfoliated MoS2，含各自 50 mV/s 的 LSV 极化曲线，以及 20/40/60/80/100 mV/s 的 CV 扫描序列）：

    - `mos2_lsv_50mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080961_mos2_lsv_50mvps.txt`

    - `exmos2_lsv_50mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080955_exmos2_lsv_50mvps.txt`

    - `mos2_cv_20mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080957_mos2_cv_20mvps.txt`

    - `mos2_cv_40mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080958_mos2_cv_40mvps.txt`

    - `mos2_cv_60mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080959_mos2_cv_60mvps.txt`

    - `mos2_cv_80mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080960_mos2_cv_80mvps.txt`

    - `mos2_cv_100mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080956_mos2_cv_100mvps.txt`

    - `exmos2_cv_20mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080952_exmos2_cv_20mvps.txt`

    - `exmos2_cv_40mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080953_exmos2_cv_40mvps.txt`

    - `exmos2_cv_60mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080954_exmos2_cv_60mvps.txt`

    - `exmos2_cv_80mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080954_exmos2_cv_80mvps.txt`

    - `exmos2_cv_100mvps.txt` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_her_mos2_001/1778080951_exmos2_cv_100mvps.txt`

    电极几何面积（来自实验报告）：bulk MoS2 = 0.48 cm² (0.6 cm × 0.8 cm)；exfoliated MoS2 = 0.40 cm² (0.5 cm × 0.8 cm)。
    请把 LSV/CV 中的电流转换为电流密度（mA/cm²）后再做容性分析。

    请完成以下分析：

    1. 对比两种材料的 HER 活性，报告能体现活性差异的电位/电流指标；
    2. 从极化曲线估算两种材料的 Tafel 行为，并说明拟合区间选择是否合理；
    3. 从不同扫速 CV 序列估算电化学双电层相关指标；
    4. 判断 exfoliated MoS2 相对 bulk MoS2 是否表现出更好的 HER 动力学，并说明依据；
    5. 简要说明数据中可能影响定量比较的不确定性。

    最终回答末尾请追加 `<eval_results>...</eval_results>` JSON，至少包含：
    `mos2.potential_at_5mA_V`, `exmos2.potential_at_5mA_V`,
    `mos2.tafel_mV_dec`, `exmos2.tafel_mV_dec`,
    `mos2.cdl_mF_cm2`, `exmos2.cdl_mF_cm2`。

    JSON 中字段名形如 `a.b` 表示嵌套对象（顶层 `a` 下的子键 `b`），请使用嵌套结构而不要写成扁平字符串键。结构示例（数值仅占位）：

    ```json
    {"mos2": {"potential_at_5mA_V": 0, "tafel_mV_dec": 0, "cdl_mF_cm2": 0}, "exmos2": {"potential_at_5mA_V": 0, "tafel_mV_dec": 0, "cdl_mF_cm2": 0}}
    ```'
