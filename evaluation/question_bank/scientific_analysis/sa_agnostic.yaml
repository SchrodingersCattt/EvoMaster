    FCC binary alloy using the tetrahedron CVM approximation. Read the CVM coefficients from `cvm_coefficients.json`
    and the MC-sampled cluster probabilities from `cluster_probabilities.json`. Apply the CVM entropy
    formula (equation 5 in Tepesch et al. 1998): S/N = -k_B × Σ_{α_m} Σ_{β∈α_m} (a_β / m_{α_m,β}) × Σ_J
    ρ_{β,J} × ln(ρ_{β,J}). Write the result to `entropy_result.json` with fields: entropy_per_site (in
    units of k_B), approximation_name, temperature, and chemical_field.'
