      tolerance: 0.04
    unit: A
  - key: cell_b
    value:
      json_path: b
      target: 9.57
      tolerance: 0.08
    unit: A
  - key: cell_c
    value:
      json_path: c
      target: 10.14
      tolerance: 0.06
    unit: A
  - key: cell_beta
