    in Sun et al. 2019.
  human_prompt_seed: 'Write a Python script that computes the Mn²⁺(aq) oxidation crystallization pathway
    using classical nucleation theory. Use the thermochemical data in mn_thermochemical_data.json and
    phase compositions in mn_phase_compositions.json. At E=0.5 V, pH=8.0, [Mn²⁺]=0.01 M, T=298.15 K: (1)
    compute Pourbaix potential Ψ for each phase using Eq. (2), (2) compute the nucleation rate J ∝ exp(-(ηγ)³/(ΔΨ)²)
