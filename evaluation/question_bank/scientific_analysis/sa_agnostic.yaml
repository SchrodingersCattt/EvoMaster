- id: SA_maps_001_20250618
  capability: scientific_analysis
  domain: agnostic
  intent: Compute the cross-validation (CV) score for a cluster expansion fit given a set of structure
    energies and the correlation matrix, using the efficient O(n) formula that avoids leave-one-out re-fitting.
  human_prompt_seed: 'Given the files structure_energies.csv (columns: structure_id, energy_meV_per_atom)
    and correlation_matrix.csv (rows = structures, columns = clusters), compute the cross-validation (CV)
    score for the cluster expansion fit. Use the efficient formula: CV² = (1/n) × Σᵢ [(Eᵢ - Êᵢ) / (1 -
    hᵢᵢ)]² where Êᵢ are the fitted energies from least-squares regression and hᵢᵢ = Xᵢ(XᵀX)⁻¹Xᵢᵀ are the
    diagonal elements of the hat matrix. Write a Python script cv_score.py that reads both files, performs
    the computation, and prints the CV score in meV/atom. Save the script and a results file cv_result.txt
    containing the numerical CV score.'
  tags: []
  data_files:
  - key: structure_energies
    path: structure_energies.csv
    oss_url: ''
    description: 'CSV file with columns: structure_id, energy (meV/atom). Contains DFT-computed energies
      for ordered alloy structures.'
  - key: correlation_matrix
    path: correlation_matrix.csv
    oss_url: ''
    description: CSV file containing the correlation matrix X where each row i corresponds to structure
      i and each column alpha corresponds to a cluster. Values are the symmetry-averaged correlation functions
      ⟨∏ σ_i⟩.
