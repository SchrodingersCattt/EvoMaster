    factors, all dimensionless). Compute: (1) the diffusion matrix D = L̃ × Θ, (2) its eigenvalues λ⁺
    (larger) and λ⁻ (smaller), (3) the Kirkendall metric δ = D_BB - D_AA + D_AB - D_BA, and (4) the flux-partition
    metric φ = D_BA / (D_AB + D_BA). Save all results to diffusion_metrics.json.'
