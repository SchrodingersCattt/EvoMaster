    axis: correctness
    verify: text_file_numeric_range
    weight: 10.0
    criterion: '[Must] van de Walle & Ceder method trace = 9.0 (identity matrix of size 9)'
  - id: seko_trace
    axis: correctness
    verify: text_file_numeric_range
    weight: 10.0
    criterion: '[Must] Seko et al. method trace = 1+1+1/4+1/4+1/8+1/8+1/12+1/12+1/12 = 3.0'
  - id: all_structures_trace
    axis: correctness
    verify: text_file_numeric_range
    weight: 10.0
    criterion: '[Must] All-structures-equal method trace = 1.0 (only D[0][0]=1)'
  - id: composition_trace
