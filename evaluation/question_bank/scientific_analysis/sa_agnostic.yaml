    criterion: Pass if the final answer, workspace run.sh files, or tool-call observations show the run.sh wrapper pattern such as bash run.sh > log 2>&1, with the python3 gsas2_pawley.py invocation inside
      run.sh rather than inlined with embedded quotes in the cmd field.
