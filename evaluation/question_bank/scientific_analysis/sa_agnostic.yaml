- id: DF_scxrd_001_20260408
  capability: scientific_analysis
  domain: agnostic
  intent: Determine the crystal structure of an ordered molecular crystal (1-RTP, 293 K) from
    raw single-crystal X-ray diffraction data. Starting from the reduced reflection file (.hkl)
    and the data-collection summary (.p4p), the agent must determine the space group, solve
    the structure, refine it, and generate a validated CIF with no A-level checkCIF alerts.
  human_prompt_seed: '文件 `A23050101A0735.hkl` 和 `A23050101A0735.p4p` 是一个有机-无机杂化硝普盐在 293 K
    下采集的单晶 X 射线衍射数据（已经过数据还原）。请完成以下工作：

    1. 根据 .p4p 文件中的晶胞参数和系统消光规律，确定空间群；

    2. 使用合适的程序解析晶体结构；

    3. 对结构进行全矩阵最小二乘精修，直至收敛；

    4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

    5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

    '
  tags:
  - char_xrd
  - char_cif_validation
  - phy_defect
  data_files:
  - key: hkl_file
    path: data/DF_scxrd_001_20260408/A23050101A0735.hkl
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_001_20260408/1775644505_A23050101A0735.hkl
    description: Reduced reflection data file (SHELX .hkl format) for 1-RTP at 293 K.
  - key: p4p_file
    path: data/DF_scxrd_001_20260408/A23050101A0735.p4p
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_001_20260408/1775644506_A23050101A0735.p4p
    description: Data-collection summary file (.p4p) with unit cell parameters, wavelength,
      and crystal system information.
  reference_answers:
  - key: r1_factor
    value: 0.0418
    tolerance: 0.008
    unit: dimensionless
  - key: wr2_factor
    value: 0.0981
    tolerance: 0.02
    unit: dimensionless
  - key: goof
    value: 1.048
    tolerance: 0.1
    unit: dimensionless
  - key: space_group_number
    value: 4
    tolerance: 0
    unit: IT_number
  - key: cell_volume
    value: 1001.05
    tolerance: 5.0
    unit: A3
  - key: checkcif_validation
    value:
      filename: '*.cif'
      max_a_alerts: 0
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 14400000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: r1_factor
    criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0418 (human baseline).
      A value ≤ 0.05 is acceptable for a well-refined ordered structure.
    axis: correctness
    verify: numerical_range
    weight: 2.0
  - id: wr2_factor
    criterion: Final wR2 factor (on F², all data) is within tolerance of 0.0981 (human baseline).
      A value ≤ 0.12 is acceptable.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: goof
    criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.048. A value between 0.9
      and 1.2 indicates a well-refined structure.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: space_group_number
    criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic).
      The answer or CIF must report space group No. 4.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: cell_volume
    criterion: Refined unit cell volume is within tolerance of 1001.05 Å³.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: checkcif_validation
    criterion: The generated CIF passes IUCr checkCIF with zero A-level alerts.
    axis: correctness
    verify: checkcif_no_a_alerts
    weight: 2.0
  - id: cif_generated
    criterion: The agent produces a valid CIF file as output of the refinement.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Task completed within 30 turns.
    axis: efficiency
    verify: turn_budget
    weight: 1.0
  - id: duration_budget
    criterion: Task completed within 4 hours (14400 seconds).
    axis: efficiency
    verify: duration_budget
    weight: 1.0
  - id: token_budget_total
    criterion: Total token usage does not exceed 20000 tokens.
    axis: efficiency
    verify: token_budget
    weight: 1.0
- id: DF_scxrd_002_20260408
  capability: scientific_analysis
  domain: agnostic
  intent: Determine the crystal structure of a disordered molecular crystal (1-HTP, 385 K)
    from raw single-crystal X-ray diffraction data. The high-temperature phase features cation
    orientational disorder, requiring split-atom or constraint-based modeling. Starting from
    the reduced reflection file (.hkl) and the data-collection summary (.p4p), the agent must
    determine the space group, solve the structure, refine it with disorder modeling, and
    generate a validated CIF with no A-level checkCIF alerts.
  human_prompt_seed: '文件 `A23050102A0375.hkl` 和 `A23050102A0375.p4p` 是一个有机-无机杂化硝普盐在 385 K
    下采集的单晶 X 射线衍射数据（已经过数据还原）。该高温相中阳离子存在取向无序。请完成以下工作：

    1. 根据 .p4p 文件中的晶胞参数和系统消光规律，确定空间群；

    2. 使用合适的程序解析晶体结构；

    3. 对结构进行精修，需对无序部分进行合理建模（如分裂原子模型或约束/限制）；

    4. 生成 CIF 文件，并通过 IUCr checkCIF 验证（不允许有 A 类警告）；

    5. 报告最终精修结果：R1、wR2、GooF 及晶胞参数。

    '
  tags:
  - char_xrd
  - char_cif_validation
  - phy_defect
  data_files:
  - key: hkl_file
    path: data/DF_scxrd_002_20260408/A23050102A0375.hkl
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_002_20260408/1775644506_A23050102A0375.hkl
    description: Reduced reflection data file (SHELX .hkl format) for 1-HTP at 385 K.
  - key: p4p_file
    path: data/DF_scxrd_002_20260408/A23050102A0375.p4p
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_scxrd_002_20260408/1775644507_A23050102A0375.p4p
    description: Data-collection summary file (.p4p) with unit cell parameters, wavelength,
      and crystal system information for the high-temperature disordered phase.
  reference_answers:
  - key: r1_factor
    value: 0.0637
    tolerance: 0.015
    unit: dimensionless
  - key: wr2_factor
    value: 0.2183
    tolerance: 0.04
    unit: dimensionless
  - key: goof
    value: 1.022
    tolerance: 0.1
    unit: dimensionless
  - key: space_group_number
    value: 4
    tolerance: 0
    unit: IT_number
  - key: cell_volume
    value: 1025.98
    tolerance: 5.0
    unit: A3
  - key: checkcif_validation
    value:
      filename: '*.cif'
      max_a_alerts: 0
  - key: turn_budget
    value:
      max: 40
  - key: duration_budget
    value:
      max: 21600000
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: r1_factor
    criterion: Final R1 factor (on F, I>2sigma) is within tolerance of 0.0637 (human baseline
      for disordered structure). A value ≤ 0.08 is acceptable given the disorder.
    axis: correctness
    verify: numerical_range
    weight: 2.0
  - id: wr2_factor
    criterion: Final wR2 factor (on F², all data) is within tolerance of 0.2183 (human baseline).
      Higher wR2 is expected for disordered structures; ≤ 0.25 is acceptable.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: goof
    criterion: Goodness-of-fit (GooF, S) is within tolerance of 1.022. A value between 0.9
      and 1.2 indicates a well-refined structure.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: space_group_number
    criterion: The agent correctly identifies the space group number as 4 (P2₁, monoclinic).
      The answer or CIF must report space group No. 4.
    axis: correctness
    verify: numerical_range
    weight: 1.5
  - id: cell_volume
    criterion: Refined unit cell volume is within tolerance of 1025.98 Å³.
    axis: correctness
    verify: numerical_range
    weight: 1.0
  - id: checkcif_validation
    criterion: The generated CIF passes IUCr checkCIF with zero A-level alerts.
    axis: correctness
    verify: checkcif_no_a_alerts
    weight: 2.0
  - id: disorder_modeled
    criterion: The agent explicitly models the cation orientational disorder (e.g., using
      split-atom positions, PART instructions, or occupancy constraints in SHELXL) and reports
      the disorder in the answer.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: cif_generated
    criterion: The agent produces a valid CIF file as output of the refinement.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Task completed within 40 turns.
    axis: efficiency
    verify: turn_budget
    weight: 1.0
  - id: duration_budget
    criterion: Task completed within 6 hours (21600 seconds).
    axis: efficiency
    verify: duration_budget
    weight: 1.0
  - id: token_budget_total
    criterion: Total token usage does not exceed 25000 tokens.
    axis: efficiency
    verify: token_budget
    weight: 1.0
- id: PXRD_thermal_expansion_001_20260427_v2
  capability: scientific_analysis
  domain: agnostic
  intent: Perform Pawley refinement on variable-temperature PXRD patterns to extract lattice
    parameters at each temperature, identify two structural phases (low-temperature RTP and
    high-temperature HTP), and fit linear thermal expansion equations for each phase.
  human_prompt_seed: "文件 `_td-pxrd_test.txt` 包含一个化合物在 8 个温度下的变温粉末 X 射线衍射（PXRD）数据，温度标签对应关系为：25°C→303K、40°C→323K、60°C→343K、80°C→363K、100°C→383K、115°C→393K、130°C→403K、140°C→413K。该化合物为单斜晶系，空间群提示为 P 21（No. 4），波长为 Cu Kα1，λ = 1.5406 Å。

    数据特征与精修策略：
    - 数据为模拟生成、动态范围较小且噪声偏高，预期 Pawley wR 在 0.20–0.30 区间属于正常情况；判定精修是否成功应主要依据精修体积相对初猜偏离是否 >20%、以及晶格参数随温度的连续性，wR 偏高本身不直接判失败。
    - 2θ 范围 5°–50°，其中 2θ < 14° 主要为低角伪影/噪声，建议精修使用 14°–50° 区间。
    - 推荐将数据按相拆分（RTP 4 点、HTP 4 点）分别精修，并在同一相内启用 chain-cell（前一温度精修结果作为下一温度初猜）以减小温度间散点。

    文献参考晶胞（每相分别作为 Pawley 精修初猜，并基于此自由精修；c 与 β 是单斜结构敏感参数，如下文献值已对每相核对）：
    - 低温相 RTP（303K – 363K）：a ≈ 10.83 Å, b ≈ 9.62 Å, c ≈ 10.13 Å, β ≈ 108.75°, V ≈ 1000 Å³
    - 高温相 HTP（383K – 413K）：a ≈ 11.05 Å, b ≈ 9.48 Å, c ≈ 10.48 Å, β ≈ 111.25°, V ≈ 1023 Å³

    请对每个温度的 PXRD 图谱进行 Pawley 精修，提取晶格参数（a、b、c、β、V），并分析结果：
    1. 识别两个结构相：低温相（1-RTP，303K–363K）和高温相（1-HTP，383K–413K）。
    2. 分别对两个相的各晶格参数（a、b、c、β、V）随温度的变化进行线性拟合，给出拟合方程（斜率、截距、R²）。两相必须分别独立拟合，不能合并为一条直线，且 RTP 与 HTP 的斜率应基于各相内的 4 个温度点分别计算（不要让两相共享同一斜率值）。
    3. 报告各温度下的精修结果。每个温度必须使用 Pawley 脚本（如 `gsas2_pawley.py`）输出 JSON 中真实的 volume（由收敛后的 a/b/c/β 计算得到），不要将 prompt 中的近似初猜（V ≈ 1000、1023 Å³）当作精修结果填入答案。

    【机器评分约定 — 必须遵守】
    自动评分会从你的最终答案中解析一个结构化 JSON 块用于晶格/斜率定量校验，因此请在最终答案末尾追加一个用 `<eval_results>` 包裹的 JSON 块（**单位：Å、°、Å³、Å/K、Å³/K**，仅填数值不要带单位字符串）：

    <eval_results>
    {
      \"rtp\": {
        \"303K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"323K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"343K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"363K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"fits\": {
          \"a\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"b\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"c\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"beta\": {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"V\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>}
        }
      },
      \"htp\": {
        \"383K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"393K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"403K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"413K\": {\"a\": <num>, \"b\": <num>, \"c\": <num>, \"beta\": <num>, \"V\": <num>},
        \"fits\": {
          \"a\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"b\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"c\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"beta\": {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>},
          \"V\":    {\"slope\": <num>, \"intercept\": <num>, \"r_squared\": <num>}
        }
      }
    }
    </eval_results>

    要求：
    - 所有数值必须来自实际 Pawley 精修与线性拟合结果，禁止填入 prompt 中的初猜近似值。
    - `fits` 为四点（同相内 4 个温度）的线性拟合，RTP 与 HTP 必须分别独立拟合。
    - 该 JSON 块为机器评分输入；仍可在它之外用自然语言展开方法、表格与讨论。

    "
  tags:
  - char_xrd
  - phy_phonon
  - wf_postprocess
  data_files:
  - key: vt_pxrd_data
    path: data/PXRD_thermal_expansion_001_20260427_v2/_td-pxrd_test.txt
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/DF_thermo_001_20260408/1775629319__td-pxrd_test.txt
