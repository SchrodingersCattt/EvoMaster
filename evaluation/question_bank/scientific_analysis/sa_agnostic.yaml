- id: PXRD_pawley_303K_001_20260502_v1
  capability: scientific_analysis
  domain: agnostic
  intent: Perform Pawley refinement on a single PXRD pattern at 303 K to extract all
    lattice parameters (a, b, c, beta, V) and report the weighted profile R-factor (wR).
  human_prompt_seed: "文件 `pxrd_303K.xy` 是一个有机-无机杂化硝普盐在 303 K（30 °C）下采集的粉末 X
    射线衍射（PXRD）数据（Cu Kα1, λ = 1.5406 Å, 2θ 范围 5°–50°, 步长 ~0.02°, 两列格式: 2θ 强度）。

    该化合物为单斜晶系，空间群 P 21（No. 4）。文献参考晶胞：a ≈ 10.83 Å, b ≈ 9.62 Å, c ≈ 10.13 Å,
    beta ≈ 108.75°, V ≈ 1000 Å³。

    精修策略建议：
    - 建议使用 14°–50° 2θ 区间以避开低角伪影
    - 基线 / 背景函数使用低阶（0–1 阶）以避免过拟合
    - 若多次精修收敛到不同盆地，选择 wR 最低且体积与初猜偏差最小的结果

    请对该 PXRD 图谱进行 Pawley 精修，提取精修后的晶格参数并报告精修质量。

    【机器评分约定】最终答案末尾追加一个 eval_results 标签包裹的 JSON 块（数值无单位，约定：
    a/b/c 单位 Å, beta 单位°, V 单位 Å³, wR 单位 %），格式如下：

    <eval_results>
    {\"a\": ..., \"b\": ..., \"c\": ..., \"beta\": ..., \"V\": ..., \"wR\": ...}
    </eval_results>

    数值必须来自实际 Pawley 精修结果，不得填入 prompt 中的初猜近似值。
    "
  tags:
  - char_xrd
  data_files:
  - key: pxrd_data
    path: data/PXRD_pawley_303K_001_20260502_v1/pxrd_303K.xy
    oss_url: ''
    description: PXRD pattern at 303 K (Cu Kalpha1, 5-50 deg 2theta), two-column
      format (2theta, intensity). Generated from real laboratory diffractometer scan.
  reference_answers:
