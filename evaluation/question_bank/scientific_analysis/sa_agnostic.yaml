    verify: llm_binary_judge
    weight: 0.5
  - id: merge_audit_surfaced
    criterion: When reporting per-pattern cells from a chain-cell-direction both run, the agent referenced merge_audit (table or warnings) or self_heal_audit at least once in the final answer or reasoning.
