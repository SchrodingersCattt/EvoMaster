- id: SA_ce_003_20250618
  capability: scientific_analysis
  domain: agnostic
  intent: Compare four different domain matrix construction methods for a binary fcc cluster expansion
    and compute the resulting τ values to evaluate which method yields the best training set selection.
  human_prompt_seed: 'Compare four domain matrix construction methods for a binary fcc cluster expansion
    with 9 orbits (site counts n = [0,1,2,2,3,3,4,4,4]): (1) van de Walle & Ceder: D = 9×9 identity matrix.
    (2) Seko et al.: diagonal matrix with D[α][α] = 1/N_α where N = [1,1,4,4,8,8,12,12,12] (symmetrically
    distinct clusters per orbit in a 32-atom fcc supercell), off-diagonal = 0. (3) All structures equal
    (Eq. 24): D[0][0]=1, all other elements 0. (4) Uniform composition weighting (Eq. 29): D[i][j] = 1/(n[i]+n[j]+1)
    if (n[i]+n[j]) is even, else 0. For each method, compute the 9×9 matrix and its trace (sum of diagonal).
    Save all four matrices and their traces in `domain_matrices_comparison.json` with keys "vandewalle",
    "seko", "all_structures", "composition_weighting" for matrices and "vandewalle_trace", "seko_trace",
    "all_structures_trace", "composition_trace" for traces.'
  tags: []
  data_files: []
  reference_answers:
  - key: vandewalle_trace
    value:
      checks:
      - key: vandewalle_trace
        expected: 9.0
        tolerance: 1.0e-10
      filename: domain_matrices_comparison.json
  - key: seko_trace
    value:
      checks:
      - key: seko_trace
        expected: 3.0
        tolerance: 1.0e-10
      filename: domain_matrices_comparison.json
  - key: all_structures_trace
    value:
      checks:
      - key: all_structures_trace
        expected: 1.0
        tolerance: 0
      filename: domain_matrices_comparison.json
  - key: composition_trace
    value:
      checks:
      - key: composition_trace
        expected: 2.3523809523809525
        tolerance: 1.0e-10
      filename: domain_matrices_comparison.json
  - key: vandewalle_is_identity
    value:
      checks:
      - key: vandewalle[0][0]
        expected: 1.0
        tolerance: 0
      - key: vandewalle[0][1]
        expected: 0.0
        tolerance: 0
      - key: vandewalle[1][1]
        expected: 1.0
        tolerance: 0
      filename: domain_matrices_comparison.json
  - key: composition_D00
    value:
      checks:
      - key: composition_weighting[0][0]
        expected: 1.0
        tolerance: 1.0e-10
      filename: domain_matrices_comparison.json
  - key: artifact_exists
    value: domain_matrices_comparison.json
  - key: grounding_source
    value:
      filename: domain_matrices_comparison.json
  - key: turn_budget
    value:
      max: 40
  - key: no_retries
    value:
      max: 1
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 60000
  scoring_checklist:
