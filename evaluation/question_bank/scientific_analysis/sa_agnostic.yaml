    verify: llm_binary_judge
    weight: 0.5
  - id: local_solver_avoided
    criterion: Pass if the final answer, workspace files, or tool-call observations show that refinement results came from gsas2_pawley.py executed on Bohrium, and there is no positive evidence that the
      agent bypassed GSAS-II by writing a local scipy/numpy least-squares Pawley replacement.
    axis: correctness
    verify: llm_binary_judge
    weight: 0.5
  - id: initial_cell_from_reference
    criterion: Agent uses an initial cell from the provided data or a prior refinement result, not an invented/eyeballed cell.
