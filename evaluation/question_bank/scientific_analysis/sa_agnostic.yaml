- id: SA_cvm_003_20250618
  capability: scientific_analysis
  domain: agnostic
  intent: Compute the configurational entropy per site for a binary FCC alloy using the tetrahedron CVM
    approximation, given maximal-cluster probability data from an MC simulation. Implement the CVM entropy
