  scoring_checklist:
  - id: rtp_V_303K
    criterion: Refined unit cell volume V at the RTP phase / T=303 K is within tolerance (target 999.81 ± 20.0 Å³). Read from the eval_results JSON path rtp.303K.V.
    axis: correctness
