      and subcluster multiplicities).
  - key: cluster_probabilities
    path: cluster_probabilities.json
    oss_url: ''
    description: Seed data with averaged cluster probabilities from an MC simulation of a disordered FCC
      binary alloy at μ=0, T=2.0 V₁. Contains point probabilities (ρ_A, ρ_B) and pair probabilities (ρ_AA,
      ρ_AB, ρ_BA, ρ_BB) for the symmetry-averaged tetrahedron approximation.
