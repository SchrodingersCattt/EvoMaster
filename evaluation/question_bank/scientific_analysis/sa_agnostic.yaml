      target: 108.1
      tolerance: 1.2
    unit: deg
  - key: cell_V
    value:
      json_path: V
      target: 997.0
      tolerance: 12.0
    unit: A3
  - key: wR_factor
    value:
      json_path: wR
      target: 16.0
      tolerance: 4.0
    unit: percent
  - key: grounding_source
    value:
