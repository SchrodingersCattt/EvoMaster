- id: SA_vasp_006_20250618
  capability: scientific_analysis
  domain: battery
  intent: Compute the average Mg insertion voltage for Xerogel-V2O5 under wet, dry, and superdry electrolyte
    conditions using the grand-potential phase diagram data, and compare with the experimentally reported
    voltage values from Sai Gautam et al. (2016).
  human_prompt_seed: Using the grand-potential phase diagram data provided in grand_potential_data.json,
    compute the average Mg insertion voltage for Xerogel-V2O5 under wet (a_H2O ≈ 1), dry (a_H2O = 10^{-4}),
    and superdry (a_H2O = 10^{-8}) electrolyte conditions. Use the standard formula V_avg = -(G_final
    - G_initial)/(n_e × e), where n_e is the number of electrons transferred. Report the voltages for
    the full magnesiation range (0 ≤ x_Mg ≤ 0.5) and save results as voltage_results.json.
  tags:
  - eng_vasp
  data_files:
  - key: phase_data
    path: grand_potential_data.json
    oss_url: ''
    description: JSON file containing the grand-potential phase diagram data for Mg-Xerogel-V2O5 at 0
      K, including stable phase compositions and their grand potentials at different μ_Mg and a_H2O values.
      Derived from the DFT calculations in Sai Gautam et al. (2016).
  reference_answers:
  - key: artifact_results
    value: voltage_results.json
  - key: text_voltage_superdry
    value:
      checks:
      - key: voltage_superdry
        max: 2.55
        min: 2.4
        allow_missing_key: false
      filename: voltage_results.json
  - key: text_voltage_wet_higher
    value:
      checks:
      - key: voltage_wet
        max: 2.75
        min: 2.55
        allow_missing_key: false
      filename: voltage_results.json
  - key: text_voltage_wet_exceeds_dry
    value:
      checks:
      - key: voltage_wet_minus_dry
        max: 0.2
        min: 0.1
        allow_missing_key: true
      filename: voltage_results.json
  - key: text_voltage_three_regimes
    value:
      flags: []
      tokens:
      - wet
      - dry
      - superdry
      filename: voltage_results.json
  - key: grounding_source
    value:
      filename: grand_potential_data.json
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 80000
  scoring_checklist:
  - id: artifact_results
    axis: correctness
