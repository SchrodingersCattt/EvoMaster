version: v5
capability: scientific_analysis
domain: battery
questions:
- id: SA_lfp_cycling_001_20260506
  capability: scientific_analysis
  domain: battery
  intent: Analyze LiFePO4 half-cell cycling data from a Neware workbook.
  human_prompt_seed: '请下载并分析以下通过 OSS URL 提供的 Neware 工作簿：

    - `lfp_cycling.xlsx` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lfp_cycling_001/1778083319_002_6(--).xlsx`

    该工作簿来自 LiFePO4 半电池恒流充放电测试。

    请完成以下分析：

    1. 读取循环汇总数据，整理前若干圈的充放电容量、比容量和库伦效率；
    2. 报告首圈放电比容量和首圈库伦效率；
    3. 报告第 10 圈放电比容量，并以第 2 圈为较稳定的早期参考计算容量保持情况；
    4. 判断该数据是否表现出明显首圈不可逆损失或早期活化/衰减特征；
    5. 简要说明你如何处理工作簿中的多张表。

    最终回答末尾请追加 `<eval_results>...</eval_results>` JSON，至少包含：
    `cycle1.discharge_capacity_mAh_g`, `cycle1.coulombic_efficiency_pct`,
    `cycle10.discharge_capacity_mAh_g`, `cycle10.retention_vs_cycle2_pct`。

    JSON 中字段名形如 `a.b` 表示嵌套对象（顶层 `a` 下的子键 `b`），请使用嵌套结构而不要写成扁平字符串键。结构示例（数值仅占位）：

    ```json
    {"cycle1": {"discharge_capacity_mAh_g": 0, "coulombic_efficiency_pct": 0}, "cycle10": {"discharge_capacity_mAh_g": 0, "retention_vs_cycle2_pct": 0}}
    ```'
  tags:
  - char_battery_cycling
  data_files:
  - key: cycling_workbook
    path: data/SA_lfp_cycling_001/lfp_cycling.xlsx
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/matmaster_evo/eval_data/SA_lfp_cycling_001/1778083319_002_6(--).xlsx
    description: Neware LiFePO4 half-cell cycling workbook.
  reference_answers:
  - key: cycle1_capacity
    value:
      json_path: cycle1.discharge_capacity_mAh_g
      target: 36.231693267822266
      tolerance: 4.0
    unit: mAh/g
  - key: cycle1_ce
    value:
      json_path: cycle1.coulombic_efficiency_pct
      target: 64.32537078857422
      tolerance: 6.0
    unit: percent
  - key: cycle10_capacity
    value:
      json_path: cycle10.discharge_capacity_mAh_g
      target: 33.2324104309082
      tolerance: 4.0
    unit: mAh/g
  - key: cycle10_retention
    value:
      json_path: cycle10.retention_vs_cycle2_pct
      target: 93.39356469609517
      tolerance: 8.0
    unit: percent
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: cycle1_capacity
    criterion: The first-cycle discharge specific capacity reported in eval_results is consistent with the uploaded cycling workbook.
    axis: correctness
    verify: answer_json_numeric
    weight: 1.5
  - id: cycle1_ce
    criterion: The first-cycle coulombic efficiency reported in eval_results is consistent with the uploaded cycling workbook.
    axis: correctness
    verify: answer_json_numeric
    weight: 1.5
  - id: cycle10_capacity
    criterion: The cycle-10 discharge specific capacity reported in eval_results is consistent with the uploaded cycling workbook.
    axis: correctness
    verify: answer_json_numeric
  - id: cycle10_retention
    criterion: The cycle-10 retention value reported in eval_results is consistent with using an early stable cycle as reference.
    axis: correctness
    verify: answer_json_numeric
  - id: cycling_interpretation
    criterion: The final answer identifies the low first-cycle efficiency and summarizes early cycling behavior without inventing cycles not present in the workbook.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The reported metrics are derived from the uploaded Neware workbook and distinguish summary sheets from raw record sheets.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SA_wulff_001_20260513
  capability: scientific_analysis
  domain: battery
  intent: Construct Wulff equilibrium crystal shape from given surface energies and
    report facet area fractions.
  human_prompt_seed: 'LiCoO₂ 层状正极材料的几个低指数晶面表面能如下（单位 J/m²）：(001)=0.85,
    (104)=1.12, (110)=1.45, (012)=1.30。请基于 Wulff 定理构建平衡形貌，输出各晶面在平衡形貌中的面积占比，并生成形貌示意图保存为
    `wulff_shape.png`。最终答案末尾追加 `<eval_results>{"facet_001_area_fraction":
    <number>, "dominant_facet": "<hkl>"}</eval_results>`。'
  tags:
  - char_battery_cycling
  data_files: []
  reference_answers:
  - key: wulff_artifact
    value: wulff_shape.png
  - key: facet_001_fraction
    value:
      json_path: facet_001_area_fraction
      target: 0.55
      tolerance: 0.2
  - key: dominant_facet
    value:
    - '001'
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: wulff_artifact
    criterion: wulff_shape.png written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: facet_001_fraction
    criterion: The (001) facet area fraction is consistent with Wulff theorem prediction
      (lowest surface energy → largest area).
    axis: correctness
    verify: answer_json_numeric
  - id: dominant_facet
    criterion: The reported dominant facet is (001), which has the lowest surface energy.
    axis: correctness
    verify: contains_all
  - id: wulff_method
    criterion: Agent applied Wulff theorem correctly — facet distance from center is
      proportional to surface energy, resulting in (001) dominating the equilibrium
      shape. Calculation uses pymatgen WulffShape or equivalent geometric construction.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: SA_bat_oxpot_001_20260519
  capability: scientific_analysis
  domain: battery
  intent: Compute oxidation potential of electrolyte solvent molecules from vertical
    ionization potential, testing that the agent uses neutral molecules (not cation
    complexes) and applies correct reference electrode correction.
  human_prompt_seed: '请计算 FEC（氟代碳酸乙烯酯，SMILES: C1OC(=O)OC1F）的电化学氧化电位
    vs Li/Li+，输出到 `fec_oxidation.json`，格式为 `{"E_ox_vs_Li": ...}`。'
  tags: []
  data_files: []
  reference_answers:
  - key: output_artifact
    value: fec_oxidation.json
  - key: eox_range
    value:
      filename: fec_oxidation.json
      checks:
      - key: E_ox_vs_Li
        min: 4.5
        max: 8.0
  - key: turn_budget
    value:
      max: 20
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `fec_oxidation.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: eox_range
    criterion: Oxidation potential vs Li/Li+ is in a physically reasonable range (4.5-8.0 V).
      Experimental FEC oxidation stability is ~5-6 V. A value >10 V indicates the agent
      computed IP from the wrong species (cation complex instead of neutral molecule)
      or applied wrong reference electrode correction.
    axis: correctness
    verify: text_file_numeric_range
    weight: 2.0
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
- id: SA_bat_formation_001_20260521
  capability: scientific_analysis
  domain: battery
  intent: Compute formation energy of LiCoO2 from ABACUS total energies, testing
    correct determination of formula units (Z value) from cell composition.
  human_prompt_seed: '工作区中有 ABACUS 计算结果文件 `abacus_energies.json`，包含 LiCoO2 体相、Li
    金属、Co 金属和 O2 分子的总能量。请计算 LiCoO2 的生成能（每 formula unit），输出到 `formation_energy.json`，格式为
    `{"E_f_per_fu": ...}`。'
  tags:
  - eng_abacus
  data_files:
  - key: energies
    path: data/SA_formation_energy_001/abacus_energies.json
    oss_url: ''
    description: ABACUS total energies for LiCoO2 (R-3m, 12 atoms), Li metal, Co
      metal, and O2 molecule.
  reference_answers:
  - key: output_artifact
    value: formation_energy.json
  - key: ef_range
    value:
      filename: formation_energy.json
      checks:
      - key: E_f_per_fu
        min: -5.0
        max: -2.0
  - key: turn_budget
    value:
      max: 10
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `formation_energy.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: ef_range
    criterion: Formation energy is in physically reasonable range (-2 to -5 eV/f.u.
      for LiCoO2). The correct answer is -3.5 eV/f.u. If agent miscounts formula
      units (e.g. Z=4 instead of Z=3 for R-3m Li3Co3O6 with 12 atoms), result would
      be +7.3 eV/f.u. which fails this range check.
    axis: correctness
    verify: text_file_numeric_range
    weight: 2.0
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
- id: SA_ne_conductivity_001_20260527
  capability: scientific_analysis
  domain: battery
  intent: Test whether agent correctly computes Nernst-Einstein ionic conductivity
    from MD-derived diffusion coefficients, with proper unit conversions (cm2/s to
    m2/s, S/m to mS/cm).
  human_prompt_seed: '以下是一组 LiPF6/EC/EMC 电解液体系 10 ns NVT MD 模拟的扩散系数结果，请计算
    Nernst-Einstein 离子电导率，评估结果的合理性。

    体系参数：

    - 离子对数：20 (20 Li+ + 20 PF6-)

    - 模拟盒子：立方，边长 3.0 nm

    - 温度：298.15 K

    - D(Li+) = 4.8 x 10^-7 cm2/s（MSD线性拟合，2-8 ns区间）

    - D(PF6-) = 3.2 x 10^-7 cm2/s（MSD线性拟合，2-8 ns区间）

    请输出 JSON 结果，包含：sigma_mScm（电导率，单位 mS/cm）和 assessment（对结果合理性的评估）。

    '
  tags:
  - char_electrochem
  data_files: []
  reference_answers:
  - key: sigma_value
    value:
      json_path: sigma_mScm
      target: 3.69
      tolerance: 0.5
  - key: turn_budget
    value:
      max: 10
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: sigma_value
    criterion: Nernst-Einstein conductivity is approximately 3.7 mS/cm. The correct
      formula is sigma = N*e^2*(D_plus + D_minus)/(kB*T*V), converted from S/m to
      mS/cm by multiplying by 10 (since 1 S/m = 10 mS/cm). Common error is using
      factor 0.1 instead of 10, giving 0.037 mS/cm (100x too low).
    axis: correctness
    verify: answer_json_numeric
    weight: 3.0
  - id: unit_conversion_correct
    criterion: Agent explicitly states or demonstrates the correct unit conversion
      chain (cm2/s to m2/s via 1e-4, then S/m to mS/cm via factor 10), and the final
      result is in the correct order of magnitude (1-10 mS/cm, not 0.01-0.1 mS/cm).
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: experimental_comparison
    criterion: Agent proactively compares the computed NE conductivity with experimental
      values for 1M LiPF6/EC-EMC (~8-10 mS/cm) and explains why the NE result is
      lower (ion correlation effects, finite-size box, or NE overestimation of
      transport number). The key test is whether agent independently recalls or
      searches for the experimental reference without being told.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
