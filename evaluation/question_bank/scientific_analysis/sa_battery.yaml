- id: SA_pymatgen_007_20250618
  capability: scientific_analysis
  domain: battery
  intent: Implement a structural matching algorithm using pymatgen to classify whether the anion sublattice
    of a given lithium sulfide crystal structure most closely matches a bcc, fcc, or hcp framework.
  human_prompt_seed: Write a Python script (save as match_anion_framework.py) that uses pymatgen to determine
    whether the sulfur anion sublattice of a given lithium sulfide crystal structure most closely matches
    a bcc, fcc, or hcp framework. The script should read a CIF file, extract only the S atom positions,
    compute the RMS deviation from ideal bcc/fcc/hcp lattices under affine transformations, and output
    the best-matching framework type with its lattice length deviation (σ_l) and angle deviation (σ_θ).
    Use tolerances of 5° for angles and 20% for lattice lengths. Run the script on both provided structure
    files (li2_s_cif.cif and li10gep2s12_cif.cif) and save results to matching_results.json.
  tags: []
  data_files:
  - key: li2s_structure
    path: li2_s_cif.cif
    oss_url: ''
    description: CIF file for Li2S (rock-salt structure, fcc sulfur sublattice). Used as test input for
      the structural matching algorithm.
  - key: li10gep2s12_structure
    path: li10gep2s12_cif.cif
    oss_url: ''
    description: CIF file for Li10GeP2S12 (LGPS), known to have a bcc-like sulfur sublattice. Used as
      test input.
  reference_answers:
