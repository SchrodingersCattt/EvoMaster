  intent: Compute the Madelung field at the transition metal (Fe) and alkali (Li) sites of a LiFePO4 crystal
    structure using Ewald summation with formal ionic charges, then estimate the cell voltage using the
    paper's linear proportionality relation.
  human_prompt_seed: Retrieve the LiFePO4 olivine structure from the structure database, then compute
    the Madelung potential (in eV/|e| or equivalent units) at the Fe site and the Li site using Ewald
    summation with formal ionic charges (Li+1, Fe+2, P+5, O-2). Then estimate the cell voltage versus
    Li/Li+ using the relation V_cell ∝ |M_Fe + M_Li|. Write a Python script that performs the calculation
    and outputs the results. Save the script as madelung_calc.py and the results as madelung_results.txt.
