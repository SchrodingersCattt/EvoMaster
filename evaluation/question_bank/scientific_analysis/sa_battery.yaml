      pattern: li2_s.*fcc
      filename: matching_results.json
  - key: lgps_classification
    value:
      flags:
      - Li10GeP2S12 sulfur sublattice classified as bcc
      pattern: li10gep2s12.*bcc
      filename: matching_results.json
  - key: rms_deviation
    value:
      flags:
      - Output includes RMS deviation metric for the matching
      pattern: rms|deviation|sigma
      filename: matching_results.json
  - key: grounding_source
