version: v5
capability: scientific_analysis
domain: polymer
questions:
- id: pl_donor_20260422
  capability: scientific_analysis
  domain: polymer
  intent: Pre-screen PM6, PTB7-Th, D18, and P3HT donor polymers for a Y6-like acceptor window
    using curated oligomer, conformational, and ranking data.
  human_prompt_seed: '文件 `donor_prescreen_bundle.json` 提供了 PM6、PTB7-Th、D18 和 P3HT 四类给体聚合物的低聚体建模、量化、构象采样和简化
    ranking 结果。

    请完成一个给体预筛选报告：

    1. 比较 HOMO/LUMO、带隙、主链扭转角和平面性；

    2. 结合 1/n 外推结果，判断哪些体系更适合与 Y6 类受体匹配；

    3. 输出最终 shortlist，并分别说明“综合最优”和“高 Voc 候选”；

    4. 写出至少一个不确定性来源。

    '
  tags:
  - mat_polymer
  data_files:
  - key: donor_bundle
    path: data/pl_donor/donor_prescreen_bundle.json
    description: Curated donor-polymer bundle with oligomer-level electronic structure, torsional
      descriptors, extrapolated gaps, and ranking metrics.
  reference_answers:
  - key: best_candidate
    value: D18
  - key: d18_gap_extrapolated_eV
    value: 1.84
    tolerance: 0.08
  - key: pm6_homo_eV
    value: -5.45
    tolerance: 0.1
  - key: required_fields
    value:
    - ranking_table
    - gap_extrapolation
    - conformational_note
    - shortlist
    - uncertainty_note
  - key: grounding_source
    value:
      filename: donor_prescreen_bundle.json
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: d18_gap_extrapolated_eV
    criterion: D18 extrapolated polymer-limit gap is reported within tolerance of the curated
      value (~1.84 eV).
    axis: correctness
    verify: numerical_range
  - id: pm6_homo_eV
    criterion: PM6 HOMO is reported within tolerance of the curated oligomer/QM value (~-5.45
      eV).
    axis: correctness
    verify: numerical_range
  - id: shortlist_correctness
    criterion: Final shortlist identifies D18 as the best-balanced overall donor and places
      PM6 ahead of PTB7-Th and P3HT for the specified Y6-like acceptor window.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes a ranking table, band-gap extrapolation discussion, conformational-planarity
      note, final shortlist, and at least one uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Conclusions are explicitly tied to the provided HOMO/LUMO, extrapolated gap,
      and torsional descriptors from donor_prescreen_bundle.json rather than literature recall
      alone.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Completes donor pre-screening in a linear evidence-synthesis workflow without
      redundant analysis loops.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: pl_membrane_20260422
  capability: scientific_analysis
  domain: polymer
  intent: Compare PIM-1, Matrimid, and 6FDA-DAM membranes for CO2/N2 separation by integrating
    solubility, diffusivity, free-volume, and ranking metrics.
  human_prompt_seed: '文件 `membrane_screening_bundle.json` 汇总了 PIM-1、Matrimid 和 6FDA-DAM 三类聚合物膜在
    CO2/N2 分离中的中间数据。

    请完成一份膜材料筛选报告：

    1. 计算或核对各体系的 CO2 permeability 与 CO2/N2 selectivity；

    2. 区分哪些优势来自高溶解度，哪些来自高扩散性；

    3. 结合自由体积和官能团相互作用解释材料差异；

    4. 给出最适合平衡通量与选择性的候选。

    '
  tags:
  - phy_md
  data_files:
  - key: membrane_bundle
    path: data/pl_membrane/membrane_screening_bundle.json
    description: Membrane-screening bundle with solubility, diffusivity, permeability, selectivity,
      and free-volume descriptors for CO2/N2 separation.
  reference_answers:
  - key: best_balanced_candidate
    value: 6FDA-DAM
  - key: pim1_permeability_barrer
    value: 5400.0
    tolerance: 250.0
  - key: dam_selectivity
    value: 28.0
    tolerance: 2.0
  - key: required_fields
    value:
    - permeability_table
    - selectivity_table
    - tradeoff_discussion
    - free_volume_note
    - recommendation
  - key: grounding_source
    value:
      filename: membrane_screening_bundle.json
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: pim1_permeability_barrer
    criterion: PIM-1 CO2 permeability is reported within tolerance of the curated value (~5400
      Barrer).
    axis: correctness
    verify: numerical_range
  - id: dam_selectivity
    criterion: 6FDA-DAM CO2/N2 selectivity is reported within tolerance of the curated value
      (~28).
    axis: correctness
    verify: numerical_range
  - id: recommendation_correctness
    criterion: Final recommendation identifies 6FDA-DAM as the best balanced membrane, while
      recognizing that PIM-1 has the highest throughput.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes permeability and selectivity tables, trade-off discussion,
      free-volume note, and a clear recommendation.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer uses the provided solubility, diffusivity, permeability, and free-volume
      evidence from membrane_screening_bundle.json rather than generic membrane heuristics
      alone.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Completes the membrane comparison without redundant reformulation and clearly
      separates transport and sorption effects.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
