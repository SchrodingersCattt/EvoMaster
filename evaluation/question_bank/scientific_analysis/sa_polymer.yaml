version: v5
capability: scientific_analysis
domain: polymer
questions:
- id: pl_donor_20260422
  capability: scientific_analysis
  domain: polymer
  intent: Pre-screen PM6, PTB7-Th, D18, and P3HT donor polymers for a Y6-like acceptor window
    using curated oligomer, conformational, and ranking data.
  human_prompt_seed: '文件 `donor_prescreen_bundle.json` 提供了 PM6、PTB7-Th、D18 和 P3HT 四类给体聚合物的低聚体建模、量化、构象采样和简化
    ranking 结果。

    请完成一个给体预筛选报告：

    1. 比较 HOMO/LUMO、带隙、主链扭转角和平面性；

    2. 结合 1/n 外推结果，判断哪些体系更适合与 Y6 类受体匹配；

    3. 输出最终 shortlist，并分别说明“综合最优”和“高 Voc 候选”；

    4. 写出至少一个不确定性来源。

    '
  tags: []
  data_files:
  - key: donor_bundle
    path: data/pl_donor/donor_prescreen_bundle.json
    description: Curated donor-polymer bundle with oligomer-level electronic structure, torsional
      descriptors, extrapolated gaps, and ranking metrics.
  reference_answers:
  - key: best_candidate
    value: D18
  - key: d18_gap_extrapolated_eV
    value: 1.84
    tolerance: 0.08
  - key: pm6_homo_eV
    value: -5.45
    tolerance: 0.1
  - key: required_fields
    value:
    - ranking_table
    - gap_extrapolation
    - conformational_note
    - shortlist
    - uncertainty_note
  - key: grounding_source
    value:
      filename: donor_prescreen_bundle.json
  - key: turn_budget
    value:
      max: 24
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: d18_gap_extrapolated_eV
    criterion: D18 extrapolated polymer-limit gap is reported within tolerance of the curated
      value (~1.84 eV).
    axis: correctness
    verify: numerical_range
  - id: pm6_homo_eV
    criterion: PM6 HOMO is reported within tolerance of the curated oligomer/QM value (~-5.45
      eV).
    axis: correctness
    verify: numerical_range
  - id: shortlist_correctness
    criterion: Final shortlist identifies D18 as the best-balanced overall donor and places
      PM6 ahead of PTB7-Th and P3HT for the specified Y6-like acceptor window.
    axis: correctness
    verify: llm_binary_judge
  - id: required_fields
    criterion: Report includes a ranking table, band-gap extrapolation discussion, conformational-planarity
      note, final shortlist, and at least one uncertainty note.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Conclusions are explicitly tied to the provided HOMO/LUMO, extrapolated gap,
      and torsional descriptors from donor_prescreen_bundle.json rather than literature recall
      alone.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: Completes donor pre-screening in a linear evidence-synthesis workflow without
      redundant analysis loops.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SA_solubility_exp_filter_001_20260531
  capability: scientific_analysis
  domain: polymer
  intent: Curate a literature-backed experimental solubility dataset from a mixed provenance table and summarize which records are suitable for modeling.
  human_prompt_seed: '工作区中有一份小分子水溶解度候选表 `solubility_records.csv`，里面来自不同数据库、工作表和内部整理脚本。

    我想先拿它整理一个“文献/数据库实验值”训练集草案，用于后续做小分子溶解度预测。请检查每条记录的来源说明，保留适合当作实验标签的数据，并把不适合进入这个训练集的记录另行说明。

    请写出：

    1. `experimental_solubility_dataset.csv`：清洗后的训练集草案；
    2. `solubility_dataset_summary.json`：包含 `n_total_input`、`n_kept`、`n_excluded` 和 `excluded_groups`；
    3. `solubility_data_report.md`：简要说明筛选依据，并列出后续建模报告应该包含的评估指标和图表。

    这一步不需要真正训练模型。'
  tags:
  - analysis_data
  data_files:
  - key: solubility_records
    path: data/SA_solubility_exp_filter_001_20260531/solubility_records.csv
    oss_url: ''
    description: Candidate solubility records with mixed source and provenance notes.
  reference_answers:
  - key: filtered_dataset_artifact
    value: experimental_solubility_dataset.csv
  - key: summary_artifact
    value: solubility_dataset_summary.json
  - key: report_artifact
    value: solubility_data_report.md
  - key: kept_count
    value:
      filename: solubility_dataset_summary.json
      key: n_kept
      expected: 6
      tolerance: 0
  - key: excluded_count
    value:
      filename: solubility_dataset_summary.json
      key: n_excluded
      expected: 4
      tolerance: 0
  - key: filtered_csv_excludes_estimates
    value:
      filename: experimental_solubility_dataset.csv
      pattern: (?i)\b(estimated|GSE|ModelX|derived|secondary compilation|predicted)\b
  - key: report_explains_exclusions
    value:
      filename: solubility_data_report.md
      tokens:
      - GSE
      - internal_qspr
      - temperature extrapolation
      - experimental
      - metrics
      - plot
      flags: i
  - key: grounding_source
    value:
      filename: solubility_records.csv
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: filtered_dataset_artifact
    criterion: '[Must] `experimental_solubility_dataset.csv` is written to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: summary_artifact
    criterion: '[Must] `solubility_dataset_summary.json` is written to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: report_artifact
    criterion: '[Must] `solubility_data_report.md` is written to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: kept_count
    criterion: '[Must] The summary reports exactly 6 kept experimental records.'
    axis: correctness
    verify: json_file_numeric_range
    weight: 1.2
  - id: excluded_count
    criterion: '[Must] The summary reports exactly 4 excluded non-experimental records.'
    axis: correctness
    verify: json_file_numeric_range
    weight: 1.2
  - id: filtered_csv_excludes_estimates
    criterion: '[Must] The filtered CSV does not contain estimated/GSE/ModelX/derived records or labels.'
    axis: correctness
    verify: text_file_regex_absent
    weight: 1.5
  - id: report_explains_exclusions
    criterion: '[Must] The report explains why the GSE worksheet records, internal QSPR model output, and temperature-extrapolated secondary record are not suitable as experimental training labels, and lists expected modeling report contents such as metrics and plots.'
    axis: grounding
    verify: text_file_contains_all
    weight: 1.2
  - id: grounding_source
    criterion: '[Must] Data filtering decisions are grounded in the `source`, `provenance`, and `curation_comment` columns of `solubility_records.csv`, not in molecule names or guessed database reputation alone.'
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
