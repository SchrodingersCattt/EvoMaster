version: v5
capability: execution_contract
domain: agnostic
questions:
- id: EC_bohrium_lammps_submit_config_001_20260424v1
  capability: execution_contract
  domain: agnostic
  intent: Generate a Bohrium submit request JSON for a LAMMPS job using the request-consistent submission defaults.
  human_prompt_seed: |
    帮我写一个 Bohrium 提交 JSON，跑 LAMMPS，输入文件是 `relax.lammps`，保存成 `submit_request.json`。不用真提交。
  tags:
  - wf_inputs
  - phy_md
  data_files: []
  reference_answers:
  - key: submit_artifact
    value: submit_request.json
  - key: required_fields
    value:
      filename: submit_request.json
      tokens:
      - '"action": "submit"'
      - '"image": "registry.dp.tech/dptech/lammps-agent:03810da8"'
      flags: i
  - key: cmd_exact
    value:
      filename: submit_request.json
      pattern: '"cmd"\s*:\s*"lmp\s+-in\s+relax\.lammps\s+>\s+log\s+2>&1"'
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: submit_artifact
    criterion: Agent writes submit_request.json to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_fields
    criterion: submit_request.json contains the expected Bohrium submit action and image field for the requested software task.
    axis: correctness
    verify: text_file_contains_all
  - id: cmd_exact
    criterion: submit_request.json uses the expected Bohrium command form for the requested software task.
    axis: correctness
    verify: text_file_regex
  - id: grounded_in_request
    criterion: The produced submit_request.json is consistent with the user request and does not fabricate unrelated submission intent or mismatched software context.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration stays within benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
