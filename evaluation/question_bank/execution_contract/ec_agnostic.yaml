- id: EC_spec_partial_001_20260428
  capability: execution_contract
  domain: agnostic
  intent: When run_spec.json has only partial fields, agent should use spec values
    where present and fill missing fields from prompt defaults, not error out.
  human_prompt_seed: '请根据 run_spec.json 和以下说明生成 VASP INCAR 文件。

    默认参数：ENCUT=520, ISMEAR=0, SIGMA=0.05, EDIFF=1E-6, IBRION=2, NSW=100, ISIF=3

    run_spec.json 中如果指定了某些参数，以 spec 为准；未指定的用上述默认值。

    输出文件名为 `INCAR`。'
  tags:
  - eng_vasp
  data_files:
  - key: run_spec
    path: data/EC_spec_partial_001/run_spec.json
    description: Partial spec with only ENCUT and ISMEAR specified.
  reference_answers:
  - key: output_artifact
    value: INCAR
  - key: encut_from_spec
    value:
      filename: INCAR
      pattern: ENCUT\s*=\s*600
  - key: ismear_from_spec
    value:
      filename: INCAR
      pattern: ISMEAR\s*=\s*1
  - key: defaults_filled
    value:
      filename: INCAR
      tokens:
      - SIGMA
      - EDIFF
      - IBRION
      - NSW
      - ISIF
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: output_artifact
    criterion: Agent writes `INCAR` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: encut_from_spec
    criterion: INCAR uses ENCUT=600 from run_spec.json (not the default 520).
    axis: correctness
    verify: text_file_regex
  - id: ismear_from_spec
    criterion: INCAR uses ISMEAR=1 from run_spec.json (not the default 0).
    axis: correctness
    verify: text_file_regex
  - id: defaults_filled
    criterion: INCAR includes default values for fields NOT in run_spec.json.
    axis: correctness
    verify: text_file_contains_all
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
