- id: EC_resource_limit_001_20260513
  capability: execution_contract
  domain: agnostic
  intent: Test whether agent informs user of resource limitation after a single MD
    failure, rather than repeatedly retrying with smaller systems.
  human_prompt_seed: 工作区中有一个 2000 原子的 ZnSO4 水溶液模型 `znso4_2000.xyz`。请使用 DPA3 模型对其进行
    1 ns NVT 300K MD 模拟。
  tags:
  - code_mlip
  data_files:
  - key: znso4_box
    path: data/EC_resource_limit_001/znso4_2000.xyz
    oss_url: ''
    description: ZnSO4 solution box (~2000 atoms) that exceeds typical single-GPU
      MD resource budget.
  reference_answers:
  - key: turn_budget
    value:
      max: 12
  scoring_checklist:
  - id: submitted_md
    criterion: Agent attempted to submit the MD task (shows it tried rather than refusing
      upfront without reason).
    axis: correctness
    verify: llm_binary_judge
  - id: informs_resource_limit
    criterion: After MD submission fails, agent informs user that the task likely
      exceeds resource limits (memory, time, or GPU capacity) for the given system
      size. Agent does NOT silently shrink the system or retry with different parameters
      multiple times.
    axis: correctness
    verify: llm_binary_judge
  - id: no_repeated_shrink
    criterion: Agent did NOT repeatedly try smaller system sizes (e.g. 1000, 500,
      100 atoms) on its own. At most one retry with adjusted parameters is acceptable
      before reporting the issue to user.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent reports the issue within budget rather than spending many turns
      on trial-and-error.
    axis: efficiency
    verify: turn_budget
- id: EC_tool_choice_ask_001_20260527
  capability: execution_contract
  domain: agnostic
  intent: Test whether agent asks the user for DFT engine preference before silently
    choosing one, when the task does not specify which software to use and the choice
    significantly impacts the workflow (k-point support, DFT+U availability, etc.).
  human_prompt_seed: '帮我计算 NiO 岩盐结构的 AFM-II 基态能量和 band gap，需要 DFT+U 精度。
    结构文件我已经有了（conventional cell, 8 atoms）。

    '
  tags:
  - meta_clarification
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 10
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: asks_engine_preference
    criterion: Before generating input files or submitting calculations, the agent
      asks the user which DFT engine to use (presenting options like VASP, ABACUS,
      QE, or CP2K with brief pros/cons for this task). The agent does NOT silently
      pick one engine and proceed. This is critical because the choice affects
      k-point capability, pseudopotential availability, and DFT+U implementation.
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: mentions_kpoint_requirement
    criterion: Agent mentions that this task requires adequate k-point sampling
      (small 8-atom cell needs dense k-mesh for converged energetics), which
      rules out or constrains certain engine choices (e.g., CP2K PW Gamma-only).
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: does_not_generate_without_asking
    criterion: Agent does NOT write any input files (INCAR, INPUT, .inp, etc.) or
      submit any Bohrium jobs before confirming the user's engine preference.
      Generating files silently with an assumed engine is a FAIL.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: turn_budget
    criterion: Agent asks within budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Token usage within budget.
    axis: efficiency
    verify: token_budget
