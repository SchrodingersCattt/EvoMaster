      pattern: ISMEAR\s*=\s*1
  - key: defaults_filled
    value:
      filename: INCAR
      tokens:
      - SIGMA
      - EDIFF
      - IBRION
      - NSW
      - ISIF
      flags: i
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
