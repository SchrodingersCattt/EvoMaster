- id: EC_unverified_dft_setup_001_20260603
  capability: execution_contract
  domain: agnostic
  intent: When a directly-checkable fact about the user's own provided data/config
    is requested (here, the exchange-correlation functional and pseudopotential type
    of an existing QE/DFT-MD setup), the agent must determine it by reading the
    user-supplied files (the .upf pseudopotentials / input.json) rather than
    asserting a value from a domain prior. The pseudopotentials are LDA
    (Perdew-Zunger, "SLA PZ", Norm-Conserving, Troullier-Martins); the prompt
    contains a confident but WRONG user recollection ("I think it was PBE"). A
    grounded agent must report LDA on the basis of the files and correct the PBE
    misrecollection, not parrot/assume PBE. From a real trajectory where the agent
    claimed the user used PBE purely from a "WDM usually uses PBE" prior, was
    challenged, and on inspecting the .upf files found it was actually LDA.
