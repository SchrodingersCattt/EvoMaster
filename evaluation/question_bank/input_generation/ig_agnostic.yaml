- id: IG_abacus_008_20260412
  capability: input_generation
  domain: agnostic
  intent: Generate ABACUS PW SCF input combining dipole correction with compensating charge
    for a charged H2O slab, including gate-plane and barrier parameters.
  human_prompt_seed: '工作区中提供了带真空区的 H2O 结构。


    请准备“偶极修正 + 补偿电荷 + 势垒”场景下的 ABACUS 输入：

    1) 生成 PW-SCF 的 INPUT，并启用偶极修正与补偿电荷控制。

