  capability: input_generation
  domain: agnostic
  intent: Generate a Python script that computes the three components of the Ewald sum (constant term
    Ec, real-space term Er, and reciprocal-space term Ek) for a charge-neutral point-charge configuration
    on an fcc lattice, and verifies that Ek is negligible for low-energy structures as described in Ceder
    et al. 1995.
  human_prompt_seed: Using the lattice configuration in fcc_lattice_config.json, write a Python script
    (ewald_sum.py) that computes the three Ewald sum components (Ec, Er, Ek) for the given point-charge
    configuration on an fcc lattice. Use α = 1.41/d where d is the nearest-neighbor distance. Truncate
    the real-space sum at the 15th-nearest-neighbor shell. Print each component and the total energy in
    units of q²/(8πε₀d). Save the results to ewald_results.json.
  tags: []
  data_files:
  - key: lattice_params
    path: fcc_lattice_config.json
    oss_url: ''
    description: JSON config specifying fcc lattice parameter, supercell size (2x2x2 conventional cells
      = 32 atoms), alternating +1/-1 charge assignment, and Ewald parameter alpha = 1.41/d where d is
      nearest-neighbor distance.
  reference_answers:
  - key: artifact_script
    value: ewald_sum.py
  - key: artifact_results
    value: ewald_results.json
  - key: ek_small_for_low_energy
    value:
      checks:
      - key: Ek
        max: 0.05
        min: -0.05
        allow_missing_key: false
      filename: ewald_results.json
  - key: total_energy_negative
    value:
      checks:
      - key: E_total
        max: 0.0
        min: -2.0
        allow_missing_key: false
      filename: ewald_results.json
  - key: alpha_value
