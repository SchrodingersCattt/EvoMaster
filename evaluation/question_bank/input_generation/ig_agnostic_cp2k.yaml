version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_cp2k_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate a CP2K DFT single-point energy input file for a simple bulk system.
  human_prompt_seed: '请为 MgO 岩盐结构（a=4.212 Å）生成 CP2K DFT 单点能计算输入文件，要求：

    1. 使用 PBE 泛函，DZVP 基组

    2. 平面波截断能 400 Ry

    3. SCF 收敛精度 1.0E-6

    4. 使用 Goedecker 赝势（GTH-PBE）

    输出文件名为 `cp2k.inp`。'
  tags:
  - eng_cp2k
  data_files: []
  reference_answers:
  - key: input_artifact
    value: cp2k.inp
  - key: required_keywords
    value:
      filename: cp2k.inp
      tokens:
      - FORCE_EVAL
      - DFT
      - PBE
      - SCF
      - CUTOFF
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `cp2k.inp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The input file contains essential CP2K sections and keywords (FORCE_EVAL,
      DFT, PBE, SCF, CUTOFF).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The input file uses physically reasonable parameters for MgO (PBE functional,
      DZVP basis, GTH pseudopotentials, cutoff ~400 Ry, SCF convergence 1E-6).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Parameters match the user request and standard CP2K MgO calculation
      practice.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_cp2k_002_20260508
  capability: input_generation
  domain: agnostic
  intent: Validate and package an already complete CP2K input without rerendering it.
  human_prompt_seed: '工作区里已有 `cp2k_ready.inp`，它是用户准备好的 CP2K 输入。

    请对这个 ready-to-run user input 做提交前检查并整理成运行目录：

    1. 不要重新生成或覆盖 `cp2k_ready.inp`，只复制到 `run_cp2k_ready/input.inp`。

    2. Validate the existing CP2K input before execution，并把 machine-readable diagnostics 保存为 `run_cp2k_ready/diagnosis.json`。

    3. 写 `run_cp2k_ready/input_prep_manifest.json`。它必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，`submit_ready` 必须是 JSON boolean。

    4. `submit_ready` 只能在没有 unhandled errors or blockers 时为 true；本题只准备目录，不实际提交，也不要臆造提交资源默认值。

    最终只交付 `run_cp2k_ready/` 目录和简短说明。'
  tags:
  - eng_cp2k
  data_files:
  - key: cp2k_ready
    path: data/IG_cp2k_002_20260508/cp2k_ready.inp
    oss_url: ''
    description: Complete CP2K input that should be validated and packaged without rerendering.
  reference_answers:
  - key: packaged_input_artifact
    value: input.inp
  - key: diagnosis_artifact
    value: diagnosis.json
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      schema:
        type: object
        required:
        - software
        - task
        - input_dir
        - generated_files
        - user_provided_files
        - diagnostics
        - auxiliary_files
        - assumptions
        - submit_ready
        - bohrium_command
  - key: ready_input_not_rerendered
    value:
      filename: input.inp
      tokens:
      - PROJECT mgo_ready
      - CUTOFF 400
      - EPS_SCF 1.0E-6
      - DZVP-MOLOPT-SR-GTH
      flags: i
  - key: manifest_submit_ready_true
    value:
      filename: input_prep_manifest.json
      pattern: '"submit_ready"\s*:\s*true'
      flags: i
  - key: manifest_diagnostics_json
    value:
      filename: input_prep_manifest.json
      pattern: '"diagnostics"\s*:\s*\{[\s\S]*"file"\s*:\s*"diagnosis\.json"'
      flags: i
  - key: output_grounding
    value: The final answer states that the provided CP2K input was packaged without rerendering, diagnostics were saved, the manifest gate was set, and no job was submitted.
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 16000
  scoring_checklist:
  - id: packaged_input_artifact
    criterion: The complete ready-to-run CP2K input is packaged as `run_cp2k_ready/input.inp`.
    axis: correctness
    verify: artifact_exists
  - id: diagnosis_artifact
    criterion: The existing engine input is validated before execution and machine-readable diagnostics are saved as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The run directory includes `input_prep_manifest.json` with all required manifest fields.
    axis: correctness
    verify: json_file_schema
  - id: ready_input_not_rerendered
    criterion: The agent does not render over a complete ready input when the user asked only to package and validate it; key CP2K values from `cp2k_ready.inp` are preserved.
    axis: correctness
    verify: text_file_contains_all
  - id: manifest_submit_ready_true
    criterion: The manifest sets `submit_ready` to true only after diagnosis reports no unhandled errors or blockers.
    axis: correctness
    verify: text_file_regex
  - id: manifest_diagnostics_json
    criterion: The manifest records the saved JSON diagnostics file.
    axis: correctness
    verify: text_file_regex
  - id: output_grounding
    criterion: The final answer accurately states that the provided CP2K input was packaged without rerendering, diagnostics were saved, the manifest gate was set, and no job was submitted.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_cp2k_003_20260508
  capability: input_generation
  domain: agnostic
  intent: Diagnose a CP2K input with physically invalid settings and block submission.
  human_prompt_seed: '工作区里有 `cp2k_needs_fix.inp`。请做提交前诊断，不要提交作业：

    1. 检查这个 CP2K input，并把 machine-readable diagnostics 保存为 `diagnosis.json`。

    2. Treating parser success as physical validity 是错误做法；请检查 CUTOFF 和 EPS_SCF 是否有物理意义。

    3. 如果 diagnosis has unhandled errors or blockers，必须写 `input_prep_manifest.json` 且 `submit_ready=false`。manifest 必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，blocked 时 `bohrium_command` 用空字符串。

    4. 不要在 blockers 未处理时提交；不要臆造 Bohrium cmd/image/machine。

    输出 `diagnosis.json`、`input_prep_manifest.json` 和简短修复说明。'
  tags:
  - eng_cp2k
  data_files:
  - key: bad_cp2k_input
    path: data/IG_cp2k_003_20260508/cp2k_needs_fix.inp
    oss_url: ''
    description: CP2K input with intentionally poor physical settings for diagnosis.
  reference_answers:
  - key: diagnosis_artifact
    value: diagnosis.json
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      schema:
        type: object
        required:
        - software
        - task
        - input_dir
        - generated_files
        - user_provided_files
        - diagnostics
        - auxiliary_files
        - assumptions
        - submit_ready
        - bohrium_command
  - key: manifest_submit_ready_false
    value:
      filename: input_prep_manifest.json
      pattern: '"submit_ready"\s*:\s*false'
      flags: i
  - key: answer_mentions_blockers
    value: The final answer identifies unhandled errors or blockers and says submission is blocked until they are fixed.
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: diagnosis_artifact
    criterion: The agent checks the CP2K input and saves machine-readable diagnostics as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The agent writes `input_prep_manifest.json` with all required fields even when the input is not submit-ready.
    axis: correctness
    verify: json_file_schema
  - id: manifest_submit_ready_false
    criterion: The manifest sets `submit_ready` to false when diagnosis has unhandled errors or blockers.
    axis: correctness
    verify: text_file_regex
  - id: answer_mentions_blockers
    criterion: The answer handles diagnosis errors or blockers before submission, does not treat parser success as physical validity, and refuses to submit while blockers remain.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
