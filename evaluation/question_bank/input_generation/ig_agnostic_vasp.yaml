- id: IG_incar_001_20260504
  capability: input_generation
  domain: agnostic
  intent: 'Generate VASP INCAR for a band structure calculation of Lu4N4. Non-self-consistent run reading existing charge
    density (ICHARG=11), with projected band output (LORBIT=11).

    '
  human_prompt_seed: 为 Lu4N4 体系生成一个能带结构计算的 VASP INCAR 文件。要求：非自洽计算，从已有电荷密度读取，输出投影能带。将完整的
    INCAR 写入当前目录下的 `INCAR` 文件。
  tags:
  - vasp
  - phy_electronic
  reference_answers:
  - key: param_ENCUT
    value:
      filename: INCAR
      checks:
      - key: ENCUT
        expected: 520
        tolerance: 100
  - key: param_ICHARG
    value:
      filename: INCAR
      tokens:
      - ICHARG = 11
  - key: param_LORBIT
    value:
      filename: INCAR
      tokens:
      - LORBIT = 11
  - key: param_LWAVE
    value:
      filename: INCAR
      tokens:
      - LWAVE = .FALSE.
  - key: incar_obvious_issues
    value:
      filename: INCAR
  - key: turn_budget
    value:
      max: 8
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: param_ENCUT
    criterion: '[Must] Token retrieval from `INCAR`: contains `ENCUT` and numeric value is in a broad acceptable range around 520 eV (e.g., 350-800 eV).'
    axis: correctness
    verify: text_file_numeric_range
  - id: param_ICHARG
    criterion: '[Must] Token retrieval from `INCAR`: contains `ICHARG = 11` (allow spaces/case/formatting variants).'
    axis: correctness
    verify: text_file_contains_all
  - id: param_LORBIT
    criterion: '[Must] Token retrieval from `INCAR`: contains `LORBIT = 11` (allow spaces/case/formatting variants).'
    axis: correctness
    verify: text_file_contains_all
  - id: param_LWAVE
    criterion: '[Must] Token retrieval from `INCAR`: contains `LWAVE = .FALSE.` (or equivalent FALSE notation).'
    axis: correctness
    verify: text_file_contains_all
  - id: incar_obvious_issues
    criterion: Read the full `INCAR` and judge whether there is any obvious contradiction or major setup mistake for a non-self-consistent projected band-structure run; do not fail on stylistic differences.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The generated INCAR is grounded in the provided prompt data (material system, calculation type, element
      order) rather than hallucinated. Judge solely from the final answer and stated file content; do not fail because the
      tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: The agent produced the INCAR efficiently without unnecessary tool calls, redundant queries, or irrelevant exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
