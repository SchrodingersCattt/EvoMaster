version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_dpgen_hof_energetic_param_001_20260614
  capability: input_generation
  domain: agnostic
  intent: Prepare DP-GEN param and machine inputs plus an init-dataset plan for an anonymized organic-framework energetic-molecule DeePMD potential workflow.
  human_prompt_seed: "我想用 DP-GEN 给一个有机框架@含能分子体系构造 DeePMD 势函数，温度 300–4000 K、压强 0–120 GPa，exploration 用 LAMMPS、FP 用 CP2K，没定的文件位置可用 `/path/to/...` 占位；请先准备 `param.json`、`machine.json` 和 `init_dataset_plan.md`。"
  tags:
  - code_mlip
  - eng_lammps
  - eng_cp2k
  data_files:
  - key: param_template
    path: data/IG_dpgen_hof_energetic_param_001_20260614/param.template.json
    oss_url: ''
    description: Canonical DP-GEN param template copied from _tmp/params.eval.json.
  - key: machine_template
    path: data/IG_dpgen_hof_energetic_param_001_20260614/machine.template.json
    oss_url: ''
    description: Canonical DP-GEN machine template copied from _tmp/machine.eval.json.
  - key: project_note
    path: data/IG_dpgen_hof_energetic_param_001_20260614/project_note.md
    oss_url: ''
    description: Anonymized target workflow note.
  reference_answers:
  - key: param_artifact
    value: param.json
  - key: machine_artifact
    value: machine.json
  - key: init_plan_artifact
    value: init_dataset_plan.md
  - key: param_core_tokens
    value:
      filename: param.json
      tokens:
      - se_atten_v2
      - model_devi_jobs
      - fp_style
      - cp2k
      - numb_models
      flags: i
  - key: machine_core_tokens
    value:
      filename: machine.json
      tokens:
      - train
      - model_devi
      - fp
      - cp2k
      flags: i
  - key: init_plan_tokens
    value:
      filename: init_dataset_plan.md
      tokens:
      - 300
      - 4000
      - 120
      - LAMMPS
      - CP2K
      - init
      flags: i
  - key: validation_report_schema
    value:
      filename: validation_report.json
      required_keys:
      - commands
      - files_checked
      - tool_available
      - diagnostics
      - expected_path_warnings_ignored
      - blocking_findings
  - key: path_placeholders_reported
    value:
      filename: validation_report.json
      pattern: path/to|/path/to|placeholder|占位|not\s+found|missing.*path|non.?blocking|advisory|needs.?replace
      flags: is
  - key: no_real_submit
    value: Agent prepares DP-GEN input files and an init dataset plan, but does not run DP-GEN, CP2K, LAMMPS, SSH, or Bohrium submission.
  - key: turn_budget
    value:
      max: 16
  scoring_checklist:
  - id: param_artifact
    criterion: Agent writes param.json.
    axis: correctness
    verify: artifact_exists
  - id: machine_artifact
    criterion: Agent writes machine.json.
    axis: correctness
    verify: artifact_exists
  - id: init_plan_artifact
    criterion: Agent writes init_dataset_plan.md.
    axis: correctness
    verify: artifact_exists
  - id: param_core_tokens
    criterion: param.json keeps DP-GEN/DeepMD training, model deviation, and CP2K FP controls relevant to the request.
    axis: correctness
    verify: text_file_contains_all
  - id: machine_core_tokens
    criterion: machine.json keeps train, model_devi, and FP execution sections.
    axis: correctness
    verify: text_file_contains_all
  - id: init_plan_tokens
    criterion: init_dataset_plan.md covers the requested temperature/pressure ranges and LAMMPS/CP2K DP-GEN workflow.
    axis: correctness
    verify: text_file_contains_all
  - id: validation_report_schema
    criterion: validation_report.json is valid JSON with command, file, diagnostic, expected path-warning, and blocking-finding fields.
    axis: grounding
    verify: json_file_schema
  - id: path_placeholders_reported
    criterion: validation_report.json records placeholder path diagnostics as expected/non-blocking items.
    axis: grounding
    verify: text_file_regex
  - id: no_real_submit
    criterion: Agent only prepares inputs and plan; it does not run or claim real DP-GEN/CP2K/LAMMPS/SSH/Bohrium execution.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes input preparation within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: IG_dpgen_hof_energetic_review_002_20260614
  capability: input_generation
  domain: agnostic
  intent: Review a prefilled DP-GEN input package for an anonymized organic-framework energetic-molecule training workflow and produce missing pre-run checklist items.
  human_prompt_seed: "这份 DP-GEN 输入是给有机框架@含能分子体系训练 DeePMD 势函数用的，请帮我检查并补齐准备试跑前缺的清单，输出 `input_review.json` 和 `init_dataset_plan.md`。"
  tags:
  - code_mlip
  - eng_lammps
  - eng_cp2k
  data_files:
  - key: param_json
    path: data/IG_dpgen_hof_energetic_review_002_20260614/param.json
    oss_url: ''
    description: Prefilled DP-GEN param fixture.
  - key: machine_json
    path: data/IG_dpgen_hof_energetic_review_002_20260614/machine.json
    oss_url: ''
    description: Prefilled DP-GEN machine fixture.
  - key: project_note
    path: data/IG_dpgen_hof_energetic_review_002_20260614/project_note.md
    oss_url: ''
    description: Anonymized project note.
  reference_answers:
  - key: review_schema
    value:
      filename: input_review.json
      required_keys:
      - files_checked
      - diagnostics
      - missing_items
      - expected_path_warnings_ignored
      - decision
  - key: init_plan_artifact
    value: init_dataset_plan.md
  - key: review_mentions_inputs
    value:
      filename: input_review.json
      pattern: param\.json|machine\.json|init|dataset|path/to|/path/to
      flags: is
  - key: init_plan_tokens
    value:
      filename: init_dataset_plan.md
      tokens:
      - init
      - dataset
      - CP2K
      - LAMMPS
      - label
      flags: i
  - key: no_dataset_fabrication
    value: The init dataset plan lists required dataset classes and metadata without inventing actual existing file paths or labels beyond placeholders.
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: review_schema
    criterion: input_review.json is valid JSON with files_checked, diagnostics, missing_items, expected path warnings, and decision.
    axis: correctness
    verify: json_file_schema
  - id: init_plan_artifact
    criterion: Agent writes init_dataset_plan.md.
    axis: correctness
    verify: artifact_exists
  - id: review_mentions_inputs
    criterion: input_review.json covers both DP-GEN inputs and placeholder path status.
    axis: correctness
    verify: text_file_regex
  - id: init_plan_tokens
    criterion: init_dataset_plan.md covers init dataset, CP2K labeling, LAMMPS exploration, and labels.
    axis: correctness
    verify: text_file_contains_all
  - id: no_dataset_fabrication
    criterion: Agent does not fabricate concrete real dataset paths, labels, or paper-derived DFT settings that are not provided.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes review within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: IG_dpgen_fix_submit_error_param_003_20260614
  capability: input_generation
  domain: agnostic
  intent: Repair a DP-GEN param file that cannot be read before submission, preserving the original scientific settings.
  human_prompt_seed: "我提交 DP-GEN 前检查时报参数文件读不进去，请帮我修好并给出 `param.fixed.json` 和 `repair_notes.md`。"
  tags:
  - code_mlip
  data_files:
  - key: param_json
    path: data/IG_dpgen_fix_submit_error_param_003_20260614/param.json
    oss_url: ''
    description: DP-GEN param file with a controlled JSON syntax error.
  - key: machine_json
    path: data/IG_dpgen_fix_submit_error_param_003_20260614/machine.json
    oss_url: ''
    description: Valid DP-GEN machine fixture.
  - key: error_log
    path: data/IG_dpgen_fix_submit_error_param_003_20260614/dpgen_error.log
    oss_url: ''
    description: User-visible DP-GEN precheck error excerpt.
  reference_answers:
  - key: fixed_param_artifact
    value: param.fixed.json
  - key: fixed_param_schema
    value:
      filename: param.fixed.json
      required_keys:
      - type_map
      - mass_map
      - dp_compress
      - numb_models
      - model_devi_jobs
      - fp_style
  - key: repair_notes_artifact
    value: repair_notes.md
  - key: repair_notes_syntax
    value:
      filename: repair_notes.md
      pattern: JSON|syntax|parse|comma|逗号|格式|读不进去
      flags: is
  - key: preserves_settings
    value:
      filename: param.fixed.json
      pattern: se_atten_v2|cp2k|model_devi_jobs|numb_models
      flags: is
  - key: validation_report_schema
    value:
      filename: validation_report.json
      required_keys:
      - commands
      - files_checked
      - tool_available
      - diagnostics
      - expected_path_warnings_ignored
      - blocking_findings
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: fixed_param_artifact
    criterion: Agent writes param.fixed.json.
    axis: correctness
    verify: artifact_exists
  - id: fixed_param_schema
    criterion: param.fixed.json is valid JSON and retains core DP-GEN keys.
    axis: correctness
    verify: json_file_schema
  - id: repair_notes_artifact
    criterion: Agent writes repair_notes.md.
    axis: correctness
    verify: artifact_exists
  - id: repair_notes_syntax
    criterion: repair_notes.md explains a JSON syntax/parse formatting problem in user-facing terms.
    axis: correctness
    verify: text_file_regex
  - id: preserves_settings
    criterion: param.fixed.json preserves DP-GEN descriptor, CP2K FP, model-deviation, and model-count settings.
    axis: grounding
    verify: text_file_regex
  - id: validation_report_schema
    criterion: validation_report.json records validation diagnostics for the repair.
    axis: grounding
    verify: json_file_schema
  - id: turn_budget
    criterion: Agent completes param repair within the turn budget.
    axis: efficiency
    verify: turn_budget
