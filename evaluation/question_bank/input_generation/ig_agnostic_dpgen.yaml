version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_dpgen_dargs_waterbox_001_20260616
  capability: input_generation
  domain: agnostic
  intent: Generate DP-GEN param and machine JSON inputs for a water-box DeePMD/LAMMPS/VASP workflow from a short natural-language request.
  human_prompt_seed: '用 DP-GEN 从头开发一个水盒子的力场；DeepMD 训练、LAMMPS exploration、VASP FP，路径先占位。只输出 `param_output.json` 和 `machine_output.json`。

    输入文件：

    - `project_note.md`: `data/IG_dpgen_dargs_waterbox_001_20260616/project_note.md`'
  tags:
  - code_mlip
  - eng_lammps
  - eng_vasp
  data_files:
  - key: project_note
    path: data/IG_dpgen_dargs_waterbox_001_20260616/project_note.md
    oss_url: ''
    description: Water-box DP-GEN input-generation requirements.
  reference_answers:
  - key: param_output_artifact
    value: param_output.json
    workspace_resolve: root
  - key: machine_output_artifact
    value: machine_output.json
    workspace_resolve: root
  - key: param_output_dargs
    value:
      filename: param_output.json
      check: schema
      kind: param
      strict: false
  - key: machine_output_dargs
    value:
      filename: machine_output.json
      check: schema
      kind: machine
      strict: false
  - key: param_water_vasp_lammps
    value:
      filename: param_output.json
      tokens:
      - '"type_map"'
      - '"O"'
      - '"H"'
      - '"fp_style"'
      - '"vasp"'
      - '"model_devi_jobs"'
      - '"numb_models"'
      flags: is
  - key: machine_deepmd_lammps_vasp
    value:
      filename: machine_output.json
      tokens:
      - '"train"'
      - '"model_devi"'
      - '"fp"'
      - dp train
      - lmp
      - vasp
      flags: is
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: param_output_artifact
    criterion: Agent writes param_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: machine_output_artifact
    criterion: Agent writes machine_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: param_output_dargs
    criterion: param_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: machine_output_dargs
    criterion: machine_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: param_water_vasp_lammps
    criterion: param_output.json encodes water elements plus DP-GEN model-deviation and VASP FP settings.
    axis: correctness
    verify: text_file_contains_all
  - id: machine_deepmd_lammps_vasp
    criterion: machine_output.json includes train, LAMMPS model-deviation, and VASP FP execution sections.
    axis: correctness
    verify: text_file_contains_all
  - id: turn_budget
    criterion: Agent completes the input generation within the turn budget.
    axis: efficiency
    verify: turn_budget
- id: IG_dpgen_dargs_debug_002_20260616
  capability: input_generation
  domain: agnostic
  intent: Debug and minimally repair DP-GEN param and machine JSON files so both outputs pass official dargs schema validation.
  human_prompt_seed: 'DP-GEN 检查报错了，请按 `dpgen_error.log` 最小修改这两个输入，路径占位先保留。只输出修好的 `param_output.json` 和 `machine_output.json`。

    输入文件：

    - `param_input.json`: `data/IG_dpgen_dargs_debug_002_20260616/param_input.json`

    - `machine_input.json`: `data/IG_dpgen_dargs_debug_002_20260616/machine_input.json`

    - `dpgen_error.log`: `data/IG_dpgen_dargs_debug_002_20260616/dpgen_error.log`'
  tags:
  - code_mlip
  - eng_lammps
  - eng_vasp
  data_files:
  - key: param_input
    path: data/IG_dpgen_dargs_debug_002_20260616/param_input.json
    oss_url: ''
    description: DP-GEN param input missing the required top-level numb_models key.
  - key: machine_input
    path: data/IG_dpgen_dargs_debug_002_20260616/machine_input.json
    oss_url: ''
    description: DP-GEN machine input with a string group_size that should be an integer.
  - key: error_log
    path: data/IG_dpgen_dargs_debug_002_20260616/dpgen_error.log
    oss_url: ''
    description: DP-GEN/dargs error excerpt for the controlled schema/type failures.
  reference_answers:
  - key: param_output_artifact
    value: param_output.json
    workspace_resolve: root
  - key: machine_output_artifact
    value: machine_output.json
    workspace_resolve: root
  - key: param_output_dargs
    value:
      filename: param_output.json
      check: schema
      kind: param
      strict: false
  - key: machine_output_dargs
    value:
      filename: machine_output.json
      check: schema
      kind: machine
      strict: false
  - key: numb_models_fixed
    value:
      filename: param_output.json
      key: numb_models
      expected: 4
      tolerance: 0
  - key: group_size_fixed
    value:
      filename: machine_output.json
      key: model_devi.resources.group_size
      expected: 16
      tolerance: 0
  - key: placeholders_preserved
    value:
      filename: param_output.json
      pattern: /path/to|path/to
      flags: i
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: param_output_artifact
    criterion: Agent writes the repaired param_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: machine_output_artifact
    criterion: Agent writes the repaired machine_output.json at the workspace root.
    axis: correctness
    verify: artifact_exists
  - id: param_output_dargs
    criterion: Repaired param_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: machine_output_dargs
    criterion: Repaired machine_output.json passes DP-GEN official dargs schema validation.
    axis: correctness
    verify: dpgen_dargs_check
  - id: numb_models_fixed
    criterion: param_output.json restores numb_models as integer 4.
    axis: correctness
    verify: json_file_numeric_range
  - id: group_size_fixed
    criterion: machine_output.json fixes model_devi.resources.group_size to integer 16.
    axis: correctness
    verify: json_file_numeric_range
  - id: placeholders_preserved
    criterion: The repaired param keeps placeholder paths rather than inventing real local paths.
    axis: grounding
    verify: text_file_regex
  - id: turn_budget
    criterion: Agent completes the repair within the turn budget.
    axis: efficiency
    verify: turn_budget
