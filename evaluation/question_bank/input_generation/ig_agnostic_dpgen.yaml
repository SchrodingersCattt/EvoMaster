    axis: efficiency
    verify: turn_budget
- id: IG_dpgen_config_issue_summary_006_20260614
  capability: input_generation
  domain: agnostic
  intent: Summarize DP-GEN configuration issues when JSON opens successfully but settings may be unreasonable or incomplete.
  human_prompt_seed: "这套 DP-GEN 配置能正常打开但我不确定设置是否合理，请帮我列出需要人工确认或修改的配置项，输出 `semantic_diagnostics.json` 和 `fix_plan.md`。"
  tags:
  - code_mlip
  data_files:
  - key: param_json
    path: data/IG_dpgen_config_issue_summary_006_20260614/param.json
    oss_url: ''
    description: DP-GEN param file with controlled semantic-risk mutations but valid JSON syntax.
  - key: machine_json
    path: data/IG_dpgen_config_issue_summary_006_20260614/machine.json
    oss_url: ''
    description: DP-GEN machine file with controlled semantic-risk mutations but valid JSON syntax.
  reference_answers:
  - key: diagnostics_schema
    value:
      filename: semantic_diagnostics.json
      required_keys:
      - files_checked
      - syntax_status
      - issues
      - expected_path_warnings_ignored
      - blocking_findings
  - key: fix_plan_artifact
    value: fix_plan.md
  - key: diagnostics_mentions_semantic
    value:
      filename: semantic_diagnostics.json
      pattern: model_devi_f_trust_lo|model_devi_f_trust_hi|fp|semantic|schema|path/to|/path/to|syntax
      flags: is
  - key: fix_plan_mentions_manual_review
    value:
      filename: fix_plan.md
      pattern: 人工|确认|review|manual|trust|fp|路径|path
      flags: is
  - key: syntax_not_confused
    value: The agent recognizes the provided JSON is readable and focuses on schema/semantic/manual-review issues rather than falsely claiming JSON syntax is broken.
  - key: turn_budget
    value:
      max: 14
  scoring_checklist:
  - id: diagnostics_schema
    criterion: semantic_diagnostics.json is valid JSON with syntax status, issue list, expected path warnings, and blocking findings.
    axis: correctness
    verify: json_file_schema
  - id: fix_plan_artifact
    criterion: Agent writes fix_plan.md.
    axis: correctness
    verify: artifact_exists
  - id: diagnostics_mentions_semantic
    criterion: semantic_diagnostics.json mentions the semantic/schema-risk settings and placeholder path context.
    axis: correctness
    verify: text_file_regex
  - id: fix_plan_mentions_manual_review
