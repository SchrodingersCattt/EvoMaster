- id: IG_incar_001_20260401
  capability: input_generation
  domain: incar
  intent: >
    Generate VASP INCAR for a band structure calculation of Lu4N4. Non-self-consistent run reading existing charge density
    (ICHARG=11), with projected band output (LORBIT=11).
  human_prompt_seed: >
    读取 `task_spec.json` 中的任务描述。为 Lu4N4 体系生成一个能带结构计算的 VASP INCAR 文件。 要求：非自洽计算，从已有电荷密度读取(ICHARG=11)，输出投影能带(LORBIT=11)。 直接输出完整的
    INCAR 内容。
  tags:
  - incar_generation
  - band_structure
  - non_scf
  mode_scope:
  - direct
  - planner
  data_files:
  - key: task_spec
    path: data/IG_incar_001/task_spec.json
    oss_url: ''
    description: Task specification for band structure INCAR generation.
  - key: reference_incar
    path: data/IG_incar_001/reference_incar.txt
    oss_url: ''
    description: Reference INCAR from NOMAD for evaluation comparison.
  reference_answers:
  - key: has_ICHARG_11
    value: ICHARG = 11
  - key: has_NSW_0
    value: NSW = 0
  - key: has_IBRION_neg1
    value: IBRION = -1
  - key: has_LORBIT_11
    value: LORBIT = 11
  - key: required_fields
    value:
    - INCAR_content
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: has_ICHARG_11
    criterion: INCAR contains ICHARG = 11 for non-self-consistent band structure calculation.
    axis: correctness
    verify: llm_binary_judge
  - id: has_NSW_0
    criterion: INCAR sets NSW = 0 (static, no ionic steps).
    axis: correctness
    verify: llm_binary_judge
  - id: has_IBRION_neg1
    criterion: INCAR sets IBRION = -1 (no ionic relaxation).
    axis: correctness
    verify: llm_binary_judge
  - id: has_LORBIT_11
    criterion: INCAR sets LORBIT = 11 for projected band structure output.
    axis: correctness
    verify: llm_binary_judge
  - id: incar_quality
    criterion: >
      Generated INCAR is valid and complete for band structure: appropriate ISMEAR (e.g. 0 or -5), reasonable EDIFF, and no
      conflicting relaxation parameters.
    axis: grounding
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The generated INCAR is grounded in the provided task_spec.json data (material system, calculation type, element
      order) rather than hallucinated.
    axis: grounding
    verify: llm_binary_judge
  - id: efficiency_judge
    criterion: The agent produced the INCAR efficiently without unnecessary tool calls, redundant queries, or irrelevant exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
