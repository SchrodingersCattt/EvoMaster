questions:
- id: IG_incar_001_20260402
  capability: input_generation
  domain: incar
  intent: 'Generate VASP INCAR for a band structure calculation of Lu4N4. Non-self-consistent run reading existing charge
    density (ICHARG=11), with projected band output (LORBIT=11).

    '
  human_prompt_seed: 读取 `task_spec.json` 中的任务描述。为 Lu4N4 体系生成一个能带结构计算的 VASP INCAR 文件。要求：非自洽计算，从已有电荷密度读取，输出投影能带。将完整的 INCAR 写入当前目录下的
    `INCAR` 文件。
  tags:
  - incar_generation
  - band_structure
  - non_scf
  mode_scope:
  - direct
  - planner
  data_files:
  - key: task_spec
    path: data/IG_incar_001/task_spec.json
    oss_url: ''
    description: Task specification for band structure INCAR generation.
  reference_answers:
  - key: key_params_match
    value:
      ref_incar: data/IG_incar_001/reference_incar.txt
      key_tags:
      - IBRION
      - ISIF
      - ISMEAR
      - ISPIN
      - ISYM
      - NEDOS
      - NSW
      mode: key_only
      pass_threshold: 0.6
  - key: full_incar_quality
    value:
      ref_incar: data/IG_incar_001/reference_incar.txt
      mode: full
      pass_threshold: 0.5
  - key: required_fields
    value:
    - INCAR_content
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: key_params_match
    criterion: Agent INCAR 的核心参数（IBRION, ISIF, ISMEAR, ISPIN, ISYM, NEDOS 等）与 reference INCAR 一致。
    axis: correctness
    verify: incar_param_compare
    weight: 3.0
  - id: full_incar_quality
    criterion: Agent INCAR 的全部参数与 reference INCAR 整体匹配度达标（≥60%）。
    axis: grounding
    verify: incar_param_compare
    weight: 2.0
  - id: efficiency_judge
    criterion: The agent produced the INCAR efficiently without unnecessary tool calls, redundant queries, or irrelevant exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
