    of the LaSrAlO₄ structure in la_sralo4_eta13.cif. Use the same PBEsol functional and 60 Ry cutoff
    as the SCF calculation. Include a high-symmetry k-point path appropriate for a tetragonal I4mm crystal
    that traverses Γ, M, X, and Z points. Save outputs as la_sralo4_nscf.in and la_sralo4_bands.in.
