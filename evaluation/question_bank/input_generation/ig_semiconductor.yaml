- id: IG_gnr_004_20250618
  capability: input_generation
  domain: semiconductor
  intent: Generate a SIESTA-style DFT input deck for a self-consistent field calculation on an armchair
    graphene nanoribbon (AGNR) using the computational parameters from Son et al. (2006).
  human_prompt_seed: 'Generate a SIESTA-style input file (`siesta.fdf`) for a spin-polarized LSDA DFT
    calculation of an armchair graphene nanoribbon (AGNR). Use the following parameters from the paper:
    energy cutoff of 400 Ry, double-zeta plus polarization (DZP) basis set, force convergence threshold
    of 16 pN, and 32 k-points along the 1D Brillouin zone. The system is a 1D periodic nanoribbon with
    vacuum in the other two directions. Save the file as `siesta.fdf` in the current working directory.'
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_fdf
    value: siesta.fdf
  - key: has_energy_cutoff
    value:
      flags: []
      tokens:
      - '400'
      - Ry
      filename: siesta.fdf
  - key: has_basis_type
    value:
      flags:
      - case_sensitive
      tokens:
      - DZP
      filename: siesta.fdf
  - key: has_force_tol
    value:
      flags: []
      tokens:
      - '16'
      - pN
      filename: siesta.fdf
  - key: has_kpoints
    value:
      flags: []
      tokens:
      - '32'
      filename: siesta.fdf
  - key: has_lsda
    value:
      flags:
      - case_insensitive
      tokens:
      - LSDA
      - SpinPolarization
      - spin
      filename: siesta.fdf
  - key: has_1d_periodic
    value:
      flags: []
      tokens:
      - '1'
      - Periodic
      filename: siesta.fdf
  - key: grounding_source
    value:
      filename: siesta.fdf
  - key: turn_budget
    value:
      max: 25
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_fdf
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file siesta.fdf exists and is non-empty.'
  - id: has_energy_cutoff
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input specifies energy cutoff of 400 Ry (MeshCutoff 400. Ry).'
  - id: has_basis_type
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input specifies DZP (double-zeta plus polarization) basis set.'
  - id: has_force_tol
    axis: correctness
    verify: text_file_contains_all
    weight: 0.5
    criterion: '[Must] Input specifies force convergence tolerance of 16 pN (MaxForceTol 0.016 eV/Ang
      or equivalent).'
  - id: has_kpoints
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input specifies 32 k-points along the 1D Brillouin zone for the AGNR.'
  - id: has_lsda
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input specifies LSDA (local spin density approximation) functional with spin polarization
      enabled.'
  - id: has_1d_periodic
    axis: correctness
    verify: text_file_contains_all
    weight: 0.5
    criterion: '[Must] Input specifies 1D periodicity (PeriodicDirections 1 or equivalent) appropriate
      for a nanoribbon.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The input deck parameters match those described in Son et al. (2006): 400 Ry cutoff,
      DZP basis, LSDA, 16 pN force tolerance, 32 k-points for AGNR.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Completes within 25 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retry requests needed.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Completes within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Uses no more than 50000 tokens total.'
- id: IG_vasp_001_20250618
  capability: input_generation
  domain: semiconductor
  intent: 'Generate VASP INCAR files for a two-step band gap calculation workflow: PBE structural relaxation
    followed by one-shot HSE06 band gap evaluation, following the AMP² methodology described in Kim et
    al. (Scientific Data, 2020).'
  human_prompt_seed: 'Retrieve the bulk silicon structure (diamond cubic) from the structure database,
    then generate two VASP INCAR files: INCAR_relax for PBE structural relaxation and INCAR_hse for one-shot
    HSE06 band gap calculation. Follow the AMP² computational settings described in Kim et al. (Scientific
    Data, 2020): PBE functional for relaxation, HSE06 (HFSCREEN=0.2, AEXAC=0.25) for the one-shot calculation.
    Place both files in the current directory.'
  tags:
  - eng_vasp
  data_files: []
  reference_answers:
  - key: relax_incar_tags
    value:
      flags:
        case_insensitive: true
      tokens:
      - ISTART = 0
      - ICHARG = 2
      - GGA = PE
      - ENCUT = 520
      - PREC = Accurate
      - ISMEAR = 0
      - SIGMA = 0.05
      - IBRION = 2
      - ISIF = 3
      - EDIFF = 1E-6
      - EDIFFG = -0.01
      - LREAL = Auto
      filename: INCAR_relax
  - key: hse_incar_tags
    value:
      flags:
        case_insensitive: true
      tokens:
      - ISTART = 1
      - ICHARG = 11
      - LHFCALC = .TRUE.
      - HFSCREEN = 0.2
      - AEXAC = 0.25
      - ALGO = All
      - NELM = 1
      - ENCUT = 520
      - PREC = Accurate
      - ISMEAR = 0
      - SIGMA = 0.05
      - LREAL = Auto
      filename: INCAR_hse
  - key: relax_exists
    value: INCAR_relax
  - key: hse_exists
    value: INCAR_hse
  - key: grounding_source
    value:
      filename: INCAR_relax
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: relax_incar_tags
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Must] INCAR_relax contains all required PBE relaxation tags: ISTART=0, ICHARG=2, GGA=PE,
      ENCUT=520, PREC=Accurate, ISMEAR=0, SIGMA=0.05, IBRION=2, ISIF=3, EDIFF=1E-6, EDIFFG=-0.01, LREAL=Auto.'
  - id: hse_incar_tags
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Must] INCAR_hse contains all required HSE06 one-shot tags: ISTART=1, ICHARG=11, LHFCALC=.TRUE.,
      HFSCREEN=0.2, AEXAC=0.25, ALGO=All, NELM=1, ENCUT=520, PREC=Accurate, ISMEAR=0, SIGMA=0.05, LREAL=Auto.'
  - id: relax_exists
    axis: correctness
    verify: artifact_exists
    weight: 5.0
    criterion: '[Must] File INCAR_relax exists in the output directory.'
  - id: hse_exists
    axis: correctness
    verify: artifact_exists
    weight: 5.0
    criterion: '[Must] File INCAR_hse exists in the output directory.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 10.0
    criterion: '[Must] The answer is grounded in the provided structure file si_structure.vasp and the
      AMP² methodology from Kim et al. (2020).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not retry any tool call.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses fewer than 50000 tokens total.'
- id: IG_gaas_001_20250618
  capability: input_generation
  domain: semiconductor
  intent: Generate a VASP INCAR input file for a defect formation energy calculation on a 32-atom GaAs
    supercell, using LDA functional and plane-wave cutoff equivalent to 8 Ry (~109 eV).
  human_prompt_seed: Generate a VASP INCAR file for a self-consistent defect calculation on the provided
    gaas_vga_defect.vasp structure. Use LDA functional, plane-wave energy cutoff of 109 eV (equivalent
    to 8 Ry), and settings appropriate for a 32-atom semiconductor supercell. Save as INCAR in the working
    directory.
  tags:
  - eng_vasp
  data_files:
  - key: gaas_defect
    path: gaas_vga_defect.vasp
    oss_url: ''
    description: 32-atom GaAs supercell with one Ga vacancy (POSCAR format). Provided as input; agent
      does not need to construct it.
  reference_answers:
  - key: artifact_incar
    value: INCAR
  - key: text_incar_tags
    value:
      flags:
        require_all: false
        require_any_group:
        - - GGA = PE
          - GGA = none
          - GGA = --
          - missing GGA
        - - ENCUT = 109
          - ENCUT = 108
          - ENCUT = 110
      tokens:
      - GGA = PE
      - or
      - GGA = none
      - or missing GGA line (LDA default)
      - ENCUT = 109
      - ISMEAR = 0
      - SIGMA
      filename: INCAR
  - key: numeric_encut
    value:
      checks:
      - key: ENCUT
        expected: 109
        tolerance: 5
        allow_missing_key: false
      filename: INCAR
  - key: numeric_sigma
    value:
      checks:
      - key: SIGMA
        max: 0.2
        min: 0.01
        allow_missing_key: true
      filename: INCAR
  - key: grounding_source
    value:
      filename: gaas_vga_defect.vasp
  - key: turn_budget
    value:
      max: 15
  - key: no_retries
    value:
      max: 1
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
  - id: artifact_incar
    axis: correctness
    verify: artifact_exists
    weight: 2.0
    criterion: '[Must] Output file INCAR exists and is a valid VASP INCAR-format file.'
  - id: numeric_encut
    axis: correctness
    verify: text_file_numeric_range
    weight: 3.0
    criterion: '[Must] ENCUT is set to approximately 109 eV (8 Ry), within ±5 eV tolerance.'
  - id: numeric_sigma
    axis: correctness
    verify: text_file_numeric_range
    weight: 1.0
    criterion: '[Suggested] SIGMA is set to a small value (0.01–0.2 eV) appropriate for semiconductor
      calculations with ISMEAR=0.'
  - id: text_incar_tags
    axis: correctness
    verify: text_file_contains_all
    weight: 2.0
    criterion: '[Must] INCAR uses LDA functional (default in VASP, or explicitly GGA=none/GGA=--) and
      includes ISMEAR=0 for semiconductor.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The INCAR is appropriate for the provided GaAs defect supercell structure.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Variable] Agent completed within 15 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Variable] Agent did not retry the task.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Variable] Agent completed within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Variable] Agent used fewer than 40000 tokens total.'
- id: IG_vasp_002_20250618
  capability: input_generation
  domain: semiconductor
  intent: Generate a VASP INCAR and KPOINTS file for a density-functional-theory SCF calculation of a
    graphene sheet adsorbed on a metal (111) slab, using the computational parameters described in Giovannetti
    et al. (2008).
  human_prompt_seed: I have a POSCAR file for a graphene/Cu(111) slab supercell. Generate the VASP INCAR
    and KPOINTS files needed for a spin-polarized SCF calculation. Use the LSDA functional, PAW pseudopotentials,
    a 400 eV plane-wave cutoff, a dipole correction, the tetrahedron method for Brillouin-zone integration,
    and an energy convergence criterion of 1e-7 eV. Choose an appropriate k-point mesh for the small cell
    shown in Fig. 1(a) of the paper. Save the files as INCAR and KPOINTS in the working directory.
  tags:
  - eng_vasp
  data_files:
  - key: poscar
    path: POSCAR
    oss_url: ''
    description: POSCAR file containing a graphene/Cu(111) slab supercell with 6 Cu layers, one graphene
      sheet (2 C atoms), and ~12 Å vacuum. The in-plane lattice constant is matched to graphene (a = 2.445
      Å). This file is provided as a local artifact since the specific slab structure is not available
      in public databases.
  reference_answers:
  - key: artifact_incar
    value:
      filename: INCAR
  - key: artifact_kpoints
    value:
      filename: KPOINTS
  - key: incar_content
    value:
      flags: []
      tokens:
      - ENCUT = 400
      - PREC = Accurate
      - ISMEAR = -5
      - ISPIN = 2
      - LREAL = Auto
      - EDIFF = 1E-7
      - LDIPOL = .TRUE.
      - IDIPOL = 3
      - IVDW = 0
      filename: INCAR
  - key: kpoints_content
    value:
      flags: []
      pattern: 36\s+36\s+1
      filename: KPOINTS
  - key: grounding_source
    value:
      filename: POSCAR
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: artifact_incar
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] INCAR file exists in the working directory'
  - id: artifact_kpoints
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] KPOINTS file exists in the working directory'
  - id: incar_content
    axis: correctness
    verify: text_file_contains_all
    weight: 3.0
    criterion: '[Must] INCAR contains required VASP tags: ENCUT=400, ISMEAR=-5 (tetrahedron), ISPIN=2
      (spin-polarized), EDIFF=1E-7, LDIPOL=.TRUE., IDIPOL=3'
  - id: kpoints_content
    axis: correctness
    verify: text_file_regex
    weight: 2.0
    criterion: '[Must] KPOINTS specifies a 36×36×1 Monkhorst-Pack grid for the small cell'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The generated input files are grounded in the source paper''s methodology (Giovannetti
      et al. 2008, footnote [18])'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within the turn budget'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not retry any tool call'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within the duration budget'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent stays within the total token budget'
