  - eng_qe
  data_files:
  - key: structure
    path: la_sralo4_eta13.cif
    oss_url: ''
    description: CIF file for the η=1/3 cation-ordered LaSrAlO₄ Ruddlesden-Popper structure (I4mm space
      group, c/a=3.324) from DFT-PBEsol ground-state optimization in the source paper.
  reference_answers:
  - key: nscf_input_exists
    value: la_sralo4_nscf.in
  - key: bands_input_exists
    value: la_sralo4_bands.in
  - key: nscf_input_content
    value:
      flags:
      - case_insensitive
      tokens:
