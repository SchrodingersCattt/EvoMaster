      filename: STRU
      pattern: (?im)^\s*Rh\s+[0-9.]+\s+Rh_ONCV_PBE_FR-1\.0\.upf\s*$
      flags: im
  - key: must_stru_orbitals
    value:
      filename: STRU
      tokens:
      - NUMERICAL_ORBITAL
      - Mg_gga_10au_100Ry_2s1p.orb
      - N_gga_8au_100Ry_2s2p1d.orb
      - Rh_gga_10au_100Ry_4s2p2d1f.orb
      flags: i
  - key: must_kpt_gamma
    value:
      filename: KPT
      pattern: (?im)^\s*[1-9]\d*\s+[1-9]\d*\s+[1-9]\d*(?:\s+0\s+0\s+0)?\s*$
      flags: im
  - key: variable_reference_grounding
    value: {}
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 40000
