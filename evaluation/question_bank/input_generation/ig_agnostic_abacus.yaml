version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_abacus_001_20260508
  capability: input_generation
  domain: agnostic
  intent: 'Add ABACUS LCAO BSSE correction for Fe(110) slab: define Fe_empty species, place empty-atom layers in vacuum, and write SCF INPUT with sparse k along vacuum.'
  human_prompt_seed: "工作区中提供了仅含真实 Fe 原子的表面 slab 结构（尚未做 BSSE 校正）。\n\n请准备 ABACUS LCAO 单点输入用于 NAO-BSSE 校正：\n1) 在结构中引入 empty/ghost 物种用于补足基组。\n2) 在真空区域布置 empty 原子层，保证位于 slab 外侧而不是埋入体内。\n3) 生成与该场景匹配的 SCF INPUT，沿真空方向使用单点/稀疏采样。 说明：k 采样可用 kspacing 或 KPT 两种路线；若使用 KPT，建议采用 `KPT_bsse` 文件名与 Gamma 风格。\n\n将结果写入当前目录：`STRU_bsse`、`INPUT_bsse`。\n"
  tags:
  - eng_abacus
  - struct_surface
  data_files:
  - key: base_slab
    path: data/IG_abacus_001_20260404/base_slab.stru
    oss_url: ''
    description: Fe slab STRU without Fe_empty (starting geometry for BSSE setup).
  reference_answers:
  - key: must_stru_bsse_fe_empty_species
    value:
      filename: STRU_bsse
      pattern: (?i)^\s*Fe_empty\s+[\d.]+\s+\S+\.upf
      flags: im
  - key: must_stru_bsse_fe_empty_frozen
    value:
      filename: STRU_bsse
      pattern: (?i)(?:^Fe_empty$[\s\S]*?)\d+\.\d+\s+\d+\.\d+\s+\d+\.\d+\s+0\s+0\s+0
      flags: im
  - key: must_stru_bsse_fe_empty_zero_mag
    value:
      filename: STRU_bsse
      pattern: 0\s+0\s+0\s*(?:mag\s+0\.0|$)
      flags: im
  - key: must_input_bsse_core
    value:
      filename: INPUT_bsse
      tokens:
      - calculation scf
      - basis_type lcao
      - nspin 2
      flags: i
  - key: must_input_bsse_vacuum_kspacing
    value:
      filename: INPUT_bsse
      if_filename: INPUT_bsse
      if_pattern: ^\s*kspacing\b
      then_pattern: ^\s*kspacing\s+[0-9]*\.?[0-9]+\s+[0-9]*\.?[0-9]+\s+1(?:\.0+)?\s*$
      else_filename: KPT_bsse
      else_pattern: ^\s*\d+\s+\d+\s+1(?:\s+\d+){0,3}\s*$
      flags: m
  - key: suggested_input_bsse_numerics
    value:
      filename: INPUT_bsse
      checks:
      - key: ecutwfc
        min: 80
        max: 120
      - key: scf_thr
        min: 1e-10
        max: 0.01
  - key: suggested_input_bsse_smearing
    value:
      filename: INPUT_bsse
      checks:
      - key: smearing_method
        allow_missing_key: true
        allowed_values:
        - gauss
        - gaussian
        - fixed
        - mp
        - mp2
        - methfessel-paxton
        - mv
        - cold
        - marzari-vanderbilt
        - fd
        - fermi-dirac
      - key: smearing_sigma
        allow_missing_key: true
        min: 0.001
        max: 0.1
  - key: must_input_bsse_ntype_matches_species
    value:
      filename: INPUT_bsse
      pattern: (?im)^\s*ntype\s+2\s*$
      flags: im
  - key: variable_empty_layer_placement
    value: {}
  - key: variable_fe_empty_species_quality
    value: {}
  - key: stru_bsse_artifact
    value: STRU_bsse
  - key: input_bsse_artifact
    value: INPUT_bsse
  - key: grounding_source
    value:
      filename: base_slab.stru
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: must_stru_bsse_fe_empty_species
    criterion: '[Must] STRU_bsse ATOMIC_SPECIES section defines Fe_empty with a PP file.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_stru_bsse_fe_empty_frozen
    criterion: '[Must] Fe_empty atoms in STRU_bsse have frozen positions (0 0 0).'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_stru_bsse_fe_empty_zero_mag
    criterion: '[Must] Fe_empty atoms in STRU_bsse have zero or omitted magnetic moment (either "0 0 0 mag 0.0" or "0 0 0" at end of line).'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_input_bsse_core
    criterion: '[Must] INPUT_bsse uses LCAO SCF core controls (`calculation scf`, `basis_type lcao`, `nspin 2`).'
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_input_bsse_vacuum_kspacing
    criterion: '[Must] Conditional routing: if INPUT_bsse has `kspacing`, it must be 3-component with third component ~=1.0 (single-value form not accepted); if INPUT_bsse has no `kspacing`, then KPT_bsse must provide a mesh line with third-axis sampling = 1.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: suggested_input_bsse_numerics
    criterion: '[Suggested] INPUT_bsse follows benchmark numeric settings with tolerance (`ecutwfc ~100`, `scf_thr around 1e-7~1e-6`).'
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.6
  - id: suggested_input_bsse_smearing
    criterion: '[Suggested] If smearing parameters are provided in INPUT_bsse, they should be physically reasonable for this benchmark family; missing smearing fields should not be treated as a failure.'
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.6
  - id: must_input_bsse_ntype_matches_species
    criterion: '[Must] INPUT_bsse sets ntype to 2, matching the two species (Fe and Fe_empty) defined in STRU_bsse ATOMIC_SPECIES.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: variable_empty_layer_placement
    criterion: '[Variable] Empty Fe layers are placed on both slab sides in vacuum, not buried inside slab.'
    axis: correctness
    verify: llm_binary_judge
    weight: 0.3
  - id: variable_fe_empty_species_quality
    criterion: '[Variable] Fe_empty species configuration is physically consistent with ghost-basis usage (matching PP/orbital, no spurious empty-site magnetic setup).'
    axis: correctness
    verify: llm_binary_judge
    weight: 0.3
  - id: stru_bsse_artifact
    criterion: Generated deliverables count even if the final answer does not quote file contents; `STRU_bsse` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: input_bsse_artifact
    criterion: Generated deliverables count even if the final answer does not quote file contents; `INPUT_bsse` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: grounding_source
    criterion: The modified STRU preserves the original slab lattice vectors and real Fe fractional coordinates from base_slab.stru; changes are limited to adding Fe_empty species/layers and INPUT parameters. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: IG_abacus_009_20260508
  capability: input_generation
  domain: agnostic
  intent: Prepare, validate, and package an ABACUS SCF run directory from task intent.
  human_prompt_seed: "请准备一个最小 ABACUS LCAO SCF 输入目录：\n- 材料：Si diamond conventional cell，a=5.43 Å。\n- 任务：ABACUS scf。\n- 输出目录：`run_abacus_scf/`，其中应包含 `INPUT`、`STRU`、`KPT`、`diagnosis.json`、`input_prep_manifest.json`。\n- 请验证主输入并保存 machine-readable diagnostics 到 `run_abacus_scf/diagnosis.json`。\n- `input_prep_manifest.json` 必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，`submit_ready` 必须是 JSON boolean。\n- 这是把 task intent plus structure files 转成 runnable engine artifacts 的题；不要只在最终回答里描述而不写文件。\n本题只准备输入目录，不实际提交 Bohrium。"
