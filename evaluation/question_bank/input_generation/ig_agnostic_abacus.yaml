  - eng_abacus
  reference_answers:
  - key: input_artifact
    value: INPUT
  - key: stru_artifact
    value: STRU
  - key: kpt_artifact
    value: KPT
  - key: must_input_lcao_core
    value:
      filename: INPUT
      tokens:
      - calculation scf
      - basis_type lcao
      - pseudo_dir /root/apns-pseudopotentials-v1
      - orbital_dir /root/apns-orbitals-efficiency-v1
      flags: i
  - key: must_input_ntype_three
    value:
      filename: INPUT
      pattern: (?im)^\s*ntype\s+3\s*$
      flags: im
