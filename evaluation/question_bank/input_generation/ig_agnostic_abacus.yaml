- id: IG_abacus_018_20260511
  capability: input_generation
  domain: agnostic
  intent: Prepare ABACUS LCAO-SCF inputs that require resolving nontrivial APNS pseudopotential
    filenames.
  human_prompt_seed: '请为一个 Mg-N-Rh 三元素小胞准备 ABACUS LCAO-SCF 输入文件，用于测试 APNS 赝势/轨道文件名解析是否正确。

    要求：

    1) 生成当前目录下的 `INPUT`、`STRU`、`KPT`。

    2) 使用 ABACUS LCAO 和 PBE 单点自洽；显式设置 APNS 赝势目录和轨道目录。

    3) `STRU` 中的 Mg、N、Rh 三种元素必须使用 skill references 中实际存在的 APNS pseudopotential 和 numerical-orbital
    文件名；不要凭元素符号猜成 `元素名.upf`。

    4) 结构只需是一个合理的周期性测试小胞，重点是三种元素、`INPUT`/`STRU`/`KPT` 互相一致；不要运行计算。'
