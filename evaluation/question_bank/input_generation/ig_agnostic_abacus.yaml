    value:
      filename: input_prep_manifest.json
      required_keys:
      - software
      - task
      - input_dir
      - generated_files
      - user_provided_files
      - diagnostics
      - auxiliary_files
      - assumptions
      - submit_ready
      - bohrium_command
  - key: abacus_core_keywords
    value:
      filename: INPUT
      tokens:
      - calculation
      - scf
      - basis_type
      - lcao
      flags: i
  - key: output_grounding
    value: The final answer accurately summarizes the generated ABACUS run directory, diagnosis artifact, manifest gate, and that no Bohrium submission was run.
  - key: turn_budget
    value:
      max: 16
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: input_artifact
    criterion: Generated deliverables include ABACUS `INPUT` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: stru_artifact
    criterion: Generated deliverables include ABACUS `STRU` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: kpt_artifact
    criterion: Generated deliverables include ABACUS `KPT` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: diagnosis_artifact
    criterion: The primary input is diagnosed with JSON output saved as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The run directory includes `input_prep_manifest.json` with the required manifest fields.
    axis: correctness
