  - id: input_artifact
    criterion: INPUT written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: stru_artifact
    criterion: STRU written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_nspin_2
    criterion: '[Must] INPUT enables spin polarization (nspin 2).'
    axis: correctness
    verify: text_file_regex
  - id: must_calculation_scf
    criterion: '[Must] INPUT sets calculation scf.'
    axis: correctness
    verify: text_file_regex
  - id: must_basis_lcao
    criterion: '[Must] INPUT uses basis_type lcao.'
    axis: correctness
    verify: text_file_regex
  - id: must_orbital_corr
    criterion: '[Must] INPUT sets orbital_corr with d-orbital index (2) for Ni.'
    axis: correctness
    verify: text_file_regex
  - id: must_hubbard_u
    criterion: '[Must] INPUT sets hubbard_u with U=6.0 for Ni d-orbital.'
    axis: correctness
    verify: text_file_regex
  - id: must_stru_afm_moments
    criterion: '[Must] STRU sets antiferromagnetic initialization (not all-parallel FM).'
    axis: correctness
    verify: stru_file_check
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
