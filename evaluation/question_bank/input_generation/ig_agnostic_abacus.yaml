    criterion: The rendered ABACUS INPUT contains SCF and LCAO controls.
    axis: correctness
    verify: text_file_contains_all
  - id: output_grounding
    criterion: The final answer accurately summarizes the generated ABACUS run directory, diagnosis artifact, manifest gate, and that no Bohrium submission was run.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
