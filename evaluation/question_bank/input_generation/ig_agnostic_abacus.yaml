- id: IG_abacus_010_20260513
  capability: input_generation
  domain: agnostic
  intent: Package an ABACUS input directory with auxiliary files and engine-skill submission defaults.
  human_prompt_seed: "请为一个已准备好的 ABACUS LCAO 运行目录做 submission preflight，目录名用 `run_abacus_packaged/`：\n1. 生成或整理 `INPUT`、`STRU`、`KPT`，并把所需 auxiliary files（例如 pseudopotential/orbital 文件名占位或清单）集中到同一个 input directory。\n2. 验证主输入并保存 machine-readable diagnostics 到 `diagnosis.json`。\n3. 写 `input_prep_manifest.json`。它必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，`submit_ready` 必须是 JSON boolean，`auxiliary_files` 必须是 JSON array（即使为空也必须写成 `[]`）。如果没有可靠提交资源信息，`bohrium_command` 可以为空字符串。\n4. 本题不要真正提交，只输出目录和说明；不要臆造 Bohrium image、machine 或 command 默认值。\n请确保 manifest 能让后续 Bohrium submission 使用。"
  tags:
  - eng_abacus
  data_files: []
  reference_answers:
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      required_keys:
      - software
      - task
      - input_dir
      - generated_files
      - user_provided_files
      - diagnostics
      - auxiliary_files
      - assumptions
      - submit_ready
      - bohrium_command
  - key: manifest_has_auxiliary_files
    value:
      filename: input_prep_manifest.json
      pattern: '"auxiliary_files"\s*:\s*\['
      flags: i
  - key: diagnosis_artifact
    value: diagnosis.json
  - key: manifest_has_diagnostics_file
    value:
      filename: input_prep_manifest.json
      pattern: '"diagnostics"\s*:\s*\{[\s\S]*"file"\s*:\s*"diagnosis\.json"'
      flags: i
  - key: output_grounding
    value: The final answer states that the ABACUS directory was packaged for preflight, diagnostics and manifest were produced, and no job was submitted.
  - key: turn_budget
    value:
      max: 14
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
  - id: manifest_schema
    criterion: The package includes `input_prep_manifest.json` with software, task, input_dir, generated_files, user_provided_files, diagnostics, auxiliary_files, assumptions, submit_ready, and bohrium_command.
    axis: correctness
    verify: json_file_schema
  - id: manifest_has_auxiliary_files
    criterion: The manifest gathers required auxiliary files into one input directory and records them in `auxiliary_files`.
    axis: correctness
    verify: text_file_regex
  - id: diagnosis_artifact
    criterion: The package includes machine-readable diagnostics as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: manifest_has_diagnostics_file
    criterion: The manifest records the saved diagnostics file.
    axis: correctness
    verify: text_file_regex
  - id: output_grounding
    criterion: The final answer states that the ABACUS directory was packaged for preflight, diagnostics and manifest were produced, and no job was submitted.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_abacus_011_20260511
  capability: input_generation
  domain: agnostic
  intent: Prepare ABACUS LCAO-SCF inputs for an isolated spin-polarized oxygen atom.
  human_prompt_seed: 请为孤立氧原子准备一个 ABACUS LCAO 单点自洽计算。体系放在 10 Å 立方盒中，使用 Gamma 点；考虑氧原子的开壳层自旋态，需要开启自旋极化；。将完整的 `INPUT`、`STRU` 和 `KPT` 写入当前目录。
  tags:
  - eng_abacus
  reference_answers:
  - key: input_artifact
    value: INPUT
  - key: stru_artifact
    value: STRU
  - key: kpt_artifact
    value: KPT
  - key: must_input_header
    value:
      filename: INPUT
      pattern: (?im)^\s*INPUT_PARAMETERS\s*$
      flags: im
  - key: must_input_core
    value:
      filename: INPUT
      tokens:
      - calculation scf
      - basis_type lcao
      - nspin 2
      - pseudo_dir /root/apns-pseudopotentials-v1
      - orbital_dir /root/apns-orbitals-efficiency-v1
      flags: i
  - key: must_input_numerics
    value:
      filename: INPUT
      checks:
      - key: ecutwfc
        min: 40
        max: 200
      - key: scf_thr
        min: 1e-12
        max: 0.0001
  - key: must_stru_o_species_orbital
    value:
      filename: STRU
      tokens:
      - ATOMIC_SPECIES
      - O.upf
      - NUMERICAL_ORBITAL
      - O_gga_6au_100Ry_2s2p1d.orb
      flags: i
  - key: must_stru_box
    value:
      filename: STRU
      pattern: (?is)LATTICE_VECTORS\s*\n\s*10(?:\.0+)?\s+0(?:\.0+)?\s+0(?:\.0+)?\s*\n\s*0(?:\.0+)?\s+10(?:\.0+)?\s+0(?:\.0+)?\s*\n\s*0(?:\.0+)?\s+0(?:\.0+)?\s+10(?:\.0+)?
      flags: im
  - key: must_stru_o_magnetism
    value:
      filename: STRU
      pattern: (?ims)^ATOMIC_POSITIONS\b[\s\S]*?^\s*O\s*$\s*^\s*(?:1\.[5-9]\d*|2(?:\.0+)?|2\.[0-5]\d*)\s*$
      flags: im
  - key: must_kpt_gamma
    value:
      filename: KPT
      pattern: (?im)^\s*1\s+1\s+1(?:\s+0\s+0\s+0)?\s*$
      flags: im
  - key: variable_abacus_format
    value: {}
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: input_artifact
    criterion: Generated deliverables count even if the final answer does not quote file contents; `INPUT` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: stru_artifact
    criterion: Generated deliverables count even if the final answer does not quote file contents; `STRU` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: kpt_artifact
    criterion: Generated deliverables count even if the final answer does not quote file contents; `KPT` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: must_input_header
    criterion: '[Must] INPUT starts with INPUT_PARAMETERS.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_input_core
    criterion: '[Must] INPUT uses ABACUS LCAO SCF syntax with spin polarization and APNS runtime directories.'
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_input_numerics
    criterion: '[Must] INPUT includes reasonable ecutwfc and scf_thr values.'
    axis: correctness
    verify: text_file_numeric_range
    weight: 0.8
  - id: must_stru_o_species_orbital
    criterion: '[Must] STRU uses APNS oxygen pseudopotential and orbital filenames from the skill references.'
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_stru_box
    criterion: '[Must] STRU uses a 10 Angstrom cubic box for the isolated atom.'
    axis: correctness
    verify: text_file_regex
    weight: 0.8
  - id: must_stru_o_magnetism
    criterion: '[Must] STRU sets an initial oxygen magnetic moment close to 2 Bohr magnetons.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: must_kpt_gamma
    criterion: '[Must] KPT uses a single Gamma-centered 1x1x1 point.'
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: variable_abacus_format
    criterion: '[Variable] The answer uses ABACUS file names and space-separated ABACUS syntax, does not use VASP INCAR/KPOINTS style, and does not omit the LCAO NUMERICAL_ORBITAL section.'
    axis: grounding
    verify: llm_binary_judge
