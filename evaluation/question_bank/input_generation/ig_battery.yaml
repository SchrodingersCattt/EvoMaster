- id: IG_pourbaix_formula_003_20260108
  capability: input_generation
  domain: battery
  intent: Implement the Pourbaix potential formula (equation 3) from the paper as a reusable Python function,
    with test cases for LiFePO₄ and H₂O at specified conditions.
  human_prompt_seed: 'Implement the Pourbaix potential formula from Wang et al. (2024) as a Python function.
    The Pourbaix potential (equation 3 in the paper) is:

    Φ̄ = (1/N_M) × [(G − N_O·μ_H₂O) − RT·ln(10)·(2N_O − N_H)·pH − (2N_O − N_H + Q)·E]

    where N_M, N_O, N_H are the number of metal, oxygen, and hydrogen atoms; Q is the charge; G is the
    molar Gibbs free energy; μ_H₂O is the chemical potential of water; R is the gas constant; T is temperature;
    pH and E are the electrochemical conditions.

    Write a Python function `compute_pourbaix_potential(formula, G_eV_per_formula, pH, E_V, T=298.15)`
    that parses a chemical formula (e.g., ''LiFePO4''), counts atoms, and returns the Pourbaix potential
    in eV/atom. Save the function and a test script to pourbaix_potential.py. The test script should compute
    Φ̄ for LiFePO₄ (G ≈ −18.0 eV/formula, approximate) at pH=9.27, E=−0.56 V, and for H₂O (G = 0 by convention,
    Q=0) at pH=7, E=0 V.'
  tags:
  - char_electrochem
  data_files: []
  reference_answers:
  - key: artifact_python_file
    value: pourbaix_potential.py
  - key: function_exists
    value:
      flags: []
      tokens:
      - def compute_pourbaix_potential
      filename: pourbaix_potential.py
  - key: formula_parsing
    value:
      flags:
      - case_insensitive
      tokens:
      - Li
      - Fe
      - P
      - O
      filename: pourbaix_potential.py
  - key: numeric_output_present
    value:
      flags:
      - case_insensitive
      tokens:
      - pourbaix_potential
      - eV
      filename: pourbaix_potential.py
  - key: grounding_source
    value: {}
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_python_file
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] Output file pourbaix_potential.py exists.'
  - id: function_exists
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Must] The file contains a function named `compute_pourbaix_potential` with the specified
      signature.'
  - id: formula_parsing
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Must] The function correctly parses chemical formulas including LiFePO₄ (must identify
      Li, Fe, P, O counts).'
  - id: numeric_output_present
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Suggested] The test script prints or computes Pourbaix potential values in eV/atom units.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 15.0
    criterion: '[Must] The implementation follows equation (3) from the source paper, including all terms
      (G, μ_H₂O, pH, E dependence).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not request human intervention or retry the task.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses no more than 50000 tokens total.'
