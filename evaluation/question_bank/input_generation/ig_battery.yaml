version: v5
capability: input_generation
domain: battery
questions:
- id: IG_diffract_001_20250618
  capability: input_generation
  domain: battery
  intent: Generate a DIFFaX input file for simulating XRD patterns of T#2-LiCoO2 with stacking faults,
    using the orthorhombic slab definitions from Table 3 of the paper.
  human_prompt_seed: Generate a DIFFaX input file for simulating XRD patterns of T#2-LiCoO2 structures
    with stacking faults. Use the six orthorhombic slab definitions from Table 3 of the Carlier et al.
    2004 paper (a=4.8450 Å, b=2.8097 Å, c=4.9541 Å) with Co and O atomic positions as specified. Include
    transition probability matrices for simulating O2-type and O6-type stacking faults. Output the file
    as diffrax_t2_stacking_faults.inp.
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_inp_exists
    value: diffrax_t2_stacking_faults.inp
  - key: slab_count_check
    value:
      tokens:
      - slab 1
      - slab 2
      - slab 3
      - slab 4
      - slab 5
      - slab 6
      filename: diffrax_t2_stacking_faults.inp
  - key: lattice_params_diffax
    value:
      tokens:
      - '4.8450'
      - '2.8097'
      - '4.9541'
      filename: diffrax_t2_stacking_faults.inp
  - key: atom_types_check
    value:
      tokens:
      - Co
      - O
      filename: diffrax_t2_stacking_faults.inp
  - key: transition_matrix
    value:
      pattern: transition.*probability|probability.*matrix
      filename: diffrax_t2_stacking_faults.inp
  - key: grounding_source
    value:
      filename: diffrax_t2_stacking_faults.inp
  - key: turn_budget
    value:
      max: 25
  - key: no_retries
    value:
      max: 1
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_inp_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file diffrax_t2_stacking_faults.inp exists.'
  - id: slab_count_check
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input file references all 6 slabs from Table 3.'
  - id: lattice_params_diffax
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Lattice parameters a=4.8450, b=2.8097, c=4.9541 are present.'
  - id: atom_types_check
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input file contains Co and O atom type definitions.'
  - id: transition_matrix
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Input file includes transition probability matrix for stacking fault simulation.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The DIFFaX input is grounded in the source paper''s Table 3 slab definitions.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 1.0
    criterion: '[Must] Uses at most 25 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 1.0
    criterion: '[Must] No retry tool calls used.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 1.0
    criterion: '[Must] Completes within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 1.0
    criterion: '[Must] Uses at most 50000 tokens total.'
- id: IG_diffract_002_20250618
  capability: input_generation
  domain: battery
  intent: Generate a DIFFaX input file for simulating the basic T#2-LiCoO2 XRD pattern using the two hexagonal
    slab definitions from Table 1, with gliding of every second CoO2 slab.
  human_prompt_seed: 'Generate a DIFFaX input file for simulating XRD patterns of T#2-LiCoO2 derived from
    the O2 structure by gliding every second CoO2 slab by (1/3, 1/6, 0). Use the two hexagonal slab definitions
    from Table 1: a=2.8081 Å, c=4.9512 Å; slab 1 with Co at (0,0,1/2), O(1) at (2/3,1/3,0.3), O(2) at
    (1/3,2/3,0.7); slab 2 with Co at (2/3,1/3,1/2), O(1) at (0,0,0.3), O(2) at (1/3,2/3,0.7). Output the
    file as diffrax_t2_basic.inp.'
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_inp_basic_exists
    value: diffrax_t2_basic.inp
  - key: slab_def_check
    value:
      tokens:
      - slab 1
      - slab 2
      filename: diffrax_t2_basic.inp
  - key: hex_lattice_check
    value:
      tokens:
      - '2.8081'
      - '4.9512'
      filename: diffrax_t2_basic.inp
  - key: gliding_vector
    value:
      pattern: 1/3.*1/6|0\.333.*0\.167|translation.*vector
      filename: diffrax_t2_basic.inp
  - key: atom_sites_basic
    value:
      tokens:
      - Co
      - O
      filename: diffrax_t2_basic.inp
  - key: grounding_source
    value:
      filename: diffrax_t2_basic.inp
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 1
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_inp_basic_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file diffrax_t2_basic.inp exists.'
  - id: slab_def_check
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input file defines both slab 1 and slab 2 from Table 1.'
  - id: hex_lattice_check
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Hexagonal lattice parameters a=2.8081 and c=4.9512 are present.'
  - id: gliding_vector
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Input file specifies the (1/3, 1/6, 0) gliding/translation vector between slabs.'
  - id: atom_sites_basic
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Input file contains Co and O atom site definitions.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The DIFFaX input is grounded in the source paper''s Table 1 slab definitions for
      the T#2 structure.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 1.0
    criterion: '[Must] Uses at most 20 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 1.0
    criterion: '[Must] No retry tool calls used.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 1.0
    criterion: '[Must] Completes within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 1.0
    criterion: '[Must] Uses at most 50000 tokens total.'
- id: IG_nernst_002_20260108
  capability: input_generation
  domain: battery
  intent: Implement the Nernst equation to compute effective redox potentials for the H₅IO₆/HIO₃ redox
    couple as a function of pH, reproducing the methodology used in the paper's LiIn(IO₃)₄ synthesis analysis.
  human_prompt_seed: Implement the Nernst equation to compute the effective electrochemical redox potential
    of the H₅IO₆/HIO₃ redox couple (E° = 1.626 V) as a function of pH, following the methodology described
    in Wang et al. (2024) for the LiIn(IO₃)₄ aqueous synthesis system. The half-reaction is H₅IO₆ + H⁺
    + 2e⁻ → HIO₃ + 3H₂O. Write a Python script that computes E(pH) for pH values from 0 to 14 in steps
    of 0.1, and save the results to nernst_redox_potential.csv with columns 'pH' and 'E_V'.
  tags: []
  data_files: []
  reference_answers:
  - key: row_count
    value:
      checks:
      - key: num_rows
        expected: 141
        tolerance: 0
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: col_count
    value:
      checks:
      - key: num_columns
        expected: 2
        tolerance: 0
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: numeric_values
    value:
      checks:
      - key: E_at_pH_0
        expected: 1.626
        tolerance: 0.001
        allow_missing_key: false
      - key: E_at_pH_0_77
        expected: 1.603
        tolerance: 0.01
        allow_missing_key: false
      - key: E_at_pH_14
        expected: 1.212
        tolerance: 0.01
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: artifact_csv
    value:
      filename: nernst_redox_potential.csv
  - key: grounding_source
    value:
      filename: nernst_redox_potential.csv
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_csv
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] Output file nernst_redox_potential.csv exists and is a valid CSV.'
  - id: row_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] The CSV contains exactly 141 data rows (pH from 0.0 to 14.0 in 0.1 steps).'
  - id: col_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 10.0
    criterion: '[Must] The CSV has exactly 2 columns: ''pH'' and ''E_V''.'
  - id: numeric_values
    axis: correctness
    verify: text_file_numeric_range
    weight: 30.0
    criterion: '[Suggested] E(pH=0) ≈ 1.626 V, E(pH=0.77) ≈ 1.603 V, E(pH=14) ≈ 1.212 V, all within tolerance
      of the Nernst equation E = 1.626 - 0.02955×pH.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 15.0
    criterion: '[Must] The answer correctly implements the Nernst equation as described in the source
      paper (equation 10, Methods section).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not request human intervention or retry the task.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses no more than 50000 tokens total.'
- id: IG_pourbaix_formula_003_20260108
  capability: input_generation
  domain: battery
  intent: Implement the Pourbaix potential formula (equation 3) from the paper as a reusable Python function,
    with test cases for LiFePO₄ and H₂O at specified conditions.
  human_prompt_seed: 'Implement the Pourbaix potential formula from Wang et al. (2024) as a Python function.
    The Pourbaix potential (equation 3 in the paper) is:

    Φ̄ = (1/N_M) × [(G − N_O·μ_H₂O) − RT·ln(10)·(2N_O − N_H)·pH − (2N_O − N_H + Q)·E]

    where N_M, N_O, N_H are the number of metal, oxygen, and hydrogen atoms; Q is the charge; G is the
    molar Gibbs free energy; μ_H₂O is the chemical potential of water; R is the gas constant; T is temperature;
    pH and E are the electrochemical conditions.

    Write a Python function `compute_pourbaix_potential(formula, G_eV_per_formula, pH, E_V, T=298.15)`
    that parses a chemical formula (e.g., ''LiFePO4''), counts atoms, and returns the Pourbaix potential
    in eV/atom. Save the function and a test script to pourbaix_potential.py. The test script should compute
    Φ̄ for LiFePO₄ (G ≈ −18.0 eV/formula, approximate) at pH=9.27, E=−0.56 V, and for H₂O (G = 0 by convention,
    Q=0) at pH=7, E=0 V.'
  tags: []
  data_files: []
  reference_answers:
  - key: artifact_python_file
    value: pourbaix_potential.py
  - key: function_exists
    value:
      flags: []
      tokens:
      - def compute_pourbaix_potential
      filename: pourbaix_potential.py
  - key: formula_parsing
    value:
      flags:
      - case_insensitive
      tokens:
      - Li
      - Fe
      - P
      - O
      filename: pourbaix_potential.py
  - key: numeric_output_present
    value:
      flags:
      - case_insensitive
      tokens:
      - pourbaix_potential
      - eV
      filename: pourbaix_potential.py
  - key: grounding_source
    value: {}
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_python_file
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] Output file pourbaix_potential.py exists.'
  - id: function_exists
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Must] The file contains a function named `compute_pourbaix_potential` with the specified
      signature.'
  - id: formula_parsing
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Must] The function correctly parses chemical formulas including LiFePO₄ (must identify
      Li, Fe, P, O counts).'
  - id: numeric_output_present
    axis: correctness
    verify: text_file_contains_all
    weight: 15.0
    criterion: '[Suggested] The test script prints or computes Pourbaix potential values in eV/atom units.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 15.0
    criterion: '[Must] The implementation follows equation (3) from the source paper, including all terms
      (G, μ_H₂O, pH, E dependence).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not request human intervention or retry the task.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes the task within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses no more than 50000 tokens total.'
