- id: IG_nernst_002_20260108
  capability: input_generation
  domain: battery
  intent: Implement the Nernst equation to compute effective redox potentials for the H₅IO₆/HIO₃ redox
    couple as a function of pH, reproducing the methodology used in the paper's LiIn(IO₃)₄ synthesis analysis.
  human_prompt_seed: Implement the Nernst equation to compute the effective electrochemical redox potential
    of the H₅IO₆/HIO₃ redox couple (E° = 1.626 V) as a function of pH, following the methodology described
    in Wang et al. (2024) for the LiIn(IO₃)₄ aqueous synthesis system. The half-reaction is H₅IO₆ + H⁺
    + 2e⁻ → HIO₃ + 3H₂O. Write a Python script that computes E(pH) for pH values from 0 to 14 in steps
    of 0.1, and save the results to nernst_redox_potential.csv with columns 'pH' and 'E_V'.
  tags:
  - char_electrochem
  data_files: []
  reference_answers:
  - key: row_count
    value:
      checks:
      - key: num_rows
        expected: 141
        tolerance: 0
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: col_count
    value:
      checks:
      - key: num_columns
        expected: 2
        tolerance: 0
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: numeric_values
    value:
      checks:
      - key: E_at_pH_0
        expected: 1.626
        tolerance: 0.001
        allow_missing_key: false
      - key: E_at_pH_0_77
        expected: 1.603
        tolerance: 0.01
        allow_missing_key: false
      - key: E_at_pH_14
        expected: 1.212
        tolerance: 0.01
        allow_missing_key: false
      filename: nernst_redox_potential.csv
  - key: artifact_csv
    value:
      filename: nernst_redox_potential.csv
  - key: grounding_source
    value:
      filename: nernst_redox_potential.csv
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
