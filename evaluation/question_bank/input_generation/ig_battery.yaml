  - eng_vasp
  data_files:
  - key: structure
    path: lifepo4_unitcell.cif
    oss_url: ''
    description: LiFePO₄ olivine structure (Pnma space group) from Materials Project.
  reference_answers:
  - key: artifact_incar
    value: INCAR
  - key: text_contains_encut
    value:
      flags: []
