- id: IG_gpumd_003_20260523
  capability: input_generation
  domain: agnostic
  intent: Generate a GPUMD NEMD `run.in` with correct heat source/sink syntax,
    group-based temperature statistics, and proper command ordering.
  human_prompt_seed: |
    请写一份用于界面热输运 NEMD 的 GPUMD `run.in`：
    - 体系已分为 9 个 group（0=左固定壁, 1=热源, 2-6=传热区, 7=热汇, 8=右固定壁）
    - 固定两端壁（group 0 和 8）
    - 热源 group 1，热汇 group 7，目标温度 300K
    - 需要逐 group 温度统计
    - 先平衡 200ps，再生产 2ns
    - 时间步 1fs
  tags:
  - eng_gpumd
  data_files: []
  reference_answers:
  - key: run_in_artifact
    value: run.in
  - key: nemd_core_tokens
    value:
      filename: run.in
      tokens:
      - potential
      - ensemble heat_lan
      - fix
      - compute_temperature
      - run
      flags: i
  - key: heat_lan_syntax
    value:
      filename: run.in
      pattern: ensemble\s+heat_lan\s+\d+\.?\d*\s+\d+\.?\d*\s+\d+\s+source\s+\d+\s+sink\s+\d+
      flags: i
  - key: fix_both_walls
    value:
      filename: run.in
      pattern: fix\s+0[\s\S]*fix\s+8
      flags: ''
  - key: potential_first
    value:
      filename: run.in
      pattern: (?s)\A\s*potential\b
      flags: ''
  - key: turn_budget
    value:
      max: 10
  scoring_checklist:
  - id: run_in_artifact
    criterion: Agent writes `run.in` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: nemd_core_tokens
    criterion: run.in contains all NEMD core keywords (potential, ensemble heat_lan,
      fix, compute_temperature, run).
    axis: correctness
    verify: text_file_contains_all
  - id: heat_lan_syntax
    criterion: '[Must] ensemble heat_lan line has correct GPUMD syntax:
      `ensemble heat_lan <T> <T> <Tcouple> source <g_src> sink <g_sink>`.
      Agent must not use LAMMPS-style syntax (fix langevin, etc).'
    axis: correctness
    verify: text_file_regex
    weight: 2.0
  - id: fix_both_walls
    criterion: '[Must] Both wall groups (0 and 8) are frozen with separate `fix`
      commands. GPUMD uses `fix <group_id>` (one per line).'
    axis: correctness
    verify: text_file_regex
    weight: 1.5
  - id: potential_first
    criterion: '[Must] `potential` is the first non-comment command in run.in.
      GPUMD requires potential declaration before any ensemble/run/compute.'
    axis: correctness
    verify: text_file_regex
    weight: 1.5
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget

