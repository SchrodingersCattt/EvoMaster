- id: IG_gpumd_001_20260504
  capability: input_generation
  domain: agnostic
  intent: Generate a GPUMD EMD thermal-conductivity `run.in` for graphene.
  human_prompt_seed: "请使用 GPUMD，按 EMD 热导率流程给石墨烯写一份可直接运行的 `run.in`。要求包含平衡段和生产段，并在生产段输出热流相关统计。"
  tags:
  - code_mlip
  - wf_inputs
  - phy_md
  - mat_2d
  data_files: []
  reference_answers:
  - key: run_in_artifact
    value: run.in
  - key: emd_core_tokens
    value:
      filename: run.in
      tokens:
      - potential
      - velocity
      - ensemble nve
      - compute_hac
      - dump_thermo
      - run
      flags: i
  scoring_checklist:
  - id: run_in_artifact
    criterion: 生成 `run.in`。
    axis: correctness
    verify: artifact_exists
  - id: emd_core_tokens
    criterion: 输入包含 EMD 热导率流程关键命令。
    axis: correctness
    verify: text_file_contains_all

