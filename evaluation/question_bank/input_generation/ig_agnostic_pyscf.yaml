- id: IG_pyscf_001_20260608
  capability: input_generation
  domain: agnostic
  intent: Generate a PySCF single-point DFT script using the wB97X-D functional. The
    agent must emit a PySCF-supported functional name and must NOT use the non-existent
    `wB97X-D3` name (removed from the skill docs because PySCF does not support it).
