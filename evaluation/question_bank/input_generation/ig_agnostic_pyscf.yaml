- id: IG_pyscf_005_20260608
  capability: input_generation
  domain: agnostic
  scope: knowledge
  intent: Trap question — the user explicitly asks for `wB97X-D3`, which PySCF does
    not support. The agent should recognize this, map it to the supported `wB97X-D`
    (or flag the mismatch), and NOT blindly write the unsupported name into the script.
  human_prompt_seed: '请用 PySCF 为甲醇分子 CH3OH 写一个单点 DFT 脚本 `run_pyscf.py`，使用 wB97X-D3
    泛函、def2-TZVP 基组，打印总能量。'
  tags:
  - eng_pyscf
  data_files: []
  reference_answers:
  - key: artifact_script
    value: run_pyscf.py
  - key: no_invalid_wb97xd3
    value:
      filename: run_pyscf.py
      pattern: xc\s*=\s*['\"]?\s*wB97X-D3
      flags: i
      expect: absent
  - key: turn_budget
    value:
      max: 12
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: artifact_script
    criterion: '[Must] Agent writes `run_pyscf.py` to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: no_invalid_wb97xd3
    criterion: '[Must] The script does NOT assign `xc = wB97X-D3` — that name is not a
      valid PySCF functional. The agent must substitute the supported `wB97X-D`.'
    axis: correctness
    verify: text_file_regex_absent
    weight: 3.0
  - id: recognized_unsupported
    criterion: '[Must] Agent recognizes that PySCF does not support the exact name
      `wB97X-D3`, and either maps it to the supported `wB97X-D` or clearly tells the
      user the requested name is unavailable. It does NOT silently submit an invalid
      functional.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
