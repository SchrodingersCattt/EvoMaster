  - eng_pyscf
  data_files: []
  reference_answers:
  - key: artifact_script
    value: run_pyscf.py
  - key: no_invalid_wb97xd3
    value:
      filename: run_pyscf.py
      pattern: xc\s*=\s*['\"]?\s*wB97X-D3
      flags: i
      expect: absent
  - key: turn_budget
    value:
      max: 12
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: artifact_script
    criterion: '[Must] Agent writes `run_pyscf.py` to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: no_invalid_wb97xd3
    criterion: '[Must] The script does NOT assign `xc = wB97X-D3` — that name is not a
      valid PySCF functional. The agent must substitute the supported `wB97X-D`.'
    axis: correctness
    verify: text_file_regex_absent
    weight: 3.0
  - id: recognized_unsupported
    criterion: '[Must] Agent recognizes that PySCF does not support the exact name
      `wB97X-D3`, and either maps it to the supported `wB97X-D` or clearly tells the
