- id: IG_pyscf_005_20260608
  capability: input_generation
  domain: agnostic
  scope: knowledge
  intent: Trap question — the user explicitly asks for `wB97X-D3`, which PySCF does
    not support. The agent should recognize this, map it to the supported `wB97X-D`
    (or flag the mismatch), and NOT blindly write the unsupported name into the script.
  human_prompt_seed: '请用 PySCF 为甲醇分子 CH3OH 写一个单点 DFT 脚本 `run_pyscf.py`，使用 wB97X-D3
    泛函、def2-TZVP 基组，打印总能量。'
