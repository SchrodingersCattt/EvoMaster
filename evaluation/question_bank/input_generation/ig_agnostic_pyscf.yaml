    value:
      max: 12
  - key: token_budget_total
    value:
      max: 9000
  scoring_checklist:
  - id: artifact_script
    criterion: '[Must] Agent writes `run_pyscf.py` to the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: functional_present
    criterion: '[Must] Script sets the DFT functional to the PySCF-supported `wB97X-D`
      (e.g. `mf.xc = ''wB97X-D''`).'
    axis: correctness
    verify: text_file_contains_all
  - id: no_invalid_wb97xd3
    criterion: '[Must] Script does NOT use the non-existent `wB97X-D3` functional name.
      PySCF supports `wB97X-D` but not `wB97X-D3`.'
    axis: correctness
    verify: text_file_regex_absent
    weight: 2.0
  - id: basis_present
    criterion: '[Must] Script uses the def2-TZVP basis set.'
    axis: correctness
    verify: text_file_contains_all
  - id: valid_dft_driver
    criterion: '[Must] Script builds a molecule with `gto.M`, runs a DFT calculation
      via `dft.RKS` (closed-shell), and prints/saves the total energy after `kernel()`.'
