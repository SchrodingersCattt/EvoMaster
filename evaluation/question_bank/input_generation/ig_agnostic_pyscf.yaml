    criterion: '[Must] The script realizes a real PySCF-supported range-separated
      hybrid with empirical dispersion. Acceptable approaches: (a) a built-in
      dispersion-inclusive functional name such as `wB97X-D`, `wB97X-V`, or `wB97M-V`;
