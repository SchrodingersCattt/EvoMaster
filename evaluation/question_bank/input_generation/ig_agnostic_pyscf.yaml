  - eng_pyscf
  data_files: []
  reference_answers:
  - key: artifact_script
    value: run_pyscf.py
  - key: functional_present
    value:
      filename: run_pyscf.py
      flags:
      - CASE_INSENSITIVE
      tokens:
      - wB97X-D
  - key: no_invalid_wb97xd3
    value:
      filename: run_pyscf.py
      pattern: wB97X-D3
      flags: i
      expect: absent
  - key: basis_present
    value:
      filename: run_pyscf.py
      flags:
      - CASE_INSENSITIVE
      tokens:
      - def2-TZVP
