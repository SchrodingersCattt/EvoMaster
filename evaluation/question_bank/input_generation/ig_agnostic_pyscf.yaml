    empirical dispersion) without naming an exact string. The agent must realize it
    with a PySCF-supported approach — either a built-in dispersion-inclusive name
    (e.g. wB97X-D) or a range-separated hybrid plus `mf.disp` (e.g. wB97X + d3bj) —
    and must NOT hallucinate the unsupported `wB97X-D3`.
  human_prompt_seed: '请用 PySCF 为苯分子 C6H6 写一个单点能量脚本 `run_pyscf.py`。方法上请选用一个
    带经验色散校正的范围分离杂化泛函（range-separated hybrid + dispersion），基组用 def2-SVP。'
