version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_lammps_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate a LAMMPS molecular dynamics input file for a simple Lennard-Jones
    system relaxation.
  human_prompt_seed: '请为一个 FCC 铜体系生成 LAMMPS 分子动力学输入文件，要求：

    1. 使用 EAM 势（Cu_u3.eam），晶格常数 3.615 Å

    2. 3×3×3 超胞

    3. NPT 系综，温度 300 K，压力 0 bar

    4. 运行 10000 步，时间步长 1 fs

    5. 每 100 步输出热力学信息

    输出文件名为 `in.lammps`。'
  tags:
  - lammps
  data_files: []
  reference_answers:
  - key: input_artifact
    value: in.lammps
  - key: required_keywords
    value:
      filename: in.lammps
      tokens:
      - pair_style
      - pair_coeff
      - fix
      - npt
      - run
      - thermo
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `in.lammps` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The input file contains essential LAMMPS keywords for an EAM MD simulation
      (pair_style, pair_coeff, fix npt, run, thermo).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The input file uses physically reasonable parameters consistent with
      the request (FCC Cu lattice constant ~3.615 Å, temperature 300 K, pressure 0,
      timestep 1 fs, 10000 steps).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Parameter choices are tied to the user request and standard Cu EAM
      simulation practice, not arbitrary values.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_cp2k_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate a CP2K DFT single-point energy input file for a simple bulk system.
  human_prompt_seed: '请为 MgO 岩盐结构（a=4.212 Å）生成 CP2K DFT 单点能计算输入文件，要求：

    1. 使用 PBE 泛函，DZVP 基组

    2. 平面波截断能 400 Ry

    3. SCF 收敛精度 1.0E-6

    4. 使用 Goedecker 赝势（GTH-PBE）

    输出文件名为 `cp2k.inp`。'
  tags:
  - cp2k
  data_files: []
  reference_answers:
  - key: input_artifact
    value: cp2k.inp
  - key: required_keywords
    value:
      filename: cp2k.inp
      tokens:
      - FORCE_EVAL
      - DFT
      - PBE
      - SCF
      - CUTOFF
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `cp2k.inp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The input file contains essential CP2K sections and keywords (FORCE_EVAL,
      DFT, PBE, SCF, CUTOFF).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The input file uses physically reasonable parameters for MgO (PBE functional,
      DZVP basis, GTH pseudopotentials, cutoff ~400 Ry, SCF convergence 1E-6).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: Parameters match the user request and standard CP2K MgO calculation
      practice.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate GROMACS simulation parameter file for energy minimization.
  human_prompt_seed: '请为一个蛋白质体系生成 GROMACS 能量最小化的参数文件，要求：

    1. 使用最速下降法（steepest descent）

    2. 最大步数 50000

    3. 能量收敛判据 emtol = 1000.0 kJ/mol/nm

    4. 步长 emstep = 0.01 nm

    5. 截断方案使用 Verlet，库仑和范德华截断距离 1.0 nm

    输出文件名为 `em.mdp`。'
  tags:
  - gromacs
  data_files: []
  reference_answers:
  - key: input_artifact
    value: em.mdp
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `em.mdp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The MDP file contains essential energy minimization parameters (integrator,
      steep, nsteps, emtol, emstep).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The MDP file uses correct values matching the request (steep integrator,
      50000 steps, emtol=1000, emstep=0.01, cutoff 1.0 nm, Verlet scheme).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All parameter values are directly traceable to the user request, not
      arbitrary defaults.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
