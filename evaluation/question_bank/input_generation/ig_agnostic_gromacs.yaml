version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_gromacs_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate GROMACS simulation parameter file for energy minimization.
  human_prompt_seed: '请为一个蛋白质体系生成 GROMACS 能量最小化的参数文件，要求：

    1. 使用最速下降法（steepest descent）

    2. 最大步数 50000

    3. 能量收敛判据 emtol = 1000.0 kJ/mol/nm

    4. 步长 emstep = 0.01 nm

    5. 截断方案使用 Verlet，库仑和范德华截断距离 1.0 nm

    输出文件名为 `em.mdp`。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: input_artifact
    value: em.mdp
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `em.mdp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The MDP file contains essential energy minimization parameters (integrator, steep, nsteps, emtol, emstep).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The MDP file uses correct values matching the request (steep integrator, 50000 steps, emtol=1000, emstep=0.01, cutoff 1.0 nm, Verlet scheme).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All parameter values are directly traceable to the user request, not arbitrary defaults.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_pdb_itp_consistency_001_20260602
  capability: input_generation
  domain: agnostic
  intent: Prepare reusable GROMACS input files for a Pb-surface grafting system.
  human_prompt_seed: '这些是我前面陆续得到的铅表面接枝萘甲酸体系相关文件。

    如果我要继续做这个体系的 GROMACS 模拟，请你帮我判断哪些文件可以复用、还需要补哪些文件，并把需要补齐或整理的输入文件生成到 `run_NA14_gromacs/` 目录下，文件名按下面这样放：

    - `Pb_NA14_solvated.pdb`
    - `Pb_NA.itp`
    - `topol.top`

    已提供的文件：

    - `Pb_NA14_solvated.pdb`
    - `Pb_PNA_merged.itp`
    - `topol_NA14.top`

    要求：

    - 不实际运行 GROMACS。
    - 不从头重建分子结构；已有体系的盒子信息和坐标信息应尽量保留。
    - 最后简短说明哪些文件可以复用，哪些文件是本次整理生成的。'
  tags:
  - eng_gromacs
  data_files:
  - key: initial_pdb
    path: data/IG_gromacs_pdb_itp_consistency_001_20260602/Pb_NA14_solvated.pdb
    oss_url: ''
    description: Starting PDB for the Pb-surface grafting system.
  - key: initial_itp
    path: data/IG_gromacs_pdb_itp_consistency_001_20260602/Pb_PNA_merged.itp
    oss_url: ''
    description: Ligand+Pb force-field file generated by an upstream parameterization step.
  - key: initial_topology
    path: data/IG_gromacs_pdb_itp_consistency_001_20260602/topol_NA14.top
    oss_url: ''
    description: Initial topology assembled during input preparation.
  reference_answers:
  - key: corrected_pdb_artifact
    value: run_NA14_gromacs/Pb_NA14_solvated.pdb
  - key: corrected_itp_artifact
    value: run_NA14_gromacs/Pb_NA.itp
  - key: corrected_topology_artifact
    value: run_NA14_gromacs/topol.top
  - key: pdb_order_requirement
    value: >-
      In every PNA residue, the atom-name order should match the corrected ITP
      [ atoms ] order: C1,C2,C3,C4,C5,C6,C7,C8,C9,C10,C11,O1,O2,H1,H2,H3,H4,H5,H6,H7,H8,Pb.
  - key: topology_name_requirement
    value: The corrected ITP [ moleculetype ] name must match the name used in topol_NA14_corrected.top [ molecules ].
  - key: metal_contact_requirement
    value: >-
      Correct the Pb-contact bond indices so they point to the intended atoms
      after the ITP atom order is applied: H8-Pb, O2-Pb, H1-Pb, and C1-Pb,
      not the stale upstream indices.
  - key: fixed_width_requirement
    value: The corrected PDB remains valid fixed-width PDB text; atom name, residue name, residue number, coordinates, occupancy, B-factor, and element fields are parseable by column slicing.
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 24000
  scoring_checklist:
  - id: corrected_pdb_artifact
    criterion: '`run_NA14_gromacs/Pb_NA14_solvated.pdb` exists in the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: corrected_itp_artifact
    criterion: '`run_NA14_gromacs/Pb_NA.itp` exists in the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: corrected_topology_artifact
    criterion: '`run_NA14_gromacs/topol.top` exists in the workspace.'
    axis: correctness
    verify: artifact_exists
  - id: pdb_order_requirement
    criterion: Each PNA residue in the corrected PDB is reordered to match the corrected ITP `[ atoms ]` sequence, without dropping or duplicating atoms.
    axis: correctness
    verify: llm_binary_judge
  - id: fixed_width_requirement
    criterion: The corrected PDB preserves fixed-width PDB columns so residue names, residue numbers, coordinates, and elements can be parsed by standard column slices.
    axis: correctness
    verify: llm_binary_judge
  - id: itp_naming_requirement
    criterion: The corrected ITP uses a consistent residue name for the Pb atom and a `[ moleculetype ]` name that is referenced by the corrected topology.
    axis: correctness
    verify: llm_binary_judge
  - id: metal_contact_requirement
    criterion: The corrected ITP updates stale metal-contact bond indices to the intended atoms under the ITP atom order, rather than only preserving the old bond lengths.
    axis: correctness
    verify: llm_binary_judge
  - id: topology_count_requirement
    criterion: The corrected topology includes the corrected ITP and its `[ molecules ]` section matches the molecule counts present in the corrected PDB.
    axis: correctness
    verify: llm_binary_judge
  - id: no_run_grounding
    criterion: The final answer states that this was a static input-preparation task and does not claim that GROMACS was run.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_002_20260508
  capability: input_generation
  domain: agnostic
  intent: Prepare a GROMACS minimization input directory and record the manifest gate.
  human_prompt_seed: '请为 GROMACS energy minimization 准备 `run_gromacs_em/`：

    - 生成或 adapt input files：`em.mdp`，参数为 steepest descent、nsteps=50000、emtol=1000、emstep=0.01。

    - 验证 `em.mdp` 并保存 machine-readable diagnostics 到 `run_gromacs_em/diagnosis.json`。

    - 写 `input_prep_manifest.json`。它必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，`submit_ready` 必须是 JSON boolean。

    - manifest 中必须包含 `submit_ready` gate；如果有 blockers 就不能提交。

    本题只生成输入目录，不实际运行 GROMACS。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: mdp_artifact
    value: em.mdp
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      required_keys:
      - software
      - task
      - input_dir
      - generated_files
      - user_provided_files
      - diagnostics
      - auxiliary_files
      - assumptions
      - submit_ready
      - bohrium_command
  - key: diagnosis_artifact
    value: diagnosis.json
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: output_grounding
    value: The final answer states that em.mdp, diagnosis.json, and input_prep_manifest.json were produced, records the submit_ready gate, and confirms no GROMACS run was started.
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: mdp_artifact
    criterion: The GROMACS input generation task writes `em.mdp` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The run directory includes `input_prep_manifest.json` with the required manifest fields and submit_ready gate.
    axis: correctness
    verify: json_file_schema
  - id: diagnosis_artifact
    criterion: The run directory includes machine-readable diagnostics as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The generated or adapted input file contains the requested GROMACS minimization parameters.
    axis: correctness
    verify: text_file_contains_all
  - id: output_grounding
    criterion: The final answer states that em.mdp, diagnosis.json, and input_prep_manifest.json were produced, records the submit_ready gate, and confirms no GROMACS run was started.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
