version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_gromacs_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate GROMACS simulation parameter file for energy minimization.
  human_prompt_seed: '请为一个蛋白质体系生成 GROMACS 能量最小化的参数文件，要求：

    1. 使用最速下降法（steepest descent）

    2. 最大步数 50000

    3. 能量收敛判据 emtol = 1000.0 kJ/mol/nm

    4. 步长 emstep = 0.01 nm

    5. 截断方案使用 Verlet，库仑和范德华截断距离 1.0 nm

    输出文件名为 `em.mdp`。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: input_artifact
    value: em.mdp
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `em.mdp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The MDP file contains essential energy minimization parameters (integrator,
      steep, nsteps, emtol, emstep).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The MDP file uses correct values matching the request (steep integrator,
      50000 steps, emtol=1000, emstep=0.01, cutoff 1.0 nm, Verlet scheme).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All parameter values are directly traceable to the user request, not
      arbitrary defaults.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_002_20260508
  capability: input_generation
  domain: agnostic
  intent: Adapt a GROMACS minimization input through input-manual-helper and record the manifest gate.
  human_prompt_seed: '请用 input-manual-helper 为 GROMACS energy minimization 准备 `run_gromacs_em/`：

    - 生成或 adapt input files：`em.mdp`，参数为 steepest descent、nsteps=50000、emtol=1000、emstep=0.01。

    - 选择 engine/task 时参考 `references/engine_routes.md`；GROMACS 属于 ABACUS, CP2K, QE, ABINIT, LAMMPS, ORCA, GROMACS, or PySCF 这组 engine input helper 路由中的一员。

    - 运行或模拟 `diagnose_input.py --software gromacs --input run_gromacs_em/em.mdp --json_out run_gromacs_em/diagnosis.json` 的诊断结果，并用 `scripts/write_manifest.py` 写 `input_prep_manifest.json`；不要 hand-write 或 omit required fields。

    - manifest 中必须包含 `submit_ready` gate；如果有 blockers 就不能提交。

    本题只生成输入目录，不实际运行 GROMACS。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: mdp_artifact
    value: em.mdp
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      required_keys:
      - software
      - task
      - input_dir
      - generated_files
      - user_provided_files
      - diagnostics
      - auxiliary_files
      - assumptions
      - submit_ready
      - bohrium_command
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: helper_route_grounding
    value: The answer routes GROMACS input generation through input-manual-helper and records a submit_ready manifest gate.
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: mdp_artifact
    criterion: The GROMACS input generation task writes `em.mdp` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The run directory includes `input_prep_manifest.json` written with `scripts/write_manifest.py`, without hand-writing or omitting required fields, and with the submit_ready gate.
    axis: correctness
    verify: json_file_schema
  - id: required_keywords
    criterion: The generated or adapted input file contains the requested GROMACS minimization parameters.
    axis: correctness
    verify: text_file_contains_all
  - id: helper_route_grounding
    criterion: The agent uses input-manual-helper to generate or adapt input files for an engine in the ABACUS, CP2K, QE, ABINIT, LAMMPS, ORCA, GROMACS, or PySCF route family, and validates with diagnose_input.py before any submission.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
