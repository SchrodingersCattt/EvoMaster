version: v5
capability: input_generation
domain: agnostic
questions:
- id: IG_gromacs_001_20260428
  capability: input_generation
  domain: agnostic
  intent: Generate GROMACS simulation parameter file for energy minimization.
  human_prompt_seed: '请为一个蛋白质体系生成 GROMACS 能量最小化的参数文件，要求：

    1. 使用最速下降法（steepest descent）

    2. 最大步数 50000

    3. 能量收敛判据 emtol = 1000.0 kJ/mol/nm

    4. 步长 emstep = 0.01 nm

    5. 截断方案使用 Verlet，库仑和范德华截断距离 1.0 nm

    输出文件名为 `em.mdp`。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: input_artifact
    value: em.mdp
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_artifact
    criterion: Agent writes `em.mdp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The MDP file contains essential energy minimization parameters (integrator, steep, nsteps, emtol, emstep).
    axis: correctness
    verify: text_file_contains_all
  - id: physical_params
    criterion: The MDP file uses correct values matching the request (steep integrator, 50000 steps, emtol=1000, emstep=0.01, cutoff 1.0 nm, Verlet scheme).
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: All parameter values are directly traceable to the user request, not arbitrary defaults.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_002_20260508
  capability: input_generation
  domain: agnostic
  intent: Prepare a GROMACS minimization input directory and record the manifest gate.
  human_prompt_seed: '请为 GROMACS energy minimization 准备 `run_gromacs_em/`：

    - 生成或 adapt input files：`em.mdp`，参数为 steepest descent、nsteps=50000、emtol=1000、emstep=0.01。

    - 验证 `em.mdp` 并保存 machine-readable diagnostics 到 `run_gromacs_em/diagnosis.json`。

    - 写 `input_prep_manifest.json`。它必须是 JSON object，至少包含这些顶层字段：software、task、input_dir、generated_files、user_provided_files、diagnostics、auxiliary_files、assumptions、submit_ready、bohrium_command；其中 `diagnostics.file` 必须是 `diagnosis.json`，`submit_ready` 必须是 JSON boolean。

    - manifest 中必须包含 `submit_ready` gate；如果有 blockers 就不能提交。

    本题只生成输入目录，不实际运行 GROMACS。'
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: mdp_artifact
    value: em.mdp
  - key: manifest_schema
    value:
      filename: input_prep_manifest.json
      required_keys:
      - software
      - task
      - input_dir
      - generated_files
      - user_provided_files
      - diagnostics
      - auxiliary_files
      - assumptions
      - submit_ready
      - bohrium_command
  - key: diagnosis_artifact
    value: diagnosis.json
  - key: required_keywords
    value:
      filename: em.mdp
      tokens:
      - integrator
      - steep
      - nsteps
      - emtol
      - emstep
      flags: i
  - key: output_grounding
    value: The final answer states that em.mdp, diagnosis.json, and input_prep_manifest.json were produced, records the submit_ready gate, and confirms no GROMACS run was started.
  - key: turn_budget
    value:
      max: 12
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 14000
  scoring_checklist:
  - id: mdp_artifact
    criterion: The GROMACS input generation task writes `em.mdp` in the prepared run directory.
    axis: correctness
    verify: artifact_exists
  - id: manifest_schema
    criterion: The run directory includes `input_prep_manifest.json` with the required manifest fields and submit_ready gate.
    axis: correctness
    verify: json_file_schema
  - id: diagnosis_artifact
    criterion: The run directory includes machine-readable diagnostics as `diagnosis.json`.
    axis: correctness
    verify: artifact_exists
  - id: required_keywords
    criterion: The generated or adapted input file contains the requested GROMACS minimization parameters.
    axis: correctness
    verify: text_file_contains_all
  - id: output_grounding
    criterion: The final answer states that em.mdp, diagnosis.json, and input_prep_manifest.json were produced, records the submit_ready gate, and confirms no GROMACS run was started.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: IG_gromacs_003_20260527
  capability: input_generation
  domain: agnostic
  intent: Parameterize 乙醇 with GAFF and validate minimal GROMACS run on Bohrium.
  human_prompt_seed: "请为分子 `乙醇`（SMILES: `CCO`）完成 GROMACS 小分子参数化与最小可运行验证。使用 `GAFF` 力场路线，投递任务。\n\
    将所有产物（提交脚本、参数化文件、运行日志、验证报告）整理到 `run_ligand_ethanol_gaff/` 目录下。"
  tags:
  - eng_gromacs
  data_files: []
  reference_answers:
  - key: run_script_artifact
    value: run_ligand_ethanol_gaff/run.sh
  - key: report_artifact
    value: run_ligand_ethanol_gaff/validation_report.json
  - key: run_log_artifact
    value: run_ligand_ethanol_gaff/em.log
  - key: gmx_gro_artifact
    value: run_ligand_ethanol_gaff/LIG_GMX.gro
  - key: gmx_itp_artifact
    value: run_ligand_ethanol_gaff/LIG_GMX.itp
  - key: gmx_top_artifact
    value: run_ligand_ethanol_gaff/LIG_GMX.top
  - key: route_and_run_commands
    value:
      filename: run_ligand_ethanol_gaff/run.sh
      pattern: (?is)acpype.*\b-a\s+gaff\b.*(gmx|gmx_mpi)\s+grompp.*(gmx|gmx_mpi)\s+mdrun
      flags: is
  - key: must_parameter_outputs
    value: ACPYPE 成功生成 GROMACS 文件：目录下存在 *_GMX.gro、*_GMX.itp、*_GMX.top。
  - key: em_convergence_should
    value: 能量最小化收敛：日志中出现 "converged to Fmax"，或 nsteps 用完时 Epot < 初始值。
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
  - id: run_script_artifact
    criterion: '`run_ligand_ethanol_gaff/run.sh` exists in workspace.'
    axis: correctness
    verify: artifact_exists
  - id: report_artifact
    criterion: '`run_ligand_ethanol_gaff/validation_report.json` exists in workspace.'
    axis: correctness
    verify: artifact_exists
  - id: run_log_artifact
    criterion: '`run_ligand_ethanol_gaff/em.log` exists in workspace.'
    axis: correctness
    verify: artifact_exists
  - id: gmx_gro_artifact
    criterion: '[Must] `LIG_GMX.gro` is exported to run directory.'
    axis: correctness
    verify: artifact_exists
  - id: gmx_itp_artifact
    criterion: '[Must] `LIG_GMX.itp` is exported to run directory.'
    axis: correctness
    verify: artifact_exists
  - id: gmx_top_artifact
    criterion: '[Must] `LIG_GMX.top` is exported to run directory.'
    axis: correctness
    verify: artifact_exists
  - id: route_and_run_commands
    criterion: '[Must] run.sh uses ACPYPE with GAFF and includes grompp + mdrun.'
    axis: correctness
    verify: text_file_regex
  - id: must_parameter_outputs
    criterion: '[Must] ACPYPE 成功生成 GROMACS 文件：目录下存在 *_GMX.gro、*_GMX.itp、*_GMX.top。'
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: em_convergence_should
    criterion: '[Should] 能量最小化收敛：日志中出现 "converged to Fmax"，或 nsteps 用完时 Epot < 初始值。'
    axis: correctness
    verify: llm_binary_judge
    weight: 0.6
  - id: grounding_source
    criterion: Claims are grounded in actual run outputs/logs; no fabricated success.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
