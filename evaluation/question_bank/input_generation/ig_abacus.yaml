- id: IG_abacus_007_20260406
  capability: input_generation_abacus
  domain: elec
  intent: 'Generate ABACUS LCAO spin-polarized electric-field SCF and NSCF band inputs for a nanoribbon, including a line-mode KPT from Gamma to Y.'
  human_prompt_seed: |
    读取工作区中的 `nanoribbon.stru`。

    请为 nanoribbon 体系准备一套“自旋极化 + 外电场”的 LCAO 输入：
    1) 生成 `INPUT_spin_elec_scf`：`calculation scf`、`nspin 2`、`basis_type lcao`、`ecutwfc 100`、`scf_thr 1e-6`、`smearing_method gaussian`、`smearing_sigma 0.001`、`mixing_beta 0.1`、`mixing_ndim 20`、`mixing_gg0 1.5`。
    2) 在 SCF 输入中添加外电场参数：`efield_flag 1`、`efield_dir 2`、`efield_amp` 为约 `1e-3` 量级的小有限电场（例如 `0.0019440124`）、`efield_pos_max 0.95`、`efield_pos_dec 0.10`。
    3) 生成 `INPUT_spin_elec_band`：采用 `calculation nscf`，从已有电荷密度读入（`init_chg file`），其余与自旋极化外场设置保持一致。
    4) 生成 `KPT_band`：使用 line-mode，从 `Gamma (0 0 0)` 到 `Y (0 0.5 0)`，并采用足够致密的路径采样（例如 80–120 点，100 点是常用选择）。

    将完整文件写到当前目录：`INPUT_spin_elec_scf`、`INPUT_spin_elec_band`、`KPT_band`。
  tags:
  - abacus
  - electric_field
  - nanoribbon
  - band_structure
  mode_scope:
  - direct
  - planner
