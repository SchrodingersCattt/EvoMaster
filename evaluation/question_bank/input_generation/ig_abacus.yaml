    1) 为体相生成 `INPUT_bulk_relax`：采用 `calculation cell-relax`，`basis_type pw`，`ecutwfc 60`，`scf_nmax 100`，`relax_nmax 100`，`smearing_method gauss`，`smearing_sigma 0.0074`。
    2) 为 5 层和 7 层 slab 分别生成 `INPUT_slab5`、`INPUT_slab7`：采用 `calculation relax`，保留给定 STRU 中的原子固定/弛豫标记，不改结构本身。
    3) 生成 `KPT_bulk` 与 `KPT_slab`：bulk 使用三维均匀网格；slab 使用 Gamma-centered 网格，面内较密、真空方向为 1（例如 `20 20 1` 可作为合理示例）。

    将完整文件写到当前目录：`INPUT_bulk_relax`、`INPUT_slab5`、`INPUT_slab7`、`KPT_bulk`、`KPT_slab`。
