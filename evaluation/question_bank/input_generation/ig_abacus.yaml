    description: Al slab geometry used for electrostatic-potential and work-function setup.
  reference_answers:
  - key: markers_contains
    value:
    - calculation scf
    - basis_type pw
    - out_pot 2
    - K_POINTS
    - Gamma
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: input_out_pot_pw
    criterion: INPUT_pot is a PW SCF calculation that includes the required parameters from the task (`calculation scf`, `basis_type pw`, `ecutwfc 60`, `nbands 40`, `smearing_method gauss`, `smearing_sigma 0.0074`, `out_pot 2`).
    axis: correctness
    verify: llm_binary_judge
  - id: kpt_dense_inplane
    criterion: KPT_pot uses a Gamma-centered mesh with dense in-plane sampling (not lower than 12x12) and exactly one k-point along the vacuum direction.
    axis: correctness
    verify: llm_binary_judge
  - id: markers_contains
    criterion: "Final answer text or generated files include required INPUT/KPT markers: calculation scf, basis_type pw, out_pot 2, and a Gamma-centered k-mesh with third component equal to 1."
    axis: correctness
    verify: contains_all
  - id: grounding_source
    criterion: The generated setup is grounded in base_al_slab.stru and does not invent unrelated structural changes; changes are limited to INPUT_pot and KPT_pot preparation.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Produces INPUT_pot and KPT_pot efficiently without unnecessary exploration.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget

