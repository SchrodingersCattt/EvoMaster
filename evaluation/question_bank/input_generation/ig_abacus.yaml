    description: Seven-layer Al fcc(100) slab with selective-relaxation flags.
  reference_answers:
  - key: markers_contains
    value:
    - INPUT_bulk_relax
    - INPUT_slab5
    - INPUT_slab7
    - KPT_bulk
    - KPT_slab
    - calculation cell-relax
    - calculation relax
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: bulk_surface_inputs
    criterion: The generated files include one PW `cell-relax` bulk input (INPUT_bulk_relax), two PW `relax` slab inputs (INPUT_slab5 and INPUT_slab7) preserving selective-relaxation flags, plus slab-appropriate KPT settings.
    axis: correctness
    verify: llm_binary_judge
  - id: slab_kmesh
    criterion: KPT_slab uses a Gamma-centered anisotropic mesh with only one k-point along the vacuum direction, while KPT_bulk remains a three-dimensional bulk mesh.
    axis: correctness
    verify: llm_binary_judge
  - id: markers_contains
    criterion: "Final answer text or generated files include required product markers: INPUT_bulk_relax, INPUT_slab5, INPUT_slab7, KPT_bulk, KPT_slab, `calculation cell-relax`, and `calculation relax`."
    axis: correctness
