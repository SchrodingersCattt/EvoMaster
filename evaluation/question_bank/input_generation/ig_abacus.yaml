- id: IG_abacus_007_20260409v3
  capability: input_generation
  domain: elec
  intent: Generate ABACUS LCAO spin-polarized electric-field SCF and NSCF band inputs
    for a nanoribbon, including a line-mode KPT from Gamma to Y.
  human_prompt_seed: |
    工作区中提供了 nanoribbon 结构。

    请准备一套“自旋极化 + 外电场”ABACUS LCAO 输入：
    1) 生成 SCF 输入，包含外电场控制参数。
    2) 生成对应的 NSCF band 输入，要求读取已收敛电荷。
    3) 生成 line-mode KPT，覆盖 Gamma 到 Y 的能带路径并保证采样足够密。

    将结果写入当前目录：`INPUT_spin_elec_scf`、`INPUT_spin_elec_band`、`KPT_band`。
  tags:
  - abacus
  - electric_field
  - nanoribbon
  - band_structure
  mode_scope:
  - direct
  - planner
  data_files:
  - key: nanoribbon
    path: data/IG_abacus_007_20260406/nanoribbon.stru
    oss_url: ''
    description: Nanoribbon structure with vacuum for electric-field and band-structure
      setup.
  reference_answers:
  - key: must_input_spin_scf_core
    value:
      filename: INPUT_spin_elec_scf
      tokens:
      - calculation scf
      - nspin 2
      - basis_type lcao
      - efield_flag 1
      - efield_dir 2
      flags: i
  - key: must_input_spin_band_core
    value:
      filename: INPUT_spin_elec_band
      tokens:
      - calculation nscf
      - init_chg file
      - nspin 2
      flags: i
  - key: must_kpt_band_path_core
    value:
      filename: KPT_band
      pattern: "(?is)(line|line_mode|line-mode).*(gamma|\\bg\\b)\\s*0\\s*0\\s*0.*\\by\\b\\s*0\\s*0\\.5\\s*0"
      flags: is
  - key: suggested_input_spin_numerics
    value:
      filename: INPUT_spin_elec_scf
      pattern: "(?ims)(?=.*^\\s*ecutwfc\\s+100(?:\\.0+)?\\s*(?:#.*)?$)(?=.*^\\s*scf_thr\\s+1(?:\\.0+)?[eE]-6\\s*(?:#.*)?$)(?=.*^\\s*smearing_method\\s+(?:gauss|gaussian)\\s*(?:#.*)?$)(?=.*^\\s*smearing_sigma\\s+0\\.001(?:0+)?\\s*(?:#.*)?$)"
      flags: is
  - key: suggested_input_spin_mixing
    value:
      filename: INPUT_spin_elec_scf
      tokens:
      - mixing_beta 0.1
      - mixing_ndim 20
      - mixing_gg0 1.5
      flags: i
  - key: variable_efield_amp_small
    value:
      filename: INPUT_spin_elec_scf
      pattern: efield_amp\s+0\.00[0-9]+
      flags: i
  - key: variable_kpt_band_density
    value:
      filename: KPT_band
      pattern: "\\b(?:80|8[1-9]|9\\d|10\\d|11\\d|120)\\b"
      flags: i
  - key: input_spin_scf_artifact
    value: INPUT_spin_elec_scf
  - key: input_spin_band_artifact
    value: INPUT_spin_elec_band
  - key: kpt_band_artifact
    value: KPT_band
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: must_input_spin_scf_core
    criterion: "[Must] INPUT_spin_elec_scf contains core spin-polarized SCF + external-field
