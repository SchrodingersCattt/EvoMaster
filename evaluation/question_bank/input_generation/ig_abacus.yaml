version: v5
capability: input_generation
domain: elec
questions:
- id: IG_abacus_001_20260409v4
  capability: input_generation
  domain: elec
  intent: 'Add ABACUS LCAO BSSE correction for Fe(110) slab: define Fe_empty species,
    place empty-atom layers in vacuum, and write SCF INPUT with sparse k along vacuum.'
  human_prompt_seed: |
    工作区中提供了仅含真实 Fe 原子的表面 slab 结构（尚未做 BSSE 校正）。

    请准备 ABACUS LCAO 单点输入用于 NAO-BSSE 校正：
    1) 在结构中引入 empty/ghost 物种用于补足基组。
    2) 在真空区域布置 empty 原子层，保证位于 slab 外侧而不是埋入体内。
    3) 生成与该场景匹配的 SCF INPUT，沿真空方向使用单点/稀疏采样。

    将结果写入当前目录：`STRU_bsse`、`INPUT_bsse`。
  tags:
  - abacus
  - bsse
  - empty_atom
  - surface
  mode_scope:
  - direct
  - planner
  data_files:
  - key: base_slab
    path: data/IG_abacus_001_20260404/base_slab.stru
    oss_url: ''
    description: Fe slab STRU without Fe_empty (starting geometry for BSSE setup).
  reference_answers:
  - key: must_stru_bsse_fe_empty_core
    value:
      filename: STRU_bsse
      tokens:
      - Fe_empty
      - '0.000000'
      flags: i
  - key: must_input_bsse_core
    value:
      filename: INPUT_bsse
      tokens:
      - calculation scf
      - basis_type lcao
      - nspin 2
      flags: i
  - key: must_input_bsse_vacuum_kspacing
    value:
      filename: INPUT_bsse
      pattern: kspacing\s+(?:\S+\s+\S+\s+1(?:\.0+)?|1(?:\.0+)?)
      flags: i
  - key: suggested_input_bsse_numerics
    value:
      filename: INPUT_bsse
      pattern: "(?ims)(?=.*^\\s*ecutwfc\\s+100(?:\\.0+)?\\s*(?:#.*)?$)(?=.*^\\s*scf_thr\\s+1(?:\\.0+)?[eE]-7\\s*(?:#.*)?$)"
      flags: is
  - key: suggested_input_bsse_smearing
    value:
      filename: INPUT_bsse
      pattern: "(?ims)(?=.*^\\s*smearing_method\\s+(?:gauss|gaussian)\\s*(?:#.*)?$)(?=.*^\\s*smearing_sigma\\s+0\\.01(?:0+)?\\s*(?:#.*)?$)"
      flags: is
  - key: variable_empty_layer_placement
    value: {}
  - key: variable_fe_empty_species_quality
    value: {}
  - key: stru_bsse_artifact
    value: STRU_bsse
  - key: input_bsse_artifact
    value: INPUT_bsse
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: must_stru_bsse_fe_empty_core
    criterion: "[Must] STRU_bsse includes Fe_empty with explicit empty-species charge
      marker."
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_input_bsse_core
    criterion: "[Must] INPUT_bsse uses LCAO SCF core controls (`calculation scf`,
      `basis_type lcao`, `nspin 2`)."
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_input_bsse_vacuum_kspacing
    criterion: "[Must] INPUT_bsse sets sparse vacuum-axis k-spacing (either single
      `kspacing 1.0` or three-component form with the third component ~=1.0)."
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: suggested_input_bsse_numerics
    criterion: "[Suggested] INPUT_bsse follows benchmark numeric settings (`ecutwfc
      100`, `scf_thr 1e-7`)."
    axis: correctness
    verify: text_file_regex
    weight: 0.6
  - id: suggested_input_bsse_smearing
    criterion: "[Suggested] INPUT_bsse uses benchmark smearing controls (gauss/gaussian
      + sigma 0.01)."
    axis: correctness
    verify: text_file_regex
    weight: 0.6
  - id: variable_empty_layer_placement
    criterion: "[Variable] Empty Fe layers are placed on both slab sides in vacuum,
      not buried inside slab."
    axis: correctness
    verify: llm_binary_judge
    weight: 0.3
  - id: variable_fe_empty_species_quality
    criterion: "[Variable] Fe_empty species configuration is physically consistent
      with ghost-basis usage (matching PP/orbital, no spurious empty-site magnetic
      setup)."
    axis: correctness
    verify: llm_binary_judge
    weight: 0.3
  - id: stru_bsse_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `STRU_bsse` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: input_bsse_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `INPUT_bsse` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: grounding_source
    criterion: The modified STRU preserves the original slab lattice vectors and real
      Fe fractional coordinates from base_slab.stru; changes are limited to adding
      Fe_empty species/layers and INPUT parameters. Judge solely from the final answer;
      do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
    axis: efficiency
    verify: no_retries
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling (last-turn total_tokens).
    axis: efficiency
    verify: token_budget
- id: IG_abacus_003_20260409v4
  capability: input_generation
  domain: elec
  intent: Generate ABACUS PW SCF INPUT and KPT files for Al slab electrostatic-potential
    calculation setup.
  human_prompt_seed: |
    工作区中提供了一个带真空层的 Al slab 结构（STRU）。

    请为该体系准备 ABACUS 平面波单点输入，用于后续静电势分析：
    1) 生成一份可直接运行的 SCF 输入文件，并确保包含静电势输出所需设置。
    2) 生成与 slab 几何相匹配的 K 点设置：面内采样应足够，法向方向使用单点采样。

    将结果写入当前目录：`INPUT_pot`、`KPT_pot`。
  tags:
  - abacus
  - electrostatic_potential
  - surface
  priority: P0
  mode_scope:
  - direct
  - planner
  data_files:
  - key: base_al_slab
    path: data/IG_abacus_003_20260406/base_al_slab.stru
    oss_url: ''
    description: Al slab geometry used for electrostatic-potential and work-function
      setup.
  reference_answers:
  - key: must_input_core
    value:
      filename: INPUT_pot
      tokens:
      - calculation scf
      - basis_type pw
      - out_pot 2
      flags: i
  - key: must_kpt_gamma_marker
    value:
      filename: KPT_pot
      tokens:
      - K_POINTS
      - Gamma
      flags: i
  - key: must_kpt_vacuum_axis_one
    value:
      filename: KPT_pot
      pattern: "^\\s*\\d+\\s+\\d+\\s+1(?:\\s+\\d+){0,3}\\s*$"
      flags: m
  - key: suggested_input_numerics
    value:
      filename: INPUT_pot
      tokens:
      - ecutwfc 60
      - nbands 40
      flags: i
  - key: variable_input_smearing
    value:
      filename: INPUT_pot
      pattern: smearing_method\s+(?:gauss(?:ian)?|fixed|mp2?|methfessel-paxton|mv|cold|marzari-vanderbilt|fd|fermi-dirac).*\bsmearing_sigma\s+(?:0\.0074|0\.01)\b
      flags: is
  - key: variable_kpt_inplane_density
    value:
      filename: KPT_pot
      pattern: "^\\s*(?:1[2-9]|[2-9]\\d|[1-9]\\d{2,})\\s+(?:1[2-9]|[2-9]\\d|[1-9]\\d{2,})\\s+1(?:\\s+\\d+){0,3}\\s*$"
      flags: m
  - key: input_pot_artifact
    value: INPUT_pot
  - key: kpt_pot_artifact
    value: KPT_pot
  - key: turn_budget
    value:
      max: 8
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: must_input_core
    criterion: "[Must] INPUT_pot contains core mandatory controls for this task (`calculation
      scf`, `basis_type pw`, `out_pot 2`)."
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_kpt_gamma_marker
    criterion: "[Must] KPT_pot is a Gamma-centered K-point file."
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: must_kpt_vacuum_axis_one
    criterion: "[Must] KPT_pot sets exactly one k-point along the slab vacuum axis."
    axis: correctness
    verify: text_file_regex
    weight: 1.0
  - id: suggested_input_numerics
    criterion: "[Suggested] INPUT_pot uses the benchmark numeric setup (`ecutwfc 60`,
      `nbands 40`)."
    axis: correctness
    verify: text_file_contains_all
    weight: 0.6
  - id: variable_input_smearing
    criterion: "[Variable] INPUT_pot uses an acceptable smearing style/value for this
      benchmark family."
    axis: correctness
    verify: text_file_regex
    weight: 0.3
  - id: variable_kpt_inplane_density
    criterion: "[Variable] KPT_pot uses sufficiently dense in-plane sampling while
      keeping vacuum-axis single-point."
    axis: correctness
    verify: text_file_regex
    weight: 0.3
  - id: input_pot_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `INPUT_pot` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: kpt_pot_artifact
    criterion: Generated deliverables count even if the final answer does not quote
      file contents; `KPT_pot` must be written to the workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.5
  - id: grounding_source
    criterion: The generated setup is grounded in base_al_slab.stru and does not invent
      unrelated structural changes; changes are limited to INPUT_pot and KPT_pot preparation.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: no_retries
    criterion: No repeated identical tool calls with the same parameter set.
