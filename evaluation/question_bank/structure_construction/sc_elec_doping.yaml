version: "v5"
capability: "structure_construction"
domain: "elec"

questions:
  # ============================================================
  # SC_elec_003_20260404b — NFPP Al掺杂超胞构建
  # ============================================================
  - id: "SC_elec_003_20260404b"
    capability: "structure_construction"
    domain: "elec"
    intent: "Build 2×1×1 supercell of NFPP, then substitute one PO₄-site P with Al."
    human_prompt_seed: |
      构建NFPP的Al掺杂超胞：
      1. 获取NFPP（Na₄Fe₃(PO₄)₂P₂O₇）结构（空间群Pna2₁）；
      2. 构建2×1×1超胞，然后在超胞中选一个PO₄磷酸根位点的P原子用Al替换；
      3. 输出掺杂结构文件，并报告：
         - 超胞化学式
         - 替换的P原子位置索引
         - Al与最近邻O的距离
    tags: ["nfpp", "doping", "structure_build", "supercell", "battery"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "doped_formula"
        value: "Na32Fe24Al1P31O120"
      - key: "required_fields"
        value:
          - "structure_file"
          - "doped_formula"
          - "substituted_site_index"
          - "Al_O_distance"
      - key: "turn_budget"
        value: {max: 10}
      - key: "duration_budget"
        value: {max: 3600000}
      - key: "token_budget_total"
        value: {max: 25000}
    scoring_checklist:
      - id: "doped_formula"
        criterion: "Reported doped supercell formula is Na32Fe24Al1P31O120 (208 atoms, 2×1×1 supercell with one Al substitution)."
        axis: "correctness"
        verify: "llm_binary_judge"
      - id: "required_fields"
        criterion: "Output includes structure file, doped formula, substituted site index, and Al-O distance."
        axis: "correctness"
        verify: "llm_binary_judge"
      - id: "grounding_source"
        criterion: "NFPP structure uses correct wurtzite Pna2₁ lattice parameters; doping is performed by explicit P→Al substitution at PO₄ site with physically justified coordinates. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool."
        axis: "grounding"
        verify: "llm_binary_judge"
      - id: "no_retries"
        criterion: "No repeated identical structure retrieval or substitution attempts."
        axis: "efficiency"
        verify: "no_retries"
      - id: "turn_budget"
        criterion: "Agent completes the task within the turn (step) budget."
        axis: "efficiency"
        verify: "turn_budget"
      - id: "efficiency_judge"
        criterion: "Doped supercell construction completes in a direct workflow."
        axis: "efficiency"
        verify: "llm_binary_judge"
      - id: "duration_budget"
        criterion: "Wall-clock run duration does not exceed benchmark ceiling."
        axis: "efficiency"
        verify: "duration_budget"
      - id: "token_budget_total"
        criterion: "Total token usage stays within benchmark ceiling."
        axis: "efficiency"
        verify: "token_budget"
