    axis: correctness
    verify: text_file_regex
    weight: 3.0
    criterion: '[Must] First lattice vector starts with 2.445 Å (graphene-optimized in-plane lattice constant)'
  - id: poscar_species
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] POSCAR contains both Cu and C atomic species'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The constructed structure is grounded in the geometry described in Giovannetti
