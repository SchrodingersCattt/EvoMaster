      filename: POSCAR
  - key: poscar_atom_counts
    value:
      flags: []
      pattern: ^\s*6\s+2\s*$
      filename: POSCAR
  - key: poscar_lattice_a
    value:
      flags: []
      pattern: ^\s*2\.445
      filename: POSCAR
  - key: poscar_species
    value:
      flags: []
      tokens:
      - Cu
      - C
      filename: POSCAR
  - key: grounding_source
    value:
      filename: POSCAR
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
