- id: SC_cat_ads_001_20260519
  capability: structure_construction
  domain: catalysis
  intent: Build catalytic surface intermediates (H*, HCOO*, COOH*) on Pt(111), testing
    knowledge that H* is atomic hydrogen (not H2), and HCOO*/COOH* are specific radical
    intermediates with correct bonding geometry.
  human_prompt_seed: '在 Pt(111) 2×2 超胞 4 层 slab（15 Å 真空）上，分别构建 H*、HCOO*、COOH*
    三种吸附中间体的初始结构，输出为 `Pt111_H.cif`、`Pt111_HCOO.cif`、`Pt111_COOH.cif`。'
  tags:
  - struct_surface
  data_files: []
  reference_answers:
  - key: h_file
    value: Pt111_H.cif
  - key: hcoo_file
    value: Pt111_HCOO.cif
  - key: cooh_file
    value: Pt111_COOH.cif
  - key: h_atom_count
    value:
      filename: Pt111_H.cif
      element: H
      expected: 1
      tolerance: 0
  - key: hcoo_c_count
    value:
      filename: Pt111_HCOO.cif
      element: C
      expected: 1
      tolerance: 0
  - key: hcoo_o_count
    value:
      filename: Pt111_HCOO.cif
      element: O
      expected: 2
      tolerance: 0
  - key: cooh_c_count
    value:
      filename: Pt111_COOH.cif
      element: C
      expected: 1
      tolerance: 0
  - key: cooh_o_count
    value:
      filename: Pt111_COOH.cif
      element: O
      expected: 2
      tolerance: 0
  - key: cooh_h_count
    value:
      filename: Pt111_COOH.cif
      element: H
      expected: 1
      tolerance: 0
  - key: hcoo_ch_bond
    value:
      filename: Pt111_HCOO.cif
      element_a: C
      element_b: H
      cutoff_A: 1.3
      expected: 1.1
      tolerance: 0.15
  - key: turn_budget
    value:
      max: 20
  - key: token_budget_total
    value:
      max: 25000
  scoring_checklist:
  - id: h_file
    criterion: Agent writes `Pt111_H.cif` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: hcoo_file
    criterion: Agent writes `Pt111_HCOO.cif` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: cooh_file
    criterion: Agent writes `Pt111_COOH.cif` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: h_is_atomic
    criterion: Pt111_H.cif contains exactly 1 hydrogen atom (atomic H*, not H2 molecule).
      This is the critical test — in catalysis context H* means a single adsorbed
      hydrogen atom.
    axis: correctness
    verify: struct_file_atom_count
    weight: 2.0
  - id: hcoo_formula
    criterion: The HCOO* adsorbate in Pt111_HCOO.cif has composition CHO2 (1C + 1H
      + 2O, formate anion skeleton). Must NOT be formic acid (HCOOH with 2H+2O).
    axis: correctness
    verify: struct_file_atom_count
    weight: 1.5
  - id: cooh_formula
    criterion: The COOH* adsorbate in Pt111_COOH.cif has composition CHO2 (1C + 1H
      + 2O, carboxyl radical). Must NOT be CO2 (missing H) or formic acid (extra H).
    axis: correctness
    verify: struct_file_atom_count
    weight: 1.5
  - id: hcoo_ch_bond
    criterion: In Pt111_HCOO.cif, the H atom is bonded to C (C-H distance ~1.1 Å),
      confirming correct formate geometry (H-COO) rather than H bonded to O.
    axis: correctness
    verify: struct_file_bond_length
    weight: 1.5
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
