version: v5
capability: structure_construction
domain: catalysis
questions:
- id: CR_SC_ZnS001_polarity_20260523
  capability: structure_construction
  domain: catalysis
  intent: Test whether agent recognizes ZnS(001) as a polar surface and proactively
    proposes remediation strategies before constructing the slab.
  human_prompt_seed: '构建 ZnS 化合物 (001) 切面 slab：3 bilayer 厚度、基于 primitive surface
    cell 的 2×2×1 扩胞，真空 ≥15 Å。输出 slab 结构文件为 `ZnS_001_slab.cif`。

    '
  tags:
  - struct_surface
  - polar_surface
  data_files: []
  reference_answers:
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
  - id: tasker_type_identification
    criterion: The agent identifies ZnS(001) as a Tasker Type-3 polar surface (alternating
      Zn-only and S-only planes along [001] producing a net dipole moment), or equivalently
      states that the surface is polar due to its stacking of mono-element charged
      layers.
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
  - id: polar_surface_remedy
    criterion: The agent explicitly discusses at least two physically motivated remedies
      for the Type-3 polarity — such as constructing a symmetric slab with matching
      top/bottom terminations, applying a dipole correction, surface reconstruction,
      or pseudohydrogen passivation.
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
  - id: asks_human_for_strategy
    criterion: After detecting the polar surface, the agent presents at least two
      polarity handling strategies to the user and asks the user to choose before
      constructing the slab. PASS if the agent explicitly asks (via AskQuestion tool
      or text-based question) and waits. FAIL if the agent silently picks a strategy
      and proceeds without asking.
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
  - id: no_retries
    criterion: No repeated identical slab construction or surface cut with the same
      parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: CR_SC_ZnS001_symmetric_20260523
  capability: structure_construction
  domain: catalysis
  intent: Build ZnS(001) symmetric S-terminated slab with precise structural parameters
    given an explicit polarity handling strategy.
  human_prompt_seed: '构建 ZnS 闪锌矿 (001) 极性表面 slab，采用对称 S 终止策略消除宏观偶极。要求：基于
    primitive surface cell 的 2×2×1 扩胞，3 个 Zn-S bilayer（即顶底均为 S 层，共 7 个原子面），真空层
    ≥15 Å。输出结构文件为 `ZnS_001_slab.cif`。

    '
  tags:
  - struct_surface
  - polar_surface
  data_files: []
  reference_answers:
  - key: file_exists
    value: ZnS_001_slab.cif
  - key: slab_layer_count
    value:
      filename: ZnS_001_slab.cif
      expected: 7
      tolerance: 1
      axis: z
      layer_tol_A: 0.5
  - key: zn_s_ratio
    value:
      filename: ZnS_001_slab.cif
      element_a: Zn
      element_b: S
      expected_ratio: 0.75
      tolerance: 0.05
  - key: slab_atom_count
    value:
      filename: ZnS_001_slab.cif
      expected: 28
      tolerance: 0
  - key: inplane_a
    value:
      filename: ZnS_001_slab.cif
      param: a
      expected: 7.65
      tolerance: 0.5
  - key: inplane_b
    value:
      filename: ZnS_001_slab.cif
      param: b
      expected: 7.65
      tolerance: 0.5
  - key: cell_c_vacuum
    value:
      filename: ZnS_001_slab.cif
      param: c
      expected: 22.0
      tolerance: 7.0
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 30000
  scoring_checklist:
  - id: file_exists
    criterion: The output file `ZnS_001_slab.cif` exists in the workspace.
    axis: correctness
    verify: artifact_exists
  - id: slab_layer_count
    criterion: The slab has 7 distinct atomic z-planes (S-Zn-S-Zn-S-Zn-S), consistent
      with 3 bilayers plus symmetric S termination on both sides. Atoms within 0.5
      Å along z are merged into one plane.
    axis: correctness
    verify: struct_file_layer_count
  - id: zn_s_ratio
    criterion: The Zn:S stoichiometry ratio is approximately 0.75 (3 Zn layers vs
      4 S layers in the symmetric S-terminated slab).
    axis: correctness
    verify: struct_file_stoichiometry_ratio
  - id: slab_atom_count
    criterion: The symmetric S-terminated 2×2×1 slab contains exactly 28 atoms (7
      layers × 4 atoms/layer).
    axis: correctness
    verify: struct_file_atom_count
  - id: inplane_a
    criterion: The slab cell a parameter matches 2× the primitive surface cell of
      ZnS(001), approximately 7.65 Å.
    axis: correctness
    verify: struct_file_cell_param
  - id: inplane_b
    criterion: The slab cell b parameter matches 2× the primitive surface cell of
      ZnS(001), approximately 7.65 Å.
    axis: correctness
    verify: struct_file_cell_param
  - id: cell_c_vacuum
    criterion: The slab cell c parameter includes the slab thickness plus at least
      15 Å of vacuum.
    axis: correctness
    verify: struct_file_cell_param
  - id: mirror_symmetry
    criterion: The slab has mirror symmetry about its central plane — both top and
      bottom surfaces are S-terminated, ensuring zero net dipole moment along z.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: no_retries
    criterion: No repeated identical slab construction or surface cut with the same
      parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within a generous benchmark ceiling.
    axis: efficiency
    verify: token_budget
- id: SC_elec_004_20260520
  capability: structure_construction
  domain: catalysis
  intent: Build Ag(001) surface slab and place CO molecule at ontop site for adsorption
    calculation.
  human_prompt_seed: 构建 CO 在 Ag(001) 表面的初始吸附结构：3×3 超胞，4 层 slab，真空 15 Å，CO 置于顶层 ontop
    位 C 端朝下，初始距离约 2 Å。输出 `bare_slab.vasp`、`CO_molecule.vasp`、`adsorbed_system.vasp`。
  tags:
  - struct_surface
  data_files: []
  reference_answers:
  - key: bare_slab_file
    value: bare_slab.vasp
  - key: molecule_file
    value: CO_molecule.vasp
  - key: adsorbed_system_file
    value: adsorbed_system.vasp
  - key: slab_layers
    value:
      filename: bare_slab.vasp
      expected: 4
      tolerance: 0
      axis: z
      element: Ag
      layer_tol_A: 0.5
  - key: slab_ag_count
    value:
      filename: bare_slab.vasp
      element: Ag
      expected: 36
      tolerance: 0
  - key: co_c_count
    value:
      filename: CO_molecule.vasp
      element: C
      expected: 1
      tolerance: 0
  - key: co_o_count
    value:
      filename: CO_molecule.vasp
      element: O
      expected: 1
      tolerance: 0
  - key: slab_layers_4
    value:
      filename: adsorbed_system.vasp
      expected: 4
      tolerance: 0
      axis: z
      element: Ag
      layer_tol_A: 0.5
  - key: cell_c_vacuum
    value:
      filename: adsorbed_system.vasp
      param: c
      expected: 24.0
      tolerance: 8.0
  - key: co_c_down_orientation
    value:
      filename: adsorbed_system.vasp
      element_a: Ag
      element_b: C
      cutoff_A: 3.0
      expected: 2.0
      tolerance: 0.8
  - key: required_fields
    value:
    - bare_slab_file
    - molecule_file
    - adsorbed_system_file
    - slab_layers
    - vacuum_thickness
    - adsorption_site
  - key: turn_budget
    value:
      max: 10
  - key: duration_budget
    value:
      max: 3600000
  - key: token_budget_total
    value:
      max: 8000
  scoring_checklist:
  - id: bare_slab_file
    criterion: Agent writes `bare_slab.vasp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: molecule_file
    criterion: Agent writes `CO_molecule.vasp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: adsorbed_system_file
    criterion: Agent writes `adsorbed_system.vasp` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: slab_layers
    criterion: The file `bare_slab.vasp` has exactly 4 Ag atomic layers along z.
    axis: correctness
    verify: struct_file_layer_count
  - id: slab_ag_count
    criterion: The file `bare_slab.vasp` contains exactly 36 Ag atoms for the 3x3
      four-layer slab.
    axis: correctness
    verify: struct_file_atom_count
  - id: co_c_count
    criterion: The file `CO_molecule.vasp` contains exactly one C atom.
    axis: correctness
    verify: struct_file_atom_count
  - id: co_o_count
    criterion: The file `CO_molecule.vasp` contains exactly one O atom.
    axis: correctness
    verify: struct_file_atom_count
  - id: required_fields
    criterion: Output includes three structure files, layer count, vacuum thickness,
      and adsorption site description.
    axis: correctness
    verify: llm_binary_judge
  - id: slab_layers_4
    criterion: The adsorbed-system structure retains exactly 4 Ag slab layers along z.
    axis: correctness
    verify: struct_file_layer_count
  - id: cell_c_vacuum
    criterion: The adsorbed-system cell c parameter is large enough to include the
      four-layer Ag slab, CO adsorbate, and approximately 15 A of vacuum.
    axis: correctness
    verify: struct_file_cell_param
  - id: co_c_down_orientation
    criterion: The adsorbed-system structure has the CO carbon atom close to the Ag
      surface at the intended initial C-down adsorption distance.
    axis: correctness
    verify: struct_file_bond_length
  - id: grounding_source
    criterion: Ag bulk structure uses correct FCC lattice constant; slab is built
      with proper crystallographic orientation and parameters; CO placement uses physically
      motivated coordinates, tied to named deliverables. Judge solely from the final
      answer; do not fail because the tool-call log omits MCP, web_search, or any
      specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical slab construction calls.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: Adsorption structure built in direct workflow without unnecessary rebuilds.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration does not exceed benchmark ceiling.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
