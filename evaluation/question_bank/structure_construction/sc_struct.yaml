version: v5
capability: structure_construction
domain: struct
questions:
- id: SC_struct_001
  capability: structure_construction
  domain: struct
  intent: Build a graphene/h-BN vertical van der Waals heterostructure with controlled lattice mismatch.
  human_prompt_seed: '读取 `hetero_spec.json`，构建 graphene/h-BN 垂直范德华异质结。 要求：(1) 构建共度超胞使晶格失配 < 2%；(2) AB 堆叠，层间距 3.35 A； (3) z
    方向加 15 A 真空层。输出 POSCAR 和 CIF，报告实际失配度和总原子数。

    '
  tags:
  - heterostructure
  - vdw
  - graphene
  - hBN
  - structure_build
  mode_scope:
  - direct
  - planner
  required_tools:
  - mat_sg_build_surface_interface
  optional_tools: []
  data_files:
  - key: hetero_spec
    path: data/SC_struct_001/hetero_spec.json
    oss_url: ''
    description: Specification for graphene/h-BN heterostructure construction.
  reference_answers:
  - key: mismatch_percent
    value: 1.6
    tolerance: 1.0
  - key: required_fields
    value:
    - structure_file
    - lattice_mismatch_percent
    - total_atoms
    - interlayer_distance_A
    - stacking
    - vacuum_A
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 50000
  scoring_checklist:
  - id: mismatch_percent
    criterion: Lattice mismatch is below 2%.
    axis: correctness
    verify: numerical_range
  - id: required_fields
    criterion: Output includes structure file, lattice mismatch percentage below 2%, total atom count, interlayer distance
      near 3.35 A, AB stacking, and vacuum thickness near 15 A.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states the physical picture (lattice matching, AB stacking, interlayer spacing, vacuum, how mismatch
      is defined) and ties it to the delivered POSCAR/CIF—not merely naming tools or MCP calls.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No excessive retries with the same parameter set during structure construction.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Heterostructure construction completes in a direct workflow without redundant structure rebuilds.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_002
  capability: structure_construction
  domain: struct
  intent: Build a 4-layer (110) surface slab from the uploaded PUBMUU03 molecular crystal CIF and verify molecule integrity
    plus atom-count scaling.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行处理：

    - `surface_PUBMUU03.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/1774583701_surface_PUBMUU03.cif`


    任务：基于该结构切出 `(1, 1, 0)` 表面 slab，要求为 4 层。

    真空层不是重点，可以不特别说明或自行设定合理值。


    重点检查并在最终答案中明确报告：

    (1) 切面后分子是否被切断，并给出判断依据；

    (2) 输入单胞的原子数；

    (3) 最终 slab 的原子总数；

    (4) 是否满足“最终原子数 = 单胞原子数的 4 倍”。


    输出结构文件，并给出上述核查结论。

    '
  tags:
  - surface_slab
  - molecular_crystal
  - 110_surface
  - molecule_integrity
  - structure_build
  mode_scope:
  - direct
  - planner
  required_tools:
  - mat_sg_build_surface_slab
  optional_tools: []
  data_files: []
  reference_answers:
  - key: unit_cell_atoms
    value: 144
    tolerance: 0.0
  - key: total_atoms
    value: 576
    tolerance: 0.0
  - key: required_fields
    value:
    - structure_file
    - unit_cell_atoms
    - total_atoms
    - atom_count_ratio_check
    - molecule_integrity_check
  - key: molcrys_slab_molecular_integrity
    value:
      unit_cell_atoms: 144
      slab_atoms: 576
      layers: 4
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: unit_cell_atoms
    criterion: The input unit cell atom count is reported correctly (144 atoms).
    axis: correctness
    verify: numerical_range
  - id: total_atoms
    criterion: Total atom count is correct (576 atoms for a 4-layer slab built directly from the 144-atom input unit cell).
    axis: correctness
    verify: numerical_range
  - id: molcrys_slab_molecular_integrity
    criterion: MolCrysKit graph-based molecular units in workspace CIFs show the slab scales by four molecular layers vs the
      bulk-like unit without smaller fragmented molecules (no molecules cut by the slab cut).
    axis: correctness
    verify: molcrys_slab_molecular_integrity
  - id: required_fields
    criterion: Output includes structure file, unit-cell atom count, final atom count, an explicit 4x ratio check, and a molecule-integrity
      narrative consistent with MolCrysKit / connectivity reasoning.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states what physical picture is used (molecular connectivity, periodic boundaries, (110) plane vs
      bulk, and how that supports or contradicts cutting molecules), citing the structures—not merely naming tools or MCP
      calls.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical slab or cut operations with wrong parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The (110) slab construction and integrity check complete without excessive exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous benchmark ceiling (tunable
      per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
