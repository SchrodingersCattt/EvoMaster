- id: SC_struct_005_20260412
  capability: structure_construction
  domain: struct
  intent: Infer SG-derived chemical formulas for 5 disordered crystal structures and
    construct ordered replicas to assess 3D structure perception.
  human_prompt_seed: '对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：

    - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`

    - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`

    - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`

    - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`

    - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`


    对每个结构，使用结构生成工具构造 ordered replica，并汇总：

    (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；

    (2) `is_disordered`；

    (3) `ordered_replica_count`；

    (4) `ordered_output_archive`。


    对 `disorder_DAN-2.cif` 的 ordered replica：`chemical_formula` 必须为**整数化学计量**（不得再出现类似
    `H13.98` 这类分数占位形式的计数）。

    每个结构的 ordered replica 输出文件命名为 `ordered_<原始文件名>.cif`（例如 `ordered_disorder_DAN-2.cif`）。

    最终答案按文件名逐项列出上述信息。

    '
  tags:
  - structure_construction
  - disorder_resolution
  - 3d_structure_perception
  - formula_identification
  mode_scope:
  - direct
  - planner
  reference_answers:
  - key: structures_processed
    value:
      pattern: 'ordered_*.cif'
      expected: 5
      tolerance: 1
  - key: sc005_disorder_formulas
    value: {}
  - key: required_fields
    value:
    - chemical_formula
    - is_disordered
    - ordered_replica_count
    - ordered_output_archive
  - key: tool_call_budget
    value:
      min: 5
      max: 30
  - key: turn_budget
    value: *id000
  - key: token_budget_total
    value:
      max: 35000
  - key: duration_budget
    value: *id001
  scoring_checklist:
  - id: structures_processed
    criterion: All 5 disordered structures are processed (verified by counting ordered-replica
      output files in workspace).
    axis: correctness
    verify: struct_file_count
  - id: sc005_disorder_formulas
    criterion: The answer includes the four reference formula strings for DAP-4, PAP-H4,
      PAP-M5, and TILPEN; for DAN-2 the reported ordered-replica chemical_formula
      uses integer stoichiometry only (no fractional occupancies like 13.98 in counts).
    axis: correctness
    verify: sc005_disorder_formulas
    weight: 0.5
  - id: partial_formulas_ok
    criterion: The answer reports chemically plausible ordered-replica formulas for at
      least 3 of the 5 structures. Reference formulas — DAP-4 H144C48N24Cl24O96,
      PAP-H4 H288C80N48Cl48O192, PAP-M5 Ag8H112C40N16Cl24O96, TILPEN Fe2H40C24N16O2,
      DAN-2 integer-only stoichiometry. Pass if ≥3 formulas are present and correct
      (element ordering may differ).
    axis: correctness
    verify: llm_binary_judge
    weight: 0.5
  - id: required_fields
    criterion: Each filename is paired with chemical_formula, is_disordered, ordered_replica_count,
      and ordered_output_archive.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer explains the physical/chemical basis for each structure
      (disorder/occupancy, connectivity, valence or charge balance, and what changes
      when building an ordered replica), tied to the named CIFs and delivered outputs,
      not only restating task text without structural basis. Judge solely from the final answer and named
      deliverables; do not fail because the tool-call log omits MCP, web_search, or any specific
      tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries_disorder
    criterion: No repeated identical tool calls are made for the same structure.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: tool_call_budget
    criterion: The whole 5-structure workflow stays within a modest tool-call budget.
    axis: efficiency
    verify: call_count_range
  - id: token_budget_total
    criterion: The run stays within a moderate total token budget.
    axis: efficiency
    verify: token_budget
  - id: efficiency_judge
    criterion: The agent handles the 5 structures one by one with minimal detours
      and without exploratory over-processing.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
- id: SC_struct_006_20260406
  capability: structure_construction
  domain: struct
  intent: Add missing hydrogens to the diacetylmorphine (DACMOR) molecular crystal
    CIF and validate the formula, local molecular environment, and tetrahedral geometry
    using MolCrysKit.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行补氢处理：

    - `DACMOR.cif` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif`


    该结构为二乙酰吗啡（diacetylmorphine）分子晶体，从单晶XRD解析得到，但缺少了 H 原子。

    请对该结构补氢，并导出为 `dacmor_hydrogenated.cif`。

    要求：添加 H 原子使结构符合价键规则、具备化学意义。


    重点检查并在最终答案中明确报告：

    (1) 补氢后每个分子的最简化学式；

    (2) 每个分子中 H 原子的总数；

    (3) 代表性的 H-C-H 键角（度）；

    (4) 补氢后分子的连接性是否完整（无断裂或多余键）。


    输出结构文件，并给出上述核查结论。

    '
  tags:
  - hydrogen_addition
  - molecular_crystal
  - DACMOR
  - diacetylmorphine
  - geometry_validation
  - formula_check
  mode_scope:
  - direct
  - planner
  data_files:
  - key: dacmor_cif
    path: data/SC_struct_006/DACMOR.cif
    oss_url: 'https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif'
    description: DACMOR (diacetylmorphine) molecular-crystal CIF missing explicit H atoms.
  reference_answers:
  - key: file_exists
    value: dacmor_hydrogenated.cif
  - key: target_formula
    value:
      filename: dacmor_hydrogenated.cif
      formula: C21H23NO5
  - key: hch_angle_deg
    value:
      filename: dacmor_hydrogenated.cif
      triplet:
      - H
      - C
      - H
      expected_deg: 109.48
      tolerance_deg: 8.0
      cutoff_A: 1.5
  - key: molcrys_local_env
    value:
      filename: dacmor_hydrogenated.cif
      expected_formula: C21H23NO5
      z_value: 4
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: {max: 28000}
  scoring_checklist:
  - id: file_exists
    criterion: The output file `dacmor_hydrogenated.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: target_formula
    criterion: The reduced chemical formula read from dacmor_hydrogenated.cif matches
      C21H23NO5.
    axis: correctness
    verify: struct_file_formula
  - id: hch_angle_deg
    criterion: The mean H-C-H angle computed from dacmor_hydrogenated.cif is close
      to tetrahedral 109.48 degrees within a reasonable tolerance.
    axis: correctness
