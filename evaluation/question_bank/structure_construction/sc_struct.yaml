  # ============================================================
  # SC_struct_008 (γ-Al2O3 体相模型构建)
  # ============================================================
  - id: "SC_struct_008"
    capability: "structure_construction"
    domain: "struct"
    intent: "Construct a computation-ready gamma-alumina bulk model and validate stoichiometry, geometry, coordination environments, and post-relaxation force."
    human_prompt_seed: >
      Construct a computation-ready γ-Al2O3 bulk model. Export as `gamma_alumina.cif`.
      In the final answer, explicitly report:
      (1) whether `gamma_alumina.cif` exists;
      (2) the Al:O ratio, which should be approximately 2:3 (±5%);
      (3) the three cell angles, each close to 90 degrees (±2 degrees);
      (4) whether both tetrahedral and octahedral [AlO] environments exist;
      (5) whether all interatomic distances are greater than 1.0 A;
      (6) the relaxed maximum force, which should be below 0.1 eV/A.
    tags: ["bulk_structure", "gamma_alumina", "coordination_environment", "relaxation_check", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools:
