version: v5
capability: structure_construction
domain: struct
questions:
- id: SC_struct_001_20260401
  capability: structure_construction
  domain: struct
  intent: Build a graphene/h-BN vertical van der Waals heterostructure with controlled
    lattice mismatch.
  human_prompt_seed: '读取 `hetero_spec.json`，构建 graphene/h-BN 垂直范德华异质结。 要求：(1) 构建共度超胞使晶格失配
    < 2%；(2) AB 堆叠，层间距 3.35 A； (3) z 方向加 15 A 真空层。输出 POSCAR 和 CIF，报告实际失配度和总原子数。

    '
  tags:
  - heterostructure
  - vdw
  - graphene
  - hBN
  - structure_build
  mode_scope:
  - direct
  - planner
  data_files:
  - key: hetero_spec
    path: data/SC_struct_001/hetero_spec.json
    oss_url: ''
    description: Specification for graphene/h-BN heterostructure construction.
  reference_answers:
  - key: mismatch_percent
    value: 1.6
    tolerance: 1.0
  - key: hetero_formula
    value:
      filename: '*.cif'
      formula: B2C2N2
  - key: interlayer_distance_A
    value:
      filename: '*.cif'
      element_a: C
      element_b: B
      cutoff_A: 5.0
      expected: 3.35
      tolerance: 0.3
  - key: required_fields
    value:
    - structure_file
    - lattice_mismatch_percent
    - total_atoms
    - interlayer_distance_A
    - stacking
    - vacuum_A
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 50000
  scoring_checklist:
  - id: mismatch_percent
    criterion: Lattice mismatch is below 2%.
    axis: correctness
    verify: numerical_range
  - id: hetero_formula
    criterion: The output CIF has the expected graphene/h-BN supercell formula (equal
      C, B, N counts) verified by reading the structure file.
    axis: correctness
    verify: struct_file_formula
  - id: interlayer_distance_A
    criterion: The mean C-B interlayer distance read from the output CIF is near 3.35 A.
    axis: correctness
    verify: struct_file_bond_length
  - id: required_fields
    criterion: Output includes structure file, lattice mismatch percentage below 2%,
      total atom count, interlayer distance near 3.35 A, AB stacking, and vacuum thickness
      near 15 A.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states the physical picture (lattice matching, AB stacking,
      interlayer spacing, vacuum, how mismatch is defined) and ties it to the delivered
      POSCAR/CIF—not merely naming tools or MCP calls.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No excessive retries with the same parameter set during structure construction.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Heterostructure construction completes in a direct workflow without
      redundant structure rebuilds.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_002_20260401
  capability: structure_construction
  domain: struct
  intent: Build a 4-layer (110) surface slab from the uploaded PUBMUU03 molecular
    crystal CIF and verify molecule integrity plus atom-count scaling.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行处理：

    - `surface_PUBMUU03.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/1774583701_surface_PUBMUU03.cif`


    任务：基于该结构切出 `(1, 1, 0)` 表面 slab，要求为 4 层。

    真空层不是重点，可以不特别说明或自行设定合理值。


    重点检查并在最终答案中明确报告：

    (1) 切面后分子是否被切断，并给出判断依据；

    (2) 输入单胞的原子数；

    (3) 最终 slab 的原子总数；

    (4) 是否满足"最终原子数 = 单胞原子数的 4 倍"。


    输出结构文件，并给出上述核查结论。

    '
  tags:
  - surface_slab
  - molecular_crystal
  - 110_surface
  - molecule_integrity
  - structure_build
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: unit_cell_atoms
    value:
      filename: '*PUBMUU03*'
      expected: 144
      tolerance: 0
  - key: total_atoms
    value:
      filename: '*.cif'
      expected: 576
      tolerance: 0
  - key: required_fields
    value:
    - structure_file
    - unit_cell_atoms
    - total_atoms
    - atom_count_ratio_check
    - molecule_integrity_check
  - key: molcrys_slab_molecular_integrity
    value:
      unit_cell_atoms: 144
      slab_atoms: 576
      layers: 4
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: unit_cell_atoms
    criterion: The input unit cell atom count read from the downloaded CIF is 144 atoms.
    axis: correctness
    verify: struct_file_atom_count
  - id: total_atoms
    criterion: Total atom count read from the output slab CIF is 576 atoms (4 × 144).
    axis: correctness
    verify: struct_file_atom_count
  - id: molcrys_slab_molecular_integrity
    criterion: No molecules are cut by the slab cut (verified via MolCrysKit
      graph-based molecular integrity check on workspace CIF files).
    axis: correctness
    verify: molcrys_slab_molecular_integrity
  - id: required_fields
    criterion: Output includes structure file, unit-cell atom count, final atom count,
      an explicit 4x ratio check, and a molecule-integrity narrative consistent with
      MolCrysKit / connectivity reasoning.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states what physical picture is used (molecular connectivity,
      periodic boundaries, (110) plane vs bulk, and how that supports or contradicts
      cutting molecules), citing the structures—not merely naming tools or MCP calls.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical slab or cut operations with wrong parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The (110) slab construction and integrity check complete without excessive
      exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_SiH_20260403
  capability: structure_construction
  domain: struct
  intent: Passivate dangling bonds on both top and bottom surfaces of a Si(100) slab
    with hydrogen atoms.
  human_prompt_seed: '读取 `hydrogen_cap_spec.json`，对 Si(100) slab 上下两个表面的悬挂键进行氢饱和。
    要求：识别 slab 顶部和底部所有欠配位 Si 原子，添加 H 使其达到四配位。 Si-H 键长约 1.48 A。输出 POSCAR 并报告添加的
    H 原子总数。

    '
  tags:
  - hydrogen_passivation
  - Si100
  - dangling_bond
  - structure_build
  mode_scope:
  - direct
  - planner
  data_files:
  - key: hydrogen_cap_spec
    path: data/SC_struct_003/hydrogen_cap_spec.json
    oss_url: ''
    description: Specification for Si(100) surface hydrogen passivation (both surfaces).
  reference_answers:
  - key: si_h_bond_length_A
    value:
      filename: '*POSCAR*'
      element_a: Si
      element_b: H
      cutoff_A: 2.0
      expected: 1.48
      tolerance: 0.15
  - key: si_coordination
    value:
      filename: '*POSCAR*'
      center_element: Si
      expected: 4
      tolerance: 0
      cutoff_A: 2.6
  - key: si_si_h_angle_deg
    value:
      filename: '*POSCAR*'
      triplet:
      - Si
      - Si
      - H
      expected_deg: 109.47
      tolerance_deg: 8.0
      cutoff_A: 2.6
  - key: required_fields
    value:
    - structure_file
    - hydrogen_count
    - si_h_bond_length_A
    - all_si_four_coordination
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: si_h_bond_length_A
    criterion: A representative Si-H bond length in the POSCAR output is near 1.48 A.
    axis: correctness
    verify: struct_file_bond_length
  - id: si_coordination
    criterion: The mean coordination number of ALL Si atoms in the POSCAR (cutoff
      2.6 A) is 4, confirming that dangling bonds on both top and bottom surfaces
      are fully saturated.
    axis: correctness
    verify: struct_file_coordination
  - id: si_si_h_angle_deg
    criterion: The mean Si-Si-H angle read from the POSCAR is close to tetrahedral
      109.47 degrees (tolerance 8 degrees), confirming that passivating H atoms sit
      at tetrahedral positions around the surface Si atoms.
    axis: correctness
    verify: struct_file_bond_angle
  - id: required_fields
    criterion: Output includes structure file, total number of added H atoms (covering
      both surfaces), representative Si-H bond length, and an explicit check that
      all Si atoms (top and bottom) reach four coordination.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer cites the structural physics (Si(100) facets, dangling bonds
      on both surfaces, target coordination, Si-H bond length) and ties passivation
      checks to the delivered POSCAR—not only generic semiconductor chemistry recall
      or tool names.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Slab construction and passivation run without repeated identical attempts.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: Passivation workflow completes in a direct pipeline without unnecessary
      intermediate structure rebuilds.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
