        axis: "correctness"
        verify: "numerical_range"
      - id: "fe_c_bond_count"
        criterion: "The reported count of Fe-C bonds shorter than 2.0 A is 5."
        axis: "correctness"
        verify: "numerical_range"
      - id: "fe_n_bond_count"
        criterion: "The reported count of Fe-N bonds shorter than 2.0 A is 1."
        axis: "correctness"
        verify: "numerical_range"
      - id: "no_bond_length_A"
        criterion: "A representative N-O bond length is reported below 1.3 A."
        axis: "correctness"
        verify: "numerical_range"
      - id: "fe_no_angle_deg"
        criterion: "A representative Fe-N-O angle is reported above 175 degrees and close to linear."
