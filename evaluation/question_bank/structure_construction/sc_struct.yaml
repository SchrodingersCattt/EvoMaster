- id: SC_struct_005_20260401
  capability: structure_construction
  domain: struct
  intent: Infer SG-derived chemical formulas for 5 disordered crystal structures and
    construct ordered replicas to assess 3D structure perception.
  human_prompt_seed: '对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：

    - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`

    - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`

    - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`

    - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`

    - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`


    对每个结构，使用结构生成工具构造 ordered replica，并汇总：

    (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；

    (2) `is_disordered`；

    (3) `ordered_replica_count`；

    (4) `ordered_output_archive`。


    对 `disorder_DAN-2.cif` 的 ordered replica：`chemical_formula` 必须为**整数化学计量**（不得再出现类似
    `H13.98` 这类分数占位形式的计数）。

    最终答案按文件名逐项列出上述信息。

    '
  tags:
  - structure_construction
  - disorder_resolution
  - 3d_structure_perception
  - formula_identification
  mode_scope:
  - direct
  - planner
  reference_answers:
  - key: structures_processed
    value:
      pattern: 'ordered_*'
      expected: 5
      tolerance: 0
  - key: sc005_disorder_formulas
    value: {}
  - key: required_fields
    value:
    - chemical_formula
    - is_disordered
    - ordered_replica_count
    - ordered_output_archive
  - key: tool_call_budget
    value:
      min: 5
      max: 20
  - key: token_budget_total
    value:
      max: 35000
  - key: duration_budget
    value: *id001
  scoring_checklist:
  - id: structures_processed
    criterion: All 5 disordered structures are processed (verified by counting ordered-replica
      output files in workspace).
    axis: correctness
    verify: struct_file_count
  - id: sc005_disorder_formulas
    criterion: The answer includes the four reference formula strings for DAP-4, PAP-H4,
      PAP-M5, and TILPEN; for DAN-2 the reported ordered-replica chemical_formula
      uses integer stoichiometry only (no fractional occupancies like 13.98 in counts).
    axis: correctness
    verify: sc005_disorder_formulas
  - id: required_fields
    criterion: Each filename is paired with chemical_formula, is_disordered, ordered_replica_count,
      and ordered_output_archive.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer explains the physical/chemical basis for each structure
      (disorder/occupancy, connectivity, valence or charge balance, and what changes
      when building an ordered replica), tied to the named CIFs and delivered outputs—not
      only naming tools or restating task text.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries_disorder
    criterion: No repeated identical tool calls are made for the same structure.
    axis: efficiency
    verify: no_retries
  - id: tool_call_budget
    criterion: The whole 5-structure workflow stays within a modest tool-call budget.
    axis: efficiency
    verify: call_count_range
  - id: token_budget_total
    criterion: The run stays within a moderate total token budget.
    axis: efficiency
    verify: token_budget
  - id: efficiency_judge
    criterion: The agent handles the 5 structures one by one with minimal detours
      and without exploratory over-processing.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
- id: SC_struct_006_20260401
  capability: structure_construction
  domain: struct
  intent: Add missing hydrogens to the monomethylammonium perchlorate crystal MEAPER
    while preserving perchlorate oxygens and validating local tetrahedral geometry.
  human_prompt_seed: '读取 `add-H_MEAPER.cif`，对高氯酸甲铵（MEAPER）晶体结构补氢，并导出为 `meaper_hydrogenated.cif`。
    要求：只给甲铵部分的 C 和 N 补氢，且每个 C、N 都应补上 3 个 H； 高氯酸根的 O 不应加氢。 请输出补氢后的结构文件，并报告： (1) 最终化学式；
    (2) C 是否都变成 CH3； (3) N 是否都变成 NH3； (4) 高氯酸根 O 是否未被氢化； (5) 代表性的 H-C-H / H-N-H 键角是否接近
    109.48°（允许合理波动）。

    '
  tags:
  - hydrogen_addition
  - molecular_crystal
  - MEAPER
  - geometry_validation
  - formula_check
  mode_scope:
  - direct
  - planner
  data_files:
  - key: meaper_cif
    path: data/SC_struct_006/add-H_MEAPER.cif
    oss_url: ''
    description: MEAPER molecular-crystal CIF missing explicit H atoms on methylammonium.
  reference_answers:
  - key: file_exists
    value: meaper_hydrogenated.cif
  - key: target_formula
    value:
      filename: meaper_hydrogenated.cif
      formula: C8H48Cl8N8O32
  - key: required_fields
    value:
    - structure_file
    - final_formula
    - c_hydrogenation_check
    - n_hydrogenation_check
    - oxygen_not_hydrogenated
    - bond_angle_check
  - key: hcn_angle_deg
    value:
      filename: meaper_hydrogenated.cif
      triplet:
      - H
      - C
      - H
      expected_deg: 109.48
      tolerance_deg: 8.0
      cutoff_A: 1.5
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: file_exists
    criterion: The output file `meaper_hydrogenated.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: target_formula
    criterion: The chemical formula read from meaper_hydrogenated.cif matches C8H48Cl8N8O32.
    axis: correctness
    verify: struct_file_formula
  - id: hcn_angle_deg
    criterion: The mean H-C-H angle computed from meaper_hydrogenated.cif is close to tetrahedral
      109.48 degrees within a reasonable tolerance.
    axis: correctness
    verify: struct_file_bond_angle
  - id: required_fields
    criterion: Output includes structure file, final formula, explicit checks that
      C becomes CH3 and N becomes NH3, confirmation that perchlorate O atoms are not
      hydrogenated, and bond-angle validation.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_source
    criterion: The answer states the chemical/geometry rationale (which atoms should
      receive H, tetrahedral CH3/NH3 targets, perchlorate O must stay non-protic)
      and ties checks to `meaper_hydrogenated.cif` and the input CIF—not only procedural
      or tool-centric wording.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Hydrogen addition is not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: efficiency_judge
    criterion: The hydrogenation and validation workflow completes directly without
      redundant exploratory steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_007_20260402
  capability: structure_construction
  domain: struct
  intent: Build the nitroprusside anion and validate its coordination, bond lengths,
    and near-linear linkage geometry.
  human_prompt_seed: 'Build the nitroprusside anion. Export as `nitroprusside.xyz`.
    In the final answer, explicitly report: (1) whether `nitroprusside.xyz` exists;
    (2) the formula, written as `FeC5N6O`; (3) Fe coordination number; (4) the counts
    of Fe-C bonds shorter than 2.0 A and Fe-N bonds shorter than 2.0 A; (5) one representative
    N-O bond length and Fe-N-O angle; (6) one representative C-N bond length and Fe-C-N
    angle.

    '
  tags:
  - molecule_build
  - coordination_complex
  - nitroprusside
  - bond_geometry
  - structure_build
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: file_exists
    value: nitroprusside.xyz
  - key: target_formula
    value:
      filename: nitroprusside.xyz
      formula: FeC5N6O
  - key: fe_coordination
    value:
      filename: nitroprusside.xyz
      center_element: Fe
      expected: 6
      tolerance: 0
      cutoff_A: 2.5
  - key: fe_c_bond_count
    value:
      filename: nitroprusside.xyz
      element_a: Fe
      element_b: C
      cutoff_A: 2.0
      expected_count: 5
      tolerance: 0
  - key: fe_n_bond_count
    value:
      filename: nitroprusside.xyz
      element_a: Fe
      element_b: N
      cutoff_A: 2.0
      expected_count: 1
      tolerance: 0
  - key: no_bond_length_A
    value:
      filename: nitroprusside.xyz
      element_a: 'N'
      element_b: 'O'
      cutoff_A: 1.5
      expected: 1.2
      tolerance: 0.1
  - key: fe_no_angle_deg
    value:
      filename: nitroprusside.xyz
      triplet:
      - Fe
      - 'N'
      - 'O'
      expected_deg: 180.0
      tolerance_deg: 3.0
      cutoff_A: 2.5
