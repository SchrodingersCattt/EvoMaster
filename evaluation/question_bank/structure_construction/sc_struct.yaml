version: "v5"
capability: "structure_construction"
domain: "struct"

questions:
  # ============================================================
  # SC_struct_001 (graphene/h-BN异质结)
  # ============================================================
  - id: "SC_struct_001"
    capability: "structure_construction"
    domain: "struct"
    intent: "Build a graphene/h-BN vertical van der Waals heterostructure with controlled lattice mismatch."
    human_prompt_seed: >
      读取 `hetero_spec.json`，构建 graphene/h-BN 垂直范德华异质结。
      要求：(1) 构建共度超胞使晶格失配 < 2%；(2) AB 堆叠，层间距 3.35 A；
      (3) z 方向加 15 A 真空层。输出 POSCAR 和 CIF，报告实际失配度和总原子数。
    tags: ["heterostructure", "vdw", "graphene", "hBN", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_interface"]
    optional_tools: []
    data_files:
      - key: "hetero_spec"
        path: "data/SC_struct_001/hetero_spec.json"
        oss_url: ""
        description: "Specification for graphene/h-BN heterostructure construction."
    reference_answers:
      - key: "mismatch_percent"
        value: 1.6
        tolerance: 1.0
      - key: "required_fields"
        value: ["structure_file", "lattice_mismatch_percent", "total_atoms", "interlayer_distance_A", "stacking", "vacuum_A"]
    scoring_checklist:
      # --- correctness ---
      - id: "mismatch_percent"
        criterion: "Lattice mismatch is below 2%."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file, lattice mismatch percentage below 2%, total atom count, interlayer distance near 3.35 A, AB stacking, and vacuum thickness near 15 A."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "The heterostructure report and geometry claims are consistent with the delivered structure files and the stated specification, not asserted without structural evidence."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "No excessive retries with the same parameter set during structure construction."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Heterostructure construction completes in a direct workflow without redundant structure rebuilds."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_002 (PUBMUU03 分子晶体 (110) 表面切面)
  # ============================================================
  - id: "SC_struct_002"
    capability: "structure_construction"
    domain: "struct"
    intent: "Build a 4-layer (110) surface slab from the uploaded PUBMUU03 molecular crystal CIF and verify molecule integrity plus atom-count scaling."
    human_prompt_seed: |
      对以下通过 OSS URL 提供的 CIF 结构进行处理：
      - `surface_PUBMUU03.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/1774583701_surface_PUBMUU03.cif`

      任务：基于该结构切出 `(1, 1, 0)` 表面 slab，要求为 4 层。
      真空层不是重点，可以不特别说明或自行设定合理值。

      重点检查并在最终答案中明确报告：
      (1) 切面后分子是否被切断，并给出判断依据；
      (2) 输入单胞的原子数；
      (3) 最终 slab 的原子总数；
      (4) 是否满足“最终原子数 = 单胞原子数的 4 倍”。

      输出结构文件，并给出上述核查结论。
    tags: ["surface_slab", "molecular_crystal", "110_surface", "molecule_integrity", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files: []
    reference_answers:
      - key: "unit_cell_atoms"
        value: 144
        tolerance: 0.0
      - key: "total_atoms"
        value: 576
        tolerance: 0.0
      - key: "required_fields"
        value: ["structure_file", "unit_cell_atoms", "total_atoms", "atom_count_ratio_check", "molecule_integrity_check"]
    scoring_checklist:
      # --- correctness ---
      - id: "unit_cell_atoms"
        criterion: "The input unit cell atom count is reported correctly (144 atoms)."
        axis: "correctness"
        verify: "numerical_range"
      - id: "total_atoms"
        criterion: "Total atom count is correct (576 atoms for a 4-layer slab built directly from the 144-atom input unit cell)."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file, unit-cell atom count, final atom count, an explicit 4x ratio check, and a molecule-integrity check with evidence."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "The slab and molecule-integrity conclusions are grounded in the provided PUBMUU03 CIF and the delivered output structure, with explicit (110) surface orientation in the answer where relevant."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "No repeated identical slab or cut operations with wrong parameters."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "The (110) slab construction and integrity check complete without excessive exploratory calls."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_003 (Si(100)氢钝化)
  # ============================================================
  - id: "SC_struct_003"
    capability: "structure_construction"
    domain: "struct"
    intent: "Passivate dangling bonds on Si(100) surface slab bottom with hydrogen atoms."
    human_prompt_seed: >
      读取 `hydrogen_cap_spec.json`，对 Si(100) slab 底部的悬挂键进行氢饱和。
      要求：识别底部欠配位 Si 原子，添加 H 使其达到四配位。
      Si-H 键长约 1.48 A。输出 POSCAR 并报告添加的 H 原子数。
    tags: ["hydrogen_passivation", "Si100", "dangling_bond", "structure_build"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files:
      - key: "hydrogen_cap_spec"
        path: "data/SC_struct_003/hydrogen_cap_spec.json"
        oss_url: ""
        description: "Specification for Si(100) surface hydrogen passivation."
    reference_answers:
      - key: "si_h_bond_length_A"
        value: 1.48
        tolerance: 0.15
      - key: "passivation_quality"
        value: "H atoms added to satisfy 4-coordination on bottom Si atoms"
      - key: "required_fields"
        value: ["structure_file", "hydrogen_count", "si_h_bond_length_A", "bottom_si_four_coordination"]
    scoring_checklist:
      # --- correctness ---
      - id: "si_h_bond_length_A"
        criterion: "A representative Si-H bond length is reported near 1.48 A."
        axis: "correctness"
        verify: "numerical_range"
      - id: "passivation_quality"
        criterion: "Bottom Si atoms passivated with H to achieve 4-coordination, with Si-H bond length ~1.48 A."
        axis: "correctness"
        verify: "llm_binary_judge"
      - id: "required_fields"
        criterion: "Output includes structure file, number of added H atoms, representative Si-H bond length, and an explicit check that bottom Si atoms reach four coordination."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "Si(100) slab orientation and H passivation claims are supported by the delivered structure and reported metrics, not only by generic semiconductor chemistry recall."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Slab construction and passivation run without repeated identical attempts."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Passivation workflow completes in a direct pipeline without unnecessary intermediate structure rebuilds."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_004 (MoS₂单层剥离)
  # ============================================================
  - id: "SC_struct_004"
    capability: "structure_construction"
    domain: "struct"
    intent: "Exfoliate a MoS2 monolayer from bulk 2H-MoS2 and verify the 2D structure."
    human_prompt_seed: >
      读取 `twod_spec.json`，从体相 2H-MoS2 中剥离单层 MoS2。
      添加 20 A z 方向真空层，验证化学计量比为 MoS2，层厚约 3.1 A。
      输出 POSCAR。
    tags: ["2d_material", "exfoliation", "MoS2", "monolayer"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_build_surface_slab"]
    optional_tools: []
    data_files:
      - key: "twod_spec"
        path: "data/SC_struct_004/twod_spec.json"
        oss_url: ""
        description: "Specification for MoS2 monolayer exfoliation."
    reference_answers:
      - key: "stoichiometry_formula"
        value: "MoS2"
      - key: "layer_thickness_A"
        value: 3.1
        tolerance: 0.6
      - key: "required_fields"
        value: ["structure_file", "stoichiometry_verified", "layer_thickness_A", "vacuum_A"]
    scoring_checklist:
      # --- correctness ---
      - id: "stoichiometry_formula"
        criterion: "The reported stoichiometry is MoS2."
        axis: "correctness"
        verify: "contains_all"
      - id: "layer_thickness_A"
        criterion: "The reported monolayer thickness is close to 3.1 A."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file, explicit MoS2 stoichiometry verification, layer thickness near 3.1 A, and vacuum layer near 20 A."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "Monolayer stoichiometry, thickness, and vacuum claims are consistent with the delivered POSCAR/structure output rather than asserted without structural basis."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "No repeated identical exfoliation or slab cuts with the same parameters."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "Monolayer exfoliation and stoichiometry verification complete in a direct workflow."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_005 (无序结构有序化与化学式识别)
  # ============================================================
  - id: "SC_struct_005"
    capability: "structure_construction"
    domain: "struct"
    intent: "Infer SG-derived chemical formulas for 5 disordered crystal structures and construct ordered replicas to assess 3D structure perception."
    human_prompt_seed: |
      对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：
      - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`
      - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`
      - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`
      - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`
      - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`

      对每个结构，使用结构生成工具构造 ordered replica，并汇总：
      (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；
      (2) `is_disordered`；
      (3) `ordered_replica_count`；
      (4) `ordered_output_archive`。

      最终答案按文件名逐项列出上述信息。
    tags: ["structure_construction", "disorder_resolution", "3d_structure_perception", "formula_identification"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_generate_ordered_replicas"]
    optional_tools: []
    reference_answers:
      - key: "structures_processed"
        value: 5
        tolerance: 0.0
      - key: "reference_formulas"
        value:
          - "K1H13.9872C5.9904N5.0064O9"
          - "H144C48N24Cl24O96"
          - "H288C80N48Cl48O192"
          - "Ag8H112C40N16Cl24O96"
          - "Fe2H40C24N16O2"
      - key: "required_fields"
        value: ["chemical_formula", "is_disordered", "ordered_replica_count", "ordered_output_archive"]
      - key: "structure_construction_event"
        value: "structure_construction"
      - key: "scientific_library_source"
        value: "scientific_library"
      - key: "tool_call_budget"
        value:
          min: 5
          max: 20
      - key: "token_budget_total"
        value:
          max: 35000
    scoring_checklist:
      # --- correctness ---
      - id: "structures_processed"
        criterion: "All 5 disordered structures are processed."
        axis: "correctness"
        verify: "numerical_range"
      - id: "reference_formulas"
        criterion: "The final answer includes the SG-derived chemical formula string for each of the 5 structures."
        axis: "correctness"
        verify: "contains_all"
      - id: "required_fields"
        criterion: "Each filename is paired with chemical_formula, is_disordered, ordered_replica_count, and ordered_output_archive."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "structure_construction_event"
        criterion: "The workflow includes a successful structure_construction event."
        axis: "grounding"
        verify: "event_type_called"
      - id: "scientific_library_source"
        criterion: "At least one successful structure operation comes from source_type scientific_library."
        axis: "grounding"
        verify: "source_type_used"
      - id: "grounding_source"
        criterion: "Per-structure formula and ordered-replica outputs are traceable to the named input CIFs and plausible disordered-to-ordered handling, not invented wholesale."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries_disorder"
        criterion: "No repeated identical tool calls are made for the same structure."
        axis: "efficiency"
        verify: "no_retries"
      - id: "tool_call_budget"
        criterion: "The whole 5-structure workflow stays within a modest tool-call budget."
        axis: "efficiency"
        verify: "call_count_range"
      - id: "token_budget_total"
        criterion: "The run stays within a moderate total token budget."
        axis: "efficiency"
        verify: "token_budget"
      - id: "efficiency_judge"
        criterion: "The agent handles the 5 structures one by one with minimal detours and without exploratory over-processing."
        axis: "efficiency"
        verify: "llm_binary_judge"

  # ============================================================
  # SC_struct_006 (MEAPER 分子晶体补氢)
  # ============================================================
  - id: "SC_struct_006"
    capability: "structure_construction"
    domain: "struct"
    intent: "Add missing hydrogens to the monomethylammonium perchlorate crystal MEAPER while preserving perchlorate oxygens and validating local tetrahedral geometry."
    human_prompt_seed: >
      读取 `add-H_MEAPER.cif`，对高氯酸甲铵（MEAPER）晶体结构补氢，并导出为 `meaper_hydrogenated.cif`。
      要求：只给甲铵部分的 C 和 N 补氢，且每个 C、N 都应补上 3 个 H；
      高氯酸根的 O 不应加氢。
      请输出补氢后的结构文件，并报告：
      (1) 最终化学式；
      (2) C 是否都变成 CH3；
      (3) N 是否都变成 NH3；
      (4) 高氯酸根 O 是否未被氢化；
      (5) 代表性的 H-C-H / H-N-H 键角是否接近 109.48°（允许合理波动）。
    tags: ["hydrogen_addition", "molecular_crystal", "MEAPER", "geometry_validation", "formula_check"]
    mode_scope: ["direct", "planner"]
    required_tools: ["mat_sg_add_hydrogens"]
    optional_tools: []
    data_files:
      - key: "meaper_cif"
        path: "data/SC_struct_006/add-H_MEAPER.cif"
        oss_url: ""
        description: "MEAPER molecular-crystal CIF missing explicit H atoms on methylammonium."
    reference_answers:
      - key: "file_exists"
        value: "meaper_hydrogenated.cif"
      - key: "target_formula"
        value: "C8H48Cl8N8O32"
      - key: "required_fields"
        value: ["structure_file", "final_formula", "c_hydrogenation_check", "n_hydrogenation_check", "oxygen_not_hydrogenated", "bond_angle_check"]
      - key: "hcn_angle_deg"
        value: 109.48
        tolerance: 8.0
    scoring_checklist:
      # --- correctness ---
      - id: "file_exists"
        criterion: "The output file `meaper_hydrogenated.cif` exists."
        axis: "correctness"
        verify: "artifact_exists"
      - id: "target_formula"
        criterion: "The final reported chemical formula is correct after hydrogenation."
        axis: "correctness"
        verify: "contains_all"
      - id: "hcn_angle_deg"
        criterion: "The reported representative H-C-H or H-N-H bond angle is close to tetrahedral 109.48 degrees within a reasonable tolerance."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
        criterion: "Output includes structure file, final formula, explicit checks that C becomes CH3 and N becomes NH3, confirmation that perchlorate O atoms are not hydrogenated, and bond-angle validation."
        axis: "correctness"
        verify: "llm_binary_judge"
      # --- grounding ---
      - id: "grounding_source"
        criterion: "The hydrogenated structure and validation statements are grounded in the provided MEAPER CIF and `meaper_hydrogenated.cif`, with H added only on methylammonium C/N as specified."
        axis: "grounding"
        verify: "llm_binary_judge"
      # --- efficiency ---
      - id: "no_retries"
        criterion: "Hydrogen addition is not repeated with identical parameters."
        axis: "efficiency"
        verify: "no_retries"
      - id: "efficiency_judge"
        criterion: "The hydrogenation and validation workflow completes directly without redundant exploratory steps."
        axis: "efficiency"
        verify: "llm_binary_judge"

