      - id: "cn_bond_length_A"
        criterion: "A representative C-N bond length is reported below 1.2 A."
        axis: "correctness"
        verify: "numerical_range"
      - id: "fe_cn_angle_deg"
        criterion: "A representative Fe-C-N angle is reported above 170 degrees and close to linear."
        axis: "correctness"
        verify: "numerical_range"
      - id: "required_fields"
