version: "v5"
capability: "structure_construction"
domain: "elec"

questions:
  # ============================================================
  # SC_elec_002_20260401 — 合金 slab 建模
  # ============================================================
  - id: "SC_elec_002_20260404b"
    capability: "structure_construction"
    domain: "elec"
    intent: "Build an alloy surface slab from a given binary alloy structure for electrocatalysis modeling."
    human_prompt_seed: |
      构建 ZnPd 合金表面 slab 用于催化研究：
      1. 获取 ZnPd 合金结构（B2 型，CsCl 结构，空间群 Pm-3m）；
      2. 切出 (011) 表面 slab（3 层，15 Å 真空，2×1 扩胞）；
      3. 输出结构文件（CIF 或 POSCAR）；
      4. 报告：
         - slab 总原子数和 Zn:Pd 原子比
         - 表面暴露的原子种类
         - 各层原子组成
         - 晶胞参数 (a, b, c)
    tags: ["alloy", "slab", "ZnPd", "binary", "catalysis"]
    mode_scope: ["direct", "planner"]
    data_files: []
    reference_answers:
      - key: "required_fields"
        value:
          - "structure_file"
          - "total_atoms"
          - "Zn_Pd_ratio"
          - "surface_atoms"
          - "layer_composition"
          - "lattice_parameters"
      - key: "turn_budget"
        value: {max: 18}
      - key: "duration_budget"
        value: {max: 7200000}
      - key: "token_budget_total"
        value: {max: 25000}
    scoring_checklist:
      - id: "required_fields"
        criterion: "Output includes structure file, total atom count, Zn:Pd ratio, surface-exposed atom species, per-layer composition, and lattice parameters."
        axis: "correctness"
        verify: "llm_binary_judge"
      - id: "structure_validity"
        criterion: "The slab has 3 layers, (011) orientation, vacuum ≥ 15 Å, 2×1 supercell, and preserves the Zn:Pd stoichiometry of the bulk."
        axis: "correctness"
        verify: "llm_binary_judge"
      - id: "grounding_source"
        criterion: "The answer states the physical basis for the ZnPd B2 structure (space group, lattice constant), slab orientation (011), layer count, vacuum, and supercell expansion, tied to named deliverables rather than generic recall. Judge solely from the final answer; do not fail because the tool-call log omits MCP, web_search, or any specific tool."
        axis: "grounding"
        verify: "llm_binary_judge"
      - id: "no_retries"
        criterion: "No repeated identical structure retrieval or slab construction calls."
        axis: "efficiency"
        verify: "no_retries"
      - id: "turn_budget"
        criterion: "Agent completes the task within the turn (step) budget."
        axis: "efficiency"
        verify: "turn_budget"
      - id: "efficiency_judge"
        criterion: "Alloy slab is built in a direct workflow without redundant intermediate steps."
        axis: "efficiency"
        verify: "llm_binary_judge"
      - id: "duration_budget"
        criterion: "Wall-clock run duration does not exceed benchmark ceiling."
        axis: "efficiency"
        verify: "duration_budget"
      - id: "token_budget_total"
        criterion: "Total token usage stays within benchmark ceiling."
        axis: "efficiency"
        verify: "token_budget"
