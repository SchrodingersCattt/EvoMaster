    value:
      filename: rocksalt_primitive_3a.cif
  - key: space_group
    value:
      flags: case_insensitive
      tokens:
      - Fm-3m
      filename: rocksalt_primitive_3a.cif
  - key: lattice_parameter
    value:
      checks:
      - key: cell_length_a
        max: 3.01
        min: 2.99
        allow_missing_key: false
      filename: rocksalt_primitive_3a.cif
  - key: atom_count
    value:
      checks:
      - key: total_atoms
        expected: 2
        tolerance: 0
      filename: rocksalt_primitive_3a.cif
  - key: has_cation_site
    value:
      flags: case_insensitive
      tokens:
      - Li
      filename: rocksalt_primitive_3a.cif
  - key: has_anion_site
    value:
      flags: case_insensitive
      tokens:
      - O
      filename: rocksalt_primitive_3a.cif
  - key: grounding_source
    value:
      filename: rocksalt_primitive_3a.cif
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
  - id: artifact_cif
    axis: correctness
    verify: artifact_exists
    weight: 10.0
    criterion: '[Must] CIF file rocksalt_primitive_3a.cif exists'
  - id: space_group
    axis: correctness
    verify: text_file_contains_all
    weight: 20.0
    criterion: '[Must] CIF specifies space group Fm-3m (or equivalent Hermann-Mauguin symbol)'
  - id: lattice_parameter
    axis: correctness
    verify: text_file_numeric_range
    weight: 25.0
    criterion: '[Must] Lattice parameter a = 3.0 Å (tolerance ±0.01 Å)'
  - id: atom_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] Primitive cell contains exactly 2 atoms (1 cation + 1 anion)'
  - id: has_cation_site
    axis: correctness
    verify: text_file_contains_all
    weight: 10.0
    criterion: '[Must] Structure includes Li as a cation species (representing the Li/M sublattice)'
  - id: has_anion_site
    axis: correctness
    verify: text_file_contains_all
    weight: 10.0
    criterion: '[Must] Structure includes O as an anion species (representing the O/F sublattice)'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 10.0
    criterion: '[Must] Output is grounded in the paper''s specification of the rock salt primitive cell'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Completes within 20 turns'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] No tool-call retries needed'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Completes within 300 seconds'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
