version: v5
capability: structure_construction
domain: battery
questions:
- id: SC_solution_box_001_20260522
  capability: structure_construction
  domain: battery
  intent: Build an electrolyte solution box at specified concentration and atom count.
  human_prompt_seed: 请构建 1 mol/L ZnSO4 水溶液模型，总原子数约 2000 个，输出为 `ZnSO4_solution.cif`。
  tags:
  - struct_build
  data_files: []
  reference_answers:
  - key: solution_artifact
    value: ZnSO4_solution.cif
  - key: must_parsable
    value:
      filename: ZnSO4_solution.cif
  - key: must_atom_count
    value:
      filename: ZnSO4_solution.cif
      expected: 2000
      tolerance: 500
  - key: must_elements
    value:
      filename: ZnSO4_solution.cif
      elements: [Zn, S, O, H]
  - key: min_distance
    value:
      filename: ZnSO4_solution.cif
      min_distance_A: 0.8
  - key: turn_budget
    value:
      max: 25
  scoring_checklist:
  - id: solution_artifact
    criterion: ZnSO4_solution.cif written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_parsable
    criterion: '[Must] Output file is parsable.'
    axis: correctness
    verify: struct_file_parsable
  - id: must_atom_count
    criterion: '[Must] Total atom count is approximately 2000 (1500-2500 acceptable).'
    axis: correctness
    verify: struct_file_atom_count
  - id: must_elements
    criterion: '[Must] Structure contains all required elements (Zn, S, O, H).'
    axis: correctness
    verify: struct_file_elements_present
  - id: min_distance
    criterion: '[Must] No overlapping atoms — minimum interatomic distance at least 0.8 Å.'
    axis: correctness
    verify: struct_file_min_interatomic_distance
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: SC_ec_fluorination_001_20260525
  capability: structure_construction
  domain: battery
  intent: Enumerate fluorine-substituted derivatives of EC molecule and output SMILES
    list with 3D structures.
  human_prompt_seed: '以碳酸乙烯酯 EC (SMILES: C1COC(=O)O1) 为母体，枚举所有将 H 替换为
    F 的衍生物（1 个 F、2 个 F、3 个 F 三种情况），考虑对称性去重。将去重后的所有
    unique SMILES 写入 `ec_fluorinated.csv`（含列 name, smiles, n_fluorine），并为每个衍生物生成
    3D 构象文件放入 `structures/` 目录。'
  tags:
  - struct_build
  data_files: []
  reference_answers:
  - key: csv_artifact
    value: ec_fluorinated.csv
  - key: must_csv_header
    value:
      filename: ec_fluorinated.csv
      tokens:
      - name
      - smiles
      - n_fluorine
      flags: ''
  - key: min_data_rows
    value:
      filename: ec_fluorinated.csv
      min: 4
      max: 10
  - key: has_mono_f
    value:
      filename: ec_fluorinated.csv
      pattern: ',1\s*$'
      flags: m
  - key: has_di_f
    value:
      filename: ec_fluorinated.csv
      pattern: ',2\s*$'
      flags: m
  - key: has_tri_f
    value:
      filename: ec_fluorinated.csv
      pattern: ',3\s*$'
      flags: m
  - key: turn_budget
    value:
      max: 20
  scoring_checklist:
  - id: csv_artifact
    criterion: ec_fluorinated.csv written to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_csv_header
    criterion: '[Must] CSV contains required columns (name, smiles, n_fluorine).'
    axis: correctness
    verify: text_file_contains_all
  - id: min_data_rows
    criterion: CSV contains 4-10 data rows (unique derivatives from symmetry
      deduplication).
    axis: correctness
    verify: csv_row_count
  - id: has_mono_f
    criterion: CSV contains at least one mono-fluorinated derivative (n_fluorine=1).
    axis: correctness
    verify: text_file_regex
  - id: has_di_f
    criterion: CSV contains at least one di-fluorinated derivative (n_fluorine=2).
    axis: correctness
    verify: text_file_regex
  - id: has_tri_f
    criterion: CSV contains at least one tri-fluorinated derivative (n_fluorine=3).
    axis: correctness
    verify: text_file_regex
  - id: valid_smiles
    criterion: All SMILES in the CSV are valid (parseable by RDKit) and each contains
      the correct number of F atoms matching n_fluorine column.
    axis: correctness
    verify: llm_binary_judge
  - id: structures_generated
    criterion: 3D structure files exist in structures/ directory, one per SMILES entry.
    axis: correctness
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: SC_bat_ltp_001_20260519
  capability: structure_construction
  domain: battery
  intent: Build LiTi2(PO4)3 NASICON structure with correct stoichiometry, testing
    whether the agent includes all independent oxygen Wyckoff sites in the R-3c cell.
  human_prompt_seed: 构建 LiTi₂(PO₄)₃ 的 NASICON 结构（空间群 R-3c），输出为 `ltp_nasicon.cif`。
  tags:
  - struct_build
  data_files: []
  reference_answers:
  - key: file_exists
    value: ltp_nasicon.cif
  - key: formula
    value:
      filename: ltp_nasicon.cif
      formula: Li6Ti12P18O72
  - key: o_count
    value:
      filename: ltp_nasicon.cif
      element: O
      expected: 72
      tolerance: 0
  - key: total_atoms
    value:
      filename: ltp_nasicon.cif
      expected: 108
      tolerance: 0
  - key: space_group_number
    value:
      filename: ltp_nasicon.cif
      expected_number: 167
      symprec: 0.1
  - key: turn_budget
    value:
      max: 15
  - key: token_budget_total
    value:
      max: 20000
  scoring_checklist:
  - id: file_exists
    criterion: Agent writes `ltp_nasicon.cif` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: formula
    criterion: Structure formula matches LiTi2(PO4)3 stoichiometry (Z=6 gives Li6Ti12P18O72
      in the hexagonal cell).
    axis: correctness
    verify: struct_file_formula
    weight: 2.0
  - id: o_count
    criterion: Structure contains exactly 72 oxygen atoms (from two independent 36f
      Wyckoff sites). If only one O site is included, there would be only 36 O which
      breaks PO4 tetrahedra.
    axis: correctness
    verify: struct_file_atom_count
    weight: 2.0
  - id: total_atoms
    criterion: Total atom count is 108 (6 Li + 12 Ti + 18 P + 72 O).
    axis: correctness
    verify: struct_file_atom_count
  - id: space_group_number
    criterion: Structure has R-3c symmetry (space group 167).
    axis: correctness
    verify: struct_file_space_group
  - id: turn_budget
    criterion: Agent completes the task within the turn budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: Total token usage stays within budget.
    axis: efficiency
    verify: token_budget
- id: SC_nfpp_al_dope_001_20260525
  capability: structure_construction
  domain: battery
  priority: P1
  intent: Test Al-doped NFPP supercell construction with structural sanity
    verification. Agent must (1) retrieve the NFPP structure, (2) correctly identify
    PO₄ vs P₂O₇ phosphorus sites, (3) substitute one PO₄-site P with Al in a
    2×1×1 supercell, and (4) verify that the resulting Al-O bond lengths are
    physically reasonable (~1.7-1.9 Å). From real trajectory where agent produced
    Al-O = 0.989 Å without checking.
  human_prompt_seed: '请获取 Na₄Fe₃(PO₄)₂P₂O₇（NFPP）结构（空间群 Pna2₁），构建 2×1×1 超胞，
    然后用 Al 替换一个 P 原子来模拟掺杂。输出掺杂后的结构到 `NFPP_Al_doped.cif`。'
  tags:
  - struct_build
  - meta_database
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: NFPP_Al_doped.cif
  - key: correct_supercell_composition
    value:
      filename: NFPP_Al_doped.cif
      must_contain_elements: [Na, Fe, Al, P, O]
      must_not_contain_elements: []
  - key: correct_atom_count
    value:
      filename: NFPP_Al_doped.cif
      expected: 208
      tolerance: 13
  - key: al_o_distance_reasonable
    value:
      filename: NFPP_Al_doped.cif
      element_pair: [Al, O]
      min_distance: 1.4
      max_distance: 2.2
      n_neighbors: 4
  - key: turn_budget
    value:
      max: 15
  scoring_checklist:
  - id: cif_artifact
    criterion: Agent writes a doped NFPP CIF file to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: correct_supercell_composition
    criterion: '[Must] CIF contains Al and has composition consistent with 2×1×1
      NFPP supercell with one P→Al substitution (Na32Fe24Al1P31O120).'
    axis: correctness
    verify: struct_file_composition
    weight: 1.0
  - id: correct_atom_count
    criterion: '[Must] The doped supercell has approximately 208 atoms (2×104 from
      the unit cell). Acceptable range: 195-221.'
    axis: correctness
    verify: struct_file_atom_count
    weight: 1.5
  - id: po4_site_discrimination
    criterion: '[Must] Agent distinguishes PO₄ (isolated tetrahedral) sites from
      P₂O₇ (corner-sharing bridging) sites. The substituted P must be from a PO₄
      group, not from a P₂O₇ bridge. Evidence: coordination analysis, P-P distance
      check, or explicit mention of PO₄ vs P₂O₇ discrimination logic.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: al_o_distance_reasonable
    criterion: '[Must] The CIF structure has physically reasonable Al-O distances
      (1.4-2.2 Å). Distances < 1.0 Å or > 3.0 Å indicate an unphysical structure.'
    axis: correctness
    verify: struct_file_bond_range
    weight: 2.5
  - id: retrieves_from_database
    criterion: Agent retrieves the NFPP structure from struct_db (using simplified
      formula Na4Fe3P4O15 if needed) rather than manually constructing from
      literature Wyckoff positions.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
- id: SC_latp_composition_001_20260525v2
  capability: structure_construction
  domain: battery
  intent: Construct Al-doped LATP structure from LiTi₂(PO₄)₃ R-3c cell with
    correct stoichiometry (integer substitution or partial occupancy both valid).
  human_prompt_seed: "基于 LiTi₂(PO₄)₃ 的 R-3c 单胞（Z=6），构建\
    \ Li₁.₁₅Al₀.₁₅Ti₁.₈₅(PO₄)₃ 掺杂结构，输出为 `LATP_x015.cif`。\n"
  tags:
  - struct_build
  data_files: []
  reference_answers:
  - key: cif_artifact
    value: LATP_x015.cif
  - key: must_parsable
    value:
      filename: LATP_x015.cif
  - key: has_required_elements
    value:
      filename: LATP_x015.cif
      must_contain_elements: [Li, Al, Ti, P, O]
      must_not_contain_elements: []
  - key: al_ti_ratio
    value:
      filename: LATP_x015.cif
      element_a: Al
      element_b: Ti
      expected_ratio: 0.081
      tolerance: 0.04
  - key: turn_budget
    value:
      max: 18
  scoring_checklist:
  - id: cif_artifact
    criterion: Agent writes LATP_x015.cif to workspace.
    axis: correctness
    verify: artifact_exists
  - id: must_parsable
    criterion: '[Must] Output CIF is parsable.'
    axis: correctness
    verify: struct_file_parsable
  - id: has_required_elements
    criterion: '[Must] CIF contains all five elements (Li, Al, Ti, P, O) of LATP.'
    axis: correctness
    verify: struct_file_composition
  - id: al_ti_ratio
    criterion: '[Must] Al/Ti ratio is approximately 0.15/1.85 ≈ 0.081 (tolerance
      ±0.04 to accept both integer approximation and partial occupancy).'
    axis: correctness
    verify: struct_file_stoichiometry_ratio
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
