- id: SC_chgnet_001_20250626
  capability: structure_construction
  domain: battery
  intent: Construct a disordered rocksalt supercell for Li₁.₁Mn₀.₈Ti₀.₁O₁.₉F₀.₁ and identify all tetrahedral
    interstitial sites, classifying each as a 0-TM channel (no transition-metal neighbors) or n-TM channel
    based on the number of nearest-neighbor TM cations.
  human_prompt_seed: Construct a 2×2×2 supercell of the rocksalt structure (space group Fm-3m, a=4.2 Å)
    with composition Li₁.₁Mn₀.₈Ti₀.₁O₁.₉F₀.₁. Randomly distribute Li, Mn, and Ti on the octahedral cation
    sites and O and F on the anion sites. Then identify all tetrahedral interstitial sites in the supercell
    and classify each one as a 0-TM, 1-TM, 2-TM, 3-TM, or 4-TM channel based on how many of its four nearest-neighbor
    cation sites are occupied by transition metals (Mn or Ti). Save the structure as a POSCAR file named
    `lmtof_rocksalt_2x2x2.vasp` and write the channel classification results to a JSON file named `tm_channel_analysis.json`.
  tags:
  - code_mlip
  data_files: []
  reference_answers:
  - key: artifact_poscar
    value: lmtof_rocksalt_2x2x2.vasp
  - key: artifact_json
    value: tm_channel_analysis.json
  - key: composition_check
    value:
      tokens:
      - Li
      - Mn
      - Ti
      - O
      - F
      filename: lmtof_rocksalt_2x2x2.vasp
  - key: channel_classification_keys
    value:
      tokens:
      - 0-TM
      - total_tet_sites
      filename: tm_channel_analysis.json
  - key: grounding_source
    value:
      filename: lmtof_rocksalt_2x2x2.vasp
  - key: turn_budget
    value:
      max: 30
  - key: no_retries
    value:
      max: 1
  - key: duration_budget
    value:
      max: 600
  - key: token_budget_total
    value:
      max: 80000
  scoring_checklist:
  - id: artifact_poscar
    axis: correctness
    verify: artifact_exists
    weight: 0.25
    criterion: '[Must] POSCAR file lmtof_rocksalt_2x2x2.vasp exists and contains a valid VASP structure
      format.'
  - id: artifact_json
    axis: correctness
    verify: artifact_exists
    weight: 0.25
    criterion: '[Must] JSON file tm_channel_analysis.json exists with valid JSON content.'
  - id: composition_check
    axis: correctness
    verify: text_file_contains_all
    weight: 0.15
    criterion: '[Must] POSCAR contains all five element species: Li, Mn, Ti, O, F.'
  - id: channel_classification_keys
    axis: correctness
    verify: text_file_contains_all
    weight: 0.15
    criterion: '[Must] JSON file contains 0-TM channel count and total tetrahedral site count keys.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 0.1
    criterion: '[Must] The constructed structure is grounded in the DRX rocksalt framework described in
      the source paper.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Completed within 30 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retries needed.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Completed within 600 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Total tokens used within 80000.'
