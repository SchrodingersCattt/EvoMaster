  human_prompt_seed: Construct the primitive rock salt unit cell used for cluster expansion in Richards
    et al. 2018. The lattice is space group Fm-3m with a primitive cell lattice parameter of 3 Å. The
    cation sublattice is occupied by Li/M (lithium + transition metal) atoms and the anion sublattice
    by O/F (oxygen + fluorine) atoms. Write the resulting structure to rocksalt_primitive_3a.cif.
