      tokens:
      - Li
      filename: rocksalt_primitive_3a.cif
  - key: has_anion_site
    value:
      flags: case_insensitive
      tokens:
      - O
      filename: rocksalt_primitive_3a.cif
  - key: grounding_source
    value:
      filename: rocksalt_primitive_3a.cif
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 3
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 40000
  scoring_checklist:
