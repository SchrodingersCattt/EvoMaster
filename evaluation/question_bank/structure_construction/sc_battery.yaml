    verify: text_file_numeric_range
    weight: 25.0
    criterion: '[Must] Lattice parameter a = 3.0 Å (tolerance ±0.01 Å)'
  - id: atom_count
    axis: correctness
    verify: text_file_numeric_range
    weight: 15.0
    criterion: '[Must] Primitive cell contains exactly 2 atoms (1 cation + 1 anion)'
  - id: has_cation_site
