      param: gamma
      expected: 90.0
      tolerance: 2.0
  - key: max_force_eV_A
    value:
      json_path: max_force_ev_per_ang
      target: 0.05
      tolerance: 0.05
  - key: min_distance_A
    value:
      filename: gamma_alumina.cif
      min_distance_A: 1.0
  - key: required_fields
    value:
    - file_exists
    - al_o_ratio
    - cell_angles
    - tetrahedral_alo
    - octahedral_alo
    - min_distance_check
    - max_force
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: file_exists
    criterion: The output file `gamma_alumina.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: al_o_ratio
    criterion: The Al:O stoichiometry ratio read from gamma_alumina.cif is approximately 2:3
      within 5%.
    axis: correctness
    verify: struct_file_stoichiometry_ratio
  - id: alpha_deg
    criterion: The alpha cell angle read from gamma_alumina.cif is close to 90 degrees.
    axis: correctness
    verify: struct_file_cell_param
  - id: beta_deg
    criterion: The beta cell angle read from gamma_alumina.cif is close to 90 degrees.
    axis: correctness
    verify: struct_file_cell_param
  - id: gamma_deg
    criterion: The gamma cell angle read from gamma_alumina.cif is close to 90 degrees.
    axis: correctness
    verify: struct_file_cell_param
  - id: max_force_eV_A
    criterion: The reported relaxed maximum force in `<eval_results>` is below 0.1 eV/A.
    axis: correctness
    verify: answer_json_numeric
  - id: min_distance_A
    criterion: The minimum interatomic distance read from `gamma_alumina.cif` is at least 1.0 A.
    axis: correctness
    verify: struct_file_min_interatomic_distance
  - id: required_fields
    criterion: The answer explicitly reports the Al:O ratio, all three cell angles, evidence
      for both tetrahedral and octahedral AlO environments, a minimum-distance sanity check
      above 1.0 A, and a relaxed maximum-force check below 0.1 eV/A.
    axis: correctness
    verify: llm_binary_judge
  - id: structure_knowledge
    criterion: Agent demonstrates understanding that γ-Al2O3 adopts a defect-spinel structure
