- id: SC_struct_010_20260429
  capability: structure_construction
  domain: agnostic
  intent: Build a seven-layer Ag(111) slab with explicit water and potassium ions for an electrochemical
    interface initial model.
  human_prompt_seed: '构建一个 Ag(111) 界面初始结构并导出为 `ag111_k_water_interface.cif`。

    要求：

    (1) Ag(111) slab 为 (2 × 3) 面内超胞，并具有 7 个原子层；

    (2) 在金属基底上方加入 43 个 H2O 分子和 2 个 K 离子； 仅允许中性 H2O 分子，不允许引入 OH-/H3O+ 或水分解产物；

    (3) z 方向保留约 12 Å 真空层；

    (4) 最终答案中明确报告 Ag 原子数、H2O 分子数、K 离子数、slab 层数、真空层厚度， 并说明这些溶剂/离子位于金属表面同一侧上方。

    '
  tags:
  - phy_surface
  - phy_md
  data_files: []
  reference_answers:
  - key: file_exists
    value: ag111_k_water_interface.cif
  - key: ag_count
    value:
      filename: ag111_k_water_interface.cif
      element: Ag
