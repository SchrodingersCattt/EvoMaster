- id: SC_struct_009_20260507
  capability: structure_construction
  domain: agnostic
  intent: Build a stoichiometric and symmetric CeO2(111) surface with three Ce-O-Ce trilayers
    and oxygen termination; slab normal stacking should expose nine distinct atomic planes
    along z (three trilayers times three planes each).
  human_prompt_seed: 'Build a CeO2(111) surface with three Ce-O-Ce tri-layers. Export as `ceo2_111_trilayer.cif`.
    Here "layer count" means **nine atomic planes** along the slab normal (z): each Ce-O-Ce
    tri-layer contributes three planes (O–Ce–O style stacking), not three coarse trilayer
    blocks. In the final answer, explicitly report: (1) whether `ceo2_111_trilayer.cif` exists;
    (2) the total **atomic** layer count along z, which should be 9; (3) whether the slab
    is symmetric; here symmetric means the top and bottom halves are mirror-equivalent around
    the slab center with matching O-terminated outermost planes; (4) whether the outermost surface
    layer is O-terminated; (5) the Ce:O stoichiometric ratio, which should match CeO2.

    '
  tags:
  - struct_surface
  priority: P0
  data_files: []
  reference_answers:
  - key: file_exists
    value: ceo2_111_trilayer.cif
  - key: slab_layers
    value:
      filename: ceo2_111_trilayer.cif
      expected: 9
      tolerance: 0
      axis: z
      layer_tol_A: 0.25
  - key: ce_o_ratio
    value:
      filename: ceo2_111_trilayer.cif
      element_a: Ce
      element_b: O
      expected_ratio: 0.5
      tolerance: 0.05
  - key: o_termination
    value:
      filename: ceo2_111_trilayer.cif
      element: O
      axis: z
      side: both
      layer_tol_A: 0.5
  - key: required_fields
    value:
    - file_exists
    - layer_count
    - symmetry_check
    - outermost_O_termination
    - ce_o_ratio
  - key: turn_budget
    value:
      max: 25
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value: *id003
  scoring_checklist:
  - id: file_exists
    criterion: The output file `ceo2_111_trilayer.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: slab_layers
    criterion: The number of distinct atomic z-planes in ceo2_111_trilayer.cif is 9 (atoms
      on the same plane merged within 0.25 Å along z), matching three Ce-O-Ce trilayers.
    axis: correctness
    verify: struct_file_layer_count
  - id: ce_o_ratio
    criterion: The Ce:O ratio read from ceo2_111_trilayer.cif is consistent with CeO2 stoichiometry.
    axis: correctness
