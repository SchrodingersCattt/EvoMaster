    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Bulk construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
