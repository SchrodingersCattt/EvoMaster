version: v5
capability: structure_construction
domain: agnostic
questions:
- id: SC_struct_002_20260507
  capability: structure_construction
  domain: agnostic
  intent: Build a 4-layer (110) surface slab from the uploaded PUBMUU03 molecular crystal
    CIF and verify molecule integrity plus atom-count scaling.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行处理：

    - `surface_PUBMUU03.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/1774583701_surface_PUBMUU03.cif`


    任务：基于该结构切出 `(1, 1, 0)` 表面 slab，要求为 4 层。

    真空层不是重点，可以不特别说明或自行设定合理值。


    重点检查并在最终答案中明确报告：

    (1) 切面后分子是否被切断，并给出判断依据；

    (2) 输入单胞的原子数；

    (3) 最终 slab 的原子总数；

    (4) 是否满足"最终原子数 = 单胞原子数的 4 倍"。


    输出 slab 结构文件为 `slab_PUBMUU03_110.cif`，并给出上述核查结论。

    '
  tags:
  - struct_surface
  - struct_molcrys
  data_files: []
  reference_answers:
  - key: unit_cell_atoms
    value:
      filename: surface_PUBMUU03*
      expected: 144
      tolerance: 0
  - key: total_atoms
    value:
      filename: slab_PUBMUU03_110.cif
      expected: 576
      tolerance: 0
  - key: required_fields
    value:
    - structure_file
    - unit_cell_atoms
    - total_atoms
    - atom_count_ratio_check
    - molecule_integrity_check
  - key: explicit_report_tokens
    value:
    - '144'
    - '576'
    - '4'
    - slab_PUBMUU03_110.cif
  - key: molcrys_slab_molecular_integrity
    value:
      unit_cell_atoms: 144
      slab_atoms: 576
      layers: 4
  - key: turn_budget
    value: &id001
      max: 20
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 24000
  scoring_checklist:
  - id: unit_cell_atoms
    criterion: The input unit cell atom count read from the downloaded CIF is 144 atoms.
    axis: correctness
    verify: struct_file_atom_count
  - id: total_atoms
    criterion: Total atom count read from the output slab CIF is 576 atoms (4 × 144).
    axis: correctness
    verify: struct_file_atom_count
  - id: molcrys_slab_molecular_integrity
    criterion: No molecules are cut by the slab cut (verified via MolCrysKit graph-based molecular
      integrity check on workspace CIF files).
    axis: correctness
    verify: molcrys_slab_molecular_integrity
  - id: required_fields
    criterion: Output includes structure file, unit-cell atom count, final atom count, an
      explicit 4x ratio check, and a molecule-integrity narrative consistent with MolCrysKit
      / connectivity reasoning.
    axis: correctness
    verify: llm_binary_judge
  - id: explicit_report_tokens
    criterion: Final answer explicitly includes the 144-atom input cell, 576-atom slab,
      4x atom-count scaling, and `slab_PUBMUU03_110.cif` output basename.
    axis: correctness
    verify: contains_all
  - id: grounding_source
    criterion: The answer states what physical picture is used (molecular connectivity, periodic
      boundaries, (110) plane vs bulk, and how that supports or contradicts cutting molecules),
      citing the structures, not generic recall disconnected from those files. Judge solely
      from the final answer and named deliverables; do not fail because the tool-call log
      omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical slab or cut operations with wrong parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: The (110) slab construction and integrity check complete without excessive
      exploratory calls.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_005_20260507
  capability: structure_construction
  domain: agnostic
  intent: Infer SG-derived chemical formulas for 5 disordered crystal structures and construct
    ordered replicas to assess 3D structure perception.
  human_prompt_seed: '对以下 5 个含无序占位的晶体结构逐一处理，所有输入都通过 OSS URL 提供：

    - `disorder_DAN-2.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAN-2.cif`

    - `disorder_DAP-4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_DAP-4.cif`

    - `disorder_PAP-H4.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-H4.cif`

    - `disorder_PAP-M5.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_PAP-M5.cif`

    - `disorder_TILPEN.cif` -> `https://bohrium-agent-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_disorder/strucuture_disorder/disorder_TILPEN.cif`


    对每个结构，使用结构生成工具构造 ordered replica，并汇总：

    (1) `chemical_formula`（尽量保持工具/结构解析返回的原始字符串）；

    (2) `is_disordered`；

    (3) `ordered_replica_count`；

    (4) `ordered_output_archive`。


    对 `disorder_DAN-2.cif` 的 ordered replica：`chemical_formula` 必须为**整数化学计量**（不得再出现类似 `H13.98`
    这类分数占位形式的计数）。

    每个结构的 ordered replica 输出文件命名为 `ordered_<原始文件名>.cif`（例如 `ordered_disorder_DAN-2.cif`）。

    所有 ordered replica 必须是完全有序结构：输出 CIF 中所有 `_atom_site_occupancy` 均为 1，不得保留 partial/split occupancy。

    最终答案按文件名逐项列出上述信息，并显式写出每个原始文件名与对应 `ordered_<原始文件名>.cif` 的配对。

    '
  tags:
  - struct_molcrys
  reference_answers:
  - key: structures_processed
    value:
      pattern: ordered_*.cif
      expected: 5
      tolerance: 0
  - key: ordered_files_parsable
    value:
      filename: ordered_*.cif
  - key: ordered_files_occupancy_one
    value:
      filename: ordered_*.cif
      tolerance: 1.0e-6
  - key: ordered_file_name_mapping
    value:
    - disorder_DAN-2.cif
    - disorder_DAP-4.cif
    - disorder_PAP-H4.cif
    - disorder_PAP-M5.cif
    - disorder_TILPEN.cif
    - ordered_disorder_DAN-2.cif
    - ordered_disorder_DAP-4.cif
    - ordered_disorder_PAP-H4.cif
    - ordered_disorder_PAP-M5.cif
    - ordered_disorder_TILPEN.cif
  - key: sc005_disorder_formulas
    value: {}
  - key: required_fields
    value:
    - chemical_formula
    - is_disordered
    - ordered_replica_count
    - ordered_output_archive
  - key: turn_budget
    value: *id001
  - key: token_budget_total
    value:
      max: 35000
  - key: duration_budget
    value: *id002
  scoring_checklist:
  - id: structures_processed
    criterion: All 5 disordered structures are processed (verified by counting ordered-replica
      output files in workspace).
    axis: correctness
    verify: struct_file_count
  - id: ordered_files_parsable
    criterion: All `ordered_*.cif` deliverables can be parsed as structure files.
    axis: correctness
    verify: struct_file_parsable
  - id: ordered_files_occupancy_one
    criterion: Every ordered-replica CIF has only occupancy-1 sites; no partial or split occupancies
      remain in `_atom_site_occupancy`.
    axis: correctness
    verify: struct_file_all_occupancy_one
  - id: sc005_disorder_formulas
    criterion: The answer includes the four reference formula strings for DAP-4, PAP-H4, PAP-M5,
      and TILPEN; for DAN-2 the reported ordered-replica chemical_formula uses integer stoichiometry
      only (no fractional occupancies like 13.98 in counts).
    axis: correctness
    verify: sc005_disorder_formulas
    weight: 0.5
  - id: partial_formulas_ok
    criterion: The answer reports chemically plausible ordered-replica formulas for at least
      3 of the 5 structures. Reference formulas — DAP-4 H144C48N24Cl24O96, PAP-H4 H288C80N48Cl48O192,
      PAP-M5 Ag8H112C40N16Cl24O96, TILPEN Fe2H40C24N16O2, DAN-2 integer-only stoichiometry.
      Pass if ≥3 formulas are present and correct (element ordering may differ).
    axis: correctness
    verify: llm_binary_judge
    weight: 0.5
  - id: required_fields
    criterion: Each filename is paired with chemical_formula, is_disordered, ordered_replica_count,
      and ordered_output_archive.
    axis: correctness
    verify: llm_binary_judge
  - id: ordered_file_name_mapping
    criterion: Final answer explicitly names all five input CIF basenames and the five corresponding
      `ordered_<basename>.cif` output files.
    axis: correctness
    verify: contains_all
  - id: grounding_source
    criterion: The answer explains the physical/chemical basis for each structure (disorder/occupancy,
      connectivity, valence or charge balance, and what changes when building an ordered replica),
      tied to the named CIFs and delivered outputs, not only restating task text without structural
      basis. Judge solely from the final answer and named deliverables; do not fail because
      the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries_disorder
    criterion: No repeated identical tool calls are made for the same structure.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: token_budget_total
    criterion: The run stays within a moderate total token budget.
    axis: efficiency
    verify: token_budget
  - id: efficiency_judge
    criterion: The agent handles the 5 structures one by one with minimal detours and without
      exploratory over-processing.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
- id: SC_struct_006_20260507
  capability: structure_construction
  domain: agnostic
  intent: Add missing hydrogens to the diacetylmorphine (DACMOR) molecular crystal CIF and
    validate the formula, local molecular environment, and tetrahedral geometry using MolCrysKit.
  human_prompt_seed: '对以下通过 OSS URL 提供的 CIF 结构进行补氢处理：

    - `DACMOR.cif` -> `https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif`


    该结构为二乙酰吗啡（diacetylmorphine）分子晶体，从单晶XRD解析得到，但缺少了 H 原子。

    请对该结构补氢，并导出为 `dacmor_hydrogenated.cif`。

    要求：添加 H 原子使结构符合价键规则、具备化学意义。


    重点检查并在最终答案中明确报告：

    (1) 补氢后每个分子的最简化学式；

    (2) 每个分子中 H 原子的总数；

    (3) 代表性的 H-C-H 键角（度）；

    (4) 补氢后分子的连接性是否完整（无断裂或多余键）。


    输出结构文件，并给出上述核查结论。

    '
  tags:
  - struct_molcrys
  data_files:
  - key: dacmor_cif
    path: data/SC_struct_006/DACMOR.cif
    oss_url: https://matmaster-test.oss-cn-zhangjiakou.aliyuncs.com/evomaster/evaluation/structure_surface/cda9f292ec4b411facb478d0486b54ce/DACMOR.cif
    description: DACMOR (diacetylmorphine) molecular-crystal CIF missing explicit H atoms.
  reference_answers:
  - key: file_exists
    value: dacmor_hydrogenated.cif
  - key: target_formula
    value:
      filename: dacmor_hydrogenated.cif
      formula: C21H23NO5
  - key: hch_angle_deg
    value:
      filename: dacmor_hydrogenated.cif
      triplet:
      - H
      - C
      - H
      expected_deg: 109.48
      tolerance_deg: 8.0
      cutoff_A: 1.5
  - key: molcrys_local_env
    value:
      filename: dacmor_hydrogenated.cif
      expected_formula: C21H23NO5
      z_value: 4
  - key: explicit_report_tokens
    value:
    - C21H23NO5
    - '109'
    - dacmor_hydrogenated.cif
  - key: turn_budget
    value: *id001
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value:
      max: 28000
  scoring_checklist:
  - id: file_exists
    criterion: The output file `dacmor_hydrogenated.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: target_formula
    criterion: The reduced chemical formula read from dacmor_hydrogenated.cif matches C21H23NO5.
    axis: correctness
    verify: struct_file_formula
  - id: hch_angle_deg
    criterion: The mean H-C-H angle computed from dacmor_hydrogenated.cif is close to tetrahedral
      109.48 degrees within a reasonable tolerance.
    axis: correctness
    verify: struct_file_bond_angle
  - id: molcrys_local_env
    criterion: MolCrysKit validates that the hydrogenated output has correct molecular connectivity
      (no fragmented or over-bonded molecules), each molecule matches the expected formula,
      and ChemicalEnvironment analysis confirms H-bearing atoms have chemically consistent
      local geometry (hybridisation, coordination).
    axis: correctness
    verify: molcrys_local_env
  - id: explicit_report_tokens
    criterion: Final answer explicitly reports formula C21H23NO5, a representative H-C-H angle
      near 109 degrees, and the `dacmor_hydrogenated.cif` output basename.
    axis: correctness
    verify: contains_all
  - id: grounding_source
    criterion: The answer states the chemical/geometry rationale (which C/N atoms receive
      H, tetrahedral geometry targets, carbonyl/ester O should not be hydrogenated) and ties
      checks to `dacmor_hydrogenated.cif` and the input CIF, not only procedural wording disconnected
      from those files. Judge solely from the final answer and named deliverables; do not
      fail because the tool-call log omits MCP, web_search, or any specific tool.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: Hydrogen addition is not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: The hydrogenation and validation workflow completes directly without redundant
      exploratory steps.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark ceiling
      (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: SC_struct_008_20260507
  capability: structure_construction
  domain: agnostic
  intent: Construct a computation-ready gamma-alumina bulk model and validate stoichiometry,
    geometry, coordination environments, and post-relaxation force.
  human_prompt_seed: 'Construct a computation-ready γ-Al2O3 bulk model. Export as `gamma_alumina.cif`.
    In the final answer, explicitly report: (1) whether `gamma_alumina.cif` exists; (2) the
    Al:O ratio, which should be approximately 2:3 (±5%); (3) the three cell angles, each close
    to 90 degrees (±2 degrees); (4) whether both tetrahedral and octahedral [AlO] environments
    exist; (5) whether all interatomic distances are greater than 1.0 A; (6) the relaxed maximum
    force, which should be below 0.1 eV/A. Also include a machine-readable block
    `<eval_results>{"max_force_ev_per_ang": <number>}</eval_results>` in the final answer.

    '
  tags:
  - struct_build
  data_files: []
  reference_answers:
  - key: file_exists
    value: gamma_alumina.cif
  - key: al_o_ratio
    value:
      filename: gamma_alumina.cif
      element_a: Al
      element_b: O
      expected_ratio: 0.6667
      tolerance: 0.0334
  - key: alpha_deg
    value:
      filename: gamma_alumina.cif
      param: alpha
      expected: 90.0
      tolerance: 2.0
  - key: beta_deg
    value:
      filename: gamma_alumina.cif
      param: beta
      expected: 90.0
      tolerance: 2.0
  - key: gamma_deg
    value:
