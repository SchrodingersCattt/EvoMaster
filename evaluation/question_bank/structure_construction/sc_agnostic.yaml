- id: SC_struct_008_20260527
  capability: structure_construction
  domain: agnostic
  intent: Construct a computation-ready gamma-alumina bulk model and validate stoichiometry,
    geometry, coordination environments, and post-relaxation force.
  human_prompt_seed: 'Build a γ-Al₂O₃ bulk model and relax it. Export the initial
    (pre-relaxation) structure as `gamma_alumina_initial.cif` and the relaxed structure
    as `gamma_alumina.cif`. Include `<eval_results>{"max_force_ev_per_ang": <number>}</eval_results>`
    in your answer.'
  tags:
  - struct_build
  - code_mlip
  - meta_database
  data_files: []
  reference_answers:
  - key: file_exists
    value: gamma_alumina.cif
  - key: initial_file_exists
    value: gamma_alumina_initial.cif
  - key: al_o_ratio
    value:
      filename: gamma_alumina.cif
      element_a: Al
      element_b: O
      expected_ratio: 0.6667
      tolerance: 0.0334
  - key: space_group_gamma_alumina
    value:
      filename: gamma_alumina_initial.cif
      expected_number: [12, 227]
      symprec: 0.2
  - key: max_force_eV_A
    value:
      json_path: max_force_ev_per_ang
      target: 0.05
      tolerance: 0.05
  - key: al_mean_coordination
    value:
      filename: gamma_alumina.cif
      center_element: Al
      expected: 5
      tolerance: 0.5
      cutoff_A: 2.2
  - key: min_distance_A
    value:
      filename: gamma_alumina.cif
      min_distance_A: 1.0
  - key: turn_budget
    value:
      max: 30
  - key: duration_budget
    value: *id002
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: file_exists
    criterion: The relaxed output file `gamma_alumina.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: initial_file_exists
    criterion: The pre-relaxation output file `gamma_alumina_initial.cif` exists.
    axis: correctness
    verify: artifact_exists
  - id: al_o_ratio
    criterion: The Al:O stoichiometry ratio read from gamma_alumina.cif is approximately
      2:3 within 5%.
    axis: correctness
    verify: struct_file_stoichiometry_ratio
  - id: space_group_gamma_alumina
    criterion: The space group of gamma_alumina_initial.cif (pre-relaxation) is either
      Fd-3m (#227, cubic defect-spinel) or C2/m (#12, Digne/Krokidis monoclinic model),
      both accepted as γ-Al₂O₃ representations.
    axis: correctness
    verify: struct_file_space_group
  - id: max_force_eV_A
    criterion: The reported relaxed maximum force in `<eval_results>` is below 0.1
      eV/A.
    axis: correctness
    verify: answer_json_numeric
  - id: min_distance_A
    criterion: The minimum interatomic distance read from `gamma_alumina.cif` is at
      least 1.0 A.
    axis: correctness
    verify: struct_file_min_interatomic_distance
  - id: al_mean_coordination
    criterion: The average Al-O coordination in `gamma_alumina.cif` is consistent
      with a defect-spinel gamma-alumina mixture of tetrahedral and octahedral Al sites.
    axis: correctness
    verify: struct_file_coordination
  - id: structure_knowledge
    criterion: Agent demonstrates understanding that γ-Al2O3 adopts a defect-spinel
      structure with aluminum occupying both tetrahedral and octahedral coordination
      sites, reflected in the construction approach, final answer, or tool parameters.
      This criterion can pass even if the final output file was not successfully delivered,
      as long as the understanding is evident.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.0
  - id: relaxation_attempted
    criterion: Agent initiates structure relaxation or geometry optimization on the
      constructed γ-Al2O3 bulk model using any available calculator (MLIP, DP, or
      force-field), even if the relaxation does not converge or the final file is
      not delivered. Evidence may come from tool calls, scripts, or narrative.
    axis: correctness
    verify: llm_binary_judge
    weight: 0.5
  - id: no_retries
    criterion: Bulk construction and relaxation are not repeated with identical parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: efficiency_judge
    criterion: The gamma-alumina construction and relaxation workflow completes without
      redundant exploratory detours.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
