  - phy_surface
  data_files: []
  reference_answers:
  - key: unit_cell_atoms
    value:
      filename: surface_PUBMUU03*
      expected: 144
      tolerance: 0
  - key: total_atoms
    value:
      filename: slab_PUBMUU03_110.cif
      expected: 576
      tolerance: 0
  - key: required_fields
    value:
    - structure_file
    - unit_cell_atoms
    - total_atoms
    - atom_count_ratio_check
    - molecule_integrity_check
  - key: molcrys_slab_molecular_integrity
    value:
      unit_cell_atoms: 144
      slab_atoms: 576
      layers: 4
  - key: turn_budget
    value: &id001
      max: 20
  - key: duration_budget
    value: &id002
      max: 7200000
  - key: token_budget_total
    value: &id003
      max: 24000
