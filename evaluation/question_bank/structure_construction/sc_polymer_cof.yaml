    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

- id: SC_cof_doping_conjugation_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P1
  intent: Given a fully conjugated 2D COF structure, introduce a heteroatom dopant
    that disrupts the pi-conjugation pathway. Tests the agent's understanding of
    COF electronic structure — specifically that continuous pi-conjugation in a 2D
    COF requires sp2-hybridized atoms in planar geometry, and that strategic
    substitution (e.g., replacing a C=N imine linkage with a C-NH-C amine or
    inserting a saturated spacer) can break the conjugated path while preserving
    the framework topology.
  human_prompt_seed: 附件是 COF-LZU1 的结构（亚胺键连接的 hcb 拓扑 COF），帮我设计一个修饰方案破坏它的共轭路径但保持框架连通，输出修改前后的结构。
  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: pristine_artifact
    value: COF_LZU1_pristine.cif
  - key: doped_artifact
    value: COF_LZU1_doped.cif
  - key: design_json_artifact
    value: doping_design.json
  - key: design_required_tokens
    value:
      filename: doping_design.json
      tokens:
      - original_bond_type
      - modified_bond_type
      - modification_site
      - conjugation_broken
      - topology_preserved
      - design_rationale
      flags: i
  - key: pristine_parsable
    value:
      filename: COF_LZU1_pristine.cif
  - key: doped_parsable
    value:
      filename: COF_LZU1_doped.cif
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: pristine_artifact
    criterion: '[Must] Agent writes `COF_LZU1_pristine.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: doped_artifact
    criterion: '[Must] Agent writes `COF_LZU1_doped.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: design_json_artifact
    criterion: '[Must] Agent writes `doping_design.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: pristine_parsable
    criterion: '[Must] COF_LZU1_pristine.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: doped_parsable
    criterion: '[Must] COF_LZU1_doped.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: conjugation_correctly_broken
    criterion: '[Must] The modification correctly disrupts pi-conjugation by converting
      at least one sp2 linkage (e.g., C=N imine) to an sp3 center (e.g., C-NH-CH2
      saturated amine) or equivalent disruption. The key chemical criterion is that
      the p-orbital overlap path is interrupted at the modification site. Simply
      adding a substituent to an aromatic ring without breaking the backbone conjugation
      does NOT count.'
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: topology_preserved
    criterion: '[Must] The framework topology (hcb) is preserved — the modified
      structure maintains the same connectivity pattern (same node degree, same
      number of linkers per node) even though the electronic conjugation is broken.
      The structure must NOT have disconnected fragments or changed bonding topology.'
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: design_required_tokens
    criterion: Design JSON contains required fields documenting the modification.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: scientific_rationale
    criterion: The explanation correctly describes why converting sp2→sp3 at the
      linkage site breaks pi-conjugation (loss of p-orbital planarity/overlap),
      and distinguishes this from merely adding side-groups that do not interrupt
      the conjugated backbone.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: grounding_structure
    criterion: Claims about the pristine COF structure (topology, bond types,
      conjugation path) are consistent with known COF-LZU1 literature and the
      delivered pristine CIF, not fabricated.
    axis: grounding
    verify: llm_binary_judge
    weight: 1.5
  - id: no_retries
    criterion: No repeated identical calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

- id: SC_cof_sp2_to_sp3_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P1
  intent: Given a conjugated 2D COF structure, replace a specific sp2 carbon atom
    with an sp3 carbon (by adding hydrogen or other substituents to convert hybridization),
    creating a local structural defect. Tests the agent's understanding of carbon
    hybridization in crystalline frameworks — that sp2 carbons are trigonal planar
    with 3 bonds and participate in pi-conjugation, while sp3 carbons are tetrahedral
    with 4 bonds and do not contribute to pi-systems. The agent must identify which
    carbons are sp2, choose one strategically, add appropriate atoms to convert it
    to sp3, and adjust local geometry accordingly.
  human_prompt_seed: 附件是 CTF-1 的结构（三嗪基共价有机框架），把苯环上的一个 sp2 碳改成 sp3（加氢变四面体），输出原始和修改后的 cif。
  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: pristine_artifact
    value: CTF1_pristine.cif
  - key: defect_artifact
    value: CTF1_sp3_defect.cif
  - key: conversion_json_artifact
    value: sp3_conversion.json
  - key: conversion_required_tokens
    value:
      filename: sp3_conversion.json
      tokens:
      - target_atom_index
      - original_hybridization
      - new_hybridization
      - added_atoms
      - bond_changes
      - geometry_change
      - effect_on_conjugation
      - sp2
      - sp3
      flags: i
  - key: pristine_parsable
    value:
      filename: CTF1_pristine.cif
  - key: defect_parsable
    value:
      filename: CTF1_sp3_defect.cif
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: pristine_artifact
    criterion: '[Must] Agent writes `CTF1_pristine.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: defect_artifact
    criterion: '[Must] Agent writes `CTF1_sp3_defect.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: conversion_json_artifact
    criterion: '[Must] Agent writes `sp3_conversion.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: pristine_parsable
    criterion: '[Must] CTF1_pristine.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: defect_parsable
    criterion: '[Must] CTF1_sp3_defect.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: correct_sp3_conversion
    criterion: '[Must] The sp3 defect structure correctly shows at least one carbon
      atom converted from sp2 (trigonal planar, 3 bonds, participates in conjugation)
      to sp3 (tetrahedral, 4 bonds including added H). The converted carbon must have
      gained at least one additional bond (typically C-H) compared to the pristine
      structure, and local geometry should be non-planar at that site. Simply labeling
      a carbon as "sp3" without actually modifying coordinates/bonds is NOT acceptable.'
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: atom_count_increased
    criterion: The defect structure has more atoms than the pristine structure
      (at least 1 additional H per sp3-converted carbon), confirming that hydrogenation
      or equivalent modification actually occurred in the structure file.
    axis: correctness
    verify: llm_binary_judge
    weight: 2.0
  - id: conversion_required_tokens
    criterion: Conversion JSON documents the target atom, hybridization change,
      added atoms, bond modifications, geometry change, and conjugation effect.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: hybridization_understanding
    criterion: The explanation correctly describes sp2 vs sp3 hybridization (sp2 =
      trigonal planar, 120° angles, participates in pi-system via unhybridized
      p-orbital; sp3 = tetrahedral, 109.5° angles, no p-orbital contribution to
      conjugation), and explains why converting one site disrupts the extended
      pi-electron delocalization.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: grounding_structure
    criterion: Claims about CTF-1 structure (all-sp2 triazine framework from
      1,4-dicyanobenzene trimerization) are consistent with known CTF-1 literature,
      and the structural modification is chemically plausible.
    axis: grounding
    verify: llm_binary_judge
    weight: 1.5
  - id: no_retries
    criterion: No repeated identical calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

- id: SC_cof_hcb_to_sql_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P1
  intent: Convert an hcb (honeycomb) topology COF to sql (square lattice) topology
    by redesigning the building blocks. Tests the agent's understanding of reticular
    chemistry topology — that hcb requires C3+C2 building blocks (trigonal node +
    linear linker), while sql requires C4+C2 (square-planar node + linear linker).
    The agent must identify which building block to replace, select an appropriate
    C4-symmetric monomer to replace the C3 node, and reconstruct the framework
    with correct sql connectivity while preserving the same linker chemistry.
  human_prompt_seed: 附件是 COF-LZU1 的结构（hcb 拓扑，C3 三嗪节点 + C2 对苯二胺连接体，亚胺键），我想把它改成 sql 拓扑（C4 节点），保持亚胺键和相同连接体不变，帮我设计新节点并构建 sql 版本。
  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: hcb_artifact
    value: COF_hcb_original.cif
  - key: sql_artifact
    value: COF_sql_converted.cif
  - key: conversion_json_artifact
    value: topology_conversion.json
  - key: hcb_parsable
    value:
      filename: COF_hcb_original.cif
  - key: sql_parsable
    value:
      filename: COF_sql_converted.cif
  - key: conversion_required_tokens
    value:
      filename: topology_conversion.json
      tokens:
      - original_topology
      - target_topology
      - original_node
      - new_node
      - linker
      - bond_type
      - design_rationale
      - hcb
      - sql
      - C3
      - C4
      flags: i
  - key: turn_budget
    value:
      max: 18
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 18000
  scoring_checklist:
  - id: hcb_artifact
    criterion: '[Must] Agent writes `COF_hcb_original.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: sql_artifact
    criterion: '[Must] Agent writes `COF_sql_converted.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: conversion_json_artifact
    criterion: '[Must] Agent writes `topology_conversion.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: hcb_parsable
    criterion: '[Must] COF_hcb_original.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: sql_parsable
    criterion: '[Must] COF_sql_converted.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: correct_topology_conversion
    criterion: '[Must] The converted COF has sql topology: (1) The node has
      4-fold connectivity (C4 symmetry, 4 functional groups connecting to linkers);
      (2) The linker remains C2 (linear, 2 connection points); (3) Each node connects
      to 4 linkers, each linker bridges 2 nodes, forming a square grid pattern;
      (4) The bond chemistry (imine C=N) is preserved. A structure that still has
      C3 nodes or hcb connectivity FAILS.'
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: linker_preserved
    criterion: The same linker molecule (diamine, e.g., p-phenylenediamine or similar
      C2-symmetric diamine) is used in both the hcb and sql structures, demonstrating
      that the topology change was achieved by node replacement alone.
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: conversion_required_tokens
    criterion: Conversion JSON documents both topologies, node change (C3→C4),
      preserved linker, and design rationale.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: topology_rationale_grounded
    criterion: The explanation correctly describes that topology is determined by
      building-block symmetry/connectivity (C3+C2→hcb, C4+C2→sql), and the conversion
      is achieved by replacing the trigonal node with a tetragonal one. Claims about
      specific molecules and their symmetry must be chemically accurate.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
  - id: no_retries
    criterion: No repeated identical calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes within turn budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Duration is within budget.
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total tokens are within budget.
    axis: efficiency
    verify: token_budget

