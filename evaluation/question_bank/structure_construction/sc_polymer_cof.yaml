    agent's understanding of defect engineering in COFs — that real synthesized COFs
    contain missing-linker defects (analogous to MOF defects), and that strategically
    removing a linker creates undercoordinated nodes, dangling functional groups,
    and modified local pore environment. The agent must remove a linker while
    properly terminating the resulting dangling bonds.
