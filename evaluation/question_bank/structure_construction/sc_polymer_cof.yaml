    criterion: '[Must] Agent writes `COF_TpPa1_planar.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: nonplanar_artifact
    criterion: '[Must] Agent writes `COF_nonplanar.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: design_json_artifact
    criterion: '[Must] Agent writes `nonplanar_design.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: planar_parsable
    criterion: '[Must] COF_TpPa1_planar.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: nonplanar_parsable
    criterion: '[Must] COF_nonplanar.cif is parsable as a structure file.'
    axis: correctness
    verify: struct_file_parsable
    weight: 1.0
  - id: genuinely_nonplanar
    criterion: '[Must] The modified COF structure is genuinely non-planar: atoms in
      the framework do NOT all lie in a single plane. This can be verified by checking
      that (1) the unit cell has significant c-axis extent relative to a/b if it is
      a corrugated 2D sheet, or (2) atomic z-coordinates show out-of-plane variation
      for framework atoms, or (3) there are dihedral angles significantly deviating
      from 0°/180° along the backbone. A structure that is still flat/planar FAILS.'
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: connectivity_preserved
    criterion: '[Must] Framework connectivity is preserved — the modified structure
      has the same topology (hcb or equivalent), same node degree, and same number
      of linkers per node as the original. No bonds are broken; only geometry is
