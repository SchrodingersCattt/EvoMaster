- id: SC_cof_2d_to_3d_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P2
  intent: Construct a 3D COF structure from tetrahedral building blocks. Tests the
    agent's understanding that 2D COFs arise from planar building blocks giving
    layered structures, while 3D COFs require at least one building block with
    non-planar (typically tetrahedral Td) geometry to produce interpenetrated or
    non-interpenetrated 3D frameworks with specific topologies (dia, pts, ctn, bor).
    The agent must select appropriate Td-symmetric building blocks and construct
    a 3D framework.
  human_prompt_seed: 附件是 COF-300 的结构（dia 拓扑，四面体节点 tetrakis(4-formylphenyl)methane + 对苯二胺连接的 3D COF），请分析其 3D 构型特征并输出 cif，解释为什么四面体节点能产生 3D 框架而非 2D 层状。
