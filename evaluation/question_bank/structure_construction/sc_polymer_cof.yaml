- id: SC_cof_stacking_aa_to_ab_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P1
  intent: Convert a 2D COF from AA stacking (eclipsed) to AB stacking (staggered)
    mode. Tests the agent's understanding of layer stacking in 2D COFs — that most
    synthesized 2D COFs adopt AA (eclipsed) stacking where layers are directly
    aligned, but AB (staggered) stacking where adjacent layers are offset by half
    a unit cell vector is also possible and affects pore geometry and interlayer
    interactions. The agent must understand the relationship between stacking mode
    and PXRD pattern / pore channel geometry.
  human_prompt_seed: 附件是 COF-5 的结构（AA 堆积模式），帮我把它转成 AB 堆积（相邻层错位半个晶胞矢量），两个版本都输出 cif。
  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: aa_artifact
    value: COF5_AA_stacking.cif
  - key: ab_artifact
    value: COF5_AB_stacking.cif
  - key: analysis_json_artifact
    value: stacking_analysis.json
  - key: aa_parsable
    value:
      filename: COF5_AA_stacking.cif
