- id: SC_cof_decompose_monomer_001_20260629
  capability: structure_construction
  domain: polymer
  priority: P1
  intent: Given a COF structure file, decompose it into constituent monomers
    (building blocks) and linkers. Tests the agent's understanding of reticular
    chemistry — recognizing reversible bond formation sites (imine, boronate ester,
    triazine, etc.) and correctly identifying the monomer units and linker molecules
    that assemble into the COF topology.
  human_prompt_seed: 附件是 COF-5 的晶体结构（hcb 拓扑，硼酸酯键连接），请把它分解成单体（节点）和连接体（linker），分别输出 xyz 文件。
  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: cof_structure_artifact
    value: COF5_structure.cif
  - key: node_artifact
    value: COF5_node.xyz
  - key: linker_artifact
    value: COF5_linker.xyz
  - key: decomposition_json_artifact
    value: COF5_decomposition.json
  - key: decomposition_required_tokens
    value:
      filename: COF5_decomposition.json
      tokens:
      - cof_name
      - topology
      - bond_type
      - node_name
      - node_smiles
      - linker_name
      - linker_smiles
      - connectivity
      - hcb
      - boronate
      flags: i
  - key: node_elements
    value:
      filename: COF5_node.xyz
      tokens:
      - C
      - O
      - H
      flags: i
  - key: linker_elements
    value:
      filename: COF5_linker.xyz
      tokens:
      - C
      - B
      - O
      - H
      flags: i
  - key: turn_budget
    value:
      max: 15
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 15000
  scoring_checklist:
  - id: cof_structure_artifact
    criterion: '[Must] Agent writes `COF5_structure.cif` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: node_artifact
    criterion: '[Must] Agent writes `COF5_node.xyz` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: linker_artifact
    criterion: '[Must] Agent writes `COF5_linker.xyz` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: decomposition_json_artifact
    criterion: '[Must] Agent writes `COF5_decomposition.json` to workspace.'
    axis: correctness
    verify: artifact_exists
    weight: 1.0
  - id: correct_decomposition
    criterion: '[Must] The decomposition correctly identifies: (1) HHTP
      (hexahydroxytriphenylene, C18H12O6 or similar) as the trigonal node with
      3 connection points; (2) PBBA (benzene-1,4-diboronic acid, C6H8B2O4 or similar)
      as the linear linker with 2 connection points; (3) boronate ester (B-O) as
      the reversible bond type; (4) hcb (honeycomb) as the topology. The agent must
      NOT confuse node and linker roles or misidentify the bond chemistry.'
    axis: correctness
    verify: llm_binary_judge
    weight: 3.0
  - id: decomposition_required_tokens
    criterion: Decomposition JSON contains all required metadata fields including
      topology, bond type, node/linker names and SMILES.
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
  - id: node_chemically_valid
    criterion: The node XYZ file represents a chemically valid molecule consistent
      with HHTP (contains C, O, H; has aromatic ring system with hydroxyl groups).
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: linker_chemically_valid
    criterion: The linker XYZ file represents a chemically valid molecule consistent
      with PBBA (contains C, B, O, H; has a phenyl ring with two boronic acid groups).
    axis: correctness
    verify: llm_binary_judge
    weight: 1.5
  - id: grounding_source
    criterion: The decomposition rationale is grounded in the actual COF structure
      retrieved, correctly identifies reversible bond positions, and does not fabricate
      connectivity or molecular formulas unsupported by the structure.
    axis: grounding
    verify: llm_binary_judge
    weight: 2.0
