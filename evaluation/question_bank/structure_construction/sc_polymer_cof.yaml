  tags:
  - struct_build
  - cof
  data_files: []
  reference_answers:
  - key: planar_artifact
    value: COF_TpPa1_planar.cif
  - key: nonplanar_artifact
    value: COF_nonplanar.cif
  - key: design_json_artifact
    value: nonplanar_design.json
  - key: planar_parsable
    value:
      filename: COF_TpPa1_planar.cif
  - key: nonplanar_parsable
    value:
