version: v5
capability: batch_processing
domain: agnostic
questions:
- id: BP_struct_005_20260406v2
  capability: batch_processing
  domain: agnostic
  intent: Repair 5 problematic POSCAR structures by fixing geometry issues only. Focus the
    evaluation entirely on POSCAR repair correctness and cause-aligned fixes.
  human_prompt_seed: '从 `failure_recovery.json` 读取 5 个结构（TiO2, ZnO, MgO, Al2O3, SiO2）的失败恢复场景。每个条目里都有待修复的 `input_poscar` 路径。每个结构的初始计算因几何问题失败（如原子重叠、晶胞畸变、对称性错误等）。

    请为每个结构生成修正后的 POSCAR，修复策略：

    1. 仅修复结构文件（POSCAR）中的几何问题（原子位置、晶胞参数、对称性）

    3. 对每个结构说明修复了什么几何问题，以及修复后为何更合理（按 `failure_recovery.json`
       中每个条目的 `repair_acceptance` 约束来做）

    输出要求：

    1. 5 个修正后的 POSCAR 文件

    2. 修复后 POSCAR 文件名固定为：
       - `calc_001_TiO2_fixed.POSCAR`
       - `calc_002_ZnO_fixed.POSCAR`
       - `calc_003_MgO_fixed.POSCAR`
       - `calc_004_Al2O3_fixed.POSCAR`
       - `calc_005_SiO2_fixed.POSCAR`

    不需要提交计算，只需生成正确的修正结构。

    关键考察点： 1. POSCAR 结构是否修对 2. 修复内容是否与失败原因对应

    '
  tags:
  - eng_vasp
  priority: P0
  data_files:
  - key: failure_recovery
    path: data/BP_struct_005/failure_recovery.json
    oss_url: ''
    description: Batch failure recovery scenarios with frozen calculation parameters.
  - key: calc_001_tio2_bad_poscar
    path: data/BP_struct_005/calc_001_TiO2_bad.POSCAR
    oss_url: ''
    description: Bad TiO2 POSCAR with atoms too close.
  - key: calc_002_zno_bad_poscar
    path: data/BP_struct_005/calc_002_ZnO_bad.POSCAR
    oss_url: ''
    description: Bad ZnO POSCAR with sign-flipped basis vector causing left-handed cell.
  - key: calc_003_mgo_bad_poscar
    path: data/BP_struct_005/calc_003_MgO_bad.POSCAR
    oss_url: ''
    description: Bad MgO POSCAR with broken symmetry.
  - key: calc_004_al2o3_bad_poscar
    path: data/BP_struct_005/calc_004_Al2O3_bad.POSCAR
    oss_url: ''
    description: Bad Al2O3 POSCAR with duplicate atoms.
  - key: calc_005_sio2_bad_poscar
    path: data/BP_struct_005/calc_005_SiO2_bad.POSCAR
    oss_url: ''
    description: Bad SiO2 POSCAR with distorted cell.
  reference_answers:
  - key: input_file_sets_count
    value: 5
    tolerance: 0.0
  - key: calc_001_tio2_fixed_artifact
    value: calc_001_TiO2_fixed.POSCAR
  - key: calc_002_zno_fixed_artifact
    value: calc_002_ZnO_fixed.POSCAR
  - key: calc_003_mgo_fixed_artifact
    value: calc_003_MgO_fixed.POSCAR
  - key: calc_004_al2o3_fixed_artifact
    value: calc_004_Al2O3_fixed.POSCAR
  - key: calc_005_sio2_fixed_artifact
    value: calc_005_SiO2_fixed.POSCAR
  - key: poscar_repair_triplet_match
    value:
      filenames:
      - failure_recovery.json
      - calc_001_TiO2_bad.POSCAR
      - calc_001_TiO2_fixed.POSCAR
      - calc_002_ZnO_bad.POSCAR
      - calc_002_ZnO_fixed.POSCAR
      - calc_003_MgO_bad.POSCAR
      - calc_003_MgO_fixed.POSCAR
      - calc_004_Al2O3_bad.POSCAR
      - calc_004_Al2O3_fixed.POSCAR
      - calc_005_SiO2_bad.POSCAR
      - calc_005_SiO2_fixed.POSCAR
  - key: grounding_repair_causes
    value: Each geometry fix addresses the specific failure cause
  - key: turn_budget
    value:
      max: 20
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 35000
  scoring_checklist:
  - id: input_file_sets_count
    criterion: '[Must] Exactly 5 corrected POSCAR files are generated.'
    axis: correctness
    verify: numerical_range
    weight: 0.8
  - id: calc_001_tio2_fixed_artifact
    criterion: Agent writes `calc_001_TiO2_fixed.POSCAR` to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.4
  - id: calc_002_zno_fixed_artifact
    criterion: Agent writes `calc_002_ZnO_fixed.POSCAR` to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.4
  - id: calc_003_mgo_fixed_artifact
    criterion: Agent writes `calc_003_MgO_fixed.POSCAR` to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.4
  - id: calc_004_al2o3_fixed_artifact
    criterion: Agent writes `calc_004_Al2O3_fixed.POSCAR` to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.4
  - id: calc_005_sio2_fixed_artifact
    criterion: Agent writes `calc_005_SiO2_fixed.POSCAR` to workspace.
    axis: correctness
    verify: artifact_exists
    weight: 0.4
  - id: poscar_repair_triplet_match
    criterion: '[Must] For each material, judge repair correctness using only the bad/fixed
      POSCAR pair and the `repair_acceptance` rules in `failure_recovery.json`. Do not enforce
      a single coordinate-level canonical answer when multiple valid repairs satisfy the acceptance
      constraints.'
    axis: correctness
    verify: llm_binary_judge
    weight: 1.8
  - id: grounding_repair_causes
    criterion: '[Must] Each POSCAR repair addresses the specific failure cause in configuration
      (overlap, cell distortion, symmetry issues, etc.).'
    axis: grounding
    verify: llm_binary_judge
    weight: 1.5
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
    weight: 0.4
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed a generous
      benchmark ceiling.
    axis: efficiency
    verify: duration_budget
    weight: 0.3
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within benchmark ceiling.
    axis: efficiency
    verify: token_budget
    weight: 0.3
- id: BP_alpha2f_001_20250618
  capability: batch_processing
  domain: agnostic
  intent: Apply the Savitzky-Golay smoothing and energy interpolation procedure to raw α²F(ω) data, matching
    the binning protocol used in the BETE-NET paper for preparing training data.
  human_prompt_seed: 'Process the raw α²F(ω) data in raw_alpha2f_data.json using the BETE-NET smoothing
    protocol: apply a Savitzky-Golay filter (window=101, polyorder=3) and interpolate onto 51 uniformly
    spaced energy points from 0.25 to 100.25 meV. Write the processed data to `smoothed_alpha2f.json`
    with the same material keys.'
  tags: []
  data_files:
  - key: raw_alpha2f
    path: raw_alpha2f_data.json
    oss_url: ''
    description: JSON file containing raw DFT-computed α²F(ω) data at 0.1 meV resolution for 3 representative
      materials, mimicking the QE output format described in the paper.
  reference_answers:
  - key: artifact_smoothed
    value: smoothed_alpha2f.json
  - key: correct_npoints
    value:
      flags: []
      pattern: '51'
      filename: smoothed_alpha2f.json
  - key: energy_range
    value:
      flags: []
      pattern: 0\.25.*100\.25|100\.25.*0\.25
      filename: smoothed_alpha2f.json
  - key: valid_json
    value:
      tokens:
      - '{'
      - '}'
      filename: smoothed_alpha2f.json
  - key: grounding_source
    value:
      filename: smoothed_alpha2f.json
  - key: turn_budget
    value:
      max: 15
  - key: no_retries
    value: true
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: artifact_smoothed
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Output file smoothed_alpha2f.json exists in the working directory.'
  - id: correct_npoints
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Each material''s α²F(ω) is interpolated to exactly 51 energy points as specified
      in the paper.'
  - id: energy_range
    axis: correctness
    verify: text_file_regex
    weight: 1.0
    criterion: '[Must] Energy range spans 0.25 to 100.25 meV as specified in the paper.'
  - id: valid_json
    axis: correctness
    verify: text_file_contains_all
    weight: 1.0
    criterion: '[Must] Output is valid JSON format.'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The smoothing procedure follows the BETE-NET paper''s data preparation protocol
      (Savitzky-Golay filter with window=101, polyorder=3).'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    weight: 0.0
    criterion: '[Must] Agent completes within 15 turns.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    weight: 0.0
    criterion: '[Must] Agent does not request human retry.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    weight: 0.0
    criterion: '[Must] Agent completes within 300 seconds.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    weight: 0.0
    criterion: '[Must] Agent uses no more than 50000 tokens total.'
- id: BP_cleaning_004_20250618
  capability: batch_processing
  domain: agnostic
  intent: Implement the data cleaning pipeline described in the paper to filter crystal structures from
    the Materials Project database based on composition, stability, and structural criteria.
  human_prompt_seed: 'Given the crystal dataset (mp_crystals_sample.csv), implement the data cleaning
    pipeline from the paper. Filter out structures that: (1) contain radioactive elements, (2) have more
    than 20 atoms in the primitive cell, (3) have energy-above-hull > 1.0 eV/atom, (4) have non-positive-definite
    stiffness matrix or bulk modulus < 30 GPa. Save the cleaned dataset to cleaned_crystals.csv and a
    summary to cleaning_report.json with keys: total_input, total_retained, filtered_radioactive, filtered_large_cell,
    filtered_unstable, filtered_low_modulus.'
  tags:
  - meta_database
  data_files:
  - key: crystal_dataset
    path: mp_crystals_sample.csv
    oss_url: ''
    description: 'Sample CSV with columns: mp_id, formula, elements, n_sites, energy_above_hull_eV, has_radioactive,
      bulk_modulus_GPa, stiffness_matrix_positive_definite. Contains ~50 sample entries mimicking the
      MP database extraction.'
  reference_answers:
  - key: cleaned_exists
    value: cleaned_crystals.csv
  - key: report_exists
    value: cleaning_report.json
  - key: report_values
    value:
      checks:
      - key: total_input
        expected: 50
        tolerance: 0
        allow_missing_key: false
      - key: total_retained
        max: 50
        min: 10
        allow_missing_key: false
      - key: filtered_radioactive
        max: 50
        min: 0
        allow_missing_key: true
      - key: filtered_large_cell
        max: 50
        min: 0
        allow_missing_key: true
      - key: filtered_unstable
        max: 50
        min: 0
        allow_missing_key: true
      - key: filtered_low_modulus
        max: 50
        min: 0
        allow_missing_key: true
      filename: cleaning_report.json
  - key: grounding_source
    value:
      filename: mp_crystals_sample.csv
  - key: turn_budget
    value:
      max: 20
  - key: no_retries
    value:
      max: 0
  - key: duration_budget
    value:
      max: 300
  - key: token_budget_total
    value:
      max: 50000
  scoring_checklist:
  - id: cleaned_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Cleaned dataset cleaned_crystals.csv exists.'
  - id: report_exists
    axis: correctness
    verify: artifact_exists
    weight: 1.0
    criterion: '[Must] Cleaning report cleaning_report.json exists.'
  - id: report_values
    axis: correctness
    verify: text_file_numeric_range
    weight: 2.0
    criterion: '[Suggested] total_retained is less than or equal to total_input (50), and all filtered
      counts are non-negative and sum to (total_input - total_retained).'
  - id: grounding_source
    axis: grounding
    verify: llm_binary_judge
    weight: 1.0
    criterion: '[Must] The filtering criteria match the four rules specified in the source paper''s data
      cleaning methodology.'
  - id: turn_budget
    axis: efficiency
    verify: turn_budget
    criterion: '[Must] Turn budget not exceeded.'
  - id: no_retries
    axis: efficiency
    verify: no_retries
    criterion: '[Must] No retries used.'
  - id: duration_budget
    axis: efficiency
    verify: duration_budget
    criterion: '[Must] Duration budget not exceeded.'
  - id: token_budget_total
    axis: efficiency
    verify: token_budget
    criterion: '[Must] Token budget not exceeded.'
