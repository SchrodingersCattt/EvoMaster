version: v5
capability: batch_processing
domain: struct
questions:
- id: BP_struct_001_20260405
  capability: batch_processing
  domain: struct
  intent: Batch-construct Si(100) surface slabs with varying vacuum thickness while
    keeping all other geometric parameters (Miller index, layer count, supercell size)
    constant. Verify strict variable control.
  human_prompt_seed: '从 `surface_slab_params.json` 读取配置。 构造 5 个 Si(100) 表面 slab，改变真空厚度：10,
    15, 20, 25, 30 Å。 其他参数严格保持固定：Miller 指标 [1,0,0], 4 层 Si, 3x3 超胞。 输出 5 个 CIF 文件，每个文件名包含真空厚度。

    关键考察点： 1. 真空厚度参数按顺序变化 2. 所有其他构建参数保持恒定 3. 生成 5 个不同的输出文件

    '
  tags:
  - batch_operation
  - parameter_sweep
  - single_variable
  - surface_slab
  mode_scope:
  - direct
  - planner
  data_files:
  - key: surface_slab_params
    path: data/BP_struct_001/surface_slab_params.json
    oss_url: ''
    description: Surface slab batch configuration with locked geometry and varying
      vacuum.
  reference_answers:
  - key: vacuum_sweep_variable
    tool_name: mat_sg_build_surface_slab
    tool_arg: vacuum
    value:
      sweep_param: vacuum_thickness_A
      expected_values:
      - 10.0
      - 15.0
      - 20.0
      - 25.0
      - 30.0
  - key: locked_miller_index
    tool_name: mat_sg_build_surface_slab
    value:
      param_names: miller_index
      expected_constant: '[1, 0, 0]'
  - key: locked_layer_count
    tool_name: mat_sg_build_surface_slab
    tool_arg: slab_size_value
    value:
      param_names: number_of_layers
      expected_constant: 4
  - key: output_files_generated
    value: 5
    tolerance: 0.0
  - key: no_redundant_calls
    value: 5
    tolerance: 0.0
  - key: batch_efficiency
    value: 5 slabs without re-querying
  - key: turn_budget
    value: &id000
      max: 20
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 10000
  scoring_checklist:
  - id: vacuum_sweep_variable
    criterion: 'Vacuum thickness parameter varies across exactly 5 calls: 10, 15,
      20, 25, 30 Å.'
    axis: correctness
    verify: batch_single_variable_sweep
  - id: locked_miller_index
    criterion: Miller index [1,0,0] remains constant across all 5 slab-construction
      calls.
    axis: correctness
    verify: batch_tool_args_constant
  - id: locked_layer_count
    criterion: Number of layers parameter remains constant (value = 4) across all
      5 calls.
    axis: correctness
    verify: batch_tool_args_constant
  - id: output_files_generated
    criterion: All 5 CIF/POSCAR files are generated and have distinct vacuum thickness
      indicators.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_batch_consistency
    criterion: The five outputs collectively reflect a single-parameter vacuum sweep
      with Miller index, layer count, and supercell held fixed as specified.
    axis: grounding
    verify: llm_binary_judge
  - id: no_redundant_calls
    criterion: No identical consecutive calls (tool_name + all args). Each call is
      parameterically different.
    axis: efficiency
    verify: no_retries
  - id: batch_efficiency
    criterion: Batch construction completed without re-querying input data or recomputing
      unchanged geometries.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_002_20260404
  capability: batch_processing
  domain: struct
  intent: Generate VASP INCAR files for DOS calculation across 4 different structures.
    Enforce unified k-point density (~50 k-points/Ų despite different structure sizes)
    and identical electronic parameters across all structures.
  human_prompt_seed: '从 `dos_input_prep.json` 读取 4 种材料的 DOS 计算配置（Si, Cu, Al, Fe）。

    对每种材料生成对应的 VASP INCAR 文件，要求： 1. k-point 密度统一为 ~50 points/Ų（虽然不同结构尺度不同，k 点网格数目不同）
    2. ISMEAR=0, SIGMA=0.05, NEDOS=2000 在所有 4 个文件中完全相同 3. 其他电子学参数（LORBIT, NSW 等）一致

    关键考察点： 1. 理解 k-point 密度概念（不是k点个数） 2. 为不同大小的结构计算合适的 k 点网格 3. 确保非几何参数（ISMEAR 等）的一致性
    4. 生成标准格式的 INCAR 文件

    '
  tags:
  - batch_operation
  - input_generation
  - dos_calculation
  - kpoint_density
  mode_scope:
  - direct
  - planner
  data_files:
  - key: dos_input_prep
    path: data/BP_struct_002/dos_input_prep.json
    oss_url: ''
    description: DOS input preparation config for 4 structures with unified k-point
      density.
  reference_answers:
  - key: incar_files_count
    value: 4
    tolerance: 0.0
  - key: kpoint_density_unified
    value:
      description: All 4 INCAR files specify k-point density ~50/Ų
      tolerance_percent: 5.0
  - key: electronic_parameters_identical
    value:
      ISMEAR: 0
      SIGMA: 0.05
      NEDOS: 2000
  - key: incar_format_valid
    value: VASP INCAR format
  - key: grounding_config_used
    value: Configuration from dos_input_prep.json
  - key: no_manual_kpoint_tuning
    value: Systematic k-point density calculation
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: incar_files_count
    criterion: Exactly 4 INCAR files generated (one per material).
    axis: correctness
    verify: numerical_range
  - id: kpoint_density_unified
    criterion: All 4 INCAR files follow unified k-point density strategy (~50 points/Ų),
      even though raw k-point counts differ due to structure sizes.
    axis: correctness
    verify: llm_binary_judge
  - id: electronic_parameters_identical
    criterion: ISMEAR=0, SIGMA=0.05, NEDOS=2000 are identical across all 4 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: incar_format_valid
    criterion: All 4 INCAR files follow VASP key=value syntax.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_config_used
    criterion: Configuration values (ISMEAR, SIGMA, etc.) match the provided manifest
      exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: no_manual_kpoint_tuning
    criterion: Agent computed k-point grids systematically (e.g., using density formula),
      not by trial-and-error.
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_003_20260404
  capability: batch_processing
  domain: struct
  intent: Generate 5 VASP INCAR input files for Al ENCUT convergence test (280, 300,
    320, 340, 360 eV). All other parameters (k-mesh, ISMEAR, SIGMA, NSW) must remain
    strictly constant across the 5 files. Focus is on correct input preparation and
    variable control, not on submitting or running calculations.
  human_prompt_seed: '从 `convergence_encut.json` 读取收敛测试配置。为铝（Al）的 ENCUT 收敛测试生成
    5 个 VASP INCAR 输入文件，ENCUT 分别为：280, 300, 320, 340, 360 eV。

    严格要求： 1. k-point 网格在所有 5 个 INCAR 中固定为 8x8x8 2. ISMEAR=1, SIGMA=0.1 在所有
    INCAR 中完全相同 3. NSW=0（单点计算设定） 4. 除 ENCUT 外，其他所有 VASP 参数在 5 个文件中保持一致

    输出 5 个 INCAR 文件，文件名包含 ENCUT 值（如 INCAR_ENCUT280）。不需要提交计算，只需生成正确的输入文件。

    关键考察点： 1. ENCUT 在 5 个文件中按顺序变化，且为唯一变量 2. 所有非扫描参数在 5 个文件中完全一致 3. INCAR 格式正确、参数无遗漏

    '
  tags:
  - batch_operation
  - convergence_test
  - encut_sweep
  - input_generation
  - single_variable
  mode_scope:
  - direct
  - planner
  data_files:
  - key: convergence_encut
    path: data/BP_struct_003/convergence_encut.json
    oss_url: ''
    description: ENCUT convergence test configuration for Al.
  reference_answers:
  - key: incar_files_count
    value: 5
    tolerance: 0.0
  - key: encut_sweep_values
    value: 280, 300, 320, 340, 360
  - key: kpoint_mesh_constant
    value: 8 8 8
  - key: electronic_params_frozen
    value:
      ISMEAR: 1
      SIGMA: 0.1
      NSW: 0
  - key: incar_format_valid
    value: VASP INCAR key=value format
  - key: single_variable_control
    value: Only ENCUT differs across the 5 files (SYSTEM tag and comment lines may
      also vary as they are cosmetic, not computational)
  - key: grounding_config_used
    value: Parameters from convergence_encut.json
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: incar_files_count
    criterion: Exactly 5 INCAR files are generated, one per ENCUT value.
    axis: correctness
    verify: numerical_range
  - id: encut_sweep_values
    criterion: 'The 5 INCAR files contain ENCUT values 280, 300, 320, 340, 360 eV
      respectively, and ENCUT is the only computational parameter that differs across
      files. Cosmetic fields such as SYSTEM tags, comment lines, or filename references
      may also vary and should not be counted as violations.'
    axis: correctness
    verify: llm_binary_judge
  - id: kpoint_mesh_constant
    criterion: K-point mesh specification (8x8x8) is identical in all 5 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: electronic_params_frozen
    criterion: ISMEAR=1, SIGMA=0.1, NSW=0 are identical across all 5 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: incar_format_valid
    criterion: All 5 files follow valid VASP INCAR key=value syntax with no missing
      required parameters.
    axis: correctness
    verify: llm_binary_judge
  - id: single_variable_control
    criterion: Comparing any two of the 5 INCAR files, ENCUT is the only computational
      parameter that differs. All other computational parameters (ISMEAR, SIGMA, NSW,
      EDIFF, PREC, etc.) are identical. Cosmetic differences in SYSTEM tags, comment
      lines, or first-line labels are acceptable.
    axis: grounding
    verify: llm_binary_judge
  - id: grounding_config_used
    criterion: Parameter values (k-mesh, ISMEAR, SIGMA, NSW, ENCUT list) match the
      provided convergence_encut.json configuration exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_004_20260404
  capability: batch_processing
  domain: struct
  intent: Perform batch post-processing of band structures for 3 materials (Si, Ge,
    GaAs) with unified analysis parameters. Extract band gaps and band edge positions
    using identical k-paths, energy windows, and plot specifications across all materials.
  human_prompt_seed: '从 `postprocessing_bandstr.json` 读取 3 种材料（Si, Ge, GaAs）的带结构后处理配置。

    对每种材料执行相同的分析流程： 1. k-path 固定为 M-Gamma-K，每段 50 个 k 点 2. 能量窗口统一为 [-5, 5] eV 3. 费米面参考点：VBM（价带最大值）
    4. 所有绘图使用相同样式和范围

    输出要求： 1. 3 个带结构 PNG 图 2. 3 个数据表（CSV 格式） 3. 带隙值和边界位置汇总表

    关键考察点： 1. 分析参数（k-path, 能量窗口）在所有材料中完全一致 2. 虽然材料的绝对带隙不同，但分析流程相同 3. 输出文件和数据格式统一

    '
  tags:
  - batch_operation
  - post_processing
  - band_structure
  - analysis_consistency
  mode_scope:
  - direct
  - planner
  data_files:
  - key: postprocessing_bandstr
