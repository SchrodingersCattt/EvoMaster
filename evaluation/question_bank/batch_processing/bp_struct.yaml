version: v5
capability: batch_processing
domain: struct
questions:
- id: BP_struct_003_20260412
  capability: batch_processing
  domain: struct
  intent: Generate 5 VASP INCAR input files for Al ENCUT convergence test (280, 300,
    320, 340, 360 eV). All other parameters (k-mesh, ISMEAR, SIGMA, NSW) must remain
    strictly constant across the 5 files. Focus is on correct input preparation and
    variable control, not on submitting or running calculations.
  human_prompt_seed: '从 `convergence_encut.json` 读取收敛测试配置。为铝（Al）的 ENCUT 收敛测试生成
    5 个 VASP INCAR 输入文件，ENCUT 分别为：280, 300, 320, 340, 360 eV。

    严格要求： 1. k-point 网格在所有 5 个计算中固定为 8x8x8（通过 KPOINTS 文件或 INCAR 均可） 2. ISMEAR=1, SIGMA=0.1 在所有
    INCAR 中完全相同 3. NSW=0（单点计算设定） 4. 除 ENCUT 外，其他所有 VASP 参数在 5 个文件中保持一致

    输出 5 个 INCAR 文件，文件名包含 ENCUT 值（如 INCAR_ENCUT280）。不需要提交计算，只需生成正确的输入文件。

    关键考察点： 1. ENCUT 在 5 个文件中按顺序变化，且为唯一变量 2. 所有非扫描参数在 5 个文件中完全一致 3. INCAR 格式正确、参数无遗漏

    '
  tags:
  - batch_operation
  - convergence_test
  - encut_sweep
  - input_generation
  - single_variable
  priority: P0
  mode_scope:
  - direct
  - planner
  data_files:
  - key: convergence_encut
    path: data/BP_struct_003/convergence_encut.json
    oss_url: ''
    description: ENCUT convergence test configuration for Al.
  reference_answers:
  - key: incar_files_count
    value: 5
    tolerance: 0.0
  - key: encut_sweep_values
    value: 280, 300, 320, 340, 360
  - key: kpoint_mesh_constant
    value: 8 8 8
  - key: electronic_params_frozen
    value:
      ISMEAR: 1
      SIGMA: 0.1
      NSW: 0
  - key: incar_format_valid
    value: VASP INCAR key=value format
  - key: single_variable_control
    value: Only ENCUT differs across the 5 files (SYSTEM tag and comment lines may
      also vary as they are cosmetic, not computational)
  - key: grounding_config_used
    value: Parameters from convergence_encut.json
  - key: turn_budget
    value: &id000
      max: 20
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 35000
  scoring_checklist:
  - id: incar_files_count
    criterion: Exactly 5 INCAR files are generated, one per ENCUT value.
    axis: correctness
    verify: numerical_range
  - id: encut_sweep_values
    criterion: 'The 5 INCAR files contain ENCUT values 280, 300, 320, 340, 360 eV
      respectively, and ENCUT is the only computational parameter that differs across
      files. Cosmetic fields such as SYSTEM tags, comment lines, or filename references
      may also vary and should not be counted as violations.'
    axis: correctness
    verify: llm_binary_judge
  - id: kpoint_mesh_constant
    criterion: K-point mesh (8×8×8 Gamma-centered) is consistently applied to all
      5 calculations—either via a companion KPOINTS file or via KSPACING/KGAMMA
      tags in INCAR.
    axis: correctness
    verify: llm_binary_judge
  - id: electronic_params_frozen
    criterion: ISMEAR=1, SIGMA=0.1, NSW=0 are identical across all 5 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: incar_format_valid
    criterion: All 5 files follow valid VASP INCAR key=value syntax with no missing
      required parameters.
    axis: correctness
    verify: llm_binary_judge
  - id: single_variable_control
    criterion: Comparing any two of the 5 INCAR files, ENCUT is the only computational
      parameter that differs. All other computational parameters (ISMEAR, SIGMA, NSW,
      EDIFF, PREC, etc.) are identical. Cosmetic differences in SYSTEM tags, comment
      lines, or first-line labels are acceptable.
    axis: grounding
    verify: llm_binary_judge
  - id: grounding_config_used
    criterion: "Parameter values in the generated INCAR files match the convergence_encut.json\
      \ config exactly: k-mesh 8\xD78\xD78, ISMEAR=1, SIGMA=0.1, NSW=0, IBRION=-1,\
      \ ALGO=Fast, ENCUT sweep [280, 300, 320, 340, 360] eV. The answer or files\
      \ must show these values were derived from reading the JSON file, not invented\
      \ independently."
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_004_20260406
  capability: batch_processing
  domain: struct
  intent: Perform batch post-processing of band structures for 3 materials (Si, Ge,
    GaAs) with unified analysis parameters. Extract band gaps and band edge positions
    using identical k-paths, energy windows, and plot specifications across all materials.
  human_prompt_seed: '从 `postprocessing_bandstr.json` 读取 3 种材料（Si, Ge, GaAs）的带结构后处理配置。

    对每种材料执行相同的分析流程： 1. k-path 固定为 M-Gamma-K，每段 50 个 k 点 2. 能量窗口统一为 [-5, 5] eV 3. 费米面参考点：VBM（价带最大值）
    4. 所有绘图使用相同样式和范围

    输出要求： 1. 3 个带结构 PNG 图 2. 3 个数据表（CSV 格式） 3. 带隙值和边界位置汇总表

    关键考察点： 1. 分析参数（k-path, 能量窗口）在所有材料中完全一致 2. 虽然材料的绝对带隙不同，但分析流程相同 3. 输出文件和数据格式统一

    '
  tags:
  - batch_operation
  - post_processing
  - band_structure
  - analysis_consistency
  mode_scope:
  - direct
  - planner
  data_files:
  - key: postprocessing_bandstr
    path: data/BP_struct_004/postprocessing_bandstr.json
    oss_url: ''
    description: Batch band structure analysis configuration with unified parameters.
  reference_answers:
  - key: analysis_count_correct
    value: 3
    tolerance: 0.0
  - key: kpath_unified
    value: M-Gamma-K
  - key: energy_window_unified
    value:
    - -5
    - 5
  - key: fermi_reference_unified
    value: VBM
  - key: output_format_consistent
    value: PNG + CSV for each material
  - key: bandgap_extracted
    value:
      si:
      - 1.02
      - 1.22
      ge:
      - 0.57
      - 0.77
      gaas:
      - 1.32
      - 1.52
  - key: grounding_analysis_correct
    value: Configuration from postprocessing_bandstr.json
  - key: analysis_workflow_streamlined
    value: Unified workflow for all 3 materials
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: analysis_count_correct
    criterion: Exactly 3 materials are analyzed (Si, Ge, GaAs).
    axis: correctness
    verify: llm_binary_judge
  - id: kpath_unified
    criterion: All 3 analyses use the same k-path (M-Gamma-K) with 50 points per segment.
    axis: correctness
    verify: llm_binary_judge
  - id: energy_window_unified
    criterion: All 3 analyses use energy window [-5, 5] eV as the plotting range.
    axis: correctness
    verify: llm_binary_judge
  - id: fermi_reference_unified
    criterion: All 3 analyses use VBM (valence band maximum) as the Fermi level reference
      point.
    axis: correctness
    verify: llm_binary_judge
  - id: output_format_consistent
    criterion: All 3 analyses produce both PNG plot and CSV data table in consistent
      format.
    axis: correctness
    verify: llm_binary_judge
  - id: bandgap_extracted
    criterion: 'Band gap values extracted for all 3 materials and fall within expected
      range (Si: 1.0–1.2 eV, Ge: 0.6–0.8 eV, GaAs: 1.3–1.5 eV).'
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_analysis_correct
    criterion: Analysis methodology (k-path, window, reference) matches the provided
      configuration exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: analysis_workflow_streamlined
    criterion: All 3 materials analyzed using a single unified script or workflow
      template (no per-material ad-hoc tweaks).
    axis: efficiency
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_005_20260406
  capability: batch_processing
  domain: struct
  intent: Generate corrected VASP input files for 5 structures whose initial geometry
    caused calculation failures. For each structure, fix only the geometry (atomic
    positions, cell, symmetry) while keeping all calculation parameters (k-points,
    ISMEAR, SIGMA, ENCUT) strictly frozen. Focus is on correct input-file preparation
    and parameter isolation, not on submitting or running calculations.
  human_prompt_seed: '从 `failure_recovery.json` 读取 5 个结构（TiO2, ZnO, MgO, Al2O3,
    SiO2）的失败恢复场景。每个结构的初始计算因几何问题失败（如原子重叠、晶胞畸变、对称性错误等）。

    请为每个结构生成修正后的 VASP 输入文件（POSCAR + INCAR），修复策略：

    1. 仅修复结构文件（POSCAR）中的几何问题（原子位置、晶胞参数、对称性）

    2. 严格冻结所有计算参数（INCAR + KPOINTS）：
       - k-point 网格: 6x6x6（不变，通过 KPOINTS 文件或 INCAR 均可）
       - ISMEAR=1, SIGMA=0.1（不变）
       - ENCUT=520 eV（不变）
       - 其他求解器参数（ALGO, NSW 等）不变

    3. 对每个结构说明修复了什么几何问题

    输出要求：

    1. 5 组修正后的输入文件（POSCAR + INCAR）

    2. 所有 INCAR 使用相同的冻结参数集

    3. 明确标记每个结构的几何修复内容

    不需要提交计算，只需生成正确的修正输入文件。

    关键考察点： 1. 只修改了几何/结构文件 2. 没有不必要地调整计算参数 3. 修复内容与失败原因对应

    '
  tags:
  - batch_operation
  - failure_recovery
  - parameter_isolation
  - input_generation
  mode_scope:
  - direct
  - planner
  data_files:
  - key: failure_recovery
    path: data/BP_struct_005/failure_recovery.json
    oss_url: ''
    description: Batch failure recovery scenarios with frozen calculation parameters.
  reference_answers:
  - key: input_file_sets_count
    value: 5
    tolerance: 0.0
  - key: kpoint_mesh_frozen
    value: 6 6 6
  - key: electronic_params_frozen
    value:
      ISMEAR: 1
      SIGMA: 0.1
      ENCUT: 520
  - key: geometry_repairs_isolated
    value: Only POSCAR/structure files modified, INCAR unchanged
  - key: no_parameter_thrashing
    value: No re-tuning of electronic settings in any INCAR
  - key: grounding_frozen_params
    value: Frozen parameters from failure_recovery.json
  - key: grounding_repair_causes
    value: Each geometry fix addresses the specific failure cause
  - key: turn_budget
    value: *id000
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: input_file_sets_count
    criterion: Exactly 5 sets of corrected input files are generated (one POSCAR +
      INCAR per material).
    axis: correctness
    verify: numerical_range
  - id: kpoint_mesh_frozen
    criterion: All 5 calculations use identical k-point mesh (6×6×6), unchanged
      from the original configuration—whether specified via a KPOINTS file or
      via KSPACING in INCAR.
    axis: correctness
    verify: llm_binary_judge
  - id: electronic_params_frozen
    criterion: ISMEAR=1, SIGMA=0.1, ENCUT=520 are identical across all 5 INCAR files
      and match the original frozen values.
    axis: correctness
    verify: llm_binary_judge
  - id: geometry_repairs_isolated
    criterion: Only the POSCAR / structure files were modified to fix geometry issues;
      all INCAR calculation settings remain unchanged from the originals.
    axis: correctness
    verify: llm_binary_judge
  - id: no_parameter_thrashing
    criterion: No unnecessary re-tuning of k-points, smearing, cutoff, or solver
      algorithm in any of the 5 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_frozen_params
    criterion: Frozen parameters (k-mesh, ISMEAR, SIGMA, ENCUT) match the
      failure_recovery.json configuration exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: grounding_repair_causes
    criterion: Each geometry fix correctly addresses the specific failure cause
      described in the configuration (e.g., fixing overlapping atoms, correcting
      cell distortion, resolving symmetry errors).
    axis: grounding
    verify: llm_binary_judge
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_006_20260412v2
  capability: batch_processing
  domain: struct
  intent: Batch retrieve 20 lithium-containing structures and compute the average volume per atom from per-structure metadata.
  human_prompt_seed: '批量检索 20 个含锂材料（结构文件可下载），并计算它们的平均单原子体积（average volume per atom）。

    请完成以下交付：

    1) `li20_volume_stats.json`：至少包含 `candidate_count`, `volume_per_atom_list`, `average_volume_per_atom`, `unit`；
    2) `li20_retrieval_report.md`：说明检索条件（含锂、数量 20）、每条数据的体积/原子数来源，以及均值计算过程；
    3) 在最终回答中给出平均值并说明该统计可能受哪些样本偏差影响。

    注意：本题强调批量检索 + 统计汇总，不要求后续第一性原理计算。'
  tags:
  - batch_operation
  - lithium
  - structure_retrieval
  - statistics
  - userlog_derived
  mode_scope:
  - direct
  - planner
  data_files: []
  reference_answers:
  - key: stats_json
    value: li20_volume_stats.json
  - key: retrieval_report
    value: li20_retrieval_report.md
  - key: stats_required_tokens
    value:
      filename: li20_volume_stats.json
      tokens:
      - candidate_count
      - 20
      - volume_per_atom_list
      - average_volume_per_atom
      - unit
      flags: i
  - key: report_required_tokens
    value:
      filename: li20_retrieval_report.md
      tokens:
      - 锂
      - 20
      - 体积
      - 原子
      - 平均
      flags: i
  - key: turn_budget
    value:
      max: 16
  - key: duration_budget
    value:
      max: 7200000
  - key: token_budget_total
    value:
      max: 12000
  scoring_checklist:
  - id: stats_json
    criterion: Agent writes `li20_volume_stats.json` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: retrieval_report
    criterion: Agent writes `li20_retrieval_report.md` to workspace.
    axis: correctness
    verify: artifact_exists
  - id: stats_required_tokens
    criterion: Stats JSON contains batch-size and average-volume fields for 20 lithium-containing candidates.
    axis: correctness
    verify: text_file_contains_all
  - id: report_required_tokens
    criterion: Report explains retrieval constraints and average-volume calculation rationale.
    axis: correctness
    verify: text_file_contains_all
  - id: grounding_source
    criterion: The final answer is grounded in retrieved structure metadata and explicitly distinguishes measured per-item values from computed aggregate statistics.
    axis: grounding
    verify: llm_binary_judge
  - id: no_retries
    criterion: No repeated identical retrieval calls with the same parameters.
    axis: efficiency
    verify: no_retries
  - id: turn_budget
    criterion: Agent completes the task within the turn (step) budget.
    axis: efficiency
    verify: turn_budget
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
