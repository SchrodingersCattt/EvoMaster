version: v5
capability: batch_processing
domain: struct
questions:
- id: BP_struct_001
  capability: batch_processing
  domain: struct
  intent: Batch-construct Si(100) surface slabs with varying vacuum thickness while
    keeping all other geometric parameters (Miller index, layer count, supercell size)
    constant. Verify strict variable control.
  human_prompt_seed: '从 `surface_slab_params.json` 读取配置。 构造 5 个 Si(100) 表面 slab，改变真空厚度：10,
    15, 20, 25, 30 Å。 其他参数严格保持固定：Miller 指标 [1,0,0], 4 层 Si, 3x3 超胞。 输出 5 个 CIF 文件，每个文件名包含真空厚度。

    关键考察点： 1. 真空厚度参数按顺序变化 2. 所有其他 mat_sg_build_surface_slab 参数保持恒定 3. 生成 5 个不同的输出文件

    '
  tags:
  - batch_operation
  - parameter_sweep
  - single_variable
  - surface_slab
  mode_scope:
  - direct
  - planner
  data_files:
  - key: surface_slab_params
    path: data/BP_struct_001/surface_slab_params.json
    oss_url: ''
    description: Surface slab batch configuration with locked geometry and varying
      vacuum.
  reference_answers:
  - key: vacuum_sweep_variable
    value:
      tool_name: mat_sg_build_surface_slab
      sweep_param: vacuum_thickness_A
      expected_values:
      - 10.0
      - 15.0
      - 20.0
      - 25.0
      - 30.0
  - key: locked_miller_index
    value:
      tool_name: mat_sg_build_surface_slab
      param_names: miller_index
      expected_constant: '[1, 0, 0]'
  - key: locked_layer_count
    value:
      tool_name: mat_sg_build_surface_slab
      param_names: number_of_layers
      expected_constant: 4
  - key: output_files_generated
    value: 5
    tolerance: 0.0
  - key: no_redundant_calls
    value: 5
    tolerance: 0.0
  - key: batch_efficiency
    value: 5 slabs without re-querying
  - key: duration_budget
    value: &id001
      max: 7200000
  - key: token_budget_total
    value: &id002
      max: 50000
  scoring_checklist:
  - id: vacuum_sweep_variable
    criterion: 'Vacuum thickness parameter varies across exactly 5 calls: 10, 15,
      20, 25, 30 Å.'
    axis: correctness
    verify: batch_single_variable_sweep
  - id: locked_miller_index
    criterion: Miller index [1,0,0] remains constant across all 5 mat_sg_build_surface_slab
      calls.
    axis: correctness
    verify: batch_tool_args_constant
  - id: locked_layer_count
    criterion: Number of layers parameter remains constant (value = 4) across all
      5 calls.
    axis: correctness
    verify: batch_tool_args_constant
  - id: output_files_generated
    criterion: All 5 CIF/POSCAR files are generated and have distinct vacuum thickness
      indicators.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_batch_consistency
    criterion: The five outputs collectively reflect a single-parameter vacuum sweep
      with Miller index, layer count, and supercell held fixed as specified.
    axis: grounding
    verify: llm_binary_judge
  - id: no_redundant_calls
    criterion: No identical consecutive calls (tool_name + all args). Each call is
      parameterically different.
    axis: efficiency
    verify: no_retries
  - id: batch_efficiency
    criterion: Batch construction completed without re-querying input data or recomputing
      unchanged geometries.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_002
  capability: batch_processing
  domain: struct
  intent: Generate VASP INCAR files for DOS calculation across 4 different structures.
    Enforce unified k-point density (~50 k-points/Ų despite different structure sizes)
    and identical electronic parameters across all structures.
  human_prompt_seed: '从 `dos_input_prep.json` 读取 4 种材料的 DOS 计算配置（Si, Cu, Al, Fe）。

    对每种材料生成对应的 VASP INCAR 文件，要求： 1. k-point 密度统一为 ~50 points/Ų（虽然不同结构尺度不同，k 点网格数目不同）
    2. ISMEAR=0, SIGMA=0.05, NEDOS=2000 在所有 4 个文件中完全相同 3. 其他电子学参数（LORBIT, NSW 等）一致

    关键考察点： 1. 理解 k-point 密度概念（不是k点个数） 2. 为不同大小的结构计算合适的 k 点网格 3. 确保非几何参数（ISMEAR 等）的一致性
    4. 生成标准格式的 INCAR 文件

    '
  tags:
  - batch_operation
  - input_generation
  - dos_calculation
  - kpoint_density
  mode_scope:
  - direct
  - planner
  data_files:
  - key: dos_input_prep
    path: data/BP_struct_002/dos_input_prep.json
    oss_url: ''
    description: DOS input preparation config for 4 structures with unified k-point
      density.
  reference_answers:
  - key: incar_files_count
    value: 4
    tolerance: 0.0
  - key: kpoint_density_unified
    value:
      description: All 4 INCAR files specify k-point density ~50/Ų
      tolerance_percent: 5.0
  - key: electronic_parameters_identical
    value:
      ISMEAR: 0
      SIGMA: 0.05
      NEDOS: 2000
  - key: incar_format_valid
    value: VASP INCAR format
  - key: grounding_config_used
    value: Configuration from dos_input_prep.json
  - key: no_manual_kpoint_tuning
    value: Systematic k-point density calculation
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: incar_files_count
    criterion: Exactly 4 INCAR files generated (one per material).
    axis: correctness
    verify: numerical_range
  - id: kpoint_density_unified
    criterion: All 4 INCAR files follow unified k-point density strategy (~50 points/Ų),
      even though raw k-point counts differ due to structure sizes.
    axis: correctness
    verify: llm_binary_judge
  - id: electronic_parameters_identical
    criterion: ISMEAR=0, SIGMA=0.05, NEDOS=2000 are identical across all 4 INCAR files.
    axis: correctness
    verify: llm_binary_judge
  - id: incar_format_valid
    criterion: All 4 INCAR files follow VASP key=value syntax.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_config_used
    criterion: Configuration values (ISMEAR, SIGMA, etc.) match the provided manifest
      exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: no_manual_kpoint_tuning
    criterion: Agent computed k-point grids systematically (e.g., using density formula),
      not by trial-and-error.
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_003
  capability: batch_processing
  domain: struct
  intent: Run a convergence test by performing 5 single-point energy calculations
    for Al with varying ENCUT (280, 300, 320, 340, 360 eV). All other parameters (k-mesh,
    ISMEAR, SIGMA, potcar) must remain strictly constant.
  human_prompt_seed: '从 `convergence_encut.json` 读取收敛测试配置。 对铝（Al）结构执行 5 个单点能量计算，ENCUT
    分别为：280, 300, 320, 340, 360 eV。

    严格要求： 1. k-point 网格在所有 5 个计算中固定为 8x8x8 2. ISMEAR=1, SIGMA=0.1 在所有计算中相同 3. NSW=0（不做离子弛豫）
    4. 其他 VASP 参数保持不变

    输出： 1. 5 个 OUTCAR 文件或能量日志 2. 能量随 ENCUT 的收敛曲线（可绘图或表格）

    关键考察点： 1. ENCUT 按预定顺序系统变化 2. 所有非扫描参数冻结 3. 能量输出清晰可用于收敛分析

    '
  tags:
  - batch_operation
  - convergence_test
  - encut_sweep
  - parameter_scan
  mode_scope:
  - direct
  - planner
  data_files:
  - key: convergence_encut
    path: data/BP_struct_003/convergence_encut.json
    oss_url: ''
    description: ENCUT convergence test configuration.
  reference_answers:
  - key: encut_sweep_parameter
    value:
      tool_name: VASP
      sweep_param: ENCUT
      expected_values:
      - 280
      - 300
      - 320
      - 340
      - 360
  - key: kpoint_mesh_constant
    value:
      locked_params: k-point mesh
      expected_value: 8 8 8
  - key: electronic_params_frozen
    value:
      ISMEAR: 1
      SIGMA: 0.1
  - key: energy_outputs_available
    value: 5 energy values extracted
  - key: convergence_trend
    value: Energy shows convergence pattern
  - key: convergence_test_proper
    value: Convergence test protocol followed
  - key: no_redundant_setup
    value: 5
    tolerance: 0.0
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: encut_sweep_parameter
    criterion: 'ENCUT varies across exactly 5 calculations: 280, 300, 320, 340, 360
      eV in order.'
    axis: correctness
    verify: batch_single_variable_sweep
  - id: kpoint_mesh_constant
    criterion: K-point mesh 8x8x8 remains constant across all 5 calculations.
    axis: correctness
    verify: batch_tool_args_constant
  - id: electronic_params_frozen
    criterion: ISMEAR and SIGMA parameters are identical (ISMEAR=1, SIGMA=0.1) across
      all 5 runs.
    axis: correctness
    verify: batch_tool_args_constant
  - id: energy_outputs_available
    criterion: All 5 calculations produce readable energy values (from OUTCAR or log
      file).
    axis: correctness
    verify: llm_binary_judge
  - id: convergence_trend
    criterion: Energy values show convergence trend with increasing ENCUT (monotonic
      or plateau behavior expected).
    axis: correctness
    verify: llm_binary_judge
  - id: convergence_test_proper
    criterion: 'Calculations follow proper convergence test protocol: same structure,
      same solver, only cutoff varies.'
    axis: grounding
    verify: llm_binary_judge
  - id: no_redundant_setup
    criterion: No duplicate or wasted calculation steps; each ENCUT value appears
      exactly once.
    axis: efficiency
    verify: no_retries
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_004
  capability: batch_processing
  domain: struct
  intent: Perform batch post-processing of band structures for 3 materials (Si, Ge,
    GaAs) with unified analysis parameters. Extract band gaps and band edge positions
    using identical k-paths, energy windows, and plot specifications across all materials.
  human_prompt_seed: '从 `postprocessing_bandstr.json` 读取 3 种材料（Si, Ge, GaAs）的带结构后处理配置。

    对每种材料执行相同的分析流程： 1. k-path 固定为 M-Gamma-K，每段 50 个 k 点 2. 能量窗口统一为 [-5, 5] eV 3. 费米面参考点：VBM（价带最大值）
    4. 所有绘图使用相同样式和范围

    输出要求： 1. 3 个带结构 PNG 图 2. 3 个数据表（CSV 格式） 3. 带隙值和边界位置汇总表

    关键考察点： 1. 分析参数（k-path, 能量窗口）在所有材料中完全一致 2. 虽然材料的绝对带隙不同，但分析流程相同 3. 输出文件和数据格式统一

    '
  tags:
  - batch_operation
  - post_processing
  - band_structure
  - analysis_consistency
  mode_scope:
  - direct
  - planner
  data_files:
  - key: postprocessing_bandstr
    path: data/BP_struct_004/postprocessing_bandstr.json
    oss_url: ''
    description: Batch band structure analysis configuration with unified parameters.
  reference_answers:
  - key: analysis_count_correct
    value: 3
    tolerance: 0.0
  - key: kpath_unified
    value: M-Gamma-K
  - key: energy_window_unified
    value:
    - -5
    - 5
  - key: fermi_reference_unified
    value: VBM
  - key: output_format_consistent
    value: PNG + CSV for each material
  - key: bandgap_extracted
    value:
      si:
      - 1.02
      - 1.22
      ge:
      - 0.57
      - 0.77
      gaas:
      - 1.32
      - 1.52
  - key: grounding_analysis_correct
    value: Configuration from postprocessing_bandstr.json
  - key: analysis_workflow_streamlined
    value: Unified workflow for all 3 materials
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: analysis_count_correct
    criterion: Exactly 3 materials are analyzed (Si, Ge, GaAs).
    axis: correctness
    verify: numerical_range
  - id: kpath_unified
    criterion: All 3 analyses use the same k-path (M-Gamma-K) with 50 points per segment.
    axis: correctness
    verify: llm_binary_judge
  - id: energy_window_unified
    criterion: All 3 analyses use energy window [-5, 5] eV as the plotting range.
    axis: correctness
    verify: llm_binary_judge
  - id: fermi_reference_unified
    criterion: All 3 analyses use VBM (valence band maximum) as the Fermi level reference
      point.
    axis: correctness
    verify: llm_binary_judge
  - id: output_format_consistent
    criterion: All 3 analyses produce both PNG plot and CSV data table in consistent
      format.
    axis: correctness
    verify: llm_binary_judge
  - id: bandgap_extracted
    criterion: 'Band gap values extracted for all 3 materials and fall within expected
      range (Si: 1.0–1.2 eV, Ge: 0.6–0.8 eV, GaAs: 1.3–1.5 eV).'
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_analysis_correct
    criterion: Analysis methodology (k-path, window, reference) matches the provided
      configuration exactly.
    axis: grounding
    verify: llm_binary_judge
  - id: analysis_workflow_streamlined
    criterion: All 3 materials analyzed using a single unified script or workflow
      template (no per-material ad-hoc tweaks).
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
- id: BP_struct_005
  capability: batch_processing
  domain: struct
  intent: Demonstrate controlled failure recovery for 5 structures with geometry issues.
    Repair only geometry-related parameters (structure, symmetry, lattice) while keeping
    all calculation settings (k-points, ISMEAR, SIGMA, ENCUT) frozen across all repairs.
  human_prompt_seed: "从 `failure_recovery.json` 读取 5 个结构（TiO2, ZnO, MgO, Al2O3, SiO2）的失败恢复场景。\
    \ 每个结构的初始计算因几何问题失败。\n修复策略： 1. 仅修复结构问题（原子位置、晶胞、对称性） 2. 严格冻结所有计算参数：\n   - k-point\
    \ mesh: 6x6x6（不变）\n   - ISMEAR=1, SIGMA=0.1（不变）\n   - ENCUT=520 eV（不变）\n   - 其他求解器参数（ALGO,\
    \ NSW）不变\n3. 对每个结构应用合适的几何修复步骤\n输出要求： 1. 5 个结构都收敛 2. 所有使用相同的冻结参数集 3. 明确标记出修复步骤\n\
    关键考察点： 1. 只修改了几何/结构参数 2. 没有不必要地重新调整电子学设置 3. 修复步骤和冻结参数的对应关系清晰\n"
  tags:
  - batch_operation
  - failure_recovery
  - parameter_isolation
  - robust_workflow
  mode_scope:
  - direct
  - planner
  data_files:
  - key: failure_recovery
    path: data/BP_struct_005/failure_recovery.json
    oss_url: ''
    description: Batch failure recovery configuration with frozen calculation parameters.
  reference_answers:
  - key: materials_recovered
    value: 5
    tolerance: 0.0
  - key: kpoint_mesh_frozen
    value:
      locked_params: k-point mesh
      expected_value: 6 6 6
  - key: electronic_params_frozen
    value:
      ISMEAR: 1
      SIGMA: 0.1
      ENCUT: 520
  - key: geometry_repairs_isolated
    value: Only geometry parameters modified
  - key: no_parameter_thrashing
    value: No re-tuning of electronic settings
  - key: grounding_frozen_params
    value: Frozen parameters from failure_recovery.json
  - key: grounding_repair_causes
    value: Repair steps address specific failures
  - key: no_redundant_recovery
    value: 5
    tolerance: 0.0
  - key: batch_recovery_efficiency
    value: Unified recovery workflow
  - key: duration_budget
    value: *id001
  - key: token_budget_total
    value: *id002
  scoring_checklist:
  - id: materials_recovered
    criterion: All 5 materials successfully converged after recovery.
    axis: correctness
    verify: numerical_range
  - id: kpoint_mesh_frozen
    criterion: All 5 recovered calculations use identical k-point mesh 6x6x6 (not
      modified during repair).
    axis: correctness
    verify: batch_tool_args_constant
  - id: electronic_params_frozen
    criterion: Electronic parameters (ISMEAR=1, SIGMA=0.1, ENCUT=520) remain unchanged
      across all 5 recovery steps.
    axis: correctness
    verify: batch_tool_args_constant
  - id: geometry_repairs_isolated
    criterion: Only geometry-related parameters (structure, lattice, symmetry) were
      modified between failure and recovery; calculation settings unchanged.
    axis: correctness
    verify: llm_binary_judge
  - id: no_parameter_thrashing
    criterion: No unnecessary re-tuning of k-points, smearing, or cutoff during recovery
      steps.
    axis: correctness
    verify: llm_binary_judge
  - id: grounding_frozen_params
    criterion: Frozen parameters match the configuration file exactly (k-point mesh,
      ISMEAR, SIGMA, ENCUT values).
    axis: grounding
    verify: llm_binary_judge
  - id: grounding_repair_causes
    criterion: Each repair step correctly addresses the specific failure cause (e.g.,
      symmetry fix for symmetry issue, geometry for close atoms).
    axis: grounding
    verify: llm_binary_judge
  - id: no_redundant_recovery
    criterion: Recovery completed in minimal steps; no re-attempts of the same repair
      type.
    axis: efficiency
    verify: no_retries
  - id: batch_recovery_efficiency
    criterion: All 5 materials recovered using a unified recovery workflow (not separate
      ad-hoc fixes per material).
    axis: efficiency
    verify: llm_binary_judge
  - id: duration_budget
    criterion: Wall-clock run duration (duration_ms) is recorded and does not exceed
      a generous benchmark ceiling (tunable per deployment).
    axis: efficiency
    verify: duration_budget
  - id: token_budget_total
    criterion: Total token usage is recorded and stays within a generous benchmark
      ceiling (tunable per task after calibration).
    axis: efficiency
    verify: token_budget
