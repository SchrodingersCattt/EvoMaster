# evidence_mapping.yaml — Tool name → EventType + SourceType mapping
#
# EvoMaster compatibility mapping. This file is NOT a core evaluator dependency:
# runtime-specific callers such as `runner.py` may choose to inject it into
# `EvidenceExtractor(mapping_path=...)`. If omitted, the core evaluator still
# works, only event/source-type classification becomes unavailable.
#
# Format per rule:
#   pattern: str          — tool name pattern (exact / prefix* / *substring*)
#   when_args_contains:   — optional; all conditions must match to apply this rule
#     <arg_key>: <substring>
#   event_type: str       — one of EventType enum values
#   source_type: str      — one of SourceType enum values
#   detail: str           — optional human-readable note (used in EventRecord.detail)
#
# Rules are evaluated in order; first match wins.
# Tools not matched remain in tool_calls (for LLM judge) but produce no EventRecord.

version: "1"

mappings:

  # -------------------------------------------------------------------------
  # Structure database retrieval (MCP mat_struct_db)
  # -------------------------------------------------------------------------
  - pattern: "mat_struct_db_fetch_structures_from_db"
    event_type: "structure_retrieval"
    source_type: "database"
    detail: "Fetched structure(s) from MCP materials structure DB"

  - pattern: "mat_struct_db_*"
    event_type: "structure_retrieval"
    source_type: "database"
    detail: "MCP structure DB operation"

  # -------------------------------------------------------------------------
  # Structure construction (MCP mat_sg / space-group builder)
  # -------------------------------------------------------------------------
  - pattern: "mat_sg_build_bulk_structure_by_template"
    event_type: "structure_construction"
    source_type: "scientific_library"
    detail: "Built bulk structure from space-group template"

  - pattern: "mat_sg_build_bulk_structure_by_wyckoff"
    event_type: "structure_construction"
    source_type: "scientific_library"
    detail: "Built bulk structure via Wyckoff positions"

  - pattern: "mat_sg_*"
    event_type: "structure_construction"
    source_type: "scientific_library"
    detail: "MCP space-group structure builder operation"

  # -------------------------------------------------------------------------
  # MLIPs calculations (operator skill via Bohrium submit_job.py)
  # -------------------------------------------------------------------------
  - pattern: "execute_bash"
    when_args_contains:
      command: "optimize_structure.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted MLIPs structure optimisation via Bohrium job"

  - pattern: "execute_bash"
    when_args_contains:
      command: "run_molecular_dynamics.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted MLIPs molecular dynamics via Bohrium job"

  - pattern: "execute_bash"
    when_args_contains:
      command: "calculate_phonon.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted MLIPs phonon calculation via Bohrium job"

  - pattern: "execute_bash"
    when_args_contains:
      command: "calculate_elastic.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted MLIPs elastic constants calculation via Bohrium job"

  - pattern: "execute_bash"
    when_args_contains:
      command: "run_neb.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted MLIPs NEB transition-state calculation via Bohrium job"

  # -------------------------------------------------------------------------
  # ABACUS DFT calculations (via bohrium-job skill + input-manual-helper)
  # -------------------------------------------------------------------------
  - pattern: "execute_bash"
    when_args_contains:
      command: "submit_job.py"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "Submitted Bohrium job (ABACUS or other DFT via bohrium-job skill)"

  # -------------------------------------------------------------------------
  # GROMACS MD simulations (via bohrium-job skill)
  # -------------------------------------------------------------------------
  - pattern: "execute_bash"
    when_args_contains:
      command: "gromacs"
    event_type: "calculation_execution"
    source_type: "bash_script"
    detail: "GROMACS MD operation via bohrium-job skill"

  # -------------------------------------------------------------------------
  # XRD / diffraction analysis (MCP mat_xrd)
  # -------------------------------------------------------------------------
  - pattern: "mat_xrd_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP XRD analysis"

  # -------------------------------------------------------------------------
  # NMR analysis (MCP mat_nmr)
  # -------------------------------------------------------------------------
  - pattern: "mat_nmr_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP NMR analysis"

  # -------------------------------------------------------------------------
  # Electron microscopy (MCP mat_electron_microscope)
  # -------------------------------------------------------------------------
  - pattern: "mat_electron_microscope_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP electron microscopy analysis"

  # -------------------------------------------------------------------------
  # Document / literature retrieval (MCP mat_doc / mat_sn)
  # -------------------------------------------------------------------------
  - pattern: "mat_doc_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP document/literature retrieval"

  - pattern: "mat_sn_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP SN literature/data retrieval"

  # -------------------------------------------------------------------------
  # CompDart / compositional analysis (MCP mat_compdart)
  # -------------------------------------------------------------------------
  - pattern: "mat_compdart_*"
    event_type: "data_analysis"
    source_type: "mcp_tool"
    detail: "MCP CompDart compositional analysis"

  # -------------------------------------------------------------------------
  # Bash script execution — further classified by when_args_contains
  # -------------------------------------------------------------------------

  # Python + ASE → scientific_library
  - pattern: "execute_bash"
    when_args_contains:
      command: "ase"
    event_type: "script_execution"
    source_type: "scientific_library"
    detail: "Bash: ASE python script"

  # Python + pymatgen → scientific_library
  - pattern: "execute_bash"
    when_args_contains:
      command: "pymatgen"
    event_type: "script_execution"
    source_type: "scientific_library"
    detail: "Bash: pymatgen python script"

  # Python + phonopy → scientific_library
  - pattern: "execute_bash"
    when_args_contains:
      command: "phonopy"
    event_type: "script_execution"
    source_type: "scientific_library"
    detail: "Bash: phonopy script"

  # Python + VESTA / CIF manipulation → scientific_library
  - pattern: "execute_bash"
    when_args_contains:
      command: "vesta"
    event_type: "script_execution"
    source_type: "scientific_library"
    detail: "Bash: VESTA/CIF script"

  # Generic python → script_execution (source unknown until LLM judge)
  - pattern: "execute_bash"
    when_args_contains:
      command: "python"
    event_type: "script_execution"
    source_type: "unknown"
    detail: "Bash: generic python script"

  # Generic bash
  - pattern: "execute_bash"
    event_type: "script_execution"
    source_type: "bash_script"
    detail: "Bash command execution"

  # -------------------------------------------------------------------------
  # File editing (str_replace_editor / write_file)
  # -------------------------------------------------------------------------
  - pattern: "str_replace_editor"
    event_type: "file_editing"
    source_type: "model_only"
    detail: "File view/create/edit via str_replace_editor"

  - pattern: "write_file"
    event_type: "file_editing"
    source_type: "model_only"
    detail: "File write"

  # -------------------------------------------------------------------------
  # Finish tool (terminal action — not an evidence event, skip)
  # No rule here intentionally; 'finish' will appear in tool_calls only.
  # -------------------------------------------------------------------------
