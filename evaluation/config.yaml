# MATTER evaluation module standalone config

modes: ["direct", "planner"]
k: 1
question_bank_dir: "evaluation/question_bank"
output_dir: "runs/mat_master_eval"
run_label: "matter_eval"
use_seed_prompt: true
max_workers: 1
random_seed: 7

# Mat Master runtime config used by evaluator runner
mat_config_path: "configs/mat_master/config.yaml"

# Axis weights for weighted evaluation (v5+)
# These control the relative importance of correctness, grounding, and efficiency.
# Will be normalized during aggregation, so only relative ratios matter.
# Default: equal weight (1.0 each) for all axes.
axis_weights:
  correctness: 1.0
  grounding: 1.0
  efficiency: 1.0

# Optional simulator/evaluator LLM configs.
# If omitted, simulator uses seed prompt directly and evaluator uses deterministic fallback.
#
# simulator_llm:
#   provider: "openai"
#   model: "gpt-4o-mini"
#   api_key: "${YOUR_API_KEY}"
#   base_url: null
#   temperature: 0.3
#   max_tokens: 1024
#   timeout: 120

evaluator_llm:
  provider: "openai"
  model: "claude-opus-4-6"
  api_key: "${LITELLM_PROXY_API_KEY}"
  base_url: "${LITELLM_PROXY_API_BASE}"
  temperature: 0.0
  max_tokens: 2048
  timeout: 180
