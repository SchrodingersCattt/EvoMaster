# 供 tests/test_evomaster_config_migration.py 使用的多 Agent 配置夹具（非运行用 playground）
llm:
  openai:
    provider: "openai"
    model: "gpt-4"
    api_key: "YOUR_OPENAI_API_KEY"
    temperature: 0.7
  default: "openai"

agents:
  planning:
    llm: "openai"
    max_turns: 10
    tools:
      builtin: []
      mcp: ""
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: "prompts/planning_system_prompt.txt"
    user_prompt_file: "prompts/planning_user_prompt.txt"

  coding:
    llm: "openai"
    max_turns: 50
    tools:
      builtin: ["*"]
      mcp: ""
    context:
      max_tokens: 128000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 5
    system_prompt_file: "prompts/coding_system_prompt.txt"
    user_prompt_file: "prompts/coding_user_prompt.txt"

mcp:
  enabled: false
  config_file: "mcp_config.json"

env:
  cluster:
    debug_pool:
      type: "cpu"
      max_concurrent: 1
    train_pool:
      type: "cpu"
      max_concurrent: 1
  docker:
    base_image: "python:3.11-slim"
    registry: "docker.io"
    pull_policy: "if_not_present"
  scheduler:
    type: "local"
    queue_timeout: 300
    retry_failed: false
    max_retries: 1

session:
  type: "local"
  local:
    working_dir: "./workspace"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

llm_output:
  show_in_console: false
  log_to_file: false

project_root: "."
workspace: "./workspace"
results_dir: "./results"
debug: false
